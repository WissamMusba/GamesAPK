<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="630" height="285">
  <title>Deadwood Siege — Walls + Door v2 (flat, highlight removed)</title>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- straight wall segment: flat beige, no top strip -->
    <rect x="20" y="60" width="130" height="22" rx="4" fill="#E4D6B8" stroke="#333B4F" stroke-width="4"/>
    <text x="85" y="115" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#2A332A" text-anchor="middle">WALL</text>

    <!-- corner -->
    <rect x="180" y="20" width="22" height="62" rx="4" fill="#E4D6B8" stroke="#333B4F" stroke-width="4"/>
    <rect x="180" y="60" width="90" height="22" rx="4" fill="#E4D6B8" stroke="#333B4F" stroke-width="4"/>
    <rect x="180" y="60" width="22" height="22" fill="#D8C9A6" stroke="none"/>
    <text x="225" y="115" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#2A332A" text-anchor="middle">CORNER</text>

    <!-- door: flat wood, plank grooves only -->
    <rect x="300" y="60" width="100" height="22" rx="4" fill="#8A6B4F" stroke="#333B4F" stroke-width="4"/>
    <line x1="324" y1="62" x2="324" y2="80" stroke="#333B4F" stroke-width="3"/>
    <line x1="350" y1="62" x2="350" y2="80" stroke="#333B4F" stroke-width="3"/>
    <line x1="376" y1="62" x2="376" y2="80" stroke="#333B4F" stroke-width="3"/>
    <!-- keyhole marker: only-you-can-pass -->
    <circle cx="350" cy="71" r="5" fill="#E6C25A" stroke="#333B4F" stroke-width="2.5"/>
    <text x="350" y="115" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#2A332A" text-anchor="middle">DOOR (YOU ONLY)</text>

    <text x="210" y="160" font-family="monospace" font-size="13" fill="#2A332A" text-anchor="middle">doors: costlier + weaker · zombies CANNOT pass · you + co-op partner CAN</text>
  </g>
</svg>
