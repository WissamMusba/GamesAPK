<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <title>Deadwood Siege — Phase 0 art demo sheet</title>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 H0 V64" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- grass + faint grid -->
  <rect x="0" y="0" width="880" height="520" fill="#7A9B67"/>
  <rect x="0" y="0" width="880" height="520" fill="url(#grid)"/>

  <!-- title -->
  <text x="24" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">DEADWOOD SIEGE — PHASE 0 ART DEMO</text>
  <text x="24" y="62" font-family="sans-serif" font-size="13" fill="#2A332A">4px outlines · rounded joins · top-left inner shade · zero gradients</text>

  <!-- HUD chips top-right -->
  <g font-family="monospace" font-size="16" fill="#FFFFFF">
    <rect x="724" y="16" width="132" height="36" rx="8" fill="rgba(30,38,30,0.72)"/>
    <rect x="736" y="26" width="16" height="16" fill="#8A6B4F" stroke="#FFFFFF" stroke-width="2"/>
    <text x="760" y="40">120</text>
    <rect x="724" y="60" width="132" height="36" rx="8" fill="rgba(30,38,30,0.72)"/>
    <polygon points="744,88 752,74 760,88" fill="#8B8FA8" stroke="#FFFFFF" stroke-width="2"/>
    <text x="760" y="84">85</text>
    <rect x="724" y="104" width="132" height="36" rx="8" fill="rgba(30,38,30,0.72)"/>
    <circle cx="744" cy="122" r="8" fill="#A63A50" stroke="#FFFFFF" stroke-width="2"/>
    <text x="760" y="128">40</text>
  </g>

  <!-- ground shadows -->
  <g fill="rgba(0,0,0,0.15)">
    <ellipse cx="120" cy="392" rx="40" ry="10"/>
    <ellipse cx="300" cy="392" rx="44" ry="10"/>
    <ellipse cx="470" cy="392" rx="46" ry="10"/>
    <ellipse cx="630" cy="392" rx="42" ry="10"/>
    <ellipse cx="780" cy="392" rx="42" ry="10"/>
  </g>

  <g stroke-linejoin="round" stroke-linecap="round" text-anchor="middle">
    <!-- PLAYER -->
    <g transform="translate(120,330)">
      <line x1="26" y1="22" x2="58" y2="-18" stroke="#333B4F" stroke-width="13"/>
      <line x1="26" y1="22" x2="58" y2="-18" stroke="#8A6B4F" stroke-width="7"/>
      <polygon points="46,-38 70,-24 61,-4 39,-19" fill="#8B8FA8" stroke="#333B4F" stroke-width="4"/>
      <polygon points="49,-31 62,-24 57,-13 46,-21" fill="#A6AAC2" stroke="none"/>
      <circle cx="0" cy="0" r="26" fill="#7A5C4E" stroke="#333B4F" stroke-width="4"/>
      <circle cx="-8" cy="-8" r="15" fill="#8F6F60" stroke="none"/>
      <circle cx="-7" cy="0" r="6" fill="#FFFFFF" stroke="#333B4F" stroke-width="3"/>
      <circle cx="10" cy="0" r="6" fill="#FFFFFF" stroke="#333B4F" stroke-width="3"/>
      <circle cx="-6" cy="1" r="2.6" fill="#333B4F" stroke="none"/>
      <circle cx="11" cy="1" r="2.6" fill="#333B4F" stroke="none"/>
    </g>
    <text x="120" y="420" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#2A332A">PLAYER</text>

    <!-- TREE: 10-point star -->
    <g transform="translate(300,320)">
      <rect x="-6" y="12" width="12" height="24" fill="#7A5C4E" stroke="#333B4F" stroke-width="4"/>
      <polygon points="0,-34 9.4,-12.9 32.3,-10.5 15.2,4.9 20,27.5 0,16 -20,27.5 -15.2,4.9 -32.3,-10.5 -9.4,-12.9"
               fill="#6E8F5A" stroke="#333B4F" stroke-width="4"/>
      <polygon points="-4,-23.7 1.2,-12.1 13.8,-10.8 4.4,-2.3 7,10.1 -4,3.8 -15,10.1 -12.4,-2.3 -21.8,-10.8 -9.2,-12.1"
               fill="#85A86C" stroke="none"/>
    </g>
    <text x="300" y="420" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#2A332A">STAR-TREE</text>

    <!-- BERRY BUSH: 6-lobe blob -->
    <g transform="translate(470,330)">
      <g fill="#5F7F4E" stroke="#333B4F" stroke-width="4">
        <circle cx="17" cy="0" r="15"/><circle cx="8.5" cy="14.7" r="15"/><circle cx="-8.5" cy="14.7" r="15"/>
        <circle cx="-17" cy="0" r="15"/><circle cx="-8.5" cy="-14.7" r="15"/><circle cx="8.5" cy="-14.7" r="15"/>
        <circle cx="0" cy="0" r="18"/>
      </g>
      <g fill="#5F7F4E" stroke="none">
        <circle cx="17" cy="0" r="11"/><circle cx="8.5" cy="14.7" r="11"/><circle cx="-8.5" cy="14.7" r="11"/>
        <circle cx="-17" cy="0" r="11"/><circle cx="-8.5" cy="-14.7" r="11"/><circle cx="8.5" cy="-14.7" r="11"/>
        <circle cx="0" cy="0" r="14"/>
      </g>
      <circle cx="-10" cy="-11" r="12" fill="#6E8F5A" stroke="none"/>
      <g fill="#A63A50" stroke="#333B4F" stroke-width="3">
        <circle cx="-13" cy="3" r="6.5"/><circle cx="11" cy="-7" r="6.5"/>
        <circle cx="2" cy="13" r="6.5"/><circle cx="-1" cy="-15" r="6.5"/>
      </g>
    </g>
    <text x="470" y="420" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#2A332A">BERRY BUSH</text>

    <!-- ROCK: hexagon -->
    <g transform="translate(630,330)">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="#8B8FA8" stroke="#333B4F" stroke-width="4"/>
      <polygon points="-5,-23 9.7,-14.5 9.7,2.5 -5,11 -19.7,2.5 -19.7,-14.5"
               fill="#A6AAC2" stroke="none"/>
    </g>
    <text x="630" y="420" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#2A332A">ROCK</text>

    <!-- ZOMBIE SHAMBLER -->
    <g transform="translate(780,330)">
      <circle cx="-52" cy="12" r="11" fill="#9FB086" stroke="#333B4F" stroke-width="4"/>
      <circle cx="52" cy="12" r="11" fill="#9FB086" stroke="#333B4F" stroke-width="4"/>
      <circle cx="0" cy="0" r="28" fill="#9FB086" stroke="#333B4F" stroke-width="4"/>
      <circle cx="-9" cy="-9" r="17" fill="#B8C8A6" stroke="none"/>
      <circle cx="-9" cy="-4" r="3.6" fill="#A63A50" stroke="none"/>
      <circle cx="9" cy="-4" r="3.6" fill="#A63A50" stroke="none"/>
      <path d="M-10,16 Q0,24 10,16" fill="none" stroke="#333B4F" stroke-width="3"/>
    </g>
    <text x="780" y="420" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#2A332A">SHAMBLER</text>
  </g>
</svg>
