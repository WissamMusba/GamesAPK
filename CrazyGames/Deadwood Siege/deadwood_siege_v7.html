const buildBtns = [];

function refreshBuildMenu(){
  el.bmList.innerHTML = '';
  buildBtns.length = 0;
  BUILD.forEach((def, i) => {
    const locked = player.level < def.unlockLv;
    const afford = Object.keys(def.cost).every(k => player[k] >= def.cost[k]);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'b-btn' + (locked ? ' locked' : (afford ? ' afford' : ''));
    btn.dataset.idx = i;
    const [fw, fh] = footprint(def, 0);
    let costStr = locked ? `🔒 LV ${def.unlockLv}` : formatCost(def.cost);
    btn.innerHTML =
      `<span class="key">${def.hotkey}</span>` +
      `<span class="ico">${def.icon}</span>` +
      `<div class="info">` +
        `<div class="nm">${def.name}</div>` +
        `<div class="row2"><span class="sz">${fw}×${fh}</span>` +
        `<span class="cost">${costStr}</span></div>` +
      `</div>`;
    if(!locked){
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        Sound.init();
        buildSel = (buildSel === i) ? -1 : i;
        buildRot = 0; selectedStruct = null;
        updateBuildSel();
      });
    }
    el.bmList.appendChild(btn);
    buildBtns.push(btn);
  });
}
function updateBuildSel(){
  buildBtns.forEach((btn, i) => btn.classList.toggle('selected', buildSel === i));
  updateSelectedInfo();
}
function updateSelectedInfo(){
  if(!selectedStruct){ el.selInfo.classList.remove('on'); return; }
  const s = selectedStruct;
  const def = defOf(s.type);
  const up = upgradeCost(s);
  let upStr;
  if(!up) upStr = '<div class="up max">MAX TIER</div>';
  else {
    const can = canUpgrade(s);
    upStr = `<div class="up ${can?'':'no'}">[U] Upgrade T${s.tier+2} → ${formatCost(up)}</div>`;
  }
  el.selInfo.innerHTML =
    `<div class="nm">${esc(def.name)} · T${s.tier+1}</div>` +
    `<div class="hp">HP ${Math.ceil(s.hp)} / ${s.maxHp}</div>` +
    upStr;
  el.selInfo.classList.add('on');
}
function formatCost(cost){
  let out = '';
  if(cost.wood)  out += cost.wood + 'W';
  if(cost.stone) out += (out?' ':'') + cost.stone + 'S';
  if(cost.food)  out += (out?' ':'') + cost.food + 'F';
  return out;
}
function updateHUD(){
  el.vWood.textContent  = Math.floor(player.wood);
  el.vStone.textContent = Math.floor(player.stone);
  el.vFood.textContent  = Math.floor(player.food);
  const nextXp = xpToNext(player.level);
  el.lvlNum.textContent = 'LEVEL ' + player.level;
  el.xpNum.textContent = Math.floor(player.xp) + ' / ' + nextXp + ' XP';
  el.xpFill.style.width = (100 * Math.min(1, player.xp/nextXp)) + '%';
  el.scoreNum.textContent = 'SCORE ' + score;
  if(combo >= 2){
    el.comboNum.textContent = '×' + combo + ' COMBO';
    el.comboNum.style.color = combo >= 10 ? '#e6c25a' : '#86b06c';
  } else el.comboNum.textContent = '';
  el.wNum.textContent = 'WAVE ' + wave;
  let sub;
  if(waveState === 'prep')           sub = 'NEXT WAVE IN ' + Math.ceil(waveTimer) + 's';
  else if(waveState === 'breather')  sub = 'BREATHER ' + Math.ceil(waveTimer) + 's';
  else sub = 'ENEMIES ' + zombies.length;
  el.wSub.textContent = sub;
  el.wMod.textContent = activeMods.map(m=>m.name).join(' · ');
  const hpPct = 100 * Math.max(0, player.hp/player.maxHp);
  el.hpFill.style.width = hpPct + '%';
  el.hpVal.textContent = Math.ceil(player.hp) + ' / ' + player.maxHp;
  const enPct = 100 * Math.max(0, player.energy/player.maxEnergy);
  el.enFill.style.width = enPct + '%';
  el.enVal.textContent = Math.ceil(player.energy);
  el.vCry.textContent = crystals;
  /* lock indicator */
  const showLock = lockCursor || lockAttack;
  el.lockInd.classList.toggle('on', showLock);
  el.tagCursor.classList.toggle('on', lockCursor);
  el.tagAttack.classList.toggle('on', lockAttack);
  /* hint */
  if(buildSel >= 0){
    el.hint.textContent = 'Left click to place · R to rotate · Right click / Esc to cancel';
  } else if(selectedStruct){
    el.hint.textContent = 'U to upgrade · Right click to deselect';
  } else {
    const locks = [];
    if(lockCursor) locks.push('🔒 Cursor');
    if(lockAttack) locks.push('⚔ Auto');
    if(locks.length) el.hint.textContent = locks.join(' · ') + ' active · Press X/C to toggle';
    else el.hint.textContent = 'Press B for build menu · X cursor-lock · C attack-lock';
  }
  /* boss bar */
  let boss = null;
  for(const z of zombies) if(z.type==='warlord'){ boss = z; break; }
  if(boss){
    el.bossBar.classList.add('on');
    el.bossName.textContent = 'WARLORD';
    el.bossFill.style.width = (100 * Math.max(0, boss.hp/boss.maxHp)) + '%';
  } else el.bossBar.classList.remove('on');
  /* kill feed */
  renderKillFeed();
  /* achievements */
  updateAchievementToast();
}
function renderKillFeed(){
  /* rebuild feed */
  el.killFeed.innerHTML = '';
  for(const k of killFeed){
    const alpha = Math.min(1, (k.dur - k.t) / 0.5);
    const d = document.createElement('div');
    d.className = 'kf ' + k.cls;
    d.style.opacity = alpha;
    d.textContent = k.text;
    el.killFeed.appendChild(d);
  }
}
function showComboDisplay(){
  el.comboDisp.textContent = '×' + combo;
  el.comboDisp.classList.add('on');
}
function hideComboDisplay(){ el.comboDisp.classList.remove('on'); }
let achTimer = 0;
function updateAchievementToast(){
  if(currentToast){ achTimer -= 1/60; if(achTimer <= 0){ el.achToast.classList.remove('on'); currentToast = null; } }
  if(!currentToast && achievementQueue.length > 0){
    const id = achievementQueue.shift();
    const a = ACH[id];
    if(!a) return;
    currentToast = id;
    achTimer = 3.2;
    el.achIc.textContent = a.ic;
    el.achTi.textContent = a.ti;
    el.achSb.textContent = a.sb;
    el.achToast.classList.add('on');
    Sound.upgrade();
  }
}

  mouse.down = false;
  for(const k in keys) keys[k] = false;
});

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  Sound.init();
  if(k === 'escape'){ buildSel = -1; selectedStruct = null; updateBuildSel(); updateSelectedInfo(); }
  if(state === 'play'){
    /* NEW: X = cursor lock */
    if(k === 'x'){
      lockCursor = !lockCursor;
      if(lockCursor) lockedAngle = player.angle;
      Sound.lock();
      pushKillFeed(lockCursor ? '🔒 CURSOR LOCK' : '🔓 CURSOR UNLOCKED', 'violet');
    }
    /* NEW: C = attack lock */
    if(k === 'c'){
      lockAttack = !lockAttack;
      Sound.lock();
      pushKillFeed(lockAttack ? '⚔ ATTACK LOCK' : '⚔ ATTACK UNLOCKED', 'gold');
    }
    const hot = BUILD.findIndex(d => d.hotkey === k);
    if(hot >= 0){
      const def = BUILD[hot];
      if(player.level >= def.unlockLv){
        buildSel = (buildSel === hot) ? -1 : hot;
        buildRot = 0; selectedStruct = null;
        updateBuildSel();
      } else {
        floatText(player.x, player.y-40, 'LOCKED · LV '+def.unlockLv, '#c96f4a');
      }
    }
    if(k === 'r'){
      if(buildSel >= 0) buildRot = buildRot ? 0 : 1;
      else if(selectedStruct){
        const s = selectedStruct;
        const def = defOf(s.type);
        const newRot = s.rot ? 0 : 1;
        const [fw, fh] = footprint(def, newRot);
        let ok = true;
        for(let ax=0; ax<fw && ok; ax++){
          for(let ay=0; ay<fh; ay++){
            const key = cellKey(s.cx+ax, s.cy+ay);
            const ex = structCells.get(key);
            if(ex && ex !== s){ ok = false; break; }
          }
        }
        if(ok && (s.cx+fw)*GRID <= MAP && (s.cy+fh)*GRID <= MAP){
          const [ofw, ofh] = structFootprint(s);
          for(let ax=0; ax<ofw; ax++)
            for(let ay=0; ay<ofh; ay++)
              structCells.delete(cellKey(s.cx+ax, s.cy+ay));
          s.rot = newRot; s.fw = fw; s.fh = fh;
          for(let ax=0; ax<fw; ax++)
            for(let ay=0; ay<fh; ay++)
              structCells.set(cellKey(s.cx+ax, s.cy+ay), s);
        } else floatText(s.x+s.fw*GRID/2, s.y-14, 'NO ROOM', '#c96f4a');
      }
    }
    if(k === 'u' && selectedStruct){
      if(!upgradeStruct(selectedStruct)) floatText(player.x, player.y-40, 'NOT ENOUGH', '#c96f4a');
      updateSelectedInfo();
    }
    if(k === 'e'){
      if(player.food >= 10 && player.hp < player.maxHp){
        player.food -= 10;
        player.hp = Math.min(player.maxHp, player.hp + 40);
        player.energy = player.maxEnergy;
        addDamageNumber(player.x, player.y-40, '+40 HP', '#86b06c', 16);
        Sound.eat();
      } else if(player.food >= 5 && player.energy < player.maxEnergy*0.5){
        player.food -= 5;
        player.energy = player.maxEnergy;
        addDamageNumber(player.x, player.y-40, '+ENERGY', '#d9a441', 14);
        Sound.eat();
      }
    }
    if(k === 't') tryRewind();
    if(k === 'b') toggleBuildMenu();
    if(k === 'p'){ state = 'paused'; showPause(); }
  } else if(state === 'paused' && k === 'p'){
    state = 'play'; screens.classList.add('hide');
  }
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ',
      '1','2','3','4','5','6','7','8','x','c'].includes(k)) e.preventDefault();
});

    const d = new Date();

  } else if(mode === 'quick'){
    seed = (Math.random()*1e6)|0;

}
function die(){
  state = 'dead';
  saveBest(wave);
  stats.totalScore += score;
  stats.runs++;
  saveStats();
  screens.classList.remove('hide');
  card.innerHTML =
    '<h1>THE <span>HORDE</span> WINS</h1>' +
    '<div class="big">WAVE ' + wave + '</div>' +
    '<div class="stat-grid">' +
      '<div>SCORE<b>' + score + '</b></div>' +
      '<div>KILLS<b>' + kills + '</b></div>' +
      '<div>LEVEL<b>' + player.level + '</b></div>' +
      '<div>BEST COMBO<b>×' + stats.bestCombo + '</b></div>' +
      '<div>CRYSTALS<b>' + crystals + '</b></div>' +
      '<div>ACHIEVEMENTS<b>' + achievements.size + '/' + Object.keys(ACH).length + '</b></div>' +
    '</div>' +
    '<div class="stat">Seed ' + seed + ' · ' + (stats.runs) + ' runs played</div>' +
    '<button class="btn" id="btnRetry">TRY AGAIN</button>' +
    '<button class="btn sec" id="btnMenu2">MENU</button>';
  document.getElementById('btnRetry').onclick = startPlay;
  document.getElementById('btnMenu2').onclick = showMenu;
}

/* ============================================================
   LOOP
   ============================================================ */
let last = performance.now();
let uiAcc = 0;
function loop(t){
  const dt = Math.min((t-last)/1000, 0.05);
  last = t;
  update(dt);
  render();
  uiAcc += dt;
  if(uiAcc > 0.08 && state === 'play'){
    uiAcc = 0;
    updateHUD();
    refreshBuildMenu();
    buildBtns.forEach((btn, i) => btn.classList.toggle('selected', buildSel === i));
    if(selectedStruct) updateSelectedInfo();
  } else if(state !== 'play'){
    /* still update achievement toast in menus */
    updateAchievementToast();
  }
  requestAnimationFrame(loop);
}

loadStats();
resetGame();
refreshBuildMenu();
showMenu();
requestAnimationFrame(loop);

})();
</script>
