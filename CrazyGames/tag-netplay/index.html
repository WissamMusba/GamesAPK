      const colName = (PALETTE[curCol % PALETTE.length] || PALETTE[0]).name;
      ptxt('‹  🎨 ' + colName + '  ›', cx, teamY + teamH/2 + 1, FN(12, 900), '#ffffff');
      zone(cx - btnW/2, teamY, btnW * 0.45, teamH, { fn: () => {
        if(NET.isHost){ cycleSlot(mySlot, -1); netBroadcastSettings(); netBroadcastRoster(); }
        else netCycleMyColor(-1);
      }});
      zone(cx + btnW * 0.05, teamY, btnW * 0.45, teamH, { fn: () => {
        if(NET.isHost){ cycleSlot(mySlot, 1); netBroadcastSettings(); netBroadcastRoster(); }
        else netCycleMyColor(1);
      }});
    }

    // Control Scheme row
    rr(g, cx - btnW/2, ctrlY, btnW, ctrlH, 6);
    g.fillStyle = 'rgba(0,0,0,0.65)'; g.fill();
    g.lineWidth = 1.8; g.strokeStyle = '#ffffff'; g.stroke();
    const ctrlName = NET.myCtrl || 'WASD';
    const ctrlIcon = (ctrlName === 'Controller') ? '🕹️' : (ctrlName === 'Arrows' ? '⬆️' : '🎮');
    ptxt(ctrlIcon + ' ' + ctrlName + '  ▾', cx, ctrlY + ctrlH/2 + 1, FN(12, 900), '#ffffff');
    zone(cx - btnW/2, ctrlY, btnW, ctrlH, { fn: () => netCycleMyControl() });

    // Dedicated Big Ready Button
    const isMeRdy = !!NET.slotsReady[mySlot];
    rr(g, cx - btnW/2, rdyY, btnW, rdyH, 8);
    g.fillStyle = isMeRdy ? '#27ae60' : '#e67e22'; g.fill();
    g.lineWidth = 2; g.strokeStyle = isMeRdy ? '#2ecc71' : '#ffffff'; g.stroke();
    ptxt(isMeRdy ? '✔ I\'M READY (CLICK TO UNREADY)' : 'CLICK TO READY', cx, rdyY + rdyH/2 + 1, FN(13, 900), '#ffffff');
    zone(cx - btnW/2, rdyY, btnW, rdyH, { fn: () => netToggleMyReady() });

    maxCardBottom = cardY + cardH;

    // 3. Settings & Host Start rows anchored below
    const availableBelow = Math.max(110, CH - maxCardBottom - footerH);
    const rowCount = 4; // MAP, TIMER, RULES, START
    const step = clamp(availableBelow / (rowCount + 0.6), 24, 44);
    const totalSpan = (rowCount - 1) * step;
    const ry0 = Math.floor(maxCardBottom + Math.max(12, (availableBelow - totalSpan) * 0.38));
    const baseFs = clamp(step * 0.42, 11, 18);
    const centerX = Math.floor(mainX0 + mainW/2);

    for(let i = 1; i <= 4; i++){
      const y = ry0 + (i - 1) * step;
      const hl = (menu.mode === 'rows' && menu.row === i);
      const sc = hl ? 1.06 : 1;
      g.save();
      g.translate(centerX, y); g.scale(sc, sc);

      let s = '';
      let rowCol = hl ? '#ffffff' : '#c8d8e8';

      if(i === 1){
        s = NET.isHost
          ? ('MAP:  ‹  ' + (settings.map + 1) + '. ' + MAPS[settings.map].name + '  ›')
          : ('MAP: ' + (settings.map + 1) + '. ' + MAPS[settings.map].name + ' (HOST CHOICE)');
      } else if(i === 2){
        s = NET.isHost
          ? ('TIMER:  ‹  ' + settings.time + 's  ›')
          : ('TIMER: ' + settings.time + 's');
      } else if(i === 3){
        s = NET.isHost
          ? ('‹  ' + RULE_NAMES[menu.rule] + ': ' + (ruleValue() ? 'ON' : 'OFF') + '  ›')
          : (RULE_NAMES[menu.rule] + ': ' + (ruleValue() ? 'ON' : 'OFF'));
      } else if(i === 4){
        if(NET.isHost){
          if(act.length < 2){
            s = isNarrowW ? 'WAITING FOR PLAYERS (SHARE LINK)' : 'WAITING FOR PLAYERS TO JOIN (CLICK TO COPY LINK)';
            rowCol = '#8899aa';
          } else if(allReady){
            s = '▶ START MATCH (ALL READY!)';
            rowCol = '#00ff88';
          } else {
            s = 'WAITING FOR ALL READY (' + readyCount + '/' + act.length + ')';
            rowCol = '#f39c12';
          }
        } else {
          if(allReady){
            s = 'ALL READY! WAITING FOR HOST TO START…';
            rowCol = '#2ecc71';
          } else {
            s = isMeRdy
              ? ('WAITING FOR OTHER PLAYERS (' + readyCount + '/' + act.length + ' READY)')
              : ('CLICK READY ON YOUR CARD (' + readyCount + '/' + act.length + ' READY)');
            rowCol = '#f39c12';
          }
        }
      }

      if(i === 4 && NET.isHost && allReady){
        // Glowing start button badge
        rr(g, -170, -step * 0.42, 340, step * 0.84, 8);
        g.fillStyle = 'rgba(46, 204, 113, 0.95)'; g.fill();
        g.lineWidth = 2; g.strokeStyle = '#ffffff'; g.stroke();
        ptxt(s, 0, 1, FT(baseFs + 2), '#ffffff');
      } else {
        ptxt(s, 0, 0, i === 4 ? FT(baseFs + 2) : FN(baseFs, 900), rowCol);
      }
      g.restore();

      const tw2 = Math.min(mainW * 0.9, 520);
      zone(centerX - tw2/2, y - step * 0.45, tw2, step * 0.9, { fn: () => {
        if(i < 4){
          if(!NET.isHost){ toast('HOST CONTROLS MAP & RULES'); sfx('back'); return; }
          rowEdit(1);
        } else {
          // Row 4: Start Match
          if(!NET.isHost){ toast('WAITING FOR HOST TO START'); return; }
          if(act.length < 2){ netCopyLink(); netToast('Invite link copied! Send it to your friend.'); return; }
          if(!allReady){ toast('WAITING FOR ALL PLAYERS TO HIT READY!'); sfx('back'); return; }
          sfx('go'); startMatch();
        }
      }});
    }

  } else {
    /* ======================================================================
       OFFLINE LOCAL MODE: 4 PLAYER CARDS + LOCAL TEAMS SUPPORT
       ====================================================================== */
    const rects = slotCardRects();
    for(let i = 0; i < 4; i++){
      const r = rects[i];
      const col = getSlotColor(i, menu.slotColor, menu.slotTeam);
      const isAct = menu.slotColor[i] >= 0;

      rr(g, r.x-4, r.y-4, r.w+8, r.h+8, 12);
      g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 3.5; g.strokeStyle = INK; g.stroke();
      rr(g, r.x, r.y, r.w, r.h, 8);
      g.fillStyle = isAct ? col : '#25303f';
      g.fill();
      g.lineWidth = 2.5; g.strokeStyle = isAct ? INK : 'rgba(255,255,255,0.25)'; g.stroke();

      const cx = r.x + r.w/2, cy = r.y + r.h/2;
      const glyphR = clamp(Math.min(r.w * 0.18, r.h * 0.22), 12, 26);

      if(isAct){
        const isPad = !!PAD[i];
        const label = isPad ? '⦾ PAD' : SLOTS[i].label;
        g.save(); g.globalAlpha = 0.62;
        padGlyph(cx, cy - glyphR * 0.7, glyphR, true);
        g.restore();
        ptxt(label, cx, cy + glyphR * 0.8, FN(Math.min(14, r.w * 0.10), 900), '#ffffff');

        if(settings.teams){
          const tm = (menu.slotTeam && menu.slotTeam[i] != null) ? menu.slotTeam[i] : (i % 2);
          const tmDef = TEAMS[tm] || TEAMS[0];
          txt('‹ ' + tmDef.icon + ' ' + tmDef.name.slice(0,4) + ' ›', cx, r.y + r.h - Math.max(10, r.h * 0.14), FN(Math.min(14, r.w * 0.10), 900), '#ffffff');
        } else {
          txt('◀   ▶', cx, r.y + r.h - Math.max(10, r.h * 0.14), FN(Math.min(16, r.w * 0.12), 900), 'rgba(255,255,255,0.85)');
        }
      } else {
        ptxt(SLOTS[i].label, cx, cy - 4, FN(Math.min(20, r.w * 0.14), 900), '#cfe9c9');
        txt('◀   ▶', cx, r.y + r.h - Math.max(10, r.h * 0.14), FN(Math.min(16, r.w * 0.12), 900), 'rgba(255,255,255,0.7)');
      }

      zone(r.x-4, r.y-4, r.w*0.4+4, r.h+8, { fn: () => {
        if(settings.teams && isAct) cycleTeam(i, -1);
        else cycleSlot(i, -1);
      }});
      zone(r.x+r.w*0.6, r.y-4, r.w*0.4+4, r.h+8, { fn: () => {
        if(settings.teams && isAct) cycleTeam(i, 1);
        else cycleSlot(i, 1);
      }});
    }

    for(let i=0; i<rects.length; i++){
      if(rects[i].y + rects[i].h > maxCardBottom) maxCardBottom = rects[i].y + rects[i].h;
    }

    const footerH = Math.max(22, Math.floor(CH * 0.045));
    const availableBelow = Math.max(120, CH - maxCardBottom - footerH);
    const rowCount = ROWS.length;
    const step = clamp(availableBelow / (rowCount + 0.65), 24, 48);
    const totalRowsSpan = (rowCount - 1) * step;
    const ry0 = Math.floor(maxCardBottom + Math.max(14, (availableBelow - totalRowsSpan) * 0.42));
    const baseFs = clamp(step * 0.42, 11, 20);

    for(let i=0; i<ROWS.length; i++){
      const y = ry0 + i * step;
      const hl = (menu.mode === 'rows' && menu.row === i);
      const sc = hl ? 1.08 : 1;
      g.save();
      g.translate(CW/2, y); g.scale(sc, sc);
      let s = '';
      let rowCol = hl ? '#ffffff' : '#c8d8e8';

      if(i === 0) s = 'CHANGE PLAYERS  ' + activeSlots().length + 'P';
      else if(i === 1) s = 'MAP:  ‹  ' + (settings.map + 1) + '. ' + MAPS[settings.map].name + '  ›';
      else if(i === 2) s = 'TIMER:  ‹  ' + settings.time + 's  ›';
      else if(i === 3) s = '‹  ' + RULE_NAMES[menu.rule] + ': ' + (ruleValue() ? 'ON' : 'OFF') + '  ›';
      else {
        s = (activeSlots().length < 2)
          ? (isNarrowW ? 'START (MIN 2 PLAYERS)' : 'START MATCH (MIN 2 PLAYERS)')
          : 'START MATCH';
        rowCol = hl ? (activeSlots().length < 2 ? '#ff7777' : '#ffffff') : (activeSlots().length < 2 ? '#884444' : '#c8d8e8');
      }
      ptxt(s, 0, 0, i === 4 ? FT(baseFs + 2) : FN(baseFs, 900), rowCol);
      g.restore();

      const tw2 = Math.min(CW * 0.86, 560);
      zone(CW/2 - tw2/2, y - step * 0.45, tw2, step * 0.9, { fn: () => {
        if(menu.mode === 'slots') return;
        if(i === 0){ menu.mode = 'slots'; sfx('ok'); }
        else if(i === 4){
          if(activeSlots().length < 2){ menu.mode = 'slots'; menu.row = 0; toast('CHOOSE AT LEAST 2 PLAYERS!'); sfx('back'); }
          else { sfx('go'); startMatch(); }
        }
        else if(menu.row === i) rowEdit(1);
        else { menu.row = i; sfx('ui'); }
      }});
    }

    if(menu.mode === 'rows'){
      const chevDist = Math.min(CW * 0.44, Math.max(120, CW * 0.30));
      const chevSz = Math.min(30, Math.floor(step * 0.85));
      ptxt('‹', CW/2 - chevDist, ry0 + menu.row * step, FT(chevSz), '#ffffff');
      ptxt('›', CW/2 + chevDist, ry0 + menu.row * step, FT(chevSz), '#ffffff');
      zone(CW/2 - chevDist - 24, ry0 + menu.row * step - step * 0.45, 48, step * 0.9, { fn: () => rowEdit(-1) });
      zone(CW/2 + chevDist - 24, ry0 + menu.row * step - step * 0.45, 48, step * 0.9, { fn: () => rowEdit(1) });
    }
  }

  // Footer instructions (responsive to touch & screen width)
  const footerY = Math.max(CH - 18, ry0 + (ROWS.length - 1) * step + step * 0.7);
  const footerTxt = isTouch
    ? 'TAP CARDS TO CUSTOMIZE  •  TAP ROWS TO CHANGE SETTINGS'
    : (menu.mode === 'slots'
      ? 'P1-4: W/A/S/D cycles colour  •  P1 WASD  •  P2 Arrows  •  P3 IJKL/PAD  •  ENTER CONTINUE'
      : 'UP/DN SELECT   L/R CHANGE   ENTER OK   •   1-0 MAP, B THEME');
  ptxt(footerTxt, CW/2, footerY, FN(clamp(CW * 0.022, 9.5, 12.5), 800), 'rgba(255,255,255,0.55)');

  // Toast message
  if(menu.toastT > 0 && menu.toast){
    const a = clamp(menu.toastT, 0, 1);
    g.save(); g.globalAlpha = a;
    g.font = FN(15, 900);
    const w4 = g.measureText(menu.toast).width + 44;
    pill(CW/2 - w4/2, CH * 0.44, w4, 38, 'rgba(30,30,30,0.88)', '#ffffff');
    txt(menu.toast, CW/2, CH * 0.44 + 20, FN(14, 900), '#ffffff');
    g.restore();
  }
}

/* ================= HUD / pause / result ================= */
function tri(x,y,r,dir){
  g.beginPath();
  if(dir===0){g.moveTo(x+r*0.45,y-r*0.55);g.lineTo(x+r*0.45,y+r*0.55);g.lineTo(x-r*0.55,y);}
  else if(dir===1){g.moveTo(x-r*0.45,y-r*0.55);g.lineTo(x-r*0.45,y+r*0.55);g.lineTo(x+r*0.55,y);}
  else if(dir===2){g.moveTo(x-r*0.55,y+r*0.45);g.lineTo(x+r*0.55,y+r*0.45);g.lineTo(x,y-r*0.55);}
  else{g.moveTo(x-r*0.55,y-r*0.45);g.lineTo(x+r*0.55,y-r*0.45);g.lineTo(x,y+r*0.55);}
  g.closePath();
}
function drawPadBtn(cx,cy,r,dir,o){
  const active=o.hold?keys.has(o.hold):(tGlobal-(glow[o.pk]||-9))<0.15;
  g.beginPath();g.arc(cx,cy,r,0,TAU);
  g.fillStyle=active?'rgba(255,255,255,0.75)':'rgba(15,23,42,0.65)';
  g.fill();
  g.lineWidth=2.5;g.strokeStyle=active?'#ffffff':'rgba(255,255,255,0.45)';g.stroke();
  tri(cx,cy,r*0.55,dir);
  g.fillStyle=active?'#143c26':'#ffffff';
  g.fill();
  zone(cx-r-12,cy-r-12,r*2+24,r*2+24,o);
}

function drawPadBtnAction(cx,cy,r,actionKey,symbol,glowCol,label){
  let active = false;
  if(actionKey === 'left') active = TOUCH.left;
  else if(actionKey === 'right') active = TOUCH.right;
  else if(actionKey === 'jump') active = TOUCH.jumpHeld;
  else if(actionKey === 'down') active = TOUCH.downHeld;
  
  g.save();
  if(active){
    g.beginPath(); g.arc(cx,cy,r+6,0,TAU);
    g.fillStyle=glowCol||'rgba(255,255,255,0.3)';
    g.fill();
  }
  
  // Frosted circular button
  g.beginPath(); g.arc(cx,cy,r,0,TAU);
  g.fillStyle=active?'rgba(255,255,255,0.90)':'rgba(15,23,42,0.68)';
  g.fill();
  g.lineWidth=active?3.5:2.5;
  g.strokeStyle=active?'#ffffff':'rgba(255,255,255,0.45)';
  g.stroke();
  
  // Symbol icon
  g.font=FN(Math.round(r*(label?0.62:0.72)),900);
  g.textAlign='center';
  g.textBaseline='middle';
  g.fillStyle=active?'#0f172a':'#ffffff';
  g.fillText(symbol,cx,cy+(label?-r*0.12:1));
  
  // Optional small label below icon (e.g. JUMP, DROP on tablet)
  if(label && r>=34){
    g.font=FN(Math.max(9,Math.round(r*0.22)),900);
    g.fillStyle=active?'#0f172a':'rgba(255,255,255,0.75)';
    g.fillText(label,cx,cy+r*0.52);
  }
  g.restore();
  
  // Generous touch hitbox
  const padH=16;
  zone(cx-r-padH,cy-r-padH,2*(r+padH),2*(r+padH),{
    touchAction: actionKey
  });
}

function drawTouchButtons(){
  if(!match) return;
  
  const isOnline=(typeof NET!=='undefined' && NET && NET.role!==null);
  const isSplitLocal=(!isOnline && match.players.length===2);
  const isTablet=Math.min(CW,CH)>=550 || (CW/CH<1.7 && Math.min(CW,CH)>=480);
  
  if(!isSplitLocal){
    /* ================= SLEEK SEE-THROUGH JOYSTICKS (ONLINE & SOLO) ================= */
    const r = isTablet ? clamp(CH * 0.058, 24, 32) : clamp(CH * 0.075, 20, 26);
    const bm = isTablet ? clamp(CH * 0.07, 24, 44) : clamp(CH * 0.06, 16, 26);
    const sm = isTablet ? clamp(CW * 0.045, 26, 48) : clamp(CW * 0.04, 18, 30);
    
    // --- 1. Left Horizontal-Only Joystick (Snaps to Center) ---
    const wL = r * 3.6, hL = r * 2.1;
    const cxL = sm + wL / 2;
    const cyL = CH - bm - hL / 2;
    const xL = cxL - wL / 2, yL = cyL - hL / 2;
    const maxTravelL = (wL - 2 * r) / 2;
    JOY.boundsL = { x: xL, y: yL, w: wL, h: hL, cx: cxL, cy: cyL, maxTravel: maxTravelL, r: r };

    // --- 2. Right Vertical Dual Slider (Height = 2x Diameter, Snaps to Top) ---
    const wR = r * 2.1, hR = r * 4.0;
    const cxR = CW - sm - wR / 2;
    const yR = CH - bm - hR;
    const xR = cxR - wR / 2;
    const cyTopR = yR + r * 1.05;
    const maxTravelR = hR - 2.1 * r;
    JOY.boundsR = { x: xR, y: yR, w: wR, h: hR, cx: cxR, cyTop: cyTopR, maxTravel: maxTravelR, r: r };

    // Smooth visual interpolation for knobs
    JOY.leftVisX += (JOY.leftX - JOY.leftVisX) * 0.40;
    JOY.rightVisY += (JOY.rightY - JOY.rightVisY) * 0.45;

    // --- Render Left Horizontal Track ---
    g.save();
    rr(g, xL, yL, wL, hL, hL / 2);
    g.fillStyle = 'rgba(255, 255, 255, 0.08)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    g.stroke();

    // Subtle track slot guideline
    g.beginPath();
    g.moveTo(cxL - maxTravelL * 0.85, cyL);
    g.lineTo(cxL + maxTravelL * 0.85, cyL);
    g.lineWidth = 2.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    g.stroke();

    // Faint chevrons
    ptxt('◀', xL + r * 0.55, cyL, FN(11, 900), 'rgba(255, 255, 255, 0.28)');
    ptxt('▶', xL + wL - r * 0.55, cyL, FN(11, 900), 'rgba(255, 255, 255, 0.28)');

    // Render Left Knob (rests in center)
    const kxL = cxL + JOY.leftVisX * maxTravelL;
    const leftActive = (TOUCH.left || TOUCH.right);
    g.beginPath();
    g.arc(kxL, cyL, r * 0.88, 0, Math.PI * 2);
    g.fillStyle = leftActive ? 'rgba(0, 210, 211, 0.45)' : 'rgba(255, 255, 255, 0.22)';
    g.fill();
    g.lineWidth = 2;
    g.strokeStyle = leftActive ? '#00d2d3' : 'rgba(255, 255, 255, 0.60)';
    g.stroke();
    g.beginPath();
    g.arc(kxL, cyL, 3, 0, Math.PI * 2);
    g.fillStyle = leftActive ? '#ffffff' : 'rgba(255, 255, 255, 0.50)';
    g.fill();

    // --- Render Right Vertical Track ---
    rr(g, xR, yR, wR, hR, wR / 2);
    g.fillStyle = 'rgba(255, 255, 255, 0.08)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    g.stroke();

    // Subtle vertical slot guideline
    g.beginPath();
    g.moveTo(cxR, cyTopR + r * 0.2);
    g.lineTo(cxR, cyTopR + maxTravelR);
    g.lineWidth = 2.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    g.stroke();

    // Dedicated Drop Pad target at bottom
    const cyBotR = yR + hR - r * 1.05;
    g.beginPath();
    g.arc(cxR, cyBotR, r * 0.76, 0, Math.PI * 2);
    g.fillStyle = TOUCH.downHeld ? 'rgba(235, 75, 155, 0.45)' : 'rgba(235, 75, 155, 0.14)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = TOUCH.downHeld ? '#eb4b9b' : 'rgba(235, 75, 155, 0.50)';
    g.stroke();
    ptxt('▼', cxR, cyBotR + 1, FN(11, 900), TOUCH.downHeld ? '#ffffff' : 'rgba(235, 75, 155, 0.85)');

    // Render Right Knob (snaps to top, tap jumps, drag down drops)
    const kyR = cyTopR + JOY.rightVisY * maxTravelR;
    g.beginPath();
    g.arc(cxR, kyR, r * 0.88, 0, Math.PI * 2);
    if(TOUCH.downHeld || JOY.rightVisY > 0.25){
      g.fillStyle = 'rgba(235, 75, 155, 0.65)';
      g.strokeStyle = '#eb4b9b';
    } else if(TOUCH.jumpHeld){
      g.fillStyle = 'rgba(46, 204, 113, 0.65)';
      g.strokeStyle = '#2ecc71';
    } else {
      g.fillStyle = 'rgba(255, 255, 255, 0.22)';
      g.strokeStyle = 'rgba(255, 255, 255, 0.60)';
    }
    g.fill();
    g.lineWidth = 2;
    g.stroke();

    // Icon inside knob (▲ for Jump, ▼ when dragged down for Drop)
    const knobIcon = (TOUCH.downHeld || JOY.rightVisY > 0.25) ? '▼' : '▲';
    const knobCol = (TOUCH.downHeld || TOUCH.jumpHeld || JOY.rightVisY > 0.25) ? '#ffffff' : 'rgba(255, 255, 255, 0.85)';
    ptxt(knobIcon, cxR, kyR + (knobIcon === '▲' ? -1 : 1), FN(12, 900), knobCol);

    g.restore();
  } else {
    /* ================= 2-PLAYER SPLIT LOCAL (1-THUMB GESTURE ZONES) ================= */
    const colP1 = (match.players[0] && PALETTE[match.players[0].colIdx]) ? PALETTE[match.players[0].colIdx].c : '#e8433f';
    const colP2 = (match.players[1] && PALETTE[match.players[1].colIdx]) ? PALETTE[match.players[1].colIdx].c : '#2f9be8';

    g.save();
    // 1. Subtle Center Dashed Midline
    g.setLineDash([6, 8]);
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.16)';
    g.beginPath();
    g.moveTo(CW / 2, 52);
    g.lineTo(CW / 2, CH - 14);
    g.stroke();
    g.setLineDash([]);

    // 2. Ambient Watermarks in corners
    const isNarrow = (CW < 600);
    ptxt('P1 ZONE', Math.max(34, CW * 0.08), CH - 22, FN(isNarrow ? 11 : 13, 900), rgba(colP1, 0.55));
    ptxt(isNarrow ? '◀ SWIPE / TAP ▶' : '◀ SWIPE TO RUN • TAP TO JUMP • SWIPE ▼ TO DROP ▶', CW * 0.25, CH - 22, FN(isNarrow ? 9 : 10, 800), 'rgba(255, 255, 255, 0.22)');

    ptxt('P2 ZONE', CW - Math.max(34, CW * 0.08), CH - 22, FN(isNarrow ? 11 : 13, 900), rgba(colP2, 0.55));
    ptxt(isNarrow ? '◀ SWIPE / TAP ▶' : '◀ SWIPE TO RUN • TAP TO JUMP • SWIPE ▼ TO DROP ▶', CW * 0.75, CH - 22, FN(isNarrow ? 9 : 10, 800), 'rgba(255, 255, 255, 0.22)');

    // 3. Dynamic Gesture Rings Under Active Fingers
    // Player 1 Thumb
    if(GESTURE_SPLIT.p1.active){
      const p = GESTURE_SPLIT.p1;
      // Anchor ring
      g.beginPath();
      g.arc(p.startX, p.startY, 28, 0, TAU);
      g.fillStyle = rgba(colP1, 0.12);
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = rgba(colP1, 0.45);
      g.stroke();

      // Connecting guideline
      g.beginPath();
      g.moveTo(p.startX, p.startY);
      g.lineTo(p.curX, p.curY);
      g.lineWidth = 2;
      g.strokeStyle = rgba(colP1, 0.35);
      g.stroke();

      // Floating knob
      const knobActive = (p.left || p.right || p.downHeld || p.jumpHeld);
      g.beginPath();
      g.arc(p.curX, p.curY, 22, 0, TAU);
      g.fillStyle = knobActive ? rgba(colP1, 0.55) : 'rgba(255,255,255,0.25)';
      g.fill();
      g.lineWidth = 2.5;
      g.strokeStyle = knobActive ? '#ffffff' : rgba(colP1, 0.75);
      g.stroke();

      // Direction icon inside knob
      const icon = p.downHeld ? '▼' : (p.jumpHeld ? '▲' : (p.left ? '◀' : (p.right ? '▶' : '•')));
      ptxt(icon, p.curX, p.curY + 1, FN(13, 900), '#ffffff');
    }

    // Player 2 Thumb
    if(GESTURE_SPLIT.p2.active){
      const p = GESTURE_SPLIT.p2;
      // Anchor ring
      g.beginPath();
      g.arc(p.startX, p.startY, 28, 0, TAU);
      g.fillStyle = rgba(colP2, 0.12);
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = rgba(colP2, 0.45);
      g.stroke();

      // Connecting guideline
      g.beginPath();
      g.moveTo(p.startX, p.startY);
      g.lineTo(p.curX, p.curY);
      g.lineWidth = 2;
      g.strokeStyle = rgba(colP2, 0.35);
      g.stroke();

      // Floating knob
      const knobActive = (p.left || p.right || p.downHeld || p.jumpHeld);
      g.beginPath();
      g.arc(p.curX, p.curY, 22, 0, TAU);
      g.fillStyle = knobActive ? rgba(colP2, 0.55) : 'rgba(255,255,255,0.25)';
      g.fill();
      g.lineWidth = 2.5;
      g.strokeStyle = knobActive ? '#ffffff' : rgba(colP2, 0.75);
      g.stroke();

      // Direction icon inside knob
      const icon = p.downHeld ? '▼' : (p.jumpHeld ? '▲' : (p.left ? '◀' : (p.right ? '▶' : '•')));
      ptxt(icon, p.curX, p.curY + 1, FN(13, 900), '#ffffff');
    }
    g.restore();
  }

  // ================= 4. PRE-MATCH TUTORIAL THUMBNAIL CARD =================
  if(GESTURE_SPLIT.showTutorial && match){
    drawLocalTutorialCard();
  }
}

  const cardY = CH / 2 - cardH / 2;

  // Outer shadow & card body
  rr(g, cardX, cardY, cardW, cardH, 18);
  g.fillStyle = '#131b2b';

  g.lineWidth = 2.5;
  g.strokeStyle = '#2ecc71';
  g.stroke();

  ptxt('▼ 👆  SWIPE DOWN TO DROP', col1X + colW / 2, rowY0 + rowH * 2, FN(isMini ? 10 : 11.5, 800), '#f472b6');

  // --- Column 2: Player 2 (Right Half) ---
  rr(g, col2X, colY, colW, colH, 12);
  g.fillStyle = 'rgba(255, 255, 255, 0.04)';
  g.fill();
  g.lineWidth = 1.5;
  g.strokeStyle = rgba(colP2, 0.55);

  // P2 Header badge
  rr(g, col2X + 10, colY + 10, colW - 20, 26, 8);
  g.fillStyle = rgba(colP2, 0.25);
  g.fill();
  g.lineWidth = 1.2;
  g.strokeStyle = colP2;
  g.stroke();
  ptxt('P2 (RIGHT HALF OF SCREEN)', col2X + colW / 2, colY + 23, FN(11, 900), '#ffffff');

  ptxt('▲ 👆  TAP ANYWHERE TO JUMP', col2X + colW / 2, rowY0 + rowH, FN(isMini ? 10 : 11.5, 800), '#2ecc71');

function drawHUD(){
  const urgent=match.timer<=10&&match.state==='playing';
  const tw=Math.min(150,CW*0.28),th=40;
  rr(g,CW/2-tw/2,8,tw,th,10);
  g.fillStyle=urgent?'rgba(190, 24, 24, 0.92)':'rgba(20, 28, 42, 0.92)';
  g.fill();
  g.lineWidth=2.5;g.strokeStyle=urgent?'#ef4444':INK;g.stroke();
  ptxt(fmtTime(match.timer),CW/2,8+th/2+1,FT(Math.min(22,th*0.54)),urgent?'#fff0f0':'#ffffff');
  
  const P=match.players;
  const pillH = P.length > 4 ? 22 : 26;
  const pillGap = P.length > 4 ? 25 : 30;
  for(let i=0;i<P.length;i++){
    const p = P[i];
    const isIt = settings.teams ? (p.team === match.itTeam && match.state !== 'result') : (match.it === i && match.state !== 'result');
    const y = 10 + i * pillGap;
    g.save(); g.globalAlpha = isIt ? 1 : 0.75;
    const teamBadge = settings.teams ? ((p.team === 0 ? '🔴 ' : (p.team === 1 ? '🔵 ' : '🟢 '))) : '';
    const label = teamBadge + 'P' + (p.slot + 1) + (isIt ? ' IT' : '');
    pill(10, y, isIt ? 124 : 92, pillH, isIt ? 'rgba(255,210,63,0.92)' : 'rgba(0,0,0,0.3)', isIt ? INK : 'rgba(0,0,0,0.5)');
    g.fillStyle = getPlayerColor(p);
    rr(g, 14, y + (pillH - 16) / 2, 16, 16, 4); g.fill(); g.lineWidth = 1.8; g.strokeStyle = INK; g.stroke();
    txt(label, 36, y + pillH / 2 + 1, FN(P.length > 4 ? 10 : 11, 900), isIt ? '#3a2c00' : '#ffffff', 'left');
    g.restore();
  }
  
  /* In-game control bar: Pause, Sound, Fullscreen, Next Map, Voice */
  const btnSize=38;
  const xPause=CW-btnSize-12;
  const xMute=xPause-btnSize-8;
  const xFull=xMute-btnSize-8;
  const xNext=xFull-btnSize-8;
  const xVoice=xNext-btnSize-8;
  
  // Pause button
  rr(g,xPause,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.fillStyle='#1e293b';
  g.fillRect(xPause+12,10+10,4,18);
  g.fillRect(xPause+22,10+10,4,18);
  zone(xPause,10,btnSize,btnSize,{fn:togglePause});
  
  // Audio Mute/Unmute button
  rr(g,xMute,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.fillStyle='#1e293b';
  g.beginPath();
  g.moveTo(xMute+10, 10+btnSize/2-4);
  g.lineTo(xMute+14, 10+btnSize/2-4);
  g.lineTo(xMute+20, 10+btnSize/2-10);
  g.lineTo(xMute+20, 10+btnSize/2+10);
  g.lineTo(xMute+14, 10+btnSize/2+4);
  g.lineTo(xMute+10, 10+btnSize/2+4);
  g.closePath();
  g.fill();
  if(!muted){
    // sound wave arc
    g.strokeStyle='#1e293b'; g.lineWidth=2.2;
    g.beginPath(); g.arc(xMute+19, 10+btnSize/2, 6, -0.6, 0.6); g.stroke();
  }else{
    // red mute strike
    g.strokeStyle='#ef4444'; g.lineWidth=3;
    g.beginPath(); g.moveTo(xMute+8, 10+8); g.lineTo(xMute+btnSize-8, 10+btnSize-8); g.stroke();
  }
  zone(xMute,10,btnSize,btnSize,{fn:toggleSound});
  
  // Fullscreen button
  rr(g,xFull,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.strokeStyle='#1e293b'; g.lineWidth=2.5;
  const isFull=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement||document.webkitIsFullScreen);
  if(!isFull){
    const m=10;
    g.beginPath(); g.moveTo(xFull+m, 10+m+5); g.lineTo(xFull+m, 10+m); g.lineTo(xFull+m+5, 10+m); g.stroke();
    g.beginPath(); g.moveTo(xFull+btnSize-m-5, 10+m); g.lineTo(xFull+btnSize-m, 10+m); g.lineTo(xFull+btnSize-m, 10+m+5); g.stroke();
    g.beginPath(); g.moveTo(xFull+m, 10+btnSize-m-5); g.lineTo(xFull+m, 10+btnSize-m); g.lineTo(xFull+m+5, 10+btnSize-m); g.stroke();
    g.beginPath(); g.moveTo(xFull+btnSize-m-5, 10+btnSize-m); g.lineTo(xFull+btnSize-m, 10+btnSize-m); g.lineTo(xFull+btnSize-m, 10+btnSize-m-5); g.stroke();
  }else{
    const m=11;
    g.strokeRect(xFull+m, 10+m, btnSize-2*m, btnSize-2*m);
  }
  zone(xFull,10,btnSize,btnSize,{upFn:toggleFullscreen});
  
  // Next map quick button
  rr(g,xNext,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  ptxt('▶',xNext+btnSize/2+1,10+btnSize/2+1,FT(14),'#1c6b38');
  zone(xNext,10,btnSize,btnSize,{fn:()=>selectMapQuick(settings.map+1)});

  // Proximity Voice Chat button (online) or Help/Tutorial button (2-player local touch)
  if(typeof NET!=='undefined' && NET && NET.role!==null){
    rr(g,xVoice,10,btnSize,btnSize,9);
    const vOn = (typeof VOICE!=='undefined' && VOICE.enabled);
    const vMuted = (typeof VOICE!=='undefined' && VOICE.muted);
    g.fillStyle = vOn ? (vMuted ? 'rgba(231, 76, 60, 0.92)' : 'rgba(39, 174, 96, 0.92)') : 'rgba(255,255,255,0.92)';
    g.fill();
    g.lineWidth=2.5; g.strokeStyle=INK; g.stroke();
    ptxt(vOn ? (vMuted ? '🔇' : '🎙️') : '🎙️', xVoice+btnSize/2, 10+btnSize/2+1, FN(15,900), vOn?'#ffffff':'#1e293b');
    zone(xVoice,10,btnSize,btnSize,{fn:voiceToggleMic});
  } else if(isTouch && match.players && match.players.length === 2){
    rr(g,xVoice,10,btnSize,btnSize,9);
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.fill();
    g.lineWidth=2.5; g.strokeStyle=INK; g.stroke();
    ptxt('?', xVoice+btnSize/2, 10+btnSize/2+1, FT(18), '#1e293b');
    zone(xVoice,10,btnSize,btnSize,{fn:()=>{ GESTURE_SPLIT.showTutorial = true; sfx('ui'); }});
  }
  
  if(match.state==='countdown')drawBigCount(match.cd,'GET READY!');
  if(match.goFlash>0&&match.state==='playing'){
    const a=clamp(match.goFlash/0.8,0,1);
    const sc2=1+(1-a)*0.6;
    g.save();g.translate(CW/2,CH*0.4);g.scale(sc2,sc2);g.globalAlpha=a;
    g.font=FT(Math.min(90,CW*0.16));g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    g.strokeStyle=INK;g.lineWidth=10;g.strokeText('GO!',0,0);
    g.fillStyle='#8ef0b0';g.fillText('GO!',0,0);
    g.restore();
  }
  
  /* On-screen map and theme toast notification */
  if(match.mapToastT>0&&match.mapToast){
    const a=clamp(match.mapToastT,0,1);
    g.save();g.globalAlpha=a;
    ptxt(match.mapToast,CW/2,64,FN(Math.min(18,CW*0.032),900),'#ffea88');
    g.restore();
  }
  
  if(match.hintT>0&&match.state!=='result'&&!isTouch){
    const a=clamp(match.hintT,0,1);
    ptxt('HOLD S / ↓ ON PINK TO DROP   •   WALL-JUMP ON WALLS   •   N = NEXT MAP   •   M = MUTE   •   F = FULLSCREEN',CW/2,CH-20,FN(12,800),'rgba(255,255,255,'+(a*0.75).toFixed(2)+')');
  }
  if(isTouch&&CH>CW&&match.state!=='result'){
    ptxt('ROTATE FOR WIDE VIEW',CW/2,54,FN(12,900),'rgba(255,255,255,0.9)');
  }
}

function drawBigCount(num,label){
  const ph=clamp(match?match.cdT/0.72:0,0,1);
  const sc=1.35-0.35*easeOut(Math.min(1,ph*3));
  g.save();
  g.translate(CW/2,CH*0.4);
  g.scale(sc,sc);
  ptxt(String(num),0,0,FT(Math.min(100,CW*0.18)),'#ffffff');
  g.restore();
  ptxt(label,CW/2,CH*0.4-Math.min(100,CW*0.14),FN(Math.min(18,CW*0.036),900),'#ffffff');
}

function drawPause(){
  g.fillStyle='rgba(10,16,24,0.78)';g.fillRect(0,0,CW,CH);
  const pw=Math.min(460,CW-30),ph=360;
  const px=CW/2-pw/2,py=CH/2-ph/2;
  rr(g,px,py,pw,ph,20);
  g.fillStyle='rgba(20,28,42,0.96)';g.fill();g.lineWidth=4;g.strokeStyle=INK;g.stroke();
  ptxt('PAUSED',CW/2,py+36,FT(30),'#ffffff');
  ptxt('MAP '+(settings.map+1)+': '+MAPS[settings.map].name,CW/2,py+66,FN(14,800),'#a0c0e8');
  const opts=['RESUME','RESTART','NEXT MAP','SOUND: '+(muted?'OFF':'ON'),'FULLSCREEN','QUIT TO MENU'];
  for(let i=0;i<6;i++){
    const y=py+98+i*42;
    const sel=match.pauseSel===i;
    if(sel){pill(CW/2-150,y-17,300,34,'rgba(255,255,255,0.18)','#ffffff');}
    ptxt(opts[i],CW/2,y,FN(sel?17:15,900),sel?'#ffffff':'#bcd0e8');
    zone(CW/2-150,y-17,300,34,{fn:()=>{
      if(i===0)togglePause();
      else if(i===1){sfx('go');startMatch();}
      else if(i===2){selectMapQuick(settings.map+1);}
      else if(i===3){toggleSound();}
      else if(i===4){toggleFullscreen();}
      else quitToMenu();
    }});
  }
}

function drawResult(){
  g.fillStyle='rgba(10,16,24,0.72)';g.fillRect(0,0,CW,CH);
  zone(0,0,CW,CH,{fn:()=>{
    if(typeof NET!=='undefined' && NET && NET.role!==null){
      if(!NET.isHost) return;
      if(NET.midgameJoiner){
        NET.midgameJoiner = false;
        quitToMenu();
        return;
      }
    }
    sfx('go');startMatch();
  }});
  const t=match.resultT;
  if(t<0.9){
    const sc=1.4-0.4*easeOut(Math.min(1,t*4));
    g.save();g.translate(CW/2,CH*0.26);g.scale(sc,sc);
    ptxt("TIME'S UP!",0,0,FT(Math.min(80,CW*0.12)),'#ffcf3f');
    g.restore();
  }
  const ap=easeBack(clamp((t-0.35)*2.2,0,1));
  if(ap<=0)return;
  const P=match.players;
  const isTeamMatch = !!(settings.teams && match.result && match.result.winningTeam != null);
  const pw=Math.min(740,CW-30),ph=Math.min(440,CH-40);
  const px=CW/2-pw/2,py=CH/2-ph/2;
  g.save();
  g.translate(CW/2,CH/2);g.scale(ap,ap);g.translate(-CW/2,-CH/2);
  rr(g,px,py,pw,ph,20);
  g.fillStyle='rgba(20,28,42,0.96)';g.fill();g.lineWidth=4;g.strokeStyle=INK;g.stroke();

  if(isTeamMatch){
    const winTeamIdx = match.result.winningTeam;
    const winTeam = TEAMS[winTeamIdx] || TEAMS[0];
    const teamMates = P.filter(p => p.team === winTeamIdx);
    const winTitle = winTeam.icon + ' ' + winTeam.name + ' WINS!';
    ptxt(winTitle, CW/2, py+ph*0.13, FT(Math.min(38,CW*0.055)), winTeam.base);
    ptxt('LOWEST TIME AS IT!   (MAP '+(settings.map+1)+': '+MAPS[settings.map].name+')', CW/2, py+ph*0.25, FN(Math.min(14,CW*0.028),800), '#ffffff');
    const psz=Math.min(54,ph*0.16);
    const startX = CW/2 - ((teamMates.length - 1) * psz * 1.5) / 2;
    for(let mi = 0; mi < teamMates.length; mi++){
      const p = teamMates[mi];
      drawChar(g, startX + mi * psz * 1.5, py+ph*0.46 - Math.abs(Math.sin(tGlobal*5 + mi))*8, psz, getPlayerColor(p), { face: 'happy', fdir: 1, grounded: true, seed: mi*3 });
    }
  } else {
    const loser=match.result.loser != null ? match.result.loser : match.it;
    const winners=P.map((p,i)=>i).filter(i=>i!==loser);
    const wcol=PALETTE[(P[winners[0]] && P[winners[0]].colIdx) || 0].c;
    ptxt(winners.length===1?('PLAYER '+(winners[0]+1)+' WINS!'):(winners.map(w=>'P'+(w+1)).join(' + ')+' WIN!'),CW/2,py+ph*0.12,FT(Math.min(38,CW*0.055)),wcol);
    ptxt('PLAYER '+(loser+1)+' WAS IT - LOSES!   (MAP '+(settings.map+1)+': '+MAPS[settings.map].name+')',CW/2,py+ph*0.24,FN(Math.min(14,CW*0.028),800),'#ffffff');
    const psz=Math.min(60,ph*0.17);
    drawChar(g,CW/2-psz*2.4,py+ph*0.45-Math.abs(Math.sin(tGlobal*5))*10,psz,getPlayerColor(P[winners[0]]),{face:'happy',fdir:1,grounded:true,seed:2});
    if(P[loser]) drawChar(g,CW/2+psz*1.4,py+ph*0.48,psz,getPlayerColor(P[loser]),{face:'sad',fdir:-1,tilt:-0.06,grounded:true,seed:5});
  }
  txt('TAGS - '+P.map((p,i)=>'P'+(i+1)+': '+match.tags[i]).join('  •  '),CW/2,py+ph*0.66,FN(13,900),'#cfe9d6');
  const b3=Math.min(180,(pw-60)/3);
  const sx0=CW/2-(b3*3+28)/2;
  simpleButton(sx0,py+ph*0.77,b3,44,'NEXT MAP',()=>{

function getOrCreateConnPair(peerId){
  let pair = NET.conns.get(peerId);
  if(!pair){
    pair = { rel: null, fast: null };
    NET.conns.set(peerId, pair);
  }
  return pair;
}

function netSendFast(peerOrPair, msg){
  const pair = (typeof peerOrPair === 'string') ? NET.conns.get(peerOrPair) : peerOrPair;
  if(!pair) return;
  let c = (pair.fast && pair.fast.open) ? pair.fast : null;
  if(!c && pair.rel && pair.rel.open) c = pair.rel;
  if(c){
    try {
      const dc = c.dataChannel || c._dc;
      if(dc && dc.bufferedAmount > 32768) return; // Prevent latency queueing
      c.send(msg);
    } catch(e){}
  }
}

function netSendRel(peerOrPair, msg){
  const pair = (typeof peerOrPair === 'string') ? NET.conns.get(peerOrPair) : peerOrPair;
  if(!pair) return;
  const c = (pair.rel && pair.rel.open) ? pair.rel : (pair.fast && pair.fast.open ? pair.fast : (pair.open ? pair : null));
  if(c){ try{ c.send(msg); }catch(e){} }
}

function netBroadcastReliable(msg){
  if(typeof NET === 'undefined' || !NET || !NET.conns) return;
  for(const pair of NET.conns.values()){
    netSendRel(pair, msg);
  }
}

/* High-efficiency player state packing: reduces payload by 78% and cuts garbage collection pauses */
function packPlayer(p){
  return {
    s: p.slot,
    x: Math.round(p.x * 10) / 10,
    y: Math.round(p.y * 10) / 10,
    vx: Math.round(p.vx * 10) / 10,
    vy: Math.round(p.vy * 10) / 10,
    f: p.face || 1,
    sx: Math.round((p.sx || 1) * 100) / 100,
    sy: Math.round((p.sy || 1) * 100) / 100,
    g: p.grounded ? 1 : 0,
    aj: p.airJumps || 0,
    po: p.padOn ? 1 : 0,
    lt: Math.round((p.landT || 0) * 100) / 100,
    tt: Math.round((p.tagT || 0) * 100) / 100,
    b: p.blink > 0 ? 1 : 0
  };
}

function unpackPlayer(d){
  return {
    slot: d.s != null ? d.s : d.slot,
    x: d.x,
    y: d.y,
    vx: d.vx,
    vy: d.vy,
    face: d.f != null ? d.f : (d.face || 1),
    sx: d.sx != null ? d.sx : 1,
    sy: d.sy != null ? d.sy : 1,
    grounded: d.g != null ? !!d.g : !!d.grounded,
    airJumps: d.aj != null ? d.aj : (d.airJumps || 0),
    padOn: d.po != null ? !!d.po : !!d.padOn,
    landT: d.lt != null ? d.lt : (d.landT || 0),
    tagT: d.tt != null ? d.tt : (d.tagT || 0),
    blink: d.b != null ? (d.b ? 0.12 : 0) : (d.blink || 0),
    seq: d.seq || 0
  };
}

/* Continuous Predictive Smoothing Filter for Remote Players (Host & Guest) */
const _remoteTargets = new Map(); // slot -> target state

function netUpdateRemoteTarget(slot, data, pCurrent){
  if(slot == null || slot < 0) return;
  let tgt = _remoteTargets.get(slot);
  if(!tgt){
    tgt = {
      targetX: data.x, targetY: data.y, targetVx: data.vx, targetVy: data.vy,
      errX: 0, errY: 0,
      face: data.face || 1, sx: data.sx || 1, sy: data.sy || 1,
      grounded: !!data.grounded, airJumps: data.airJumps || 0,
      padOn: !!data.padOn, landT: data.landT || 0, tagT: data.tagT || 0,
      blink: data.blink || 0, seq: (data.seq != null ? data.seq : 0)
    };
    _remoteTargets.set(slot, tgt);
  } else {
    // Drop older out-of-order packets if seq is positive
    if(data.seq != null && tgt.seq != null && data.seq > 0 && tgt.seq > 0 && data.seq < tgt.seq) return;
    if(data.seq != null && data.seq > 0) tgt.seq = data.seq;

    // Calculate error between where player visually was and new target
    if(pCurrent){
      const rawDx = pCurrent.x - data.x;
      const rawDy = pCurrent.y - data.y;
      // If warp / teleport > 240px, snap instantly without error bleed
      if(rawDx * rawDx + rawDy * rawDy > 57600){
        pCurrent.x = data.x;
        pCurrent.y = data.y;
        tgt.errX = 0;
        tgt.errY = 0;
      } else {
        tgt.errX = rawDx;
        tgt.errY = data.grounded ? 0 : rawDy;
      }
    } else {
      tgt.errX = 0;
      tgt.errY = 0;
    }

    tgt.targetX = data.x;
    tgt.targetY = data.y;
    tgt.targetVx = data.vx;
    tgt.targetVy = data.vy;
    tgt.face = data.face != null ? data.face : tgt.face;
    tgt.sx = data.sx != null ? data.sx : 1;
    tgt.sy = data.sy != null ? data.sy : 1;
    tgt.grounded = !!data.grounded;
    tgt.airJumps = data.airJumps != null ? data.airJumps : tgt.airJumps;
    tgt.padOn = !!data.padOn;
    tgt.landT = data.landT != null ? data.landT : tgt.landT;
    tgt.tagT = data.tagT != null ? data.tagT : tgt.tagT;
    tgt.blink = data.blink != null ? data.blink : tgt.blink;
  }
}

function netApplyRemoteTarget(p, dt){
  const tgt = _remoteTargets.get(p.slot);
  if(!tgt) return;

  // Advance authoritative target along velocity vector between packets
  tgt.targetX += tgt.targetVx * dt;
  if(!tgt.grounded){
    tgt.targetY += tgt.targetVy * dt;
  }

  // Smooth exponential decay of error offset (half-life ~40ms: eliminates all micro-stutters and backward snapping)
  const decay = Math.exp(-dt * 18);
  tgt.errX *= decay;
  tgt.errY *= decay;

  // Visual position combines extrapolated target + smoothly decaying error offset
  p.x = tgt.targetX + tgt.errX;
  if(tgt.grounded){
    p.y = tgt.targetY;
    p.grounded = true;
    p.vy = 0;
  } else {
    p.y = tgt.targetY + tgt.errY;
    p.grounded = false;
    p.vy = tgt.targetVy;
  }
  p.vx = tgt.targetVx;

  p.face = tgt.face;
  p.sx += ((tgt.sx || 1) - p.sx) * Math.min(1, dt * 20);
  p.sy += ((tgt.sy || 1) - p.sy) * Math.min(1, dt * 20);
  p.landT = tgt.landT;
  p.tagT = tgt.tagT;
  p.padOn = tgt.padOn;
  p.blink = tgt.blink;
  p.airJumps = tgt.airJumps;

  // Ghost trail FX for remote sprinting player
  if(p.trail){
    for(let tr of p.trail) tr.alpha -= dt * 1.8;
    if(Math.abs(p.vx) > 300 || p.padOn){
      p.trail.unshift({ x: p.x, y: p.y, alpha: 0.45 });
      if(p.trail.length > 4) p.trail.pop();
    } else if(p.trail.length > 0){
      p.trail.pop();
    }
  }
}

/* ================= proximity voice chat (WebRTC + HTML5 Audio + Web Audio API) ================= */
const VOICE = {
  enabled: false,
  muted: false,
  localStream: null,
  analyser: null,
  analyserData: null,
  speaking: false,
  peers: new Map(), // peerId -> { call, stream, audioEl, source, analyser, analyserData, speaking, remoteMuted }
  supported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
};

async function voiceInit(){
  if(!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
    netToast('Mic requires HTTPS! Local HTTP blocks microphone.');
    return false;
  }
  if(!VOICE.supported){
    netToast('Voice chat not supported on this browser');
    return false;
  }
  initAudio();
  if(AC && AC.state === 'suspended') AC.resume().catch(()=>{});

  if(VOICE.localStream){
    VOICE.enabled = true;
    VOICE.muted = false;
    for(const track of VOICE.localStream.getAudioTracks()){ track.enabled = true; }
    netBroadcastReliable({ t: 'voice_mute', slot: NET.mySlot, peerId: NET.myId, muted: false });
    netToast('Microphone unmuted 🎙️');
    voiceSyncAllPeers();
    return true;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: { ideal: 1 },
        sampleRate: { ideal: 48000 },
        sampleSize: { ideal: 16 },
        echoCancellation: { ideal: true },
        noiseSuppression: { ideal: true },
        autoGainControl: { ideal: true },
        googEchoCancellation: { ideal: true },
        googAutoGainControl: { ideal: true },
        googNoiseSuppression: { ideal: true },
        googHighpassFilter: { ideal: true },
        googTypingNoiseDetection: { ideal: true }
      },
      video: false
    });
    VOICE.localStream = stream;
    VOICE.enabled = true;
    VOICE.muted = false;

    if(AC){
      try {
        const src = AC.createMediaStreamSource(stream);
        const ana = AC.createAnalyser();
        ana.fftSize = 128;
        src.connect(ana);
        VOICE.analyser = ana;
        VOICE.analyserData = new Uint8Array(ana.frequencyBinCount);
      } catch(e){}
    }

    netToast('Voice chat active! 🎙️');
    voiceSyncAllPeers();
    return true;
  } catch(err){
    console.warn('Microphone permission error:', err);
    netToast('Microphone access denied or unavailable');
    return false;
  }
}

function boostAudioSender(pc){
  if(!pc || !pc.getSenders) return;
  try {
    const senders = pc.getSenders();
    for(const sender of senders){
      if(sender.track && sender.track.kind === 'audio'){
        const params = sender.getParameters();
        if(params){
          if(!params.encodings || params.encodings.length === 0){
            params.encodings = [{}];
          }
          params.encodings[0].maxBitrate = 96000; // 96 kbps high-definition Opus
          params.encodings[0].priority = 'high';
          params.encodings[0].networkPriority = 'high';
          sender.setParameters(params).catch(()=>{});
        }
      }
    }
  } catch(e){}
}

function voiceToggleMic(){
  if(!VOICE.localStream || !VOICE.enabled){
    voiceInit();
    return;
  }
  VOICE.muted = !VOICE.muted;
  for(const track of VOICE.localStream.getAudioTracks()){
    track.enabled = !VOICE.muted;
  }
  if(VOICE.muted){
    VOICE.speaking = false;
  }
  netBroadcastReliable({ t: 'voice_mute', slot: NET.mySlot, peerId: NET.myId, muted: VOICE.muted });
  netToast(VOICE.muted ? 'Microphone muted 🔇' : 'Microphone unmuted 🎙️');
  sfx('ui');
}

function voiceCallPeer(peerId, forceNew){
  if(!NET.peer || !peerId || peerId === NET.myId || !VOICE.localStream) return;
  const existing = VOICE.peers.get(peerId);
  // If we already have an active open call with remote audio stream playing, don't recreate it unless forced
  if(existing && existing.call && existing.call.open && existing.stream && !forceNew){
    return;
  }
  // Prevent duplicate concurrent outgoing calls to the same peer
  if(existing && existing._calling) return;

  if(!existing){
    VOICE.peers.set(peerId, {
      call: null,
      stream: null,
      audioEl: null,
      source: null,
      analyser: null,
      analyserData: null,
      speaking: false,
      remoteMuted: false,
      _calling: true
    });
  } else {
    existing._calling = true;
  }

  try {
    const call = NET.peer.call(peerId, VOICE.localStream);
    if(call) voiceWireCall(call);
  } catch(e){
    const ent = VOICE.peers.get(peerId);
    if(ent) ent._calling = false;
  }
}

function voiceSyncAllPeers(){
  if(!NET.peer || !VOICE.localStream) return;
  // If Host: initiate calls to all guests who don't have an active call
  if(NET.isHost){
    for(const peerId of NET.conns.keys()){
      voiceCallPeer(peerId, false);
    }
  } else {
    // If Guest: notify Host that our mic is ready so Host can call us (avoids glare/dual-calling)
    netBroadcastReliable({ t: 'voice_req', peerId: NET.myId, hasStream: true });
  }
}

function voiceWireCall(call){
  const peerId = call.peer;
  let entry = VOICE.peers.get(peerId);
  const prevCall = (entry && entry.call && entry.call !== call) ? entry.call : null;

  if(!entry){
    entry = {
      call: call,
      stream: null,
      audioEl: null,
      source: null,
      analyser: null,
      analyserData: null,
      speaking: false,
      remoteMuted: false,
      _calling: false
    };
    VOICE.peers.set(peerId, entry);
  } else {
    entry.call = call;
    entry._calling = false;
  }

  // Safely close previous call without nuking the active entry
  if(prevCall){
    try { prevCall.close(); } catch(e){}
  }

  const applyBoost = () => {
    if(call.peerConnection) boostAudioSender(call.peerConnection);
  };
  call.on('open', () => {
    entry._calling = false;
    applyBoost();
  });
  setTimeout(applyBoost, 400);

  call.on('stream', remoteStream => {
    const current = VOICE.peers.get(peerId);
    if(!current || (current.call && current.call !== call)) return;
    current.stream = remoteStream;

    // Reuse existing audio element if already created, or create one
    if(!current.audioEl){
      const el = document.createElement('audio');
      el.autoplay = true;
      el.playsInline = true;
      el.style.display = 'none';
      document.body.appendChild(el);
      current.audioEl = el;
    }
    current.audioEl.srcObject = remoteStream;
    current.audioEl.volume = 0.85;
    const playP = current.audioEl.play();
    if(playP && playP.catch) playP.catch(() => {});

    // Analyser setup for visual speaking indicator
    initAudio();
    if(AC){
      try {
        if(AC.state === 'suspended') AC.resume().catch(()=>{});
        if(current.source){ try{ current.source.disconnect(); }catch(e){} }
        const source = AC.createMediaStreamSource(remoteStream);
        const ana = AC.createAnalyser();
        ana.fftSize = 128;
        source.connect(ana);
        current.source = source;
        current.analyser = ana;
        current.analyserData = new Uint8Array(ana.frequencyBinCount);
      } catch(err){
        console.warn('WebAudio analyser setup error:', err);
      }
    }
  });

  call.on('close', () => {
    // CRITICAL FIX: Only clean up if this closed call is ACTUALLY the active call for this peer!
    const current = VOICE.peers.get(peerId);
    if(current && current.call === call){
      if(current.audioEl){
        try{ current.audioEl.pause(); current.audioEl.srcObject = null; current.audioEl.remove(); }catch(e){}
        current.audioEl = null;
      }
      if(current.source){ try{ current.source.disconnect(); }catch(e){} }
      VOICE.peers.delete(peerId);
    }
  });

  call.on('error', e => {
    const current = VOICE.peers.get(peerId);
    if(current && current.call === call) current._calling = false;
  });
}

function updateVoiceProximity(dt){
  const inGame = (match && screen === 'game' && match.players && match.players.length > 0);
  const isPlaying = (inGame && match.state === 'playing');
  let myP = null;
  if(inGame){
    if(typeof getMyPlayer === 'function') myP = getMyPlayer();
    if(!myP && NET.mySlot >= 0) myP = match.players.find(p => p.slot === NET.mySlot);
    if(!myP) myP = match.players[0];
  }
  const myPos = myP ? { x: myP.x, y: myP.y } : null;

  for(const [peerId, entry] of VOICE.peers.entries()){
    let targetVol = 0.85; // Default clear volume for menu, lobby, countdown, results

    if(isPlaying && myPos){
      let targetSlot = NET.peerSlots ? NET.peerSlots.get(peerId) : undefined;
      if(targetSlot === undefined){
        if(!NET.isHost && peerId.endsWith('-host')) targetSlot = 0;
        else if(NET.isHost){
          for(let s = 1; s < 4; s++){
            const ent = NET.hostInputs.get(s);
            if(ent && ent.owner === peerId){ targetSlot = s; break; }
          }
        }
      }

      const targetP = (targetSlot != null && targetSlot !== NET.mySlot)
        ? match.players.find(p => p.slot === targetSlot)
        : (NET.isHost ? null : match.players.find(p => p.slot === 0));

      if(targetP && myPos && targetP.x != null && myPos.x != null){
        const dx = targetP.x - myPos.x;
        const dy = targetP.y - myPos.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Near (<= 180px): 100% full volume
        // Mid (spawn/medium ~800px): ~40% volume
        // Across arena (>= 1800px): ~5-6% faint whisper (huge contrast between close and far)
        const closeRadius = 180;
        const maxDist = 2000;
        if(isNaN(dist) || dist <= closeRadius){
          targetVol = 1.0;
        } else {
          const t = clamp((dist - closeRadius) / (maxDist - closeRadius), 0, 1);
          // Steep exponential falloff (2.2 exponent): drops off quickly to a faint 5% whisper
          targetVol = 0.05 + 0.95 * Math.pow(1 - t, 2.2);
        }
      }
    }

    // Direct HTML5 Audio volume control & continuous playback watchdog
    if(entry.audioEl){
      try {
        const curV = entry.audioEl.volume;
        const nextV = curV + (targetVol - curV) * Math.min(1, dt * 14);
        entry.audioEl.volume = clamp(nextV, 0.04, 1.0);
        if(entry.audioEl.paused && entry.audioEl.srcObject){
          entry.audioEl.play().catch(()=>{});
        }
      } catch(e){}
    }

    if(entry.analyser && entry.analyserData){
      if(entry.remoteMuted){
        entry.speaking = false;
      } else {
        entry.analyser.getByteFrequencyData(entry.analyserData);
        let sum = 0;
        for(let i = 0; i < entry.analyserData.length; i++) sum += entry.analyserData[i];
        entry.speaking = (sum / entry.analyserData.length) > 13;
      }
    }
  }

  if(VOICE.analyser && VOICE.analyserData && !VOICE.muted && VOICE.enabled){
    VOICE.analyser.getByteFrequencyData(VOICE.analyserData);
    let sum = 0;
    for(let i = 0; i < VOICE.analyserData.length; i++) sum += VOICE.analyserData[i];
    VOICE.speaking = (sum / VOICE.analyserData.length) > 13;
  } else {
    VOICE.speaking = false;
  }
}

function isPlayerSpeaking(slot){
  if(!match) return false;
  if(slot === NET.mySlot){
    return !!VOICE.speaking;
  }
  for(const [peerId, entry] of VOICE.peers.entries()){
    if(entry.speaking && !entry.remoteMuted){
      let pSlot = NET.peerSlots ? NET.peerSlots.get(peerId) : undefined;
      if(pSlot === undefined){
        if(!NET.isHost && peerId.endsWith('-host')) pSlot = 0;
        else if(NET.isHost){
          for(let s = 1; s < 4; s++){
            const ent = NET.hostInputs.get(s);
            if(ent && ent.owner === peerId){ pSlot = s; break; }
          }
        }
      }
      if(pSlot === slot) return true;
    }
  }
  return false;
}

function voiceEnsurePlayback(){
  if(AC && AC.state === 'suspended') AC.resume().catch(()=>{});
  for(const entry of VOICE.peers.values()){
    if(entry.audioEl && entry.audioEl.paused && entry.audioEl.srcObject){

/* Sample controls based on player's chosen scheme */
function sampleControls(scheme){
  let dir = 0, jumpEdge = false, jumpHeld = false, downHeld = false;
  if(scheme === 'WASD'){
    const L = keys.has('KeyA') || keys.has('KeyQ');
    const R = keys.has('KeyD');
    dir = (R ? 1 : 0) - (L ? 1 : 0);
    jumpEdge = pressed.has('KeyW') || pressed.has('Space');
    jumpHeld = keys.has('KeyW') || keys.has('Space');
    downHeld = keys.has('KeyS');
  } else if(scheme === 'Arrows'){
    const L = keys.has('ArrowLeft');
    const R = keys.has('ArrowRight');
    dir = (R ? 1 : 0) - (L ? 1 : 0);
    jumpEdge = pressed.has('ArrowUp') || pressed.has('Space');
    jumpHeld = keys.has('ArrowUp') || keys.has('Space');
    downHeld = keys.has('ArrowDown');
  } else if(scheme === 'IJKL'){
    const L = keys.has('KeyJ');
    const R = keys.has('KeyL');
    dir = (R ? 1 : 0) - (L ? 1 : 0);
    jumpEdge = pressed.has('KeyI');
    jumpHeld = keys.has('KeyI');
    downHeld = keys.has('KeyK');
  } else if(scheme === 'TFGH'){
    const L = keys.has('KeyF');
    const R = keys.has('KeyH');
    dir = (R ? 1 : 0) - (L ? 1 : 0);
    jumpEdge = pressed.has('KeyT');
    jumpHeld = keys.has('KeyT');
    downHeld = keys.has('KeyG');
  } else if(scheme === 'Controller'){
    for(let pi=0; pi<4; pi++){
      const pd = PAD[pi];
      if(pd && pd.connected){
        dir = (pd.right ? 1 : 0) - (pd.left ? 1 : 0);
        jumpEdge = pd.jumpE;
        jumpHeld = pd.jumpHeld;
        downHeld = pd.dropHeld;
        break;
      }
    }
  }
  // Allow connected controller to drive any scheme seamlessly
  for(let pi=0; pi<4; pi++){
    const pd = PAD[pi];
    if(pd && pd.connected){
      if(pd.left) dir = -1;
      if(pd.right) dir = 1;
      if(pd.jumpE) jumpEdge = true;
      if(pd.jumpHeld) jumpHeld = true;
      if(pd.dropHeld) downHeld = true;
      break;
    }
  }
  // Mobile / Tablet on-screen touch controls
  if(TOUCH.left) dir = -1;
  if(TOUCH.right) dir = 1;
  if(TOUCH.jumpEdge) jumpEdge = true;
  if(TOUCH.jumpHeld) jumpHeld = true;
  if(TOUCH.downHeld) downHeld = true;

  return { dir: clamp(dir, -1, 1), jumpEdge: !!jumpEdge, jumpHeld: !!jumpHeld, downHeld: !!downHeld };
}

/* Input shim: host runs local input for slot 0 (or its own slot); guest inputs are buffered */
const _inputFor = inputFor;
function inputForNet(p){
  if(NET.role !== null){
    if(NET.isHost){
      const slot = p.slot;
      if(slot === NET.mySlot || slot === 0){
        return sampleControls(NET.myCtrl || 'WASD');
      }
      const ext = NET.hostInputs.get(slot);
      if(ext){
        let edge = false;
        if(ext.jumpQueue > 0){
          ext.jumpQueue--;
          edge = true;
        } else if(ext.consumeEdge){
          ext.consumeEdge = false;
          edge = true;
        }
        return { dir: clamp(ext.dir, -1, 1), jumpEdge: edge, jumpHeld: !!ext.jumpHeld, downHeld: !!ext.downHeld };
      }
      return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
    } else {
      if(p.slot === NET.mySlot){
        return NET.myCurrentInput || sampleControls(NET.myCtrl || 'WASD');
      }
      return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
    }
  }
  return _inputFor(p);
}
inputFor = inputForNet;

/* PeerJS connect (Supports dedicated Railway/Render server with zero-failure cloud fallback) */
function netConnectPeer(room, isHost, forceFallback = false){
  if(NET.peer){
    try{ NET.peer.destroy(); }catch(e){}
    NET.peer = null;
  }
  const cleanRoom = room.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6);
  const id = 'tag-' + cleanRoom + (isHost ? '-host' : '-g' + Math.floor(Math.random() * 1e6));
  
  // Check if custom server is specified via URL parameter ?server=... or PEER_SERVER_CONFIG
  let customHost = '';
  try {
    const qp = new URLSearchParams(location.search);
    customHost = qp.get('server') || (typeof PEER_SERVER_CONFIG !== 'undefined' ? PEER_SERVER_CONFIG.host : '') || '';
    customHost = customHost.replace(/^https?:\/\//i, '').replace(/\/+$/, '').trim();
  } catch(e){}

  let peerOptions = { debug: 0, config: { iceServers: ICE_SERVERS } };
  let usingCustom = false;
  if(customHost && !forceFallback){
    usingCustom = true;
    peerOptions = {
      host: customHost,
      port: (typeof PEER_SERVER_CONFIG !== 'undefined' && PEER_SERVER_CONFIG.port) || 443,
      path: (typeof PEER_SERVER_CONFIG !== 'undefined' && PEER_SERVER_CONFIG.path) || '/tag-netplay',
      secure: (typeof PEER_SERVER_CONFIG !== 'undefined' && PEER_SERVER_CONFIG.secure !== undefined) ? PEER_SERVER_CONFIG.secure : true,
      debug: 0,
      config: { iceServers: ICE_SERVERS }
    };
  }

  let fallbackTimer = null;
  if(usingCustom){
    fallbackTimer = setTimeout(() => {
      if(!NET.peer || !NET.myId){
        console.warn('Custom server connection timed out, falling back to public PeerJS cloud.');
        netToast('Custom server unreachable. Falling back to Cloud…');
        netConnectPeer(room, isHost, true);
      }
    }, 5500);
  }

  try {
    NET.peer = new Peer(id, peerOptions);
  } catch(err){
    if(usingCustom){
      netConnectPeer(room, isHost, true);
      return;
    }
    throw err;
  }
  
  NET.peer.on('open', id2 => {
    if(fallbackTimer){ clearTimeout(fallbackTimer); fallbackTimer = null; }
    NET.myId = id2;
    NET.peerSlots.clear();
    if(usingCustom){
      console.log('[NET] Connected to dedicated signaling server:', customHost);
    }
    if(isHost){
      NET.peerSlots.set(id2, 0);
      NET.peer.on('connection', c => netWireConn(c, true));
      netToast('Hosting room ' + room.toUpperCase() + '! Link copied.');
      setTimeout(() => { netBroadcastSettings(); netBroadcastRoster(); }, 400);
    } else {
      const hostId = 'tag-' + cleanRoom + '-host';
      NET.peerSlots.set(hostId, 0);
      const connRel = NET.peer.connect(hostId, { reliable: true, label: 'rel' });
      netWireConn(connRel, false);
      const connFast = NET.peer.connect(hostId, { reliable: false, ordered: false, maxRetransmits: 0, label: 'fast' });
      netWireConn(connFast, false);
      NET._guestTimeout = setTimeout(() => {
        const pair = NET.conns.get(hostId);
        if(!pair || (!pair.rel && !pair.fast)){
          netToast('Could not find host. Check the room code.');
        }
      }, 7000);
    }
  });

  NET.peer.on('call', call => {
    call.answer(VOICE.localStream || undefined);
    voiceWireCall(call);
  });

  NET.peer.on('error', e => {
    const t = String(e.type || e.message || 'error').toLowerCase();
    if(usingCustom && (t.includes('server-error') || t.includes('socket-error') || t.includes('network') || t.includes('failed') || t.includes('could not connect'))){
      if(fallbackTimer){ clearTimeout(fallbackTimer); fallbackTimer = null; }
      netToast('Custom server error. Switching to public cloud…');
      netConnectPeer(room, isHost, true);
      return;
    }
    if(t.includes('peer-unavailable')){
      netToast('Host not found. Room may be closed.');
    } else if(t.includes('unavailable-id')){
      netToast('Room code already in use. Please try again.');
    } else {
      netToast('Network: ' + t.slice(0, 50));
    }
  });

  NET.peer.on('disconnected', () => {
    try{ NET.peer.reconnect(); }catch(e){}
  });

  NET.peer.on('close', () => {
    netToast('Online session ended');
    netLeaveRoom();
  });
}

function netWireConn(conn, isHostSide){
  const peerId = conn.peer;
  const pair = getOrCreateConnPair(peerId);
  const isFast = (conn.label === 'fast');
  if(isFast) pair.fast = conn;
  else pair.rel = conn;

  const onReady = () => {
    if(NET._guestTimeout){ clearTimeout(NET._guestTimeout); NET._guestTimeout = null; }
    if(!isHostSide && !isFast){
      conn.send({ t: 'hello', ctrl: NET.myCtrl || 'WASD' });
      netToast('Connected to host! Syncing menu…');
      if(VOICE.enabled && VOICE.localStream){
        conn.send({ t: 'voice_req', peerId: NET.myId, hasStream: true });
      }
    } else if(isHostSide && !isFast){
      netToast('Guest connected!');
      if(VOICE.enabled && VOICE.localStream){
        setTimeout(() => voiceCallPeer(peerId, false), 500);
      }
    }
  };

  if(conn.open){
    onReady();
  } else {
    conn.on('open', onReady);
  }

  conn.on('data', d => netOnData(d, conn));

  conn.on('close', () => {
    if(isFast) pair.fast = null;
    else pair.rel = null;
    if(!pair.rel && !pair.fast){
      NET.conns.delete(peerId);
      if(NET.isHost){
        for(let i=1; i<8; i++){
          const ent = NET.hostInputs.get(i);
          if(ent && ent.owner === peerId){
            NET.hostInputs.delete(i);
            NET.peerSlots.delete(peerId);
            _remoteTargets.delete(i);
            menu.slotColor[i] = -1;
            NET.slotsReady[i] = false;
            if(match && match.players){
              const idx = match.players.findIndex(p => p.slot === i);
              if(idx !== -1){
                match.players.splice(idx, 1);
                if(match.tags) match.tags.splice(idx, 1);
                if(match.it >= match.players.length) match.it = 0;
              }
            }
            break;
          }
        }
        netBroadcastSettings();
        netBroadcastRoster();
        netToast('A player left the room');
      } else {
        netToast('Host left. Room closed.');
        netLeaveRoom();
      }
    }
  });

  conn.on('error', () => {});
}

function netOnData(m, c){
  if(!m || !m.t) return;
  if(m.t === 'hello' && NET.isHost){
    let slot = -1;
    for(let i=1; i<8; i++){
      if(!NET.hostInputs.has(i) && menu.slotColor[i] === -1){
        slot = i;
        break;
      }
    }
    if(slot === -1){
      c.send({ t: 'full' });
      return;
    }
    NET.hostInputs.set(slot, { dir:0, jumpEdge:false, jumpHeld:false, downHeld:false, consumeEdge:false, owner: c.peer, seq: 0 });
    NET.peerSlots.set(c.peer, slot);
    NET.slotsCtrl[slot] = m.ctrl || 'WASD';
    NET.slotsReady[slot] = false;

    // Pick first available color
    const taken = menu.slotColor.filter(v => v >= 0);
    let pick = -1;
    for(let pi=0; pi<PALETTE.length; pi++){
      if(!taken.includes(pi)){ pick = pi; break; }
    }
    if(pick === -1) pick = slot % PALETTE.length;
    menu.slotColor[slot] = pick;

    const slotsPeer = [NET.myId || '', '', '', '', '', '', '', ''];
    for(let i=1; i<8; i++){
      const ent = NET.hostInputs.get(i);
      if(ent && ent.owner) slotsPeer[i] = ent.owner;
    }

    c.send({
      t: 'assign',
      slot: slot,
      settings: { map: settings.map, doubleJump: settings.doubleJump, collision: settings.collision, teams: settings.teams, slotColor: menu.slotColor.slice(), slotTeam: (menu.slotTeam ? menu.slotTeam.slice() : []) },
      mapData: MAPS[settings.map % MAPS.length],
      slotsCtrl: NET.slotsCtrl.slice(),
      slotsReady: NET.slotsReady.slice(),
      slotsPeer: slotsPeer
    });

    netBroadcastSettings();
    netBroadcastRoster();
    netToast('Player joined as P' + (slot + 1));
    if(match && screen === 'game'){
      let existingP = match.players.find(p => p.slot === slot);
      if(!existingP){
        const newP = makePlayer(match.players.length, slot, pick);
        match.players.push(newP);
        match.tags.push(0);
      }
      const payload = {
        it: match.it,
        cooldownN: match.cooldown,
        matchIndex: matchIndex,
        currentThemeIdx: currentThemeIdx,
        lastStartIT: lastStartIT,
        timer: match.timer,
        state: match.state,
        cd: match.cd,
        cdT: match.cdT,
        tags: match.tags.slice(),
        players: match.players.map(p => packPlayer(p))
      };
      netSendRel(c, {
        t: 'midgame_start',
        settings: { map: settings.map, doubleJump: settings.doubleJump, collision: settings.collision, teams: settings.teams, slotColor: menu.slotColor.slice(), slotTeam: (menu.slotTeam ? menu.slotTeam.slice() : []) },
        mapData: MAPS[settings.map % MAPS.length],
        payload: payload
      });
      netToast('P' + (slot + 1) + ' joined live!');
    }
  } else if(m.t === 'midgame_start' && !NET.isHost){
    settings.map = m.settings.map | 0;
    settings.doubleJump = !!m.settings.doubleJump;
    settings.collision = !!m.settings.collision;
    if(m.settings.teams != null) settings.teams = !!m.settings.teams;
    if(m.settings.slotColor) menu.slotColor = m.settings.slotColor.slice(0, 8);
    if(m.settings.slotTeam) menu.slotTeam = m.settings.slotTeam.slice(0, 8);
    if(m.mapData) MAPS[settings.map % MAPS.length] = m.mapData;
    buildLevel();
    startMatchNetGuest(m.payload);
    if(match && m.payload){
      if(m.payload.timer != null) match.timer = m.payload.timer;
      if(m.payload.state != null) match.state = m.payload.state;
      if(m.payload.cd != null) match.cd = m.payload.cd;
      if(m.payload.cooldownN != null) match.cooldown = m.payload.cooldownN;
      if(m.payload.itTeam !== undefined) match.itTeam = m.payload.itTeam;
      if(m.payload.teamItTime) match.teamItTime = m.payload.teamItTime.slice();
      if(m.payload.tags) match.tags = m.payload.tags.slice();
      if(m.payload.players && Array.isArray(m.payload.players)){
        for(const rawP of m.payload.players){
          const pData = unpackPlayer(rawP);
          const pObj = match.players.find(p => p.slot === pData.slot);
          if(pObj){
            pObj.x = pData.x;
            pObj.y = pData.y;
            pObj.vx = pData.vx;
            pObj.vy = pData.vy;
            if(pData.slot !== NET.mySlot){
              netUpdateRemoteTarget(pData.slot, pData, pObj);
            }
          }
        }
      }
    }
    netShow(false);
    netToast('Joined match in progress!');
  } else if(m.t === 'assign' && !NET.isHost){
    NET.mySlot = m.slot;
    if(m.settings){
      settings.map = m.settings.map | 0;
      settings.doubleJump = !!m.settings.doubleJump;
      settings.collision = !!m.settings.collision;
      if(m.settings.teams != null) settings.teams = !!m.settings.teams;
      if(m.settings.slotColor) menu.slotColor = m.settings.slotColor.slice(0, 8);
      if(m.settings.slotTeam) menu.slotTeam = m.settings.slotTeam.slice(0, 8);
    }
    if(m.mapData) MAPS[settings.map % MAPS.length] = m.mapData;
    if(m.slotsCtrl) NET.slotsCtrl = m.slotsCtrl.slice();
    if(m.slotsReady) NET.slotsReady = m.slotsReady.slice();
    if(m.slotsPeer && Array.isArray(m.slotsPeer)){
      for(let s=0; s<m.slotsPeer.length; s++){
        if(m.slotsPeer[s]) NET.peerSlots.set(m.slotsPeer[s], s);
      }
    }
    buildLevel();
    netShow(false);
    netToast('Connected as P' + (m.slot + 1) + '! Pick controls & click Ready.');
  } else if(m.t === 'roster_sync'){
    if(m.slotsCtrl) NET.slotsCtrl = m.slotsCtrl.slice();
    if(m.slotsReady) NET.slotsReady = m.slotsReady.slice();
    if(m.slotColor){
      menu.slotColor = m.slotColor.slice(0, 8);
      buildLevel();
    }
    if(m.slotTeam) menu.slotTeam = m.slotTeam.slice(0, 8);
    if(m.slotsPeer && Array.isArray(m.slotsPeer)){
      for(let s=0; s<m.slotsPeer.length; s++){
        const pid = m.slotsPeer[s];
        if(pid){
          NET.peerSlots.set(pid, s);
          if(VOICE.enabled && VOICE.localStream && pid !== NET.myId && !VOICE.peers.has(pid)){
            if(NET.myId > pid) voiceCallPeer(pid, false);
          }
        }
      }
    }
  } else if(m.t === 'team'){
    if(NET.isHost){
      if(m.slot >= 0 && m.slot < 8 && m.team != null){
        if(!menu.slotTeam) menu.slotTeam = [0, 1, 0, 1, 0, 1, 0, 1];
        menu.slotTeam[m.slot] = m.team;
        netBroadcastRoster();
      }
    }
  } else if(m.t === 'ready'){
    if(NET.isHost){
      if(m.slot >= 0 && m.slot < 8){
        NET.slotsReady[m.slot] = !!m.ready;
        netBroadcastRoster();
      }
    }
  } else if(m.t === 'ctrl'){
    if(NET.isHost){
      if(m.slot >= 0 && m.slot < 8 && m.ctrl){
        NET.slotsCtrl[m.slot] = m.ctrl;
        netBroadcastRoster();
      }

        netBroadcastRoster();

  } else if(m.t === 'settings' && !NET.isHost){
    if(m.mapData) MAPS[settings.map % MAPS.length] = m.mapData;
    settings.map = m.settings.map | 0;
    settings.doubleJump = !!m.settings.doubleJump;
    settings.collision = !!m.settings.collision;
    if(m.settings.teams != null) settings.teams = !!m.settings.teams;
    if(m.settings.slotColor) menu.slotColor = m.settings.slotColor.slice(0, 8);
    if(m.settings.slotTeam) menu.slotTeam = m.settings.slotTeam.slice(0, 8);
    buildLevel();
  } else if(m.t === 'p_state' && NET.isHost){
    const slot = m.s != null ? m.s : m.slot;
    if(slot === NET.mySlot || slot === 0) return;
    const pData = unpackPlayer(m);
    let pObj = (match && match.players) ? match.players.find(p => p.slot === slot) : null;
    if(!pObj && match && match.players){
      const col = (menu.slotColor[slot] >= 0) ? menu.slotColor[slot] : (slot % PALETTE.length);
      pObj = makePlayer(match.players.length, slot, col);
      pObj.x = pData.x;
      pObj.y = pData.y;
      match.players.push(pObj);
      if(match.tags.length < match.players.length) match.tags.push(0);
    }
    netUpdateRemoteTarget(slot, pData, pObj);
  } else if(m.t === 'tag_claim' && NET.isHost){
    if(match && match.state === 'playing' && match.cooldown <= 0){
      const P = match.players;
      const hunterIdx = P.findIndex(p => p.slot === m.from);
      if(hunterIdx !== -1){
        const hunterP = P[hunterIdx];
        const isHunter = settings.teams ? (hunterP.team === match.itTeam) : (hunterIdx === match.it);
        if(isHunter){
          const targetIdx = P.findIndex(p => p.slot === m.target);
          if(targetIdx !== -1){
            const tgtP = P[targetIdx];
            const canTag = settings.teams ? (tgtP.team !== match.itTeam) : (targetIdx !== match.it);
            if(canTag && tgtP){
              const distSq = (hunterP.x - tgtP.x)**2 + (hunterP.y - tgtP.y)**2;
              if(distSq < 45000){ // within ~212px strike reach factoring latency
