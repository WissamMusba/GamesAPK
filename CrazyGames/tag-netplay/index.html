/* ================= netplay (host-authoritative P2P) ================= */
const CTRL_SCHEMES = ['WASD', 'Arrows', 'IJKL', 'TFGH', 'Controller'];

const NET = {
  peer: null,
  conns: new Map(), // peerId -> conn
  role: null, // 'host' | 'guest' | null
  room: '',
  myId: '',
  mySlot: -1,
  isHost: false,
  myCtrl: 'WASD',
  slotsCtrl: ['WASD', 'Arrows', 'IJKL', 'TFGH'],
  slotsReady: [false, false, false, false],
  tick: 0,
  seq: 0,
  hostInputs: new Map(),
  guestPrev: null,
  guestNext: null,
  lastRecvT: 0,
  last3: [],
  _startLock: 0,
  _guestTimeout: null
};

function netToast(m){
  toast(m);
  const t = document.getElementById('netToast');
  if(!t) return;
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, 2800);
}

function netShow(on){
  const el = document.getElementById('netUI');
  if(el) el.classList.toggle('on', !!on);
}

function netLink(room){
  let p = location.pathname;
  if(p.endsWith('/')){ /* keep */ }
  else if(/\/[^\/]+\.[a-z]+$/i.test(p)) p = p.replace(/\/[^\/]*$/, '/');
  else p = p + '/';
  return location.origin + p + '?room=' + room.toUpperCase();
}

function netCopyLink(){
  const l = netLink(NET.room);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(l).then(() => netToast('Invite link copied! Send it to your friend.')).catch(() => prompt('Copy invite link:', l));
  } else {
    prompt('Copy invite link:', l);
  }
}

function netMakeCode(){
  const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0; i<6; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}

/* Sample controls based on player's chosen scheme */
function sampleControls(scheme){
  let dir = 0, jumpEdge = false, jumpHeld = false, downHeld = false;
  if(scheme === 'WASD'){
    const L = keys.has('KeyA') || keys.has('KeyQ');
    const R = keys.has('KeyD');
    dir = (R ? 1 : 0) - (L ? 1 : 0);
    jumpEdge = pressed.has('KeyW') || pressed.has('Space');
    jumpHeld = keys.has('KeyW') || keys.has('Space');
    downHeld = keys.has('KeyS');
  } else if(scheme === 'Arrows'){
    const L = keys.has('ArrowLeft');
    const R = keys.has('ArrowRight');
    dir = (R ? 1 : 0) - (L ? 1 : 0);
    jumpEdge = pressed.has('ArrowUp') || pressed.has('Space');
    jumpHeld = keys.has('ArrowUp') || keys.has('Space');
    downHeld = keys.has('ArrowDown');
  } else if(scheme === 'IJKL'){
    const L = keys.has('KeyJ');
    const R = keys.has('KeyL');
    dir = (R ? 1 : 0) - (L ? 1 : 0);
    jumpEdge = pressed.has('KeyI');
    jumpHeld = keys.has('KeyI');
    downHeld = keys.has('KeyK');
  } else if(scheme === 'TFGH'){
    const L = keys.has('KeyF');
    const R = keys.has('KeyH');
    dir = (R ? 1 : 0) - (L ? 1 : 0);
    jumpEdge = pressed.has('KeyT');
    jumpHeld = keys.has('KeyT');
    downHeld = keys.has('KeyG');
  } else if(scheme === 'Controller'){
    for(let pi=0; pi<4; pi++){
      const pd = PAD[pi];
      if(pd && pd.connected){
        dir = (pd.right ? 1 : 0) - (pd.left ? 1 : 0);
        jumpEdge = pd.jumpE;
        jumpHeld = pd.jumpHeld;
        downHeld = pd.dropHeld;
        break;
      }
    }
  }
  // Allow connected controller to drive any scheme seamlessly
  for(let pi=0; pi<4; pi++){
    const pd = PAD[pi];
    if(pd && pd.connected){
      if(pd.left) dir = -1;
      if(pd.right) dir = 1;
      if(pd.jumpE) jumpEdge = true;
      if(pd.jumpHeld) jumpHeld = true;
      if(pd.dropHeld) downHeld = true;
      break;
    }
  }
  return { dir: clamp(dir, -1, 1), jumpEdge: !!jumpEdge, jumpHeld: !!jumpHeld, downHeld: !!downHeld };
}

/* Input shim: host runs local input for slot 0 (or its own slot); guest inputs are buffered */
const _inputFor = inputFor;
function inputForNet(p){
  if(NET.role !== null){
    if(NET.isHost){
      const slot = p.slot;
      if(slot === NET.mySlot || slot === 0){
        return sampleControls(NET.myCtrl || 'WASD');
      }
      const ext = NET.hostInputs.get(slot);
      if(ext){
        const out = { dir: ext.dir, jumpEdge: !!ext.consumeEdge, jumpHeld: !!ext.jumpHeld, downHeld: !!ext.downHeld };
        if(ext.consumeEdge) ext.consumeEdge = false;
        return { dir: clamp(out.dir, -1, 1), jumpEdge: out.jumpEdge, jumpHeld: out.jumpHeld, downHeld: out.downHeld };
      }
      return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
    } else {
      if(p.slot === NET.mySlot){
        return sampleControls(NET.myCtrl || 'WASD');
      }
      return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
    }
  }
  return _inputFor(p);
}
inputFor = inputForNet;

/* PeerJS connect */
function netConnectPeer(room, isHost){
  if(NET.peer){
    try{ NET.peer.destroy(); }catch(e){}
    NET.peer = null;
  }
  const cleanRoom = room.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6);
  const id = 'tag-' + cleanRoom + (isHost ? '-host' : '-g' + Math.floor(Math.random() * 1e6));
  NET.peer = new Peer(id, { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
  
  NET.peer.on('open', id2 => {
    NET.myId = id2;
    if(isHost){
      NET.peer.on('connection', c => netWireConn(c, true));
      netToast('Hosting room ' + room.toUpperCase() + '! Link copied.');
      setTimeout(() => { netBroadcastSettings(); netBroadcastRoster(); }, 400);
    } else {
      const conn = NET.peer.connect('tag-' + cleanRoom + '-host', { reliable: true });
      netWireConn(conn, false);
      NET._guestTimeout = setTimeout(() => {
        if(!NET.conns.has(conn.peer)){
          netToast('Could not find host. Check the room code.');
        }
      }, 7000);
    }
  });

  NET.peer.on('error', e => {
    const t = String(e.type || e.message || 'error').toLowerCase();
    if(t.includes('peer-unavailable')){
      netToast('Host not found. Room may be closed.');
    } else if(t.includes('unavailable-id')){
      netToast('Room code already in use. Please try again.');
    } else {
      netToast('Network: ' + t.slice(0, 50));
    }
  });

  NET.peer.on('disconnected', () => {
    try{ NET.peer.reconnect(); }catch(e){}
  });

  NET.peer.on('close', () => {
    netToast('Online session ended');
    netLeaveRoom();
  });
}

function netWireConn(conn, isHostSide){
  const onReady = () => {
    if(NET._guestTimeout){ clearTimeout(NET._guestTimeout); NET._guestTimeout = null; }
    NET.conns.set(conn.peer, conn);
    if(!isHostSide){
      conn.send({ t: 'hello', ctrl: NET.myCtrl || 'Arrows' });
      netToast('Connected to host! Syncing menu…');
    } else {
      netToast('Guest connected!');
    }
  };

  if(conn.open){
    onReady();
  } else {
    conn.on('open', onReady);
  }

  conn.on('data', d => netOnData(d, conn));

  conn.on('close', () => {
    NET.conns.delete(conn.peer);
    if(NET.isHost){
      for(let i=1; i<4; i++){
        const ent = NET.hostInputs.get(i);
        if(ent && ent.owner === conn.peer){
          NET.hostInputs.delete(i);
          menu.slotColor[i] = -1;
          NET.slotsReady[i] = false;
          break;
        }
      }
      netBroadcastSettings();
      netBroadcastRoster();
      netToast('A player left the room');
    } else {
      netToast('Host left. Room closed.');
      netLeaveRoom();
    }
  });

  conn.on('error', () => {});
}

function netOnData(m, c){
  if(!m || !m.t) return;
  if(m.t === 'hello' && NET.isHost){
    let slot = -1;
    for(let i=1; i<4; i++){
      if(!NET.hostInputs.has(i) && menu.slotColor[i] === -1){
        slot = i;
        break;
      }
    }
    if(slot === -1){
      c.send({ t: 'full' });
      return;
    }
    NET.hostInputs.set(slot, { dir:0, jumpEdge:false, jumpHeld:false, downHeld:false, consumeEdge:false, owner: c.peer, seq: 0 });
    NET.slotsCtrl[slot] = m.ctrl || 'Arrows';
    NET.slotsReady[slot] = false;

    // Pick first available color
    const taken = menu.slotColor.filter(v => v >= 0);
    let pick = -1;
    for(let pi=0; pi<PALETTE.length; pi++){
      if(!taken.includes(pi)){ pick = pi; break; }
    }
    if(pick === -1) pick = slot % PALETTE.length;
    menu.slotColor[slot] = pick;

    c.send({
      t: 'assign',
      slot: slot,
      settings: { map: settings.map, doubleJump: settings.doubleJump, collision: settings.collision, slotColor: menu.slotColor.slice() },
      mapData: MAPS[settings.map % MAPS.length],
      slotsCtrl: NET.slotsCtrl.slice(),
      slotsReady: NET.slotsReady.slice()
    });

    netBroadcastSettings();
    netBroadcastRoster();
    netToast('Player joined as P' + (slot + 1));
    if(match && screen === 'game'){
      startMatch();
    }
  } else if(m.t === 'assign' && !NET.isHost){
    NET.mySlot = m.slot;
    if(m.settings){
      settings.map = m.settings.map | 0;
      settings.doubleJump = !!m.settings.doubleJump;
      settings.collision = !!m.settings.collision;
      menu.slotColor = m.settings.slotColor.slice(0, 4);
    }
    if(m.mapData) MAPS[settings.map % MAPS.length] = m.mapData;
    if(m.slotsCtrl) NET.slotsCtrl = m.slotsCtrl.slice();
    if(m.slotsReady) NET.slotsReady = m.slotsReady.slice();
    buildLevel();
    netShow(false);
    netToast('Connected as P' + (m.slot + 1) + '! Pick controls & click Ready.');
  } else if(m.t === 'roster_sync'){
    if(m.slotsCtrl) NET.slotsCtrl = m.slotsCtrl.slice();
    if(m.slotsReady) NET.slotsReady = m.slotsReady.slice();
    if(m.slotColor){
      menu.slotColor = m.slotColor.slice(0, 4);
      buildLevel();
    }
  } else if(m.t === 'ready'){
    if(NET.isHost){
      if(m.slot >= 0 && m.slot < 4){
        NET.slotsReady[m.slot] = !!m.ready;
        netBroadcastRoster();
      }
    }
  } else if(m.t === 'ctrl'){
    if(NET.isHost){
      if(m.slot >= 0 && m.slot < 4 && m.ctrl){
        NET.slotsCtrl[m.slot] = m.ctrl;
        netBroadcastRoster();
      }
    }
  } else if(m.t === 'color'){
    if(NET.isHost){
      if(m.slot >= 0 && m.slot < 4 && m.color >= 0){
        menu.slotColor[m.slot] = m.color;
        buildLevel();
        netBroadcastSettings();
        netBroadcastRoster();
      }
    }
  } else if(m.t === 'settings' && !NET.isHost){
    if(m.mapData) MAPS[settings.map % MAPS.length] = m.mapData;
    settings.map = m.settings.map | 0;
    settings.doubleJump = !!m.settings.doubleJump;
    settings.collision = !!m.settings.collision;
    menu.slotColor = m.settings.slotColor.slice(0, 4);
    buildLevel();
  } else if(m.t === 'input' && NET.isHost){
    const ent = NET.hostInputs.get(m.slot);
    if(!ent || ent.owner !== c.peer) return;
    if(m.inputs && Array.isArray(m.inputs)){
      for(const inp of m.inputs){
        if(!inp || inp.seq <= ent.seq) continue;
        ent.seq = inp.seq; ent.dir = inp.dir | 0; ent.jumpHeld = !!inp.jumpHeld; ent.downHeld = !!inp.downHeld;
        if(inp.jumpEdge) ent.consumeEdge = true;
      }
    } else {
      if(m.seq <= ent.seq) return;
      ent.seq = m.seq; ent.dir = m.dir | 0; ent.jumpHeld = !!m.jumpHeld; ent.downHeld = !!m.downHeld;
      if(m.jumpEdge) ent.consumeEdge = true;
    }
  } else if(m.t === 'state' && !NET.isHost){
    NET.lastRecvT = performance.now();
    if(m.settings){
      settings.map = m.settings.map; settings.doubleJump = m.settings.doubleJump; settings.collision = m.settings.collision;
    }
    NET.guestPrev = NET.guestNext || m;
    NET.guestNext = m;
  } else if(m.t === 'start' && !NET.isHost){
    settings.map = m.settings.map | 0;
    settings.doubleJump = !!m.settings.doubleJump;
    settings.collision = !!m.settings.collision;
    menu.slotColor = m.settings.slotColor.slice(0, 4);
    if(m.mapData) MAPS[settings.map % MAPS.length] = m.mapData;
    buildLevel();
    startMatchNetGuest(m.payload);
    netShow(false);
  } else if(m.t === 'to_menu' && !NET.isHost){
    match = null;
    screen = 'menu';
  } else if(m.t === 'full'){
    netToast('Room is full (4 players)');
    netLeaveRoom();
  } else if(m.t === 'toast'){
    netToast(m.msg || '');
  }
}

function netBroadcastSettings(){
  if(!NET.isHost) return;
  const payload = { settings: { map: settings.map, doubleJump: settings.doubleJump, collision: settings.collision, slotColor: menu.slotColor.slice() }, mapData: MAPS[settings.map % MAPS.length] };
  for(const c of NET.conns.values()){ try{ c.send({ t: 'settings', settings: payload.settings, mapData: payload.mapData }); }catch(e){} }
}

function netBroadcastRoster(){
  if(!NET.isHost) return;
  const msg = {
    t: 'roster_sync',
    slotsCtrl: NET.slotsCtrl.slice(),
    slotsReady: NET.slotsReady.slice(),
    slotColor: menu.slotColor.slice()
  };
  for(const c of NET.conns.values()){ try{ c.send(msg); }catch(e){} }
}

function netBroadcastState(state){
  for(const c of NET.conns.values()){ try{ c.send({ t: 'state', ...state }); }catch(e){} }
}

function netToggleMyReady(){
  if(NET.role === null) return;
  const mySlot = NET.mySlot;
  if(mySlot < 0 || mySlot >= 4) return;
  const newReady = !NET.slotsReady[mySlot];
  NET.slotsReady[mySlot] = newReady;
  sfx('ui');
  if(NET.isHost){
    netBroadcastRoster();
  } else {
    for(const c of NET.conns.values()){
      try{ c.send({ t: 'ready', slot: mySlot, ready: newReady }); }catch(e){}
    }
  }
}

function netCycleMyControl(){
  const curIdx = CTRL_SCHEMES.indexOf(NET.myCtrl);
  const nextScheme = CTRL_SCHEMES[(curIdx + 1) % CTRL_SCHEMES.length];
  NET.myCtrl = nextScheme;
  sfx('ui');
  const mySlot = NET.mySlot;
  if(mySlot >= 0 && mySlot < 4){
    NET.slotsCtrl[mySlot] = nextScheme;
    if(NET.isHost){
      netBroadcastRoster();
    } else {
      for(const c of NET.conns.values()){
        try{ c.send({ t: 'ctrl', slot: mySlot, ctrl: nextScheme }); }catch(e){}
      }
    }
  }
}

function netCycleMyColor(d){
  if(NET.role === null || NET.isHost) return;
  const slot = NET.mySlot;
  if(slot < 0) return;
  const taken = menu.slotColor.filter((c, k) => c >= 0 && k !== slot);
  const list = PALETTE.map((p, idx) => idx).filter(idx => taken.indexOf(idx) < 0);
  if(list.length === 0) return;
  let cur = list.indexOf(menu.slotColor[slot]);
  cur = (cur + d + list.length) % list.length;
  menu.slotColor[slot] = list[cur];
  buildLevel();
  sfx('ui');
  for(const c of NET.conns.values()){
    try{ c.send({ t: 'color', slot: slot, color: list[cur] }); }catch(e){}
  }
}

function netHostAction(){
  const code = netMakeCode();
  NET.role = 'host';
  NET.isHost = true;
  NET.room = code;
  NET.mySlot = 0;
  NET.myCtrl = 'WASD';
  NET.slotsCtrl[0] = 'WASD';
  NET.slotsReady = [false, false, false, false];
  menu.mode = 'rows';
  menu.slotColor = [menu.slotColor[0] >= 0 ? menu.slotColor[0] : 0, -1, -1, -1];
  history.replaceState(null, '', '?room=' + code);
  
  netCopyLink();
  netConnectPeer(code, true);
  netShow(false);
}

function netJoinAction(codeParam){
  let code = codeParam;
  if(!code){
    const el = document.getElementById('netCode');
    if(el) el.value = '';
    netShow(true);
    if(el) el.focus();
    return;
  }
  if(code.includes('room=')){
    try{
      const u = new URL(code);
      code = u.searchParams.get('room') || '';
    }catch(e){
      const m = code.match(/room=([A-Za-z0-9]+)/);
      if(m) code = m[1];
    }
  }
  code = code.replace(/[^A-Za-z0-9]/g, '').slice(0, 6).toUpperCase();
  if(code.length < 4){
    netToast('Enter a 6-letter room code');
    return;
  }
  NET.role = 'guest';
  NET.isHost = false;
  NET.room = code;
  NET.mySlot = -1;
  NET.myCtrl = 'Arrows';
  NET.slotsReady = [false, false, false, false];
  menu.mode = 'rows';
  history.replaceState(null, '', '?room=' + code);
  netShow(false);
  netToast('Joining room ' + code + '…');
  netConnectPeer(code, false);
}

function netLeaveRoom(){
  if(NET.peer){
    try{ NET.peer.destroy(); }catch(e){}
    NET.peer = null;
  }
  NET.conns.clear();
  NET.role = null;
  NET.room = '';
  NET.mySlot = -1;
  NET.isHost = false;
  NET.hostInputs.clear();
  NET.slotsReady = [false, false, false, false];
  menu.slotColor = [0, 2, -1, -1];
  history.replaceState(null, '', location.pathname);
  netShow(false);
  netToast('Playing offline');
}

/* Match bootstrap wrappers */
function startMatchNetGuest(p){
  if(p.matchIndex != null) matchIndex = p.matchIndex;
  if(p.currentThemeIdx != null) currentThemeIdx = p.currentThemeIdx;
  if(p.lastStartIT != null) lastStartIT = p.lastStartIT;
  const act = activeSlots();
  buildLevel();
  const players = act.map((slot, i) => makePlayer(i, slot, menu.slotColor[slot]));
  match = {
    state: 'countdown', cd: 3, cdT: 0, timer: settings.time, lastTick: settings.time, it: p.it, cooldown: p.cooldownN,
    goFlash: 0, freeze: 0, shake: 0, flash: 0, fade: 0.6, tagPop: null, resultT: 0,
    tags: players.map(() => 0), hintT: 7, players: players, result: null, pausedFrom: null, pauseSel: 0,
    mapToast: MAPS[settings.map % MAPS.length].name, mapToastT: 2.5
  };
  screen = 'game';
  sfx('count');
  netShow(false);
}

/* Host physics + net tick */
let _netStateT = 0, _netInputT = 0;
function netTick(dt){
  if(NET.role === null) return;
  if(NET.isHost){
    // send state 20/s (host authoritative)
    _netStateT += dt;
    if(_netStateT >= 0.05 && match){
      _netStateT = 0;
      const players = match.players.map(p => ({
        x: p.x, y: p.y, vx: p.vx, vy: p.vy, face: p.face, sx: p.sx, sy: p.sy,
        landT: p.landT, tagT: p.tagT, padOn: p.padOn, blink: p.blink
      }));
      netBroadcastState({
        players: players,
        it: match.it,
        cooldown: match.cooldown,
        timer: match.timer,
        payloadTagPop: match.tagPop,
        state: match.state,
        cd: match.cd,
        cdT: match.cdT,
        goFlash: match.goFlash,
        freeze: match.freeze,
        shake: match.shake,
        flash: match.flash,
        result: match.result,
        resultT: match.resultT,
        tags: match.tags.slice(),
        tick: NET.tick++,
        settings: { map: settings.map, doubleJump: settings.doubleJump, collision: settings.collision }
      });
    }
  } else {
    // guest: send input 30/s using chosen control scheme
    if(NET.mySlot === -1) return;
    _netInputT += dt;
    if(_netInputT >= 0.033){
      _netInputT = 0;
      const inp = sampleControls(NET.myCtrl || 'WASD');
      const cur = { dir: inp.dir, jumpEdge: inp.jumpEdge, jumpHeld: inp.jumpHeld, downHeld: inp.downHeld, seq: ++NET.seq };
      NET.last3.push(cur);
      if(NET.last3.length > 3) NET.last3.shift();
      for(const c of NET.conns.values()){
        try{ c.send({ t: 'input', slot: NET.mySlot, inputs: NET.last3.slice() }); }catch(e){}
      }
    }
  }
}

/* Guest interpolation: blend host players locally for smooth render */
function netGuestInterpolate(){
  if(NET.role === null || NET.isHost) return;
  if(!match || !NET.guestNext) return;
  const nxt = NET.guestNext, prv = NET.guestPrev && NET.guestPrev.players ? NET.guestPrev : nxt;
  const k = 0.35;
  for(let i=0; i<match.players.length && i<nxt.players.length; i++){
    const p = match.players[i], a = nxt.players[i];
    p.x += (a.x - p.x) * k; p.y += (a.y - p.y) * k; p.vx = a.vx; p.vy = a.vy; p.face = a.face; p.sx = a.sx; p.sy = a.sy; p.landT = a.landT; p.tagT = a.tagT;
  }
  match.it = nxt.it; match.cooldown = nxt.cooldown; match.timer = nxt.timer;
  
  if(nxt.state){
    if(match.state !== nxt.state){
      if(nxt.state === 'playing') sfx('go');
      if(nxt.state === 'result'){ confetti(); sfx('win'); }
    }
    match.state = nxt.state;
  }
  if(nxt.cd != null) match.cd = nxt.cd;
  if(nxt.cdT != null) match.cdT = nxt.cdT;
  if(nxt.goFlash != null) match.goFlash = nxt.goFlash;
  if(nxt.result) match.result = nxt.result;
  if(nxt.resultT != null) match.resultT = nxt.resultT;
  if(nxt.tags) match.tags = nxt.tags.slice();
  if(nxt.shake && nxt.shake > match.shake) match.shake = nxt.shake;
  if(nxt.flash && nxt.flash > match.flash) match.flash = nxt.flash;
  
  if(nxt.payloadTagPop){
    if(!match.tagPop) sfx('tag');
    match.tagPop = nxt.payloadTagPop;
  }
}

/* Modal UI wiring */
function netInitUI(){
  const joinGo = document.getElementById('netJoinGo'),
    closeBtn = document.getElementById('netClose'),
    codeEl = document.getElementById('netCode');

  if(joinGo){
    joinGo.onclick = () => {
      const v = codeEl ? codeEl.value.trim() : '';
      if(v) netJoinAction(v);
    };
  }
  if(closeBtn){
    closeBtn.onclick = () => netShow(false);
  }
  if(codeEl){
    codeEl.onkeydown = e => {
      if(e.key === 'Enter'){
        const v = codeEl.value.trim();
        if(v) netJoinAction(v);
      } else if(e.key === 'Escape'){
        netShow(false);
      }
    };
  }

  // Check URL ?room= parameter on boot -> auto-joins immediately!
  const qp = new URLSearchParams(location.search);
  const roomQ = (qp.get('room') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 6).toUpperCase();
  if(roomQ){
    netJoinAction(roomQ);
  }
}

/* ================= main loop ================= */
function render(){
  zones.length=0;
  g.setTransform(DPR,0,0,DPR,0,0);
  if(NET.role!==null && NET.isHost && match && screen==='game'){
    // small host badge
    g.save();g.font='700 12px Outfit,system-ui,sans-serif';g.fillStyle='rgba(255,176,32,0.95)';g.fillText('HOST • '+NET.room.toUpperCase(),CW-12,18);g.textAlign='right';g.restore();
  }
  if(NET.role!==null && !NET.isHost && match && screen==='game'){
    g.save();g.font='700 12px Outfit,system-ui,sans-serif';g.fillStyle='rgba(0,210,211,0.95)';g.fillText('GUEST • '+NET.room.toUpperCase(),CW-12,18);g.textAlign='right';g.restore();
  }
  if(screen==='menu')drawMenu();
  else if(match)drawGame();
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(now-last)/1000);
  last=now;tGlobal+=dt;
  
  // Global gamepad polling for every client
  pollGamepads();

  // netplay: host fixed sim + guest input/state
  if(NET.role!==null){
    if(NET.isHost){
      // host simulation
    } else {
      // guests interpolate host state before render
      netGuestInterpolate();
    }
    netTick(dt);
  }
  try{
    if(NET.role!==null && !NET.isHost && match){
      updateCam(dt); updateParts(dt);
      if(match.tagPop){ match.tagPop.t-=dt; if(match.tagPop.t<=0) match.tagPop=null; }
      match.goFlash=Math.max(0,(match.goFlash||0)-dt);
      match.flash=Math.max(0,(match.flash||0)-dt);
      match.fade=Math.max(0,(match.fade||0)-dt);
      match.shake=(match.shake||0)*Math.exp(-dt*7);
      if(match.state==='result'){ match.resultT=(match.resultT||0)+dt; }
    } else {
      update(dt);
    }
    render();
  }catch(err){}
  pressed.clear();
}
syncCustomMaps();
/* Editor launch: tag_map_editor.html "Full Game" stores the map you're viewing
   plus default 2P settings; the game jumps straight into that match. */
try{
  const raw=localStorage.getItem('tag_arena_launch_v1');
  if(raw){
    localStorage.removeItem('tag_arena_launch_v1');
    const L=JSON.parse(raw);
    if(Number.isInteger(L.map)&&L.map>=0&&L.map<MAPS.length)settings.map=L.map;
    settings.doubleJump=L.doubleJump!==false;
    settings.collision=!!L.collision;
    if(L.slots&&L.slots.length>=2)menu.slotColor=L.slots.slice(0,4);
    menu.mode='rows';
    startMatch();
  }
}catch(e){/* normal menu boot */}
buildLevel();
netInitUI();
requestAnimationFrame(frame);
</script>
