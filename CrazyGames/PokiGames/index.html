<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0f16;font-family:'Outfit','Rubik',system-ui,sans-serif}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;outline:none;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:none;-webkit-touch-callout:none}
/* ---- netplay join modal (optional, only when manual code entry is clicked) ---- */
#netUI{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,8,13,0.85);backdrop-filter:blur(4px);font-family:'Outfit','Rubik',system-ui,sans-serif}
#netUI.on{display:flex}
#netCard{background:#141b28;border:2px solid #2a3550;border-radius:16px;padding:24px 28px;max-width:min(400px,92vw);width:100%;text-align:center;color:#eef3fa;box-shadow:0 16px 60px rgba(0,0,0,0.7)}
#netCard h2{margin:0 0 6px;font-size:22px;letter-spacing:1px}
#netCard h2 span{color:#2ecc71}
#netCard p{margin:6px 0 14px;font-size:14px;color:#9fb0c9;line-height:1.5}
#netCard .row{display:flex;gap:10px;margin-top:14px}
#netCard button{flex:1;background:#1a2334;color:#eef3fa;border:1px solid #2a3550;border-radius:8px;padding:11px 10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.15s}
#netCard button:hover{background:#232f47}
#netCard button.go{background:#27ae60;border-color:#2ecc71}
#netCard button.go:hover{background:#2ecc71}
#netCard input{width:100%;box-sizing:border-box;background:#0e1420;color:#eef3fa;border:1px solid #2a3550;border-radius:8px;padding:12px;font-size:17px;text-align:center;letter-spacing:3px;text-transform:uppercase;font-family:Consolas,monospace}
#netCard input:focus{outline:none;border-color:#2ecc71}
#netToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:rgba(10,14,22,0.95);border:2px solid #2ecc71;color:#ffffff;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;display:none;pointer-events:none;font-family:'Outfit',system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,0.6)}

/* In-game text chat overlay */
#chatUI{position:fixed;left:16px;bottom:16px;z-index:45;width:min(340px,85vw);display:none;flex-direction:column;pointer-events:none;font-family:'Outfit','Rubik',system-ui,sans-serif}
#chatUI.online{display:flex}
#chatUI.active{pointer-events:auto}
#chatLogs{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:6px;scrollbar-width:none}
#chatLogs::-webkit-scrollbar{display:none}
.chatMsg{background:none!important;border:none!important;backdrop-filter:none!important;padding:1px 0;font-size:13px;color:#ffffff;line-height:1.35;word-break:break-word;display:inline-block;max-width:100%;box-sizing:border-box;animation:chatFade 0.2s ease-out;text-shadow:0 1px 3px rgba(0,0,0,0.95), 0 0 2px #000000, 0 2px 4px #000000}
.chatMsg .author{font-weight:900;margin-right:6px}
.chatMsg.sys{color:#facc15;font-weight:800}
#chatCornerBar{display:inline-flex;align-items:center;padding:5px 12px;background:rgba(15,23,42,0.65);border:1px solid rgba(255,255,255,0.22);border-radius:14px;color:#cbd5e1;font-size:11.5px;font-weight:700;cursor:pointer;pointer-events:auto;backdrop-filter:blur(4px);width:fit-content;transition:all 0.15s;margin-top:2px;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
#chatCornerBar:hover{background:rgba(15,23,42,0.92);color:#38bdf8;border-color:#38bdf8}
#chatUI.active #chatCornerBar{display:none}
#chatInputRow{display:none;gap:6px;pointer-events:auto}
#chatUI.active #chatInputRow{display:flex}
#chatInput{flex:1;background:rgba(15,23,42,0.92);border:1.5px solid #2ecc71;color:#ffffff;border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
#chatSendBtn{background:#27ae60;color:#ffffff;border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
@media (pointer: coarse) {
  #chatCornerBar{display:none!important}
  #chatUI{left:10px;bottom:10px;width:min(280px,75vw)}
  #chatLogs{max-height:105px}
  .chatMsg{font-size:11.5px}
  #chatInput{padding:6px 10px;font-size:12px}
  #chatSendBtn{padding:6px 10px;font-size:11.5px}
}
@keyframes chatFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>

<body>
<canvas id="g"></canvas>
<!-- Netplay join modal (only shown when clicking 'JOIN ROOM' manually) -->
<div id="netUI"><div id="netCard">
  <h2>JOIN <span>ONLINE ROOM</span></h2>
  <p id="netDesc">Enter 6-letter room code or paste invite link:</p>
  <input id="netCode" maxlength="64" placeholder="ROOM CODE / LINK"/>
  <div class="row">
    <button id="netJoinGo" class="go">Join</button>
    <button id="netClose">Cancel</button>
  </div>
</div></div>
<!-- In-game Text Chat Overlay -->
<div id="chatUI">
  <div id="chatLogs"></div>
  <div id="chatCornerBar" onclick="if(typeof chatToggle==='function')chatToggle();">
    <span>💬 Type here... (Enter)</span>
  </div>
  <div id="chatInputRow">
    <input id="chatInput" maxlength="120" placeholder="Type a message (Enter)..."/>
    <button id="chatSendBtn">Send</button>
  </div>
</div>
<div id="netToast"></div>
<script>
"use strict";
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);if(r<0)r=0;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
const FT=px=>'900 '+px+'px "'+FAMILIES[fontIdx]+'",system-ui,sans-serif';
const FN=(px,w)=>(w||800)+' '+px+'px "'+FAMILIES[fontIdx]+'",system-ui,sans-serif';
const FAMILIES=['Outfit','Bebas Neue','Anton','Bangers','Black Han Sans','Luckiest Guy','Righteous','Fredoka One','Baloo 2','Nunito','Poppins','Montserrat','Titan One','Chewy','MuseoModerno','Comfortaa','Space Grotesk','Orbitron','Russo One','Staatliches'];
const PINNED_FONTIdx=8; // font #9 = Baloo 2
let fontIdx=PINNED_FONTIdx;
function cycleFont(d){ toast('Fonts locked to pinned pick #' + (PINNED_FONTIdx+1) + ' — ' + FAMILIES[PINNED_FONTIdx]); }
const INK='#141414';

const cv=document.getElementById('g'),g=cv.getContext('2d'); window.renderCtx = g;
let CW=0,CH=0,DPR=1;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

function resize(){
  const docW = (document.documentElement && document.documentElement.clientWidth) ? document.documentElement.clientWidth : (window.innerWidth || 800);
  const docH = (document.documentElement && document.documentElement.clientHeight) ? document.documentElement.clientHeight : (window.innerHeight || 600);
  const rect = cv.getBoundingClientRect();
  const rawW = (rect.width > 0 && rect.width <= docW) ? rect.width : docW;
  const rawH = (rect.height > 0 && rect.height <= docH) ? rect.height : docH;
  CW = Math.floor(Math.min(rawW, docW));
  CH = Math.floor(Math.min(rawH, docH));
  const maxDpr = isTouch ? 1.5 : 2.0;
  DPR = Math.min(maxDpr, window.devicePixelRatio || 1);
  cv.width = Math.floor(CW * DPR);
  cv.height = Math.floor(CH * DPR);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => { setTimeout(resize, 50); setTimeout(resize, 220); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
}
resize();
cv.style.touchAction='none';

function getCanvasCoords(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  const scaleX = rect.width ? (CW / rect.width) : 1;
  const scaleY = rect.height ? (CH / rect.height) : 1;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function grabFocus(){try{window.focus();}catch(e){}}
window.addEventListener('load',grabFocus);grabFocus();

/* ================= keyboard shield (laptop room code & chat typing fix) ================= */
function isInputActive(){
  const el = document.activeElement;
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
}

/* ================= input ================= */
const keys=new Set(),pressed=new Set();
const GAMEKEYS=new Set([
  'ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space',
  'KeyW','KeyA','KeyS','KeyD',
  'KeyI','KeyJ','KeyK','KeyL',
  'KeyT','KeyF','KeyG','KeyH',
  'Enter','NumpadEnter','KeyM','KeyP','KeyN','KeyB','Digit1','Digit2','Digit3','Digit4',
  'Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Tab'
]);
let scoreboardOpen=false;
function onKey(e){
  if(isInputActive()){
    // Shield all game controls while typing in room code or chat input!
    return;
  }
  if(e.code === 'Tab'){
    e.preventDefault();
    if(match && screen === 'game'){
      scoreboardOpen = !scoreboardOpen;
      sfx('ui');
    }
    return;
  }
  if(e.code === 'Enter' || e.code === 'NumpadEnter'){
    if(typeof NET !== 'undefined' && NET && NET.role !== null){
      if(typeof chatToggle === 'function'){
        e.preventDefault();
        chatToggle();
        return;
      }
    }
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(e.repeat)return;
  keys.add(e.code);pressed.add(e.code);initAudio();
}
window.addEventListener('keydown',onKey);
window.addEventListener('keyup',e=>{
  if(isInputActive()) return;
  keys.delete(e.code);
});
window.addEventListener('blur',()=>{keys.clear();touchPts.clear();});
window.addEventListener('contextmenu',e=>e.preventDefault());
const anyPressed=list=>{for(const k of list)if(pressed.has(k))return true;return false;};

/* ================= mobile touch action state ================= */
const TOUCH = {
  left: false,
  right: false,
  jumpEdge: false,
  jumpHeld: false,
  downHeld: false
};

/* ================= mobile touch joystick & dual slider system ================= */
const JOY = {
  // Left horizontal joystick (floating — spawns at touch position)
  leftId: null,
  leftStartX: 0,   // touch start anchor X
  leftStartY: 0,   // touch start anchor Y
  leftX: 0,        // -1 (left) to +1 (right), rests at 0 (center)
  spawnX: 0,       // touch-down origin: the base can only roam ±1 radius from here
  spawnY: 0,
  leftVisX: 0,     // smooth interpolated visual knob position
  boundsL: null,   // { x, y, w, h, cx, cy, maxTravel, r }

  // Right vertical dual jump/drop slider (snaps to top)
  rightId: null,
  rightY: 0,       // 0 (top/rest) to 1 (pulled down)
  rightVisY: 0,    // smooth interpolated visual knob position
  rightStartY: 0,  // touch start Y to detect downward drag immediately
  boundsR: null    // { x, y, w, h, cx, cyTop, maxTravel, r }
};

/* ================= 2-player local mobile controls (Ergonomic Joysticks + Fixed Buttons) ================= */
const LOCAL_TOUCH = {
  showTutorial: false,
  p1: { joyId: null, startX: 0, startY: 0, curX: 0, curY: 0, active: false, offX: 0, visOffX: 0, left: false, right: false, spX: 0, sldId: null, sldStartY: 0, sldV: 0, jumpHeld: false, jumpEdge: false, downHeld: false },
  p2: { joyId: null, startX: 0, startY: 0, curX: 0, curY: 0, active: false, offX: 0, visOffX: 0, left: false, right: false, spX: 0, sldId: null, sldStartY: 0, sldV: 0, jumpHeld: false, jumpEdge: false, downHeld: false }
};
const GESTURE_SPLIT = LOCAL_TOUCH; // Backward compatibility alias

function calcLocalBounds(){
  const midX = CW / 2;
  const isTablet = (Math.min(CW, CH) >= 500);
  const r = isTablet ? clamp(CH * 0.065, 24, 32) : clamp(CH * 0.080, 22, 28);
  const bm = isTablet ? clamp(CH * 0.07, 24, 42) : clamp(CH * 0.06, 16, 26);
  const maxTravel = r * 1.45;
  const trackW = r * 3.4;
  const trackH = r * 2.0;

  // Corner positioning:
  // Player 1 (Bottom-Left Corner): Joystick at far left, Jump & Drop buttons shifted right by ~1 button diameter for comfortable thumb spacing
  const p1CornerPad = isTablet ? clamp(CW * 0.045, 24, 44) : clamp(CW * 0.040, 16, 28);
  const p1DefJoyX = p1CornerPad + trackW / 2;
  const p1DefJoyY = CH - bm - r * 1.05;
  const p1BtnX = p1DefJoyX + trackW / 2 + r * 3.30;
  const p1DropY = p1DefJoyY;
  const p1JumpY = p1DropY - r * 2.15;
  const p1SplitY = (p1JumpY + p1DropY) / 2;
  const p1BtnMinX = p1BtnX - r * 1.15;
  const p1BtnMaxX = p1BtnX + r * 1.45;
  const p1BtnMinY = p1JumpY - r * 1.35;
  const p1BtnMaxY = p1DropY + r * 1.35;

  // Player 2 (Bottom-Right Corner): Jump & Drop buttons at far right, Joystick shifted left towards center by the same gap
  const p2CornerPad = isTablet ? clamp(CW * 0.045, 24, 44) : clamp(CW * 0.040, 16, 28);
  const p2BtnX = CW - p2CornerPad - r * 1.15;
  const p2DefJoyX = p2BtnX - r * 3.30 - trackW / 2;
  const p2DefJoyY = CH - bm - r * 1.05;
  const p2DropY = p2DefJoyY;
  const p2JumpY = p2DropY - r * 2.15;
  const p2SplitY = (p2JumpY + p2DropY) / 2;
  const p2BtnMinX = p2BtnX - r * 1.15;
  const p2BtnMaxX = p2BtnX + r * 1.45;
  const p2BtnMinY = p2JumpY - r * 1.35;
  const p2BtnMaxY = p2DropY + r * 1.35;

  return {
    midX, r, bm, maxTravel, trackW, trackH,
    p1: { btnX: p1BtnX, jumpY: p1JumpY, dropY: p1DropY, splitY: p1SplitY, btnMinX: p1BtnMinX, btnMaxX: p1BtnMaxX, btnMinY: p1BtnMinY, btnMaxY: p1BtnMaxY, defJoyX: p1DefJoyX, defJoyY: p1DefJoyY },
    p2: { btnX: p2BtnX, jumpY: p2JumpY, dropY: p2DropY, splitY: p2SplitY, btnMinX: p2BtnMinX, btnMaxX: p2BtnMaxX, btnMinY: p2BtnMinY, btnMaxY: p2BtnMaxY, defJoyX: p2DefJoyX, defJoyY: p2DefJoyY }
  };
}

/* Solo-style vertical slider per local half (top = jump, bottom = drop),
   built from the existing button column so halves stay exactly where they were */
function localSlider(b, side){
  const c = (side === 'p2') ? b.p2 : b.p1;
  const sw = b.r * 2.1;
  const bot = c.dropY + b.r * 1.05;
  // Never slide under the in-match HUD button bar (ends at y=48); the jump
  // point and travel stay glued to the visible track so input matches draw.
  const top = Math.max(c.jumpY - b.r * 1.05, 58);
  const cyTop = Math.max(c.jumpY, top);
  const maxTravel = Math.max(10, Math.min(c.dropY - c.jumpY, bot - cyTop));
  return { x: c.btnX - sw / 2, y: top, w: sw, h: Math.max(10, bot - top),
    cx: c.btnX, cyTop: cyTop, maxTravel: maxTravel, r: b.r };
}
/* Shared solo-like slider press semantics for a local-half player */
function localSlidePress(p, myP, sl, y, startY){
  const off = clamp((y - sl.cyTop) / sl.maxTravel, 0, 1);
  if(off > 0.22 || (y - startY > 12)){
    // DROP ONLY, NEVER JUMP
    p.downHeld = true;
    p.jumpEdge = false;
    p.jumpHeld = false;
    if(myP && myP.jbuf > 0) myP.jbuf = 0;
  } else {
    // top knob zone = JUMP
    p.downHeld = false;
    p.jumpEdge = true;
    p.jumpHeld = true;
  }
}

function applyTouchAction(action, isDown){
  if(action === 'left') TOUCH.left = !!isDown;
  else if(action === 'right') TOUCH.right = !!isDown;
  else if(action === 'jump'){
    if(isDown){ TOUCH.jumpEdge = true; TOUCH.jumpHeld = true; }
    else TOUCH.jumpHeld = false;
  } else if(action === 'down') TOUCH.downHeld = !!isDown;
}

/* ================= gamepads ================= */
const GP={prev:[{},{},{},{}],prevAx:[0,0,0,0],prevAy:[0,0,0,0]};
let PAD=[null,null,null,null];
function pollGamepads(){
  const rawPads=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<4;i++){
    const gd=rawPads[i];
    if(!gd||!gd.connected){PAD[i]=null;continue;}
    const b=n=>gd.buttons[n]&&(typeof gd.buttons[n]==='object'?gd.buttons[n].pressed:gd.buttons[n]>0.5);
    const pv=GP.prev[i]||{};
    const E=n=>b(n)&&!pv[n];
    const ax=gd.axes[0]||0,ay=gd.axes[1]||0;
    const pax=GP.prevAx[i]||0,pay=GP.prevAy[i]||0;
    const left=ax<-0.30||b(14),right=ax>0.30||b(15),up=ay<-0.50||b(12),down=ay>0.50||b(13);
    PAD[i]={
      left,right,up,down,
      leftE:(left&&!(pax<-0.30||pv[14]))||E(14),
      rightE:(right&&!(pax>0.30||pv[15]))||E(15),
      upE:(up&&!(pay<-0.50||pv[12]))||E(12),
      downE:(down&&!(pay>0.50||pv[13]))||E(13),
      jumpE:E(0),
      jumpHeld:!!b(0),
      confirmE:E(0)||E(2)||E(9),
      pauseE:E(9),
      dropHeld:b(1)||down,
      connected:true
    };
    const np={};for(let n=0;n<17;n++)np[n]=b(n);
    GP.prev[i]=np;
    GP.prevAx[i]=ax;
    GP.prevAy[i]=ay;
  }
}

/* ================= touch zones ================= */
const zones=[];const touchPts=new Map();const glow={};
let pointerX = -999, pointerY = -999, pointerDown = false;
function isPointerIn(x, y, w, h){
  return pointerX >= x && pointerX <= x + w && pointerY >= y && pointerY <= y + h;
}
function zone(x,y,w,h,o){
  zones.push({
    x:x,y:y,w:w,h:h,
    press:(o&&o.press)||null,
    hold:(o&&o.hold)||null,
    fn:(o&&o.fn)||null,
    upFn:(o&&o.upFn)||null,
    touchAction:(o&&o.touchAction)||null
  });
}
function zoneAt(x,y,holdOnly){
  for(let i=zones.length-1;i>=0;i--){const z=zones[i];
    if(holdOnly&&!z.hold&&!z.touchAction)continue;
    if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h)return z;}
  return null;
}
function inputDown(x,y,id){
  initAudio();grabFocus();
  pointerX = x; pointerY = y; pointerDown = true;
  
  // Tutorial Card dismiss for 2-Player Local Touch
  if(match && screen === 'game' && GESTURE_SPLIT.showTutorial){
    GESTURE_SPLIT.showTutorial = false;
    if(match.state === 'tutorial'){
      match.state = 'countdown';
      match.cd = 3;
      match.cdT = 0;
      sfx('count');
    }
    return;
  }

  // Pause / host menu open: every touch goes to menu zones, never game controls.
  // (Otherwise the floating joystick/slider captures menu taps on touch devices.)
  if(match && (match.state === 'paused' || match.hostMenu)){
    const pz = zoneAt(x, y, false);
    if(pz){
      touchPts.set(id, pz);
      if(pz.hold){keys.add(pz.hold);}
      if(pz.press){for(const c of pz.press){pressed.add(c);glow[c]=tGlobal;}}
      if(pz.touchAction){applyTouchAction(pz.touchAction,true);}
      if(pz.fn)pz.fn();
    }
    return;
  }

  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isPlaying = (match && (match.state === 'playing' || match.state === 'countdown'));
  const isSplitLocal = (!isOnline && match && screen === 'game' && isPlaying && match.players && match.players.length === 2 && isTouch && !menu.botOn && menu.tab !== 'solo');

  // Allow HUD top bar buttons (Pause, Mute, Help) to receive clicks
  if(y <= 55){

const LOCAL_CTRL_SCHEMES = [
  { id: 'wasd', label: 'WASD', map: { L: ['KeyA','KeyQ'], R: 'KeyD', U: ['KeyW','Space'], D: 'KeyS' } },
  { id: 'arrows', label: 'ARROWS', map: { L: 'ArrowLeft', R: 'ArrowRight', U: ['ArrowUp','Numpad0'], D: 'ArrowDown' } },

];

function cycleSlotCtrl(slot, d){
  if(!menu.slotCtrl) menu.slotCtrl = [0, 1, 2, 3];
  const total = LOCAL_CTRL_SCHEMES.length;
  let cur = menu.slotCtrl[slot] != null ? menu.slotCtrl[slot] : slot;
  if(typeof isSlotBot === 'function' && isSlotBot(slot)){
    cur = LOCAL_CTRL_SCHEMES.findIndex(s => s.id === 'bot');
    if(cur < 0) cur = total - 1;
  }
  
  // Find keyboard schemes already taken by other active players
  const taken = new Set();
  const act = (typeof activeSlots === 'function') ? activeSlots() : [0, 1];
  for(const other of act){
    if(other !== slot && !(typeof isSlotBot === 'function' && isSlotBot(other))){
      const otherIdx = menu.slotCtrl[other];
      if(otherIdx != null){
        const s = LOCAL_CTRL_SCHEMES[((otherIdx % total) + total) % total];
        if(s && s.id !== 'controller' && s.id !== 'bot'){
          taken.add(s.id);
        }
      }
    }
  }

  // Cycle to next available scheme, skipping taken keyboard schemes
  for(let step = 1; step <= total; step++){
    const nextIdx = ((cur + d * step) % total + total) % total;
    const candidate = LOCAL_CTRL_SCHEMES[nextIdx];
    if(!candidate) continue;
    if(!taken.has(candidate.id) || candidate.id === 'controller' || candidate.id === 'bot'){
      menu.slotCtrl[slot] = nextIdx;
      if(!menu.slotIsBot) menu.slotIsBot = [false, false, false, false, false, false, false, false];
      if(candidate.id === 'bot'){
        menu.slotIsBot[slot] = true;
        toast('🤖 P' + (slot+1) + ' SET TO BOT');
      } else {
        menu.slotIsBot[slot] = false;
        toast('🎮 P' + (slot+1) + ': ' + candidate.label);
      }
      break;
    }
  }
  sfx('ui');
}

function getPlayerColor(p, pList){
  if(!p) return '#ffffff';
  if(settings.gameMode === 'infection' && p.isInfected){
    if(p.zombieColor) return p.zombieColor;
    const ZOMBIE_GREENS = ['#4ade80', '#22c55e', '#16a34a', '#15803d', '#84cc16', '#65a30d', '#a3e635', '#10b981'];
    const idx = (p.infectionOrder != null && p.infectionOrder >= 0) ? p.infectionOrder : (p.slot || 0);
    return ZOMBIE_GREENS[idx % ZOMBIE_GREENS.length];
  }
  if(settings.teams){
    const teamIdx = p.team != null ? (p.team % TEAMS.length) : 0;
    const teamDef = TEAMS[teamIdx] || TEAMS[0];
    const list = pList || (match ? match.players : []);
    const mates = list.filter(o => o.team === p.team);
    const rank = Math.max(0, mates.findIndex(o => o.slot === p.slot));
    return teamDef.shades[rank % teamDef.shades.length] || teamDef.base;
  }
  const c = p.colIdx != null ? p.colIdx : p.slot;
  return (PALETTE[c >= 0 ? c % PALETTE.length : p.slot % PALETTE.length] || PALETTE[0]).c;
}

function getSlotColor(slot, slotColorArr, slotTeamArr){
  if(settings.teams){
    const teamIdx = (slotTeamArr && slotTeamArr[slot] != null) ? (slotTeamArr[slot] % TEAMS.length) : (slot % 2);
    const teamDef = TEAMS[teamIdx] || TEAMS[0];
    let rank = 0;
    const max = (slotColorArr && slotColorArr.length) || 8;
    for(let s = 0; s < slot; s++){
      if((slotColorArr ? slotColorArr[s] >= 0 : true) && slotTeamArr && slotTeamArr[s] === teamIdx) rank++;
    }
    return teamDef.shades[rank % teamDef.shades.length] || teamDef.base;
  }
  const c = slotColorArr ? slotColorArr[slot] : slot;
  return (PALETTE[c >= 0 ? c % PALETTE.length : slot % PALETTE.length] || PALETTE[0]).c;
}

  try{
    const raw=localStorage.getItem('tag_arena_custom_maps_v1');
    if(!raw)return;
    const a=JSON.parse(raw);
    if(!Array.isArray(a)||!a.length)return;
    const ok=a.every(m=>m&&typeof m.name==='string'&&['solids','speeds','drops','boosts'].every(k=>
      Array.isArray(m[k])&&m[k].every(p=>Array.isArray(p)&&p.length>=4&&p.slice(0,4).every(Number.isFinite))));
    if(ok&&a.length<=40)MAPS.splice(0,MAPS.length,...a);
  }catch(e){/* keep built-in maps */}
}
function buildLevel(){

    {x:0,y:0,w:W,h:WALL,t:'solid',wall:1},{x:0,y:H-WALL,w:W,h:WALL,t:'solid',wall:1},
    {x:0,y:0,w:WALL,h:H,t:'solid',wall:1},{x:W-WALL,y:0,w:WALL,h:H,t:'solid',wall:1}
  ];
  /* All horizontal platforms are normalized to player height (46px); tops stay put so jump gaps never change */
  const P46=a=>({x:a[0],y:a[1],w:a[2],h:(a[3]<=32?46:a[3]),dy:a[4]||0});
  for(const a of M.solids){const p=P46(a);p.t='solid';SOLIDS.push(p);}
  for(const a of M.speeds){const p=P46(a);p.t='speed';SOLIDS.push(p);}
  for(const a of M.drops){const p=P46(a);p.t='drop';SOLIDS.push(p);}
  for(const a of M.boosts){const p=P46(a);p.t='boost';SOLIDS.push(p);}
}

function harnessBuildCases(mapIdx){
  HARNESS.map = mapIdx;
  HARNESS.nodes = [];
  // 1. Extract valid platform surfaces (exclude floor wall and narrow vertical pillars)
  for(let i = 1; i < SOLIDS.length; i++){
    const s = SOLIDS[i];
    if(s.wall && s.y !== H - WALL) continue;
    if(s.w < 50 && s.h > s.w * 1.5) continue;
    HARNESS.nodes.push(s);
  }

  // 2. Identify symmetric pairs across arena midline (W = 2400)
  HARNESS.mirrorMap.clear();
  for(let i = 0; i < HARNESS.nodes.length; i++){
    const a = HARNESS.nodes[i];
    const aMid = a.x + a.w / 2;
    for(let j = 0; j < HARNESS.nodes.length; j++){
      const b = HARNESS.nodes[j];
      const bMid = b.x + b.w / 2;
      if(Math.abs(bMid - (W - aMid)) < 30 && Math.abs(b.y - a.y) < 16){
        HARNESS.mirrorMap.set(i, j);
        break;
      }
    }
  }

  // 3. Generate candidate pairs with STRICT SKILL PRUNING:
  // Removes all trivial downward drops, flat walk-overs, and baby hops
  const cases = [];
  const visitedCanonical = new Set();

  for(let i = 0; i < HARNESS.nodes.length; i++){
    const A = HARNESS.nodes[i];
    for(let j = 0; j < HARNESS.nodes.length; j++){
      if(i === j) continue;
      const B = HARNESS.nodes[j];
      const dy = B.y - A.y;
      const gap = Math.max(0, B.x - (A.x + A.w), A.x - (B.x + B.w));
      const dx = Math.abs((B.x + B.w / 2) - (A.x + A.w / 2));
      const maxRise = (A.t === 'boost') ? 690 : 510;

      // Filter 1: Reach limits
      if(dy < -maxRise || dx > 850) continue;

      // Filter 2: Prune ALL downward drops (dy > 40) - greedy bot/gravity handles drops easily
      if(dy > 40) continue;

      // Filter 3: Prune flat/near-flat step-overs and small hops (|dy| <= 40, gap < 180)
      if(Math.abs(dy) <= 40 && gap < 180) continue;

      // Filter 4: Prune low upward hops with small gap (-75 <= dy <= 0, gap < 140)
      if(dy <= 0 && dy >= -75 && gap < 140) continue;

      // Filter 5: Overly distant horizontal reach on normal platform without speed boost
      if(A.t !== 'speed' && A.t !== 'boost' && gap > 560) continue;

      // Filter 6: Prune bilateral symmetric duplicates
      const mI = HARNESS.mirrorMap.get(i), mJ = HARNESS.mirrorMap.get(j);
      if(mI !== undefined && mJ !== undefined){
        const canonicalKey = (mI < i || (mI === i && mJ < j)) ? (mI + '->' + mJ) : (i + '->' + j);
        if(visitedCanonical.has(canonicalKey)) continue;
        visitedCanonical.add(canonicalKey);
      }

      const parT = Math.max(2.8, 1.2 + dx / 380 + Math.abs(dy) / 280);
      cases.push({ from: i, to: j, dx, dy, gap, par: parT });
    }
  }
  HARNESS.cases = cases;
  HARNESS.ci = 0;
  HARNESS.stagedSample = null;
}

function harnessCurCase(){
  if(!HARNESS.cases.length) return null;
  return HARNESS.cases[HARNESS.ci % HARNESS.cases.length];
}

function harnessResetTrial(){
  const c = harnessCurCase();
  if(!c || !match || !match.players || !match.players.length) return;
  const A = HARNESS.nodes[c.from], B = HARNESS.nodes[c.to];
  const p0 = match.players[0];
  const curKey = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  const savedSample = HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][curKey];
  const activeSample = HARNESS.stagedSample || savedSample;

  if(HARNESS.mode === 'record'){
    // Player 0 spawns on Platform A
    p0.x = clamp(A.x + A.w / 2 - p0.w / 2, A.x + 8, A.x + A.w - p0.w - 8);
    p0.y = (A.dy ? A.y + (p0.x - A.x) * (A.dy / A.w) : A.y) - p0.h - 4;
    p0.vx = 0; p0.vy = 0; p0.airJumps = 1;
    p0.grounded = true; p0.gp = A;
  } else {
    // Playback mode: Player 0 stands on Target B, Bot (P1) spawns at exact recorded launch origin on Platform A
    p0.x = clamp(B.x + B.w / 2 - p0.w / 2, B.x + 8, B.x + B.w - p0.w - 8);
    p0.y = (B.dy ? B.y + (p0.x - B.x) * (B.dy / B.w) : B.y) - p0.h - 4;
    p0.vx = 0; p0.vy = 0; p0.grounded = true; p0.gp = B;

    if(match.players.length > 1){
      const p1 = match.players[1];
      const spawnX = activeSample ? activeSample.startX : clamp(A.x + A.w / 2 - p1.w / 2, A.x + 8, A.x + A.w - p1.w - 8);
      const spawnY = activeSample ? activeSample.startY : ((A.dy ? A.y + (spawnX - A.x) * (A.dy / A.w) : A.y) - p1.h - 4);
      p1.x = spawnX;
      p1.y = spawnY;
      p1.vx = activeSample ? (activeSample.startVx || 0) : 0;
      p1.vy = 0;
      p1.airJumps = 1;
      p1.grounded = true;
      p1.gp = A;
      p1._pbStepIdx = 0;
    }
  }

  HARNESS.t = 0;
  HARNESS.holdT = 0;
  HARNESS.started = false;
  HARNESS.trace = [];
  HARNESS.playbackT = 0;
  HARNESS.playbackStep = 0;
}

function harnessStart(mapIdx){

}

function harnessFeetOn(p, s){
  if(!p || !s) return false;
  const feet = p.y + p.h;
  const sTop = s.dy ? s.y + (clamp(p.x + p.w / 2, s.x, s.x + s.w) - s.x) * (s.dy / s.w) : s.y;
  const onX = (p.x + p.w > s.x + 4) && (p.x < s.x + s.w - 4);
  const onY = (feet >= sTop - 6) && (feet <= sTop + 24);
  return onX && onY && (p.grounded || Math.abs(p.vy) < 80);
}

function harnessStageRecordedSample(){
  const c = harnessCurCase();
  if(!c || !HARNESS.trace.length) return;
  const key = c.from + '->' + c.to;

  const launchStep = HARNESS.trace.find(s => s.je) || HARNESS.trace[0];
  const djStep = HARNESS.trace.find((s, idx) => idx > 0 && s.je);

  HARNESS.stagedSample = {
    key: key,
    from: c.from,
    to: c.to,
    map: HARNESS.map,
    time: +HARNESS.t.toFixed(2),
    startX: HARNESS.startX || HARNESS.trace[0].x,
    startY: HARNESS.startY || HARNESS.trace[0].y,
    startVx: HARNESS.startVx || HARNESS.trace[0].vx,
    launchX: launchStep ? launchStep.x : 0,
    hasDoubleJump: !!djStep,
    doubleJumpDelay: djStep ? +(djStep.t - (launchStep ? launchStep.t : 0)).toFixed(2) : 0,
    trace: HARNESS.trace.map(s => ({
      t: +s.t.toFixed(3),
      x: s.x, y: s.y,
      vx: s.vx, vy: s.vy,
      d: s.d, je: s.je, jh: s.jh, dn: s.dn
    }))
  };
}

function harnessCommitStagedSample(){
  const sample = HARNESS.stagedSample;
  if(!sample) return false;
  const mapKey = 'map' + HARNESS.map;
  if(!HARNESS.transitions[mapKey]) HARNESS.transitions[mapKey] = {};
  HARNESS.transitions[mapKey][sample.key] = sample;

  // Auto-mirror if bilateral symmetry exists
  const mFrom = HARNESS.mirrorMap.get(sample.from), mTo = HARNESS.mirrorMap.get(sample.to);
  if(mFrom !== undefined && mTo !== undefined){
    const mirrorKey = mFrom + '->' + mTo;
    const mirroredSample = {
      key: mirrorKey,
      from: mFrom,
      to: mTo,
      map: HARNESS.map,
      time: sample.time,
      startX: Math.round(W - sample.startX - 46),
      startY: sample.startY,
      startVx: -sample.startVx,
      launchX: Math.round(W - sample.launchX - 46),
      hasDoubleJump: sample.hasDoubleJump,
      doubleJumpDelay: sample.doubleJumpDelay,
      trace: sample.trace.map(s => ({
        t: s.t,
        x: Math.round(W - s.x - 46),
        y: s.y,
        vx: -s.vx,
        vy: s.vy,
        d: -s.d,
        je: s.je,
        jh: s.jh,
        dn: s.dn
      }))
    };
    HARNESS.transitions[mapKey][mirrorKey] = mirroredSample;
  }

  harnessSaveStored();
  HARNESS.stagedSample = null;
  HARNESS.done++;
  HARNESS.okN++;
  return true;
}

function harnessDiscardCurrent(andRetry){
  const c = harnessCurCase();
  if(!c) return;
  const key = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  let discardedSomething = false;

  if(HARNESS.stagedSample){
    HARNESS.stagedSample = null;
    discardedSomething = true;
  }

  if(HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key]){
    delete HARNESS.transitions[mapKey][key];
    const mFrom = HARNESS.mirrorMap.get(c.from), mTo = HARNESS.mirrorMap.get(c.to);
    if(mFrom !== undefined && mTo !== undefined){
      const mirrorKey = mFrom + '->' + mTo;
      if(HARNESS.transitions[mapKey][mirrorKey]) delete HARNESS.transitions[mapKey][mirrorKey];
    }
    harnessSaveStored();
    discardedSomething = true;
  }

  if(HARNESS.mode === 'playback' || andRetry){
    HARNESS.mode = 'record';
  }

  harnessResetTrial();
  sfx('back');

  if(andRetry){
    toast('🔄 REMOVED & RETRYING — Jump when ready!');
  } else if(discardedSomething){
    toast('🗑️ CASE DATA REMOVED (Back to Record Mode)');
  } else {
    toast('🔄 RESET (No saved data on this case)');
  }
}

function harnessTick(dt){
  if(!HARNESS.active || !match || screen !== 'game') return;
  match.timer = 9999; match.lastTick = 9999;
  if(match.state === 'paused') return;

  const pl = match.players[0];
  if(!pl) return;

  // Key controls:
  // E: Quick restart
  if(pressed.has('KeyE')){
    harnessResetTrial();
    sfx('back');
    toast('🔄 TRIAL RESTARTED (E)');
    return;
  }
  // T: Toggle bot test mode
  if(pressed.has('KeyT')){
    harnessToggleBotTest();
    return;
  }
  // K or Enter: Keep / Save
  if(pressed.has('KeyK') || pressed.has('Enter')){
    if(HARNESS.stagedSample){
      harnessCommitStagedSample();
      sfx('go');
      toast('✅ JUMP SAVED & APPROVED! Moving to next case...');
      HARNESS.ci = (HARNESS.ci + 1) % HARNESS.cases.length;
      HARNESS.mode = 'record';
      harnessResetTrial();
      return;
    } else {
      const c = harnessCurCase();
      const key = c ? (c.from + '->' + c.to) : '';
      const mapKey = 'map' + HARNESS.map;
      if(HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key]){
        toast('✅ Case already saved! Moving to next case...');
        HARNESS.ci = (HARNESS.ci + 1) % HARNESS.cases.length;
        HARNESS.mode = 'record';
        harnessResetTrial();
        return;
      } else {
        toast('⚠️ Complete a jump first before keeping!');
      }
    }
  }
  // R: Remove & Retry immediately in one button press
  if(pressed.has('KeyR')){
    harnessDiscardCurrent(true);
    return;
  }
  // D / Delete / Backspace: Discard / Remove
  if(pressed.has('KeyD') || pressed.has('Backspace') || pressed.has('Delete')){
    harnessDiscardCurrent(false);
    return;
  }
  // Browse cases: [ / P / ArrowLeft for Previous
  if(pressed.has('BracketLeft') || pressed.has('KeyP') || (HARNESS.mode === 'playback' && pressed.has('ArrowLeft'))){
    HARNESS.ci = (HARNESS.ci - 1 + HARNESS.cases.length) % HARNESS.cases.length;
    HARNESS.stagedSample = null;
    harnessResetTrial();
    toast('◀ PREVIOUS CASE (' + (HARNESS.ci + 1) + '/' + HARNESS.cases.length + ')');
    return;
  }
  // Browse cases: ] / N / ArrowRight for Next
  if(pressed.has('BracketRight') || pressed.has('KeyN') || (HARNESS.mode === 'playback' && pressed.has('ArrowRight'))){
    HARNESS.ci = (HARNESS.ci + 1) % HARNESS.cases.length;
    HARNESS.stagedSample = null;
    harnessResetTrial();
    toast('▶ NEXT CASE (' + (HARNESS.ci + 1) + '/' + HARNESS.cases.length + ')');
    return;
  }
  // Z: Save / Export
  if(pressed.has('KeyZ')){
    harnessExportJSON();
    return;
  }

  // Switch map with number keys 1-9, 0
  for(let k = 1; k <= 9; k++){
    if(pressed.has('Digit' + k)){
      harnessStart(k - 1);
      return;
    }
  }
  if(pressed.has('Digit0')){
    harnessStart(9);
    return;
  }

  const c = harnessCurCase();
  if(!c) return;
  const A = HARNESS.nodes[c.from], tgt = HARNESS.nodes[c.to];

  if(HARNESS.mode === 'record'){
    if(!HARNESS.started){
      if(keys.has('KeyA') || keys.has('KeyD') || keys.has('KeyW') || keys.has('Space') ||
         keys.has('ArrowLeft') || keys.has('ArrowRight') || keys.has('ArrowUp')){
        HARNESS.started = true;
        HARNESS.startX = Math.round(pl.x);
        HARNESS.startY = Math.round(pl.y);
        HARNESS.startVx = Math.round(pl.vx);
        HARNESS.t = 0;
      } else {
        return;
      }
    }

    HARNESS.t += dt;

    // Check invalid landing: touched arena floor or unintended platform before target
    if(pl.grounded && pl.gp && pl.gp !== A && pl.gp !== tgt){
      toast('❌ TOUCHED OTHER FLOOR — [E] TO RETRY');
      sfx('back');
      harnessResetTrial();
      return;
    }

    if(harnessFeetOn(pl, tgt)){
      HARNESS.holdT += dt;
      if(HARNESS.holdT >= 0.20 && !HARNESS.stagedSample){
        harnessStageRecordedSample();
        sfx('ok');
        toast('🎯 JUMP RECORDED! [T] Test Bot | [K] Keep & Save | [D] Discard');
      }
    } else {
      if(!HARNESS.stagedSample) HARNESS.holdT = 0;
    }

    if(HARNESS.t >= c.par && !HARNESS.stagedSample){
      toast('⏰ TIME OVER PAR (' + c.par.toFixed(1) + 's) — [E] TO RETRY');
      sfx('back');
      harnessResetTrial();
      return;
    }
  } else {
    // Playback mode:
    HARNESS.playbackT += dt;
    const botP = match.players[1];
    if(botP && harnessFeetOn(botP, tgt)){
      HARNESS.holdT += dt;
      if(HARNESS.holdT >= 0.4){
        sfx('go');
        toast('🎯 BOT REACHED YOU CLEANLY! [K] Keep & Save | [D] Discard | [E] Retry');
        HARNESS.holdT = 0;
      }
    }
  }
}

function harnessPushTrace(p, inp){
  if(!HARNESS.active || HARNESS.mode !== 'record' || !HARNESS.started || p.slot !== 0) return;
  if(HARNESS.stagedSample) return; // Stop recording once landed cleanly
  HARNESS.trace.push({
    t: +HARNESS.t.toFixed(3),
    x: Math.round(p.x),
    y: Math.round(p.y),
    vx: Math.round(p.vx),
    vy: Math.round(p.vy),
    d: inp.dir,
    je: inp.jumpEdge ? 1 : 0,
    jh: inp.jumpHeld ? 1 : 0,
    dn: inp.downHeld ? 1 : 0,
    g: p.grounded ? 1 : 0
  });
}

function harnessBotPlaybackInput(p, dt){
  const c = harnessCurCase();
  if(!c) return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
  const key = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  const sample = HARNESS.stagedSample || (HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key]);
  if(!sample || !sample.trace || !sample.trace.length){
    return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
  }

  const curT = HARNESS.playbackT;
  if(!p._pbStepIdx) p._pbStepIdx = 0;

  let jumpEdge = false;
  let step = sample.trace[Math.min(p._pbStepIdx, sample.trace.length - 1)];

  // Scan all trace samples up to current playback time so jump edges are NEVER missed
  while(p._pbStepIdx < sample.trace.length && sample.trace[p._pbStepIdx].t <= curT){
    const s = sample.trace[p._pbStepIdx];
    if(s.je === 1) jumpEdge = true;
    step = s;
    p._pbStepIdx++;
  }

  // Trajectory stabilization: nudge ground velocity toward recorded velocity to eliminate frame rate drift
  if(p.grounded && Math.abs(p.x - step.x) > 3){
    p.vx += clamp((step.x - p.x) * 4, -50, 50);
  }

  return {
    dir: step.d,
    jumpEdge: jumpEdge,
    jumpHeld: !!step.jh,
    downHeld: !!step.dn
  };
}

  const isStaged = !!HARNESS.stagedSample;

  const statusCol = isStaged ? '#f5d76e' : (isSaved ? '#2ecc71' : '#bdc3c7');

  ptxt(mapName + ' • CASE ' + (HARNESS.ci + 1) + '/' + HARNESS.cases.length + ' • ' + modeTag, CW / 2, 30, FT(20), '#ffffff');
  ptxt('STATUS: ' + statusText + '  |  Rise: ' + (-c.dy) + 'px  Gap: ' + c.gap + 'px', CW / 2, 54, FN(14, 800), statusCol);

      ptxt('🎯 JUMP RECORDED! [T] Test Bot  |  [K] Keep & Save  |  [D] Remove  |  [R] Remove & Retry', CW / 2, 78, FN(15, 900), '#2ecc71');
    } else {
      const timeCol = HARNESS.t > c.par * 0.75 ? '#ff4757' : '#2ed573';
      ptxt(HARNESS.started ? HARNESS.t.toFixed(1) + 's / ' + c.par.toFixed(1) + 's par' : 'PRESS WASD / ARROWS TO START JUMP', CW / 2, 78, FN(15, 800), timeCol);
    }
  } else {
    ptxt('WATCHING BOT REPLAY! [K] Keep & Save  |  [D] Remove  |  [R] Remove & Retry  |  [E] Re-run Bot', CW / 2, 78, FN(15, 900), '#38ef7d');
  }

  // Bottom action bar
  ptxt('[T] TEST BOT   [K] KEEP & SAVE   [D] REMOVE   [R] REMOVE & RETRY   [E] RESTART   [←/→] BROWSE', CW / 2, CH - 22, FN(12, 800), 'rgba(255,255,255,0.92)');
}

function cycleTeam(i, d){
  if(typeof NET !== 'undefined' && NET && NET.role !== null && !NET.isHost && NET.teamsLocked){
    toast('TEAMS ARE LOCKED BY THE HOST');
    sfx('back');
    return;
  }
  if(!menu.slotTeam) menu.slotTeam = [0, 1, 0, 1, 0, 1, 0, 1];
  const curTeam = (menu.slotTeam[i] || 0) % TEAMS.length;
  const targetTeam = (curTeam + d + TEAMS.length) % TEAMS.length;

  menu.slotTeam[i] = targetTeam;
  sfx('ui');
  if(settings.gameMode === 'hunter') updateElectedHuntersFromVotes();
  if(typeof NET !== 'undefined' && NET && NET.role !== null){
    if(NET.isHost) netBroadcastRoster();
    else {
      for(const pair of NET.conns.values()){
        netSendRel(pair, { t: 'team', slot: i, team: menu.slotTeam[i] });
      }
    }
  }
}

// First free player slot (1..7) from my current roster view
function firstFreeSlot(){
  for(let s = 1; s < 8; s++){
    const takenHost = (typeof NET !== 'undefined' && NET && NET.isHost && NET.hostInputs) ? NET.hostInputs.has(s) : false;
    if(!takenHost && menu.slotColor[s] === -1) return s;
  }
  return -1;
}

// Tap-a-team-panel = join THAT team (first free slot). Returns true if handled.
function joinTeamFromPanel(teamIdx){
  const teamName = teamIdx === 0 ? 'RED' : 'BLUE';
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  if(!isOnline){
    // Local setup: activate the first free slot straight into this team
    const free = firstFreeSlot();
    if(free < 0){ toast('No free slots!'); sfx('back'); return true; }
    const taken = menu.slotColor.filter(v => v >= 0);
    let pick = -1;
    for(let pi = 0; pi < PALETTE.length; pi++){ if(!taken.includes(pi)){ pick = pi; break; } }
    menu.slotColor[free] = (pick >= 0 ? pick : free % PALETTE.length);
    if(!menu.slotTeam) menu.slotTeam = [0, 1, 0, 1, 0, 1, 0, 1];
    menu.slotTeam[free] = teamIdx;
    if(settings.gameMode === 'hunter'){ validateHunterRoles(); }
    sfx('ok');
    toast('P' + (free + 1) + ' joined ' + teamName + '!');
    return true;
  }
  if(NET.mySlot >= 0){
    // Already playing: move MY slot to the tapped team (balance-guarded)
    setPlayerTeam(NET.mySlot, teamIdx);
    return true;
  }
  // Spectator: claim the first free slot FOR the tapped team
  if(NET.lobbyLocked){ netToast('Lobby is locked by the host.'); return true; }
  const free = firstFreeSlot();
  if(free < 0){ netToast('All player slots are full!'); return true; }
  netClaimSlot(free, teamIdx);
  return true;
}
// Same lock + hunter-balance rules as cycleTeam.
function setPlayerTeam(i, teamIdx){
  if(typeof NET !== 'undefined' && NET && NET.role !== null && !NET.isHost && NET.teamsLocked){
    toast('TEAMS ARE LOCKED BY THE HOST');

  }
  if(!menu.slotTeam) menu.slotTeam = [0, 1, 0, 1, 0, 1, 0, 1];

}

if(!menu.hunterVotes) menu.hunterVotes = {};
if(!menu.hunterHistory) menu.hunterHistory = {};

function getHunterTeamCounts(){
  const act = activeSlots();
  let red = 0, blue = 0;
  for(const s of act){
    const t = (menu.slotTeam ? menu.slotTeam[s] : s) % 2;
    if(t === 0) red++; else blue++;
  }
  return { red: red, blue: blue, diff: Math.abs(red - blue) };
}

function enforceHunterBalance(){
  const act = activeSlots();
  if(act.length < 2) return;
  let red = 0, blue = 0;
  for(const s of act){
    const t = (menu.slotTeam ? menu.slotTeam[s] : s) % 2;
    if(t === 0) red++; else blue++;
  }
  if(Math.abs(red - blue) > 1){
    if(!menu.slotTeam) menu.slotTeam = [0, 1, 0, 1, 0, 1, 0, 1];
    let r = 0, b = 0;
    for(let k = 0; k < act.length; k++){
      const s = act[k];
      if(r <= b){ menu.slotTeam[s] = 0; r++; }
      else { menu.slotTeam[s] = 1; b++; }
    }
  }
}

function getCandidateVoteCount(slot, team){
  if(!menu.hunterVotes) return 0;
  const act = activeSlots();
  let cnt = 0;
  for(const [voter, voteVal] of Object.entries(menu.hunterVotes)){
    const v = parseInt(voter);
    if(!act.includes(v)) continue;
    const cand = (voteVal && typeof voteVal === 'object') ? voteVal.cand : voteVal;
    const candTeam = (voteVal && typeof voteVal === 'object' && voteVal.team != null) ? voteVal.team : ((menu.slotTeam ? menu.slotTeam[v] : v) % 2);
    if(team != null && candTeam !== team) continue;
    if(slot === 'random'){
      if(cand === 'random' || cand === -1 || cand === '-1') cnt++;
    } else {
      if(parseInt(cand) === slot) cnt++;
    }
  }
  return cnt;
}

function resolveTeamHunter(team){
  const act = activeSlots();
  const teamSlots = act.filter(s => ((menu.slotTeam ? menu.slotTeam[s] : s) % 2) === team);
  if(teamSlots.length === 0) return 0;
  if(teamSlots.length === 1) return teamSlots[0];

  const hist = (match && match.hunterHistory) ? match.hunterHistory : (menu.hunterHistory || {});

  // 1. Tally votes for each candidate on this team, and random votes
  const votes = {};
  for(const s of teamSlots) votes[s] = 0;
  let randomVotes = 0;

  if(menu.hunterVotes){
    for(const [voter, voteVal] of Object.entries(menu.hunterVotes)){
      const v = parseInt(voter);
      if(!act.includes(v)) continue;
      const cand = (voteVal && typeof voteVal === 'object') ? voteVal.cand : voteVal;
      const vTeam = (voteVal && typeof voteVal === 'object' && voteVal.team != null) ? voteVal.team : ((menu.slotTeam ? menu.slotTeam[v] : v) % 2);
      if(vTeam === team){
        if(cand === 'random' || cand === -1 || cand === '-1'){
          randomVotes++;
        } else {
          const c = parseInt(cand);
          if(teamSlots.includes(c)){
            votes[c] = (votes[c] || 0) + 1;
          }
        }
      }
    }
  }

  // 2. Find maximum vote count among candidates
  let maxCandidateVotes = -1;
  for(const s of teamSlots){
    if((votes[s] || 0) > maxCandidateVotes) maxCandidateVotes = votes[s] || 0;
  }

  // If random strictly won
  if(randomVotes > maxCandidateVotes && randomVotes > 0){
    let minR = 1e9;
    for(const s of teamSlots){
      const r = hist[s] || 0;
      if(r < minR) minR = r;
    }
    const leastRounds = teamSlots.filter(s => (hist[s] || 0) === minR);
    const curHunter = (team === 0 ? settings.hunterRed : settings.hunterBlue);
    if(leastRounds.includes(curHunter)) return curHunter;
    return leastRounds[0];
  }

  const topCandidates = teamSlots.filter(s => (votes[s] || 0) === maxCandidateVotes);
  if(topCandidates.length === 1 && maxCandidateVotes > randomVotes){
    return topCandidates[0];
  }

  // 3. Tie breaker: pick candidate(s) with LEAST hunter rounds played
  let minRounds = 1e9;
  for(const s of topCandidates){
    const r = hist[s] || 0;
    if(r < minRounds) minRounds = r;
  }
  const leastRoundCandidates = topCandidates.filter(s => (hist[s] || 0) === minRounds);

  // 4. Stable tie breaker: if currently configured hunter is in leastRoundCandidates, keep it!
  const curHunter = (team === 0 ? settings.hunterRed : settings.hunterBlue);
  if(leastRoundCandidates.includes(curHunter)) return curHunter;
  return leastRoundCandidates[0];
}

function updateElectedHuntersFromVotes(){
  settings.hunterRed = resolveTeamHunter(0);
  settings.hunterBlue = resolveTeamHunter(1);
  if(match){
    match.hunterRed = settings.hunterRed;
    match.hunterBlue = settings.hunterBlue;
  }
}

function castHunterVote(voterSlot, candSlot){
  if(typeof NET !== 'undefined' && NET && NET.role !== null && !NET.isHost && NET.teamsLocked){
    toast('VOTING LOCKED BY HOST');
    sfx('back');
    return;
  }
  if(!menu.hunterVotes) menu.hunterVotes = {};
  const vTeam = (menu.slotTeam && voterSlot >= 0 && menu.slotTeam[voterSlot] != null) ? (menu.slotTeam[voterSlot] % 2) : ((voterSlot >= 0 ? voterSlot : 0) % 2);
  menu.hunterVotes[voterSlot] = { team: vTeam, cand: candSlot };
  sfx('ok');

  if(typeof NET === 'undefined' || !NET || NET.role === null || NET.isHost){
    updateElectedHuntersFromVotes();
  }

  let candName = 'Fair pick';
  if(candSlot !== 'random' && candSlot >= 0){
    candName = (typeof NET !== 'undefined' && NET && NET.slotsName && NET.slotsName[candSlot]) ? (('P' + (candSlot + 1)) + ' ' + NET.slotsName[candSlot]) : ('P' + (candSlot + 1));
  }
  toast(candSlot === 'random' ? '🎲 Fair pick: fewest hunts first!' : ('✓ Your tap: ' + candName + ' hunts next!'));

  if(typeof NET !== 'undefined' && NET && NET.role !== null){
    if(NET.isHost){
      netBroadcastReliable({
        t: 'hunter_votes_sync',
        hunterVotes: menu.hunterVotes,
        hunterRed: settings.hunterRed,
        hunterBlue: settings.hunterBlue
      });
      netBroadcastSettings();
      netBroadcastRoster();
    } else {
      for(const pair of NET.conns.values()){
        netSendRel(pair, { t: 'hunter_vote', voter: voterSlot, team: vTeam, candidate: candSlot });
      }
    }
  }
}

function validateHunterRoles(){
  enforceHunterBalance();
  updateElectedHuntersFromVotes();
}

/* ================= POST-GAME MAP VOTE + MODE REQUESTS =================
   After a match: 3 map cards with live previews, one vote per human.
   Highest count wins; ties go to whichever map reached the count FIRST
   (the Nth-vote sequence number decides). Zero votes => random pick.
   Mode requests work the same way (earliest request wins ties, else current).
   Online: host owns the state and broadcasts; guests send votes. */
const MAPVOTE_MODES = [
  {id:'party', icon:'👥', label:'PARTY'},
  {id:'teams', icon:'⚔️', label:'TEAMS'},
  {id:'ctf', icon:'🚩', label:'CTF'},
  {id:'freeze', icon:'❄️', label:'FREEZE'},
  {id:'infection', icon:'🧟', label:'INFECTION'},
  {id:'bomb', icon:'💣', label:'BOMB'},
  {id:'crown', icon:'👑', label:'CROWN'},
  {id:'hunter', icon:'🎯', label:'HUNTER'}
];
function mapVoteVoters(){
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  if(isOnline){
    if(!NET.isHost) return [(NET.mySlot != null ? NET.mySlot : -1)];
    const r = [];
    const act = (typeof activeSlots === 'function') ? activeSlots() : [];
    for(const s of act){
      if(NET.botSlots && NET.botSlots.indexOf(s) >= 0) continue;
      r.push(s);
    }
    return r;
  }
  let humans = [];
  try{ humans = activeSlots().filter(function(s){ return !isSlotBot(s); }); }catch(e){ humans = [0]; }
  return humans.length ? ['L'] : [];
}
function myVoterId(){
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  if(isOnline) return (NET.mySlot != null ? NET.mySlot : -1);
  return 'L';
}
function initMapVote(){
  const opts = [];
  const tried = {};
  tried[settings.map] = true;
  let guard = 0;
  while(opts.length < 3 && guard++ < 60){
    const m = Math.floor(Math.random() * MAPS.length);
    if(tried[m]) continue;
    tried[m] = true;
    opts.push(m);
  }
  for(let m = 0; m < MAPS.length && opts.length < 3; m++){
    if(opts.indexOf(m) < 0) opts.push(m);
  }
  const voters = mapVoteVoters();
  menu.mapVote = { mid: matchIndex, opts: opts, votes: {}, seq: 0,
    modeReq: {}, mseq: 0, t: voters.length ? 20 : 6, decided: false, syncT: 0 };
  menu.modePopup = false;
  const isHost = (typeof NET !== 'undefined' && NET && NET.role !== null && NET.isHost);
  if(isHost) broadcastMapVote();
}
function broadcastMapVote(){
  if(typeof NET === 'undefined' || !NET || !NET.isHost) return;
  if(!menu.mapVote) return;
  try{ netBroadcastReliable({ t: 'mapvote_sync', vote: menu.mapVote }); }catch(e){}
}
function castMapVote(voter, pick){
  const V = menu.mapVote;
  if(!V || V.decided || V.opts.length < 3) return;
  pick = pick | 0;
  if(pick < 0 || pick > 2) return;
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isGuest = isOnline && !NET.isHost;
  if(isGuest){
    V.votes[voter] = { pick: pick, seq: -1 };
    try{ for(const pair of NET.conns.values()) netSendRel(pair, { t: 'map_vote', voter: voter, pick: pick }); }catch(e){}
    sfx('ui');
    return;
  }
  if(mapVoteVoters().indexOf(voter) < 0) return;
  V.seq++;
  V.votes[voter] = { pick: pick, seq: V.seq };
  sfx('ui');
  broadcastMapVote();
}
function requestMode(voter, modeId){
  const V = menu.mapVote;
  if(!V || V.decided) return;
  let ok = false;
  for(const m of MAPVOTE_MODES){ if(m.id === modeId){ ok = true; break; } }
  if(!ok) return;
  if(modeId === 'freeze' || modeId === 'infection'){ toast('❄️🧟 THAT MODE IS COMING SOON!'); sfx('back'); return; }
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isGuest = isOnline && !NET.isHost;
  if(menu.tab === 'solo' && ['party', 'bomb', 'crown', 'ctf'].indexOf(modeId) < 0){ toast('🤖 SOLO: FFA/BOMB/CROWN/CTF ONLY'); sfx('back'); return; }
  if(menu.tab === 'bots' && ['party','freeze','infection','bomb','crown','ctf'].indexOf(modeId) < 0){ toast('🤖 WATCH: FFA/CTF ONLY'); sfx('back'); return; }
  if(isGuest){
    V.modeReq[voter] = { mode: modeId, seq: -1 };
    try{ for(const pair of NET.conns.values()) netSendRel(pair, { t: 'mode_request', voter: voter, mode: modeId }); }catch(e){}
    sfx('ok');
    toast('📣 REQUESTED ' + modeId.toUpperCase() + '!');
    return;
  }
  if(mapVoteVoters().indexOf(voter) < 0) return;
  V.mseq++;
  V.modeReq[voter] = { mode: modeId, seq: V.mseq };
  sfx('ok');
  toast('📣 REQUESTED ' + modeId.toUpperCase() + '!');
  broadcastMapVote();
}
function tallyMapVote(){
  const V = menu.mapVote;
  const counts = [0, 0, 0], last = [-1, -1, -1];
  if(V){
    for(const k of Object.keys(V.votes || {})){
      const o = V.votes[k];
      if(!o) continue;
      const pk = o.pick | 0;
      if(pk < 0 || pk > 2) continue;
      counts[pk]++;
      const sq = (o.seq == null ? -1 : o.seq) | 0;
      if(sq > last[pk]) last[pk] = sq;
    }
  }
  let best = 0;
  for(let i = 1; i < 3; i++){
    if(counts[i] > counts[best] || (counts[i] === counts[best] && last[i] < last[best])) best = i;
  }
  return { counts: counts, best: best, total: counts[0] + counts[1] + counts[2] };
}
function tallyModeReq(){
  const V = menu.mapVote;
  const counts = {}, first = {};
  if(V){
    for(const k of Object.keys(V.modeReq || {})){
      const o = V.modeReq[k];
      if(!o || !o.mode) continue;
      counts[o.mode] = (counts[o.mode] || 0) + 1;
      const sq = (o.seq == null ? -1 : o.seq) | 0;
      if(first[o.mode] == null || sq < first[o.mode]) first[o.mode] = sq;
    }
  }
  let best = null, bn = 0, bf = 1e12;
  for(const k of Object.keys(counts)){
    if(counts[k] > bn || (counts[k] === bn && first[k] < bf)){ bn = counts[k]; bf = first[k]; best = k; }
  }
  return { counts: counts, best: best, total: bn };
}
function decideMapVote(){
  const V = menu.mapVote;
  if(!V || V.decided) return;
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  if(isOnline && !NET.isHost) return;
  V.decided = true;
  const T = tallyMapVote();
  let bi;
  if(T.total === 0 || V.opts.length < 3){
    bi = Math.floor(Math.random() * Math.max(1, V.opts.length));
    toast('🎲 NO VOTES — RANDOM MAP!');
  } else {
    bi = T.best;
  }
  const mapIdx = V.opts[bi] != null ? V.opts[bi] : settings.map;
  const M = tallyModeReq();
  let modeId = (M.best && M.total > 0) ? M.best : settings.gameMode;
  settings.map = ((mapIdx % MAPS.length) + MAPS.length) % MAPS.length;
  if(modeId && modeId !== settings.gameMode){
    if(modeId === 'hunter' && activeSlots().length < 4){
      toast('🎯 HUNTER NEEDS 4+ PLAYERS — MODE UNCHANGED');
    } else {
      setGameMode(modeId);
    }
  }
  buildLevel();
  const mname = MAPS[settings.map].name;
  toast('🗺️ ' + mname + ' WINS!' + (T.total ? (' (' + T.counts[bi] + ' VOTE' + (T.counts[bi] === 1 ? '' : 'S') + ')') : ''));
  sfx('go');
  menu.mapVote = null;
  menu.modePopup = false;
  startMatch();
}

function setTeamHunterChoice(teamIdx, cand){
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const teamSlots = activeSlots().filter(s => ((menu.slotTeam ? menu.slotTeam[s] : s) % 2) === teamIdx);
  if(teamSlots.length === 0) return;

  if(!isOnline){
    if(cand === 'random'){
      const hist = (match && match.hunterHistory) ? match.hunterHistory : (menu.hunterHistory || {});
      let minR = 1e9;
      for(const s of teamSlots){ const r = hist[s] || 0; if(r < minR) minR = r; }
      const leastR = teamSlots.filter(s => (hist[s] || 0) === minR);
      const pick = leastR[Math.floor(Math.random() * leastR.length)];
      if(teamIdx === 0) settings.hunterRed = pick; else settings.hunterBlue = pick;
      if(!menu.hunterVotes) menu.hunterVotes = {};
      for(const s of teamSlots) menu.hunterVotes[s] = { team: teamIdx, cand: 'random' };
      toast('🎲 Fair pick: ' + ('P' + (pick + 1)) + ' hunts for ' + (teamIdx === 0 ? 'RED' : 'BLUE') + ' (fewest hunts first)');
    } else {
      if(teamIdx === 0) settings.hunterRed = cand; else settings.hunterBlue = cand;
      if(!menu.hunterVotes) menu.hunterVotes = {};
      for(const s of teamSlots) menu.hunterVotes[s] = { team: teamIdx, cand: cand };
      toast('👑 ' + ('P' + (cand + 1)) + ' hunts for ' + (teamIdx === 0 ? 'RED' : 'BLUE') + ' next!');
    }
    if(match){
      match.hunterRed = settings.hunterRed;
      match.hunterBlue = settings.hunterBlue;
    }
    sfx('ok');
    return;
  }

  // Online Multiplayer
  const mySlot = NET.mySlot;
  const myTeam = (menu.slotTeam && mySlot >= 0 && menu.slotTeam[mySlot] != null) ? (menu.slotTeam[mySlot] % 2) : ((mySlot >= 0 ? mySlot : 0) % 2);

  if(mySlot < 0){
    toast('⚠️ Spectators watch — players tap their own team!');
    sfx('back');
    return;
  }
  if(myTeam === teamIdx){
    const voter = mySlot;
    castHunterVote(voter, cand);
  } else {
    toast('⚠️ Tap YOUR team box — you hunt with them!');
    sfx('back');
  }
}

function selectHunterRole(slot){
  const sTeam = (menu.slotTeam ? menu.slotTeam[slot] : slot) % 2;
  setTeamHunterChoice(sTeam, slot);
}

function cycleGameMode(d){
  if(typeof NET !== 'undefined' && NET && NET.role !== null && !NET.isHost){
    toast('HOST SELECTS GAME MODE');
    sfx('back');
    return;
  }
  const modes = (menu.tab === 'bots' || menu.tab === 'solo')
    ? ['party', 'ctf', 'bomb', 'crown']

function findSafeSpawn(team, isHunter, playerIndex, totalPlayers){
  const P_W = 46, P_H = 46;

  function isSpotSafe(sx, sy){
    if(sx < WALL + 10 || sx + P_W > W - WALL - 10) return false;
    if(sy < WALL + 10 || sy + P_H > H - WALL) return false;
    const body = { x: sx + 2, y: sy + 2, w: P_W - 4, h: P_H - 4 };
    if(SOLIDS.some(s => hitRect(body, s))) return false;
    const head = { x: sx + 4, y: sy - 20, w: P_W - 8, h: 20 };
    if(SOLIDS.some(s => hitRect(head, s))) return false;
    return true;
  }

  // 1. Collect all valid flat platforms from SOLIDS
  const candidateSpots = [];
  for(const s of SOLIDS){
    if(s.dy || s.w < 60) continue; // Skip slopes and thin vertical walls
    if(s.t === 'speed' || s.t === 'boost' || s.t === 'drop') continue; // Exclude speed/boost pads and hazards
    const surfaceY = s.y;
    const testY = surfaceY - P_H;

    // Try center, left edge, and right edge of platform
    const spots = [
      Math.round(s.x + s.w / 2 - P_W / 2),
      Math.round(s.x + 16),
      Math.round(s.x + s.w - P_W - 16)
    ];
    for(const testX of spots){
      if(isSpotSafe(testX, testY)){
        candidateSpots.push({ x: testX, y: testY, platY: surfaceY, plat: s });
      }
    }
  }

  // 2. Also check the arena floor (accounting for any boost/speed pads on floor)
  for(let fx = WALL + 80; fx < W - WALL - 80; fx += 80){
    let floorSurfaceY = H - WALL;
    let onHazard = false;
    for(const s of SOLIDS){
      if(!s.dy && fx + P_W > s.x && fx < s.x + s.w){
        if(s.t === 'speed' || s.t === 'boost' || s.t === 'drop'){
          onHazard = true;
          break;
        }
        if(s.y < floorSurfaceY && s.y >= H - WALL - 120){
          floorSurfaceY = s.y;
        }
      }
    }
    if(onHazard) continue;
    const fy = floorSurfaceY - P_H;
    if(isSpotSafe(fx, fy)){
      candidateSpots.push({ x: fx, y: fy, platY: floorSurfaceY, isFloor: true });
    }
  }

  if(isHunter){
    if(team === 0){
      // Red Hunter: leftmost bottom spot
      const leftSpots = candidateSpots.filter(p => p.x < W * 0.45).sort((a,b) => b.y - a.y || a.x - b.x);
      if(leftSpots.length > 0) return { x: leftSpots[0].x, y: leftSpots[0].y, face: 1 };
    } else {
      // Blue Hunter: rightmost bottom spot
      const rightSpots = candidateSpots.filter(p => p.x > W * 0.55).sort((a,b) => b.y - a.y || b.x - a.x);
      if(rightSpots.length > 0) return { x: rightSpots[0].x, y: rightSpots[0].y, face: -1 };
    }
  } else {
    if(team === 0){
      // Red Runners: upper platforms on right half
      const rightRunners = candidateSpots.filter(p => p.x > W * 0.40 && p.y < H * 0.85).sort((a,b) => a.y - b.y);
      if(rightRunners.length > 0){
        const pick = rightRunners[playerIndex % rightRunners.length];
        return { x: pick.x, y: pick.y, face: -1 };
      }
    } else {
      // Blue Runners: upper platforms on left half
      const leftRunners = candidateSpots.filter(p => p.x < W * 0.60 && p.y < H * 0.85).sort((a,b) => a.y - b.y);
      if(leftRunners.length > 0){
        const pick = leftRunners[playerIndex % leftRunners.length];
        return { x: pick.x, y: pick.y, face: 1 };
      }
    }
  }

  // Fallback: pick any safe spot
  if(candidateSpots.length > 0){
    const pick = candidateSpots[playerIndex % candidateSpots.length];
    return { x: pick.x, y: pick.y, face: pick.x < W/2 ? 1 : -1 };
  }

  // Absolute fallback: center of arena
  return { x: W/2 - 23, y: H/2 - 23, face: 1 };
}

  const N=activeSlots().length;
  const s=SLOTS[slot] || SLOTS[0];

    const coll = SOLIDS.find(s => hitRect(pBox, s));
    if(!coll) break;
    y = coll.y - 46;
  }

    face:face,airJumps:settings.doubleJump?1:0,wallJumps:0,coyote:0,jbuf:0,holdT:0,dropT:0,sideT:0,wallSide:0,

    slot:slot,colIdx:colIdx,team:team,trail:[],cosmeticTrail:[],isHunter:roleHunter,isEliminated:false,survivalT:0,isFrozen:false};
}

      addInfectionBurst(patientZero.x + patientZero.w / 2, patientZero.y + patientZero.h / 2);
    }

    evaluateInfectionPhase();

    if (typeof gScope.toast === 'function') {
      gScope.toast('☣️ INFECTION OUTBREAK! FLEE PATIENT ZERO!');
    }
    playInfectionSfx('outbreak');
  }

  // ============================================================================
  // PHASE & SPEED BALANCING RESOLUTION
  // ============================================================================

  /**
   * Evaluates current balance phase (Phase 1, Phase 2, or Phase 3 Last Stand).
   */
  function evaluateInfectionPhase() {
    const match = Imatch();
    if (!match || !match.players) return 1;

    const alivePlayers = match.players.filter(p => !p.isEliminated);
    const infected = alivePlayers.filter(p => p.isInfected);
    const survivors = alivePlayers.filter(p => !p.isInfected);

    let phase = 1;

    // Phase 3: Lone Survivor Last Stand — strictly 1 survivor vs 3+ infected
    // (prevents 1v1/1v2 endgames from wrongly granting 605 speed + repulsor)
    if (survivors.length === 1 && infected.length >= 3) {
      phase = 3;
      const lone = survivors[0];
      lone.isLoneSurvivor = true;
      infectionState.loneSurvivorSlot = lone.slot;

      // Reset isLoneSurvivor on any other player
      for (const p of match.players) {
        if (p !== lone) p.isLoneSurvivor = false;
      }

      if (!infectionState.lastStandAnnounced && match.state === 'playing') {
        infectionState.lastStandAnnounced = true;
        if (typeof gScope.toast === 'function') {
          gScope.toast('⚠️ LAST STAND! SURVIVE THE HORDE! (+250 XP BONUS)');
        }
        playInfectionSfx('last_stand');
        match.shake = Math.max(match.shake || 0, 10);
        match.flash = 0.2;
      }
    } else {
      // Clear lone survivor status if survivors > 1
      for (const p of match.players) {
        p.isLoneSurvivor = false;
      }
      infectionState.loneSurvivorSlot = -1;
      infectionState.lastStandAnnounced = false;

      // Phase 2: 2v2 (or balanced infected vs survivors)
      if (infected.length >= 2 && survivors.length >= 2 && infected.length === survivors.length) {
        phase = 2;
      } else if (infected.length === 1 && survivors.length >= 3) {
        // Phase 1: 1 Infected (Patient Zero) vs 3+ Survivors
        phase = 1;
      } else if (infected.length < survivors.length) {
        phase = 1;
      } else {
        phase = 2;
      }
    }

    infectionState.phase = phase;
    return phase;
  }

  /**
   * Returns dynamically adjusted run speed in px/s for player `p`.
   * Directly satisfies:
   * - Phase 1 (1v3+): Patient Zero = 615 px/s (1.22x), Survivors = 504 px/s.
   * - Phase 2 (2v2): Infected = 545 px/s (1.08x), Survivors = 504 px/s.
   * - Phase 3 (3+v1): Lone Survivor = 605 px/s (1.20x), Zombies = 520 px/s.
   */
  function getInfectionPlayerSpeed(p) {
    if (!p) return INFECTION_CONFIG.SPEED_SURVIVOR_BASE;
    const phase = infectionState.phase || evaluateInfectionPhase();

    if (phase === 3) {
      // Phase 3: Lone Survivor gets 1.20x speed boost ($605 px/s), Zombies drop to normal ($520 px/s)
      if (p.isLoneSurvivor) return INFECTION_CONFIG.SPEED_LONE_SURVIVOR;
      if (p.isInfected) return INFECTION_CONFIG.SPEED_ZOMBIE_P3;
      return INFECTION_CONFIG.SPEED_SURVIVOR_BASE;
    }

    if (phase === 2) {
      // Phase 2: Infected get 1.08x speed ($545 px/s), Survivors normal ($504 px/s)
      if (p.isInfected) return INFECTION_CONFIG.SPEED_INFECTED_P2;
      return INFECTION_CONFIG.SPEED_SURVIVOR_BASE;
    }

    // Phase 1: Patient Zero gets 1.22x speed ($615 px/s), Survivors normal ($504 px/s)
    if (p.isInfected || p.isPatientZero) return INFECTION_CONFIG.SPEED_PATIENT_ZERO;
    return INFECTION_CONFIG.SPEED_SURVIVOR_BASE;
  }

  /**
   * Returns extra jump hold duration for Patient Zero in Phase 1
   */
  function getInfectionHoldLift(p) {
    if (p && p.isInfected && infectionState.phase === 1) {
      return INFECTION_CONFIG.HOLD_LIFT_PATIENT_ZERO;
    }
    return INFECTION_CONFIG.HOLD_LIFT_BASE;
  }

  // ============================================================================
  // REPULSOR PULSE MECHANICS
  // ============================================================================

  /**
   * Triggers the 8-second repulsor pulse from the Lone Survivor,
   * knocking all nearby zombies back by 120px.
   */
  function triggerRepulsorPulse(survivor) {
    const match = Imatch();
    if (!match || !match.players || !survivor) return;

    const sx = survivor.x + survivor.w / 2;
    const sy = survivor.y + survivor.h / 2;

    // Add visual expanding shockwave
    addRepulsorShockwave(sx, sy);
    survivor.repulsorFlash = 0.5;
    playInfectionSfx('repulsor');

    if (match) {
      match.shake = Math.max(match.shake || 0, 7);
    }

    // Find and repel all nearby infected zombies
    for (let i = 0; i < match.players.length; i++) {
      const z = match.players[i];
      if (!z.isInfected || z.isEliminated || z === survivor) continue;

      const zx = z.x + z.w / 2;
      const zy = z.y + z.h / 2;
      const dx = zx - sx;
      const dy = zy - sy;
      const dist = Math.hypot(dx, dy);

      if (dist < INFECTION_CONFIG.REPULSOR_RADIUS) {
        // Outward normal vector
        const nx = dist > 0.001 ? (dx / dist) : (Math.random() < 0.5 ? -1 : 1);
        const ny = dist > 0.001 ? (dy / dist) : -0.5;

        // Knockback displacement (120px)
        z.x += nx * INFECTION_CONFIG.REPULSOR_KNOCKBACK;
        z.y += ny * (INFECTION_CONFIG.REPULSOR_KNOCKBACK * 0.4);

        // Apply dynamic velocity blast
        z.vx = nx * INFECTION_CONFIG.REPULSOR_IMPULSE_X;
        z.vy = INFECTION_CONFIG.REPULSOR_IMPULSE_Y;
        z.grounded = false;
        z.gp = null;

        // Safety clamp within arena walls
        const wallW = typeof gScope.WALL === 'number' ? gScope.WALL : 60;
        const arenaW = typeof gScope.W === 'number' ? gScope.W : 2400;
        const arenaH = typeof gScope.H === 'number' ? gScope.H : 1320;
        z.x = Math.max(wallW + 4, Math.min(arenaW - wallW - z.w - 4, z.x));
        z.y = Math.max(wallW + 4, Math.min(arenaH - wallW - z.h - 4, z.y));

        // Impact dust / burst
        if (typeof gScope.dust === 'function') {
          gScope.dust(zx, zy, 8, 140);
        }
      }
    }
  }

  // ============================================================================
  // TAGGING COLLISION & INFECTION: checkInfectionTag()
  // ============================================================================

  /**
   * Helper to compute bounding collision box
   */
  function getPlayerTagBox(p) {
    if (typeof gScope.tagBox === 'function') return gScope.tagBox(p);
    const pad = 5;
    return { x: p.x - pad, y: p.y - pad, w: p.w + 2 * pad, h: p.h + 2 * pad };
  }

  /**
   * Helper to check inclusive rectangle overlap
   */
  function boxesOverlap(a, b) {
    if (typeof gScope.hitRectInclusive === 'function') return gScope.hitRectInclusive(a, b);
    return a.x <= b.x + b.w && a.x + a.w >= b.x && a.y <= b.y + b.h && a.y + a.h >= b.y;
  }

  /**
   * Checks collisions between infected hunters and healthy survivors.
   * Transmits infection on touch (p.isInfected = true) and triggers phase updates.
   */
  function checkInfectionTag() {
    const match = Imatch();
    if (!match || match.state !== 'playing' || match.cooldown > 0) return;
    const P = match.players;
    if (!P || P.length < 2) return;

    const __inet = Inet();
    const isOnline = (__inet && __inet.role !== null);
    const isOnlineGuest = isOnline && !__inet.isHost;

    const hunters = P.filter(p => p.isInfected && !p.isEliminated);
    const runners = P.filter(p => !p.isInfected && !p.isEliminated);

    for (const hunter of hunters) {
      const hBox = getPlayerTagBox(hunter);

      for (const runner of runners) {
        const rBox = getPlayerTagBox(runner);

        if (boxesOverlap(hBox, rBox)) {
          const popX = (hunter.x + runner.x) / 2 + runner.w / 2;
          const popY = (hunter.y + runner.y) / 2 + runner.h / 2;

          if (isOnlineGuest) {
            if (hunter.slot === __inet.mySlot && typeof gScope.netBroadcastReliable === 'function') {
              gScope.netBroadcastReliable({
                t: 'tag_claim',
                from: hunter.slot,
                target: runner.slot,
                x: popX, y: popY,
                hx: Math.round(hunter.x), hy: Math.round(hunter.y),
                tx: Math.round(runner.x), ty: Math.round(runner.y)
              });
              match.cooldown = 0.5;
            }
            return;
          }

          // Infect runner!
          runner.isInfected = true;
          runner.tagT = 0.5;

          // Increment hunter tags
          const hunterIdx = P.indexOf(hunter);
          if (match.tags) {
            match.tags[hunterIdx] = (match.tags[hunterIdx] || 0) + 1;
          }

          // Visual & Audio juice
          addInfectionBurst(popX, popY);
          if (typeof gScope.ringP === 'function') gScope.ringP(popX, popY, INFECTION_CONFIG.COLOR_TOXIC_LIME);
          playInfectionSfx('infect');

          match.shake = Math.max(match.shake || 0, 9);
          match.flash = 0.14;
          match.tagPop = {
            x: popX,
            y: popY,
            t: 0.65,
            who: P.indexOf(runner),
            hunter: hunterIdx,
            label: 'INFECTED! ☣️'
          };

          // Re-evaluate game balance phase
          evaluateInfectionPhase();

          // WIN CONDITION CHECK: All survivors infected? (Zombies Win)
          const remainingSurvivors = P.filter(p => !p.isInfected && !p.isEliminated);
          if (remainingSurvivors.length === 0) {
            match.result = {
              winningTeam: 'zombies',
              mode: 'infection',
              reason: 'all_infected',
              loser: -1
            };
            if (typeof gScope.endMatch === 'function') {
              gScope.endMatch();
            } else {
              match.state = 'result';
            }
            return;
          }

          match.cooldown = 0.35;
          return;
        }
      }
    }
  }

  // ============================================================================
  // UPDATE LOOP: updateInfection(dt)
  // ============================================================================

  /**
   * Main per-frame update for Infection Mode.
   * Handles:
   * - Slime particle trails for infected players
   * - Last Stand repulsor pulse countdown & trigger
   * - Timer expiry win condition (Survivors Win)
   * - Accolades and +250 XP payout
   */
  function updateInfection(dt) {
    const match = Imatch();
    if (!match) return;

    // Update particles & shockwaves
    updateInfectionFX(dt);

    if (match.state !== 'playing') return;

    // Evaluate phase continually
    evaluateInfectionPhase();

    // Update players
    for (let i = 0; i < match.players.length; i++) {
      const p = match.players[i];
      if (p.isEliminated) continue;

      // 1. Toxic Slime Trails for Infected Players
      if (p.isInfected) {
        p.slimeEmitT = (p.slimeEmitT || 0) + dt;
        // Emit more frequently for Patient Zero or when sprinting
        const emitInterval = p.isPatientZero ? 0.04 : 0.07;
        if (p.slimeEmitT >= emitInterval) {
          p.slimeEmitT = 0;
          const px = p.x + p.w / 2 + (Math.random() - 0.5) * (p.w * 0.7);
          const py = p.y + p.h - 4;
          const col = p.isPatientZero ? '#39ff14' : '#22c55e';
          addSlimeParticle(px, py, -p.vx * 0.15 + (Math.random() - 0.5) * 20, Math.random() * 20 + 10, Math.random() * 3 + 2, col, 200);
        }
      }

      // 2. Last Stand Lone Survivor Repulsor Timer
      if (p.isLoneSurvivor) {
        p.repulsorTimer = (p.repulsorTimer !== undefined ? p.repulsorTimer : INFECTION_CONFIG.REPULSOR_INTERVAL) - dt;
        if (p.repulsorFlash > 0) p.repulsorFlash -= dt;

        if (p.repulsorTimer <= 0) {
          triggerRepulsorPulse(p);
          p.repulsorTimer = INFECTION_CONFIG.REPULSOR_INTERVAL;
        }

        // Golden aura trail
        p.lastStandAuraT = (p.lastStandAuraT || 0) + dt;
        if (p.lastStandAuraT >= 0.05) {
          p.lastStandAuraT = 0;
          if (typeof gScope.addP === 'function') {
            gScope.addP({
              x: p.x + p.w / 2 + (Math.random() - 0.5) * p.w,
              y: p.y + p.h / 2 + (Math.random() - 0.5) * p.h,
              vx: (Math.random() - 0.5) * 30,
              vy: (Math.random() - 0.5) * 30 - 20,
              life: 0.35,
              max: 0.35,
              size: Math.random() * 3.5 + 2,
              col: '#fbbf24',
              grav: -50,
              shape: 0
            });
          }
        }
      }
    }

    // 3. Timer Expiry: Survivors Win!
    if (match.timer <= 0 && !infectionState.roundWon) {
      infectionState.roundWon = true;
      const survivingPlayers = match.players.filter(p => !p.isInfected && !p.isEliminated);

      match.result = {
        winningTeam: 'survivors',
        mode: 'infection',
        reason: 'survived',
        survivors: survivingPlayers.map(p => p.slot),
        _loneSurvivorBonus: (survivingPlayers.length === 1 ? survivingPlayers[0].slot : -1)
      };

      // Lone-survivor accolade/toast only for a true 1-person Last Stand.
      // The +250 XP is awarded once in careerRecordMatch via _loneSurvivorBonus
      // (prevents double-count with the generic match XP below).
      try {
        if (survivingPlayers.length === 1) {
          const career = Icareer();
          if (career) {
            if (!career.accolades) career.accolades = [];
            if (!career.accolades.includes('Lone Survivor')) {
              career.accolades.push('Lone Survivor');
            }
            if (typeof gScope.toast === 'function') {
              gScope.toast('🏆 LONE SURVIVOR! +250 CAREER XP & ACCOLADE UNLOCKED!');
            }
            const __saveCareer = IsaveCareer();
            if (__saveCareer) {
              try{ __saveCareer(); }catch(e2){}
            }
          }
        }
      } catch (err) {
        // Safe failover for career persistence
      }

      playInfectionSfx('win_survivors');
      if (typeof gScope.endMatch === 'function') {
        gScope.endMatch();
      } else {
        match.state = 'result';
      }
    }
  }

  // ============================================================================
  // BOT AI INTEGRATION: infectionBotThink(p, dt)
  // ============================================================================

  /**
   * Advanced Bot AI decision making for Infection Mode.
   * - Zombie Bots: Chases nearest survivor, executes coordinated pincer flanks when 2+ zombies exist.
   * - Survivor Bots: Flee zombies, seek high ground, use drop-through pink platforms.
   * Returns: { dir: -1|0|1, jumpEdge: bool, jumpHeld: bool, downHeld: bool }
   */
  function infectionBotThink(p, dt) {
    if (!p || p.isEliminated || p.isFrozen) {
      return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
    }
    if (typeof botInputFor === 'function') {
      return botInputFor(p, dt);
    }
    return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
  }

  // ============================================================================
  // RENDERING & VISUAL POLISH: drawInfectionPlayer(p)
  // ============================================================================

  /**
   * Renders infection-specific player graphics:
   * - Glowing toxic aura and evil/zombie face for infected
   * - Pulsing skull badge above infected players
   * - Golden protective shield aura and runes for Lone Survivor
   */
  function drawInfectionPlayer(p) {
    if (!p || p.isEliminated) return;
    const g = Ictx();
    if (!g) return;

    const tGlobal = gScope.tGlobal || (Date.now() * 0.001);
    const cx = p.x + p.w / 2;
    const cy = p.y + p.h / 2;

    // --------------------------------------------------------------------------
    // 1. INFECTED / ZOMBIE RENDERING
    // Character body itself is rendered in zombie green variant; no extra clutter/face/overlays.

    // --------------------------------------------------------------------------
    // 2. LONE SURVIVOR LAST STAND RENDERING
    // --------------------------------------------------------------------------
    if (p.isLoneSurvivor) {
      g.save();

      const pulse = 0.85 + 0.15 * Math.sin(tGlobal * 8);

      // Radiant golden glow
      g.shadowColor = '#ffd700';
      g.shadowBlur = 18 * pulse;

      // Double-layered golden energy shield
      g.lineWidth = 3.0;
      g.strokeStyle = 'rgba(251, 191, 36, 0.95)';
      if (typeof gScope.rr === 'function') {
        gScope.rr(g, p.x - 8, p.y - 8, p.w + 16, p.h + 16, 14);
        g.stroke();
      }

      g.lineWidth = 1.5;
      g.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      if (typeof gScope.rr === 'function') {
        gScope.rr(g, p.x - 4, p.y - 4, p.w + 8, p.h + 8, 10);
        g.stroke();
      }

      // Rotating protective shield rune nodes (4 orbiting diamonds)
      for (let k = 0; k < 4; k++) {
        const angle = (tGlobal * 3.2) + (k * Math.PI * 0.5);
        const distR = p.w * 0.78;
        const rx = cx + Math.cos(angle) * distR;
        const ry = cy + Math.sin(angle) * distR;

        g.fillStyle = (k % 2 === 0) ? '#fbbf24' : '#ffffff';
        g.beginPath();
        g.moveTo(rx, ry - 4);
        g.lineTo(rx + 3.5, ry);
        g.lineTo(rx, ry + 4);
        g.lineTo(rx - 3.5, ry);
        g.closePath();
        g.fill();
      }

      // Flash on repulsor blast
      if (p.repulsorFlash > 0) {
        g.fillStyle = 'rgba(255, 255, 255, ' + (p.repulsorFlash * 1.5).toFixed(2) + ')';
        if (typeof gScope.rr === 'function') {
          gScope.rr(g, p.x - 12, p.y - 12, p.w + 24, p.h + 24, 16);
          g.fill();
        }
      }

      // Overhead Last Stand Badge & Repulsor Meter
      const badgeY = p.y - 20;
      if (typeof gScope.ptxt === 'function') {
        gScope.ptxt('🛡️ LAST STAND', cx, badgeY, typeof gScope.FN === 'function' ? gScope.FN(11, 900) : '900 11px sans-serif', '#fbbf24');
      }

      // Mini repulsor cooldown bar under badge
      const barW = 42, barH = 5;
      const barX = cx - barW / 2, barY = p.y - 10;
      const pct = Math.max(0, Math.min(1, 1 - ((p.repulsorTimer || 0) / INFECTION_CONFIG.REPULSOR_INTERVAL)));

      g.fillStyle = 'rgba(20, 20, 20, 0.75)';
      g.fillRect(barX, barY, barW, barH);
      g.fillStyle = pct >= 0.99 ? '#39ff14' : '#fbbf24';
      g.fillRect(barX + 1, barY + 1, (barW - 2) * pct, barH - 2);

      g.restore();
    }
  }
