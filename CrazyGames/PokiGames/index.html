      } else if (!isCarrier && Math.abs(p.vx) > targetMax && (!p.padOn)) {
        // Softly clamp non-carrier runners back to 504 px/s
        p.vx = Math.sign(p.vx) * (targetMax + (Math.abs(p.vx) - targetMax) * Math.max(0, 1 - stepDt * 10));
      }
    }

    // 2. FUSE COUNTDOWN:
    BOMB_MODE.fuse = Math.max(0, BOMB_MODE.fuse - timerDt);
    const isDesperation = (BOMB_MODE.fuse < BOMB_CONFIG.DESPERATION_THRESHOLD);

    // 3. FUSE SPARK EMISSION:
    if (carrier) {
      const bombHeadX = carrier.x + carrier.w / 2;
      const bombHeadY = carrier.y - 20;
      emitFuseSparks(bombHeadX + 6, bombHeadY - 10, isDesperation);
    }

    // 4. TICKING SOUND TEMPO:
    // Normal rate (fuse >= 3s): ticks once every 1.0 second.
    // Desperation rate (fuse < 3s): ticks at 2x rate (every 0.5s) with rising urgency!
    const tickStep = isDesperation ? Math.floor(BOMB_MODE.fuse * 2.0) : Math.floor(BOMB_MODE.fuse);
    if (tickStep !== BOMB_MODE.lastTickStep && BOMB_MODE.fuse > 0.05) {
      BOMB_MODE.lastTickStep = tickStep;
      playBombTick(isDesperation);
    }

    // 5. DETONATION AT 0.0s: BOOM!
    if (BOMB_MODE.fuse <= 0) {
      detonateBombHolder();
    }
  }

  /**
   * Detonates the bomb carrier at 0.0s fuse:
   * Carrier explodes into confetti, eliminated, heavy screenshake, sound FX.
   */
  function detonateBombHolder() {
    const P = (typeof match !== 'undefined' && match && match.players) ? match.players : [];
    const victimIdx = BOMB_MODE.carrierIdx;
    const victim = P[victimIdx];

    if (!victim || victim.isEliminated) return;

    // Eliminate victim
    victim.isEliminated = true;
    victim.vx = 0;
    victim.vy = 0;

    BOMB_MODE.detonatedIdx = victimIdx;
    BOMB_MODE.state = 'detonated';
    BOMB_MODE.detonationT = BOMB_CONFIG.INTERMISSION_DELAY;

    const popX = victim.x + victim.w / 2;
    const popY = victim.y + victim.h / 2;

    // Visual Explosion: Confetti and Colorful Particle Blast
    spawnExplosionEffects(popX, popY);

    // Heavy Screen Shake and Flash
    if (typeof match !== 'undefined' && match) {
      match.shake = 34; // Strong visceral screen shake
      match.flash = 0.38;
      match.freeze = 0.12; // 120ms dramatic hit-stop impact
      match.tagPop = {
        x: popX,
        y: popY,
        t: 0.9,
        who: victimIdx,
        label: '💥 BOOM! 💥'
      };
    }

    // Explosion Audio
    playBombExplosionSfx();

    // Check living survivors count
    const remainingSurvivors = getActiveSurvivors();
    BOMB_MODE.bannerText = `💥 PLAYER ${victimIdx + 1} DETONATED! 💥`;
    BOMB_MODE.bannerSubtext = remainingSurvivors.length <= 1
      ? 'CHAMPION DECIDED!'
      : `${remainingSurvivors.length} PLAYERS REMAIN!`;
    BOMB_MODE.bannerT = BOMB_CONFIG.INTERMISSION_DELAY;

    if (typeof toast === 'function') {
      try { toast(BOMB_MODE.bannerText); } catch (e) {}
    }
  }

    const confettiColors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#ffffff', '#ffd32a'];

        y: y + _rand(-10, 10),

        life: _rand(1.2, 2.4),

      };
      if (typeof addP === 'function') {

  /**
   * Collision check and bomb pass handler.
   * Transfers bomb to receiver, applies 2.0s anti-retag shield to passer,
   * adds +1.5s fuse bonus (capped at 12s), and triggers audio/visual feedback.
   */
  function checkBombTag() {
    if (!BOMB_MODE.active || BOMB_MODE.state !== 'playing') return;
    const P = (typeof match !== 'undefined' && match && match.players) ? match.players : [];
    if (BOMB_MODE.carrierIdx < 0 || BOMB_MODE.carrierIdx >= P.length) return;

    const carrier = P[BOMB_MODE.carrierIdx];
    if (!carrier || carrier.isEliminated) return;

    const carrierBox = _tagBox(carrier);

    for (let j = 0; j < P.length; j++) {
      if (j === BOMB_MODE.carrierIdx) continue;
      const runner = P[j];
      if (!runner || runner.isEliminated) continue;

      // Anti-Re-Tag Shield check: Player with active shield CANNOT receive the bomb!
      const runnerImmunity = BOMB_MODE.passImmunity[runner.slot != null ? runner.slot : j] || 0;
      if (runnerImmunity > 0) continue;

      const runnerBox = _tagBox(runner);

      // Check collision
      if (_hitRectInclusive(carrierBox, runnerBox)) {
        // Tag Collision confirmed! Perform the Pass:
        const oldCarrierIdx = BOMB_MODE.carrierIdx;
        const newCarrierIdx = j;

        // 1. Anti-Re-Tag Shield: Passer gets EXACTLY 2.0s immunity!
        const passerKey = carrier.slot != null ? carrier.slot : oldCarrierIdx;
        BOMB_MODE.passImmunity[passerKey] = BOMB_CONFIG.ANTI_RETAG_DURATION; // 2.0 seconds
        BOMB_MODE.lastPasser = oldCarrierIdx;

        // 2. Transfer bomb to runner
        BOMB_MODE.carrierIdx = newCarrierIdx;
        BOMB_MODE.carrierPlayer = runner;
        if (typeof match !== 'undefined' && match) {
          match.it = newCarrierIdx;
          if (match.tags) {
            match.tags[newCarrierIdx] = (match.tags[newCarrierIdx] || 0) + 1;
          }
        }

        // 3. Fuse Extension on Pass: +1.5s (capped at 12.0s)
        // If fuse is already > 12s (e.g. 13s right at start), do not penalize down to 12s
        BOMB_MODE.fuse = Math.max(BOMB_MODE.fuse, Math.min(BOMB_CONFIG.PASS_FUSE_CAP, BOMB_MODE.fuse + BOMB_CONFIG.PASS_FUSE_BONUS));
        if (typeof match !== 'undefined' && match) {
          match.timer = BOMB_MODE.fuse;
        }

        // 4. Audio/Visual feedback
        const popX = (carrier.x + runner.x) / 2 + 23;
        const popY = (carrier.y + runner.y) / 2 + 10;

        playBombPassSfx();

        if (typeof match !== 'undefined' && match) {
          match.freeze = 0.06; // Snappy 60ms hit-stop
          match.shake = 9;
          match.flash = 0.14;
          match.tagPop = {
            x: popX,
            y: popY,
            t: 0.55,
            label: 'PASSED! +1.5s'
          };
        }

        if (typeof tagBurst === 'function') {
          try { tagBurst(popX, popY, '#ffd32a', '#ff4757'); } catch (e) {}
        }

        if (typeof toast === 'function') {
          try { toast(`💣 PASSED TO P${newCarrierIdx + 1}! (+1.5s FUSE)`); } catch (e) {}
        }

        return; // Only one tag pass per frame
      }
    }
  }

  /* ================= RENDERING & UI FUNCTIONS ================= */

  /**
   * Draws the prominent Bomb HUD countdown timer, danger colors,
   * active survivor roster, and Sudden Death indicators.
   */
  function drawBombUI() {
    if (!BOMB_MODE.active) {
      try{ if(typeof settings !== 'undefined' && settings && settings.gameMode === 'bomb') BOMB_MODE.active = true; }catch(e){}
      if (!BOMB_MODE.active) return;
    }
    const ctx = getGlobalCtx();
    if (!ctx) return;

    const screenW = (typeof CW !== 'undefined') ? CW : (ctx.canvas ? ctx.canvas.width : 1280);
    const screenH = (typeof CH !== 'undefined') ? CH : (ctx.canvas ? ctx.canvas.height : 720);
    const P = (typeof match !== 'undefined' && match && match.players) ? match.players : [];
    const t = _getTime();

    ctx.save();

    // -------------------------------------------------------------
    // 1. TOP-CENTER BOMB TIMER WIDGET
    // -------------------------------------------------------------
    const isDesperation = (BOMB_MODE.fuse < BOMB_CONFIG.DESPERATION_THRESHOLD && BOMB_MODE.state === 'playing');
    const isWarning = (BOMB_MODE.fuse < 6.0 && !isDesperation);
    const hudW = Math.min(240, screenW * 0.34);
    const hudH = 50;
    const hudX = screenW / 2 - hudW / 2;
    const hudY = 10;

    // Glowing border & background based on danger level
    let borderColor = '#f59e0b';
    let bgColor = 'rgba(20, 26, 38, 0.94)';
    let textColor = '#ffffff';

    if (isDesperation) {
      // Rapid flashing white and bright red (24 Hz strobe)
      const flashStrobe = Math.sin(t * 24) > 0;
      borderColor = flashStrobe ? '#ffffff' : '#ff0033';
      bgColor = flashStrobe ? 'rgba(220, 20, 40, 0.96)' : 'rgba(30, 10, 16, 0.96)';
      textColor = flashStrobe ? '#ffffff' : '#ffdddd';
      ctx.shadowColor = '#ff0033';
      ctx.shadowBlur = 18;
    } else if (isWarning) {
      borderColor = '#ef4444';
      bgColor = 'rgba(40, 18, 24, 0.94)';
      textColor = '#ffe5e5';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
    }

    // Outer rounded container
    if (typeof rr === 'function') {
      rr(ctx, hudX, hudY, hudW, hudH, 12);
    } else {
      ctx.beginPath();
      ctx.rect(hudX, hudY, hudW, hudH);
    }
    ctx.fillStyle = bgColor;
    ctx.fill();
    ctx.lineWidth = isDesperation ? 3.5 : 2.5;
    ctx.strokeStyle = borderColor;
    ctx.stroke();
    ctx.shadowBlur = 0; // Reset shadow

    // Progress Bar along bottom of HUD pill
    const fuseFraction = _clamp(BOMB_MODE.fuse / Math.max(0.1, BOMB_MODE.maxFuse), 0, 1);
    const barPad = 6;
    const barW = (hudW - barPad * 2) * fuseFraction;
    const barH = 4;
    const barY = hudY + hudH - barH - 4;

    ctx.fillStyle = isDesperation ? '#ffffff' : (isWarning ? '#ef4444' : '#f59e0b');
    ctx.fillRect(hudX + barPad, barY, barW, barH);

    // Animated Bomb Icon inside HUD
    const iconX = hudX + 28;
    const iconY = hudY + hudH / 2 - 2;
    drawMiniBombIcon(ctx, iconX, iconY, isDesperation, t);

    // Large Digits Fuse Readout: e.g. "7.4s"
    const fuseString = BOMB_MODE.fuse <= 0 ? 'BOOM!' : (BOMB_MODE.fuse.toFixed(1) + 's');
    ctx.font = getGlobalFont(26, 900);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Dark text outline for maximum legibility
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#10141e';
    ctx.strokeText(fuseString, hudX + hudW / 2 + 16, hudY + hudH / 2 - 1);
    ctx.fillStyle = textColor;
    ctx.fillText(fuseString, hudX + hudW / 2 + 16, hudY + hudH / 2 - 1);

    // -------------------------------------------------------------
    // 2. SUDDEN DEATH / MODE BADGE
    // -------------------------------------------------------------
    const livingCount = getActiveSurvivors().length;
    if (livingCount === 2 && BOMB_MODE.state === 'playing') {
      const badgeText = '⚡ SUDDEN DEATH 1v1 ⚡';
      const badgeW = 160;
      const badgeH = 18;
      const badgeX = screenW / 2 - badgeW / 2;
      const badgeY = hudY + hudH + 4;

      if (typeof rr === 'function') rr(ctx, badgeX, badgeY, badgeW, badgeH, 6);
      else ctx.rect(badgeX, badgeY, badgeW, badgeH);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.92)';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.font = getGlobalFont(10, 900);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(badgeText, screenW / 2, badgeY + badgeH / 2 + 1);
    }

    // -------------------------------------------------------------
    // 3. ACTIVE SURVIVOR ROSTER PILLS (Left side)
    // -------------------------------------------------------------
    const pillH = P.length > 4 ? 22 : 26;
    const pillGap = P.length > 4 ? 25 : 30;

    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      const y = 10 + i * pillGap;
      const isCarrier = (i === BOMB_MODE.carrierIdx && !p.isEliminated);
      const isDead = p.isEliminated;

      ctx.save();
      ctx.globalAlpha = isDead ? 0.35 : (isCarrier ? 1.0 : 0.85);

      const pillBg = isCarrier ? 'rgba(239, 68, 68, 0.92)' : (isDead ? 'rgba(20, 24, 32, 0.65)' : 'rgba(20, 28, 42, 0.85)');
      const pillBorder = isCarrier ? '#ffffff' : (isDead ? '#334155' : '#475569');
      const pillW = isCarrier ? 134 : 108;

      if (typeof rr === 'function') rr(ctx, 10, y, pillW, pillH, 8);
      else ctx.rect(10, y, pillW, pillH);
      ctx.fillStyle = pillBg;
      ctx.fill();
      ctx.lineWidth = isCarrier ? 2.5 : 1.5;
      ctx.strokeStyle = pillBorder;
      ctx.stroke();

      // Color swatch
      ctx.fillStyle = getPlayerCol(p);
      if (typeof rr === 'function') rr(ctx, 14, y + (pillH - 14) / 2, 14, 14, 3);
      else ctx.fillRect(14, y + (pillH - 14) / 2, 14, 14);

      // Label
      let pLabel = `P${p.slot != null ? p.slot + 1 : i + 1}`;
      if (isDead) pLabel += ' 💀';
      else if (isCarrier) pLabel += ' 💣 BOMB';

      ctx.font = getGlobalFont(P.length > 4 ? 10 : 11, 900);
      ctx.textAlign = 'left';
      ctx.fillStyle = isCarrier ? '#ffffff' : (isDead ? '#94a3b8' : '#ffffff');
      ctx.fillText(pLabel, 34, y + pillH / 2 + 1);

      ctx.restore();
    }

    // -------------------------------------------------------------
    // 4. DETONATION INTERMISSION BANNER
    // -------------------------------------------------------------
    if (BOMB_MODE.bannerT > 0 && BOMB_MODE.bannerText) {
      const bannerW = Math.min(480, screenW - 40);
      const bannerH = 74;
      const bx = screenW / 2 - bannerW / 2;
      const by = screenH * 0.28;

      ctx.save();
      const alpha = _clamp(BOMB_MODE.bannerT / 0.3, 0, 1);
      ctx.globalAlpha = alpha;

      if (typeof rr === 'function') rr(ctx, bx, by, bannerW, bannerH, 16);
      else ctx.rect(bx, by, bannerW, bannerH);
      ctx.fillStyle = 'rgba(15, 20, 30, 0.95)';
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#ef4444';
      ctx.stroke();

      ctx.font = getGlobalFont(24, 900);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ff4757';
      ctx.fillText(BOMB_MODE.bannerText, screenW / 2, by + 26);

      ctx.font = getGlobalFont(14, 800);
      ctx.fillStyle = '#f8fafc';
      ctx.fillText(BOMB_MODE.bannerSubtext, screenW / 2, by + 52);
      ctx.restore();
    }

    ctx.restore();
  }

  /**
   * Helper to draw a stylized mini bomb icon with a live spark inside the HUD.
   */
  function drawMiniBombIcon(ctx, x, y, isDesp, t) {
    ctx.save();
    ctx.translate(x, y);

    // Bomb body
    ctx.beginPath();
    ctx.arc(0, 2, 9, 0, Math.PI * 2);
    ctx.fillStyle = isDesp ? (Math.sin(t * 24) > 0 ? '#ffffff' : '#22222b') : '#1e232e';
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = isDesp ? '#ff0033' : '#ffffff';
    ctx.stroke();

    // Specular highlight
    ctx.beginPath();
    ctx.arc(-3, -1, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.fill();

    // Fuse cap & line
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(-2, -8, 4, 3);

    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(4, -13, 8, -12);
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Spark star
    const sparkColor = (Math.sin(t * 30) > 0) ? '#ffffff' : '#ffd32a';
    ctx.beginPath();
    ctx.arc(8, -12, isDesp ? 3.5 : 2.5, 0, Math.PI * 2);
    ctx.fillStyle = sparkColor;
    ctx.fill();

    ctx.restore();
  }

  /**
   * Draws Bomb Tag player visuals:
   * - Animated round cartoon bomb on the carrier's head with smoking spark fuse
   * - Floating countdown timer badge right above the bomb
   * - Glowing Anti-Re-Tag Shield dome on players with immunity (2.0s duration)
   */
  function drawBombPlayer(p) {
    if (!BOMB_MODE.active || !p || p.isEliminated) return;
    const ctx = getGlobalCtx();
    if (!ctx) return;

    const P = (typeof match !== 'undefined' && match && match.players) ? match.players : [];
    const pIdx = P.indexOf(p);
    const isCarrier = (pIdx === BOMB_MODE.carrierIdx);
    const immunityKey = p.slot != null ? p.slot : pIdx;
    const immunityTime = BOMB_MODE.passImmunity[immunityKey] || 0;
    const t = _getTime();

    // -------------------------------------------------------------
    // A. ANTI-RE-TAG SHIELD DOME (2.0s immunity)
    // -------------------------------------------------------------
    if (immunityTime > 0) {
      ctx.save();
      const shieldPulse = 0.85 + 0.15 * Math.sin(t * 12 + pIdx);
      const shieldR = p.w * 0.85 * shieldPulse;
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;

      // Outer forcefield glow
      ctx.beginPath();
      ctx.arc(cx, cy, shieldR, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.stroke();

      // Hexagonal accent lines
      ctx.beginPath();
      ctx.arc(cx, cy, shieldR - 4, -0.6, 0.6);
      ctx.arc(cx, cy, shieldR - 4, Math.PI - 0.6, Math.PI + 0.6);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Shield remaining text
      const shieldLabel = `🛡️ SHIELD (${immunityTime.toFixed(1)}s)`;
      ctx.font = getGlobalFont(9.5, 900);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#0a101d';
      ctx.strokeText(shieldLabel, cx, p.y + p.h + 14);
      ctx.fillStyle = '#7dd3fc';
      ctx.fillText(shieldLabel, cx, p.y + p.h + 14);

      ctx.restore();
    }

    // -------------------------------------------------------------
    // B. ANIMATED BOMB ON CARRIER'S HEAD
    // -------------------------------------------------------------
    if (isCarrier) {
      ctx.save();
      const cx = p.x + p.w / 2;
      const cy = p.y - 12; // Resting on player head
      const isDesp = (BOMB_MODE.fuse < BOMB_CONFIG.DESPERATION_THRESHOLD && BOMB_MODE.state === 'playing');
      const tilt = _clamp((p.vx || 0) * 0.0003, -0.22, 0.22);
      const bob = Math.sin(t * 10) * 2;

      ctx.translate(cx, cy + bob);
      ctx.rotate(tilt);

      // Desperation Aura when fuse < 3.0s
      if (isDesp) {
        const auraPulse = 0.4 + 0.3 * Math.sin(t * 24);
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(239, 68, 68, ${auraPulse.toFixed(2)})`;
        ctx.fill();
      }

      // Bomb Sphere Body
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);

      // Desperation white/red flashing body
      if (isDesp) {
        const strobe = Math.sin(t * 24) > 0;
        ctx.fillStyle = strobe ? '#ffffff' : '#d90429';
      } else {
        const bombGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 14);
        bombGrad.addColorStop(0, '#3a3d4d');
        bombGrad.addColorStop(0.7, '#1b1d24');
        bombGrad.addColorStop(1, '#0c0d12');
        ctx.fillStyle = bombGrad;
      }
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = isDesp ? '#ffffff' : '#141414';
      ctx.stroke();

      // Specular highlight gleam
      if (!isDesp) {
        ctx.beginPath();
        ctx.arc(-4, -4, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fill();
      }

      // Metallic Neck Cap
      ctx.fillStyle = '#64748b';
      ctx.fillRect(-3, -16, 6, 4);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#1e293b';
      ctx.strokeRect(-3, -16, 6, 4);

      // Burning Fuse Rope (Length shortens as fuse burns)
      const fuseBurnRatio = _clamp(BOMB_MODE.fuse / Math.max(0.1, BOMB_MODE.maxFuse), 0.15, 1.0);
      const fuseTipX = 6 + fuseBurnRatio * 8;
      const fuseTipY = -18 - fuseBurnRatio * 6;

      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.quadraticCurveTo(3, -24, fuseTipX, fuseTipY);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#d97706';
      ctx.stroke();

      // Sizzling Fuse Spark Star at the burning tip
      const sparkColor = (Math.sin(t * 28) > 0) ? '#ffffff' : ((Math.sin(t * 14) > 0) ? '#ffd32a' : '#ff4757');
      const sparkRadius = isDesp ? 6 : 4;

      ctx.beginPath();
      ctx.arc(fuseTipX, fuseTipY, sparkRadius, 0, Math.PI * 2);
      ctx.fillStyle = sparkColor;
      ctx.fill();

      // Spark cross starburst rays
      ctx.lineWidth = 1.5;

    const winnerIndex = (match.players && winner) ? match.players.indexOf(winner) : 0;
    const winnerSlot = winner ? winner.slot : 0;

    match.result = {
      winner: winnerIndex,
      winnerSlot: winnerSlot,
      mode: 'crown',
      reason: reason || 'score_limit',
      scores: Object.assign({}, crownState.scores)
    };

    if (typeof endMatch === 'function') {
      endMatch();
    } else {
      match.state = 'result';
      _sfx('win');
    }
  }

  /* ==========================================================================
     10. UPDATE TICK: updateCrownMode(dt)
     ========================================================================== */
  function updateCrownMode(dt) {
    if (!crownState.active) return;
    dt = (typeof dt === 'number' && dt > 0) ? Math.min(0.5, dt) : (1 / 60);

    // Cooldown decay
    if (typeof match !== 'undefined' && match && match.cooldown > 0) {
      match.cooldown = Math.max(0, match.cooldown - dt);
    }

    const matchActive = (typeof match !== 'undefined' && match && match.state === 'playing');

    // 1. Update FX: Shockwaves (swap-pop removal, capped)
    if (crownState.shockwaves.length > 12) crownState.shockwaves.splice(0, crownState.shockwaves.length - 12);
    for (let i = crownState.shockwaves.length - 1; i >= 0; i--) {
      const sw = crownState.shockwaves[i];
      sw.r += sw.speed * dt;
      sw.life -= dt;
      sw.alpha = Math.max(0, sw.life / sw.maxLife);
      if (sw.life <= 0 || sw.r >= sw.maxR) {
        crownState.shockwaves[i] = crownState.shockwaves[crownState.shockwaves.length - 1];
        crownState.shockwaves.pop();
      }
    }

    // 2. Update FX: Particles (swap-pop removal, capped at 300)
    if (crownState.particles.length > 300) crownState.particles.splice(0, crownState.particles.length - 300);
    for (let i = crownState.particles.length - 1; i >= 0; i--) {
      const p = crownState.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 480 * dt; // Gravity
      if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
      p.life -= dt;
      if (p.life <= 0){
        crownState.particles[i] = crownState.particles[crownState.particles.length - 1];
        crownState.particles.pop();
      }
    }

    // 3. Update FX: Floaters (capped at 20)
    if (crownState.floaters.length > 20) crownState.floaters.splice(0, crownState.floaters.length - 20);
    for (let i = crownState.floaters.length - 1; i >= 0; i--) {
      const fl = crownState.floaters[i];
      if (!fl) { crownState.floaters.splice(i, 1); continue; }
      fl.y -= 44 * dt;
      fl.life -= dt;
      fl.scale = _clamp(fl.scale - dt * 0.8, 1.0, 1.6);
      if (fl.life <= 0){
        crownState.floaters.splice(i, 1);
      }
    }

    // 4. Update FX: Banners
    for (let i = crownState.banners.length - 1; i >= 0; i--) {
      const bn = crownState.banners[i];
      bn.y -= 14 * dt;
      bn.life -= dt;
      bn.scale = Math.min(1.0, bn.scale + dt * 4.5);
      if (bn.life <= 0) crownState.banners.splice(i, 1);
    }

    if (!matchActive) return;

    // 5. Unowned Crown Levitation
    if (!crownState.holder) {
      crownState.bobTimer += dt * 3.6;
      crownState.y = crownState.spawnY + Math.sin(crownState.bobTimer) * 8.5;
      crownState.x = crownState.spawnX;

      // Sparkling aura when crown waits on central pedestal
      if (Math.random() < 0.35) {
        crownState.particles.push({
          x: crownState.x + (Math.random() - 0.5) * 32,
          y: crownState.y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 30,
          vy: -30 - Math.random() * 40,
          life: 0.4 + Math.random() * 0.3,
          maxLife: 0.7,
          size: 2.5 + Math.random() * 3,
          col: Math.random() < 0.6 ? '#ffd700' : '#ffffff',
          shape: 'spark'
        });
      }
    } else {
      // 6. Owned Crown Behavior
      const king = crownState.holder;

      // Handle king elimination / disconnect
      if (king.isEliminated) {
        crownState.holder = null;
        crownState.holderIndex = -1;
        crownState.x = crownState.spawnX;
        crownState.y = crownState.spawnY;
        addCrownBanner('👑 CROWN RETURNED TO CENTER!', crownState.spawnX, crownState.spawnY - 30, '#ffd700', 2.0);
        return;
      }

      // Smooth crown following king head
      crownState.x = king.x + king.w / 2;
      crownState.y = king.y - 14;

      // Update hold timer (Fatigue accumulator)
      crownState.holdTimer += dt;

      // Update 1.2s Steal Immunity Window
      if (crownState.immunityTimer > 0) {
        crownState.immunityTimer = Math.max(0, crownState.immunityTimer - dt);
      }

      // Update Underdog Vengeance timer
      if (crownState.underdogTimer > 0) {
        crownState.underdogTimer = Math.max(0, crownState.underdogTimer - dt);
        if (crownState.underdogTimer <= 0) {
          crownState.underdogSlot = -1;
          king.underdogTimer = 0;
        }
      }

      // Sky Beacon Alpha Transition
      if (crownState.holdTimer >= CROWN_CONFIG.FATIGUE_THRESHOLD) {
        crownState.beaconAlpha = Math.min(1.0, crownState.beaconAlpha + dt * 2.5);
      } else {
        crownState.beaconAlpha = Math.max(0, crownState.beaconAlpha - dt * 3.5);
      }

      // Point Accumulator: +1 pt every 0.4s (or +2 if Underdog Vengeance)
      crownState.pointTimer += dt;
      while (crownState.pointTimer >= crownState.pointInterval) {
        crownState.pointTimer -= crownState.pointInterval;

        const isUnderdog = (crownState.underdogTimer > 0 && crownState.underdogSlot === king.slot);
        const pts = isUnderdog ? CROWN_CONFIG.UNDERDOG_PTS : CROWN_CONFIG.NORMAL_PTS;

        crownState.scores[king.slot] = (crownState.scores[king.slot] || 0) + pts;
        king.crownPoints = crownState.scores[king.slot];

        // Floating score popup above King
        addPointFloater(
          king.x + king.w / 2,
          king.y - 28,
          isUnderdog ? '+2' : '+1',
          isUnderdog ? '#ff3838' : '#ffd700'
        );

        // Win Condition Check: First to 100 points!
        if (crownState.scores[king.slot] >= crownState.targetScore) {
          crownState.scores[king.slot] = crownState.targetScore;
          triggerCrownWin(king, 'score_limit');
          return;
        }
      }
    }

    // 7. Dynamic Speed Enforcement & Rubberbanding
    const players = (typeof match !== 'undefined' && match && match.players) ? match.players : [];
    for (const p of players) {
      if (p.isEliminated || p.isFrozen) continue;

      const baseMax = getCrownPlayerSpeed(p);
      const onSpeed = p.grounded && !!_zoneAtFeet(p, 'speed');
      const isKingP = crownState.holder && crownState.holder.slot === p.slot;
      // King keeps burden even on pads (pad still helps, but capped at +15%):
      const padMult = onSpeed ? (isKingP ? 1.15 : CROWN_CONFIG.SPEED_PAD_MULT) : 1.0;
      const effMax = baseMax * padMult;

      // Trailing chasers with 540 px/s catch-up surge: ramp into high gear (no velocity snap)
      if (baseMax === CROWN_CONFIG.SPEED_CHASER_BOOST && p.grounded) {
        const want = Math.sign(p.vx || p.face || 1) * CROWN_CONFIG.SPEED_CHASER_BOOST;
        p.vx += (want - p.vx) * Math.min(1.0, dt * 8);
      }

      // Smooth deceleration clamp if exceeding assigned mode speed (pads included for king)
      if (Math.abs(p.vx) > effMax) {
        const target = Math.sign(p.vx) * effMax;
        p.vx += (target - p.vx) * Math.min(1.0, dt * 16);
      }
    }

    // 8. Match Time Limit Check
    if (typeof match !== 'undefined' && match && match.timer <= 0) {
      // Find player with highest crown points
      let bestPlayer = players[0] || null;
      let highestPts = -1;
      for (const p of players) {
        const pts = crownState.scores[p.slot] || 0;
        if (pts > highestPts) {
          highestPts = pts;
          bestPlayer = p;
        }
      }
      triggerCrownWin(bestPlayer, 'time_limit');
    }
  }

  /* ==========================================================================
     11. TAG / STEAL DETECTION: checkCrownTag()
     ========================================================================== */
  function checkCrownTag() {
    if (!crownState.active) return;
    if (typeof match === 'undefined' || !match || match.state !== 'playing' || match.cooldown > 0) return;

    const players = match.players;
    if (!players || players.length < 2) return;

    const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
    const isOnlineGuest = isOnline && !NET.isHost;

    // Case 1: Unowned Crown on Central Pedestal
    if (!crownState.holder) {
      const crownBox = {
        x: crownState.x - 22,
        y: crownState.y - 18,
        w: 44,
        h: 36
      };

      for (const p of players) {
        if (p.isEliminated || p.isFrozen) continue;
        if (_hitRectInclusive(_tagBox(p), crownBox)) {
          if (isOnlineGuest) {
            if (p.slot === NET.mySlot) {
              try {
                netBroadcastReliable({ t: 'crown_claim', from: p.slot, x: crownState.x, y: crownState.y });
                match.cooldown = 0.5;
              } catch (e) {}
            }
            return;
          }
          claimCrown(p, false, crownState.x, crownState.y);
          return;
        }
      }
      return;
    }

    // Case 2: Crown Worn by King
    const king = crownState.holder;
    if (!king || king.isEliminated) return;

    // 1.2s Steal Immunity Window: King CANNOT be tagged during this grace period!
    if (crownState.immunityTimer > 0) {
      // If a chaser touches King during immunity, deflect with golden sparks
      for (const chaser of players) {
        if (chaser === king || chaser.isEliminated || chaser.isFrozen) continue;
        if (_hitRectInclusive(_tagBox(chaser), _tagBox(king))) {
          const popX = (chaser.x + king.x) / 2 + 23;
          const popY = (chaser.y + king.y) / 2 + 10;
          // Spawn deflection sparks (rate-limited by nearMiss)
          if (!chaser.lastImmunityDeflect || (typeof tGlobal !== 'undefined' && tGlobal - chaser.lastImmunityDeflect > 0.4)) {
            chaser.lastImmunityDeflect = (typeof tGlobal !== 'undefined') ? tGlobal : Date.now() / 1000;
            addPointFloater(popX, popY - 20, 'IMMUNE! (1.2s)', '#fef08a');
            for (let i = 0; i < 8; i++) {
              const a = Math.random() * Math.PI * 2;
              crownState.particles.push({
                x: popX,
                y: popY,
                vx: Math.cos(a) * 140,
                vy: Math.sin(a) * 140,
                life: 0.25,
                maxLife: 0.25,
                size: 3,
                col: '#ffe66d',
                shape: 'spark'
              });
            }
            _sfx('back');
          }
        }
      }
      return; // Absolute tag immunity active!
    }

    // Tagging is eligible: Chasers hunt King!
    for (const chaser of players) {
      if (chaser === king || chaser.isEliminated || chaser.isFrozen) continue;

      if (_hitRectInclusive(_tagBox(chaser), _tagBox(king))) {
        const popX = (chaser.x + king.x) / 2 + 23;
        const popY = (chaser.y + king.y) / 2 + 10;

        if (isOnlineGuest) {
          if (chaser.slot === NET.mySlot) {
            try {
              netBroadcastReliable({
                t: 'crown_steal',
                from: chaser.slot,
                target: king.slot,
                x: popX,
                y: popY
              });
              match.cooldown = 0.5;
            } catch (e) {}
          }
          return;
        }

        // Host / Offline Crown Steal!
        claimCrown(chaser, true, popX, popY);
        return;
      }
    }
  }

  /* ==========================================================================
     12. RENDERING: drawCrownPlayer(p)
     ========================================================================== */
  function drawCrownPlayer(p) {
    if (!crownState.active || !p || p.isEliminated) return;

    const g = Cctx();
    if (!g) return;

    const isKing = (crownState.holder === p);
    const cx = p.x + p.w / 2;
    const cy = p.y + p.h / 2;
    const tG = (typeof tGlobal !== 'undefined') ? tGlobal : (Date.now() / 1000);

    // 1. King Fatigue Warning Indicator (> 15s Continuous Hold)
    if (isKing && crownState.beaconAlpha > 0.02) {
      g.save();
      g.globalAlpha = crownState.beaconAlpha;

      // Warning pill atop King
      const warnY = p.y - 48;
      const pulse = 1.0 + 0.10 * Math.sin(tG * 8);
      g.save();
      g.translate(cx, warnY);
      g.scale(pulse, pulse);
      _rr(g, -55, -12, 110, 22, 6);
      g.fillStyle = 'rgba(220, 38, 38, 0.92)';
      g.fill();
      g.lineWidth = 1.8;
      g.strokeStyle = '#ffd700';
      g.stroke();
      _txt(g, '⚠️ FATIGUE (460 px)', 0, 1, _fn(10, 900), '#ffffff', 'center');
      g.restore();

      g.restore();
    }

    // 2. Underdog Vengeance Flame Aura
    if (isKing && crownState.underdogTimer > 0) {
      g.save();
      const firePulse = 1.0 + 0.15 * Math.sin(tG * 12);
      const fireGrad = g.createRadialGradient(cx, cy, 10, cx, cy, 42 * firePulse);
      fireGrad.addColorStop(0, 'rgba(255, 71, 87, 0.55)');
      fireGrad.addColorStop(0.5, 'rgba(255, 159, 28, 0.35)');
      fireGrad.addColorStop(1, 'rgba(168, 85, 247, 0)');
      g.fillStyle = fireGrad;
      g.beginPath();
      g.arc(cx, cy, 42 * firePulse, 0, Math.PI * 2);
      g.fill();

      // Floating 2X flame badge
      const badgeY = p.y - 42;
      _rr(g, cx - 34, badgeY - 11, 68, 20, 6);
      g.fillStyle = 'rgba(255, 59, 48, 0.95)';
      g.fill();
      g.strokeStyle = '#ffd700';
      g.lineWidth = 1.6;
      g.stroke();
      _txt(g, '🔥 2X PTS (' + crownState.underdogTimer.toFixed(1) + 's)', cx, badgeY + 1, _fn(9.5, 900), '#ffffff', 'center');
      g.restore();
    }

    // 3. Shimmering Golden Crown Atop King Head
    if (isKing) {
      renderCrownGraphic(g, cx, p.y - 14 + Math.sin(tG * 5) * 2, 1.0, true);
    }

    // 4. 1.2s Steal Immunity Shield (Golden Translucent Aegis)
    if (isKing && crownState.immunityTimer > 0) {
      g.save();
      const remFrac = crownState.immunityTimer / CROWN_CONFIG.IMMUNITY_DURATION;
      const shieldR = 35 + Math.sin(tG * 14) * 2;

      // Shield sphere fill
      const shieldGrad = g.createRadialGradient(cx, cy, 8, cx, cy, shieldR);
      shieldGrad.addColorStop(0, 'rgba(255, 240, 160, 0.10)');
      shieldGrad.addColorStop(0.65, 'rgba(255, 215, 0, 0.25)');
      shieldGrad.addColorStop(1, 'rgba(255, 255, 255, 0.60)');
      g.fillStyle = shieldGrad;
      g.beginPath();
      g.arc(cx, cy, shieldR, 0, Math.PI * 2);
      g.fill();

      // Outer sweep countdown arc (1.2s ticking down)
      g.lineWidth = 3.2;
      g.strokeStyle = '#ffd700';
      g.beginPath();
      g.arc(cx, cy, shieldR, -Math.PI / 2, -Math.PI / 2 + remFrac * Math.PI * 2);
      g.stroke();

      // Hexagonal revolving notches
      const rot = tG * 3.5;
      g.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      g.lineWidth = 2.0;
      for (let a = 0; a < 6; a++) {
        const ang = rot + a * (Math.PI / 3);
        const px1 = cx + Math.cos(ang) * (shieldR - 4);
        const py1 = cy + Math.sin(ang) * (shieldR - 4);
        const px2 = cx + Math.cos(ang) * (shieldR + 3);
        const py2 = cy + Math.sin(ang) * (shieldR + 3);
        g.beginPath();
        g.moveTo(px1, py1);
        g.lineTo(px2, py2);
        g.stroke();
      }

      // Shield Pill Badge
      _rr(g, cx - 32, cy - shieldR - 15, 64, 18, 5);
      g.fillStyle = 'rgba(15, 23, 42, 0.90)';
      g.fill();
      g.strokeStyle = '#ffd700';
      g.lineWidth = 1.4;
      g.stroke();
      _txt(g, '🛡️ IMMUNE ' + crownState.immunityTimer.toFixed(1) + 's', cx, cy - shieldR - 5, _fn(9, 900), '#fef08a', 'center');

      g.restore();
    }

    // 5. Chaser Catch-Up Surge Aura (> 30 pts behind)
    if (!isKing && crownState.holder) {
      const kingPts = crownState.scores[crownState.holder.slot] || 0;
      const myPts = crownState.scores[p.slot] || 0;
      if (kingPts - myPts > 30) {
        g.save();
        // Cyan-gold speed streak spark
        const surgePulse = 0.22 + 0.12 * Math.sin(tG * 10);
        g.fillStyle = 'rgba(56, 189, 248, ' + surgePulse.toFixed(2) + ')';
        _rr(g, p.x - 6, p.y - 6, p.w + 12, p.h + 12, 12);
        g.fill();
        g.strokeStyle = 'rgba(255, 215, 0, 0.65)';
        g.lineWidth = 2;
        _rr(g, p.x - 3, p.y - 3, p.w + 6, p.h + 6, 10);
        g.stroke();
        g.restore();
      }
    }
  }

  /* ==========================================================================
     13. RENDERING: drawCrownEntity() & renderCrownGraphic()
     ========================================================================== */
  function renderCrownGraphic(g, cx, cy, scale, sparkle) {
    g.save();
    g.translate(cx, cy);
    if (scale !== 1.0) g.scale(scale, scale);

    const tG = (typeof tGlobal !== 'undefined') ? tGlobal : (Date.now() / 1000);

    // Crown metallic 5-point path
    // Width = 38px, Height = 24px (centered at cx, cy)
    const w = 38, h = 24;
    const x = -w / 2;
    const y = -h / 2;

    // Golden metallic gradient
    const goldGrad = g.createLinearGradient(0, y, 0, y + h);
    goldGrad.addColorStop(0, '#fff3a8');
    goldGrad.addColorStop(0.35, '#ffd700');
    goldGrad.addColorStop(0.7, '#f59e0b');
    goldGrad.addColorStop(1, '#b45309');

    // Draw 5-point crown polygon
    g.beginPath();
    g.moveTo(x, y + h);                   // Bottom-left
    g.lineTo(x + w, y + h);               // Bottom-right
    g.lineTo(x + w, y + 6);               // Far-right point base
    g.lineTo(x + w - 4, y + 2);           // Peak 5 (Far-right)
    g.lineTo(x + w * 0.72, y + 10);       // Valley 4
    g.lineTo(x + w * 0.66, y - 4);        // Peak 4 (Mid-right)
    g.lineTo(x + w * 0.50, y + 8);        // Valley 3 (Center)
    g.lineTo(x + w * 0.50, y - 10);       // Peak 3 (Center Tallest!)
    g.lineTo(x + w * 0.50, y + 8);        // Valley 2 (Center)
    g.lineTo(x + w * 0.34, y - 4);        // Peak 2 (Mid-left)
    g.lineTo(x + w * 0.28, y + 10);       // Valley 1
    g.lineTo(x + 4, y + 2);               // Peak 1 (Far-left)
    g.lineTo(x, y + 6);                   // Far-left point base
    g.closePath();

    g.fillStyle = goldGrad;
    g.fill();

    // Dark golden rim outline
    g.lineWidth = 1.8;
    g.strokeStyle = '#78350f';
    g.stroke();

    // Specular highlight gleam on front facet
    g.beginPath();
    g.moveTo(x + 4, y + h - 4);
    g.lineTo(x + w - 4, y + h - 4);
    g.strokeStyle = 'rgba(255, 255, 255, 0.75)';
    g.lineWidth = 1.6;
    g.stroke();

    // Golden pearls / finials atop the 5 peaks
    const peaks = [
      { px: x + 4, py: y + 2, r: 2.2 },
      { px: x + w * 0.34, py: y - 4, r: 2.6 },
      { px: x + w * 0.50, py: y - 10, r: 3.4 }, // Center pearl
      { px: x + w * 0.66, py: y - 4, r: 2.6 },
      { px: x + w - 4, py: y + 2, r: 2.2 }
    ];

    for (const pk of peaks) {
      g.beginPath();
      g.arc(pk.px, pk.py, pk.r, 0, Math.PI * 2);
      g.fillStyle = '#fef08a';
      g.fill();
      g.lineWidth = 1.0;
      g.strokeStyle = '#78350f';
      g.stroke();
    }

    // Jeweled Filigree Band (Ruby center, Sapphire left, Emerald right)
    const bandY = y + h - 6;

    // Center Ruby
    g.beginPath();
    g.arc(0, bandY, 3.2, 0, Math.PI * 2);
    g.fillStyle = '#ef4444';
    g.fill();
    g.strokeStyle = '#7f1d1d';
    g.lineWidth = 0.8;
    g.stroke();
    // Ruby specular
    g.fillStyle = '#ffffff';
    g.fillRect(-1.2, bandY - 2.2, 1.2, 1.2);

    // Left Sapphire
    g.beginPath();
    g.arc(-10, bandY, 2.4, 0, Math.PI * 2);
    g.fillStyle = '#3b82f6';
    g.fill();
    g.strokeStyle = '#1e3a8a';
    g.lineWidth = 0.8;
    g.stroke();

    // Right Emerald
    g.beginPath();
    g.arc(10, bandY, 2.4, 0, Math.PI * 2);
    g.fillStyle = '#10b981';
    g.fill();
    g.strokeStyle = '#064e3b';
    g.lineWidth = 0.8;
    g.stroke();

    // Star glint twinkling on center peak
    if (sparkle) {
      const glintPulse = 0.5 + 0.5 * Math.sin(tG * 6);
      const glintX = 0;
      const glintY = y - 10;

      g.save();
      g.translate(glintX, glintY);
      g.rotate(tG * 2.2);
      g.fillStyle = 'rgba(255, 255, 255, ' + glintPulse.toFixed(2) + ')';
      // 4-point star
      g.beginPath();
      g.moveTo(0, -6);
      g.lineTo(1.5, -1.5);
      g.lineTo(6, 0);
      g.lineTo(1.5, 1.5);
      g.lineTo(0, 6);
      g.lineTo(-1.5, 1.5);
      g.lineTo(-6, 0);
      g.lineTo(-1.5, -1.5);
      g.closePath();
      g.fill();
      g.restore();
    }

    g.restore();
  }

  function drawCrownEntity() {
    if (!crownState.active || crownState.holder) return;

    const g = Cctx();
    if (!g) return;

    const cx = crownState.x;
    const cy = crownState.y;
    const tG = (typeof tGlobal !== 'undefined') ? tGlobal : (Date.now() / 1000);

    g.save();

    // 1. Pedestal Light Beam down to platform
    const beamH = 38;
    const beamGrad = g.createLinearGradient(0, cy, 0, cy + beamH);
    beamGrad.addColorStop(0, 'rgba(255, 215, 0, 0.45)');
    beamGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
    g.fillStyle = beamGrad;
    g.beginPath();
    g.moveTo(cx - 16, cy + 12);
    g.lineTo(cx + 16, cy + 12);
    g.lineTo(cx + 34, cy + beamH);
    g.lineTo(cx - 34, cy + beamH);
    g.closePath();
    g.fill();

    // 2. Ambient Golden Radiance Halo

    spawnCtfSparkles(bases.red.x, bases.red.y, '#e8433f', 20);
    spawnCtfSparkles(bases.blue.x, bases.blue.y, '#2f9be8', 20);
    addCtfBanner('🚩 CAPTURE THE FLAG! FIRST TO ' + ctfState.targetCaptures, (bases.red.x + bases.blue.x) / 2, Math.min(bases.red.y, bases.blue.y) - 90, '#ffd166', 3.0);
    _sfx('go');
  }

  /* -------------------------------------------------------------------------
     Update Tick: updateCtf(dt)
     ------------------------------------------------------------------------- */
  function updateCtf(dt) {
    if (!ctfState.active) return;
    dt = (typeof dt === 'number' && dt > 0) ? Math.min(0.1, dt) : (1 / 60);

    const m = Imatch();
    if (!m || !m.players) return;
    const inPlay = (m.state === 'playing');
    const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
    const isHostOrLocal = !isOnline || (NET && NET.isHost);

    // 1. Particle & VFX simulation
    for (let i = ctfState.particles.length - 1; i >= 0; i--) {
      const pt = ctfState.particles[i];
      pt.life -= dt;
      if (pt.life <= 0) { ctfState.particles.splice(i, 1); continue; }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += (pt.grav || 100) * dt;
    }
    for (let i = ctfState.shockwaves.length - 1; i >= 0; i--) {
      const sw = ctfState.shockwaves[i];
      sw.life -= dt;
      if (sw.life <= 0) { ctfState.shockwaves.splice(i, 1); continue; }
      const f = 1 - (sw.life / sw.maxLife);
      sw.r = 10 + f * (sw.maxR - 10);
    }
    for (let i = ctfState.floaters.length - 1; i >= 0; i--) {
      const fl = ctfState.floaters[i];
      fl.life -= dt;
      if (fl.life <= 0) { ctfState.floaters.splice(i, 1); continue; }
      fl.y += fl.vy * dt;
    }
    for (let i = ctfState.banners.length - 1; i >= 0; i--) {
      const bn = ctfState.banners[i];
      bn.life -= dt;
      if (bn.life <= 0) { ctfState.banners.splice(i, 1); continue; }
    }

    // 2. Player respawn timers and shield decay
    for (const p of m.players) {
      if (p.shieldT > 0) {
        p.shieldT = Math.max(0, p.shieldT - dt);
      }
      if (p.isRespawning) {
        p.respawnT -= dt;
        p.vx = 0; p.vy = 0;
        const base = ctfState.bases[p.team != null ? (p.team % 2) : 0];
        if (base) {
          p.x = base.x - p.w / 2;
          p.y = base.y - p.h;
        }
        if (p.respawnT <= 0) {
          p.isRespawning = false;
          p.respawnT = 0;
          p.shieldT = CTF_CONFIG.SHIELD_DURATION;
          spawnCtfSparkles(p.x + p.w / 2, p.y + p.h / 2, p.team === 0 ? '#ff6b6b' : '#38bdf8', 18);
          _sfx('boost');
        }
      }
    }

    // 3. Flag physics & carrier tracking
    for (let t = 0; t < 2; t++) {
      const flag = ctfState.flags[t];
      flag.bobT += dt * 3;
      if (flag.state === 'home') {
        flag.x = flag.homeX;
        flag.y = flag.homeY + Math.sin(flag.bobT) * 4;
      } else if (flag.state === 'carried' && flag.carrier) {
        const c = flag.carrier;
        if (c.isEliminated || c.isRespawning) {
          // Carrier died or respawned -> return flag to home base
          flag.state = 'home';
          flag.carrier = null;
          flag.x = flag.homeX;
          flag.y = flag.homeY;
          addCtfFloater('FLAG RETURNED!', flag.homeX, flag.homeY - 30, t === 0 ? '#ff6b6b' : '#38bdf8', 1.8);
          _sfx('ui');
        } else {
          flag.x = c.x + c.w / 2;
          flag.y = c.y + c.h / 2 - 14;
          // Spawn carrier running sparkle trail
          if (Math.abs(c.vx) > 80 && Math.random() < 0.35) {
            ctfState.particles.push({
              x: flag.x - (c.face || 1) * 12,
              y: flag.y,
              vx: -(c.face || 1) * 30 + (Math.random() - 0.5) * 20,
              vy: -20 + (Math.random() - 0.5) * 20,
              grav: 60,
              life: 0.3,
              maxLife: 0.3,
              size: 3,
              col: t === 0 ? '#ff6b6b' : '#38bdf8'
            });
          }
        }
      }
    }

    if (!inPlay || !isHostOrLocal) return;

    // 4. Flag Pickup Check (Runner touches enemy flag at base)
    for (let team = 0; team < 2; team++) {
      const enemyTeam = 1 - team;
      const enemyFlag = ctfState.flags[enemyTeam];
      if (enemyFlag.state === 'home') {
        for (const p of m.players) {
          if (p.isEliminated || p.isRespawning || p.team !== team) continue;
          const hit = _hitRectInclusive(_tagBox(p), {
            x: enemyFlag.x - CTF_CONFIG.PICKUP_RADIUS,
            y: enemyFlag.y - CTF_CONFIG.PICKUP_RADIUS,
            w: CTF_CONFIG.PICKUP_RADIUS * 2,
            h: CTF_CONFIG.PICKUP_RADIUS * 2
          });
          if (hit) {
            enemyFlag.state = 'carried';
            enemyFlag.carrier = p;
            p.shieldT = 2.0; // 2.0s anti-camp immunity on flag pickup
            spawnCtfSparkles(enemyFlag.x, enemyFlag.y, enemyTeam === 0 ? '#ff4757' : '#38bdf8', 24);
            addCtfFloater('FLAG STOLEN! (SHIELDED)', enemyFlag.x, enemyFlag.y - 40, '#ffd166', 2.0);
            _toast((team === 0 ? '🔴 RED' : '🔵 BLUE') + ' TEAM STOLE FLAG! (🛡️ 2s IMMUNITY)');
            _sfx('boost');
            break;
          }
        }
      }
    }

    // 5. Flag Capture Check (Carrier brings enemy flag to own base pedestal)
    for (let team = 0; team < 2; team++) {
      const enemyTeam = 1 - team;
      const enemyFlag = ctfState.flags[enemyTeam];
      const ownFlag = ctfState.flags[team];
      const ownBase = ctfState.bases[team];

      if (enemyFlag.state === 'carried' && enemyFlag.carrier && enemyFlag.carrier.team === team) {
        const carrier = enemyFlag.carrier;
        const hitBase = _hitRectInclusive(_tagBox(carrier), {
          x: ownBase.x - CTF_CONFIG.CAPTURE_RADIUS,
          y: ownBase.y - CTF_CONFIG.CAPTURE_RADIUS,
          w: CTF_CONFIG.CAPTURE_RADIUS * 2,
          h: CTF_CONFIG.CAPTURE_RADIUS * 2
        });

        if (hitBase) {
          // Precondition: Own team's flag MUST be safe at home base!
          if (ownFlag.state === 'home') {
            // CAPTURE SCORED!
            ctfState.scores[team]++;
            ctfState.lastCaptureTeam = team;
            enemyFlag.state = 'home';
            enemyFlag.carrier = null;
            enemyFlag.x = enemyFlag.homeX;
            enemyFlag.y = enemyFlag.homeY;

            spawnCtfShockwave(ownBase.x, ownBase.y, team === 0 ? '#ff4757' : '#38bdf8');
            spawnCtfSparkles(ownBase.x, ownBase.y, '#ffd700', 36);
            addCtfFloater('+1 CAPTURE!', ownBase.x, ownBase.y - 50, '#2ecc71', 2.4);
            addCtfBanner((team === 0 ? '🔴 RED' : '🔵 BLUE') + ' TEAM SCORED A CAPTURE!', ownBase.x, ownBase.y - 90, team === 0 ? '#ff6b6b' : '#38bdf8', 2.8);
            _toast('🚩 ' + (team === 0 ? 'RED' : 'BLUE') + ' TEAM CAPTURED A FLAG! (' + ctfState.scores[team] + '/' + ctfState.targetCaptures + ')');
            _sfx('win');

            // Victory Check: First to target captures wins!
            if (ctfState.scores[team] >= ctfState.targetCaptures) {
              triggerCtfWin(team);
              return;
            }
            // If in Sudden Death: first capture ends match!
            if (m.isSuddenDeath) {
              triggerCtfWin(team);
              return;
            }
          } else {
            // Own flag is stolen! Carrier cannot capture until flag is reclaimed.
            if (!carrier._warnThrottled || (Date.now() - carrier._warnThrottled > 2000)) {
              carrier._warnThrottled = Date.now();
              addCtfFloater('RECLAIM YOUR FLAG FIRST!', ownBase.x, ownBase.y - 40, '#f87171', 1.8);
              _toast('⚠️ OWN FLAG MUST BE AT BASE TO CAPTURE!');
              _sfx('back');
            }
          }
        }
      }
    }
  }

  /* -------------------------------------------------------------------------
     Tagging & Instant Return: checkCtfTag()
     ------------------------------------------------------------------------- */
  function checkCtfTag() {
    if (!ctfState.active) return;
    const m = Imatch();
    if (!m || m.state !== 'playing' || !m.players || m.players.length < 2) return;

    const P = m.players;
    const arenaW = (typeof W !== 'undefined') ? W : 2400;

    for (let i = 0; i < P.length; i++) {
      const p1 = P[i];
      if (p1.isEliminated || p1.isRespawning) continue;

      for (let j = i + 1; j < P.length; j++) {
        const p2 = P[j];
        if (p2.isEliminated || p2.isRespawning) continue;
        if (p1.team === p2.team) continue; // Teammates cannot tag each other

        const box1 = _tagBox(p1);
        const box2 = _tagBox(p2);
        if (!_hitRectInclusive(box1, box2)) continue;

        // One of the players must be susceptible to tag (shield protects)
        const p1HasShield = (p1.shieldT > 0);
        const p2HasShield = (p2.shieldT > 0);

        const p1HasEnemyFlag = (ctfState.flags[1 - p1.team] && ctfState.flags[1 - p1.team].carrier === p1);
        const p2HasEnemyFlag = (ctfState.flags[1 - p2.team] && ctfState.flags[1 - p2.team].carrier === p2);

        // Case A: p1 has enemy flag and is tagged by defender p2
        if (p1HasEnemyFlag && !p1HasShield) {
          handleCtfTagCarrier(p2, p1, 1 - p1.team);
          continue;
        }
        // Case B: p2 has enemy flag and is tagged by defender p1
        if (p2HasEnemyFlag && !p2HasShield) {
          handleCtfTagCarrier(p1, p2, 1 - p2.team);
          continue;
        }

        // ONLY players carrying the enemy flag can be tagged. Non-carriers pass right through each other!
      }
    }
  }

  function handleCtfTagCarrier(defender, carrier, flagTeam) {
    const flag = ctfState.flags[flagTeam];

    /* =========================================================================
     * ALTERNATIVE CTF RULE: DROP ON TAG + TOUCH TO RETURN
     * =========================================================================
     * To switch from Instant Return to Drop on Tag:
     * 1. Set flag state to 'dropped':
     *    flag.state = 'dropped';
     *    flag.carrier = null;
     *    flag.x = carrier.x + carrier.w / 2;
     *    flag.y = carrier.y + carrier.h / 2;
     *    flag.dropTimer = 20.0;
     * 2. In update loop:
     *    - If teammate touches dropped flag: returns home instantly.
     *    - If enemy touches dropped flag: enemy picks it back up!
     * ========================================================================= */

    // DEFAULT RULE: INSTANT RETURN TO HOME BASE
    flag.state = 'home';
    flag.carrier = null;
    flag.x = flag.homeX;
    flag.y = flag.homeY;

    // Carrier eliminated & queues 1.5s respawn
    carrier.isRespawning = true;
    carrier.respawnT = CTF_CONFIG.RESPAWN_DELAY;
    carrier.vx = 0; carrier.vy = 0;

    spawnCtfShockwave(carrier.x + carrier.w / 2, carrier.y + carrier.h / 2, '#ffffff');
    spawnCtfSparkles(carrier.x + carrier.w / 2, carrier.y + carrier.h / 2, defender.team === 0 ? '#ff4757' : '#38bdf8', 24);
    spawnCtfSparkles(flag.homeX, flag.homeY, defender.team === 0 ? '#ff4757' : '#38bdf8', 20);

    addCtfFloater('FLAG RETURNED!', flag.homeX, flag.homeY - 40, defender.team === 0 ? '#ff6b6b' : '#38bdf8', 2.0);
    addCtfFloater('CARRIER TAGGED!', carrier.x + carrier.w / 2, carrier.y - 20, '#f87171', 1.8);
    _toast('🛡️ ' + (defender.team === 0 ? 'RED' : 'BLUE') + ' TEAM RETURNED THEIR FLAG!');
    _sfx('tag');
  }

  function handleCtfTagIntruder(defender, intruder) {
    intruder.isRespawning = true;
    intruder.respawnT = CTF_CONFIG.RESPAWN_DELAY;
    intruder.vx = 0; intruder.vy = 0;

    spawnCtfSparkles(intruder.x + intruder.w / 2, intruder.y + intruder.h / 2, defender.team === 0 ? '#ff4757' : '#38bdf8', 18);
    addCtfFloater('TAGGED!', intruder.x + intruder.w / 2, intruder.y - 20, '#f87171', 1.6);
    _toast((defender.team === 0 ? '🔴 RED' : '🔵 BLUE') + ' DEFENDER TAGGED AN INTRUDER!');
    _sfx('tag');
  }

  /* -------------------------------------------------------------------------
     Victory Trigger: triggerCtfWin(winningTeam)
     ------------------------------------------------------------------------- */
  function triggerCtfWin(winningTeam) {
    const m = Imatch();
    if (!m) return;
    m.result = {
      winningTeam: winningTeam,
      mode: 'ctf',
      scores: [ctfState.scores[0], ctfState.scores[1]],
      reason: 'target_reached'
    };
    if (typeof endMatch === 'function') endMatch();
  }

  /* -------------------------------------------------------------------------
     Helper: Draw High-Detail Swallowtail Pennant Flag
     ------------------------------------------------------------------------- */
  function drawPennantBanner(g, poleX, topY, fw, fh, dir, team, tG, isCarried, isStolen) {
    g.save();
    const baseCol = team === 0 ? '#dc2626' : '#2563eb';
    const brightCol = team === 0 ? '#ff6b6b' : '#38bdf8';
    const deepCol = team === 0 ? '#881337' : '#1e3a8a';
    const trimCol = '#fef08a';

    const waveFreq = isCarried ? 16.0 : 6.0;
    const waveAmp = isCarried ? 7.0 : 4.5;
    const w1 = Math.sin(tG * waveFreq) * waveAmp;
    const w2 = Math.cos(tG * (waveFreq * 1.35)) * (waveAmp * 0.55);
    const w3 = Math.sin(tG * (waveFreq * 0.8) + 1.2) * (waveAmp * 0.65);

    // Tips of swallowtail fork
    const tipTopX = poleX + dir * fw;
    const tipTopY = topY + w1;

    const tipBtmX = poleX + dir * fw;
    const tipBtmY = topY + fh + w2;

    // Inner chevron notch cut inward
    const notchX = poleX + dir * (fw * 0.66);
    const notchY = topY + fh * 0.5 + w3;

    if (isStolen) {
      // Pulsing holographic wireframe for stolen home flag
      g.setLineDash([4, 4]);
      g.lineWidth = 2.0;
      g.strokeStyle = team === 0 ? 'rgba(244, 63, 94, 0.75)' : 'rgba(56, 189, 248, 0.75)';
      g.beginPath();
      g.moveTo(poleX, topY);
      g.lineTo(tipTopX, tipTopY);
      g.lineTo(notchX, notchY);
      g.lineTo(tipBtmX, tipBtmY);
      g.lineTo(poleX, topY + fh);
      g.closePath();
      g.stroke();
      g.restore();
      return;
    }

    // Dynamic S-curve swallowtail pennant path
    g.beginPath();
    g.moveTo(poleX, topY);

    // Top rippling edge
    const cp1X = poleX + dir * (fw * 0.38);
    const cp1Y = topY - w2 * 0.75;
    const cp2X = poleX + dir * (fw * 0.72);
    const cp2Y = topY + w1 * 1.05;
    g.bezierCurveTo(cp1X, cp1Y, cp2X, cp2Y, tipTopX, tipTopY);

    // Inner fork notch
    g.lineTo(notchX, notchY);

    // Bottom fork tip
    g.lineTo(tipBtmX, tipBtmY);

    // Bottom rippling edge back to pole
    const cp3X = poleX + dir * (fw * 0.72);
    const cp3Y = topY + fh + w1 * 0.85;
    const cp4X = poleX + dir * (fw * 0.38);
    const cp4Y = topY + fh - w2 * 0.55;
    g.bezierCurveTo(cp3X, cp3Y, cp4X, cp4Y, poleX, topY + fh);
    g.closePath();

    // 1. Silk cloth gradient fill
    const clothGrad = g.createLinearGradient(poleX, topY, tipTopX, topY);
    clothGrad.addColorStop(0.0, brightCol);
    clothGrad.addColorStop(0.45, baseCol);
    clothGrad.addColorStop(1.0, deepCol);
    g.fillStyle = clothGrad;
    g.fill();

    // 2. Wave specular shading ripples across silk
    const shadeGrad = g.createLinearGradient(poleX, topY, tipTopX, topY);
    shadeGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.22)');
    shadeGrad.addColorStop(0.25, 'rgba(0, 0, 0, 0.20)');
    shadeGrad.addColorStop(0.52, 'rgba(255, 255, 255, 0.28)');
    shadeGrad.addColorStop(0.78, 'rgba(0, 0, 0, 0.22)');
    shadeGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.12)');
    g.fillStyle = shadeGrad;
    g.fill();

    // 3. Embroidered golden silk trim border
    g.strokeStyle = trimCol;
    g.lineWidth = 1.8;
    g.stroke();

    // 4. Team Heraldic Insignia in center of pennant field
    const emblemX = poleX + dir * (fw * 0.36);
    const emblemY = topY + fh * 0.5 + 1 + (w1 + w2) * 0.25;
    const emblemIcon = team === 0 ? '🔥' : '⚡';
    _txt(g, emblemIcon, emblemX, emblemY, _fn(Math.round(fh * 0.52), 900), '#ffffff', 'center');

    g.restore();
  }

  /* -------------------------------------------------------------------------
     Rendering: World Pedestals, Beacons, Flags & FX
     ------------------------------------------------------------------------- */
  function drawCtfEntities() {
    if (!ctfState.active) return;
    const g = Ictx();
    if (!g) return;

    const tG = (typeof tGlobal !== 'undefined') ? tGlobal : (Date.now() / 1000);

    // Render Red Base (0) and Blue Base (1)
    for (let t = 0; t < 2; t++) {
      const base = ctfState.bases[t];
      const flag = ctfState.flags[t];
      const baseCol = t === 0 ? '#dc2626' : '#2563eb';
      const brightCol = t === 0 ? '#ff6b6b' : '#38bdf8';
      const glowCol = t === 0 ? 'rgba(220, 38, 38, ' : 'rgba(37, 99, 235, ';

      g.save();

      // 1. Majestic Volumetric Conical Beacon Beam
      const beamH = 680;
      const beamBaseW = 56 + Math.sin(tG * 3 + t) * 6;
      const beamTopW = 130 + Math.sin(tG * 2.5 + t) * 12;

      const beamGrad = g.createLinearGradient(base.x, base.y - beamH, base.x, base.y);
      beamGrad.addColorStop(0, glowCol + '0)');
      beamGrad.addColorStop(0.35, glowCol + '0.04)');
      beamGrad.addColorStop(0.75, glowCol + '0.14)');
      beamGrad.addColorStop(1, glowCol + '0.35)');

      g.beginPath();
      g.moveTo(base.x - beamBaseW / 2, base.y);
      g.lineTo(base.x - beamTopW / 2, base.y - beamH);
      g.lineTo(base.x + beamTopW / 2, base.y - beamH);
      g.lineTo(base.x + beamBaseW / 2, base.y);
      g.closePath();
      g.fillStyle = beamGrad;
      g.fill();

      // Central vertical ray core
      const coreW = 6 + Math.sin(tG * 6 + t) * 2;
      const coreGrad = g.createLinearGradient(base.x, base.y - beamH, base.x, base.y);
      coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      coreGrad.addColorStop(0.4, glowCol + '0.15)');
      coreGrad.addColorStop(1, '#ffffff');
      g.fillStyle = coreGrad;
      g.fillRect(base.x - coreW / 2, base.y - beamH, coreW, beamH);

      // Ascending energy motes inside beam volume
      for (let m = 0; m < 5; m++) {
        const motePhase = (tG * 75 + m * 137 + t * 50) % beamH;
        const moteY = base.y - motePhase;
        const progress = motePhase / beamH;
        const curMoteSpan = beamBaseW + (beamTopW - beamBaseW) * progress;
        const moteX = base.x + Math.sin(tG * 2.2 + m * 1.8) * (curMoteSpan * 0.35);
        const moteAlpha = Math.sin(progress * Math.PI) * 0.75;
        g.beginPath();
        g.arc(moteX, moteY, 2.5 + (m % 2), 0, Math.PI * 2);
        g.fillStyle = brightCol;
        g.globalAlpha = moteAlpha;
        g.fill();
        g.globalAlpha = 1.0;
      }

      // 2. Base Platform Pedestal Altar
      const pw = base.w;
      const ph = base.h;
      const px = base.x - pw / 2;
      const py = base.y;

      // Lower Plinth Tier
      _rr(g, px - 6, py + 4, pw + 12, ph - 2, 4);
      g.fillStyle = '#090d16';
      g.fill();
      g.strokeStyle = glowCol + '0.45)';
      g.lineWidth = 1.5;
      g.stroke();

      // Main Upper Altar Slab
      _rr(g, px, py, pw, ph, 5);
      const pedGrad = g.createLinearGradient(px, py, px, py + ph);
      pedGrad.addColorStop(0, '#1e293b');
      pedGrad.addColorStop(0.5, '#0f172a');
      pedGrad.addColorStop(1, '#020617');
      g.fillStyle = pedGrad;
      g.fill();
      g.lineWidth = 2.0;
      g.strokeStyle = brightCol;
      g.stroke();

      // Glowing core line inside pedestal
      g.beginPath();
      g.moveTo(px + 10, py + ph / 2);
      g.lineTo(px + pw - 10, py + ph / 2);
      g.lineWidth = 2.0;
      g.strokeStyle = brightCol;
      g.stroke();

      // Concentric Pulsing Base Beacon Rings on pedestal floor
      const ringPulse1 = 28 + Math.sin(tG * 4 + t) * 2.5;
      const ringPulse2 = 16 + Math.cos(tG * 3 + t) * 1.5;
      g.beginPath();
      g.ellipse(base.x, py + 2, ringPulse1, 7, 0, 0, Math.PI * 2);
      g.strokeStyle = brightCol;
      g.lineWidth = 1.8;
      g.stroke();

      g.beginPath();
      g.ellipse(base.x, py + 2, ringPulse2, 4, 0, 0, Math.PI * 2);
      g.strokeStyle = '#ffffff';
      g.lineWidth = 1.2;
      g.stroke();

      // Energetic flux dots circulating on the ring
      for (let c = 0; c < 3; c++) {
        const ang = tG * 2.8 + c * (Math.PI * 2 / 3);
        const dotX = base.x + Math.cos(ang) * ringPulse1;
        const dotY = py + 2 + Math.sin(ang) * 7;
        g.beginPath();
        g.arc(dotX, dotY, 2, 0, Math.PI * 2);
        g.fillStyle = '#ffffff';
        g.fill();
      }

      // Base Team Label Pill
      const pillW = 86;
      const pillH = 18;
      _rr(g, base.x - pillW / 2, py + ph + 4, pillW, pillH, 5);
      g.fillStyle = 'rgba(10, 16, 26, 0.90)';
      g.fill();
      g.strokeStyle = brightCol;
      g.lineWidth = 1.5;
      g.stroke();
      _txt(g, (t === 0 ? '🔴 RED BASE' : '🔵 BLUE BASE'), base.x, py + ph + 13, _fn(9, 900), '#ffffff', 'center');

      // 3. Flag Pole & Finial
      const poleX = base.x;
      const poleBaseY = py;
      const poleTopY = py - CTF_CONFIG.POLE_HEIGHT;

      // Pole Socket Bracket on base
      _rr(g, poleX - 7, poleBaseY - 5, 14, 6, 2);
      g.fillStyle = '#64748b';
      g.fill();
      g.strokeStyle = '#cbd5e1';
      g.lineWidth = 1.0;
      g.stroke();

      // Flagpole - shaded 3D gradient cylinder
      const poleGrad = g.createLinearGradient(poleX - 2.5, poleBaseY, poleX + 2.5, poleBaseY);

function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||0)*dt;
    if(p.vr)p.rot+=p.vr*dt;
  }
}
function drawParts(){
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    g.globalAlpha=a;
    if(p.shape===1){g.save();g.translate(p.x,p.y);g.rotate(p.rot||0);g.fillStyle=p.col;g.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.7);g.restore();}
    else{g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.size,0,TAU);g.fill();}
  }
  g.globalAlpha=1;
}

let _cachedThemeIdx = -1, _cachedNightGr = null, _cachedIntGr = null, _cachedVignette = null;

/* ================= PHYSICS: RELIABLE PINK DROP/JUMP-THROUGH & AIRTIGHT SOLIDS ================= */
function hitRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hitRectInclusive(a,b){return a.x<=b.x+b.w&&a.x+a.w>=b.x&&a.y<=b.y+b.h&&a.y+a.h>=b.y;}

function zoneAtFeet(p,type){
  const feet=p.y+p.h;
  for(const s of SOLIDS){
    if(s.t!==type)continue;
    if(!s.dy){
      if(feet>=s.y-6&&feet<=s.y+18&&p.x+p.w>s.x&&p.x<s.x+s.w)return s;
    }else{
      const px=clamp(p.x+p.w/2,s.x,s.x+s.w);
      const sy=s.y+(px-s.x)*(s.dy/s.w);
      if(feet>=sy-8&&feet<=sy+20)return s;
    }
  }
  return null;
}
function botFullyOnDrop(p){
  if(p.grounded&&p.gp&&p.gp.t==='drop'){
    if(p.x+6>=p.gp.x&&p.x+p.w-6<=p.gp.x+p.gp.w)return p.gp;
  }
  const z=zoneAtFeet(p,'drop');
  if(z&&p.x+6>=z.x&&p.x+p.w-6<=z.x+z.w)return z;
  return null;
}

function landOn(p,gp,impact,wasG){
  p.grounded=true;p.gp=gp;p.lastGp=gp;p.airJumps=settings.doubleJump?1:0;p.wallJumps=0;
  // Subtle squash on landing — scaled down ~50% so it reads as weight, not a gag.
  if(!wasG){
    if(impact>430){p.sy=0.87;p.sx=1.13;p.landT=0.12;sfx('land');dust(p.x+p.w/2,p.y+p.h,8,90);}
    else if(impact>140){p.sy=0.93;p.sx=1.07;}
  }
}
/* ================= TRIAL BOT: P2 chase/flee + anti-stuck =================
   v1 rules: greedy X + jump only if no solid between, detour to platform
   edge when blocked above, bonk counter fallback. Pink drops are
   jump-through (ok to jump), solids are not. */
const BOT={st:{},think:0.09};
function botReset(){BOT.st={};}
function isBotSlot(p){
  try{
    const slot = (typeof p === 'number') ? p : (p && p.slot !== undefined ? p.slot : p);
    if(typeof HARNESS !== 'undefined' && HARNESS.active){
      if(HARNESS.mode === 'playback') return slot === 1;
      return false;
    }
    if(typeof NET !== 'undefined' && NET && NET.role !== null){
      if(NET.botSlots && NET.botSlots.includes(slot)) return true;
      return false;
    }
    if(menu.tab === 'bots') return (slot === 0 || slot === 1);
    if(menu.tab === 'solo') return slot === 1;
    if(menu.botSlots){
      if(Array.isArray(menu.botSlots) && menu.botSlots.includes(slot)) return true;
      if(menu.botSlots.has && menu.botSlots.has(slot)) return true;
    }
    if(menu.slotIsBot && menu.slotIsBot[slot] !== undefined) return !!menu.slotIsBot[slot];
    if(menu.botOn && slot === 1) return true;
    return false;
  }catch(e){return false;}
}
function botSolidBetween(ax,ay,bx,by,ignorePlat){
  // Distance-based sampling (max 22px step) so thin walls & pillars never tunnel through
  const dx=bx-ax, dy=by-ay;
  const dist=Math.hypot(dx,dy);
  const steps=Math.max(3, Math.ceil(dist/22));
  for(let i=1; i<steps; i++){
    const t=i/steps, px=ax+dx*t, py=ay+dy*t;
    const pt={x:px-3, y:py-3, w:6, h:6};
    for(const s of SOLIDS){
      if(s.t==='drop'||s===ignorePlat)continue;
      if(hitRect(pt,s))return s;
    }
  }
  return null;
}
function botGroundAhead(p,dir,dist){
  if(!dir)return true;
  const d=dist||(p.grounded&&(zoneAtFeet(p,'speed')||Math.abs(p.vx)>380)?125:80);
  const ax=p.x+p.w/2+dir*d,feet=p.y+p.h;
  for(const s of SOLIDS){
    if(ax>=s.x-12&&ax<=s.x+s.w+12&&feet>=s.y-42&&feet<=s.y+24)return true;
    if(s.dy){ // slope: check top at ax
      if(ax>=s.x-12&&ax<=s.x+s.w+12){
        const sy=s.y+(clamp(ax,s.x,s.x+s.w)-s.x)*(s.dy/s.w);
        if(feet>=sy-42&&feet<=sy+24)return true;
      }
    }
  }
  return false;
}
function botWallAhead(p,dir,dist){
  if(!dir)return null;
  const d=dist||44;
  const wx=dir>0?(p.x+p.w):(p.x-d);
  const probe={x:wx, y:p.y+6, w:d, h:p.h-12};
  for(const s of SOLIDS){
    if(s.t==='drop')continue;
    if(hitRect(probe,s))return s;
  }
  return null;
}
function botCeilAbove(p,dist){
  const d=dist||48;
  const probe={x:p.x+4, y:p.y-d, w:p.w-8, h:d};
  for(const s of SOLIDS){
    if(s.t==='drop'||s===p.gp)continue;
    if(hitRect(probe,s))return s;
  }
  return null;
}
function botGetActivePads(){

    if(s.t==='speed') speeds.push(s);

function botFindSpeedPadMeta(p, target, dx, dy){
  const { speeds, boosts } = botGetActivePads();

  const feet = p.y + p.h;
  const tx = target.x + target.w / 2;
  const ty = target.y + target.h / 2;

  let bestScore = -1e9;

  // 1. Evaluate Speed Pads (1.55x sprint multiplier)
  for(const s of speeds){
