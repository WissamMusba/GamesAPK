<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0b0f16"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>TAG! — 2-4 Player & Online Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link id="font-link-1" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Rubik:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet"/>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script src="poki-safety.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link id="font-link-20" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Bangers&family=Black+Han+Sans&family=Luckiest+Guy&family=Righteous&family=Fredoka+One&family=Baloo+2:wght@700;800&family=Nunito:wght@800;900&family=Poppins:wght@700;800;900&family=Montserrat:wght@700;800;900&family=Titan+One&family=Chewy&family=MuseoModerno:wght@700;900&family=Comfortaa:wght@700&family=Space+Grotesk:wght@600;700&family=Orbitron:wght@700;900&family=Russo+One&family=Staatliches&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<canvas id="g"></canvas>
<!-- netplay join modal -->
<div id="netUI"><div id="netCard">
  <h2>JOIN <span>ONLINE ROOM</span></h2>
  <p id="netDesc">Enter 6-letter room code or paste invite link:</p>
  <input id="netCode" maxlength="64" placeholder="ROOM CODE / LINK"/>
  <div class="row">
    <button id="netJoinGo" class="go">Join</button>
    <button id="netClose">Cancel</button>
  </div>
</div></div>
<!-- In-game Text Chat Overlay -->
<div id="chatUI">
  <div id="chatLogs"></div>
  <div id="chatCornerBar" onclick="if(typeof chatToggle==='function')chatToggle();">
    <span>💬 Type here... (Enter)</span>
  </div>
  <div id="chatInputRow">
    <input id="chatInput" maxlength="120" placeholder="Type a message (Enter)..."/>
    <button id="chatSendBtn">Send</button>
  </div>
</div>
<div id="netToast"></div>

<!-- Modular Game Architecture -->
<script src="js/core.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/config.js"></script>
<script src="js/maps.js"></script>
<script src="js/bot_ai.js"></script>
<script src="js/match.js"></script>
<script src="js/modes/infection.js"></script>
<script src="js/modes/bomb.js"></script>
<script src="js/modes/crown.js"></script>
<script src="js/modes/ctf.js"></script>
<script src="js/modes/wiring.js"></script>
<script src="js/physics.js"></script>
<script src="js/bot_engine.js"></script>
<script src="js/modes/hunter.js"></script>
<script src="js/career.js"></script>
<script src="js/gameplay.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/netplay.js"></script>
<script src="js/main.js"></script>
</body>
</html>
