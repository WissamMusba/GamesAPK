            const timeToLand = Math.max(0.08, (landingSlab.y - (p.y + p.h)) / Math.max(p.vy, 150));
            const predWindow = 0.35;
            const predHunterX = tx + clamp((target.vx || 0) * (timeToLand + predWindow), -260, 260);

            // Steer towards the side of the platform furthest from where hunter will be:
            const leftX = landingSlab.x + 24;
            const rightX = landingSlab.x + landingSlab.w - 24;
            const dLeft = Math.abs(predHunterX - leftX);
            const dRight = Math.abs(predHunterX - rightX);
            const safeX = (dLeft > dRight) ? leftX : rightX;

            // If hunter is intercepting this exact landing spot and bot has an air jump, double-jump away!
            const hunterInterceptDanger = p.airJumps > 0 && Math.abs(predHunterX - cx) < 70 && Math.abs(ty - landingSlab.y) < 90;
            if(hunterInterceptDanger && S.airT2 > 0.12){
              S.jumpQ = true;
              S.jumpHoldT = 0.14;
              S.dir = (predHunterX > cx ? -1 : 1);
            } else {
              const offX = safeX - cx;
              if(Math.abs(offX) > 28) S.dir = Math.sign(offX);
              else if(Math.abs(offX) < 12) S.dir = 0;
            }
          }
        }else if(Math.abs(dx)<60){
          if(isIt&&aboveBy>40&&botSolidBetween(cx,p.y-10,cx,ty,p.gp)){
            S.dir=S.exitDir||(cx<W/2?1:-1);
          }else if(!isIt){
            // Falling straight down: drift away from hunter's predicted path
            const predHunterDir = Math.sign((target.vx || dx) || 1);
            S.dir = -predHunterDir;
          }else{
            S.dir=0;
          }
        }
      }
      // Rising: curl inward once the outward hold is done
      else if(isIt&&p.vy<0&&aboveBy>40&&p.vy>-250){
        if(!S.climbPlat&&Math.abs(dx)>20)S.dir=Math.sign(dx);
      }
      // FLEE AIR STALL / REVERSE FEINT:
      if(!isIt&&S.pinkJukePhase===0){
        const hunterCloseAir=Math.abs(dx)<180&&Math.abs(dy)<120;
        const hunterFast=Math.abs(target.vx||0)>180;
        if(hunterCloseAir&&hunterFast&&S.airBrakeCooldown<=0&&S.airBrakeT<=0){
          S.airBrakeT=0.18;
          S.airBrakeCooldown=2.6;
        }
        if(S.airBrakeT>0){
          S.airBrakeT-=stepDt;
          S.dir=p.vx!==0?-Math.sign(p.vx):0;
        }
      }
    }
  }
  // bonk detect: was rising, now stopped, under a solid
  if(p.vy>=0&&S.wasVy!==undefined&&S.wasVy<-350&&!p.grounded){
    // check ceiling right above head
    const hp={x:p.x+6,y:p.y-14,w:p.w-12,h:12};
    for(const s of SOLIDS){if(s.t==='drop')continue;if(hitRect(hp,s)){S.bonks++;S.bonkT=1.0;break;}}
    if(S.bonks>=2){
      // Genuine ceiling hit while climbing: blacklist the tried side and
      // force the opposite flank for 1.5s (or until elevation is gained)
      S.decideT=0;S.bonks=0;
      let side=S.exitDir;
      if(!side){
        const gp=p.gp||p.lastGp;
        side=gp?(Math.abs(cx-gp.x)<Math.abs(cx-(gp.x+gp.w))?-1:1):1;
      }
      S.bannedSide=side;S.banT=1.5;S.banTierY=p.y;
      S.exitLockT=0;S.exitDir=0;S.exitGp=null;S.hasExit=false;
      S.descLockT=0;S.descDir=0;
      S.climbPlat=null;S.climbOut=0;S.climbT=0;
      S.dir=-side;S.unstuckT=0.5;S.unstuckDir=S.dir;
    }
  }
  S.wasVy=p.vy;
  if(S.dropNoJumpT>0)S.jumpQ=false;
  const j=S.jumpQ;S.jumpQ=false;
  if(j)S.jumpHoldT=Math.max(S.jumpHoldT||0,0.12);
  let hold=!!j;
  if(S.jumpHoldT>0){S.jumpHoldT-=stepDt;hold=true;}
  return{dir:clamp(S.dir||0,-1,1),jumpEdge:!!j,jumpHeld:hold,downHeld:!!S.wantDown};
}

/* ================= PLATFORM NODES GEOMETRY HELPER ================= */
function demoNodes(){
  const r=[];
  for(const s of SOLIDS){
    if(!s.wall && !(s.w < 60 && s.h > s.w * 1.5)) r.push(s);
  }
  return r;
}
function inputFor(p,dt){
  if(p.isFrozen) return {dir:0,jumpEdge:false,jumpHeld:false,downHeld:false};
  if(typeof HARNESS !== 'undefined' && HARNESS.active && HARNESS.mode === 'playback' && p.slot === 1){
    return harnessBotPlaybackInput(p, dt);
  }
  if(isBotSlot(p)) return botInputFor(p,dt);
  
  const schemeIdx = (menu.slotCtrl && menu.slotCtrl[p.slot] != null) ? menu.slotCtrl[p.slot] : p.slot;
  const s = LOCAL_CTRL_SCHEMES[((schemeIdx % LOCAL_CTRL_SCHEMES.length) + LOCAL_CTRL_SCHEMES.length) % LOCAL_CTRL_SCHEMES.length] || LOCAL_CTRL_SCHEMES[0];
  const m = s.map || {};
  
  let dir = 0, jumpEdge = false, jumpHeld = false, downHeld = false;

  // Keyboard mapping
  if(m.L || m.R || m.U || m.D){
    const hasL = Array.isArray(m.L), hasR = Array.isArray(m.R);
    dir += (hasR ? (m.R.some(k => keys.has(k)) ? 1 : 0) : (keys.has(m.R) ? 1 : 0))
         - (hasL ? (m.L.some(k => keys.has(k)) ? 1 : 0) : (keys.has(m.L) ? 1 : 0));
    const hasU = Array.isArray(m.U), hasD = Array.isArray(m.D);
    jumpEdge = jumpEdge || (hasU ? m.U.some(k => pressed.has(k)) : pressed.has(m.U));
    jumpHeld = jumpHeld || (hasU ? m.U.some(k => keys.has(k)) : keys.has(m.U));
    downHeld = downHeld || (hasD ? m.D.some(k => keys.has(k)) : keys.has(m.D));
  }

  // Controller mapping
  if(s.id === 'controller'){
    let ctrlOrder = 0;
    if(menu && menu.slotCtrl){
      for(let sIdx = 0; sIdx < p.slot; sIdx++){
        const eIdx = menu.slotCtrl[sIdx];
        const eScheme = LOCAL_CTRL_SCHEMES[((eIdx % LOCAL_CTRL_SCHEMES.length) + LOCAL_CTRL_SCHEMES.length) % LOCAL_CTRL_SCHEMES.length];
        if(eScheme && eScheme.id === 'controller') ctrlOrder++;
      }
    }
    let connectedCount = 0;
    let pd = null;
    for(let pi = 0; pi < 4; pi++){
      if(PAD[pi] && PAD[pi].connected){
        if(connectedCount === ctrlOrder){
          pd = PAD[pi];
          break;
        }
        connectedCount++;
      }
    }
    if(!pd && PAD[p.slot] && PAD[p.slot].connected) pd = PAD[p.slot];
    if(!pd && PAD[0] && PAD[0].connected) pd = PAD[0];

    if(pd && pd.connected){
      dir += (pd.right ? 1 : 0) - (pd.left ? 1 : 0);
      jumpEdge = jumpEdge || pd.jumpE;
      jumpHeld = jumpHeld || pd.jumpHeld;
      downHeld = downHeld || pd.dropHeld;
    }
  }
  const isOnlineMatch = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isSplitLocal = (isTouch && !isOnlineMatch && match && match.players && match.players.length === 2 && !menu.botOn && menu.tab !== 'solo');
  if(!isSplitLocal && p.slot === (typeof NET !== 'undefined' && NET && NET.mySlot >= 0 ? NET.mySlot : 0)){
    if(TOUCH.left) dir = -1;
    if(TOUCH.right) dir = 1;
    if(TOUCH.jumpEdge) jumpEdge = true;
    if(TOUCH.jumpHeld) jumpHeld = true;
    if(TOUCH.downHeld) downHeld = true;
  }
  if(isSplitLocal){
    const gP = (p.slot === match.players[0].slot) ? LOCAL_TOUCH.p1 : ((p.slot === match.players[1].slot) ? LOCAL_TOUCH.p2 : null);
    if(gP){
      if(gP.left) dir = -1;
      if(gP.right) dir = 1;
      if(gP.jumpEdge){ jumpEdge = true; gP.jumpEdge = false; }
      if(gP.jumpHeld) jumpHeld = true;
      if(gP.downHeld) downHeld = true;
    }
  }
  const _demoOut={dir:clamp(dir,-1,1),jumpEdge:!!jumpEdge,jumpHeld:!!jumpHeld,downHeld:!!downHeld};
  if(typeof HARNESS!=='undefined'&&HARNESS.active&&HARNESS.mode==='record'&&p.slot===0){
    try{harnessPushTrace(p,_demoOut);}catch(e){}
  }

  return _demoOut;
}

function physUpdate(p,dt,allow){
  if(p.isEliminated){ p.vx = 0; p.vy = 0; return; }
  if(p.isFrozen){ p.vx = 0; p.vy = 0; return; }
  if(match && match.hunterMode && match.cageT > 0 && p.isHunter){
    p.vx = 0; p.vy = 0; allow = false;
  }
  const wasG=p.grounded;
  if(wasG)p.coyote=0.11;else p.coyote-=dt;
  let dir=0,jumpP=false,jumpHeld=false,downHeld=false;
  if(allow){const inp=inputFor(p,dt);dir=inp.dir;jumpP=inp.jumpEdge;jumpHeld=inp.jumpHeld;downHeld=inp.downHeld;}
  const onSpeed=p.grounded&&!!zoneAtFeet(p,'speed');
  if(onSpeed&&!p.padOn)sfx('pad');
  p.padOn=onSpeed;
  const isIt=match.it===match.players.indexOf(p)&&match.state==='playing';
  let baseMax=isIt?IT_SPEED:RUN_SPEED;
  if(match && match.hunterMode){
    // Hunters are the chasers: slot lookup is immune to stale p.isHunter flags.
    const isHunterP=!!p.isHunter||p.slot===match.hunterRed||p.slot===match.hunterBlue;
    baseMax=isHunterP?IT_SPEED:RUN_SPEED;
  }
  if(settings.gameMode === 'infection' && typeof getInfectionPlayerSpeed === 'function'){
    baseMax = getInfectionPlayerSpeed(p);
  } else if(settings.gameMode === 'bomb' && typeof BOMB_MODE !== 'undefined' && BOMB_MODE && BOMB_MODE.carrierIdx === match.players.indexOf(p)){
    baseMax = (typeof BOMB_CONFIG !== 'undefined') ? BOMB_CONFIG.CARRIER_SPEED : 565;
  } else if(settings.gameMode === 'crown' && typeof getCrownPlayerSpeed === 'function'){
    baseMax = getCrownPlayerSpeed(p);
  } else if(settings.gameMode === 'ctf'){
    baseMax = RUN_SPEED;
  }
  const maxs=baseMax*(onSpeed?SPEED_MULT:1);
  if(!onSpeed&&Math.abs(p.vx)>maxs){
    const target=Math.sign(p.vx)*maxs;
    p.vx+=(target-p.vx)*Math.min(1,dt*14);
  }
  
  /* SHARP ACCELERATION & SNAPPY BRAKING */
  const acc=p.grounded?ACC:AIR_ACC;
  const dec=p.grounded?DECEL:AIR_DEC;
  if(dir!==0){
    p.face=dir;
    const turning=(p.vx!==0&&Math.sign(p.vx)!==dir);
    p.vx+=dir*(turning?acc+dec*0.9:acc)*dt;
    if(dir*p.vx>maxs)p.vx=dir*maxs;
  }else{
    const d=dec*dt;
    if(Math.abs(p.vx)<=d)p.vx=0;else p.vx-=Math.sign(p.vx)*d;
  }
  
  if(jumpP)p.jbuf=0.16;else p.jbuf-=dt;
  
  /* PINK DROP-THROUGH: only the player's OWN down input counts, and only when
     FULLY standing on pink — the whole body (minus a 6px forgiveness margin)
     must be over the pink span. Straddling brown+pink (like standing on the
     seam) does nothing, so holding S while walking across never clips you. */
  const fullyOn=(plat)=>{
    if(!plat||plat.t!=='drop')return false;
    if(!plat.dy) return (p.x+6>=plat.x)&&(p.x+p.w-6<=plat.x+plat.w);
    if(!(p.x+6>=plat.x && p.x+p.w-6<=plat.x+plat.w)) return false;
    const sy=plat.y + (p.x - plat.x)*plat.dy/plat.w;
    return Math.abs(sy - (p.y+p.h)) < 20;
  };
  const planted=p.grounded&&p.gp&&fullyOn(p.gp);
  const hoverPlat=!p.grounded&&p.vy>-60&&p.vy<160?zoneAtFeet(p,'drop'):null;
  const hoverDrop=!!hoverPlat&&(p.x+6>=hoverPlat.x)&&(p.x+p.w-6<=hoverPlat.x+hoverPlat.w);
  if(downHeld&&(planted||hoverDrop)){
    p.jbuf = 0;
    const dropPlat=planted?p.gp:hoverPlat;
    if(dropPlat){
      p.dropT=0.35;
      p.grounded=false;
      p.gp=null;
      p.y+=8; /* Nudge feet past top surface to drop immediately */
      p.vy=Math.max(p.vy,160);
      sfx('drop');
      dust(p.x+p.w/2,p.y+p.h,5,60);
    }
  }
  if(p.dropT>0)p.dropT-=dt;
  
  /* WALL CONTACT FOR PARKOUR WALL-JUMP (NO SLOW-FALL WALL SLIDE) */
  const onWall=!p.grounded&&p.sideT>0;
  
  /* JUMP HANDLING: Ground, Wall-Jump, Double Jump, and Blue Pad Boost.
     Tap = shorter hop; holding jump sustains reduced gravity for 0.10s so a
     full hold rises just past the old fixed jump height. */
  if(p.jbuf>0 && !downHeld){
    if(p.grounded||p.coyote>0){
      const boost=(p.grounded&&zoneAtFeet(p,'boost'))?BOOST_MULT:1;
      p.vy=-JUMP_V*boost;
      p.vx=clamp(p.vx,-baseMax*1.1,baseMax*1.1);
      if(boost>1){sfx('boost');ringP(p.x+p.w/2,p.y+p.h,'#4a90e2');}else sfx('jump');
      p.grounded=false;p.coyote=0;p.jbuf=0;p.holdT=HOLD_LIFT_T;p.airJumps=settings.doubleJump?1:0;
      p.sy=1.10;p.sx=0.93;dust(p.x+p.w/2,p.y+p.h,5,70);
    }else if(onWall&&p.wallJumps<2){
      /* KICK OFF WALL! (Wall-Jump: Max 2 consecutive) */
      p.wallJumps++;
      p.vy=-JUMP_V*0.96;
      p.vx=-p.wallSide*480;
      p.face=-p.wallSide;
      p.sideT=0;p.jbuf=0;p.holdT=HOLD_LIFT_T;
      p.airJumps=settings.doubleJump?1:0;
      p.sy=1.09;p.sx=0.92;
      sfx('walljump');
      dust(p.x+(p.wallSide<0?0:p.w),p.y+p.h/2,4,80);
    }else if(p.airJumps>0){
      p.vy=-JUMP_V*0.95;p.airJumps--;p.jbuf=0;p.holdT=HOLD_LIFT_T;p.vx=clamp(p.vx,-baseMax*1.1,baseMax*1.1);sfx('djump');
      ringP(p.x+p.w/2,p.y+p.h/2,'#ffffff');p.sy=1.08;p.sx=0.94;
    }
  }

  /* Variable jump height: reduced gravity while jump is held and rising */
  if(p.holdT>0&&jumpHeld&&p.vy<0){p.vy+=G*HOLD_GRAV_F*dt;p.holdT-=dt;}
  else{p.vy+=G*dt;if(jumpHeld&&p.vy>=0)p.holdT=0;}
  if(p.vy>MAXFALL)p.vy=MAXFALL;

  /* Horizontal collision, sub-stepped so sprinters can't tunnel thin walls */
  const hSteps=(Math.abs(p.vx)*dt>13)?2:1;
  for(let hs=0;hs<hSteps;hs++){
  const leftBefore=p.x,rightBefore=p.x+p.w;
  p.x+=p.vx*dt/hSteps;
  for(const s of SOLIDS){
    if(s.t==='drop')continue; /* ONLY pink allows pass-through! */
    if(!s.dy){
      if(!hitRect(p,s))continue;
      /* If s is a thin horizontal platform (shelf/floor, not a vertical wall), only push if approaching from outside */
      if(!s.wall&&s.h<=46){
        const wasOutsideLeft=rightBefore<=s.x+2;
        const wasOutsideRight=leftBefore>=s.x+s.w-2;
        if(!wasOutsideLeft&&!wasOutsideRight)continue;
      }
      const fl=(p.x+p.w)-s.x,fr=(s.x+s.w)-p.x;
      if(fl<fr){p.x=s.x-p.w;if(p.vx>0)p.vx=0;p.wallSide=1;}
      else{p.x=s.x+s.w;if(p.vx<0)p.vx=0;p.wallSide=-1;}
      if((!s.wall||s.h>s.w)&&!wasG&&p.vy>-20){
        p.sideT=0.28;
      }
    }else{
      /* Tilted slope end-walls */
      if(p.vx>0&&p.x+p.w>=s.x&&leftBefore+p.w<=s.x+8){
        const yTop=s.y,yBot=s.y+s.h;
        if(p.y+p.h>yTop+4&&p.y<yBot-4){p.x=s.x-p.w;p.vx=0;p.wallSide=1;p.sideT=0.28;}
      }
      if(p.vx<0&&p.x<=s.x+s.w&&leftBefore>=s.x+s.w-8){
        const yTop=s.y+s.dy,yBot=s.y+s.dy+s.h;
        if(p.y+p.h>yTop+4&&p.y<yBot-4){p.x=s.x+s.w;p.vx=0;p.wallSide=-1;p.sideT=0.28;}
      }
    }
  }
  } /* end sub-step loop */
  
  /* Vertical collision: Slopes & solids are 100% solid! Pink is one-way & fall-through - vertical sub-stepped to prevent tunneling */
  p.grounded=false;
  const vSteps=(Math.abs(p.vy)*dt>23)?2:1;
  const subDt=dt/vSteps;
  for(let vs=0;vs<vSteps;vs++){
    const headBefore=p.y,feetBefore=p.y+p.h;
    p.y+=p.vy*subDt;
  
  for(const s of SOLIDS){
    if(!s.dy){
      /* Flat platform */
      const xOverlap=(p.x+p.w>s.x+2&&p.x<s.x+s.w-2);
      if(!xOverlap)continue;
      
      if(s.t==='drop'){
        /* PINK DROP PLATFORM:
           1. NEVER blocks jumping up (can always jump through from below)
           2. Passes through when dropT>0 (just triggered a drop), OR when the
              player's OWN down is held AND they are FULLY on this pink span.
              Straddling a brown/pink seam while holding S does NOT fall —
              the neighbouring solid still catches you (see solid branch).
           3. Lands only when falling downward and feet cross the top surface */
        const fullyHere=(p.x+6>=s.x)&&(p.x+p.w-6<=s.x+s.w);
        if(p.dropT>0||(downHeld&&fullyHere))continue;
        if(p.vy>0&&feetBefore<=s.y+6&&p.y+p.h>=s.y&&p.y+p.h<=s.y+s.h+10){
          const imp=p.vy;
          p.y=s.y-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
        }
        continue;
      }
      
      /* Solid brown, orange speed, or blue boost: FULLY SOLID FROM TOP AND BOTTOM!
         Holding S only lets you fall where pink already let go (dropT>0, or a
         pink span at this height that you are FULLY standing on). A straddler
         holding S still lands on this solid — never sinks through the seam. */
      if(p.vy>0){
        /* Falling down onto platform */
        if(p.dropT>0||downHeld){
          /* If currently dropping through, do NOT catch on adjacent/overlapping solids at same level! */
          const hasDropAtY=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-s.y)<=10&&p.x+p.w>d.x+2&&p.x<d.x+d.w-2&&(p.x+6>=d.x)&&(p.x+p.w-6<=d.x+d.w));
          if(hasDropAtY)continue;
        }
        if(feetBefore<=s.y+8&&p.y+p.h>=s.y&&p.y<s.y+s.h){
          const imp=p.vy;
          p.y=s.y-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
        }
      }else if(p.vy<0){
        /* Jumping UP: head bonks the solid underside — UNLESS the player's body
           actually overlaps a pink platform at this height (i.e. jumping up
           through pink that shares the seam). The pink must cover the player's
           center, not merely sit nearby, so brown/pink edge seams stay solid. */
        const midX=p.x+p.w/2;
        const thruPink=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-s.y)<=10&&midX>d.x+4&&midX<d.x+d.w-4);
        if(!thruPink&&headBefore>=s.y+s.h-8&&p.y<=s.y+s.h&&p.y+p.h>s.y){
          p.y=s.y+s.h;
          p.vy=0;
        }
      }
    }else{
      /* Tilted platform / slope */
      const xOverlap=(p.x+p.w>s.x+2&&p.x<s.x+s.w-2);
      if(!xOverlap)continue;
      
      const px=clamp(p.x+p.w/2,s.x,s.x+s.w);
      const syTop=s.y+(px-s.x)*(s.dy/s.w);
      const syBot=syTop+s.h;
      
      if(s.t==='drop'){
        const fullyHere0=(p.x+6>=s.x)&&(p.x+p.w-6<=s.x+s.w);
        if(p.dropT>0||(downHeld&&fullyHere0))continue;
        if(p.vy>0&&feetBefore<=syTop+6&&p.y+p.h>=syTop&&p.y+p.h<=syBot+8){
          const imp=p.vy;
          p.y=syTop-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
          p.grounded=true;
          p.vx+=Math.sign(s.dy)*600*subDt;
        }
        continue;
      }
      
      if(p.vy>=0){
        if(p.dropT>0||downHeld){
          const hasDropAtY=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-syTop)<=12&&p.x+p.w>d.x+2&&p.x<d.x+d.w-2&&(p.x+6>=d.x)&&(p.x+p.w-6<=d.x+d.w));
          if(hasDropAtY)continue;
        }
        /* Landing on top of slope */
        if(feetBefore<=syTop+8&&p.y+p.h>=syTop-6&&p.y<syBot){
          const imp=p.vy;
          p.y=syTop-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
          p.grounded=true;
          p.vx+=Math.sign(s.dy)*600*subDt;
        }
      }else if(p.vy<0){
        /* Jumping UP into slope: head hits bottom, unless rising through pink at the seam */
        const midX2=p.x+p.w/2;
        const thruPink2=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-syTop)<=12&&midX2>d.x+4&&midX2<d.x+d.w-4);
        if(!thruPink2&&headBefore>=syBot-10&&p.y<=syBot&&p.y+p.h>syTop){
          p.y=syBot;
          p.vy=0;
        }
      }
    }
  }
  }
  
  p.x=clamp(p.x,WALL,W-WALL-p.w);
  if(p.x<=WALL){p.wallSide=-1;if(!p.grounded&&p.vy>-20)p.sideT=0.28;}
  else if(p.x>=W-WALL-p.w){p.wallSide=1;if(!p.grounded&&p.vy>-20)p.sideT=0.28;}
  p.y=clamp(p.y,WALL,H-WALL-p.h);
  if(p.y>=H-WALL-p.h){
    /* Arena floor counts as a landing: squash, dust and sound included */
    if(!wasG&&!p.grounded)landOn(p,SOLIDS[1],p.vy,wasG);
    else{p.grounded=true;p.gp=SOLIDS[1];p.lastGp=SOLIDS[1];p.wallJumps=0;}
    p.vy=0;
  }
  p.sx+=(1-p.sx)*Math.min(1,dt*11);
  p.sy+=(1-p.sy)*Math.min(1,dt*11);
  p.landT-=dt;p.tagT-=dt;p.sideT-=dt;
  p.blinkT-=dt;
  if(p.blinkT<=0){p.blink=0.12;p.blinkT=rand(1.8,4.5);}
  p.blink-=dt;
  
  /* Dynamic Speed Ghost Trail FX */
  if(Math.abs(p.vx)>320||onSpeed){
    p.trail.unshift({x:p.x,y:p.y,alpha:0.45});
    if(p.trail.length>4)p.trail.pop();
  }else{
    if(p.trail.length>0)p.trail.pop();
  }
  for(let tr of p.trail)tr.alpha-=dt*1.8;
  
  /* Unlockable Cosmetic Trails recorded behind moving players */
  if(!p.cosmeticTrail) p.cosmeticTrail = [];
  const curSpd = Math.hypot(p.vx, p.vy);
  if(curSpd > 50 || !p.grounded){
    p.cosmeticTrail.unshift({ x: p.x + p.w / 2, y: p.y + p.h / 2, vx: p.vx, vy: p.vy, t: tGlobal });
    if(p.cosmeticTrail.length > 10) p.cosmeticTrail.pop();
  } else if(p.cosmeticTrail.length > 0){
    p.cosmeticTrail.pop();
  }
  
  if(p.grounded&&Math.abs(p.vx)>240&&Math.random()<dt*14)dust(p.x+p.w/2-p.face*16,p.y+p.h-2,1,30);
}

function pairCollide(){
  if(!settings.collision||match.cooldown>0||match.state!=='playing')return;
  const P=match.players;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j];
    if(a.isEliminated || b.isEliminated) continue;
    if(match.hunterMode && match.cageT > 0 && (a.isHunter || b.isHunter)) continue;
    if(!hitRect(a,b))continue;
    const ox=Math.min(a.x+a.w-b.x,b.x+b.w-a.x),oy=Math.min(a.y+a.h-b.y,b.y+b.h-a.y);
    if(ox<oy){
      const s=(a.x+a.w/2<b.x+b.w/2)?-1:1;
      a.x+=s*ox/2;b.x-=s*ox/2;
      if(s<0){if(a.vx>0)a.vx=0;if(b.vx<0)b.vx=0;}else{if(a.vx<0)a.vx=0;if(b.vx>0)b.vx=0;}
    }else{
      const s=(a.y+a.h/2<b.y+b.h/2)?-1:1;
      a.y+=s*oy/2;b.y-=s*oy/2;
      if(s<0){if(a.vy>0)a.vy=0;if(b.vy<0)b.vy=0;}else{if(b.vy>0)b.vy=0;if(a.vy<0)a.vy=0;}
    }
  }
}

function eliminateHunterRunner(hunter, runner, popX, popY){
  if(!match || !match.hunterMode || runner.isEliminated) return;
  runner.isEliminated = true;
  runner.eliminatedTime = Math.max(0.1, Math.round((60 - match.timer) * 10) / 10);
  runner.survivalT = runner.eliminatedTime;

  if(!match.tournamentStats) match.tournamentStats = { tags: {}, survival: {} };
  match.tournamentStats.tags[hunter.slot] = (match.tournamentStats.tags[hunter.slot] || 0) + 1;

  match.freeze = 0.08;
  match.shake = 13;
  match.flash = 0.12;
  match.tagPop = { t: 0.55, x: popX != null ? popX : runner.x + 23, y: popY != null ? popY : runner.y + 10 };
  runner.tagT = 0.7;
  hunter.tagT = 0.7;
  sfx('tag');
  tagBurst(match.tagPop.x, match.tagPop.y, getPlayerColor(hunter), getPlayerColor(runner));

  const hunterName = getPlayerDisplayName(hunter);
  const runnerName = getPlayerDisplayName(runner);
  const enemyTeam = runner.team;
  const livingRunners = match.players.filter(p => p.team === enemyTeam && !p.isHunter && !p.isEliminated);
  const leftCount = livingRunners.length;
  const leftMsg = leftCount === 1 ? '1 runner left!' : (leftCount + ' runners left');
  const toastMsg = '💥 ' + hunterName + ' caught ' + runnerName + '! (' + leftMsg + ')';

  if(!match.killfeed) match.killfeed = [];
  match.killfeed.unshift({ msg: toastMsg, t: 3.5, team: hunter.team });
  if(match.killfeed.length > 3) match.killfeed.pop();
  toast(toastMsg);

  // Broadcast elimination if online host
  if(typeof NET !== 'undefined' && NET && NET.role !== null && NET.isHost){
    netBroadcastReliable({
      t: 'hunter_catch',
      hunterSlot: hunter.slot,
      runnerSlot: runner.slot,
      x: match.tagPop.x,
      y: match.tagPop.y
    });
  }

  // Check Full Wipe:
  if(leftCount === 0){
    match.hunterWipeTime[hunter.team] = Math.round((60 - match.timer) * 10) / 10;
    endHunterRound(hunter.team);
  }
}

function endHunterRound(wiperTeam){
  if(!match || !match.hunterMode || match.state === 'hunter_round_result') return;
  try{ CG.happytime(); }catch(e){}
  try{ CG.gameplayStop(); }catch(e){}

  match.state = 'hunter_round_result';
  match.resultT = 0;
  match.intermissionTimer = 15.0;

  const P = match.players;
  const redRunners = P.filter(p => p.team === 0 && !p.isHunter);
  const blueRunners = P.filter(p => p.team === 1 && !p.isHunter);
  const nRed = redRunners.length || 1;
  const nBlue = blueRunners.length || 1;

  // 1. Capture Points (Max 50 pts)
  const redCaught = blueRunners.filter(p => p.isEliminated).length;
  const blueCaught = redRunners.filter(p => p.isEliminated).length;
  const redCapturePts = Math.round(50 * (redCaught / nBlue));
  const blueCapturePts = Math.round(50 * (blueCaught / nRed));

  // 2. Hunter Speed Bonus (Max 30 pts)
  let redSpeedPts = 0;
  if(match.hunterWipeTime[0] != null){
    redSpeedPts = Math.round(30 * Math.max(0, (60 - match.hunterWipeTime[0]) / 60));
  }
  let blueSpeedPts = 0;
  if(match.hunterWipeTime[1] != null){
    blueSpeedPts = Math.round(30 * Math.max(0, (60 - match.hunterWipeTime[1]) / 60));
  }

  // 3. Runner Survival Bonus (Max 20 pts)
  const elapsed = Math.max(1, 60 - match.timer);
  let redSurvivalSum = 0;
  for(const r of redRunners){
    redSurvivalSum += (r.isEliminated ? (r.survivalT || r.eliminatedTime || 0) : elapsed);
  }
  const redSurvivalPts = Math.round(20 * (redSurvivalSum / (nRed * 60)));

  let blueSurvivalSum = 0;
  for(const r of blueRunners){
    blueSurvivalSum += (r.isEliminated ? (r.survivalT || r.eliminatedTime || 0) : elapsed);
  }
  const blueSurvivalPts = Math.round(20 * (blueSurvivalSum / (nBlue * 60)));

  // Round Totals
  const redRoundTotal = Math.min(100, redCapturePts + redSpeedPts + redSurvivalPts);
  const blueRoundTotal = Math.min(100, blueCapturePts + blueSpeedPts + blueSurvivalPts);

  if(!match.hunterScores) match.hunterScores = { 0: 0, 1: 0 };
  match.hunterScores[0] += redRoundTotal;
  match.hunterScores[1] += blueRoundTotal;

  if(!match.tournamentStats) match.tournamentStats = { tags: {}, survival: {} };
  for(const p of P){
    if(!p.isHunter){
      const surv = p.isEliminated ? (p.survivalT || 0) : 60;
      match.tournamentStats.survival[p.slot] = (match.tournamentStats.survival[p.slot] || 0) + surv;
    }
  }

  const isMatchOver = (match.hunterRound >= match.hunterMaxRounds);
  if(isMatchOver && !match._telemetrySent){
    try{ telemetryTrackMatchEnded(); }catch(e){}
  }
  match.roundSummary = {
    round: match.hunterRound,
    wiperTeam: wiperTeam,
    red: { capture: redCapturePts, speed: redSpeedPts, survival: redSurvivalPts, total: redRoundTotal },
    blue: { capture: blueCapturePts, speed: blueSpeedPts, survival: blueSurvivalPts, total: blueRoundTotal },
    cumulative: { 0: match.hunterScores[0], 1: match.hunterScores[1] },
    tournamentStats: match.tournamentStats,
    isMatchOver: isMatchOver
  };

  // Career: best single-round survival + tournament titles (this device)
  try{
    const isOnlineH = (typeof NET !== 'undefined' && NET && NET.role !== null);
    const mySlotH = isOnlineH ? NET.mySlot : 0;
    if(mySlotH != null && mySlotH >= 0){
      const me = P.find(p => p.slot === mySlotH);
      if(me && !me.isHunter){
        const mySurv = me.isEliminated ? (me.survivalT || 0) : elapsed;
        if(mySurv > CAREER.surv){ CAREER.surv = Math.round(mySurv * 10) / 10; }
      }
      if(isMatchOver){
        const s = match.roundSummary.cumulative;
        const myTeam = me ? me.team : ((menu.slotTeam && menu.slotTeam[mySlotH] != null) ? menu.slotTeam[mySlotH] : (mySlotH % 2));
        const tied = (s[0] === s[1]);
        const wonT = !tied && ((s[0] > s[1] ? 0 : 1) === myTeam);
        CAREER.m++;
        if(wonT){ CAREER.w++; CAREER.titles++; CAREER.streak++; if(CAREER.streak > CAREER.bestStreak) CAREER.bestStreak = CAREER.streak; }
        else if(!tied){ CAREER.streak = 0; }
      }
      saveCareer();
    }
  }catch(e){}

  confetti();
  sfx('win');

  if(typeof NET !== 'undefined' && NET && NET.role !== null && NET.isHost){
    netBroadcastReliable({ t: 'hunter_score', summary: match.roundSummary });
  }
}

function advanceHunterRound(){
  if(!match || !match.hunterMode) return;
  if(match.roundSummary && match.roundSummary.isMatchOver){
    match.hunterRound = 1;
    match.hunterScores = { 0: 0, 1: 0 };
    match.hunterHistory = {};
    match.tournamentStats = { tags: {}, survival: {} };
    if(menu.hunterHistory) menu.hunterHistory = {};
    menu.hunterVotes = {};
    startMatch();
    return;
  }

  // Resolve team hunters from votes / tie-breakers (fewest hunter rounds first, then random)
  const electedRed = resolveTeamHunter(0);
  const electedBlue = resolveTeamHunter(1);
  settings.hunterRed = electedRed;
  settings.hunterBlue = electedBlue;

  // Track hunter history rounds
  if(!match.hunterHistory) match.hunterHistory = {};
  match.hunterHistory[electedRed] = (match.hunterHistory[electedRed] || 0) + 1;
  match.hunterHistory[electedBlue] = (match.hunterHistory[electedBlue] || 0) + 1;
  if(menu.hunterHistory){
    menu.hunterHistory[electedRed] = match.hunterHistory[electedRed];
    menu.hunterHistory[electedBlue] = match.hunterHistory[electedBlue];
  }

  // Clear votes for upcoming rounds
  menu.hunterVotes = {};

  match.hunterRound++;
  match.roundSummary = null;
  match.hunterWipeTime = { 0: null, 1: null };

  match.hunterRed = settings.hunterRed;
  match.hunterBlue = settings.hunterBlue;
  match.cageT = 3.0;
  match.timer = 60;
  match.lastTick = 60;
  match.killfeed = [];
  match.spectateTarget = null;
  match.tagPop = null;
  match.state = 'countdown';
  match.cd = 3;
  match.cdT = 0;

  buildLevel();
  match.players = activeSlots().map((slot, i) => makePlayer(i, slot, menu.slotColor[slot]));

  sfx('count');

  if(typeof NET !== 'undefined' && NET && NET.role !== null && NET.isHost){
    const payload = {
      it: match.it, itTeam: match.itTeam, cooldownN: 0, matchIndex: matchIndex,
      currentThemeIdx: currentThemeIdx, lastStartIT: lastStartIT,
      hunterMode: true, hunterRed: settings.hunterRed, hunterBlue: settings.hunterBlue,
      hunterRound: match.hunterRound, hunterScores: match.hunterScores, cageT: match.cageT,
      hunterHistory: match.hunterHistory
    };
    netBroadcastReliable({
      t: 'start',
      settings: {
        map: settings.map, doubleJump: settings.doubleJump, collision: settings.collision,
        teams: settings.teams, gameMode: settings.gameMode, hunterRed: settings.hunterRed,
        hunterBlue: settings.hunterBlue, slotColor: menu.slotColor.slice(),
        slotTeam: (menu.slotTeam ? menu.slotTeam.slice() : [])
      },
      mapData: MAPS[settings.map % MAPS.length],
      payload: payload
    });
  }
}

function cycleHunterSpectate(team){

  const friendlyAlive = match.players.filter(p => p.team === team && !p.isEliminated);
  if(friendlyAlive.length === 0) return;
  let curIdx = friendlyAlive.findIndex(p => p.slot === match.spectateTarget);
  curIdx = (curIdx + 1) % friendlyAlive.length;
  match.spectateTarget = friendlyAlive[curIdx].slot;
  sfx('ui');
}

function shouldRenderHunterPlayer(viewerSlot, targetPlayer){
  if(typeof NET === 'undefined' || !NET || NET.role === null) return true; // Local couch: show all!
  if(viewerSlot == null || viewerSlot < 0) return true; // Online spectator: show all!
  if(targetPlayer.slot === viewerSlot) return true; // Always show self!
  if(targetPlayer.isEliminated) return false;

  const myP = match.players.find(p => p.slot === viewerSlot);
  if(!myP) return true;

  const isMyTeamRed = (myP.team === 0);
  const isMeHunter = (myP.slot === (isMyTeamRed ? match.hunterRed : match.hunterBlue));

  if(isMeHunter){
    // Hunter ONLY sees opposing runners!
    return (targetPlayer.team !== myP.team && targetPlayer.slot !== (isMyTeamRed ? match.hunterBlue : match.hunterRed));
  } else {
    // Runner sees opposing hunter + friendly runners!
    const isEnemyHunter = (targetPlayer.slot === (isMyTeamRed ? match.hunterBlue : match.hunterRed));
    const isFriendlyRunner = (targetPlayer.team === myP.team && targetPlayer.slot !== (isMyTeamRed ? match.hunterRed : match.hunterBlue));
    return isEnemyHunter || isFriendlyRunner;
  }
}

function drawHunterCage(p){
  const cx = p.x + p.w / 2;
  const cy = p.y + p.h / 2;
  const rad = p.w * 0.95;
  const cageCol = (p.team === 0 ? '#ff4757' : '#38bdf8');
  const glowAlpha = 0.18 + 0.10 * Math.sin(tGlobal * 14);

  g.save();
  // Forcefield glow dome with dynamic voltage pulsation
  g.beginPath();
  g.arc(cx, cy, rad, 0, TAU);
  g.fillStyle = p.team === 0 ? ('rgba(255, 71, 87, ' + glowAlpha.toFixed(2) + ')') : ('rgba(56, 189, 248, ' + glowAlpha.toFixed(2) + ')');
  g.fill();
  g.lineWidth = 2.5;
  g.strokeStyle = cageCol;
  g.stroke();

  // Animated revolving electric spark nodes & laser barrier cage
  g.beginPath();
  g.lineWidth = 1.2;
  g.strokeStyle = p.team === 0 ? 'rgba(255, 140, 155, 0.7)' : 'rgba(147, 222, 255, 0.7)';
  for(let a = 0; a < 6; a++){
    const ang = tGlobal * 3.5 + a * (TAU / 6);
    const ax = cx + Math.cos(ang) * rad;
    const ay = cy + Math.sin(ang) * rad;
    if(a === 0) g.moveTo(ax, ay); else g.lineTo(ax, ay);
  }
  g.closePath();
  g.stroke();

  // Draw node sparks
  for(let a = 0; a < 6; a++){
    const ang = tGlobal * 3.5 + a * (TAU / 6);
    const ax = cx + Math.cos(ang) * rad;
    const ay = cy + Math.sin(ang) * rad;
    g.beginPath();
    g.arc(ax, ay, 3, 0, TAU);
    g.fillStyle = '#ffffff';
    g.fill();
  }

  // Internal electric spark arc
  const arcJitter = (Math.sin(tGlobal * 28) * 8);
  g.beginPath();
  g.strokeStyle = '#ffffff';
  g.lineWidth = 1.2;
  g.moveTo(cx - 14, cy - 14);
  g.lineTo(cx + arcJitter, cy);
  g.lineTo(cx + 14, cy + 14);
  g.stroke();

  // 3-2-1 Countdown number above cage
  const cdSec = Math.max(1, Math.ceil(match.cageT));
  ptxt(cdSec + '', cx, p.y - 28, FT(22), '#ffd166');
  txt('⚡ CAGED', cx, p.y - 12, FN(9.5, 900), cageCol);
  g.restore();
}

    g.beginPath(); g.arc(bx + 8, by + 8, 4, 0, TAU);
    g.fillStyle = bcol; g.fill();

    const rName = getPlayerDisplayName(r).slice(0, 5);
    const rStat = alive ? '●' : '☠';
    txt(rName + ' ' + rStat, bx + 14, by + 9, FN(8.5, 900), alive ? '#ffffff' : '#64748b', 'left');
  }

  // 4. Floating Killfeed / Toast Banner
  if(match.killfeed && match.killfeed.length > 0){
    const kItem = match.killfeed[0];
    if(kItem && kItem.t > 0){
      const kAlpha = clamp(kItem.t, 0, 1);
      g.save(); g.globalAlpha = kAlpha;
      g.font = FN(11, 900);
      const kw = g.measureText(kItem.msg).width + 36;
      pill(cx - kw/2, 58, kw, 26, 'rgba(15, 23, 42, 0.94)', kItem.team === 0 ? '#ff4757' : '#38bdf8');
      txt(kItem.msg, cx, 58 + 14, FN(10.5, 900), '#ffffff');
      g.restore();
    }
  }

  // 5. Spectator status footer if local player is eliminated
  if(myP && myP.isEliminated){
    let specTargetP = P.find(p => p.slot === match.spectateTarget);
    const specName = specTargetP ? getPlayerDisplayName(specTargetP) : 'Teammate';
    const specFooterW = Math.min(360, CW - 24);
    const specFooterY = CH - 44;
    pill(cx - specFooterW/2, specFooterY, specFooterW, 30, 'rgba(15, 23, 42, 0.92)', '#e056fd');
    const specTxt = isTouch ? ('👁️ SPECTATING ' + specName + ' (TAP TO CYCLE)') : ('👁️ SPECTATING ' + specName + ' (SPACE TO CYCLE)');
    txt(specTxt, cx, specFooterY + 16, FN(10.5, 900), '#ffffff');
    if(isTouch){
      zone(cx - specFooterW/2, specFooterY, specFooterW, 30, { fn: () => cycleHunterSpectate(myP.team) });
    }
  }

  // 6. Action buttons (Pause, Mute, Fullscreen, Voice, Chat)
  drawJuicyIconBtn(xPause, 10, btnSize, {
    r: 8, depth: 2,
    renderContent: (x, y, sz) => {
      g.fillStyle = '#1e293b';
      g.fillRect(x + 10, y + 8, 4, 16);
      g.fillRect(x + 18, y + 8, 4, 16);
    },
    fn: togglePause
  });

  drawJuicyIconBtn(xMute, 10, btnSize, {
    r: 8, depth: 2,
    renderContent: (x, y, sz) => {
      g.fillStyle = '#1e293b';
      g.beginPath();
      g.moveTo(x + 8, y + sz/2 - 3);
      g.lineTo(x + 12, y + sz/2 - 3);
      g.lineTo(x + 18, y + sz/2 - 8);
      g.lineTo(x + 18, y + sz/2 + 8);
      g.lineTo(x + 12, y + sz/2 + 3);
      g.lineTo(x + 8, y + sz/2 + 3);
      g.closePath();
      g.fill();
      if(!muted){
        g.strokeStyle = '#1e293b'; g.lineWidth = 2;
        g.beginPath(); g.arc(x + 17, y + sz/2, 5, -0.6, 0.6); g.stroke();
      } else {
        g.strokeStyle = '#ef4444'; g.lineWidth = 2.5;
        g.beginPath(); g.moveTo(x + 7, y + 7); g.lineTo(x + sz - 7, y + sz - 7); g.stroke();
      }
    },
    fn: toggleSound
  });

  drawJuicyIconBtn(xFull, 10, btnSize, {
    r: 8, depth: 2,
    renderContent: (x, y, sz) => {
      g.strokeStyle = '#1e293b'; g.lineWidth = 2.2;
      const isFull = !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement||document.webkitIsFullScreen);
      if(!isFull){
        const m = 9;
        g.beginPath(); g.moveTo(x + m, y + m + 4); g.lineTo(x + m, y + m); g.lineTo(x + m + 4, y + m); g.stroke();
        g.beginPath(); g.moveTo(x + sz - m - 4, y + m); g.lineTo(x + sz - m, y + m); g.lineTo(x + sz - m, y + m + 4); g.stroke();
        g.beginPath(); g.moveTo(x + m, y + sz - m - 4); g.lineTo(x + m, y + sz - m); g.lineTo(x + m + 4, y + sz - m); g.stroke();
        g.beginPath(); g.moveTo(x + sz - m - 4, y + sz - m); g.lineTo(x + sz - m, y + sz - m); g.lineTo(x + sz - m, y + sz - m - 4); g.stroke();
      } else {
        const m = 10;
        g.strokeRect(x + m, y + m, sz - 2 * m, sz - 2 * m);
      }
    },
    fn: toggleFullscreen
  });

  if(isOnline){
    const xVoice = xFull - btnSize - 6;
    const xChat = xVoice - btnSize - 6;
    const vOn = (typeof VOICE !== 'undefined' && VOICE.enabled);
    const vMuted = (typeof VOICE !== 'undefined' && VOICE.muted);
    drawJuicyIconBtn(xVoice, 10, btnSize, {
      r: 8, depth: 2,
      bg: vOn ? (vMuted ? '#e74c3c' : '#27ae60') : 'rgba(255, 255, 255, 0.92)',
      darkBg: vOn ? (vMuted ? '#b91c1c' : '#166534') : 'rgba(203, 213, 225, 0.95)',
      icon: vOn ? (vMuted ? '🔇' : '🎙️') : '🎙️',
      iconColor: vOn ? '#ffffff' : '#1e293b',
      iconSize: 13,
      fn: voiceToggleMic
    });

    drawJuicyIconBtn(xChat, 10, btnSize, {
      r: 8, depth: 2,
      icon: '💬',
      iconColor: '#1e293b',
      iconSize: 13,
      fn: () => { if(typeof chatToggle === 'function') chatToggle(); }
    });
  }
}

  g.fillRect(0, 0, CW, CH);

  const isShort = CH < 540;

  const ph = Math.min(summary.isMatchOver ? 440 : (isShort ? 470 : 510), CH - 16);
  const px = CW / 2 - pw / 2;
  const py = CH / 2 - ph / 2;

  g.save();
  g.translate(CW / 2, CH / 2);
  g.scale(ap, ap);
  g.translate(-CW / 2, -CH / 2);

  rr(g, blueX + 10, colY + colH - (isShort ? 32 : 36), colW - 20, isShort ? 26 : 30, 6);

    let bestHunterSlot = -1, maxTags = 0;
    for(const [s, tags] of Object.entries(tStats.tags || {})){
      if(tags > maxTags){ maxTags = tags; bestHunterSlot = parseInt(s, 10); }
    }
    const apexName = (bestHunterSlot >= 0 ? ((isOnline && NET.slotsName && NET.slotsName[bestHunterSlot]) || ('P' + (bestHunterSlot + 1))) : 'None');

    // Find Ghost Runner (longest survival)
    let bestRunnerSlot = -1, maxSurv = 0;
    for(const [s, surv] of Object.entries(tStats.survival || {})){
      if(surv > maxSurv){ maxSurv = Math.round(surv); bestRunnerSlot = parseInt(s, 10); }
    }
    const ghostName = (bestRunnerSlot >= 0 ? ((isOnline && NET.slotsName && NET.slotsName[bestRunnerSlot]) || ('P' + (bestRunnerSlot + 1))) : 'None');

    txt(apexName + ' (' + maxTags + ' tags)', redX + accW/2, accY + accH * 0.72, FN(clamp(accW * 0.075, 9.5, 12), 800), '#ffffff');

    // Ghost Runner Box
    rr(g, blueX, accY, accW, accH, 8);
    g.fillStyle = 'rgba(56, 189, 248, 0.12)'; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = '#38bdf8'; g.stroke();
    ptxt('👻 GHOST RUNNER', blueX + accW/2, accY + accH * 0.34, FN(clamp(accW * 0.08, 10, 13), 900), '#38bdf8');
    txt(ghostName + ' (' + maxSurv + 's survived)', blueX + accW/2, accY + accH * 0.72, FN(clamp(accW * 0.075, 9.5, 12), 800), '#ffffff');

    const lobbySec = Math.max(0, Math.ceil(match.matchOverTimer != null ? match.matchOverTimer : 5));
    simpleButton(CW / 2 - btnW - 8, btnY, btnW, btnH, '⏳ LOBBY (' + lobbySec + 's)', () => {
      returnToLobby();
    }, null, '#8b5cf6');

    simpleButton(CW / 2 + 8, btnY, btnW, btnH, '🚪 QUIT ROOM', () => {
      quitToMenu();
    }, null, '#475569');
  } else {
    // --- INTERMISSION HUNTER ELECTION PANEL ---
    const voteY = colY + colH + (isShort ? 8 : 12);
    const voteH = btnY - voteY - (isShort ? 8 : 12);
    const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
    const mySlot = isOnline ? NET.mySlot : 0;
    const myTeam = (mySlot >= 0 && menu.slotTeam) ? (menu.slotTeam[mySlot] % 2) : 0;
    const hist = match.hunterHistory || menu.hunterHistory || {};

    // 1. Red Election Box
    rr(g, redX, voteY, colW, voteH, 8);
    g.fillStyle = 'rgba(235, 60, 40, 0.05)'; g.fill();
    g.lineWidth = 1.2; g.strokeStyle = 'rgba(235, 60, 40, 0.35)'; g.stroke();

    const curRedElected = resolveTeamHunter(0);
    const curRedPName = (isOnline && NET.slotsName && NET.slotsName[curRedElected]) || ('P' + (curRedElected + 1));
    const curRedName = ('P' + (curRedElected + 1)) + ' • ' + curRedPName;
    const redSlots = activeSlots().filter(s => ((menu.slotTeam ? menu.slotTeam[s] : s) % 2) === 0);
    const canVoteRed = !isOnline || (NET.mySlot >= 0 && myTeam === 0);
    const redItems = redSlots.concat(['random']);
    const isMyRed = !isOnline || (isOnline && myTeam === 0);
    const redHeader = !isOnline ? '🔴 RED: TAP TO CHOOSE HUNTER' : (isMyRed ? '🔴 RED — YOUR TEAM: TAP ONE' : '🔴 RED — OTHER TEAM 🔒');
    const redSub = '👑 Now hunting: ' + curRedName;
    ptxt(redHeader, redX + colW/2, voteY + 15, FN(11, 900), '#ff6b81');
    ptxt(redSub, redX + colW/2, voteY + 30, FN(9.5, 800), '#ffd166');

    // 2. Blue Election Box
    rr(g, blueX, voteY, colW, voteH, 8);
    g.fillStyle = 'rgba(56, 189, 248, 0.05)'; g.fill();
    g.lineWidth = 1.2; g.strokeStyle = 'rgba(56, 189, 248, 0.35)'; g.stroke();

    const curBlueElected = resolveTeamHunter(1);
    const curBluePName = (isOnline && NET.slotsName && NET.slotsName[curBlueElected]) || ('P' + (curBlueElected + 1));
    const curBlueName = ('P' + (curBlueElected + 1)) + ' • ' + curBluePName;
    const blueSlots = activeSlots().filter(s => ((menu.slotTeam ? menu.slotTeam[s] : s) % 2) === 1);
    const canVoteBlue = !isOnline || (NET.mySlot >= 0 && myTeam === 1);
    const blueItems = blueSlots.concat(['random']);
    const isMyBlue = !isOnline || (isOnline && myTeam === 1);
    const blueHeader = !isOnline ? '🔵 BLUE: TAP TO CHOOSE HUNTER' : (isMyBlue ? '🔵 BLUE — YOUR TEAM: TAP ONE' : '🔵 BLUE — OTHER TEAM 🔒');
    const blueSub = '👑 Now hunting: ' + curBlueName;
    ptxt(blueHeader, blueX + colW/2, voteY + 15, FN(11, 900), '#38bdf8');
    ptxt(blueSub, blueX + colW/2, voteY + 30, FN(9.5, 800), '#ffd166');

    // Reusable 2-row chip wrapping renderer
    function drawElectionChips(items, curElected, canVote, teamIdx, boxX, teamSlots){
      const N = items.length;
      const numRows = N > 3 ? 2 : 1;
      const C0 = numRows === 1 ? N : Math.ceil(N / 2);
      const C1 = numRows === 1 ? 0 : (N - C0);
      const availH = voteH - 42;
      const itemH = clamp(Math.floor((availH - (numRows - 1) * 6) / numRows), 28, 36);
      const totalChipsH = numRows * itemH + (numRows - 1) * 6;
      const iy0 = voteY + 40 + Math.max(0, Math.floor((availH - totalChipsH) / 2));
      const iy1 = iy0 + itemH + 6;

      items.forEach((cand, idx) => {
        const r = (numRows > 1 && idx >= C0) ? 1 : 0;
        const colIdx = r === 0 ? idx : (idx - C0);
        const rowCount = r === 0 ? C0 : C1;
        const gap = 4;
        const itemW = Math.floor((colW - 16 - (rowCount - 1) * gap) / rowCount);
        const rowW = rowCount * itemW + (rowCount - 1) * gap;
        const rowStartX = boxX + Math.floor((colW - rowW) / 2);
        const ix = rowStartX + colIdx * (itemW + gap);
        const iy = r === 0 ? iy0 : iy1;

        const isCandElected = (cand !== 'random' && curElected === cand);
        const isRand = (cand === 'random');
        const votes = getCandidateVoteCount(cand, teamIdx);
        const hunts = isRand ? 0 : (hist[cand] || 0);
        const isMe = !isRand && isOnline && NET && NET.mySlot === cand;
        const slotTag = isRand ? '' : ('P' + (cand + 1));
        const pName = isRand ? '' : (((isOnline && NET.slotsName && NET.slotsName[cand]) || slotTag));
        const baseName = isRand ? (itemW < 70 ? '🎲 Fair pick' : '🎲 Fair pick') : (slotTag + (isMe ? ' (YOU)' : '') + ' • ' + pName);
        const name = isRand ? baseName : (itemW < 78 && !isMe ? (slotTag + ' ' + String(pName).slice(0, 5)) : baseName);
        const myVote = (menu.hunterVotes && menu.hunterVotes[mySlot]);
        const myCand = (myVote && typeof myVote === 'object') ? myVote.cand : myVote;
        const isVotedByMe = (myCand === cand);

        g.save();
        if(!canVote) g.globalAlpha = 0.45;
        rr(g, ix, iy, itemW, itemH, 5);
        g.fillStyle = isCandElected ? (teamIdx === 0 ? 'rgba(235, 60, 40, 0.35)' : 'rgba(56, 189, 248, 0.35)') : (isVotedByMe ? 'rgba(255, 209, 102, 0.30)' : 'rgba(255, 255, 255, 0.07)');
        g.fill();
        g.lineWidth = (isCandElected || isVotedByMe) ? 1.5 : 0.8;
        g.strokeStyle = (isCandElected || isVotedByMe) ? '#ffd166' : 'rgba(255,255,255,0.25)';
        g.stroke();

        const check = isVotedByMe ? '✓ ' : '';
        const label = check + (isCandElected ? '👑 ' : '') + name;
        const tapWord = votes === 1 ? '1 tap' : (votes + ' taps');
        const subLabel = isRand ? (tapWord + ' • fair') : (tapWord + ' • H×' + hunts);
        ptxt(label, ix + itemW/2, iy + itemH * 0.38, FN(clamp(itemW * 0.11, 8, 10), 900), isCandElected ? '#ffd166' : '#ffffff');
        ptxt(subLabel, ix + itemW/2, iy + itemH * 0.76, FN(clamp(itemW * 0.095, 7, 8.5), 800), isVotedByMe ? '#ffd166' : '#cbd5e1');
        g.restore();

        zone(ix, iy, itemW, itemH, { fn: () => {
          if(!canVote){
            toast('⚠️ Tap YOUR team box — you hunt with them!');
            sfx('back');
            return;
          }
          setTeamHunterChoice(teamIdx, cand);
        }});
      });
    }

    drawElectionChips(redItems, curRedElected, canVoteRed, 0, redX, redSlots);
    drawElectionChips(blueItems, curBlueElected, canVoteBlue, 1, blueX, blueSlots);

    // One-line how voting works (plain language, always visible)
    const ruleHint = !isOnline ? 'Tap a player = they hunt • 🎲 Fair pick = fewest hunts first' : (isMyRed && !isMyBlue ? 'You are RED: tap a red box • most taps hunts • tie → fewest hunts' : (!isMyRed && isMyBlue ? 'You are BLUE: tap a blue box • most taps hunts • tie → fewest hunts' : 'Tap YOUR team box • most taps hunts • tie → fewest hunts'));
    txt(ruleHint, CW / 2, btnY - 10, FN(9, 800), 'rgba(203,213,225,0.9)');

    // 15s AFK Intermission Countdown
    const afkSec = Math.max(0, Math.ceil(match.intermissionTimer != null ? match.intermissionTimer : 15));

    // Next Round Action Button
    if(isOnline && !NET.isHost){
      // Guest: view-only waiting status
      rr(g, CW / 2 - btnW - 8, btnY, btnW, btnH, 8);
      g.fillStyle = 'rgba(71, 85, 105, 0.8)'; g.fill();
      g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,0.2)'; g.stroke();
      ptxt('⏳ WAITING FOR HOST (' + afkSec + 's)', CW / 2 - btnW/2 - 8, btnY + btnH/2 + 1, FN(clamp(btnW * 0.065, 10, 12), 900), '#cbd5e1');
    } else {
      simpleButton(CW / 2 - btnW - 8, btnY, btnW, btnH, '▶ START ROUND ' + (summary.round + 1) + ' (' + afkSec + 's)', () => {
        advanceHunterRound();
      }, null, '#8b5cf6');
    }

    simpleButton(CW / 2 + 8, btnY, btnW, btnH, '🚪 MENU', () => {
      quitToMenu();
    }, null, '#475569');
  }

  g.restore();
}

function checkTag(){
  if(!match || match.state !== 'playing' || match.cooldown > 0) return;
  const P = match.players;
  if(!P || P.length < 2) return;

  if(settings.gameMode === 'infection'){
    try{ if(typeof checkInfectionTag === 'function') checkInfectionTag(); }
    catch(e){ logModeErr('checkInfectionTag', e); }
    return;
  }
  if(settings.gameMode === 'bomb'){
    try{ if(typeof checkBombTag === 'function') checkBombTag(); }
    catch(e){ logModeErr('checkBombTag', e); }
    return;
  }
  if(settings.gameMode === 'crown'){
    try{ if(typeof checkCrownTag === 'function') checkCrownTag(); }
    catch(e){ logModeErr('checkCrownTag', e); }
    return;
  }
  if(settings.gameMode === 'ctf'){
    try{ if(typeof checkCtfTag === 'function') checkCtfTag(); }
    catch(e){ logModeErr('checkCtfTag', e); }
    return;
  }

  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isOnlineGuest = isOnline && !NET.isHost;

  if(match.hunterMode){
    if(match.cageT > 0) return; // Hunters caged during countdown!
    const redHunter = P.find(p => p.team === 0 && p.slot === match.hunterRed);
    if(redHunter && !redHunter.isEliminated){
      const blueRunners = P.filter(p => p.team === 1 && p.slot !== match.hunterBlue && !p.isEliminated);
      for(const runner of blueRunners){
        if(hitRectInclusive(tagBox(redHunter), tagBox(runner))){
          const popX = (redHunter.x + runner.x) / 2 + 23, popY = (redHunter.y + runner.y) / 2 + 10;
          if(isOnlineGuest){
            if(redHunter.slot === NET.mySlot){
              netBroadcastReliable({ t: 'tag_claim', from: redHunter.slot, target: runner.slot, x: popX, y: popY, hx: Math.round(redHunter.x), hy: Math.round(redHunter.y), tx: Math.round(runner.x), ty: Math.round(runner.y) });
              match.cooldown = 0.6;
            }
            return;
          }
          eliminateHunterRunner(redHunter, runner, popX, popY);
          return;
        } else {
          const dSq = (redHunter.x - runner.x)**2 + (redHunter.y - runner.y)**2;
          if(dSq < 5500 && (!runner.lastNearMiss || tGlobal - runner.lastNearMiss > 1.2)){
            runner.lastNearMiss = tGlobal;
            dust(runner.x + runner.w/2, runner.y + runner.h/2, 5);
          }
        }
      }
    }
    const blueHunter = P.find(p => p.team === 1 && p.slot === match.hunterBlue);
    if(blueHunter && !blueHunter.isEliminated){
      const redRunners = P.filter(p => p.team === 0 && p.slot !== match.hunterRed && !p.isEliminated);
      for(const runner of redRunners){
        if(hitRectInclusive(tagBox(blueHunter), tagBox(runner))){
          const popX = (blueHunter.x + runner.x) / 2 + 23, popY = (blueHunter.y + runner.y) / 2 + 10;
          if(isOnlineGuest){
            if(blueHunter.slot === NET.mySlot){
              netBroadcastReliable({ t: 'tag_claim', from: blueHunter.slot, target: runner.slot, x: popX, y: popY, hx: Math.round(blueHunter.x), hy: Math.round(blueHunter.y), tx: Math.round(runner.x), ty: Math.round(runner.y) });
              match.cooldown = 0.6;
            }
            return;
          }
          eliminateHunterRunner(blueHunter, runner, popX, popY);
          return;
        } else {
          const dSq = (blueHunter.x - runner.x)**2 + (blueHunter.y - runner.y)**2;
          if(dSq < 5500 && (!runner.lastNearMiss || tGlobal - runner.lastNearMiss > 1.2)){
            runner.lastNearMiss = tGlobal;
            dust(runner.x + runner.w/2, runner.y + runner.h/2, 5);
          }
        }
      }
    }
    return;
  }

  if(settings.gameMode === 'freeze'){
    // 1. UNFREEZE RESCUE: If an unfrozen teammate collides with a frozen teammate, unfreeze them!
    for(const p of P){
      if(p.isFrozen || p.isEliminated) continue;
      if(settings.teams && p.team === match.itTeam) continue;
      for(const tm of P){
        if(tm === p || !tm.isFrozen || tm.isEliminated) continue;
        if(settings.teams && tm.team !== p.team) continue;
        if(hitRectInclusive(tagBox(p), tagBox(tm))){
          tm.isFrozen = false;
          const popX = tm.x + tm.w / 2, popY = tm.y + tm.h / 2;
          dust(popX, popY, 12, 180);
          ringP(popX, popY, '#38bdf8');
          sfx('win');
          match.flash = 0.12;
          match.tagPop = { x: popX, y: popY, t: 0.5, who: P.indexOf(tm), hunter: P.indexOf(p), label: 'UNFROZEN!' };
        }
      }
    }

    // 2. TAGGING: When IT tags an unfrozen runner on opposing team, freeze them!
    const hunters = P.filter(p => settings.teams ? (p.team === match.itTeam) : (P.indexOf(p) === match.it));
    const runners = P.filter(p => settings.teams ? (p.team !== match.itTeam) : (P.indexOf(p) !== match.it));

    for(const hunter of hunters){
      if(hunter.isFrozen || hunter.isEliminated) continue;
      for(const runner of runners){
        if(runner.isFrozen || runner.isEliminated) continue;
        if(hitRectInclusive(tagBox(hunter), tagBox(runner))){
          const popX = (hunter.x + runner.x) / 2 + 23, popY = (hunter.y + runner.y) / 2 + 10;
          if(isOnlineGuest){
            if(hunter.slot === NET.mySlot){
              netBroadcastReliable({ t: 'tag_claim', from: hunter.slot, target: runner.slot, x: popX, y: popY, hx: Math.round(hunter.x), hy: Math.round(hunter.y), tx: Math.round(runner.x), ty: Math.round(runner.y) });
              match.cooldown = 0.6;
            }
            return;
          }
          runner.isFrozen = true;
          runner.vx = 0;
          runner.vy = 0;
          dust(popX, popY, 12, 160);
          tagBurst(popX, popY, '#38bdf8', '#00d2d3');
          sfx('tag');
          match.freeze = 0.08;
          match.shake = 8;
          match.tags[P.indexOf(hunter)] = (match.tags[P.indexOf(hunter)] || 0) + 1;
          match.tagPop = { x: popX, y: popY, t: 0.6, who: P.indexOf(runner), hunter: P.indexOf(hunter), label: 'FROZEN!' };

          // WIN CONDITION: If all runners on a team are frozen, hunter team immediately wins!
          const activeRunners = runners.filter(r => !r.isEliminated);
          const allFrozen = activeRunners.length > 0 && activeRunners.every(r => r.isFrozen);
          if(allFrozen){
            const winTeam = match.itTeam != null ? match.itTeam : P.indexOf(hunter);
            match.result = { winningTeam: winTeam, mode: 'freeze', reason: 'all_frozen' };
            endMatch();
            return;
          }
          match.cooldown = 0.4;
          return;
        }
      }
    }
    return;
  }

  if(settings.teams && match.itTeam != null){
    // "Hunt Together": ALL players on the itTeam hunt together!
    const hunters = P.filter(p => p.team === match.itTeam);
    const runners = P.filter(p => p.team !== match.itTeam);
    for(const hunter of hunters){
      for(const runner of runners){
        if(hitRectInclusive(tagBox(hunter), tagBox(runner))){
          const popX = (hunter.x + runner.x) / 2 + 23, popY = (hunter.y + runner.y) / 2 + 10;
          if(isOnlineGuest){
            if(hunter.slot === NET.mySlot){
              netBroadcastReliable({ t: 'tag_claim', from: hunter.slot, target: runner.slot, x: popX, y: popY, hx: Math.round(hunter.x), hy: Math.round(hunter.y), tx: Math.round(runner.x), ty: Math.round(runner.y) });
              match.cooldown = 0.6;
            }
            return;
          }
          applyTag(P.indexOf(runner), popX, popY);
          return;
        }
      }
    }
    return;
  }

  // Classic Free-for-All
  const it = P[match.it];
  if(!it) return;
  for(let j = 0; j < P.length; j++){
    if(j === match.it) continue;
    if(hitRectInclusive(tagBox(it), tagBox(P[j]))){
      if(isOnlineGuest){
        if(it.slot === NET.mySlot){
          const popX = (it.x + P[j].x) / 2 + 23, popY = (it.y + P[j].y) / 2 + 10;
          netBroadcastReliable({ t: 'tag_claim', from: it.slot, target: P[j].slot, x: popX, y: popY, hx: Math.round(it.x), hy: Math.round(it.y), tx: Math.round(P[j].x), ty: Math.round(P[j].y) });
          match.cooldown = 0.6;
        }
        return;
      }
      applyTag(j, (it.x + P[j].x) / 2 + 23, (it.y + P[j].y) / 2 + 10);
      return;
    }
  }
}
/* ================= career persistence (retention: wins, tags, streaks, titles) ================= */
const CAREER_KEY = 'tag_career_v1';
function defaultCareer(){ return { m:0, w:0, tags:0, best:0, streak:0, bestStreak:0, titles:0, surv:0, xp:0, trail:0 }; }
function loadCareer(){
  try{
    const raw = localStorage.getItem(CAREER_KEY);
    if(!raw) return defaultCareer();
    const c = JSON.parse(raw), d = defaultCareer();
    for(const k of Object.keys(d)){
      if(typeof c[k] === 'number' && isFinite(c[k]) && c[k] >= 0) d[k] = (k === 'surv') ? Math.round(c[k] * 10) / 10 : Math.floor(c[k]);
    }
    if(!c.xp && (d.m > 0 || d.tags > 0 || d.w > 0)){
      d.xp = d.m * 50 + d.w * 100 + d.tags * 25;
    }
    return d;
  }catch(e){ return defaultCareer(); }
}
function saveCareer(){ try{ localStorage.setItem(CAREER_KEY, JSON.stringify(CAREER)); }catch(e){} }
let CAREER = loadCareer();

/* Cosmetic Unlockable Trails (milestones at Lv 1, 2, 4, 6) */
const COSMETIC_TRAILS = [
  { id: 0, name: 'Speed Sparks', reqLevel: 1, icon: '⚡', color: '#ffd166', desc: 'Default electric sparks' },
  { id: 1, name: 'Neon Ribbon', reqLevel: 2, icon: '✨', color: '#38bdf8', desc: 'Cyan neon ribbon (Lv 2+)' },
  { id: 2, name: 'Hellfire Flames', reqLevel: 4, icon: '🔥', color: '#ff4757', desc: 'Blazing flame embers (Lv 4+)' },
  { id: 3, name: 'Rainbow Comet', reqLevel: 6, icon: '🌈', color: '#a855f7', desc: 'Prismatic comet dust (Lv 6+)' }
];

function getCareerLevel(xp){
  const x = (typeof xp === 'number' && isFinite(xp)) ? xp : (CAREER.xp || 0);
  return Math.floor(Math.sqrt(Math.max(0, x) / 100)) + 1;
}

function getCareerProgress(xp){
  const x = (typeof xp === 'number' && isFinite(xp)) ? xp : (CAREER.xp || 0);
  const lvl = getCareerLevel(x);
  const curLvlXp = (lvl - 1) * (lvl - 1) * 100;
  const nextLvlXp = lvl * lvl * 100;
  const need = nextLvlXp - curLvlXp;
  const prog = Math.max(0, Math.min(need, x - curLvlXp));
  return { level: lvl, cur: prog, need: need, pct: Math.min(1, prog / need) };
}

function isTrailUnlocked(trailId){
  const trail = COSMETIC_TRAILS[trailId];
  if(!trail) return false;
  return getCareerLevel() >= trail.reqLevel;
}

function cycleCosmeticTrail(d){
  const cur = CAREER.trail || 0;
  const dir = d || 1;
  let next = cur;
  for(let step = 1; step <= COSMETIC_TRAILS.length; step++){
    const cand = (cur + step * dir + COSMETIC_TRAILS.length * 10) % COSMETIC_TRAILS.length;
    if(isTrailUnlocked(cand)){
      next = cand;
      break;
    }
  }
  CAREER.trail = next;
  saveCareer();
  toast(COSMETIC_TRAILS[next].icon + ' TRAIL: ' + COSMETIC_TRAILS[next].name.toUpperCase());
  sfx('ui');
}

function myMatchIndex(){
  if(!match || !match.players) return -1;
  if(menu.tab === 'bots') return -1; // bot-vs-bot watch mode: no human career
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const mySlot = isOnline ? NET.mySlot : 0;
  if(mySlot == null || mySlot < 0) return -1;
  return match.players.findIndex(p => p.slot === mySlot);
}

function careerRecordMatch(won, myTags, mySurv){
  CAREER.m++;
  myTags = Math.max(0, myTags | 0);
  CAREER.tags += myTags;
  if(myTags > CAREER.best) CAREER.best = myTags;
  if(mySurv != null && mySurv > CAREER.surv) CAREER.surv = Math.round(mySurv * 10) / 10;
  if(won){ CAREER.w++; CAREER.streak++; if(CAREER.streak > CAREER.bestStreak) CAREER.bestStreak = CAREER.streak; }
  else CAREER.streak = 0;

  // Career XP and Level Progression
  const oldLvl = getCareerLevel(CAREER.xp);
  let gainXp = 50 + (myTags * 25);
  if(won) gainXp += 100;
  if(CAREER.streak > 1) gainXp += Math.min(100, CAREER.streak * 15);
  if(mySurv != null) gainXp += Math.min(100, Math.floor(mySurv * 2));
  try{
    const bonusSlot = (typeof match !== 'undefined' && match && match.result) ? match.result._loneSurvivorBonus : -1;
    const mySlotNow = (typeof NET !== 'undefined' && NET && NET.role !== null) ? NET.mySlot : 0;
    if(won && bonusSlot != null && bonusSlot >= 0 && bonusSlot === mySlotNow){
      gainXp += 250;
    }
  }catch(e){}
  CAREER.xp = (CAREER.xp || 0) + gainXp;

  const newLvl = getCareerLevel(CAREER.xp);
  if(newLvl > oldLvl){
    sfx('win');
    confetti();
    const newTrail = COSMETIC_TRAILS.find(t => t.reqLevel === newLvl);
    if(newTrail){
      CAREER.trail = newTrail.id;
      toast('🎉 LEVEL ' + newLvl + '! UNLOCKED ' + newTrail.icon + ' ' + newTrail.name.toUpperCase() + ' TRAIL!');
    } else {
      toast('🎉 LEVEL UP! REACHED LEVEL ' + newLvl + '!');
    }
  }
  saveCareer();
}

function careerLine(){
  if(!CAREER) return '';
  const lvl = getCareerLevel(CAREER.xp);
  const prog = getCareerProgress(CAREER.xp);
  let s = '⭐ LVL ' + lvl + ' (' + prog.cur + '/' + prog.need + ' XP)';
  if(CAREER.m > 0){
    s += ' • 🏆 ' + CAREER.w + 'W/' + CAREER.m + ' • 🏷️ ' + CAREER.tags + ' tags';
    if(CAREER.streak >= 2) s += ' • 🔥 x' + CAREER.streak;
  }
  return s;
}

function endMatch(){
  try{CG.happytime();}catch(e){}try{CG.gameplayStop();}catch(e){}
  match.state='result';
  match.hostMenu=false;
  if(settings.gameMode === 'infection'){
    if(!match.result || match.result.winningTeam == null){
      const livingSurvivors = match.players.filter(p => !p.isInfected && !p.isEliminated);
      match.result = {
        winningTeam: livingSurvivors.length > 0 ? 'survivors' : 'zombies',
        mode: 'infection',
        reason: livingSurvivors.length > 0 ? 'survived' : 'all_infected',
        survivors: livingSurvivors.map(p => p.slot)
      };
    }
  } else if(settings.gameMode === 'bomb'){
    if(!match.result || match.result.winner == null){
      const alive = match.players.filter(p => !p.isEliminated);
      const wIdx = alive.length > 0 ? match.players.indexOf(alive[0]) : 0;
      match.result = {
        winner: wIdx,
        loser: (typeof BOMB_MODE !== 'undefined' && BOMB_MODE) ? BOMB_MODE.carrierIdx : -1,
        mode: 'bomb'
      };
    }
  } else if(settings.gameMode === 'crown'){
    if(!match.result || match.result.winner == null){
      let bestP = 0, bestScore = -1;
      if(typeof crownState !== 'undefined' && crownState.scores){
        for(let si = 0; si < match.players.length; si++){
          const sc = crownState.scores[match.players[si].slot] || 0;
          if(sc > bestScore){ bestScore = sc; bestP = si; }
        }
      }
      match.result = {
        winner: bestP,
        mode: 'crown',
        score: bestScore
      };
      if(typeof crownState !== 'undefined' && crownState){
        crownState.floaters = [];
        crownState.banners = [];
        crownState.shockwaves = [];
      }
    }
  } else if(settings.gameMode === 'ctf'){
    if(!match.result || match.result.winningTeam == null){
      const redCaps = (typeof ctfState !== 'undefined' && ctfState) ? ctfState.scores[0] : 0;
      const blueCaps = (typeof ctfState !== 'undefined' && ctfState) ? ctfState.scores[1] : 0;
      let winTeam = -1;
      if(redCaps > blueCaps) winTeam = 0;
      else if(blueCaps > redCaps) winTeam = 1;
      else winTeam = -1;
      match.result = {
        winningTeam: winTeam,
        mode: 'ctf',
        scores: [redCaps, blueCaps],
        reason: winTeam === -1 ? 'draw' : 'score'
      };
      if(typeof ctfState !== 'undefined' && ctfState){
        ctfState.floaters = [];
        ctfState.banners = [];
        ctfState.shockwaves = [];
      }
    }
  } else if(settings.gameMode === 'freeze'){
    if(!match.result || match.result.winningTeam == null){
      // Timer expired in Freeze Tag: runners win!
      const hunterTeam = match.itTeam != null ? match.itTeam : 0;
      const runnerTeam = (hunterTeam === 0 ? 1 : 0);
      match.result = { winningTeam: runnerTeam, mode: 'freeze', reason: 'survived' };
    }
  } else if(settings.teams && match.teamItTime){
    // Team with the lowest total IT time wins!
    const activeTeams = Array.from(new Set(match.players.map(p => p.team)));
    let bestTeam = activeTeams[0] || 0;
    let minTime = match.teamItTime[bestTeam] || 0;
    for(const tm of activeTeams){
      const tmTime = match.teamItTime[tm] || 0;
      if(tmTime < minTime){
        minTime = tmTime;
        bestTeam = tm;
      }
    }
    match.result={winningTeam: bestTeam, teamItTime: match.teamItTime.slice()};
  } else {
    match.result={loser:match.it};
  }
  // Career persistence (this device: P1 offline, my slot online; spectators skipped)
  try{
    const mi = myMatchIndex();
    if(mi >= 0){
      const myTags = (match.tags[mi] != null) ? match.tags[mi] : 0;
      let won = false;
      if(settings.gameMode === 'infection'){
        const mp = match.players[mi];
        won = match.result && match.result.winningTeam === 'survivors' ? (!mp.isInfected) : (!!mp.isInfected);
      } else if(settings.gameMode === 'bomb' || settings.gameMode === 'crown'){
        won = (match.result && mi === match.result.winner);
      } else if(match.result.winningTeam != null){
        const mp = match.players[mi];
        won = !!mp && mp.team === match.result.winningTeam;
      } else {
        won = (mi !== match.result.loser);
      }
      careerRecordMatch(won, myTags, null);
    }
  }catch(e){}
  match.resultT=0;
  confetti();
  sfx('win');
  if(!match._telemetrySent){
    try{ telemetryTrackMatchEnded(); }catch(e){}
    try{ telemetrySendSessionPing('match_end'); }catch(e){}
  }
  if(typeof NET!=='undefined' && NET && NET.isHost && NET.midgameJoiner){
    netToast('New player joined — returning to lobby!');
  }
}

/* ================= camera ================= */
function updateCam(dt){
  let tx,ty,ts;
  const N=match?match.players.length:2;
  if(screen!=='game'||!match){
    tx=W/2;ty=H/2;ts=Math.min(CW/(W+160),CH/(H+160));
  }else{
    const P=match.players;
    let mx=0,my=0,minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,cnt=0;
    for(const p of P){
      if(p.isEliminated) continue;
      mx+=p.x;my+=p.y;minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);
      cnt++;
    }
    if(cnt === 0){
      mx = W/2; my = H/2; minX = W/2 - 100; maxX = W/2 + 100; minY = H/2 - 100; maxY = H/2 + 100; cnt = 1;
    }
    tx=mx/cnt+23;ty=my/cnt+23;
    const dx=maxX-minX,dy=maxY-minY;
    const needW=dx+640+(N-2)*220,needH=dy+500+(N-2)*120;
    const minS=Math.min(CW/(W+140),CH/(H+140));
    ts=clamp(Math.min(CW/needW,CH/needH),minS,N>=6?1.05:(N>=4?1.25:1.75));
  }
  const kp=1-Math.exp(-dt*5.5),ks=1-Math.exp(-dt*3.8);
  cam.x+=(tx-cam.x)*kp;cam.y+=(ty-cam.y)*kp;cam.s+=(ts-cam.s)*ks;
  const vw=CW/cam.s,vh=CH/cam.s;
  cam.x=vw>=W+120?W/2:clamp(cam.x,vw/2-60,W-vw/2+60);
  cam.y=vh>=H+120?H/2:clamp(cam.y,vh/2-60,H-vh/2+60);
}

/* ================= game update & fullscreen ================= */
function toggleFullscreen(){
  try{
    const de = document.documentElement;
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || document.webkitIsFullScreen);
    const req = de.requestFullscreen || de.webkitRequestFullscreen || de.webkitRequestFullScreen || cv.requestFullscreen || cv.webkitRequestFullscreen || cv.webkitRequestFullScreen || de.mozRequestFullScreen || de.msRequestFullscreen;
    if(!req){
      window.scrollTo(0, 0);
      if(match){ match.mapToast = 'ADD TO HOME SCREEN FOR FULLSCREEN'; match.mapToastT = 2.5; }
      return;
    }
    if(!isFs){
      const target = (de.requestFullscreen || de.webkitRequestFullscreen || de.webkitRequestFullScreen) ? de : cv;
      const p = req.call(target);
      if(p && p.catch) p.catch(()=>{ try{if(match){match.mapToast='ADD TO HOME SCREEN FOR FULLSCREEN';match.mapToastT=2.5;}}catch(e){} });
    }else{
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if(exit){
        const p = exit.call(document);
        if(p && p.catch) p.catch(()=>{});
      }
    }
  }catch(e){}
}

  muted=!muted;

function updateGame(dt){
