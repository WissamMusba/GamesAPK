/* ---------- Web Audio Synthesizer ---------- */
const Snd = {
  ctx: null, master: null, sfx: null, music: null, started: false,
  beatT: 0,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.85;
      this.master.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain();
      this.sfx.gain.value = 0.9;
      this.sfx.connect(this.master);
      this.music = this.ctx.createGain();
      this.music.gain.value = 0.55;
      this.music.connect(this.master);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.started = true;
    this.applyMute();
  },
  applyMute() {
    if (!this.master) return;
    const mute = adActive || !settings.sound;
    this.master.gain.setTargetAtTime(mute ? 0.0001 : 0.85, this.ctx.currentTime, 0.04);
  },
  tone({ type='sine', f=440, f2=null, dur=0.2, vol=0.2, at=0, lp=null }) {
    if (!this.ctx || !settings.sound || adActive) return;
    const t = this.ctx.currentTime + at;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (lp) {
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = lp;
      o.connect(filt); node = filt;
    }
    node.connect(g); g.connect(this.sfx);
    o.start(t); o.stop(t + dur + 0.05);
  },
  hiss({ f=1000, f2=300, dur=0.2, vol=0.15, at=0 }) {
    if (!this.ctx || !settings.sound || adActive) return;
    const t = this.ctx.currentTime + at;
    const b = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = b;
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(f, t);
    if (f2) filt.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(this.sfx);
    src.start(t); src.stop(t + dur + 0.02);
  },
  jump() { this.tone({ type: 'triangle', f: 280, f2: 600, dur: 0.14, vol: 0.18 }); },
  doubleJump() { this.tone({ type: 'triangle', f: 440, f2: 920, dur: 0.16, vol: 0.18 }); },
  wallJump() { this.tone({ type: 'triangle', f: 380, f2: 820, dur: 0.15, vol: 0.24 }); },
  bounce() { this.tone({ type: 'sine', f: 520, f2: 1200, dur: 0.22, vol: 0.3 }); },
  mantle() { this.tone({ type: 'triangle', f: 220, f2: 440, dur: 0.10, vol: 0.16 }); },
  land() { this.tone({ type: 'sine', f: 120, f2: 50, dur: 0.12, vol: 0.22 }); },
  dash() { this.hiss({ f: 800, f2: 2400, dur: 0.16, vol: 0.2 }); },
  shove() { this.tone({ type: 'sawtooth', f: 180, f2: 70, dur: 0.18, vol: 0.28, lp: 600 }); },
  switchHit() { this.tone({ type: 'sine', f: 523, f2: 1046, dur: 0.18, vol: 0.25 }); },
  ventLaunch() { this.hiss({ f: 400, f2: 1800, dur: 0.35, vol: 0.3 }); },
  ki() { this.tone({ type: 'sine', f: 880, f2: 1320, dur: 0.1, vol: 0.12 }); },
  cardReady() { this.tone({ type: 'triangle', f: 659, f2: 1318, dur: 0.22, vol: 0.2 }); },
  cardCast() {
    this.tone({ type: 'sawtooth', f: 520, f2: 140, dur: 0.25, vol: 0.28, lp: 1200 });
    this.hiss({ f: 2000, f2: 400, dur: 0.2, vol: 0.2 });
  },
  thunder() {
    this.tone({ type: 'sawtooth', f: 120, f2: 30, dur: 0.4, vol: 0.35, lp: 500 });
    this.hiss({ f: 800, f2: 100, dur: 0.35, vol: 0.3 });
  },
  freeze() {
    this.tone({ type: 'triangle', f: 1200, f2: 400, dur: 0.25, vol: 0.28 });
  },
  telegraph() { this.tone({ type: 'sine', f: 1046, f2: 880, dur: 0.15, vol: 0.3 }); },
  parry() {
    this.tone({ type: 'triangle', f: 1760, f2: 3520, dur: 0.32, vol: 0.4 });
    this.tone({ type: 'sawtooth', f: 880, f2: 220, dur: 0.2, vol: 0.25, lp: 2500 });
    this.hiss({ f: 3000, f2: 1000, dur: 0.18, vol: 0.3 });
  },
  fall() { this.tone({ type: 'sine', f: 380, f2: 80, dur: 0.35, vol: 0.25 }); },
  skyDrop() { this.hiss({ f: 1600, f2: 300, dur: 0.3, vol: 0.22 }); },
  eliminate() {
    this.tone({ type: 'sawtooth', f: 220, f2: 40, dur: 0.4, vol: 0.3, lp: 700 });
    this.hiss({ f: 600, f2: 80, dur: 0.35, vol: 0.22 });
  },
  win() {
    const notes = [440, 554, 659, 880, 1108];
    notes.forEach((f, i) => this.tone({ type: 'triangle', f, dur: 0.35, vol: 0.2, at: i * 0.08 }));
  },
  drum(vol=0.15) {
    if (!this.ctx || !settings.sound || adActive) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.frequency.setValueAtTime(110, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.14);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.music);
    o.start(t); o.stop(t + 0.18);
  },
  tickMusic(dt, fogNear) {
    if (!this.started || !settings.sound || adActive) return;
    const rate = fogNear ? 135 : 108;
    const interval = 60 / rate;
    this.beatT += dt;
    if (this.beatT >= interval) {
      this.beatT -= interval;
      this.drum(fogNear ? 0.20 : 0.12);
    }
  }
};

/* ---------- Particle & FloatText ---------- */
class Particle {
  constructor(o) {
    this.x = o.x; this.y = o.y;
    this.vx = o.vx || (Math.random() * 100 - 50);
    this.vy = o.vy || (Math.random() * -120 - 30);
    this.color = o.color || '#ffd76a';
    this.size = o.size || Math.random() * 4 + 2;
    this.life = o.life || 0.6;
    this.maxLife = this.life;
    this.type = o.type || 'square';
  }
  update(dt) {
    this.life -= dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  draw() {
    if (this.life <= 0) return;
    const a = clamp(this.life / this.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    if (this.type === 'circle') {
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, TAU); ctx.fill();
    } else {
      ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
    }
    ctx.restore();
  }
}

class FloatText {
  constructor(x, y, str, color='#ffd76a') {
    this.x = x; this.y = y; this.str = str; this.color = color;
    this.life = 1.3; this.maxLife = 1.3;
  }
  update(dt) {
    this.life -= dt;
    this.y -= 30 * dt;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = clamp(this.life / this.maxLife, 0, 1);
    ctx.fillStyle = this.color;
    ctx.font = '600 17px ' + FD;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 3;
    ctx.fillText(this.str, this.x, this.y);
    ctx.restore();
  }
}

/* ---------- Player Class ---------- */
class Player {
  constructor(id, name, color, accent) {
    this.id = id;
    this.name = name;
    this.color = color;
    this.accent = accent;
    this.w = 34; this.h = 58;
    this.reset(100, G - this.h);
  }
  reset(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.onGround = true;
    this.onWall = 0;
    this.jumpsLeft = 2;
    this.coyote = 0;
    this.petals = 3;
    this.ki = 100; // Ready on frame 1!
    this.card = pickRandomCard();
    this.dashT = 0; this.dashCd = 0;
    this.emberT = 0;
    this.cursedT = 0;
    this.invulnT = 0;
    this.incomingSabotage = null;
    this.parryFlash = 0;
    this.won = false;
    this.shoves = 0; this.sabotagesCast = 0; this.parries = 0;
    this.runPhase = 0;

    // Sabotage Status Effects
    this.stunT = 0;
    this.frozenT = 0;
    this.heavyT = 0;
    this.smokeT = 0;

    // AI Variables
    this.aiParryTimer = -1;
    this.stuckTime = 0;
    this.wallJumpCd = 0;
    this.whiffCd = 0;
    this.aiStuckX = x;
    this.aiStuckT = 0;
    this.aiBacktrackT = 0;
  }

  requestJump() {
    if (this.stunT > 0 || this.frozenT > 0) return;

    // Wall-jump: kicks off vertical surfaces
    if (this.onWall !== 0 && !this.onGround) {
      const kickDir = -this.onWall;
      this.vx = kickDir * 420;
      this.vy = -640;
      this.facing = kickDir;
      this.onWall = 0;
      this.jumpsLeft = 1;
      this.wallJumpCd = 0.55;
      Snd.wallJump();
      burstDust(this.x + (kickDir < 0 ? this.w : 0), this.y + this.h / 2, 8, '#ffffff');
      floatTexts.push(new FloatText(this.x, this.y - 25, 'WALL KICK!', '#ffd76a'));
      return;
    }

    if (this.onGround || this.coyote > 0) {
      this.vy = (this.heavyT > 0) ? -380 : -640;
      this.onGround = false; this.coyote = 0;
      this.jumpsLeft = 1;
      Snd.jump();
      burstDust(this.x + this.w / 2, this.y + this.h, 4, this.accent);
    } else if (this.jumpsLeft > 0) {
      this.vy = (this.heavyT > 0) ? -350 : -600;
      this.jumpsLeft--;
      Snd.doubleJump();
      burstRing(this.x + this.w / 2, this.y + this.h * 0.7, this.accent);
    }
  }

  tryDash(dir) {
    if (this.dashCd > 0 || this.stunT > 0 || this.frozenT > 0) return;
    this.dashT = 0.20;
    this.dashCd = 1.2;
    this.facing = dir;
    this.vx = dir * (this.heavyT > 0 ? 360 : 560);
    Snd.dash();
    for (let i = 0; i < 4; i++) {
      particles.push(new Particle({
        x: this.x + this.w / 2, y: this.y + this.h / 2,
        vx: -dir * 50 + (Math.random() * 30 - 15),
        vy: Math.random() * 30 - 15,
        color: this.accent, size: 5, life: 0.28
      }));
    }
  }

  // ATTACK button: cast sabotage when Ki is full. Never defends.
  tryAttack(rival) {
    if (state !== 'play' || paused) return;
    if (this.ki >= 100 && this.stunT <= 0 && this.frozenT <= 0) {
      this.ki = 0;
      this.sabotagesCast++;
      Snd.cardCast();
      const card = this.card;
      this.card = pickRandomCard();

      if (card.id === 'ember') {
        this.emberT = 2.2;
        this.vx = this.facing * 640;
        floatTexts.push(new FloatText(this.x, this.y - 35, (this.id === 2 ? '👹 ONI: ' : '') + 'EMBER DASH!', '#ff9900'));
        burstRing(this.x + this.w / 2, this.y + this.h / 2, '#ffaa00');
        return;
      }

      // Offensive card: targets rival with fair PARRY_WINDOW defend telegraph
      rival.incomingSabotage = {
        card: card,
        from: this,
        timer: PARRY_WINDOW
      };
      Snd.telegraph();
      floatTexts.push(new FloatText(this.x, this.y - 35, (this.id === 2 ? '👹 ONI: ' : '⚔ ') + card.name.toUpperCase() + '!', this.color));
      floatTexts.push(new FloatText(rival.x, rival.y - 45, '🛡 DEFEND! (' + (rival.id === 1 ? 'S' : '↓') + ') ' + PARRY_WINDOW.toFixed(2) + 's', '#ff4444'));
      shake = 6;
    }
  }

  // DEFEND button: reflect incoming sabotage inside the window, else whiff (-15 Ki anti-spam).
  tryDefend(rival) {
    if (state !== 'play' || paused) return;
    if (this.incomingSabotage && this.incomingSabotage.timer > 0) {
      this.executeParry(rival);
      return;
    }
    this.defendWhiff();
  }

  // Legacy combined path (touch input + AI convenience): defend if attacked, else attack.
  tryUseCard(rival) {
    if (state !== 'play' || paused) return;
    if (this.incomingSabotage && this.incomingSabotage.timer > 0) {
      this.executeParry(rival);
      return;
    }
    this.tryAttack(rival);
  }

  // Whiffed defend: tapping the defend key with no incoming attack costs 15 Ki (anti-spam).
  defendWhiff() {
    if (state !== 'play' || paused) return;
    if (this.incomingSabotage && this.incomingSabotage.timer > 0) { return; }
    if (this.whiffCd > 0) return;
    if (this.ki >= 100) return; // full Ki + no incoming = attack path handled by tryUseCard
    this.whiffCd = 0.5;
    this.ki = Math.max(0, this.ki - 15);
    floatTexts.push(new FloatText(this.x, this.y - 30, 'WHIFFED DEFEND (-15 KI)', '#aaaaaa'));
  }

  executeParry(rival) {
    const atk = this.incomingSabotage;
    this.incomingSabotage = null;
    this.parries++;
    Snd.parry();
    shake = 16; flash = 0.7;
    burstShockwave(this.x + this.w / 2, this.y + this.h / 2, '#ffffff');
    floatTexts.push(new FloatText(this.x, this.y - 50, '⚡ ' + (this.id === 2 ? 'ONI ' : '') + 'PROTECTED! UNO REVERSE!', '#00ffff'));
    applySabotageEffect(rival, atk.card, this);
  }

  takeDamage() {
    if (this.emberT > 0 || this.invulnT > 0) return;
    this.petals--;
    shake = 14; flash = 0.5;
    Snd.shove();

    if (this.petals <= 0) {
      // Petals fully lost: brief setback respawn, restore all 3 petals, NEVER lock the player out!
      this.petals = 3;
      this.ki = 0; // Ki penalty
      shake = 20; flash = 0.7;
      Snd.eliminate();
      burstShockwave(this.x + this.w / 2, this.y + this.h / 2, '#ff2222');
      floatTexts.push(new FloatText(this.x, this.y - 35, '💥 RESPAWNED! (3/3 PETALS)', '#ff3b30'));
      this.instantRespawn();
    } else {
      floatTexts.push(new FloatText(this.x, this.y - 30, '-1 PETAL (' + this.petals + '/3)', '#ff3b30'));
      this.instantRespawn();
    }
  }

  // Safe respawn onto solid, stable ground (never vanishing/geyser/crumbling)
  instantRespawn() {
    this.invulnT = 2.5;
    this.stunT = 0; this.frozenT = 0;
    // Clear lingering debuffs/vision on respawn
    this.heavyT = 0; this.cursedT = 0; this.smokeT = 0;
    this.incomingSabotage = null;

    const tower = isTowerMap();
    const minSafeX = tower ? -Infinity : fogX + 180;
    let safePlat = null;
    for (const p of plats) {
      if (p.vanished) continue;
      if (p.type === 'vanishing' || p.type === 'forge_geyser' || p.type === 'crumble' || p.type === 'ice') continue;
      if (p.w < 120 || p.h > 60) continue;
      // Avoid flame jets
      let jetNear = false;
      for (const fj of flameJets) {
        if (Math.abs((p.x + p.w / 2) - fj.x) < p.w / 2 + 40 && Math.abs(p.y - fj.y) < 120) { jetNear = true; break; }
      }
      if (jetNear) continue;
      // Avoid closed gates overlapping the platform
      let gateBlock = false;
      for (const g of gates) {
        if (!g.open && g.x + g.w > p.x && g.x < p.x + p.w && g.y < p.y + 20 && g.y + g.h > p.y - 80) { gateBlock = true; break; }
      }
      if (gateBlock) continue;
      if (!tower && !(p.x > minSafeX && p.y <= G)) continue;
      if (tower) {
        // Prefer platforms near/below current height, ahead of rising fog
        if (p.y > fogY + 30) continue;
        if (!safePlat || Math.abs(p.y - this.y) < Math.abs(safePlat.y - this.y)) safePlat = p;
      } else {
        if (!safePlat || p.x < safePlat.x) safePlat = p;
      }
    }

    if (safePlat) {
      this.x = clamp(safePlat.x + 40, safePlat.x + 10, safePlat.x + safePlat.w - this.w - 10);
      this.y = safePlat.y - this.h - 10;
    } else if (tower) {
      this.x = clamp(this.x, 80, MAPS[curMapIndex].w - 80);
      this.y = Math.min(this.y - 60, fogY - 220);
    } else {
      this.x = clamp(minSafeX + 40, 80, finishGate.x - 200);
      this.y = G - this.h - 10;
    }

    this.vx = 220;
    this.vy = -300;
    this.jumpsLeft = 2;
    Snd.skyDrop();
    burstRing(this.x + this.w / 2, this.y + this.h / 2, '#ffcc00');
  }

  update(dt, rival) {
    if (this.whiffCd > 0) this.whiffCd -= dt;
    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.emberT > 0) this.emberT -= dt;
    if (this.cursedT > 0) this.cursedT -= dt;
    if (this.invulnT > 0) this.invulnT -= dt;
    if (this.parryFlash > 0) this.parryFlash -= dt;
    if (this.wallJumpCd > 0) this.wallJumpCd -= dt;
    if (this.stunT > 0) this.stunT -= dt;
    if (this.frozenT > 0) this.frozenT -= dt;
    if (this.heavyT > 0) this.heavyT -= dt;
    if (this.smokeT > 0) this.smokeT -= dt;

    // Passive Ki regeneration (+8.5% / second)
    if (this.ki < 100) this.ki = Math.min(100, this.ki + dt * 8.5);

    if (this.incomingSabotage) {
      this.incomingSabotage.timer -= dt;
      if (this.incomingSabotage.timer <= 0) {
        applySabotageEffect(this, this.incomingSabotage.card, this.incomingSabotage.from);
        this.incomingSabotage = null;
      }
    }

    if (this.stunT > 0 || this.frozenT > 0) {
      this.vx = 0;
      this.vy += GRAV * dt;
      if (this.vy > MAXF) this.vy = MAXF;
      this.y += this.vy * dt;
      for (const p of plats) {
        if (this.x < p.x + p.w && this.x + this.w > p.x && this.y + this.h > p.y && this.y < p.y + p.h) {
          this.y = p.y - this.h; this.vy = 0; this.onGround = true; break;
        }
      }
      return;
    }

    let moveLeft = false, moveRight = false;
    if (this.id === 1) {
      moveLeft = keys.a; moveRight = keys.d;
    } else {
      if (gameMode === 'ai') {
        const aiMove = updateAI(this, rival, dt);
        moveLeft = aiMove.left; moveRight = aiMove.right;
      } else {
        moveLeft = keys.left; moveRight = keys.right;
      }
    }

    if (this.cursedT > 0) {
      const tmp = moveLeft; moveLeft = moveRight; moveRight = tmp;
    }

    const dir = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
    const baseSpd = 240 * (this.emberT > 0 ? 1.35 : 1.0) * (this.heavyT > 0 ? 0.75 : 1.0);

    if (this.dashT > 0) {
      this.dashT -= dt;
      this.vx = this.facing * (this.emberT > 0 ? 700 : 560);
    } else {
      this.vx = dir * baseSpd;
      if (dir !== 0) this.facing = dir;
    }

    const curGrav = GRAV * (this.heavyT > 0 ? 2.6 : 1.0);
    this.vy += curGrav * dt;
    if (this.vy > MAXF) this.vy = MAXF;

    // Horizontal movement & Robust Wall/Floor Separation
    this.x += this.vx * dt;
    this.onWall = 0;

    for (const p of plats) {
      if (p.vanished) continue;

      if (this.x + this.w > p.x && this.x < p.x + p.w) {
        if (p.y < this.y + this.h - 14 && p.y + p.h > this.y + 10) {
          if (this.vy > 0 && Math.abs(this.y + this.h - p.y) < 20) {
            this.y = p.y - this.h;
            this.vy = 0;
            this.onGround = true;
            this.jumpsLeft = 2;
            Snd.mantle();
            burstDust(this.x + this.w / 2, this.y + this.h, 4, '#ffffff');
            break;
          }

          if (this.vx > 0) {
            this.x = p.x - this.w;
            if (!this.onGround) this.onWall = 1;
          } else if (this.vx < 0) {
            this.x = p.x + p.w;
            if (!this.onGround) this.onWall = -1;
          }
        } else if (this.onGround && Math.abs((this.y + this.h) - p.y) <= 14) {
          this.y = p.y - this.h;
        }
      }
    }

    // Wall slide friction
    if (this.onWall !== 0 && !this.onGround && this.vy > 120) {
      this.vy = 120;
      if (Math.random() < 0.25) {
        particles.push(new Particle({
          x: this.x + (this.onWall > 0 ? this.w : 0),
          y: this.y + this.h * 0.6,
          vx: -this.onWall * 25, vy: -15,
          color: '#ffffff', size: 3, life: 0.2
        }));
      }
    }

    // Torii Gates collision (closed gates are solid — even Ember Dash cannot phase through)
    for (const g of gates) {
      if (!g.open && this.x < g.x + g.w && this.x + this.w > g.x && this.y < g.y + g.h && this.y + this.h > g.y) {
        if (this.x + this.w / 2 < g.x + g.w / 2) this.x = g.x - this.w;
        else this.x = g.x + g.w;
        // Kill dash momentum against a shut gate so Ember Dash feels dodgeable/fair
        if (this.dashT > 0 || this.emberT > 0) { this.dashT = 0; this.vx = 0; }
        else if (this.vx > 0) this.vx = Math.min(this.vx, 0);
        else if (this.vx < 0) this.vx = Math.max(this.vx, 0);
      }
    }

    // Strictly Bounded Vertical Physics Step (Prevents infinite while-loops!)
    let remY = this.vy * dt;
    const wasOnGround = this.onGround;
    this.onGround = false;
    let stepCount = 0;

    while (Math.abs(remY) > 0.05 && stepCount < 25) {
      stepCount++;
      let step = remY;
      if (step > 8) step = 8; if (step < -8) step = -8;
      remY -= step; this.y += step;

      for (const p of plats) {
        if (p.vanished) continue;
        if (this.x < p.x + p.w && this.x + this.w > p.x && this.y < p.y + p.h && this.y + this.h > p.y) {
          if (step > 0) {
            this.y = p.y - this.h;
            this.vy = 0; remY = 0;
            this.onGround = true;
            this.onWall = 0;
            this.jumpsLeft = 2;
            if (!wasOnGround) Snd.land();

            if (p.type === 'crumble' && !p.shaking) {
              p.shaking = true; p.timer = 0.70;
            }
            if (p.type === 'ice' && !p.cracking) {
              p.cracking = true; p.timer = 0.90;
            }
          } else if (step < 0) {
            this.y = p.y + p.h;
            this.vy = 0; remY = 0;
          }
        }
      }
    }

    if (!this.onGround) {
      this.coyote -= dt;
    } else {
      this.coyote = 0.12;
      if (Math.abs(this.vx) > 10) this.runPhase += Math.abs(this.vx) * dt * 0.05;
    }

    // Parkour Bounce Lanterns
    for (const l of lanterns) {
      if (l.timer <= 0) {
        const dx = (this.x + this.w / 2) - l.x;
        const dy = (this.y + this.h / 2) - l.y;
        if (Math.hypot(dx, dy) < l.r + 24) {
          l.timer = 2.4;
          this.vy = -720;
          this.onGround = false;
          this.jumpsLeft = 2;
          this.dashCd = 0;
          Snd.bounce();
          shake = 6;
          burstShockwave(l.x, l.y, '#ff4444');
          floatTexts.push(new FloatText(l.x, l.y - 30, 'BOUNCE!', '#ffd76a'));
        }
      }
    }

    // Pressure Switches
    for (const sw of switches) {
      if (Math.abs(this.x + this.w / 2 - (sw.x + sw.w / 2)) < sw.w / 2 && Math.abs(this.y + this.h - sw.y) < 14) {
        if (!sw.pressed) {
          sw.pressed = true;
          Snd.switchHit();
          shake = 8;
          burstRing(sw.x + sw.w / 2, sw.y, '#ffd76a');
          floatTexts.push(new FloatText(sw.x + sw.w / 2, sw.y - 25, 'TORII GATE OPENED!', '#ffd76a'));
          for (const g of gates) {
            if (g.id === sw.gateId) g.open = true;
          }
        }
      }
    }

    // Wind Updraft Vents
    for (const v of vents) {
      if (Math.abs(this.x + this.w / 2 - (v.x + v.w / 2)) < v.w / 2 && Math.abs(this.y + this.h - v.y) < 20) {
        this.vy = v.force || -780;
        this.onGround = false;
        this.jumpsLeft = 1;
        Snd.ventLaunch();
        burstShockwave(v.x + v.w / 2, v.y, '#55e6c1');
        floatTexts.push(new FloatText(this.x, this.y - 30, 'WIND GALE!', '#55e6c1'));
      }
    }

    // Swinging Pendulum Blade Collision
    for (const pen of pendulums) {
      const bx = pen.x + Math.sin(pen.angle) * pen.len;
      const by = pen.y + Math.cos(pen.angle) * pen.len;
      if (Math.hypot((this.x + this.w / 2) - bx, (this.y + this.h / 2) - by) < pen.r + 14) {
        this.takeDamage();
        this.vx = (pen.angle > 0 ? 300 : -300);
      }
    }

    // Flame Jet Collision
    for (const fj of flameJets) {
      if (fj.firing) {
        if (Math.abs(this.x + this.w / 2 - fj.x) < 32 && this.y + this.h > fj.y - 85 && this.y < fj.y) {
          this.takeDamage();
        }
      }
    }

    // Shove Rival
    if (rival) {
      const dx = (this.x + this.w / 2) - (rival.x + rival.w / 2);
      const dy = (this.y + this.h / 2) - (rival.y + rival.h / 2);
      if (Math.abs(dx) < 28 && Math.abs(dy) < 38) {
        if (this.dashT > 0 && rival.dashT <= 0) {
          rival.vx = this.facing * 380;
          rival.vy = -220;
          this.shoves++;
          this.ki = Math.min(100, this.ki + 20);
          rival.ki = Math.max(0, rival.ki - 15);
          Snd.shove();
          shake = 10;
          floatTexts.push(new FloatText(rival.x, rival.y - 30, 'SHOVED!', '#ff5533'));
          burstDust((this.x + rival.x) / 2, (this.y + rival.y) / 2, 8, '#ffffff');
        }
      }
    }

    // Abyss Pit Fall
    if (this.y > G + 100) {
      this.takeDamage();
    }

    // Finish Torii Gate Victory! Immediately opens victory menu!
    // Tower mode: proximity check (horizontal overlap + vertical closeness).
    // Race maps: classic X-threshold check.
    const wonTower = isTowerMap() &&
      (this.x + this.w >= finishGate.x - 10 && this.x <= finishGate.x + finishGate.w + 10 &&
       Math.abs((this.y + this.h / 2) - (finishGate.y + finishGate.h / 2)) < 130);
    const wonRace = !isTowerMap() &&
      (this.x + this.w >= finishGate.x && Math.abs(this.y - finishGate.y) < 140);
    if ((wonTower || wonRace) && !this.won && state === 'play') {
      this.won = true;
      floatTexts.push(new FloatText(finishGate.x + 35, finishGate.y - 40, 'VICTORY!', '#ffd76a'));
      burstShockwave(finishGate.x + 35, finishGate.y + 20, '#ffd76a');
      finishRound(this, this.name + (isTowerMap() ? ' conquered the Ronin Tower!' : ' conquered the Cursed Maze!'));
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y + this.h);
    ctx.scale(this.facing, 1);

    if (this.invulnT > 0 && Math.floor(tGlobal * 16) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    if (this.emberT > 0) {
      ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 16;
    }
    if (this.cursedT > 0) {
      ctx.fillStyle = 'rgba(150,0,255,0.4)';
      ctx.fillRect(-this.w / 2 - 4, -this.h - 4, this.w + 8, this.h + 8);
    }
    if (this.heavyT > 0) {
      ctx.fillStyle = 'rgba(80,80,80,0.5)';
      ctx.fillRect(-this.w / 2 - 4, -this.h - 4, this.w + 8, this.h + 8);
    }

    // Scarf
    ctx.strokeStyle = this.color; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, -40);
    let sx = -4, sy = -40;
    for (let i = 1; i <= 5; i++) {
      sx -= 6 + i; sy += Math.sin(tGlobal * 10 + i + (this.id * 2)) * 2;
      ctx.lineTo(sx, sy);
    }
    ctx.stroke();

    // Body silhouette
    ctx.fillStyle = '#0a0305';
    ctx.beginPath();
    ctx.moveTo(-10, -44); ctx.lineTo(10, -44);
    ctx.lineTo(12, -18); ctx.lineTo(-12, -18);
    ctx.closePath(); ctx.fill();

    // Belt
    ctx.fillStyle = this.accent;
    ctx.fillRect(-11, -30, 22, 5);

    // Legs animation
    ctx.strokeStyle = '#0a0305'; ctx.lineWidth = 6;
    const hipY = -18;
    if (this.frozenT > 0) {
      ctx.beginPath(); ctx.moveTo(-5, hipY); ctx.lineTo(-5, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5, hipY); ctx.lineTo(5, 0); ctx.stroke();
    } else if (this.onWall !== 0 && !this.onGround) {
      ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(-8, -4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(8, -10); ctx.stroke();
    } else if (this.onGround && Math.abs(this.vx) > 10) {
      const a = Math.sin(this.runPhase) * 0.8;
      ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(Math.sin(a) * 14, hipY + Math.cos(a) * 18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(-Math.sin(a) * 14, hipY - Math.cos(a) * 18 + 18); ctx.stroke();
    } else if (!this.onGround) {
      ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(10, -2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(-8, -6); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-5, hipY); ctx.lineTo(-5, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5, hipY); ctx.lineTo(5, 0); ctx.stroke();
    }

    // Head & Hat
    ctx.fillStyle = '#0a0305';
    ctx.beginPath(); ctx.arc(0, -50, 7.5, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-22, -54); ctx.quadraticCurveTo(0, -74, 22, -54);
    ctx.quadraticCurveTo(0, -60, -22, -54);
    ctx.closePath(); ctx.fill();

    // Eyes
    ctx.fillStyle = this.accent;
    ctx.shadowColor = this.accent; ctx.shadowBlur = 8;
    ctx.fillRect(2, -52, 5, 2.2);

    // Ice block visual with countdown
    if (this.frozenT > 0) {
      ctx.fillStyle = 'rgba(0, 220, 255, 0.45)';
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      rrect(-this.w / 2 - 8, -this.h - 8, this.w + 16, this.h + 12, 6);
      ctx.fill(); ctx.stroke();
    }

    // Thunder Stun visual
    if (this.stunT > 0) {
      ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const sx = (Math.random() * 40 - 20), sy = -this.h + Math.random() * this.h;
        ctx.moveTo(sx, sy); ctx.lineTo(sx + (Math.random() * 20 - 10), sy + 15);
      }
      ctx.stroke();
    }

    ctx.restore();

    // Clear Tactical Stun / Freeze Timer overhead badge
    if (this.frozenT > 0) {
      ctx.fillStyle = '#00e5ff'; ctx.font = '600 12px ' + FD; ctx.textAlign = 'center';
      ctx.fillText('❄ FROZEN ' + this.frozenT.toFixed(1) + 's', this.x + this.w / 2, this.y - 28);
    } else if (this.stunT > 0) {
      ctx.fillStyle = '#ffd76a'; ctx.font = '600 12px ' + FD; ctx.textAlign = 'center';
      ctx.fillText('⚡ STUNNED ' + this.stunT.toFixed(1) + 's', this.x + this.w / 2, this.y - 28);
    } else if (this.ki >= 100 && state === 'play') {
      ctx.save();
      const pulse = 0.85 + 0.15 * Math.sin(tGlobal * 10);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ffd76a';
      ctx.font = '600 12px ' + FD;
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 3;
      ctx.fillText(this.id === 1 ? '[E / S] READY!' : '[ENTER / ↓] READY!', this.x + this.w / 2, this.y - 18);
      ctx.restore();
    }

    // High-Visibility PARRY_WINDOW Protect / Defend Alert with shrinking ring + countdown
    if (this.incomingSabotage && this.incomingSabotage.timer > 0) {
      const alpha = 0.7 + 0.3 * Math.sin(tGlobal * 24);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ff2222';
      ctx.font = '700 18px ' + FD;
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,0,0,0.8)'; ctx.shadowBlur = 6;
      ctx.fillText('🛡 DEFEND! (' + (this.id === 1 ? 'S to defend' : 'Enter/↓ to defend') + ') ' + this.incomingSabotage.timer.toFixed(2) + 's', this.x + this.w / 2, this.y - 24);

      const prog = clamp(this.incomingSabotage.timer / PARRY_WINDOW, 0, 1);
      ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(this.x + this.w / 2, this.y + this.h / 2, 24 + 16 * prog, -Math.PI / 2, -Math.PI / 2 + prog * TAU);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(this.x + this.w / 2, this.y + this.h / 2, 40, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }
}

const p1 = new Player(1, 'CRIMSON', '#e74c3c', '#ffd76a');
const p2 = new Player(2, 'AZURE', '#00d2d3', '#54a0ff');

/* ---------- 10 Sabotage Effects Logic ---------- */
function applySabotageEffect(victim, card, caster) {
  shake = 12;
  switch (card.id) {
    case 'swap': {
      const tx = victim.x, ty = victim.y;
      victim.x = caster.x; victim.y = caster.y;
      caster.x = tx; caster.y = ty;
      Snd.cardCast();
      burstRing(victim.x + victim.w / 2, victim.y + victim.h / 2, '#ff00ff');
      burstRing(caster.x + caster.w / 2, caster.y + caster.h / 2, '#ff00ff');
      floatTexts.push(new FloatText(victim.x, victim.y - 30, '⚡ SHADOW SWAP!', '#ff00ff'));
      floatTexts.push(new FloatText(caster.x, caster.y - 30, '⚡ SHADOW SWAP!', '#ff00ff'));
      break;
    }
    case 'trapsetter': {
      for (const p of plats) {
        if (victim.x + victim.w > p.x && victim.x < p.x + p.w && Math.abs(victim.y + victim.h - p.y) < 24) {
          p.vanished = true; p.timer = 2.8;
          burstDust(victim.x + victim.w / 2, victim.y + victim.h, 12, '#ff4444');
          floatTexts.push(new FloatText(victim.x, victim.y - 30, 'TRAP DOOR OPENED!', '#ff4444'));
          setTimeout(() => { p.vanished = false; }, 3000);
          break;
        }
      }
      break;
    }
    case 'gale': {
      victim.vx = -520; victim.vy = -200;
      Snd.dash();
      floatTexts.push(new FloatText(victim.x, victim.y - 30, '🌪 GALE BLAST!', '#55e6c1'));
      for (let i = 0; i < 8; i++) {
        particles.push(new Particle({
          x: victim.x + Math.random() * 40, y: victim.y + Math.random() * 40,
          vx: -250 - Math.random() * 150, vy: Math.random() * 50 - 25,
          color: '#55e6c1', size: 5, life: 0.4
        }));
      }
      break;
    }
    case 'curse': {
      victim.cursedT = 2.2;
      floatTexts.push(new FloatText(victim.x, victim.y - 30, 'MIND CURSED! (INVERTED)', '#9b59b6'));
      break;
    }
    case 'smoke': {
      victim.smokeT = 3.0;
      Snd.dash();
      floatTexts.push(new FloatText(victim.x, victim.y - 30, '💨 SMOKE BLINDNESS!', '#555555'));
      for (let i = 0; i < 16; i++) {
        particles.push(new Particle({
          x: victim.x + Math.random() * 50 - 25, y: victim.y + Math.random() * 50 - 25,
          vx: Math.random() * 60 - 30, vy: Math.random() * -60 - 20,
          color: '#1a1a1a', size: 16, life: 1.0, type: 'circle'
        }));
      }
      break;
    }
    case 'thunder': {
      victim.stunT = 0.65; // Quick snappy stun
      Snd.thunder();
      shake = 16; flash = 0.7;
      burstShockwave(victim.x + victim.w / 2, victim.y + victim.h / 2, '#ffd76a');
      floatTexts.push(new FloatText(victim.x, victim.y - 30, '⚡ THUNDER STUNNED!', '#ffd76a'));
      break;
    }
    case 'freeze': {
      victim.frozenT = 0.65; // Quick snappy freeze
      Snd.freeze();
      shake = 10;
      burstShockwave(victim.x + victim.w / 2, victim.y + victim.h / 2, '#00e5ff');
      floatTexts.push(new FloatText(victim.x, victim.y - 30, '❄ FROST FROZEN!', '#00e5ff'));
      break;
    }
    case 'stone': {
      victim.heavyT = 3.0;
      Snd.land();
      floatTexts.push(new FloatText(victim.x, victim.y - 30, '🪨 HEAVY STONE CURSE!', '#888888'));
      break;
    }
    case 'lock': {
      // Never target a gate whose pressure switch is already consumed (pressed=true):
      // that gate can never be reopened by gameplay, so locking it soft-locks a right-only racer.
      let best = null;
      for (const g of gates) {
        if (g.x <= victim.x || g.x >= victim.x + 350) continue;
        if (g.open) continue; // already closed — nothing to do
        const sw = switches.find(s => s.gateId === g.id);
        if (sw && sw.pressed) continue; // consumed switch: skip, locking is a soft-lock
        if (!best || g.x < best.x) best = g;
      }
      if (best) {
        best.open = false;
        best.lockT = 4.0; // timed auto-reopen safety (never permanently shut)
        Snd.switchHit();
        burstDust(best.x + best.w / 2, best.y + best.h / 2, 10, '#b82e2e');
        floatTexts.push(new FloatText(best.x, best.y - 20, '⛩ TORII GATE LOCKED! (4s)', '#ff2222'));
      } else {
        floatTexts.push(new FloatText(victim.x, victim.y - 30, '⛩ LOCK FIZZLES (NO FAIR TARGET)', '#aaaaaa'));
      }
      break;
    }
  }
}

/* ---------- Disciplined & Athletic Oni AI Bot ---------- */
function updateAI(bot, human, dt) {
  const res = { left: false, right: true };
  if (bot.stunT > 0 || bot.frozenT > 0) return { left: false, right: false };

  // 0. Minimal backtrack: if blocked by a closed gate ahead, or stuck >0.5s,
  // move LEFT toward the nearest unpressed switch instead of pushing right.
  const tower = isTowerMap();
  let closedGateAhead = null;
  for (const g of gates) {
    if (g.open) continue;
    if (tower) {
      if (Math.abs(bot.x - g.x) < 120 && Math.abs((bot.y + bot.h) - (g.y + g.h)) < 160) {
        if (!closedGateAhead || Math.abs(g.x - bot.x) < Math.abs(closedGateAhead.x - bot.x)) closedGateAhead = g;
      }
    } else if (g.x > bot.x - 20 && g.x < bot.x + 110 &&
      bot.y + bot.h > g.y && bot.y < g.y + g.h) {
      closedGateAhead = g; break;
    }
  }
  if (Math.abs(bot.x - bot.aiStuckX) < 6) bot.aiStuckT += dt;
  else { bot.aiStuckX = bot.x; bot.aiStuckT = 0; }
  if (closedGateAhead || bot.aiStuckT > 0.5) {
    let targetSw = null;
    for (const sw of switches) {
      if (sw.pressed) continue;
      if (!targetSw || Math.abs(sw.x - bot.x) < Math.abs(targetSw.x - bot.x)) targetSw = sw;
    }
    if (targetSw) {
      bot.aiBacktrackT = 1.2;
      floatTexts.push(new FloatText(bot.x, bot.y - 40, '👹 BACKTRACK!', '#00d2d3'));
    }
    bot.aiStuckT = 0;
    bot.aiStuckX = bot.x;
  }
  if (bot.aiBacktrackT > 0) {
    bot.aiBacktrackT -= dt;
    let targetSw = null;
    for (const sw of switches) {
      if (sw.pressed) continue;
      if (!targetSw || Math.abs(sw.x - bot.x) < Math.abs(targetSw.x - bot.x)) targetSw = sw;
    }
    if (!targetSw) { bot.aiBacktrackT = 0; }
    else {
      const wantLeft = (targetSw.x + targetSw.w / 2) < (bot.x + bot.w / 2);
      const out = { left: wantLeft, right: !wantLeft };
      if (bot.onWall !== 0 && !bot.onGround && bot.wallJumpCd <= 0) bot.requestJump();
      else if (bot.onGround && Math.abs(targetSw.x - bot.x) > 30 && Math.abs(bot.vx) < 25) bot.requestJump();
      return out;
    }
  }

  // 0b. Tower climb steering (minimal addition): head toward the nearest
  // platform above (or the sky gate when near the top), jumping to gain height.
  if (tower && bot.aiBacktrackT <= 0) {
    const botCx = bot.x + bot.w / 2;
    let target = null;
    let bestScore = Infinity;
    for (const p of plats) {
      if (p.vanished) continue;
      const pcx = p.x + p.w / 2;
      const dy = (bot.y + bot.h) - p.y; // >0 means platform is above
      if (dy < -40 || dy > 420) continue;
      const score = dy + Math.abs(pcx - botCx) * 0.6;
      if (score < bestScore) { bestScore = score; target = p; }
    }
    const nearTop = bot.y < finishGate.y + 260;
    const goalX = nearTop ? (finishGate.x + finishGate.w / 2) : (target ? target.x + target.w / 2 : botCx);
    const wantLeft = goalX < botCx - 12;
    const wantRight = goalX > botCx + 12;
    if (wantLeft || wantRight) {
      if (bot.onWall !== 0 && !bot.onGround && bot.wallJumpCd <= 0) bot.requestJump();
      else if (bot.onGround && (target ? (target.y < bot.y + bot.h - 30) : nearTop)) bot.requestJump();
      else if (!bot.onGround && bot.vy > 60 && bot.jumpsLeft > 0 && (target ? (bot.y + bot.h > target.y + 10) : false)) bot.requestJump();
      return { left: wantLeft, right: wantRight };
    }
    if (bot.onGround && target && target.y < bot.y + bot.h - 30) bot.requestJump();
  }
  // 1. Obstacle Vision: Look ahead for real walls & height differences
  let obstacleAhead = false;
  let targetPlat = null;

  for (const p of plats) {
    if (p.vanished) continue;

    if (p.x > bot.x + 10 && p.x < bot.x + 85) {
      if (bot.y + bot.h > p.y + 16 && bot.y < p.y + p.h) {
        obstacleAhead = true;
      }
    }

    if (p.x + p.w > bot.x + 20 && p.x < bot.x + 220) {
      if (Math.abs((bot.y + bot.h) - p.y) < 130) {
        if (!targetPlat || p.x < targetPlat.x) targetPlat = p;
      }
    }
  }

  // 2. Jump over obstacles on ground
  if (obstacleAhead && bot.onGround) {
    bot.requestJump();
  }

  // 3. Disciplined Wall Jump (Only when cooldown has expired!)
  if (bot.onWall !== 0 && !bot.onGround && bot.wallJumpCd <= 0) {
    bot.requestJump();
  }

  // 4. Target Bounce Lanterns
  for (const l of lanterns) {
    if (l.timer <= 0 && l.x > bot.x && l.x < bot.x + 120 && Math.abs(bot.y - l.y) < 90) {
      if (bot.onGround) bot.requestJump();
    }
  }

  // 5. Gap / Step Jump
  if (!obstacleAhead && bot.onGround) {
    if (targetPlat && targetPlat.y < bot.y + bot.h - 45) {
      bot.requestJump();
    }
  }

  // 6. Emergency Pit Recovery
  if (!bot.onGround && bot.vy > 80 && bot.y > G - 90) {
    if (bot.jumpsLeft > 0) bot.requestJump();
    if (bot.dashCd <= 0) bot.tryDash(1);
  }

  // 7. Unstuck Reflex
  if (bot.onGround && Math.abs(bot.vx) < 25) {
    bot.stuckTime += dt;
    if (bot.stuckTime > 0.25) {
      bot.requestJump();
      if (bot.dashCd <= 0) bot.tryDash(1);
      bot.stuckTime = 0;
    }
  } else {
    bot.stuckTime = 0;
  }

  // 8. Responsive Parry / Protect Reflex
  if (bot.incomingSabotage && bot.incomingSabotage.timer > 0) {
    if (bot.aiParryTimer < 0) {
      const parrySuccess = Math.random() < 0.78;
      bot.aiParryTimer = parrySuccess ? 0.24 : 999;
    }

    bot.aiParryTimer -= dt;
    if (bot.aiParryTimer <= 0 && bot.aiParryTimer > -10) {
      bot.aiParryTimer = -99;
      bot.tryUseCard(human);
    }
  } else {
    bot.aiParryTimer = -1;
  }

  // 9. Aggressive Sabotages
  if (bot.ki >= 100) {
    bot.tryUseCard(human);
  }

  // 10. Shove rival if close
  if (Math.abs(bot.x - human.x) < 60 && bot.dashCd <= 0 && Math.random() < 0.10) {
    bot.tryDash(human.x > bot.x ? 1 : -1);
  }

  return res;
}

/* ---------- Cursed Temple Maze Generator ---------- */
function buildTowerMap() {
  // MAIN MODE: vertical tower climb. Camera follows Y; fog rises from below.
  plats = []; spikes = []; traps = []; orbs = [];
  switches = []; gates = []; vents = []; lanterns = [];
  pendulums = []; flameJets = [];
  mapBanners = []; particles = []; floatTexts = [];

  const baseY = G;
  const topY = G - 2600;
  plats.push({ x: 0, y: baseY, w: 1600, h: 120, type: 'normal' });
  mapBanners.push({ x: 300, y: baseY - 100, title: '🗼 RONIN TOWER ASCENT', sub: 'Climb UP! Fog rises from below — reach the sky gate!' });
  mapBanners.push({ x: 800, y: baseY - 100, title: '⚔ E = ATTACK  •  🛡 S = DEFEND', sub: 'Defend inside 0.45s or suffer the card! Whiff = -15 Ki' });
  lanterns.push({ x: 700, y: baseY - 60, r: 16, timer: 0 });

  let gateIdCounter = 0;
  let side = 1;
  // Layered zig-zag platforms going UP
  for (let y = baseY - 180; y > topY + 200; y -= 165) {
    const w = randInt(230, 330);
    const x = clamp(800 + side * randInt(180, 480) - w / 2, 60, 1600 - w - 60);
    plats.push({ x, y, w, h: 24, type: 'normal', shaking: false, timer: 0, vanished: false, cracking: false });
    orbs.push({ x: x + w / 2, y: y - 40, taken: false });
    if (Math.random() < 0.5) {
      lanterns.push({ x: x + w / 2 + randInt(-70, 70), y: y - randInt(70, 110), r: 16, timer: 0 });
    }
    if (Math.random() < 0.35) {
      pendulums.push({ x: x + w / 2, y: y - 190, len: 130, angle: 0, speed: randInt(2, 4) * 0.8, r: 16 });
    }
    if (Math.random() < 0.30) {
      flameJets.push({ x: x + randInt(30, Math.max(40, w - 30)), y, timer: Math.random() * 3.5, firing: false });
    }
    if (Math.random() < 0.30) {
      vents.push({ x: x + w / 2 - 25, y: y + 60, w: 50, h: 12, force: -780 });
    }
    // Occasional gate + switch pair guarding the climb (switch below its gate, never consumed-first)
    if (Math.random() < 0.35 && y < baseY - 400) {
      gateIdCounter++;
      const gX = clamp(x + w / 2 - 9, 60, 1600 - 80);
      gates.push({ id: gateIdCounter, x: gX, y: y - 170, w: 18, h: 110, open: false, lockT: 0 });
      switches.push({ gateId: gateIdCounter, x: clamp(x + w / 2 - 17, 60, 1600 - 100), y: y - 10, w: 34, h: 10, pressed: false });
    }
    side = -side;
  }

  // Finish sky gate at the TOP
  finishGate.x = 800 - 35;
  finishGate.y = topY;
  finishGate.w = 70; finishGate.h = 120;
  plats.push({ x: 800 - 220, y: topY + 120, w: 440, h: 26, type: 'normal' });

  fogX = -350;
  fogSpeed = 38;
  fogY = baseY + 160; // rising fog starts below the tower base
  fogRiseSpeed = 34;
}

function buildMap(mapIndex) {
  const mapData = MAPS[mapIndex];
  if (mapData.tower) { buildTowerMap(); return; }
  const length = mapData.w;

  plats = []; spikes = []; traps = []; orbs = [];
  switches = []; gates = []; vents = []; lanterns = [];
  pendulums = []; flameJets = [];
  mapBanners = []; particles = []; floatTexts = [];

  // Starting Fortress Courtyard
  plats.push({ x: 0, y: G, w: 450, h: 120, type: 'normal' });

  // In-World Floating Tutorial Banners
  mapBanners.push({
    x: 240, y: G - 100, title: '⚔ ATTACK WITH [E]',
    sub: 'Press [E] at 100% KI to sabotage your rival!'
  });
  mapBanners.push({
    x: 620, y: G - 170, title: '🛡 DEFEND WITH [S] (0.45s)',
    sub: 'When attacked, tap [S] to reflect! Whiff = -15 Ki'
  });
  mapBanners.push({
    x: 1050, y: G - 200, title: '🧗 MULTI-TIER MAZE',
    sub: 'Dodge traps and reach the Torii Gate to claim victory!'
  });

  let curX = 450;
  let gateIdCounter = 0;

  while (curX < length - 440) {
    const sectionW = randInt(480, 700);

    // Tier 1: Lower Dungeon Crypts (Floor corridor)
    plats.push({
      x: curX, y: G, w: sectionW - 40, h: 120, type: 'normal'
    });

    // Floor Spikes in lower corridor
    if (Math.random() < 0.35) {
      spikes.push({ x: curX + randInt(90, sectionW - 140), y: G - 18, w: 40, h: 20 });
    }

    // Tier 2: Middle Corridor (Main Maze Hallway)
    const midY = G - 140;
    const midW = randInt(280, 380);
    let pType = 'normal';
    if (Math.random() < 0.25) {
      if (mapData.theme === 'fortress') pType = 'crumble';
      else if (mapData.theme === 'sky') pType = 'vanishing';
      else if (mapData.theme === 'ice') pType = 'ice';
      else if (mapData.theme === 'forge') pType = 'forge_geyser';
    }

    plats.push({
      x: curX + 40, y: midY, w: midW, h: 26, type: pType,
      shaking: false, timer: 0, vanished: false, cracking: false
    });

    // Tier 3: Upper Rafters (High Parkour Shortcut with Ki Orbs)
    const upperY = G - 280;
    const upperW = randInt(220, 340);
    plats.push({
      x: curX + 100, y: upperY, w: upperW, h: 22, type: 'normal'
    });
    orbs.push({ x: curX + 150, y: upperY - 40, taken: false });
    orbs.push({ x: curX + 220, y: upperY - 40, taken: false });

    // Dynamic Trap: Swinging Pendulum Blade
    if (Math.random() < 0.45) {
      pendulums.push({
        x: curX + sectionW * 0.4, y: G - 320,
        len: 170, angle: 0, speed: randInt(2, 4) * 0.8, r: 18
      });
    }

    // Dynamic Trap: Flame Geyser
    if (Math.random() < 0.40) {
      flameJets.push({
        x: curX + sectionW * 0.7, y: G,
        timer: Math.random() * 3.5, firing: false
      });
    }

    // Bounce Lantern for Parkour
    lanterns.push({
      x: curX + sectionW / 2, y: G - randInt(110, 190), r: 16, timer: 0
    });

    // Chimney Shaft with Updraft Vent
    if (Math.random() < 0.40) {
      const shaftX = curX + sectionW - 140;
      plats.push({ x: shaftX, y: G - 300, w: 26, h: 180, type: 'normal' });
      plats.push({ x: shaftX + 80, y: G - 300, w: 26, h: 300, type: 'normal' });
      vents.push({ x: shaftX + 15, y: G - 10, w: 50, h: 12, force: -760 });
      orbs.push({ x: shaftX + 40, y: G - 330, taken: false });
    }

    // Interactive Sliding Torii Gate & Pressure Switch
    if (Math.random() < 0.40) {
      gateIdCounter++;
      const gX = curX + sectionW - 80;
      gates.push({
        id: gateIdCounter, x: gX, y: G - 160, w: 18, h: 160, open: false, lockT: 0
      });
      switches.push({
        gateId: gateIdCounter, x: curX + randInt(70, 200), y: G - 10, w: 34, h: 10, pressed: false
      });
    }

    curX += sectionW + randInt(50, 90);
  }

  // Finish Sanctuary Gate
  finishGate.x = length - 220;
  finishGate.y = G - 120;
  plats.push({ x: length - 420, y: G, w: 450, h: 120, type: 'normal' });

  fogX = -350;
  fogSpeed = 38;
  fogY = G + 200;
  fogRiseSpeed = 30;
}

/* ---------- Game Flow (Dedicated Victory Menu) ---------- */
function startRound(mapIdx) {
  curMapIndex = mapIdx;
  buildMap(curMapIndex);

  // Instantly reset camera and players to start of track!
  camX = 0; camY = 0;
  paused = false; restartArmed = false; restartArmedT = 0;
  if (isTowerMap()) {
    camY = Math.min(0, (G - 2600) - H * 0.25);
    p1.reset(700, G - p1.h);
    p2.reset(820, G - p2.h);
  } else {
    p1.reset(100, G - p1.h);
    p2.reset(160, G - p2.h);
  }

  // Clear all key presses
  keys.w = keys.a = keys.s = keys.d = keys.e = false;
  keys.up = keys.down = keys.left = keys.right = keys.enter = false;

  roundTime = 0;
  roundWinner = null;
  roundWinReason = '';
  blackoutT = 0;

  state = 'play';
  CG.gameplayStart();
}

function finishRound(winner, reason) {
  state = 'roundover';
  CG.gameplayStop();
  roundWinner = winner || (p1.x > p2.x ? p1 : p2);
  roundWinReason = reason || (roundWinner ? roundWinner.name + ' conquered the Cursed Maze!' : 'Course Completed!');

  if (roundWinner) {
    if (roundWinner.id === 1) p1RoundsWon++;
    else p2RoundsWon++;
    Snd.win();
    CG.happytime();
  }
}

function advanceToNextRound() {
  const nextMap = (curMapIndex + 1) % MAPS.length;
  CG.requestMidgame(() => startRound(nextMap));
}

/* ---------- Update Physics (Fixed 60fps) ---------- */
function update(dt) {
  tGlobal += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);

  // Sakura petals keep updating ALWAYS so screen is NEVER frozen!
  for (const s of sakuraPetals) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.rot += s.vrot * dt;
    if (s.x > W + 60) s.x = -40;
    if (s.y > H + 40) s.y = -20;
  }

  // Update particles and floating texts even on victory menu
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    floatTexts[i].update(dt);
    if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
  }

  // When roundover: menu is open, waiting for player input!
  if (state === 'roundover' || state === 'title' || state === 'howtoplay') return;
  // Esc pause overlay halts update/fog/sabotage clocks
  if (paused) return;

  if (restartArmed) {
    restartArmedT -= dt;
    if (restartArmedT <= 0) { restartArmed = false; }
  }

  roundTime += dt;

  // Timed Torii Lock auto-reopen safety (never stays shut)
  for (const g of gates) {
    if (g.lockT > 0) {
      g.lockT -= dt;
      if (g.lockT <= 0) {
        g.open = true; g.lockT = 0;
        burstRing(g.x + g.w / 2, g.y + g.h / 2, '#ffd76a');
        floatTexts.push(new FloatText(g.x, g.y - 20, '⛩ GATE AUTO-REOPENED', '#ffd76a'));
      }
    }
  }

  const tower = isTowerMap();
  let distToTrailer = Infinity;
  if (tower) {
    // Tower mode: fog RISES from below instead of side-chase
    const activeTop = Math.min(p1.y, p2.y);
    const distAbove = fogY - activeTop;
    fogRiseSpeed = distAbove > 700 ? 52 : (distAbove < 260 ? 20 : 34);
    fogY -= fogRiseSpeed * dt;
    if (p1.y + p1.h > fogY) p1.takeDamage();
    if (p2.y + p2.h > fogY) p2.takeDamage();
  } else {
    // Smooth Fog Speed: fair, constant, gentle (never halts the game!)
    const activeX = Math.min(p1.x, p2.x);
    distToTrailer = activeX - fogX;
    if (distToTrailer > 700) {
      fogSpeed = 65;
    } else if (distToTrailer < 220) {
      fogSpeed = 26; // Very slow when close to players
    } else {
      fogSpeed = 38;
    }

    fogX += fogSpeed * dt;

    // Safe respawn on fog hit
    if (p1.x < fogX + 20) p1.takeDamage();
    if (p2.x < fogX + 20) p2.takeDamage();
  }

  // Pendulum Blades update
  for (const pen of pendulums) {
    pen.angle = Math.sin(tGlobal * pen.speed) * 0.9;
  }

  // Flame Jets update
  for (const fj of flameJets) {
    fj.timer = (fj.timer + dt) % 3.5;
    fj.firing = (fj.timer > 2.0 && fj.timer < 3.2);
    if (fj.firing && Math.random() < 0.3) {
      particles.push(new Particle({
        x: fj.x + (Math.random() * 24 - 12), y: fj.y - Math.random() * 80,
        vx: Math.random() * 20 - 10, vy: -200, color: '#ff5500', size: 8, life: 0.25
      }));
    }
  }

  const curMap = MAPS[curMapIndex];
  if (curMap.theme === 'shadow') {
    blackoutT += dt;
    if (blackoutT > 5.5) blackoutT = 0;
  }

  for (const l of lanterns) {
    if (l.timer > 0) l.timer -= dt;
  }

  for (const p of plats) {
    if (p.type === 'crumble' && p.shaking) {
      p.timer -= dt;
      if (p.timer <= 0) {
        p.vanished = true; p.shaking = false;
        Snd.land();
        burstDust(p.x + p.w / 2, p.y, 14, '#b82e2e');
        setTimeout(() => { p.vanished = false; }, 2800);
      }
    }

    if (p.type === 'vanishing') {
      p.timer = (p.timer || 0) + dt;
      const cycle = p.timer % 4.5;
      p.shaking = (cycle > 3.0 && cycle < 3.8);
      p.vanished = (cycle >= 3.8);
    }

    if (p.type === 'ice' && p.cracking) {
      p.timer -= dt;
      if (p.timer <= 0) {
        p.vanished = true; p.cracking = false;
        Snd.land();
        burstDust(p.x + p.w / 2, p.y, 14, '#00bcd4');
        setTimeout(() => { p.vanished = false; }, 3000);
      }
    }

    if (p.type === 'forge_geyser') {
      p.timer = (p.timer || 0) + dt;
      const cycle = p.timer % 3.5;
      if (cycle > 2.7 && cycle < 3.3) {
        const fx = p.x + p.w / 2;
        if (Math.random() < 0.3) {
          particles.push(new Particle({
            x: fx + (Math.random() * 40 - 20), y: p.y - Math.random() * 120,
            vx: Math.random() * 20 - 10, vy: -200, color: '#ff5500', size: 8, life: 0.25
          }));
        }
        if (Math.abs(p1.x + p1.w / 2 - fx) < 28 && p1.y + p1.h > p.y - 120) p1.takeDamage();
        if (Math.abs(p2.x + p2.w / 2 - fx) < 28 && p2.y + p2.h > p.y - 120) p2.takeDamage();
      }
    }
  }

  for (const s of spikes) {
    if (Math.abs(p1.x + p1.w / 2 - (s.x + s.w / 2)) < s.w / 2 + 6 && Math.abs(p1.y + p1.h - s.y) < 16) {
      p1.takeDamage();
    }
    if (Math.abs(p2.x + p2.w / 2 - (s.x + s.w / 2)) < s.w / 2 + 6 && Math.abs(p2.y + p2.h - s.y) < 16) {
      p2.takeDamage();
    }
  }

  for (const o of orbs) {
    if (o.taken) continue;
    if (Math.hypot(p1.x + p1.w / 2 - o.x, p1.y + p1.h / 2 - o.y) < 32) {
      o.taken = true; p1.ki = Math.min(100, p1.ki + 30);
      Snd.ki();
      burstRing(o.x, o.y, p1.accent);
      floatTexts.push(new FloatText(o.x, o.y - 20, '+30 KI', p1.accent));
      if (p1.ki >= 100) Snd.cardReady();
    }
    if (Math.hypot(p2.x + p2.w / 2 - o.x, p2.y + p2.h / 2 - o.y) < 32) {
      o.taken = true; p2.ki = Math.min(100, p2.ki + 30);
      Snd.ki();
      burstRing(o.x, o.y, p2.accent);
      floatTexts.push(new FloatText(o.x, o.y - 20, '+30 KI', p2.accent));
      if (p2.ki >= 100) Snd.cardReady();
    }
  }

  p1.update(dt, p2);
  p2.update(dt, p1);

  // Smooth Camera Tracking (X for race maps, X+Y for tower climb)
  const raceMidX = (p1.x + p2.x) / 2;
  const maxCamX = Math.max(0, MAPS[curMapIndex].w - W);
  const targetCamX = clamp(raceMidX - W * 0.40, 0, maxCamX);
  camX += (targetCamX - camX) * Math.min(1, dt * 6);
  if (isTowerMap()) {
    const raceMidY = (p1.y + p2.y) / 2;
    const targetCamY = Math.min(0, raceMidY - H * 0.45);
    camY += (targetCamY - camY) * Math.min(1, dt * 6);
  } else {
    camY += (0 - camY) * Math.min(1, dt * 6);
  }

  const fogNear = tower ? ((fogY - Math.min(p1.y, p2.y)) < 320) : (distToTrailer < 300);
  Snd.tickMusic(dt, fogNear);
}

/* ---------- Drawing Systems ---------- */
function draw() {
  ctx.save();

  if (settings.shake && shake > 0) {
    const sx = (Math.random() * 2 - 1) * shake;
    const sy = (Math.random() * 2 - 1) * shake;
    ctx.translate(sx, sy);
  }

  if (state === 'title') {
    drawTitleScreen();
  } else if (state === 'howtoplay') {
    drawHowToPlay();
  } else if (state === 'play' || state === 'roundover') {
    drawGameWorld();
    drawHUD();
    drawPermanentControlBar();

    // Open dedicated Interactive Results & Retry Menu on finish!
    if (state === 'roundover') drawRoundOverScreen();
    if (paused && state === 'play') drawPauseOverlay();
  }

  drawSakuraPetals();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.45) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

function drawGameWorld() {
  const mapData = MAPS[curMapIndex];
  const theme = THEMES[mapData.theme];

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, theme.skyTop);
  grad.addColorStop(1, theme.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Blood Moon
  ctx.save();
  ctx.fillStyle = theme.accent;
  ctx.globalAlpha = 0.22;
  ctx.beginPath();
  ctx.arc(W * 0.7 - camX * 0.04, H * 0.35, 140, 0, TAU);
  ctx.fill();
  ctx.restore();

  // Distant Pagoda Silhouette
  ctx.save();
  ctx.fillStyle = theme.woodColor;
  ctx.globalAlpha = 0.35;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i <= W + 200; i += 180) {
    const my = H * 0.45 + Math.sin((i + camX * 0.12) * 0.006) * 70;
    ctx.lineTo(i, my);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(-camX, -camY);

  // In-World Floating Tutorial Banners
  for (const b of mapBanners) {
    ctx.save();
    ctx.fillStyle = 'rgba(12, 2, 4, 0.92)';
    rrect(b.x - 160, b.y - 48, 320, 54, 8); ctx.fill();
    ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = '#ffd76a'; ctx.font = '600 14px ' + FD; ctx.textAlign = 'center';
    ctx.fillText(b.title, b.x, b.y - 25);

    ctx.fillStyle = '#ffffff'; ctx.font = '400 12px ' + FB;
    ctx.fillText(b.sub, b.x, b.y - 7);
    ctx.restore();
  }

  // Draw Detailed Platforms
  for (const p of plats) {
    ctx.save();
    let shakeOffset = 0;
    if (p.shaking) shakeOffset = (Math.random() * 6 - 3);

    if (p.vanished) {
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = theme.accent;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      ctx.restore();
      continue;
    }

    ctx.fillStyle = theme.platFill;
    ctx.fillRect(p.x + shakeOffset, p.y, p.w, p.h);

    ctx.fillStyle = theme.roofColor;
    ctx.fillRect(p.x + shakeOffset - 4, p.y - 4, p.w + 8, 6);

    ctx.strokeStyle = (p.type === 'crumble') ? '#ff3333' : ((p.type === 'ice') ? '#00e5ff' : theme.platStroke);
    ctx.lineWidth = 2.5;
    ctx.strokeRect(p.x + shakeOffset, p.y, p.w, p.h);

    ctx.strokeStyle = theme.accent; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x + shakeOffset, p.y);
    ctx.lineTo(p.x + p.w + shakeOffset, p.y);
    ctx.stroke();

    ctx.restore();
  }

  // Draw Swinging Pendulum Blades
  for (const pen of pendulums) {
    ctx.save();
    const bx = pen.x + Math.sin(pen.angle) * pen.len;
    const by = pen.y + Math.cos(pen.angle) * pen.len;

    ctx.strokeStyle = '#888888'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(pen.x, pen.y); ctx.lineTo(bx, by); ctx.stroke();

    ctx.fillStyle = '#ff4d4d'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, pen.r, 0, TAU); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#ffffff'; ctx.font = '600 12px ' + FD; ctx.textAlign = 'center';
    ctx.fillText('刃', bx, by + 4);
    ctx.restore();
  }

  // Draw Flame Jets
  for (const fj of flameJets) {
    ctx.save();
    ctx.fillStyle = '#331100';
    ctx.fillRect(fj.x - 14, fj.y - 10, 28, 10);
    if (fj.firing) {
      const grad = ctx.createLinearGradient(fj.x, fj.y, fj.x, fj.y - 85);
      grad.addColorStop(0, '#ffcc00');
      grad.addColorStop(0.5, '#ff3300');
      grad.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(fj.x - 14, fj.y);
      ctx.lineTo(fj.x, fj.y - 85);
      ctx.lineTo(fj.x + 14, fj.y);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // Parkour Bounce Lanterns
  for (const l of lanterns) {
    ctx.save();
    const ready = (l.timer <= 0);
    ctx.globalAlpha = ready ? 1.0 : 0.35;
    ctx.fillStyle = ready ? '#ff4d4d' : '#555555';
    ctx.shadowColor = ready ? '#ff3333' : 'transparent';
    ctx.shadowBlur = ready ? 18 : 0;
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffd76a'; ctx.font = '600 12px ' + FD; ctx.textAlign = 'center';
    ctx.fillText('氣', l.x, l.y + 4);
    ctx.restore();
  }

  // Interactive Torii Gates
  for (const g of gates) {
    ctx.save();
    if (!g.open) {
      ctx.fillStyle = '#b82e2e';
      ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 3;
      ctx.fillRect(g.x, g.y, g.w, g.h);
      ctx.strokeRect(g.x, g.y, g.w, g.h);
      ctx.fillStyle = '#ffffff'; ctx.font = '600 13px ' + FD; ctx.textAlign = 'center';
      ctx.fillText('閉', g.x + g.w / 2, g.y + g.h / 2);
    } else {
      ctx.strokeStyle = 'rgba(255, 215, 120, 0.4)'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
      ctx.strokeRect(g.x, g.y, g.w, g.h);
      ctx.fillStyle = '#ffd76a'; ctx.font = '600 12px ' + FD; ctx.textAlign = 'center';
      ctx.fillText('開', g.x + g.w / 2, g.y + 20);
    }
    ctx.restore();
  }

  // Pressure Switches
  for (const sw of switches) {
    ctx.save();
    ctx.fillStyle = sw.pressed ? '#00d2d3' : '#ffd76a';
    ctx.shadowColor = sw.pressed ? '#00d2d3' : '#ffd76a'; ctx.shadowBlur = 8;
    ctx.fillRect(sw.x, sw.y, sw.w, sw.h);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.strokeRect(sw.x, sw.y, sw.w, sw.h);
    ctx.restore();
  }

  // Wind Vents
  for (const v of vents) {
    ctx.save();
    ctx.fillStyle = '#55e6c1';
    ctx.fillRect(v.x, v.y, v.w, v.h);
    for (let i = 0; i < 3; i++) {
      const vyOff = Math.sin(tGlobal * 8 + i * 2) * 12;
      ctx.strokeStyle = 'rgba(85, 230, 193, 0.6)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(v.x + 8 + i * 12, v.y);
      ctx.lineTo(v.x + 8 + i * 12, v.y - 24 + vyOff);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Spikes
  for (const s of spikes) {
    ctx.fillStyle = '#b82e2e';
    ctx.beginPath();
    for (let x = s.x; x < s.x + s.w; x += 10) {
      ctx.moveTo(x, s.y + s.h);
      ctx.lineTo(x + 5, s.y);
      ctx.lineTo(x + 10, s.y + s.h);
    }
    ctx.fill();
  }

  // Ki Orbs
  for (const o of orbs) {
    if (o.taken) continue;
    ctx.save();
    const bob = Math.sin(tGlobal * 6 + o.x) * 4;
    ctx.fillStyle = '#ffd76a';
    ctx.shadowColor = '#ffd76a'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(o.x, o.y + bob, 9, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // Finish Torii Gate
  ctx.save();
  ctx.fillStyle = '#e74c3c';
  ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 3;
  ctx.fillRect(finishGate.x, finishGate.y, 14, finishGate.h);
  ctx.fillRect(finishGate.x + finishGate.w - 14, finishGate.y, 14, finishGate.h);
  ctx.fillRect(finishGate.x - 12, finishGate.y, finishGate.w + 24, 18);
  ctx.strokeRect(finishGate.x - 12, finishGate.y, finishGate.w + 24, 18);
  ctx.fillStyle = '#ffd76a'; ctx.font = '600 22px serif'; ctx.textAlign = 'center';
  ctx.fillText('門', finishGate.x + finishGate.w / 2, finishGate.y + 40);
  ctx.restore();

  p1.draw();
  p2.draw();

  for (const p of particles) p.draw();
  for (const t of floatTexts) t.draw();

  drawCursedFog(theme);

  ctx.restore();

  // Blinding Smoke Bomb overlay
  if (p1.smokeT > 0 && gameMode !== 'ai') {
    ctx.save();
    ctx.fillStyle = 'rgba(10, 5, 8, ' + Math.min(0.94, p1.smokeT * 0.4) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (mapData.theme === 'shadow' && blackoutT > 4.5) {
    const alpha = Math.sin((blackoutT - 4.5) * Math.PI) * 0.85;
    ctx.fillStyle = 'rgba(5, 0, 15, ' + alpha + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawCursedFog(theme) {
  ctx.save();
  if (isTowerMap()) {
    // Rising fog from BELOW in tower mode (world coords: fogY upward)
    const grad = ctx.createLinearGradient(0, fogY + 320, 0, fogY - 60);
    grad.addColorStop(0, '#000000');
    grad.addColorStop(0.7, theme.fogColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(camX - 100, fogY - 60, W + 200, 480);
    ctx.fillStyle = theme.accent;
    ctx.globalAlpha = 0.35;
    for (let x = camX - 60; x < camX + W + 60; x += 46) {
      const sinOff = Math.sin(tGlobal * 5 + x * 0.05) * 22;
      ctx.beginPath();
      ctx.arc(x, fogY + sinOff, 26, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    return;
  }
  const grad = ctx.createLinearGradient(fogX - 400, 0, fogX + 60, 0);
  grad.addColorStop(0, '#000000');
  grad.addColorStop(0.7, theme.fogColor);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(fogX - 600, 0, 660, H);

  ctx.fillStyle = theme.accent;
  ctx.globalAlpha = 0.35;
  for (let y = 0; y < H; y += 40) {
    const sinOff = Math.sin(tGlobal * 5 + y * 0.05) * 35;
    ctx.beginPath();
    ctx.arc(fogX + sinOff, y, 28, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawSakuraPetals() {
  ctx.save();
  ctx.fillStyle = '#ffb7c5';
  for (const s of sakuraPetals) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.beginPath();
    ctx.ellipse(0, 0, s.size, s.size * 0.5, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- Top Permanent Control Bar & HUD ---------- */
function drawPermanentControlBar() {
  ctx.save();
  const barH = 26;
  ctx.fillStyle = 'rgba(8, 1, 2, 0.94)';
  ctx.fillRect(0, 0, W, barH);
  ctx.strokeStyle = 'rgba(255, 215, 120, 0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, barH); ctx.lineTo(W, barH); ctx.stroke();

  ctx.font = '500 12px ' + FB;
  ctx.fillStyle = '#ffd76a'; ctx.textAlign = 'left';
  ctx.fillText('P1 (CRIMSON): [A/D] Move • [W/Space] Jump • [E] ATTACK • [S] DEFEND • [R]x2 Restart • [Esc] Pause', 18, 18);

  ctx.fillStyle = '#00d2d3'; ctx.textAlign = 'right';
  ctx.fillText((gameMode === 'ai' ? 'P2: ONI (AI BOT) — same 0.45s defend rules' : 'P2 (AZURE): [◀/▶] Move • [▲] Jump • [Enter] ATTACK • [▼] DEFEND'), W - 18, 18);
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  drawPlayerHUD(20, 36, p1, 'P1: CRIMSON', '[E]ATK/[S]DEF');
  drawPlayerHUD(W - 270, 36, p2, (gameMode === 'ai' ? 'P2: ONI (CPU)' : 'P2: AZURE'), '[ENT]ATK/[↓]DEF');
  drawRaceTracker();
  ctx.restore();
}

function drawPlayerHUD(x, y, p, label, keyHint) {
  const w = 250, h = 90;
  ctx.fillStyle = 'rgba(12, 2, 4, 0.85)';
  rrect(x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.fillStyle = '#ffffff'; ctx.font = '600 13px ' + FD; ctx.textAlign = 'left';
  ctx.fillText(label, x + 12, y + 20);

  for (let i = 0; i < 3; i++) {
    const alive = i < p.petals;
    ctx.fillStyle = alive ? '#ff4d6d' : 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(x + 160 + i * 24, y + 16, 7, 0, TAU);
    ctx.fill();
  }

  // Ki Bar
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  rrect(x + 12, y + 34, 150, 14, 4); ctx.fill();
  const fillW = clamp((p.ki / 100) * 150, 0, 150);
  ctx.fillStyle = p.ki >= 100 ? '#ffd76a' : p.color;
  rrect(x + 12, y + 34, fillW, 14, 4); ctx.fill();

  ctx.fillStyle = p.ki >= 100 ? '#ffd76a' : '#cccccc';
  ctx.font = '500 11px ' + FB;
  ctx.fillText(p.ki >= 100 ? keyHint + ' READY!' : 'KI: ' + Math.floor(p.ki) + '% (CHARGING)', x + 14, y + 62);

  // Card Badge
  const cx = x + 178, cy = y + 30, cw = 58, ch = 52;
  const isReady = p.ki >= 100;
  ctx.fillStyle = isReady ? 'rgba(80, 20, 10, 0.95)' : 'rgba(20, 5, 8, 0.85)';
  rrect(cx, cy, cw, ch, 8); ctx.fill();
  ctx.strokeStyle = isReady ? '#ffd76a' : 'rgba(255,255,255,0.25)';
  ctx.lineWidth = isReady ? 2.0 : 1.0; ctx.stroke();

  ctx.fillStyle = isReady ? '#ffd76a' : '#ffffff';
  ctx.font = '600 18px ' + FD; ctx.textAlign = 'center';
  ctx.fillText(p.card.icon, cx + cw / 2, cy + 28);
  ctx.font = '500 10px ' + FB;
  ctx.fillText(p.card.name.split(' ')[0], cx + cw / 2, cy + 44);
}

function drawRaceTracker() {
  const tw = 280, th = 38, tx = W / 2 - tw / 2, ty = 34;
  ctx.fillStyle = 'rgba(10, 1, 3, 0.88)';
  rrect(tx, ty, tw, th, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255, 215, 120, 0.4)'; ctx.lineWidth = 1.2; ctx.stroke();

  if (isTowerMap()) {
    // Vertical progress: base G at bottom, finishGate.y at top
    const span = Math.max(1, G - finishGate.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(tx + 20, ty + 28); ctx.lineTo(tx + tw - 20, ty + 28); ctx.stroke();
    const prog = v => clamp((G - v) / span, 0, 1);
    const fogPct = clamp((G - fogY) / span, 0, 1);
    ctx.fillStyle = '#ff3333';
    ctx.beginPath(); ctx.arc(tx + 20 + fogPct * (tw - 40), ty + 28, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = p1.color;
    ctx.fillRect(tx + 20 + prog(p1.y) * (tw - 40) - 4, ty + 21, 8, 14);
    ctx.fillStyle = p2.color;
    ctx.fillRect(tx + 20 + prog(p2.y) * (tw - 40) - 4, ty + 21, 8, 14);
    ctx.fillStyle = '#ffd76a';
    ctx.fillText('門', tx + tw - 12, ty + 33);
  } else {
  const maxW = MAPS[curMapIndex].w;
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(tx + 20, ty + 15); ctx.lineTo(tx + tw - 20, ty + 15); ctx.stroke();

  const fogPct = clamp((fogX / maxW), 0, 1);
  ctx.fillStyle = '#ff3333';
  ctx.beginPath(); ctx.arc(tx + 20 + fogPct * (tw - 40), ty + 15, 6, 0, TAU); ctx.fill();

  const p1Pct = clamp((p1.x / maxW), 0, 1);
  ctx.fillStyle = p1.color;
  ctx.fillRect(tx + 20 + p1Pct * (tw - 40) - 4, ty + 8, 8, 14);

  const p2Pct = clamp((p2.x / maxW), 0, 1);
  ctx.fillStyle = p2.color;
  ctx.fillRect(tx + 20 + p2Pct * (tw - 40) - 4, ty + 8, 8, 14);

  ctx.fillStyle = '#ffd76a';
  ctx.fillText('門', tx + tw - 12, ty + 20);
  } // end else (horizontal race tracker)

  // Live Race Stopwatch
  ctx.fillStyle = '#ffd76a';
  ctx.font = '600 13px ' + FD; ctx.textAlign = 'center';
  ctx.fillText('⏱ ' + roundTime.toFixed(1) + 's  •  SCORE: ' + p1RoundsWon + ' - ' + p2RoundsWon, W / 2, ty + 56);
}

/* ---------- Dedicated Results & Retry Modal Menu ---------- */
function drawPauseOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(5, 1, 2, 0.72)';
  ctx.fillRect(0, 0, W, H);
  const mw = Math.min(420, W - 40), mh = 190;
  const mx = W / 2 - mw / 2, my = H / 2 - mh / 2;
  ctx.fillStyle = 'rgba(18, 3, 6, 0.96)';
  rrect(mx, my, mw, mh, 14); ctx.fill();
  ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd76a'; ctx.font = '700 26px ' + FD;
  ctx.fillText('⏸ PAUSED', W / 2, my + 52);
  ctx.fillStyle = '#ffffff'; ctx.font = '400 14px ' + FB;
  ctx.fillText('Press [Esc] to resume • [R] twice to restart', W / 2, my + 86);
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '400 12px ' + FB;
  ctx.fillText(isTowerMap() ? '🗼 Tower climb frozen (fog + sabotage clocks halted)' : 'Race frozen (fog + sabotage clocks halted)', W / 2, my + 114);
  if (restartArmed) {
    ctx.fillStyle = '#ff6666'; ctx.font = '600 13px ' + FD;
    ctx.fillText('Press [R] AGAIN to confirm restart!', W / 2, my + 142);
  }
  ctx.restore();
}
function drawRoundOverScreen() {
  ctx.save();
  // Cinematic dark backdrop
  ctx.fillStyle = 'rgba(8, 1, 3, 0.82)';

  // Centered Modal Window
  const mw = Math.min(520, W - 32);

  ctx.fillStyle = '#ffd76a';

  ctx.fillStyle = '#ffffff';

  ctx.fillText('CRIMSON: ' + p1RoundsWon + '    —    ' + (gameMode === 'ai' ? 'ONI (AI)' : 'AZURE') + ': ' + p2RoundsWon, W / 2, my + 140);

  // Three Big Interactive Buttons
  const bw = Math.min(420, mw - 50);
  const bx = W / 2 - bw / 2;

  // 1. RETRY BUTTON (Primary!)
  drawMenuButton(bx, my + 172, bw, 56, '🔄  RETRY THIS MAZE', 'Press [R] or Click to Play Again', '#ffd76a', true, hoverBtn === 0);

  // 2. NEXT MAZE BUTTON (Space no longer jumps past results: use N / Enter only)
  drawMenuButton(bx, my + 242, bw, 54, '⏭  NEXT MAZE LEVEL', 'Press [N] or [Enter]', '#00d2d3', false, hoverBtn === 1);

  // 3. MAIN MENU BUTTON
  drawMenuButton(bx, my + 312, bw, 48, '⛩  MAIN MENU', 'Press [Esc] for Title', '#ffffff', false, hoverBtn === 2);

  // Floating Hint Footer
  ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
  ctx.font = '400 12px ' + FB;
  ctx.fillText('Select an option above to continue playing!', W / 2, my + mh - 18);

  ctx.restore();
}

function drawMenuButton(x, y, w, h, title, subtitle, col='#ffd76a', glow=false, hovered=false) {
  ctx.save();
  ctx.fillStyle = hovered ? 'rgba(55, 12, 18, 0.98)' : 'rgba(28, 5, 10, 0.92)';
  rrect(x, y, w, h, 10);
  ctx.fill();

  ctx.strokeStyle = col;
  ctx.lineWidth = (glow || hovered) ? 2.5 : 1.5;
  if (glow || hovered) {
    ctx.shadowColor = col;
    ctx.shadowBlur = hovered ? 14 : 8;
  }
  ctx.stroke();

  ctx.fillStyle = col;
  ctx.font = '700 17px ' + FD;
  ctx.textAlign = 'center';
  ctx.fillText(title, x + w / 2, y + (subtitle ? 24 : h / 2 + 6));

  if (subtitle) {
    ctx.fillStyle = hovered ? '#ffffff' : 'rgba(255, 255, 255, 0.7)';
    ctx.font = '400 11px ' + FB;
    ctx.fillText(subtitle, x + w / 2, y + 43);
  }
  ctx.restore();
}

  drawBtn(W / 2 - 180, H * 0.45, 360, 58, '🤖 1 PLAYER (VS AI)', '#ffd76a');

  ctx.fillText('• Watch out for swinging pendulum blades, wall flame jets, and floor spikes!', W / 2, 375);
  ctx.fillText('• Reach the exit Torii Gate to win! Use Retry or Next Maze to continue racing!', W / 2, 400);

  drawBtn(W / 2 - 120, H - 70, 240, 44, 'BACK TO MENU', '#ffd76a');
