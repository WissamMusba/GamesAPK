function drawBtn(x, y, w, h, text, color='#ffd76a') {
  ctx.save();
  ctx.fillStyle = 'rgba(20, 3, 6, 0.88)';
  rrect(x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.fillStyle = color; ctx.font = '600 18px ' + FD;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2);
  ctx.restore();
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function burstDust(x, y, n, col='#ffd76a') {
  for (let i = 0; i < n; i++) {
    particles.push(new Particle({
      x, y, vx: Math.random() * 80 - 40, vy: -Math.random() * 50 - 20,
      color: col, size: Math.random() * 4 + 2, life: 0.35
    }));
  }
}
function burstRing(x, y, col) {
  for (let i = 0; i < 12; i++) {
    const ang = (i / 12) * TAU;
    particles.push(new Particle({
      x, y, vx: Math.cos(ang) * 120, vy: Math.sin(ang) * 120,
      color: col, size: 4, life: 0.35, type: 'circle'
    }));
  }
}
function burstShockwave(x, y, col) {
  for (let i = 0; i < 20; i++) {
    const ang = (i / 20) * TAU;
    particles.push(new Particle({
      x, y, vx: Math.cos(ang) * 220, vy: Math.sin(ang) * 220,
      color: col, size: 6, life: 0.5, type: 'circle'
    }));
  }
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

/* ---------- Input Handlers (Non-Blocking Everywhere) ---------- */
function setPaused(v) {
  if (state !== 'play') return;
  paused = v;
  if (!v) { restartArmed = false; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
window.addEventListener('blur', () => setPaused(true));

window.addEventListener('keydown', e => {
  if (adActive) return;
  Snd.unlock();
  const c = e.code;

  // Dedicated handling on Round Over Menu (Space is NOT advance: N/Enter only, so jump can't skip results)
  if (state === 'roundover') {
    if (c === 'KeyR') {
      startRound(curMapIndex);
      return;
    }
    if (c === 'Enter' || c === 'KeyN') {
      advanceToNextRound();
      return;
    }
    if (c === 'Escape' || c === 'KeyM') {
      state = 'title';
      return;
    }
    return;
  }

  // Esc pauses mid-race (overlay halts update/fog/sabotage clocks)
  if (c === 'Escape' && state === 'play') {
    setPaused(!paused);
    return;
  }
  if (paused) return;

  // R restart mid-race requires confirm: double-press R within 2.5s
  if (c === 'KeyR' && state === 'play') {
    if (restartArmed) {
      restartArmed = false;
      startRound(curMapIndex);
    } else {
      restartArmed = true; restartArmedT = 2.5;
      floatTexts.push(new FloatText(p1.x, p1.y - 40, 'PRESS R AGAIN TO RESTART!', '#ffd76a'));
    }
    return;
  }

  if (state === 'title') {
    gameMode = 'ai';
    startRound(curMapIndex);
    return;
  }
  if (state === 'howtoplay') {
    state = 'title';
    return;
  }

  // P1 Controls: WASD + Space; E = ATTACK, S = DEFEND
  if (c === 'KeyA') {
    const now = performance.now();
    if (now - keys.p1LastA < 260) p1.tryDash(-1);
    keys.p1LastA = now;
    keys.a = true;
  }
  if (c === 'KeyD') {
    const now = performance.now();
    if (now - keys.p1LastD < 260) p1.tryDash(1);
    keys.p1LastD = now;
    keys.d = true;
  }
  if (c === 'KeyW' || c === 'Space') {
    keys.w = true;
    if (state === 'play') p1.requestJump();
  }
  if (c === 'KeyE') {
    keys.e = true;
    p1.tryAttack(p2);
  }
  if (c === 'KeyS') {
    keys.s = true;
    p1.tryDefend(p2);
  }

  // P2 Controls: Arrows; Enter = ATTACK, Down = DEFEND (P1 WASD + P2 arrows/Enter scheme kept)
  if (gameMode === 'pvp') {
    if (c === 'ArrowLeft') {
      const now = performance.now();
      if (now - keys.p2LastLeft < 260) p2.tryDash(-1);
      keys.p2LastLeft = now;
      keys.left = true;
    }
    if (c === 'ArrowRight') {
      const now = performance.now();
      if (now - keys.p2LastRight < 260) p2.tryDash(1);
      keys.p2LastRight = now;
      keys.right = true;
    }
    if (c === 'ArrowUp') { keys.up = true; p2.requestJump(); }
    if (c === 'Enter' || c === 'ShiftRight') {
      keys.enter = true;
      p2.tryAttack(p1);
    }
    if (c === 'ArrowDown') {
      keys.down = true;
      p2.tryDefend(p1);
    }
  }

  if (c === 'Space' && state === 'play') e.preventDefault();
});

window.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'KeyA') keys.a = false;
  if (c === 'KeyD') keys.d = false;
  if (c === 'KeyW' || c === 'Space') keys.w = false;
  if (c === 'KeyS') keys.s = false;
  if (c === 'KeyE') keys.e = false;

  if (c === 'ArrowLeft') keys.left = false;
  if (c === 'ArrowRight') keys.right = false;
  if (c === 'ArrowUp') keys.up = false;
  if (c === 'ArrowDown') keys.down = false;
  if (c === 'Enter' || c === 'ShiftRight') keys.enter = false;
});

let hoverBtn = -1; // 0: retry, 1: next, 2: title

canvas.addEventListener('mousemove', e => {
  if (state !== 'roundover') {
    if (canvas.style.cursor !== 'default') canvas.style.cursor = 'default';
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const scaleX = (rect.width > 0) ? (W / rect.width) : 1;
  const scaleY = (rect.height > 0) ? (H / rect.height) : 1;
  const mx = (e.clientX - (rect.left || 0)) * scaleX;
  const my = (e.clientY - (rect.top || 0)) * scaleY;

  const mw = Math.min(520, W - 32);
  const my_box = H / 2 - 430 / 2;
  const bw = Math.min(420, mw - 50);
  const bx = W / 2 - bw / 2;

  if (mx >= bx && mx <= bx + bw && my >= my_box + 172 && my <= my_box + 172 + 56) hoverBtn = 0;
  else if (mx >= bx && mx <= bx + bw && my >= my_box + 242 && my <= my_box + 242 + 54) hoverBtn = 1;
  else if (mx >= bx && mx <= bx + bw && my >= my_box + 312 && my <= my_box + 312 + 48) hoverBtn = 2;
  else hoverBtn = -1;

  canvas.style.cursor = (hoverBtn !== -1) ? 'pointer' : 'default';
});

canvas.addEventListener('mousedown', e => {
  Snd.unlock();
  const rect = canvas.getBoundingClientRect();
  const scaleX = (rect.width > 0) ? (W / rect.width) : 1;
  const scaleY = (rect.height > 0) ? (H / rect.height) : 1;
  const mx = (e.clientX - (rect.left || 0)) * scaleX;
  const my = (e.clientY - (rect.top || 0)) * scaleY;

  if (state === 'title') {
    if (my > H * 0.45 && my < H * 0.45 + 58) {
      gameMode = 'ai';
      startRound(curMapIndex);
      return;
    }
    if (my > H * 0.58 && my < H * 0.58 + 58) {
      gameMode = 'pvp';
      startRound(curMapIndex);
      return;
    }
    if (my > H * 0.72 && my < H * 0.72 + 44) {
      state = 'howtoplay';
      return;
    }
    gameMode = 'ai';
    startRound(curMapIndex);
    return;
  }

  if (state === 'howtoplay') {
    if (my > H - 70 && my < H - 26) state = 'title';
    return;
  }

  // Interactive Victory & Retry Menu Click Handlers
  if (state === 'roundover') {
    const mw = Math.min(520, W - 32);
    const mh = 430;
    const my_box = H / 2 - mh / 2;
    const bw = Math.min(420, mw - 50);
    const bx = W / 2 - bw / 2;

    // 1. Retry Button: my_box + 172 (height 56)
    if (mx >= bx && mx <= bx + bw && my >= my_box + 172 && my <= my_box + 172 + 56) {
      startRound(curMapIndex);
      return;
    }
    // 2. Next Maze Button: my_box + 242 (height 54)
    if (mx >= bx && mx <= bx + bw && my >= my_box + 242 && my <= my_box + 242 + 54) {
      advanceToNextRound();
      return;
    }
    // 3. Main Menu Button: my_box + 312 (height 48)
    if (mx >= bx && mx <= bx + bw && my >= my_box + 312 && my <= my_box + 312 + 48) {
      state = 'title';
      return;
    }
    return;
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.changedTouches && e.changedTouches.length > 0) {
    const t = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    const scaleX = (rect.width > 0) ? (W / rect.width) : 1;
    const scaleY = (rect.height > 0) ? (H / rect.height) : 1;
    const mx = (t.clientX - (rect.left || 0)) * scaleX;
    const my = (t.clientY - (rect.top || 0)) * scaleY;
    if (state === 'play') {
      if (mx < W * 0.45) {
        if (mx < W * 0.22) { p1.tryDash(-1); keys.a = true; setTimeout(() => { keys.a = false; }, 250); }
        else { p1.tryDash(1); keys.d = true; setTimeout(() => { keys.d = false; }, 250); }
      } else {
        if (my < H * 0.5) p1.requestJump();
        else p1.tryUseCard(p2);
      }
    } else {
      const me = new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY });
      canvas.dispatchEvent(me);
    }
  }
}, { passive: false });

/* ---------- Resize & Viewport ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* ---------- Game Loop (Fixed Timestep 60Hz, Spiral-Protected) ---------- */
let lastT = performance.now();
let accT = 0;
function loop(now) {
  const dt = Math.min(0.08, (now - lastT) / 1000);
  lastT = now;
  accT += dt;
  if (accT > 0.1) accT = 0.1; // Immune to lag spirals!
  while (accT >= 1 / 60) {
    update(1 / 60);
    accT -= 1 / 60;
  }
  draw();
  requestAnimationFrame(loop);
}

resize();
CG.init();
requestAnimationFrame(loop);
</script>
