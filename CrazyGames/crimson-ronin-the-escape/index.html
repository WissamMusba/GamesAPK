function updateVanishPlats(dt){
  for(const p of plats){
    // Spawned temporary platform countdown
    if(p.spawnTimer!==undefined && p.spawnTimer>0){
      p.spawnTimer-=dt;
      if(p.spawnTimer<=0){
        p.spawnTimer=0;
        p.vState='gone';
        Snd.crumble();
        burstDust(p.x+p.w/2,p.y+p.h/2,6);
        texts.push(new FloatText(p.x+p.w/2,p.y-20,'VANISHED!','#ff7a3c'));
      }
    }

    if(p.t!=='vanish' && !p.initiallyHidden && !p.vState) continue;
    if(p.vState==='shake'){
      p.vT-=dt;
      if(p.vT<=0){
        p.vState='gone';
        p.vT=(p.respawnDelay!==undefined?p.respawnDelay:2.6);
        Snd.crumble();burstDust(p.x+p.w/2,p.y+p.h/2,6);
      }
    }else if(p.vState==='gone'){
      if(p.vT>0){
        p.vT-=dt;
        if(p.vT<=0)p.vState='solid';
      }
    }
  }
}
function update(dt){
  shake=Math.max(0,shake-dt*46);
  flash=Math.max(0,flash-dt*2.4);
  if(cardT>0)cardT-=dt;
  if(mercyT>0)mercyT-=dt;
  if(onboardT>0)onboardT-=dt;
  if(typeof scorchT!=='undefined'){ if(scorchT>0)scorchT-=dt; }

  if(state==='brief'){
    briefT+=dt;
    for(const g of guards)g.update(dt,false);
    doorObj.update(dt);
    const p=easeIO(clamp(briefT/briefDur,0,1));
    camX=lerp(doorCamX,spawnCamX,p);
    camY=lerp(doorCamY,spawnCamY,p);
    if(briefT>=briefDur)startReady(0);
  }
  else if(state==='ready'){
    readyT+=dt;
    for(const g of guards)g.update(dt,false);
    doorObj.update(dt);
    const tx=camClampX(player.x+player.w/2-W*0.45);
    const ty=camClampY(player.y+player.h/2-H*0.55);
    camX+=(tx-camX)*Math.min(1,dt*7);
    camY+=(ty-camY)*Math.min(1,dt*7);
    if(readyT>0.7){
      state='play';levelTime=0;
      texts.push(new FloatText(player.x+player.w/2,player.y-40,'GO!'));
    }
  }
  else if(state==='play'){
    totalTime+=dt;levelTime+=dt;
    player.update(dt);
    checkTutorialMilestones();
    updateVanishPlats(dt);

    const tx=camClampX(player.x+player.w/2-W*0.45);
    const ty=camClampY(player.y+player.h/2-H*0.55);
    camX+=(tx-camX)*Math.min(1,dt*8);
    camY+=(ty-camY)*Math.min(1,dt*8);

    if(L.checkpointX&&player.x>L.checkpointX&&currentCheckpointX<L.checkpointX){
      currentCheckpointX=L.checkpointX;
      Snd.checkpoint();
      texts.push(new FloatText(player.x,player.y-40,'CHECKPOINT','#9cff8a'));
    }

    hideAvail=null;
    if(!player.hidden&&player.onGround){
      for(const c of hideSpots){
        if(Math.abs(player.x+player.w/2-(c.x+c.w/2))<62){hideAvail=c;break;}
      }
    }
    for(const s of hideSpots)if(s.cd>0)s.cd-=dt;

    if(player.hidden){
      hideT+=dt;
      const lim=HIDE_LIMIT[player.hideCrate.type];
      if(hideT>=lim)forceUnhide('EXPOSED!');
    }

    const canSense=mercyT<=0;
    for(const g of guards)g.update(dt,canSense);
    for(const p of plates)p.update(dt);
    for(const ts of trapSpikes)ts.update(dt);
    trapSpikes=trapSpikes.filter(ts=>ts.t<ts.life);
    for(const t of towers)t.update(dt);
    for(const f of fires)f.update(dt);
    doorObj.update(dt);

    if(!player.hidden&&canSense){
      // scorch heat build near active fires even if not deadly close
      for(const f of fires){ if(f.warning() && Math.hypot(player.x+player.w/2 - f.x, player.y+player.h/2 - f.y) < 120 ) heatT=clamp(heatT+dt*0.8,0,1); }
      if(heatT>0 && fires.every(f=>!f.warning() && !f.active())) heatT=Math.max(0, heatT - dt*1.2);
      let inLight=false;
      for(const s of spots){
        if(s.hits(player.x+player.w/2,player.y+player.h/2)){inLight=true;break;}
      }
      if(lightExp<0)lightExp+=dt;
      else if(inLight){
        lightExp+=dt;
        if(lightExp>=0.7){lightExp=-1.2;soundAlarm(player.x+player.w/2);}
      }else lightExp=Math.max(0,lightExp-dt*1.5);
    }else if(lightExp>0)lightExp=Math.max(0,lightExp-dt*1.5);

    if(!player.hidden&&state==='play'){
      const px=player.x+8,pw=player.w-16;
      const py=player.y+12,ph=player.h-14;
      if(mercyT<=0){
        for(const s of spikeGroups){if(s.hits(px,py,pw,ph)){die();break;}}
        if(state==='play')for(const ts of trapSpikes){if(ts.hits(px,py,pw,ph)){die();break;}}
        if(state==='play')for(const f of fires){ if(f.hits(px,py,pw,ph)){ die(); break; } }
        if(state==='play')for(const b of blades){
          if(b.deadly()&&Math.abs(player.x+player.w/2-b.x)<player.w/2+6&&
             player.y+player.h>b.y&&player.y<b.y+b.h){die();break;}
        }
      }
      if(state==='play'){
        for(const k of keyObjs){
          if(k.taken)continue;
          if(Math.hypot(player.x+player.w/2-k.x,player.y+player.h/2-k.y)<38){
            k.taken=true;keyGotCount++;
            Snd.key();
            burstGold(k.x,k.y,16);
            texts.push(new FloatText(k.x,k.y-24,keyGotCount>=keysNeed?'ALL KEYS!':'KEY ACQUIRED'));
          }
        }
        for(const o of orbs){
          if(o.taken)continue;
          const dx=player.x+player.w/2-o.x,dy=player.y+player.h/2-o.y;
          if(dx*dx+dy*dy<(o.r+27)*(o.r+27)){
            o.taken=true;score+=10;totalOrbs++;
            Snd.orb();
            burstGold(o.x,o.bobY(),10);
            texts.push(new FloatText(o.x,o.bobY()-16,'+10 KI'));
          }
        }
        const drc=doorObj;
        if(player.x+player.w>drc.x+12&&player.x<drc.x+drc.w-12&&player.y+player.h>drc.y+40){
          if(drc.openT>0.6)levelCleared();
          else if(keyGotCount<keysNeed&&drc.lockMsgT<=0){
            drc.lockMsgT=1.6;
            const need=keysNeed-keyGotCount;
            texts.push(new FloatText(drc.x+drc.w/2,drc.y-14,
              need>1?'LOCKED — '+need+' KEYS REMAIN':'LOCKED — FIND THE KEY','#ff8a70'));
          }
        }
      }
    }
  }
  else if(state==='dead'){
    deadT+=dt;
    if(!adPending&&!adActive&&deadT>(reviveUsed?1.6:4.5))respawn();
  }
  else if(state==='cleared'){
    clearT+=dt;
    doorObj.update(dt);
    if(clearT>2.3)advanceLevel();
  }

  for(const p of parts)p.update(dt);
  for(const t of texts)t.update(dt);
  parts=parts.filter(p=>p.life>0);
  texts=texts.filter(t=>t.life>0);
}

const embers=[];
function initEmbers(){
  embers.length=0;
  for(let i=0;i<40;i++)embers.push({
    x:Math.random()*W,y:Math.random()*H,
    r:rand(1,2.6),s:rand(14,42),ph:rand(0,TAU),a:rand(0.12,0.4)});
}
function updateEmbers(dt){
  for(const em of embers){
    em.y-=em.s*dt;
    em.x+=Math.sin(tGlobal+em.ph)*16*dt-12*dt;
    if(em.y<-12){em.y=H+12;em.x=Math.random()*W;}
    if(em.x<-12)em.x=W+12;
  }
}
function drawRidge(par,amp,lift,step,color,baseY){
  const off=camX*par;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(-step,baseY+60);
  for(let sx=-step;sx<=W+step;sx+=step){
    const wx=sx+off;
    const i=Math.floor(wx/step);
    let t=(wx-i*step)/step;
    t=t*t*(3-2*t);
    const v=hash(i)*(1-t)+hash(i+1)*t;
    ctx.lineTo(sx,baseY-lift-amp*(0.35+0.65*v));
  }
  ctx.lineTo(W+step,baseY+60);
  ctx.closePath();ctx.fill();
}
function drawTorii(x,gy,s){
  ctx.fillStyle='#1d0204';
  const h=110*s,w=84*s,pw=9*s;
  ctx.fillRect(x-w/2,gy-h,pw,h);
  ctx.fillRect(x+w/2-pw,gy-h,pw,h);
  ctx.beginPath();
  ctx.moveTo(x-w/2-14*s,gy-h+6*s);
  ctx.quadraticCurveTo(x,gy-h-15*s,x+w/2+14*s,gy-h+6*s);
  ctx.lineTo(x+w/2+14*s,gy-h+17*s);
  ctx.quadraticCurveTo(x,gy-h-2*s,x-w/2-14*s,gy-h+17*s);
  ctx.closePath();ctx.fill();
  ctx.fillRect(x-w/2+4*s,gy-h+32*s,w-8*s,8*s);
}
function drawPagoda(x,gy,s){
  ctx.fillStyle='#1d0204';
  ctx.fillRect(x-17*s,gy-86*s,34*s,86*s);
  for(let i=0;i<3;i++){
    const y=gy-20*s-i*30*s,rw=(78-i*17)*s;
    ctx.beginPath();
    ctx.moveTo(x-rw/2,y);ctx.lineTo(x,y-17*s);ctx.lineTo(x+rw/2,y);
    ctx.closePath();ctx.fill();
  }
  ctx.fillRect(x-1.5*s,gy-112*s,3*s,26*s);
}
function drawLanternDecor(x,gy,s){
  ctx.fillStyle='#1d0204';
  ctx.fillRect(x-2,gy-64*s,4,64*s);
  ctx.fillRect(x-2,gy-64*s,26*s,3);
  const lx=x+22*s,ly=gy-50*s;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const gg=ctx.createRadialGradient(lx,ly,2,lx,ly,30*s);
  gg.addColorStop(0,'rgba(255,170,90,0.5)');gg.addColorStop(1,'rgba(255,170,90,0)');
  ctx.fillStyle=gg;
  ctx.beginPath();ctx.arc(lx,ly,30*s,0,TAU);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#ff9c4a';
  rrectPath(lx-7*s,ly-10*s,14*s,20*s,5*s);ctx.fill();
  ctx.fillStyle='#1d0204';
  ctx.fillRect(lx-5*s,ly-13*s,10*s,3*s);
  ctx.fillRect(lx-5*s,ly+10*s,10*s,3*s);
}
function drawDecor(baseY){
  const par=0.5,spacing=560,off=camX*par;
  const first=Math.floor(off/spacing)-1;
  const last=first+Math.ceil(W/spacing)+2;
  for(let k=first;k<=last;k++){
    const sx=k*spacing-off+(hash(k*3.1)-0.5)*160;
    const r=hash(k*7.7),s=0.75+hash(k*11.3)*0.5;
    if(r<0.30)drawTorii(sx,baseY,s);
    else if(r<0.52)drawPagoda(sx,baseY,s);
    else if(r<0.66)drawLanternDecor(sx,baseY,s);
  }
}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#4d050b');
  g.addColorStop(0.5,'#8B0000');
  g.addColorStop(0.85,'#a51214');
  g.addColorStop(1,'#7a0b0b');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  const sunX=W*0.74,sunY=H*0.30,sunR=Math.min(W,H)*0.15;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const sg=ctx.createRadialGradient(sunX,sunY,sunR*0.2,sunX,sunY,sunR*3);
  sg.addColorStop(0,'rgba(255,120,60,0.5)');sg.addColorStop(1,'rgba(255,120,60,0)');
  ctx.fillStyle=sg;
  ctx.beginPath();ctx.arc(sunX,sunY,sunR*3,0,TAU);ctx.fill();
  ctx.restore();
  const sc=ctx.createLinearGradient(0,sunY-sunR,0,sunY+sunR);
  sc.addColorStop(0,'#ff8a4d');sc.addColorStop(1,'#d43a2a');
  ctx.fillStyle=sc;
  ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,TAU);ctx.fill();
  const horizon=G-camY;
  drawRidge(0.12,H*0.22,H*0.06,70,'#4c060a',horizon);
  drawRidge(0.30,H*0.16,0,90,'#300407',horizon);
  if(settings.particles){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const em of embers){
      ctx.globalAlpha=em.a*(0.6+0.4*Math.sin(tGlobal*2+em.ph));
      ctx.fillStyle='#ffa050';
      ctx.beginPath();ctx.arc(em.x,em.y,em.r,0,TAU);ctx.fill();
    }
    ctx.restore();ctx.globalAlpha=1;
  }
  drawDecor(horizon);
}

function drawPlatforms(){
  for(const p of plats){
    if(p.y===G)continue;
    if(!inView(p.x,p.y,p.w,p.h))continue;
    if(p.vState==='gone'||p.vState==='hidden'){
      if(p.initiallyHidden){
        // 100% INVISIBLE: Do NOT draw any outline at all!
        continue;
      }else{
        ctx.save();
        ctx.globalAlpha=0.15;
        ctx.strokeStyle='#ffd9c0';
        ctx.lineWidth=1.2;
        ctx.setLineDash([4,4]);
        ctx.strokeRect(p.x,p.y,p.w,p.h);
        ctx.restore();
      }
      continue;
    }
    let jx=0,jy=0;
    if(p.t==='vanish'&&p.vState==='shake'){jx=rand(-2,2);jy=rand(-1,1);}
    ctx.save();
    ctx.translate(p.x+jx,p.y+jy);
    if(p.t==='slow'){
      const g=ctx.createLinearGradient(0,0,0,p.h);
      g.addColorStop(0,'#5c4c42');g.addColorStop(0.4,'#463a32');g.addColorStop(1,'#241c16');
      ctx.fillStyle=g;
      rrectPath(0,0,p.w,p.h,5);ctx.fill();
      ctx.strokeStyle='rgba(30,20,16,0.6)';ctx.lineWidth=1.5;
      for(let i=1;i<Math.floor(p.w/40);i++){
        ctx.beginPath();ctx.moveTo(i*40,3);ctx.lineTo(i*40+10,p.h-3);ctx.stroke();
      }
      ctx.save();
      ctx.shadowColor='rgba(216,196,174,0.6)';ctx.shadowBlur=5*shadowMul;
      ctx.fillStyle='rgba(216,196,174,0.85)';
      ctx.fillRect(2,0,p.w-4,2.4);
      ctx.restore();
      ctx.fillStyle='rgba(216,196,174,0.5)';
      for(let i=0;i<3;i++){
        const dx=p.w*(0.25+0.25*i);
        ctx.beginPath();ctx.arc(dx,p.h+3+Math.sin(tGlobal*2+i+p.x)*2,2.2,0,TAU);ctx.fill();
      }
    }else if(p.t==='vanish'){
      const g=ctx.createLinearGradient(0,0,0,p.h);
      g.addColorStop(0,'#300a0e');g.addColorStop(1,'#140306');
      ctx.fillStyle=g;
      rrectPath(0,0,p.w,p.h,5);ctx.fill();
      const pulse=p.vState==='shake'?(Math.sin(tGlobal*30)>0?1:0.4):0.7;
      ctx.strokeStyle='rgba(255,110,70,'+(0.35*pulse)+')';ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.moveTo(p.w*0.3,2);ctx.lineTo(p.w*0.42,p.h-2);
      ctx.moveTo(p.w*0.65,2);ctx.lineTo(p.w*0.58,p.h-2);
      ctx.stroke();
      ctx.save();
      ctx.shadowColor='rgba(255,90,50,0.8)';ctx.shadowBlur=6*shadowMul;
      ctx.fillStyle=p.vState==='shake'?(Math.sin(tGlobal*30)>0?'#ff5a3c':'#ff9a6a'):'#ff6e42';
      ctx.globalAlpha=0.7;
      ctx.fillRect(2,0,p.w-4,2.4);
      ctx.restore();
    }else{
      if(texStone){
        ctx.drawImage(texStone,0,0,p.w,p.h);
        ctx.fillStyle='rgba(0,0,0,0.15)';
        ctx.fillRect(0,p.h*0.55,p.w,p.h*0.45);
      }else{
        const g=ctx.createLinearGradient(0,0,0,p.h);
        g.addColorStop(0,'#3a0d10');g.addColorStop(0.4,'#22070a');g.addColorStop(1,'#100203');
        ctx.fillStyle=g;
        rrectPath(0,0,p.w,p.h,5);ctx.fill();
      }
      ctx.fillStyle='rgba(0,0,0,0.45)';
      ctx.fillRect(3,p.h-3,p.w-6,3);
      ctx.save();

function drawGrassWorld(){
  const spacing=52;
  const first=Math.floor(camX/spacing)-1;
  const last=first+Math.ceil(W/spacing)+2;
  ctx.strokeStyle='#160102';ctx.lineCap='round';ctx.lineWidth=2;
  for(let k=first;k<=last;k++){
    if(k*spacing<-40||k*spacing>L.w+40)continue;
    const sx=k*spacing+(hash(k*5.3)-0.5)*30;
    const n=1+Math.floor(hash(k*9.1)*3),hgt=8+hash(k*2.2)*16;
    for(let j=0;j<n;j++){
      const lean=(hash(k*3.7+j)-0.5)*12;
      ctx.beginPath();
      ctx.moveTo(sx+j*3,G+2);
      ctx.quadraticCurveTo(sx+j*3+lean*0.4,G-hgt*0.6,sx+j*3+lean,G-hgt);

  }

function towerExposureData(){
  let maxFrac=0, maxExp=0, maxLimit=1.1;
  for(const t of towers){
    const limit=t.alertTime!==undefined?t.alertTime:(t.spotlightTime!==undefined?t.spotlightTime:1.1);
    const effLimit=Math.max(0.1,limit);
    const frac=t.exposure/effLimit;
    if(frac>maxFrac){
      maxFrac=frac;
      maxExp=t.exposure;
      maxLimit=effLimit;
    }
  }
  return { exp: maxExp, limit: maxLimit, frac: maxFrac };
}
function drawThreatMeter(){
  if(state!=='play'||player.hidden)return;
  const tData=towerExposureData();
  let val=0,limit=1,warnTxt='';
  if(tData.exp>0){
    val=tData.exp;
    limit=tData.limit;
    warnTxt='CAMERA';
  }
  else if(lightExp>0){
    val=lightExp;
    limit=0.7;
    warnTxt='LIGHT';
  }
  if(val<=0)return;
  const cx=player.x+player.w/2,cy=player.y-28;
  const frac=clamp(val/limit,0,1);
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,13,0,TAU);ctx.stroke();
  ctx.strokeStyle=frac>0.6?'#ff5340':'#ffe9a0';
  ctx.beginPath();ctx.arc(cx,cy,13,-Math.PI/2,-Math.PI/2+TAU*frac);ctx.stroke();
  ctx.fillStyle='rgba(255,235,200,0.85)';ctx.font='600 10px "Trebuchet MS","Lucida Sans Unicode",sans-serif';
  ctx.textAlign='center';
  ctx.fillText(warnTxt,cx,cy-18);
}

  let gridH=rows*th+(rows-1)*gap;
  if(gridH>maxGridH){
    th=Math.floor((maxGridH-(rows-1)*gap)/rows);
    tw=th;
  }
  tw=Math.min(tw,108);
  th=Math.min(th,108);
  const gridW=cols*tw+(cols-1)*gap;
  gridH=rows*th+(rows-1)*gap;
  const gx=W/2-gridW/2;
  const gy=Math.min(120,H*0.16);
  for(let i=startIdx;i<endIdx;i++){
    const idx=i-startIdx;
    const cx=gx+(idx%cols)*(tw+gap);

    const un=unlocked(i),sel=i===levelSel;

      ctx.fillText(LEVELS[i].name,cx+tw/2,cyy+th*0.55);
      const starR=Math.max(4,Math.floor(tw*0.08));
      for(let s=0;s<3;s++)drawStar(cx+tw/2-2.2*starR+s*2.2*starR,cyy+th*0.75,starR,s<st);
      if(progress.times[i]>0){
        ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='600 '+Math.floor(tw*0.09)+'px "Trebuchet MS","Lucida Sans Unicode",sans-serif';

      uiRects.push({id:i,x:cx,y:cyy,w:tw,h:th});
    }else{
      ctx.globalAlpha=0.5;
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;
      ctx.strokeRect(cx+tw/2-11,cyy+th*0.4,22,18);
      ctx.beginPath();ctx.arc(cx+tw/2,cyy+th*0.4,8,Math.PI,0);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='600 '+Math.floor(tw*0.1)+'px "Trebuchet MS","Lucida Sans Unicode",sans-serif';
      ctx.textAlign='center';
      ctx.fillText('CLEAR ROOM '+i,cx+tw/2,cyy+th*0.75);
      ctx.globalAlpha=1;
    }
  }
  const btnW=140,btnH=46;
  const btnY=gy+gridH+20;
  if(levelPage>0){
    drawMenuButton(W/2-btnW-10,btnY,btnW,btnH,'◀ PREV',false,'prevPage');

function drawTouchButtons(){
  if(!touch.isTouch||H>W)return;
  if(!inGame())return;
  ctx.save();
  const defs=[
    ['left',buttons.left,'◀'],['right',buttons.right,'▶'],
    ['jump',buttons.jump,'▲'],['hide',buttons.hide,'S'],['dash',buttons.dash,'»']];
  for(const d of defs){
    const b=d[1];
    const active=(d[0]==='left'&&btn.left)||(d[0]==='right'&&btn.right)||
                 (d[0]==='jump'&&btn.jump)||(d[0]==='hide'&&player.hidden)||
                 (d[0]==='dash'&&player.dashT>0);
    const dashCd=d[0]==='dash'&&player.dashCd>0&&player.dashT<=0;
    const dim=(d[0]==='hide'&&!hideAvail&&!player.hidden&&state==='play')||dashCd;
    ctx.globalAlpha=dim?0.3:(active?0.95:0.65);
    ctx.fillStyle=active?'rgba(60,12,8,0.75)':'rgba(20,3,3,0.55)';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
    ctx.strokeStyle=active?'#ffd76a':'rgba(255,120,80,0.55)';
    ctx.lineWidth=active?3:2;
    ctx.stroke();
    ctx.fillStyle=active?'#ffd76a':'#ffd9c0';
    if(d[2]==='◀'||d[2]==='▶'||d[2]==='▲'){
      const s=b.r*0.42;
      ctx.beginPath();
      if(d[2]==='◀'){ctx.moveTo(b.x+s*0.7,b.y-s);ctx.lineTo(b.x-s*0.8,b.y);ctx.lineTo(b.x+s*0.7,b.y+s);}
      if(d[2]==='▶'){ctx.moveTo(b.x-s*0.7,b.y-s);ctx.lineTo(b.x+s*0.8,b.y);ctx.lineTo(b.x-s*0.7,b.y+s);}
      if(d[2]==='▲'){ctx.moveTo(b.x-s,b.y+s*0.7);ctx.lineTo(b.x,b.y-s*0.8);ctx.lineTo(b.x+s,b.y+s*0.7);}
      ctx.closePath();ctx.fill();
    }else{
      ctx.font='400 '+Math.floor(b.r*0.7)+'px "Impact","Arial Black",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(d[0]==='dash'?'»':'S',b.x,b.y+2);
      ctx.textBaseline='alphabetic';
    }
  }
  ctx.restore();
}

function draw(){
  drawBackground();

  if(inGame()){
    const shX=(settings.shake&&shake>0)?rand(-shake,shake)*0.5:0;
    const shY=(settings.shake&&shake>0)?rand(-shake,shake)*0.5:0;
    ctx.save();
    ctx.translate(-camX+shX,-camY+shY);
    drawGroundWorld();
    drawGrassWorld();
    drawPlatforms();
    drawSigns();
    if(inView(doorObj.x-50,doorObj.y-50,200,200))doorObj.draw();
    for(const c of hideSpots)if(inView(c.x-50,c.y-c.h-50,150,150))c.draw();
    for(const p of plates)if(inView(p.x-20,G-10,40,10))p.draw();
    for(const t of towers)if(inView(t.x-50,t.topY()-50,100,200))t.drawStructure();
    for(const s of spikeGroups)if(inView(s.x-10,G-60,s.width+20,60))s.draw();
    for(const ts of trapSpikes)if(inView(ts.x-50,G-50,100,50))ts.draw();
    for(const b of blades)if(inView(b.x-20,b.y-10,40,b.h+20))b.draw();
    for(const f of fires)if(inView(f.x-60,f.y-60,120,120))f.draw();
    for(const o of orbs)if(inView(o.x-30,o.y-30,60,60)&&!o.taken)o.draw();
    for(const k of keyObjs)if(inView(k.x-50,k.y-50,100,100)&&!k.taken)k.draw();
    for(const g of guards)if(inView(g.x-50,g.y-100,100,100))g.draw();
    player.draw();
    for(const t of towers)if(inView(t.x-50,t.topY()-50,100,200))t.drawBeam();
    for(const s of spots)if(inView(s.x-10,0,20,s.len))s.draw();
    if(settings.particles)for(const p of parts)p.draw();
    for(const t of texts)t.draw();
    drawHidePrompt();
    drawThreatMeter();
    drawDoorGuide();
    drawBriefMarkers();
    ctx.restore();
    drawOnboarding();
  }

  ctx.fillStyle=vignette;
  ctx.fillRect(0,0,W,H);
  if(flash>0){
    ctx.fillStyle='rgba(255,225,205,'+(flash*0.55)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(heatT>0){
    ctx.fillStyle='rgba(255,90,20,'+(heatT*0.12)+')';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,160,60,'+(heatT*0.06)+')';
    ctx.fillRect(0,H*0.65,W,H*0.06);
  }

  if(inGame()&&state!=='win')drawHUD();
  drawCard();
  drawBriefUI();
  if(state==='menu')drawMenu();
  if(state==='levels')drawLevels();
  if(state==='settings')drawSettings();
  if(state==='paused')drawPaused();
  if(state==='dead'){uiRects=[];drawDead();}
  if(state==='cleared')drawCleared();
  if(state==='win')drawWin();
  if(activeTutPrompt&&state==='play'&&!activeTutCard)drawTutPrompt(activeTutPrompt);
  if(activeTutCard)drawTutCard(activeTutCard);
  if(isTutorial&&state==='play'&&!activeTutCard){
    // Floating top hint for tutorial
    ctx.save();ctx.textAlign='center';ctx.fillStyle='rgba(14,2,4,0.72)';
    rrectPath(W/2-170,14,340,30,6);ctx.fill();

    ctx.fillStyle='#ffd76a';ctx.font='bold 11px "Trebuchet MS",sans-serif';
    ctx.fillText('A/D: RUN   SPACE: JUMP(×2)   S: HIDE   E: TAKEDOWN',W/2,33);
    // [ESC] MENU button
    const ex=W-104,ey=14;

    ctx.fillStyle='#ffb45e';ctx.fillText('ESC · MENU',ex+45,33);

}

// until play begins (update passes canSense=false in ready), and mercyT

const tutDone=(()=>{try{return localStorage.getItem('crimsonTutDone')==='1';}catch(e){return false;}})();

}else if(targetLvl!==null&&!isNaN(parseInt(targetLvl,10))){

let prevState=state;
let last=performance.now();
function loop(now){
  let dt=Math.min(0.033,(now-last)/1000);
  last=now;
  tGlobal+=dt;
  try{
    if(state!==prevState){
      if(['brief','ready','play'].includes(state))CG.gameplayStart();
      else CG.gameplayStop();
      prevState=state;
    }
    if(!paused&&!adActive&&!awaitingFocus&&!activeTutCard){
      updateEmbers(dt);
      update(dt);
      Snd.tickMusic(dt);
      let danger=false;
      if(state==='play')for(const g of guards){if(g.state==='chase'){danger=true;break;}}
      Snd.mode=state==='play'?(danger?'tension':'play'):'menu';
    }
    draw();
  }catch(err){
    console.error('Crimson Ronin loop error:',err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
