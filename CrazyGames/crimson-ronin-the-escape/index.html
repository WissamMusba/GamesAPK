<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Crimson Ronin: The Escape</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#3f0404;font-family:"Trebuchet MS","Lucida Sans Unicode",sans-serif;}
  canvas{display:block;touch-action:none;outline:none;}
  *{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
"use strict";
/* ============================================================
   CRIMSON RONIN: THE ESCAPE — v8.2 (keyboard focus fix)
   FIX: A/D now work immediately. The game auto-focuses the canvas
   on load. If the window isn't focused (e.g. inside an iframe),
   a minimal "CLICK TO TAKE CONTROL" prompt appears and dismisses
   on the first click/key, then A/D + SPACE respond instantly.
   ============================================================ */

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
let W=0,H=0,DPR=1,vignette=null;
const lowQuality=(navigator.hardwareConcurrency||4)<=4||window.devicePixelRatio>1.5;
const shadowMul=lowQuality?0:1;
const buttons={left:{x:84,y:0,r:40},right:{x:186,y:0,r:40},jump:{x:0,y:0,r:52},hide:{x:0,y:0,r:36},dash:{x:0,y:0,r:30}};
function layoutButtons(){
  const safe=touch.isTouch?24:0;
  buttons.left.x=84;buttons.left.y=H-84-safe;
  buttons.right.x=188;buttons.right.y=H-84-safe;
  buttons.jump.x=W-92;buttons.jump.y=H-90-safe;
  buttons.hide.x=W-206;buttons.hide.y=H-74-safe;
  buttons.dash.x=W-178;buttons.dash.y=H-178-safe;
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  vignette=ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.35,W/2,H*0.55,Math.max(W,H)*0.78);
  vignette.addColorStop(0,'rgba(0,0,0,0)');
  vignette.addColorStop(1,'rgba(24,0,3,0.55)');
  layoutButtons();
}
window.addEventListener('resize',resize);

const settings={sound:true,shake:true,particles:!lowQuality,hints:true};
try{const s=JSON.parse(localStorage.getItem('crimsonEscapeSettings'));if(s)Object.assign(settings,s);}catch(e){}
function saveSettings(){try{localStorage.setItem('crimsonEscapeSettings',JSON.stringify(settings));}catch(e){}try{CG.saveCloud();}catch(e){}}

const Snd={
  ctx:null,master:null,music:null,sfx:null,ambientGain:null,started:false,
  mode:'menu',dT:0,phraseStep:0,nextNoteTime:0,nextTaikoTime:0,
  scale:[220, 246.94, 261.63, 329.63, 349.23, 440, 493.88, 523.25, 659.25, 698.46, 880],
  // Traditional Hirajōshi melody motifs (A, B, C, E, F)
  motifs:[
    [0, 2, 3, 5, 3, 2, 0, -1],
    [5, 7, 8, 7, 5, 3, 2, -1],
    [3, 5, 7, 5, 3, 2, 0, 2],
    [8, 7, 5, 3, 2, 3, 0, -1],
    [-1, 3, 5, 7, 8, 7, 5, -1]
  ],
  curMotif:0,motifIdx:0,
  unlock(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.85;
      this.master.connect(this.ctx.destination);
      this.music=this.ctx.createGain();this.music.gain.value=0.45;this.music.connect(this.master);
      this.sfx=this.ctx.createGain();this.sfx.gain.value=0.8;this.sfx.connect(this.master);
      this.startAmbientAtmosphere();
    }
    if(this.ctx.state==='suspended')this.ctx.resume();
    this.started=true;
    this.applyMute();
  },
  applyMute(){
    if(!this.master||!this.ctx)return;
    const on=settings.sound&&!Snd.sdkMuted;
    this.master.gain.setTargetAtTime(on?0.85:0.0001,this.ctx.currentTime,0.05);
  },
  sdkMuted:false,
  noiseBuf:null,
  noise(){
    if(this.noiseBuf)return this.noiseBuf;
    if(!this.ctx)return null;
    const b=this.ctx.createBuffer(1,this.ctx.sampleRate*1.5,this.ctx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.7;
    this.noiseBuf=b;return b;
  },
  // Soft ambient drone + distant wind
  startAmbientAtmosphere(){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    // Warm harmonic root pad (gentle sine chord, filtered)
    const freqs=[110, 164.81, 220]; // A2, E3, A3
    freqs.forEach((f, i)=>{
      const osc=this.ctx.createOscillator();
      const g=this.ctx.createGain();
      const flt=this.ctx.createBiquadFilter();
      osc.type='sine';
      osc.frequency.setValueAtTime(f, t);
      flt.type='lowpass';
      flt.frequency.setValueAtTime(260+i*60, t);
      // Gentle slow breathing tremolo
      const lfo=this.ctx.createOscillator();
      const lfoG=this.ctx.createGain();
      lfo.frequency.setValueAtTime(0.08+i*0.03, t);
      lfoG.gain.setValueAtTime(0.015, t);
      lfo.connect(lfoG);
      lfoG.connect(g.gain);
      g.gain.setValueAtTime(0.035/(i+1), t);
      osc.connect(flt);
      flt.connect(g);
      g.connect(this.music);
      osc.start(t);
      lfo.start(t);
    });
    // Soft twilight wind texture
    const nBuf=this.noise();
    if(nBuf){
      const src=this.ctx.createBufferSource();
      src.buffer=nBuf;
      src.loop=true;
      const f=this.ctx.createBiquadFilter();
      f.type='bandpass';
      f.frequency.setValueAtTime(320, t);
      f.Q.setValueAtTime(1.8, t);
      const wg=this.ctx.createGain();
      wg.gain.setValueAtTime(0.018, t);
      // Slow sweep
      const wLfo=this.ctx.createOscillator();
      const wLfoG=this.ctx.createGain();
      wLfo.frequency.setValueAtTime(0.05, t);
      wLfoG.gain.setValueAtTime(140, t);
      wLfo.connect(wLfoG);
      wLfoG.connect(f.frequency);
      src.connect(f);
      f.connect(wg);
      wg.connect(this.music);
      src.start(t);
      wLfo.start(t);
    }
  },
  // Koto / Shamisen plucked string synth
  pluck(freq, vol, at, bright=false){
    if(!this.ctx||!settings.sound||this.sdkMuted)return;
    const t=this.ctx.currentTime+(at||0);
    // Fundamental + subtle harmonic
    const osc=this.ctx.createOscillator();
    const osc2=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    const flt=this.ctx.createBiquadFilter();
    osc.type='triangle';
    osc.frequency.setValueAtTime(freq, t);
    osc2.type='sine';
    osc2.frequency.setValueAtTime(freq*2.002, t);
    flt.type='lowpass';
    flt.frequency.setValueAtTime(bright?2400:1600, t);
    flt.frequency.exponentialRampToValueAtTime(120, t+0.8);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol||0.06, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.95);
    osc.connect(flt);
    osc2.connect(flt);
    flt.connect(g);
    g.connect(this.music);
    osc.start(t);
    osc2.start(t);
    osc.stop(t+1.05);
    osc2.stop(t+1.05);
    osc.onended=()=>{try{osc.disconnect();osc2.disconnect();flt.disconnect();g.disconnect();}catch(e){}};
  },
  // Deep Japanese Taiko Drum hit
  taiko(vol, at, deep=false){
    if(!this.ctx||!settings.sound||this.sdkMuted)return;
    const t=this.ctx.currentTime+(at||0);
    const osc=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    osc.type='sine';
    const startF=deep?100:130;
    const endF=deep?32:42;
    osc.frequency.setValueAtTime(startF, t);
    osc.frequency.exponentialRampToValueAtTime(endF, t+0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol||0.12, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.32);
    osc.connect(g);
    g.connect(this.music);
    osc.start(t);
    osc.stop(t+0.36);
    // Subtle wooden rim crack
    const nBuf=this.noise();
    if(nBuf){
      const src=this.ctx.createBufferSource();
      src.buffer=nBuf;
      const f=this.ctx.createBiquadFilter();
      f.type='bandpass';
      f.frequency.setValueAtTime(1400, t);
      f.Q.setValueAtTime(2.5, t);
      const ng=this.ctx.createGain();
      ng.gain.setValueAtTime((vol||0.12)*0.35, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t+0.04);
      src.connect(f);f.connect(ng);ng.connect(this.music);
      src.start(t);src.stop(t+0.05);
    }
  },
  // Play atmospheric musical score
  tickMusic(dt){
    if(!this.ctx||!this.started)return;
    this.dT+=dt;
    const isTension=this.mode==='tension';
    const isMenu=this.mode==='menu';
    const noteInterval=isTension?0.28:(isMenu?0.85:0.52);
    // Play melody motif progression
    if(this.dT>=this.nextNoteTime){
      this.nextNoteTime=this.dT+noteInterval;
      const motif=this.motifs[this.curMotif%this.motifs.length];
      const noteIdx=motif[this.motifIdx];
      if(noteIdx>=0&&noteIdx<this.scale.length){
        const f=this.scale[noteIdx];
        this.pluck(f, isTension?0.07:(isMenu?0.045:0.055), 0, isTension);
      }
      this.motifIdx++;
      if(this.motifIdx>=motif.length){
        this.motifIdx=0;
        if(Math.random()<0.45){
          this.curMotif=(this.curMotif+1+Math.floor(Math.random()*3))%this.motifs.length;
        }
        // Small breathing rest between phrases
        this.nextNoteTime+=isMenu?1.2:(isTension?0.25:0.6);
      }
    }
    // Taiko heartbeat rhythm during gameplay
    if(!isMenu&&this.dT>=this.nextTaikoTime){
      const taikoInterval=isTension?0.56:1.04;
      this.nextTaikoTime=this.dT+taikoInterval;
      this.taiko(isTension?0.12:0.07, 0, true);
      if(isTension){
        this.taiko(0.06, 0.28, false);
      }
    }
  },
  tone(o){
    if(!this.ctx||!settings.sound||this.sdkMuted)return;
    const t=this.ctx.currentTime+(o.at||0);
    const osc=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f,t);
    if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.dur||0.2));
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(o.vol||0.15,t+(o.a||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001,t+(o.dur||0.2));
    let node=osc;
    if(o.lp){const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.lp,t);osc.connect(f);node=f;}
    node.connect(g);g.connect(this.sfx);
    osc.start(t);osc.stop(t+(o.dur||0.2)+0.05);
    osc.onended=()=>{try{osc.disconnect();g.disconnect();if(node!==osc)node.disconnect();}catch(e){}};
  },
  hiss(o){
    if(!this.ctx||!settings.sound||this.sdkMuted)return;
    const t=this.ctx.currentTime+(o.at||0);
    const nBuf=this.noise();
    if(!nBuf)return;
    const src=this.ctx.createBufferSource();src.buffer=nBuf;
    const f=this.ctx.createBiquadFilter();f.type=o.ft||'bandpass';
    f.frequency.setValueAtTime(o.f||800,t);
    if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.dur||0.2));
    f.Q.setValueAtTime(o.q||1.2,t);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(o.vol||0.12,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(o.dur||0.2));
    src.connect(f);f.connect(g);g.connect(this.sfx);
    src.start(t);src.stop(t+(o.dur||0.2)+0.05);
    src.onended=()=>{try{src.disconnect();f.disconnect();g.disconnect();}catch(e){}};
  },
  // Character & gameplay SFX
  jump(){
    this.hiss({f:600,f2:1400,dur:0.12,vol:0.08,ft:'bandpass'});
    this.tone({type:'sine',f:240,f2:460,dur:0.13,vol:0.12});
  },
  doubleJump(){
    this.hiss({f:900,f2:2200,dur:0.14,vol:0.09,ft:'bandpass'});
    this.tone({type:'sine',f:360,f2:720,dur:0.14,vol:0.12});
  },
  land(){
    this.hiss({f:280,f2:80,dur:0.09,vol:0.07,ft:'lowpass'});
    this.tone({type:'sine',f:110,f2:48,dur:0.10,vol:0.15});
  },
  step(){
    this.hiss({f:320+Math.random()*120,dur:0.035,vol:0.02,ft:'lowpass'});
  },
  dash(){
    // Razor katana wind slash
    this.hiss({f:2600,f2:500,dur:0.2,vol:0.16,ft:'bandpass',q:2});
    this.tone({type:'sine',f:440,f2:220,dur:0.15,vol:0.08});
  },
  slash(){
    // Swift katana strike & takedown
    this.hiss({f:3200,f2:400,dur:0.22,vol:0.24,ft:'bandpass',q:2.5});
    this.tone({type:'triangle',f:360,f2:110,dur:0.18,vol:0.18});
    this.taiko(0.28, undefined, true);
  },
  death(){
    // Cinematic dramatic hit
    this.tone({type:'triangle',f:180,f2:40,dur:0.65,vol:0.25,lp:500});
    this.hiss({f:700,f2:80,dur:0.5,vol:0.14,ft:'lowpass'});
  },
  key(){
    // Mystical ascending koto chime
    [440, 523.25, 659.25, 880].forEach((f,i)=>{
      this.tone({type:'sine',f,dur:0.35,vol:0.11,at:i*0.065});
    });
  },
  orb(){
    // Crystal sparkle
    this.tone({type:'sine',f:880,f2:1320,dur:0.16,vol:0.09});
    this.tone({type:'sine',f:1760,dur:0.2,vol:0.05,at:0.04});
  },
  hide(){
    this.hiss({f:1100,f2:250,dur:0.16,vol:0.08,ft:'lowpass'});
  },
  unhide(){
    this.hiss({f:250,f2:1100,dur:0.14,vol:0.08,ft:'bandpass'});
  },
  alert(){
    // Subtle tense woodblock suspense
    this.tone({type:'triangle',f:280,f2:140,dur:0.18,vol:0.14,lp:600});
  },
  alarm(){
    // Pulsing alert beat
    for(let i=0;i<3;i++){
      this.tone({type:'sine',f:520,dur:0.08,vol:0.08,at:i*0.18});
      this.tone({type:'sine',f:660,dur:0.08,vol:0.08,at:i*0.18+0.09});
    }
  },
  spotted(){
    // Dramatic tension sting
    this.tone({type:'sawtooth',f:440,f2:330,dur:0.22,vol:0.09,lp:800});
    this.tone({type:'sine',f:660,f2:440,dur:0.22,vol:0.08});
  },
  plate(){
    this.tone({type:'sine',f:160,f2:90,dur:0.08,vol:0.1});
  },
  doorOpen(){
    [220, 261.63, 329.63, 440].forEach((f,i)=>{
      this.tone({type:'sine',f,dur:0.55,vol:0.08,at:i*0.08});
    });
  },
  clear(){
    // Harmonic Hirajōshi victory flourish
    [329.63, 440, 523.25, 659.25, 880].forEach((f,i)=>{
      this.tone({type:'triangle',f,dur:0.35,vol:0.11,at:i*0.08});
    });
  },
  perfect(){
    [329.63, 440, 523.25, 659.25, 698.46, 880, 1046.5].forEach((f,i)=>{
      this.tone({type:'triangle',f,dur:0.42,vol:0.12,at:i*0.07});
    });
  },
  revive(){
    [220, 329.63, 440].forEach((f,i)=>{
      this.tone({type:'sine',f,dur:0.45,vol:0.09,at:i*0.1});
    });
  },
  ui(){
    this.tone({type:'triangle',f:600,dur:0.04,vol:0.06,lp:1200});
  },
  star(i){
    this.tone({type:'sine',f:523.25+i*130.8,dur:0.26,vol:0.1});
  },
  crumble(){
    this.hiss({f:380,f2:80,dur:0.28,vol:0.12,ft:'lowpass'});
    this.tone({type:'sine',f:90,f2:40,dur:0.22,vol:0.1});
  },
  checkpoint(){
    // Singing bowl resonance
    this.tone({type:'sine',f:440,dur:0.6,vol:0.12});
    this.tone({type:'sine',f:659.25,dur:0.5,vol:0.08,at:0.06});
  }
};
function audioGesture(){Snd.unlock();}
function applySdkMute(muted){Snd.sdkMuted=!!muted;Snd.applyMute();}

let paused=false,adPending=false,adActive=false,cgFailMsg='';
let lastMidAdAt=0,deathsSinceAd=0;
const CG={
  ready:false,env:'',cloudLoaded:false,
  boot(){
    return new Promise(resolve=>{
      const sdk=window.CrazyGames&&window.CrazyGames.SDK;
      if(!sdk||!sdk.init){resolve();return;}
      try{sdk.game.loadingStart();}catch(e){}
      sdk.init().then(()=>{
        this.ready=true;
        try{this.env=sdk.environment||'';}catch(e){}
        try{sdk.game.loadingStop();}catch(e){}
        try{
          const st=sdk.game.settings;
          if(st)applySdkMute(st.muteAudio);
          sdk.game.addSettingsChangeListener(s=>applySdkMute(s&&s.muteAudio));
        }catch(e){}
        this.loadCloud().catch(()=>{}).finally(()=>resolve());
        setTimeout(resolve,2000);
      }).catch(()=>{resolve();});
    });
  },
  ok(){return this.ready&&(this.env==='local'||this.env==='crazygames');},
  gameplayStart(){try{if(this.ok())window.CrazyGames.SDK.game.gameplayStart();}catch(e){}},
  gameplayStop(){try{if(this.ok())window.CrazyGames.SDK.game.gameplayStop();}catch(e){}},
  happytime(){try{if(this.ok())window.CrazyGames.SDK.game.happytime();}catch(e){}},
  setContext(o){try{if(this.ok())window.CrazyGames.SDK.game.setGameContext(o);}catch(e){}},
  clearContext(){try{if(this.ok())window.CrazyGames.SDK.game.clearGameContext();}catch(e){}},
  saveCloudTimer:null,
  cloudKey:'crimson_ronin_save_v1',
  cloudPayload(){
    try{return JSON.stringify({stars:progress.stars,times:progress.times,best:best,settings:settings});}catch(e){return '';}
  },
  saveCloud(){
    if(!this.ok())return;
    try{clearTimeout(this.saveCloudTimer);}catch(e){}
    this.saveCloudTimer=setTimeout(()=>{
      try{
        const payload=this.cloudPayload();
        if(!payload)return;
        // CrazyGames SDK v3 Data Module: data.saveItem(key, value)
        window.CrazyGames.SDK.data.saveItem(this.cloudKey,payload).catch(()=>{});
      }catch(e){}
    },1000);
  },
  loadCloud(){
    if(!this.ok())return Promise.resolve();
    try{
      // CrazyGames SDK v3 Data Module: data.requestItem(key) -> Promise<string>
      return window.CrazyGames.SDK.data.requestItem(this.cloudKey).then(v=>{
        if(!v)return;
        try{
          const d=JSON.parse(v);
          if(!d||typeof d!=='object')return;
          if(d.stars)for(let i=0;i<NLV;i++){
            progress.stars[i]=Math.max(progress.stars[i]||0,d.stars[i]||0);
            const ct=(d.times&&d.times[i])||0;
            if(ct>0&&(progress.times[i]===0||ct<progress.times[i]))progress.times[i]=ct;
          }
          if(d.best&&d.best>best)best=d.best;
          // settings: local wins unless cloud has them (local already loaded at boot;
          // fill only keys missing locally). Never override a local value.
          if(d.settings&&typeof d.settings==='object'){
            let touched=false;
            for(const k of ['sound','shake','particles','hints']){
              if(typeof settings[k]==='undefined'&&typeof d.settings[k]!=='undefined'){settings[k]=d.settings[k];touched=true;}
            }
            if(touched){try{localStorage.setItem('crimsonEscapeSettings',JSON.stringify(settings));}catch(e){}}
          }
          this.cloudLoaded=true;
          // write merged result back to local so offline play keeps the best of both
          try{localStorage.setItem('crimsonEscapeProgress',JSON.stringify(progress));}catch(e){}
          try{localStorage.setItem('crimsonEscapeBest',String(best));}catch(e){}
        }catch(e){}
      }).catch(()=>{});
    }catch(e){return Promise.resolve();}
  },
  requestAd(type,cbs){
    cbs=cbs||{};
    if(!this.ok()){if(cbs.adError)cbs.adError({reason:'nosdk'});return;}
    this.gameplayStop();
    try{
      window.CrazyGames.SDK.ad.requestAd(type,{
        adStarted:()=>{
          adActive=true;paused=true;
          if(Snd.master&&Snd.ctx)Snd.master.gain.setTargetAtTime(0.0001,Snd.ctx.currentTime,0.05);
          try{cbs.adStarted&&cbs.adStarted();}catch(e){}
        },
        adFinished:()=>{
          adActive=false;paused=false;
          Snd.applyMute();
          if(['brief','ready','play'].includes(state))this.gameplayStart();
          try{cbs.adFinished&&cbs.adFinished();}catch(e){}
        },
        adError:(err)=>{
          adActive=false;paused=false;
          Snd.applyMute();
          if(['brief','ready','play'].includes(state))this.gameplayStart();
          try{cbs.adError&&cbs.adError(err);}catch(e){}
        }
      });

function adMidgameOnDeath(){
  if(adActive||adPending)return;
  if(!reviveUsed)return;
  if(deathsSinceAd<3)return;
  if(Date.now()-lastMidAdAt<60000)return;
  deathsSinceAd=0;lastMidAdAt=Date.now();
  CG.requestAd('midgame',{});
}
function reviveWithAd(){
  if(reviveUsed||state!=='dead'||adPending||adActive)return;
  Snd.ui();
  if(!window.CrazyGames||!window.CrazyGames.SDK){doRevive();return;}
  adPending=true;cgFailMsg='';
  CG.requestAd('rewarded',{
    adFinished:()=>{adPending=false;doRevive();},
    adError:()=>{adPending=false;cgFailMsg='NO AD AVAILABLE — RESTART FOR FREE';}
  });
}

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const pad=n=>String(Math.max(0,Math.floor(n))).padStart(6,'0');
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
function rrectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fmtTime(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');}
function fmtTimeMs(t){const m=Math.floor(t/60),s=Math.floor(t%60),d=Math.floor((t%1)*10);
  return m+':'+String(s).padStart(2,'0')+'.'+d;}
function pointInPlat(x,y){
  for(const p of plats){
    if(!platSolid(p))continue;
    if(x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h)return true;
  }
  return false;
}
function platSolid(p){return !(p.t==='vanish'&&p.vState==='gone');}
function inView(x,y,w=100,h=100){
  return x+w>camX-100&&x<camX+W+100&&y+h>camY-100&&y<camY+H+100;
}

function makeTextures(){
  texStone=document.createElement('canvas');texStone.width=128;texStone.height=48;
  let g=texStone.getContext('2d');
  g.fillStyle='#241016';g.fillRect(0,0,128,48);
  for(let i=0;i<90;i++){
    g.fillStyle='rgba('+(20+Math.random()*30)+','+(6+Math.random()*10)+','+(10+Math.random()*12)+',0.5)';
    g.fillRect(Math.random()*128,Math.random()*48,2+Math.random()*5,1+Math.random()*3);
  }
  g.strokeStyle='rgba(0,0,0,0.5)';g.lineWidth=1.5;
  for(let x=0;x<128;x+=32){g.beginPath();g.moveTo(x+16,0);g.lineTo(x+12,48);g.stroke();}
  g.beginPath();g.moveTo(0,24);g.lineTo(128,26);g.stroke();
  g.fillStyle='rgba(255,120,70,0.08)';
  g.fillRect(0,0,128,3);

  texGround=document.createElement('canvas');texGround.width=256;texGround.height=128;
  g=texGround.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,'#2a0a0a');gr.addColorStop(0.25,'#160404');gr.addColorStop(1,'#060101');
  g.fillStyle=gr;g.fillRect(0,0,256,128);
  for(let i=0;i<260;i++){
    g.fillStyle='rgba('+(30+Math.random()*40)+','+(8+Math.random()*10)+','+(8+Math.random()*10)+',0.4)';
    g.fillRect(Math.random()*256,Math.random()*128,1+Math.random()*4,1+Math.random()*3);
  }
  g.strokeStyle='rgba(0,0,0,0.55)';g.lineWidth=1;
  for(let i=0;i<8;i++){
    g.beginPath();
    g.moveTo(Math.random()*256,8);
    g.lineTo(Math.random()*256,128);
    g.stroke();
  }

  texWood=document.createElement('canvas');texWood.width=64;texWood.height=64;
  g=texWood.getContext('2d');
  g.fillStyle='#2a1512';g.fillRect(0,0,64,64);
  g.strokeStyle='rgba(0,0,0,0.5)';g.lineWidth=2;
  for(let y=8;y<64;y+=16){g.beginPath();g.moveTo(0,y);g.lineTo(64,y);g.stroke();}
  g.beginPath();g.moveTo(32,0);g.lineTo(32,64);g.stroke();
  for(let i=0;i<40;i++){
    g.fillStyle='rgba(60,30,20,0.35)';
    g.fillRect(Math.random()*64,Math.random()*64,3,1);
  }
}

// Sync custom levels created in the Level Editor if available
function syncCustomLevelsFromStorage(){
  try {
    const savedEditorLevels = localStorage.getItem('crimson_ronin_editor_levels_v1');
    if (!savedEditorLevels) return;
    const parsed = JSON.parse(savedEditorLevels);
    if (!Array.isArray(parsed) || parsed.length === 0) return;

    function convertEditorLevel(el) {
      const plats = [];
      (el.platforms || []).forEach(p => {
        if (p.y >= 610 && p.h >= 100 && p.w >= 2000) return;
        let t = 'n';
        if (p.platType === 'ash' || p.isAsh) t = 'slow';
        else if (p.platType === 'crumble' || p.isCrumble) t = 'vanish';
        plats.push({
          x: p.x, y: p.y, w: p.w, h: p.h, t: t,
          initiallyHidden: !!p.initiallyHidden,
          collapseDelay: p.collapseDelay !== undefined ? p.collapseDelay : 0.45,
          respawnDelay: p.respawnDelay !== undefined ? p.respawnDelay : 3.0,
          triggerTutorial: p.triggerTutorial || false,
          tutTitle: p.tutTitle || 'CRUMBLING PLATFORM!',
          tutText: p.tutText || 'This ancient stone platform collapses under your weight!\nLeap quickly before it gives way!',
          tutKanji: p.tutKanji || '崩'
        });
      });
      return {
        name: el.name || 'CUSTOM LEVEL',
        w: Math.max(2400, (el.exit ? el.exit.x + 300 : 2400)),
        par: 35,
        spawnX: el.spawn ? el.spawn.x : 80,
        spawnY: el.spawn ? el.spawn.y : 564,
        plats: plats,
        spikes: (el.spikes || []).map(s => ({ x: s.x, w: s.w, y: s.y !== undefined ? s.y : G })),
        blades: [],
        plates: (el.plates || []).map(p => {
          const elevatedPlats = (el.platforms || []).filter(pl => !(pl.y >= 610 && pl.h >= 100 && pl.w >= 2000));
          let mappedTargetIdx = -1;
          let targetPlatX = p.targetPlatX;
          let targetPlatY = p.targetPlatY;
          if (p.targetPlatIndex !== undefined && p.targetPlatIndex !== null && p.targetPlatIndex >= 0 && el.platforms && el.platforms[p.targetPlatIndex]) {
            const tPlat = el.platforms[p.targetPlatIndex];
            targetPlatX = tPlat.x;
            targetPlatY = tPlat.y;
            mappedTargetIdx = elevatedPlats.indexOf(tPlat);
          }
          return {
            x: p.x,
            y: p.y !== undefined ? p.y : G,
            w: p.w || 38,
            rearmDelay: p.rearmDelay !== undefined ? p.rearmDelay : 1.0,
            spikeTrigger: p.spikeTrigger !== undefined ? p.spikeTrigger : (p.targetType === 'spike' || p.fx === 'spike' || (!p.targetType && !p.fx)),
            spikeMode: p.spikeMode || (p.spikeX !== undefined ? 'custom' : 'behind'),
            spikeX: p.spikeX,
            spikeY: p.spikeY,
            spikeDelay: p.spikeDelay !== undefined ? p.spikeDelay : 0.6,
            alarmTrigger: p.alarmTrigger !== undefined ? p.alarmTrigger : (p.targetType === 'alarm' || p.fx === 'alarm'),
            alarmDelay: p.alarmDelay !== undefined ? p.alarmDelay : 0.0,
            
            platTrigger: p.platTrigger !== undefined ? p.platTrigger : (p.vanishTrigger !== undefined ? p.vanishTrigger : (p.targetType === 'vanish' || p.targetType === 'spawn' || p.fx === 'vanish' || p.fx === 'spawn')),
            platAction: p.platAction || (p.targetType === 'spawn' || p.fx === 'spawn' ? 'spawn' : 'vanish'),
            targetPlatIndex: mappedTargetIdx >= 0 ? mappedTargetIdx : (p.targetPlatIndex !== undefined ? p.targetPlatIndex : (p.targetIdx !== undefined ? p.targetIdx : -1)),
            targetPlatX: targetPlatX,
            targetPlatY: targetPlatY,
            platDelay: p.platDelay !== undefined ? p.platDelay : (p.vanishDelay !== undefined ? p.vanishDelay : 0.0),
            platDuration: p.platDuration !== undefined ? p.platDuration : 4.0,

          vanishTrigger: p.platTrigger !== undefined ? p.platTrigger : (p.vanishTrigger !== undefined ? p.vanishTrigger : (p.targetType === 'vanish' || p.fx === 'vanish')),
          vanishDelay: p.platDelay !== undefined ? p.platDelay : (p.vanishDelay !== undefined ? p.vanishDelay : 0.0),

          triggerTutorial: p.triggerTutorial || false,
          tutTitle: p.tutTitle || 'PRESSURE PLATE TRIGGERED!',
          tutText: p.tutText || 'You just stepped on a pressure plate!\nA deadly trap spike will thrust out of the ground behind you in 0.6s!\nLEAP FORWARD IMMEDIATELY to avoid getting impaled!',
          tutKanji: p.tutKanji || '罠'
          };
        }),
        fires: [],
        spots: [],
        towers: (el.towers || []).map(t => ({
          x: t.x,
          y: t.y !== undefined ? t.y : (t.mount === 'top' ? 0 : G),
          mount: t.mount || (t.isCeiling ? 'top' : 'bottom'),
          x1: t.minX !== undefined ? t.minX : (t.x1 !== undefined ? t.x1 : t.x - 150),
          x2: t.maxX !== undefined ? t.maxX : (t.x2 !== undefined ? t.x2 : t.x + 150),
          ty: t.ty !== undefined ? t.ty : G,
          speed: t.speed || 0.55,
          alertTime: t.alertTime !== undefined ? t.alertTime : (t.spotlightTime !== undefined ? t.spotlightTime : 1.1),
          beamSpread: t.beamSpread || 54
        })),
        guards: (el.guards || []).filter(g => (g.x || 0) >= 200).map(g => ({
          type: g.speed > 1.8 ? 'runner' : (g.speed === 0 ? 'watcher' : 'walker'),
          x: Math.max(200, g.x || 200),
          y: g.y,
          minX: Math.max(180, g.minX !== undefined ? g.minX : (g.x - 150)),
          maxX: Math.max(220, g.maxX !== undefined ? g.maxX : (g.x + 150)),
          range: g.visionLen || 200,
          speed: g.speed || 1.2,
          dir: g.dir || 1
        })),
        crates: [],
        bushes: (el.bushes || []).map(b => (typeof b === 'object' ? b.x : b)),
        keys: (el.keys || []).map(k => ({ x: k.x, y: k.y })),
        doorX: el.exit ? el.exit.x : 2200,
        orbs: (el.ki || []).map(k => [k.x, k.y]),
        signs: (el.texts || []).map(t => [t.x, t.y, t.text]),
        tutorialCards: (el.tutorialCards || []).map(c => ({
          id: c.id || ('tut_' + Math.random().toString(36).substring(2, 6)),
          title: c.title || 'TUTORIAL INSTRUCTION',
          tag: c.tag || 'TRAINING',
          kanji: c.kanji || '訓',
          text: c.text || '',
          triggerMode: c.triggerMode || 'auto',
          trigger: c.trigger || { x: c.x || 0, y: c.y || 400, w: c.w || 200, h: c.h || 200 }
        }))
      };
    }

    const tut = parsed.find(l => l.isTutorial);
    if (tut) {
      const convertedTut = convertEditorLevel(tut);
      for (const k in TUTORIAL_LEVEL) delete TUTORIAL_LEVEL[k];
      Object.assign(TUTORIAL_LEVEL, convertedTut);
    }
    const normal = parsed.filter(l => !l.isTutorial);
    if (normal.length > 0) {
      LEVELS.length = 0;
      normal.forEach(l => LEVELS.push(convertEditorLevel(l)));
      NLV = LEVELS.length;
    }
  } catch(err) {
    console.warn('Error syncing custom levels:', err);
  }
}

class Particle{
  constructor(o){
    this.x=0;this.y=0;this.vx=0;this.vy=0;this.size=4;this.life=0.5;
    this.color='#fff';this.grav=0;this.type='sq';this.r=6;this.vr=300;
    Object.assign(this,o);this.max=this.life;
  }
  update(dt){
    this.life-=dt;
    if(this.type==='ring')this.r+=this.vr*dt;
    else{this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=this.grav*dt;}
  }
  draw(){
    const a=clamp(this.life/this.max,0,1);
    if(this.type==='ring'){
      ctx.globalAlpha=a;ctx.strokeStyle=this.color;ctx.lineWidth=3*shadowMul||1;
      ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.stroke();
      ctx.globalAlpha=1;return;
    }
    ctx.globalAlpha=a;ctx.fillStyle=this.color;
    ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);
    ctx.globalAlpha=1;
  }
}
class FloatText{
  constructor(x,y,txt,color){this.x=x;this.y=y;this.txt=txt;this.color=color||'#ffd76a';this.life=1.0;this.max=1.0;}
  update(dt){this.life-=dt;this.y-=44*dt;}
  draw(){
    ctx.globalAlpha=clamp(this.life/this.max,0,1);
    ctx.fillStyle=this.color;ctx.font='400 22px "Impact","Arial Black",sans-serif';
    ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=5*shadowMul;
    ctx.fillText(this.txt,this.x,this.y);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}

function soundAlarm(ax){

      g.state='chase';g.alarmT=3.5;

    }
  }

function towerAlarm(tower){
  Snd.spotted();
  const px=player.x+player.w/2,py=player.y+player.h;
  texts.push(new FloatText(tower.x,tower.topY()-16,'SPOTTED!','#ff5340'));
  if(settings.particles)parts.push(new Particle({type:'ring',x:px,y:py-20,color:'rgba(255,80,50,0.85)',life:0.5,vr:520}));
  const byDist=(a,b)=>Math.abs(a.x-px)-Math.abs(b.x-px);
  const left=guards.filter(g=>g.type!=='watcher'&&g.x<px&&Math.abs(g.x-px)<650).sort(byDist);
  const right=guards.filter(g=>g.type!=='watcher'&&g.x>=px&&Math.abs(g.x-px)<650).sort(byDist);
  const chosen=[];
  if(left.length)chosen.push(left[0]);
  if(right.length)chosen.push(right[0]);
  for(const g of chosen){
    g.state='chase';
    g.lastSeen={x:px,y:py};
    g.alarmT=4.0;
  }
}

class Plate{
  constructor(d,fx,y){
    if(typeof d==='object'){
      this.x=d.x;
      this.y=(d.y!==undefined?d.y:G);
      this.w=d.w||38;

      this.spikeX=d.spikeX!==undefined?d.spikeX:d.x;
      this.spikeY=d.spikeY!==undefined?d.spikeY:this.y;
      this.spikeDelay=d.spikeDelay!==undefined?d.spikeDelay:0.6;
      this.alarmTrigger=d.alarmTrigger!==undefined?d.alarmTrigger:(d.fx==='alarm');
      this.alarmDelay=d.alarmDelay!==undefined?d.alarmDelay:0.0;
      
      this.platTrigger=d.platTrigger!==undefined?d.platTrigger:(d.vanishTrigger!==undefined?d.vanishTrigger:(d.fx==='vanish'||d.fx==='spawn'));
      this.platAction=d.platAction||(d.fx==='spawn'?'spawn':'vanish');
      this.targetPlatIndex=d.targetPlatIndex!==undefined?d.targetPlatIndex:(d.targetIdx!==undefined?d.targetIdx:-1);
      this.targetPlatX=d.targetPlatX;
      this.targetPlatY=d.targetPlatY;
      this.platDelay=d.platDelay!==undefined?d.platDelay:(d.vanishDelay!==undefined?d.vanishDelay:0.0);
      this.platDuration=d.platDuration!==undefined?d.platDuration:4.0;
      this.rearmDelay=d.rearmDelay!==undefined?d.rearmDelay:(d.cooldownTime!==undefined?d.cooldownTime:1.0);

      this.triggerTutorial=d.triggerTutorial||false;
      this.tutTitle=d.tutTitle||'PRESSURE PLATE TRIGGERED!';
      this.tutText=d.tutText||'You just stepped on a pressure plate!\nA deadly trap spike will thrust out of the ground behind you in 0.6s!\nLEAP FORWARD IMMEDIATELY to avoid getting impaled!';
      this.tutKanji=d.tutKanji||'罠';
    }else{
      this.x=d;
      this.fx=fx||'spike';
      this.y=(y!==undefined?y:G);
      this.w=38;
      this.spikeTrigger=this.fx==='spike';
      this.spikeMode='behind';
      this.spikeX=this.x;
      this.spikeY=this.y;
      this.spikeDelay=0.6;
      this.alarmTrigger=this.fx==='alarm';
      this.alarmDelay=0.0;
      this.platTrigger=this.fx==='vanish'||this.fx==='spawn';
      this.platAction=this.fx==='spawn'?'spawn':'vanish';
      this.targetPlatIndex=-1;
      this.platDelay=0.0;
      this.platDuration=4.0;
      this.triggerTutorial=false;
      this.tutTitle='PRESSURE PLATE TRIGGERED!';
      this.tutText='You just stepped on a pressure plate!\nA deadly trap spike will thrust out of the ground behind you in 0.6s!\nLEAP FORWARD IMMEDIATELY to avoid getting impaled!';
      this.tutKanji='罠';
    }
    this.state='idle';
    this.t=0;
    this.seen=false;
    this.dir=1;
    this.spikeTimer=-1;
    this.alarmTimer=-1;
    this.platTimer=-1;
    this.rearmTimer=0;
  }
  getHostPlatform(){
    for(let i=1;i<plats.length;i++){
      const p=plats[i];
      if(this.x>=p.x-10 && this.x<=p.x+p.w+10 && Math.abs(this.y-p.y)<8){
        return p;
      }
    }
    return null;
  }
  update(dt){
    const host=this.getHostPlatform();
    if(host && (host.vState==='gone'||host.vState==='hidden')){
      return; // Plate is on a hidden platform: completely disabled
    }
    if(this.rearmTimer>0){
      this.rearmTimer-=dt;
    }
    if(this.state==='armed'){
      if(this.spikeTimer>=0){
        this.spikeTimer-=dt;
        if(this.spikeTimer<=0){
          this.spikeTimer=-1;
          const isCustom=this.spikeMode==='custom'&&this.spikeX!==undefined;
          const sx=isCustom?this.spikeX:this.x;
          const sy=isCustom&&this.spikeY!==undefined?this.spikeY:this.y;
          trapSpikes.push(new TrapSpike(sx,this.dir,sy,isCustom));
        }
      }
      if(this.alarmTimer>=0){
        this.alarmTimer-=dt;
        if(this.alarmTimer<=0){
          this.alarmTimer=-1;
          soundAlarm(this.x);
        }
      }
      if(this.platTimer>=0){
        this.platTimer-=dt;
        if(this.platTimer<=0){
          this.platTimer=-1;
          let target=null;
          // Method 1: Match by exact coordinate if stored
          if(this.targetPlatX!==undefined && this.targetPlatY!==undefined){
            target=plats.find(pl=>Math.abs(pl.x-this.targetPlatX)<6 && Math.abs(pl.y-this.targetPlatY)<6);
          }
          // Method 2: Match by targetPlatIndex
          if(!target && this.targetPlatIndex>=0){
            if(plats[this.targetPlatIndex+1]) target=plats[this.targetPlatIndex+1];
            else if(plats[this.targetPlatIndex]) target=plats[this.targetPlatIndex];
          }
          // Method 3: Fallback to closest platform that is not ground
          if(!target){
            let bd=1e9;
            for(let pi=1;pi<plats.length;pi++){
              const p=plats[pi];
              if(p.y>=G)continue;
              const d=Math.hypot((p.x+p.w/2)-this.x,(p.y+p.h/2)-this.y);
              if(d<bd){bd=d;target=p;}
            }
          }
          if(target){
            if(this.platAction==='spawn'){
              target.vState='solid';
              target.spawnTimer=this.platDuration>0?this.platDuration:999999;
              Snd.doubleJump();
              burstDust(target.x+target.w/2,target.y+target.h/2,10);
              texts.push(new FloatText(target.x+target.w/2,target.y-24,'PLATFORM SPAWNED!','#00d2d3'));
            }else{
              target.vState='gone';
              target.vT=this.platDuration>0?this.platDuration:3.2;
              Snd.crumble();
              burstDust(target.x+target.w/2,target.y+target.h/2,8);
              texts.push(new FloatText(target.x+target.w/2,target.y-24,'COLLAPSED!','#e74c3c'));
            }
          }
        }
      }
      if(this.spikeTimer<0&&this.alarmTimer<0&&this.platTimer<0){
        this.state='idle';
        this.rearmTimer=this.rearmDelay>0?this.rearmDelay:1.0;
      }
    }
    if(state==='play'&&mercyT<=0&&!player.hidden&&this.state==='idle'&&this.rearmTimer<=0&&player.onGround){
      const platY=player.standPlat?player.standPlat.y:G;
      const expectedY=this.y;
      const onThisPlat=Math.abs(platY-expectedY)<6;
      if(onThisPlat&&Math.abs(player.x+player.w/2-this.x)<(this.w/2+3)){
        this.state='armed';this.seen=true;this.dir=player.facing;
        this.spikeTimer=this.spikeTrigger?Math.max(0.01,this.spikeDelay):-1;
        this.alarmTimer=this.alarmTrigger?Math.max(0.01,this.alarmDelay):-1;
        this.platTimer=this.platTrigger?Math.max(0.01,this.platDelay):-1;
        Snd.plate();
        texts.push(new FloatText(this.x,this.y-26,'click...','rgba(255,150,120,0.9)'));
        if((this.triggerTutorial && !tutTriggered['plate_'+this.x]) || (isTutorial && !tutTriggered['plate_tut_intro'])){
          tutTriggered['plate_tut_intro']=true;
          if(this.triggerTutorial) tutTriggered['plate_'+this.x]=true;
          activeTutCard={
            kanji:this.tutKanji||'罠',
            title:this.tutTitle||'PRESSURE PLATE TRIGGERED!',
            text:this.tutText||'You just stepped on a pressure plate!\nA deadly trap spike will thrust out of the ground behind you in 0.6s!\nLEAP FORWARD IMMEDIATELY to avoid getting impaled!'
          };
          Snd.alert();
        }
      }
    }
  }
  draw(){
    const host=this.getHostPlatform();
    if(host && (host.vState==='gone'||host.vState==='hidden')){
      return; // Do not draw plate if host platform is hidden/gone
    }
    const py=this.y;
    const hw=(this.w||38)/2;
    if(this.state==='armed'){
      ctx.fillStyle=Math.sin(tGlobal*30)>0?'rgba(255,80,50,0.85)':'rgba(120,30,20,0.6)';
    }else{
      ctx.fillStyle='rgba(255,255,255,0.08)';
    }
    ctx.fillRect(this.x-hw,py-5,hw*2,5);
    if(this.seen){ctx.fillStyle='rgba(255,80,50,0.5)';ctx.fillRect(this.x-hw,py-5,hw*2,2);}
    ctx.fillStyle='#f39c12';
    ctx.fillRect(this.x-hw+5,py-4,3,3);ctx.fillRect(this.x+hw-8,py-4,3,3);
  }
}

/* === PULSE FIRE JETS — new hazard for levels 21-30: telegraphed flame bursts that dim your vision === */
class PulseFire{
  constructor(d){ this.x=d.x; this.y=d.y; this.w=d.w||70; this.h=d.h||48; this.dir=d.dir||1;

    if(this.side==='right') return {x:this.x,y:this.y-this.h/2,w:this.w,h:this.h};

  }
  update(dt){
    // telegraph sound on warning start
    const c=this.cycle();
    const prev=(c - dt + this.period)%this.period;
    if(prev >= this.period-this.warnT - dt && c >= this.period-this.warnT && c < this.period - 0.02){
      // entering warning
    }
  }
  draw(){
    const dirSign=this.dir;
    const on=this.active(), warn=this.warning(), mercy=mercyT>0;
    const a=this.area();
    // nozzle
    ctx.fillStyle='#0d0506';
    if(this.side==='top'){
      ctx.fillRect(this.x-16,this.y-6,32,10);
      ctx.fillStyle=mercy?'#3a3a3a':(on?'#ff3a10':(warn?(Math.sin(tGlobal*28)>0?'#ffd23a':'#7a3a10'):'#5a1a0a'));

      ctx.beginPath(); ctx.arc(this.x,this.y,4,0,TAU); ctx.fill();

      const gx=this.side==='top'? this.x : (this.side==='left'? a.x : a.x+a.w);

      // outer

class Spotlight{
  constructor(d){this.x=d.x;this.y=30;this.base=Math.PI/2;this.arc=d.arc||0.5;this.speed=d.speed||1;this.phase=d.x*0.013;this.len=d.len||580;}
  angle(){return this.base+Math.sin(tGlobal*this.speed+this.phase)*this.arc;}
  hits(px,py){
    const dx=px-this.x,dy=py-this.y;
    const dist=Math.hypot(dx,dy);
    if(dist>this.len||dist<10||dy<0)return false;
    const ang=Math.atan2(dy,dx);
    let diff=ang-this.angle();
    while(diff>Math.PI)diff-=TAU;
    while(diff<-Math.PI)diff+=TAU;
    return Math.abs(diff)<0.19;
  }
  draw(){
    const a=this.angle();
    const ex=this.x+Math.cos(a)*this.len,ey=this.y+Math.sin(a)*this.len;
    const spread=this.len*0.12;
    const px=Math.cos(a+Math.PI/2),py=Math.sin(a+Math.PI/2);
    ctx.save();ctx.globalCompositeOperation='lighter';
    const g=ctx.createLinearGradient(this.x,this.y,ex,ey);
    g.addColorStop(0,'rgba(255,225,170,0.20)');
    g.addColorStop(1,'rgba(255,225,170,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(ex+px*spread,ey+py*spread);
    ctx.lineTo(ex-px*spread,ey-py*spread);
    ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.fillStyle='#140506';
    ctx.beginPath();ctx.arc(this.x,this.y,7,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,225,170,0.9)';
    ctx.beginPath();ctx.arc(this.x,this.y,3,0,TAU);ctx.fill();
  }
}

function losClear(x1,y1,x2,y2){
  const dist=Math.hypot(x2-x1,y2-y1);
  const steps=Math.ceil(dist/10);
  for(let i=1;i<steps;i++){
    const x=x1+(x2-x1)*i/steps,y=y1+(y2-y1)*i/steps;
    for(const p of plats){
      if(!platSolid(p))continue;
      if(x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h)return false;
    }
  }
  return true;
}
class Guard{
  constructor(d){

    this.climbCooldown=0;

    this.alarmT=0;this.alarmCd=0;this.wasChase=false;this.dead=false;

  }
  reset(){
    this.x=this.spawnX;this.y=G;this.vy=0;this.state='patrol';this.dir=1;
    this.alarmT=0;this.invT=0;this.searchT=0;this.onGround=true;this.pauseT=0;this.wasChase=false;this.dead=false;
  }
  die(){
    if(this.dead)return;
    this.dead=true;
    burstDeath(this.x,this.y-30);
    burstDust(this.x,this.y,10);
    Snd.slash();
    shake=Math.max(shake,8);
    score+=150;
    texts.push(new FloatText(this.x,this.y-54,'VANQUISHED! +150','#ffd76a'));
  }
  update(dt,canSense){
    if(this.dead)return;
    const eyeY=this.y-46;
    const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
    this.jumpCd-=dt;this.investigateCd-=dt;this.alarmCd-=dt;

    if(this.type==='watcher'){
      const cyc=(tGlobal*0.85+this.sweepPhase)%2.2;
      this.dir=cyc<1.1?-1:1;
      this.blind=(cyc%1.1)>1.0;
    }else this.blind=false;

    let visible=false;
    if(canSense&&!player.hidden&&!this.blind&&player.x>130){
      const dx=pcx-this.x,dy=pcy-eyeY,dist=Math.hypot(dx,dy);
      const inFront=(dx*this.dir>0);
      const angleOk=Math.abs(dy)<dist*0.62+18;
      if(inFront&&dist<this.range&&angleOk&&losClear(this.x+this.dir*12,eyeY,pcx,pcy)){
        visible=true;
      }
    }
    if(visible){
      this.lastSeen={x:pcx,y:pcy};
      // remember platform player was on when seen — guards will check that platform
      this.lastSeenPlat = player.standPlat || null;
      this.lastSeenGrounded = !!player.onGround;
      if(this.type==='watcher'){
        if(this.alarmCd<=0){soundAlarm(pcx);this.alarmCd=4;}
      }else if(this.state!=='chase'){
        this.state='chase';
      }
    }

      Snd.alert();

      if(settings.particles)parts.push(new Particle({type:'ring',x:this.x,y:eyeY,color:'rgba(255,80,50,0.9)',life:0.35,vr:420}));
    }

    if(canSense&&player.hidden&&this.type!=='watcher'&&
       (this.state==='search')&&this.investigateCd<=0){
      for(const s of hideSpots){
        if(player.hideCrate===s&&Math.abs(this.x-(s.x+s.w/2))<52){
          this.state='investigate';this.invT=2.5;this.invSpot=s;break;
        }
      }
    }

    let move=0;

      if(this.state==='investigate'){
        this.invT-=dt;
        this.dir=(this.invSpot.x+this.invSpot.w/2>=this.x)?1:-1;
        this.phase+=dt*2;

          }
          this.state='patrol';this.investigateCd=5;this.invSpot=null;
        }
      }else if(this.state==='chase'){
        // alarm jog: chase to last seen spot, and if that spot was on a high platform, try to climb and check it
        const target=visible?pcx:this.lastSeen.x;
        const targetPlat = !visible ? this.lastSeenPlat : (player.standPlat||null);
        if(Math.abs(target-this.x)>6)this.dir=(target>this.x)?1:-1;
        // jog: slight speed up when alarmed and far
        const farBoost = (!visible && Math.abs(target-this.x)>120) ? 1.12 : 1;
        move=this.dir*this.chaseSpd*farBoost*dt;
        this.phase+=this.chaseSpd*farBoost*dt*0.055;
        if(!visible){
          this.alarmT-=dt;
          if(Math.abs(pcx-this.x)>900||Math.abs(target-this.x)<20||this.alarmT<=0){
            this.state='search';this.searchT=1.6;
            // stay near last seen plat if it was high
            if(targetPlat && targetPlat.y < G-30){
              this.lastSeen.x = targetPlat.x+targetPlat.w/2;
            }
          }
        }else this.alarmT=Math.max(this.alarmT,0.6);
        // climb check — chase up to the platform player was last seen on
        if(this.onGround&&this.jumpCd<=0&&!player.hidden){
          const wantHigh = targetPlat && targetPlat.y < this.y-22;
          const nearTarget = Math.abs(target-this.x) < 190;
          if(wantHigh && nearTarget){
            // is there a reachable platform step between guard and target height?
            let can=false;
            let jumpTargetY = targetPlat.y;
            for(const p of plats){
              if(!platSolid(p))continue;
              // any plat that bridges the height gap near the guard
              if(p.y < this.y-18 && p.y >= jumpTargetY - 8 && p.y <= jumpTargetY + 30 && this.x>p.x-60&&this.x<p.x+p.w+60){can=true;break;}
            }
            if(!can){
              // fallback: any plat under the last-seen X that is above guard
              for(const p of plats){
                if(!platSolid(p))continue;
                if(target >= p.x-50 && target <= p.x+p.w+50 && p.y < this.y-18 && p.y < G-20){ can=true; jumpTargetY=p.y; break; }
              }
            }
            if(can){
              // stronger jump when chasing high
              this.vy = (targetPlat.y < this.y-80) ? -820 : -760;
              this.jumpCd=1.0; burstDust(this.x,this.y,4);
            }
          } else if(player.onGround&&player.y+player.h < this.y-30 && Math.abs(pcx-this.x)<170){

            for(const p of plats){
              if(!platSolid(p))continue;
              if(p.y<this.y-20&&p.y>this.y-175&&this.x>p.x-50&&this.x<p.x+p.w+50){can=true;break;}
            }
            if(can){this.vy=-760;this.jumpCd=1.1;burstDust(this.x,this.y,4);}
          }
        }
      }else if(this.state==='search'){
        if(Math.abs(this.lastSeen.x-this.x)>18){

          move=this.dir*this.patrolSpd*1.5*dt;
          this.phase+=this.patrolSpd*1.5*dt*0.05;
        }else{
          this.searchT-=dt;
          this.dir=Math.sin(tGlobal*7)>0?1:-1;
          if(this.searchT<=0)this.state='patrol';
        }
      }else{
        this.pauseT-=dt;
        if(this.pauseT<=0&&this.patrolSpd>0){
          move=this.dir*this.patrolSpd*dt;
          this.phase+=this.patrolSpd*dt*0.05;
          if(this.x>this.maxX){this.x=this.maxX;this.dir=-1;this.pauseT=0.7;}
          if(this.x<this.minX){this.x=this.minX;this.dir=1;this.pauseT=0.7;}
        }
      }
    }

    this.x+=move;
    for(const p of plats){
      if(!platSolid(p))continue;
      if(this.x-14<p.x+p.w&&this.x+14>p.x&&this.y-58<p.y+p.h&&this.y>p.y){
        if(move>0)this.x=p.x-14;

    }
    if(this.state==='patrol'&&this.onGround&&this.patrolSpd>0){
      if(!pointInPlat(this.x+this.dir*26,this.y+8)){this.dir*=-1;this.pauseT=0.5;}

    }
    if(this.y>LH+100){this.x=Math.max(200,this.spawnX);this.y=G;this.vy=0;this.state='patrol';}

    if(canSense&&!player.hidden&&!this.dead&&mercyT<=0){

class Player{
  constructor(){this.w=38;this.h=62;this.reset();}
  reset(){
    this.x=currentCheckpointX;this.y=G-this.h;this.vx=0;this.vy=0;
    this.onGround=true;this.jumpsLeft=2;this.coyote=0;this.buffer=0;
    this.runPhase=0;this.deform=0;this.dustT=0;this.stepT=0;
    this.hidden=false;this.hideCrate=null;this.dead=false;
    this.facing=1;this.slow=false;this.standPlat=null;
    this.dashT=0;this.dashCd=0;this.dashDir=1;
  }
  requestJump(){this.buffer=0.13;}
  cutJump(){if(!this.hidden&&this.vy<0&&this.dashT<=0)this.vy*=0.5;}
  tryDash(){
    if(state!=='play'||this.dead||this.hidden||this.dashT>0||this.dashCd>0)return false;
    let dir=(keys.right||btn.right?1:0)-(keys.left||btn.left?1:0);
    if(dir===0)dir=this.facing||1;
    this.dashDir=dir;this.facing=dir;
    this.dashT=0.18;this.dashCd=1.2;
    this.vy=0;
    Snd.dash();
    burstDust(this.x+this.w/2,this.y+this.h/2,10);
    if(settings.particles)parts.push(new Particle({type:'ring',x:this.x+this.w/2,y:this.y+this.h/2,
      color:'rgba(255,215,120,0.9)',life:0.3,vr:420}));
    texts.push(new FloatText(this.x+this.w/2,this.y-30,'DASH!','#ffd76a'));
    return true;
  }
  doJump(){
    const first=this.onGround||this.coyote>0;
    this.vy=first?-730:-680;
    if(first){this.jumpsLeft=1;Snd.jump();}
    else{
      this.jumpsLeft--;Snd.doubleJump();
      if(settings.particles)parts.push(new Particle({type:'ring',x:this.x+this.w/2,y:this.y+this.h*0.7,
        color:'rgba(255,215,120,0.9)',life:0.35,vr:340}));
    }
    this.coyote=0;this.buffer=0;this.deform=0.22;
    burstDust(this.x+this.w/2,this.y+this.h,5);
  }
  update(dt){
    if(this.hidden){this.deform*=Math.pow(0.002,dt);return;}
    if(this.dashCd>0)this.dashCd-=dt;
    const left=keys.left||btn.left,right=keys.right||btn.right;
    const dir=(right?1:0)-(left?1:0);
    if(this.dashT>0){
      // dash burst: fixed horizontal speed, gravity suspended, double-jump preserved
      this.dashT-=dt;
      this.vx=this.dashDir*560;
      this.vy=0;
      if(this.vx>10)this.facing=1;
      else if(this.vx<-10)this.facing=-1;
      this.deform=0.22;
      if(settings.particles)parts.push(new Particle({
        x:this.x+this.w/2-rand(-8,8),y:this.y+rand(6,this.h-6),
        vx:-this.dashDir*rand(60,160),vy:rand(-30,30),
        size:rand(3,6),life:rand(0.2,0.35),color:'#ffd76a',grav:0}));
      this.x+=this.vx*dt;
      for(const p of plats){
        if(!platSolid(p))continue;
        if(this.x<p.x+p.w&&this.x+this.w>p.x&&this.y<p.y+p.h&&this.y+this.h>p.y){
          if(this.vx>0)this.x=p.x-this.w;
          else if(this.vx<0)this.x=p.x+p.w;
        }
      }
      this.x=clamp(this.x,0,L.w-this.w);
      // vertical pass keeps player out of floors during dash
      this.y+=this.vy*dt;
      this.buffer-=dt;
      return;
    }
    const spd=300*(this.slow?0.45:1);
    this.vx=dir*spd;
    if(this.vx>10)this.facing=1;
    else if(this.vx<-10)this.facing=-1;

    this.x+=this.vx*dt;
    for(const p of plats){
      if(!platSolid(p))continue;
      if(this.x<p.x+p.w&&this.x+this.w>p.x&&this.y<p.y+p.h&&this.y+this.h>p.y){
        if(this.vx>0)this.x=p.x-this.w;
        else if(this.vx<0)this.x=p.x+p.w;
      }
    }
    this.x=clamp(this.x,0,L.w-this.w);

    this.vy+=1900*dt;
    if(this.vy>1500)this.vy=1500;
    this.y+=this.vy*dt;
    const wasGround=this.onGround;
    this.onGround=false;
    this.standPlat=null;
    for(const p of plats){
      if(!platSolid(p))continue;
      if(this.x<p.x+p.w&&this.x+this.w>p.x&&this.y<p.y+p.h&&this.y+this.h>p.y){
        if(this.vy>0){
          this.y=p.y-this.h;this.vy=0;
          this.onGround=true;this.jumpsLeft=2;this.coyote=0.1;
          this.standPlat=p;
          if(p.t==='vanish'&&p.vState==='solid'){
            p.vState='shake';
            p.vT=p.collapseDelay!==undefined?p.collapseDelay:0.7;
            if(p.triggerTutorial&&!tutTriggered['plat_'+p.x]){
              tutTriggered['plat_'+p.x]=true;
              activeTutCard={
                kanji:p.tutKanji||'崩',
                title:p.tutTitle||'CRUMBLING PLATFORM!',
                text:p.tutText||'This ancient stone platform collapses under your weight!\nLeap quickly before it gives way!'
              };
              Snd.alert();
            }
          }
          if(!wasGround){this.deform=-0.2;Snd.land();burstDust(this.x+this.w/2,p.y,7);}
        }else{
          this.y=p.y+p.h;this.vy=0;
        }
      }
    }
    this.slow=!!(this.standPlat&&this.standPlat.t==='slow');
    if(!this.onGround){
      this.coyote-=dt;
      if(this.coyote<=0&&this.jumpsLeft===2)this.jumpsLeft=1;
    }
    this.buffer-=dt;
    if(this.buffer>0&&this.jumpsLeft>0)this.doJump();

    if(this.onGround){
      this.runPhase+=Math.abs(this.vx)*dt*0.045;
      this.dustT-=dt;
      if(Math.abs(this.vx)>1&&this.dustT<=0){
        this.dustT=0.08;
        burstDust(this.x+this.w/2-8,this.y+this.h,1);
      }
      this.stepT-=dt;
      if(Math.abs(this.vx)>1&&this.stepT<=0){this.stepT=0.22;Snd.step();}
    }
    this.deform*=Math.pow(0.002,dt);
    if(this.y>LH+300)die();
  }
  draw(){
    if(this.hidden||this.dead)return;
    ctx.save();
    if(mercyT>0)ctx.globalAlpha=0.6+0.4*Math.sin(tGlobal*12);
    ctx.translate(this.x+this.w/2,this.y+this.h);
    const st=clamp(this.deform,-0.25,0.3);
    const lean=clamp(Math.abs(this.vx)/300,0,1)*0.08+(!this.onGround?clamp(this.vy/1600,-0.04,0.07):0);
    ctx.scale(this.facing*(1-st*0.7),1+st);
    ctx.rotate(lean);

    ctx.strokeStyle='#5c0d0d';ctx.lineCap='round';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(-4,-44);
    let sx0=-4,sy0=-44;
    for(let i=1;i<=6;i++){
      sx0-=7+i*0.9;
      sy0+=Math.sin(tGlobal*9+i*1.1)*1.6+0.4;
      ctx.lineTo(sx0,sy0);
    }
    ctx.stroke();

    ctx.strokeStyle='#181012';ctx.lineWidth=4.5;
    ctx.beginPath();ctx.moveTo(-16,-22);ctx.lineTo(15,-52);ctx.stroke();
    ctx.strokeStyle='#3a2a1c';ctx.lineWidth=2.6;
    ctx.beginPath();ctx.moveTo(-16,-22);ctx.lineTo(-9,-29);ctx.stroke();
    ctx.fillStyle='#8a6a30';
    ctx.beginPath();ctx.arc(15,-52,2.4,0,TAU);ctx.fill();

    ctx.strokeStyle='#0b0506';ctx.lineWidth=7;
    const hipY=-22;
    if(this.onGround&&Math.abs(this.vx)>1){
      for(let i=0;i<2;i++){
        const a=Math.sin(this.runPhase+i*Math.PI)*0.9;
        ctx.beginPath();ctx.moveTo(0,hipY);
        ctx.lineTo(Math.sin(a)*16,hipY+Math.cos(a)*22);
        ctx.stroke();
      }
      ctx.lineWidth=5.5;
      const aa=Math.sin(this.runPhase+Math.PI)*0.7;
      ctx.beginPath();ctx.moveTo(0,-40);
      ctx.lineTo(Math.sin(aa)*11,-40+Math.cos(aa)*14);
      ctx.stroke();
    }else if(!this.onGround){
      ctx.beginPath();ctx.moveTo(0,hipY);ctx.lineTo(13,-4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,hipY);ctx.lineTo(-10,-9);ctx.stroke();
      ctx.lineWidth=5.5;
      ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(-9,-30);ctx.stroke();
    }else{
      ctx.beginPath();ctx.moveTo(0,hipY);ctx.lineTo(-6,0);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,hipY);ctx.lineTo(7,0);ctx.stroke();
      ctx.lineWidth=5.5;
      ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(6,-28);ctx.stroke();
    }

    ctx.fillStyle='#0b0506';
    ctx.beginPath();
    ctx.moveTo(-12,-48);ctx.lineTo(12,-48);
    ctx.lineTo(14,-20);ctx.lineTo(-14,-20);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#5c0d0d';ctx.fillRect(-13,-34,26,5);
    ctx.strokeStyle='rgba(255,110,70,0.28)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(12,-46);ctx.lineTo(13,-22);ctx.stroke();

    ctx.fillStyle='#0b0506';
    ctx.beginPath();ctx.arc(2,-54,8.5,0,TAU);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-26,-58);
    ctx.quadraticCurveTo(2,-84,30,-58);
    ctx.quadraticCurveTo(2,-64,-26,-58);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,140,90,0.3)';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(-24,-58);ctx.quadraticCurveTo(2,-82,28,-58);ctx.stroke();
    ctx.save();
    ctx.shadowColor='#ffcf6a';ctx.shadowBlur=8*shadowMul;
    ctx.fillStyle='#ffd98a';
    ctx.fillRect(5,-55,6.5,2.4);

    ctx.restore();
  }

  else if(i===-1){d=TUTORIAL_LEVEL;levelIndex=-1;isTutorial=true;}
  else{levelIndex=i;d=LEVELS[i];isTutorial=false;}
  L=d;curName=d.name;parTime=d.par;
  keysNeed=d.keys.length;keyGotCount=0;
  currentCheckpointX=d.spawnX!==undefined?d.spawnX:90;
  plats=[{x:0,y:G,w:d.w,h:110,t:'n'}];
  for(const p of d.plats){
    if(Array.isArray(p))plats.push({x:p[0],y:p[1],w:p[2],h:p[3],t:'n'});
    else{
      const np={
        x:p.x,y:p.y,w:p.w,h:p.h,t:p.t||'n',
        initiallyHidden:!!p.initiallyHidden,
        collapseDelay:p.collapseDelay,
        respawnDelay:p.respawnDelay,
        triggerTutorial:p.triggerTutorial,
        tutTitle:p.tutTitle,tutText:p.tutText,tutKanji:p.tutKanji
      };
      if(np.initiallyHidden){
        np.vState='gone';
        np.vT=0;
      }else if(np.t==='vanish'){
        np.vState='solid';
        np.vT=0;
      }
      plats.push(np);
    }
  }
  spikeGroups=d.spikes.map(s=>new SpikeGroup(s.x,s.w,s.y!==undefined?s.y:G));
  blades=d.blades.map(b=>new Blade(b));
  plates=d.plates.map(p=>new Plate(p));
  fires=(d.fires||[]).map(f=>new PulseFire(f));
  spots=d.spots.map(s=>new Spotlight(s));
  towers=d.towers.map(t=>new Watchtower(t));
  guards=d.guards.map(g=>new Guard(g));
  hideSpots=d.crates.map(x=>new HideSpot(x,'crate')).concat(d.bushes.map(x=>new HideSpot(x,'bush')));
  orbs=d.orbs.map(o=>new Orb(o[0],o[1]));
  keyObjs=d.keys.map(k=>new Key(k.x,k.y));
  signs=d.signs||[];
  doorObj=new Door(d.doorX);
  parts=[];texts=[];trapSpikes=[];
  hideAvail=null;hideT=0;cardT=2.4;levelTime=0;
  mercyT=0;reviveUsed=false;lightExp=0;doorOpenedSfx=false;
  levelStartScore=score;
  player.reset();
  spawnCamX=camClampX(player.x+player.w/2-W*0.45);
  spawnCamY=camClampY(player.y-H*0.5);
  doorCamX=camClampX(doorObj.x+doorObj.w/2-W*0.5);
  doorCamY=camClampY(doorObj.y+doorObj.h/2-H*0.5);
  camX=doorCamX;camY=doorCamY;
  CG.setContext({level:levelIndex+1,room:curName});
  if(levelIndex===0)onboardT=9;
}
function camClampX(v){return L.w<=W?(L.w-W)/2:clamp(v,0,L.w-W);}
function camClampY(v){return LH<=H?(LH-H)/2:clamp(v,0,LH-H);}

let activeTutCard=null;
let activeTutPrompt=null;
let tutPromptRect=null;
let tutTriggered={};

function resetTutorialState(){
  tutTriggered={};
  activeTutCard=null;
  activeTutPrompt=null;
  tutPromptRect=null;
}

function dismissTutCard(){
  if(!activeTutCard)return;
  activeTutCard=null;
  Snd.ui();
}
window.getActiveTutCard=()=>activeTutCard;
window.setActiveTutCard=(v)=>{activeTutCard=v;};

function getCardTriggerRect(c){
  if(!c)return null;
  if(Array.isArray(c.trigger))return {x:c.trigger[0],y:c.trigger[1],w:c.trigger[2],h:c.trigger[3]};
  if(c.trigger&&typeof c.trigger==='object')return {x:c.trigger.x,y:c.trigger.y,w:c.trigger.w,h:c.trigger.h};
  if(c.x!==undefined&&c.w!==undefined)return {x:c.x,y:c.y||400,w:c.w,h:c.h||200};
  return null;
}

function rectsOverlap(r1,r2){
  return r1.x<r2.x+r2.w && r1.x+r1.w>r2.x && r1.y<r2.y+r2.h && r1.y+r1.h>r2.y;
}

function checkTutorialMilestones(){
  if(state!=='play'||activeTutCard)return;

  let candidatePrompt = null;
  if(L && L.tutorialCards && L.tutorialCards.length > 0){
    const pr = { x: player.x, y: player.y, w: player.w, h: player.h };
    for(const c of L.tutorialCards){
      const tr = getCardTriggerRect(c);
      if(!tr) continue;
      const cardId = c.id || (c.title + '_' + tr.x);
      const isAuto = (c.triggerMode === 'auto' || c.mode === 'auto');
      if(isAuto){
        if(!tutTriggered[cardId] && rectsOverlap(pr, tr)){
          tutTriggered[cardId] = true;
          activeTutPrompt = null;
          activeTutCard = {
            kanji: c.kanji || '訓',
            title: c.title || 'TUTORIAL INSTRUCTION',
            text: c.text || ''
          };
          Snd.alert();
          return;
        }
      } else {
        // Prompted mode: always available whenever in that spot!
        if(rectsOverlap(pr, tr)){
          candidatePrompt = { card: c, id: cardId };
        }
      }
    }
  }
  activeTutPrompt = candidatePrompt;
}

function tryOpenTutPrompt(){
  if(state==='play' && activeTutPrompt && activeTutPrompt.card){
    const c = activeTutPrompt.card;
    activeTutCard = {
      kanji: c.kanji || '訓',
      title: c.title || 'TUTORIAL INSTRUCTION',
      text: c.text || ''
    };
    activeTutPrompt = null;
    Snd.alert();
    return true;
  }
  return false;
}

function drawTutPrompt(p){
  if(!p || !p.card) return;
  const c = p.card;
  const titleText = (c.title || 'OPTIONAL TIP').toUpperCase();

  ctx.save();
  
  const px = player.x + player.w/2 - camX;
  const py = player.y - camY;
  
  const label = `[ E ]  ${titleText}`;
  ctx.font = 'bold 11px "Trebuchet MS",sans-serif';
  const textW = ctx.measureText(label).width;
  const pw = Math.max(170, textW + 28);
  const ph = 28;
  
  const bob = Math.sin(tGlobal * 7) * 2.5;
  const cx = clamp(px, pw/2 + 10, W - pw/2 - 10);
  const cy = clamp(py - 34 + bob, 46, H - 70);
  const bx = cx - pw/2, by = cy - ph/2;
  
  tutPromptRect = { x: bx, y: by, w: pw, h: ph };

  // Subtle glow
  ctx.shadowColor = 'rgba(255, 215, 106, 0.45)';
  ctx.shadowBlur = 10 * shadowMul;

  // Dark obsidian badge
  ctx.fillStyle = 'rgba(16, 3, 5, 0.94)';
  rrectPath(bx, by, pw, ph, 6);
  ctx.fill();

  // Gold border
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#ffd76a';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // Inner highlight
  ctx.strokeStyle = 'rgba(255, 80, 50, 0.3)';
  ctx.lineWidth = 1;
  rrectPath(bx + 2, by + 2, pw - 4, ph - 4, 4);
  ctx.stroke();

  // Left button pill [ E ]
  const badgeW = 24, badgeH = 18;
  const bbx = bx + 5, bby = by + 5;
  ctx.fillStyle = 'rgba(255, 215, 106, 0.25)';
  rrectPath(bbx, bby, badgeW, badgeH, 4);
  ctx.fill();
  ctx.strokeStyle = '#ffd76a';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#ffd76a';
  ctx.font = 'bold 11px "Trebuchet MS",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('E', bbx + badgeW/2, bby + 13);

  // Title text
  ctx.fillStyle = '#f5ebd9';
  ctx.font = 'bold 11px "Trebuchet MS",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(titleText, bbx + badgeW + 8, by + 18);

  // Downward pointer arrow
  ctx.fillStyle = '#ffd76a';
  ctx.beginPath();
  ctx.moveTo(cx - 4, by + ph);
  ctx.lineTo(cx + 4, by + ph);
  ctx.lineTo(cx, by + ph + 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawTutCard(c){
  ctx.save();
  ctx.fillStyle='rgba(8,1,2,0.80)';
  ctx.fillRect(0,0,W,H);

  const cw=Math.min(560,W*0.90);
  const ch=Math.min(270,H*0.78);
  const cx=W/2-cw/2,cy=H/2-ch/2;

  ctx.shadowColor='rgba(255,60,30,0.5)';
  ctx.shadowBlur=28*shadowMul;

  ctx.fillStyle='rgba(20,4,6,0.96)';
  rrectPath(cx,cy,cw,ch,14);
  ctx.fill();

  ctx.strokeStyle='#ffd76a';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.shadowBlur=0;

  ctx.strokeStyle='rgba(255,80,50,0.35)';
  ctx.lineWidth=1;
  rrectPath(cx+5,cy+5,cw-10,ch-10,10);
  ctx.stroke();

  if(c.kanji){
    ctx.save();
    ctx.fillStyle='rgba(255,60,30,0.08)';
    ctx.font='bold 110px serif';
    ctx.textAlign='center';
    ctx.fillText(c.kanji,W/2,cy+ch*0.68);
    ctx.restore();
  }

  ctx.fillStyle='#ff5340';
  ctx.font='bold 11px "Trebuchet MS",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('CRIMSON DOJO · TRAINING INSIGHT',W/2,cy+30);

  ctx.fillStyle='#ffd76a';
  ctx.font='400 23px "Impact","Arial Black",sans-serif';
  ctx.fillText(c.title,W/2,cy+62);

  ctx.strokeStyle='rgba(255,215,106,0.4)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx+30,cy+76);ctx.lineTo(W/2-20,cy+76);
  ctx.moveTo(W/2+20,cy+76);ctx.lineTo(cx+cw-30,cy+76);
  ctx.stroke();
  ctx.fillStyle='#ffd76a';
  ctx.fillRect(W/2-3,cy+73,6,6);

  ctx.fillStyle='#f5ebd9';
  ctx.font='15px "Trebuchet MS",sans-serif';
  ctx.textAlign='center';
  const lines=c.text.split('\n');
  for(let i=0;i<lines.length;i++){
    ctx.fillText(lines[i],W/2,cy+108+i*24);
  }

  const bob=Math.sin(tGlobal*6)*2;
  const bw=230,bh=34,bx=W/2-bw/2,by=cy+ch-48+bob;
  ctx.fillStyle='rgba(255,215,106,0.2)';
  rrectPath(bx,by,bw,bh,8);ctx.fill();
  ctx.strokeStyle='#ffd76a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#ffd76a';
  ctx.font='bold 13px "Trebuchet MS",sans-serif';
  ctx.fillText(touch.isTouch?'TAP TO CONTINUE':'PRESS [SPACE] OR CLICK',W/2,by+22);

  ctx.restore();
}

function startTutorial(){
  resetTutorialState();
  isTutorial=true;
  score=0;deaths=0;totalOrbs=0;totalTime=0;newBest=false;
  deathsSinceAd=0;
  loadLevel(TUTORIAL_LEVEL);
  startBrief();
  CG.gameplayStart();
}
function startLevelRun(i){
  score=0;deaths=0;totalOrbs=0;totalTime=0;newBest=false;
  deathsSinceAd=0;
  loadLevel(i);
  if(!visitedLevels.has(i)){visitedLevels.add(i);startBrief();}
  else startReady(0.35);
}
function startBrief(){state='brief';briefT=0;briefDur=clamp(1.2+L.w/1800,1.4,2.4);}
function startReady(t){state='ready';readyT=t||0;}
function goMenu(){state='menu';menuSel=0;heatT=0;CG.clearContext();CG.gameplayStop();}
function openPause(){if(inGame()&&state!=='dead'&&state!=='cleared'&&state!=='win'){state='paused';pauseSel=0;Snd.ui();}}
function die(){
  if(state!=='play')return;
  state='dead';deadT=0;deaths++;deathsSinceAd++;
  score=levelStartScore;
  player.dead=true;
  cgFailMsg='';
  Snd.death();
  adMidgameOnDeath();
  burstDeath(player.x+player.w/2,player.y+player.h/2);
  shake=16;flash=1;
}
function respawn(){if(isTutorial)loadLevel(TUTORIAL_LEVEL);else loadLevel(levelIndex);startReady(0.35);}
function doRevive(){
  reviveUsed=true;mercyT=MERCY_TIME;
  player.dead=false;
  player.hidden=false;player.hideCrate=null;hideT=0;
  player.vy=0;player.vx=0;
  guards.forEach(g=>g.reset());
  trapSpikes=[];
  plates.forEach(p=>{p.state='idle';p.t=0;});
  towers.forEach(t=>{t.exposure=0;t.cd=0;});
  hideSpots.forEach(s=>{s.cd=0;});
  lightExp=0;parts=[];
  state='play';deadT=0;
  Snd.revive();
  texts.push(new FloatText(player.x+player.w/2,player.y-46,'SECOND CHANCE — RUN!','#9cff8a'));
}
function forceUnhide(msg){
  const s=player.hideCrate;
  if(!s)return;
  player.hidden=false;
  player.x=s.x+s.w/2-player.w/2;
  player.y=G-player.h;player.vy=0;
  player.hideCrate=null;hideT=0;
  s.cd=2.5;
  mercyT=Math.max(mercyT,0.4);
  Snd.unhide();
  burstDust(player.x+player.w/2,G,8);
  texts.push(new FloatText(player.x+player.w/2,player.y-30,msg,'#ff8a70'));
}
function tryTakedown(){
  if(state!=='play'||player.hidden||player.dead)return false;
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  for(const g of guards){
    if(g.dead||g.state==='chase')continue;
    const dx=pcx-g.x,dy=pcy-(g.y-30);
    const behind=(dx*g.dir<0);
    if(behind&&Math.abs(dx)<85&&Math.abs(dy)<54){
      g.die();
      texts.push(new FloatText(g.x,g.y-54,'TAKEDOWN! +200','#ffd76a'));
      score+=50;
      Snd.slash();
      return true;
    }
  }
  return false;
}

function toggleHide(){
  if(state!=='play')return;
  if(player.hidden){
    const c=player.hideCrate;
    player.hidden=false;
    if(keys.left)player.x=c.x-player.w-4;
    else if(keys.right)player.x=c.x+c.w+4;
    else player.x=c.x+c.w/2-player.w/2;
    player.x=clamp(player.x,0,L.w-player.w);
    player.y=G-player.h;player.vy=0;
    player.hideCrate=null;hideT=0;
    mercyT=Math.max(mercyT,0.4);
    Snd.unhide();
  }else if(hideAvail){
    if(hideAvail.cd>0){
      texts.push(new FloatText(hideAvail.x+hideAvail.w/2,hideAvail.y-hideAvail.h-20,'DISTURBED','#ff8a70'));
      return;
    }
    player.hidden=true;
    player.hideCrate=hideAvail;
    player.x=hideAvail.x+hideAvail.w/2-player.w/2;
    player.y=G-player.h+6;
    player.vx=0;player.vy=0;hideT=0;
    Snd.hide();
    burstDust(player.x+player.w/2,G,4);
  }
}
function levelCleared(){
  state='cleared';clearT=0;
  player.hidden=false;
  lastOrbs=orbs.filter(o=>o.taken).length;
  const gotAll=orbs.length>0&&lastOrbs===orbs.length;
  const underPar=levelTime<=parTime;
  lastStars=1+(gotAll?1:0)+(underPar?1:0);
  lastPerfect=lastStars===3;
  lastBonus=Math.max(0,250-Math.floor(levelTime)*5)+(lastPerfect?150:0);
  score+=100+lastBonus;
  progress.stars[levelIndex]=Math.max(progress.stars[levelIndex],lastStars);
  if(progress.times[levelIndex]===0||levelTime<progress.times[levelIndex])progress.times[levelIndex]=levelTime;
  saveProgress();
  if(lastPerfect){Snd.perfect();CG.happytime();}
  else Snd.clear();
  burstGold(player.x+player.w/2,player.y+player.h/2,20);
}
function advanceLevel(){
  if(isTutorial){
    isTutorial=false;
    try{localStorage.setItem('crimsonTutDone','1');}catch(e){}
    texts.push(new FloatText(W/2,H/2-40,'TRAINING COMPLETED!','#ffd76a'));
    goMenu();
    return;
  }
  if(levelIndex+1<NLV){
    loadLevel(levelIndex+1);
    if(!visitedLevels.has(levelIndex)){visitedLevels.add(levelIndex);startBrief();}
    else startReady(0.35);
  }
  else{
    state='win';
    newBest=score>best;
    if(newBest){best=Math.floor(score);try{localStorage.setItem('crimsonEscapeBest',String(best));}catch(e){}}
    CG.saveCloud();
    CG.happytime();
    Snd.perfect();
  }
}

function firstIncomplete(){
  for(let i=0;i<NLV;i++)if(progress.stars[i]===0)return i;
  return 0;
}
function uiAction(id){
  if(id==='play'){Snd.ui();CG.gameplayStart();startLevelRun(firstIncomplete());}
  else if(id==='tutorial'){Snd.ui();startTutorial();}
  else if(id==='levels'){Snd.ui();state='levels';levelSel=firstIncomplete();levelPage=Math.floor(levelSel/10);}
  else if(id==='settings'){Snd.ui();state='settings';setSel=0;}
  else if(id==='editor'){Snd.ui();window.open('editor.html', '_blank');}
  else if(id==='back'){Snd.ui();goMenu();}
  else if(id==='resume'){Snd.ui();state='play';}
  else if(id==='restart'){Snd.ui();respawn();}
  else if(id==='respawn'){Snd.ui();respawn();}
  else if(id==='quit'){Snd.ui();goMenu();}
  else if(id==='revive')reviveWithAd();
  else if(id==='prevPage'){levelPage=Math.max(0,levelPage-1);levelSel=Math.max(0,levelSel-10);Snd.ui();}
  else if(id==='nextPage'){levelPage=Math.min(Math.ceil(NLV/10)-1,levelPage+1);levelSel=Math.min(NLV-1,levelSel+10);Snd.ui();}
  else if(id==='sound'){settings.sound=!settings.sound;saveSettings();Snd.applyMute();Snd.ui();}
  else if(id==='shake'){settings.shake=!settings.shake;saveSettings();Snd.ui();}
  else if(id==='particles'){settings.particles=!settings.particles;saveSettings();Snd.ui();}
  else if(id==='hints'){settings.hints=!settings.hints;saveSettings();Snd.ui();}
  else if(typeof id==='number'){Snd.ui();if(unlocked(id)){CG.gameplayStart();startLevelRun(id);}}
}

function pressJumpAction(){
  if(awaitingFocus){awaitingFocus=false;tryFocus();}
  if(state==='menu'){uiAction(['play','tutorial','levels','settings','editor'][menuSel]);return;}
  if(state==='levels'){uiAction(levelSel);return;}
  if(state==='settings'){uiAction(['sound','shake','particles','hints'][setSel]);return;}
  if(state==='paused'){uiAction(['resume','restart','quit'][pauseSel]);return;}
  if(state==='win'){goMenu();return;}
  if(state==='brief'){startReady(0.2);return;}
  if(state==='dead'){if(deadT>0.25&&!adPending)respawn();return;}
  if(state==='cleared'){if(clearT>0.6)advanceLevel();return;}
  if(state==='ready')return;
  if(player.hidden){toggleHide();return;}
  player.requestJump();
  if(onboardT>0)onboardT=Math.min(onboardT,2);
}
function releaseJump(){if(state==='play')player.cutJump();}
function menuNav(c){
  if(state==='menu'){
    if(c==='ArrowUp'||c==='ArrowLeft')menuSel=(menuSel+4)%5;
    if(c==='ArrowDown'||c==='ArrowRight')menuSel=(menuSel+1)%5;
  }else if(state==='levels'){
    const cols=5;
    if(c==='ArrowLeft'){
      if(levelSel%cols===0&&levelPage>0){levelPage--;levelSel+=10-cols;}
      else levelSel=Math.max(0,levelSel-1);
    }
    if(c==='ArrowRight'){
      if((levelSel+1)%cols===0&&levelPage<Math.ceil(NLV/10)-1){levelPage++;levelSel-=10-cols;}
      else levelSel=Math.min(NLV-1,levelSel+1);
    }
    if(c==='ArrowUp')levelSel=Math.max(levelPage*10,levelSel-cols);
    if(c==='ArrowDown')levelSel=Math.min(Math.min(NLV-1,(levelPage+1)*10-1),levelSel+cols);
  }else if(state==='settings'){
    if(c==='ArrowUp'||c==='ArrowLeft')setSel=(setSel+3)%4;
    if(c==='ArrowDown'||c==='ArrowRight')setSel=(setSel+1)%4;
  }else if(state==='paused'){
    if(c==='ArrowUp'||c==='ArrowLeft')pauseSel=(pauseSel+2)%3;
    if(c==='ArrowDown'||c==='ArrowRight')pauseSel=(pauseSel+1)%3;
  }
}
window.addEventListener('keydown',e=>{
  if(adActive)return;
  if(e.repeat)return;
  if(awaitingFocus){awaitingFocus=false;tryFocus();}
  audioGesture();
  const c=e.code;
  if(activeTutCard){
    if(c==='Space'||c==='Enter'){dismissTutCard();e.preventDefault();}
    return;
  }
  if((c==='Escape'||c==='KeyP')&&inGame()&&state!=='dead'&&state!=='cleared'&&state!=='win'){
    if(state==='paused'){state='play';}
    else openPause();
    return;
  }
  if(state==='menu'||state==='levels'||state==='settings'||state==='paused'){
    if(c==='Escape'){if(state!=='menu')goMenu();return;}
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c)){menuNav(c);e.preventDefault();return;}
    if(c==='Space'||c==='Enter'){pressJumpAction();e.preventDefault();return;}
    if(state==='paused'&&c==='KeyR'){uiAction('restart');return;}
  }
  if(c==='KeyR'&&state==='dead'){reviveWithAd();return;}
  if(c==='KeyA'||c==='ArrowLeft'){keys.left=true;if(onboardT>0)onboardT=Math.min(onboardT,2);}
  if(c==='KeyD'||c==='ArrowRight'){keys.right=true;if(onboardT>0)onboardT=Math.min(onboardT,2);}
  if(c==='KeyW'||c==='ArrowUp'||c==='Space')pressJumpAction();
  if((c==='KeyS'||c==='ArrowDown')&&state==='play')toggleHide();
  if((c==='KeyE'||c==='KeyX'||c==='KeyJ')&&state==='play'){
    if(tryOpenTutPrompt())return;
    if(tryTakedown())return;
  }
  if(c==='ShiftLeft'||c==='ShiftRight'||c==='KeyF'){if(state==='play')player.tryDash();}
  if(c==='Space'||c==='ArrowUp'||c==='ArrowDown')e.preventDefault();
});
window.addEventListener('keyup',e=>{
  if(adActive)return;
  const c=e.code;
  if(c==='KeyA'||c==='ArrowLeft')keys.left=false;
  if(c==='KeyD'||c==='ArrowRight')keys.right=false;
  if(c==='KeyW'||c==='ArrowUp'||c==='Space')releaseJump();
});

window.addEventListener('focus',()=>{awaitingFocus=false;});
function pauseBtnRect(){return{x:W-46,y:14,w:32,h:32};}
function inGame(){return['brief','ready','play','dead','cleared','win'].includes(state);}
function handlePointerDown(x,y){
  if(adActive)return true;
  if(awaitingFocus){awaitingFocus=false;tryFocus();}
  if(activeTutCard){dismissTutCard();return true;}
  if(activeTutPrompt&&tutPromptRect&&state==='play'){
    if(x>=tutPromptRect.x&&x<=tutPromptRect.x+tutPromptRect.w&&y>=tutPromptRect.y&&y<=tutPromptRect.y+tutPromptRect.h){
      if(tryOpenTutPrompt())return true;
    }
  }
  if(isTutorial&&state==='play'){
    if(x>=W-110&&x<=W-14&&y>=14&&y<=44){goMenu();return true;}
  }
  if(state==='menu'||state==='levels'||state==='settings'||state==='dead'||state==='paused'){
    for(const r of uiRects){
      if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){uiAction(r.id);return true;}
    }
    if(state==='dead')return false;
    if(state==='paused'){state='play';return true;}
    return true;
  }
  if(inGame()){
    const e=pauseBtnRect();
    if(x>=e.x&&x<=e.x+e.w&&y>=e.y&&y<=e.y+e.h){openPause();return true;}
    return false;
  }
  return false;
}
function hitButton(x,y){
  const defs=[['hide',buttons.hide],['jump',buttons.jump],['dash',buttons.dash],['left',buttons.left],['right',buttons.right]];
  for(const pair of defs){
    const b=pair[1];
    if(Math.hypot(x-b.x,y-b.y)<b.r+16)return pair[0];
  }
  return null;
}
function recalcBtn(){
  const nb={left:false,right:false,jump:false};
  for(const b of activeTouches.values()){
    if(b==='left'||b==='right'||b==='jump')nb[b]=true;
  }
  if(btn.jump&&!nb.jump)releaseJump();
  btn.left=nb.left;btn.right=nb.right;btn.jump=nb.jump;
}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(adActive)return;
  touch.isTouch=true;lastTouchAt=Date.now();
  if(awaitingFocus){awaitingFocus=false;tryFocus();return;}
  audioGesture();
  for(const t of e.changedTouches){
    const consumed=handlePointerDown(t.clientX,t.clientY);
    if(consumed)continue;
    const b=hitButton(t.clientX,t.clientY);
    activeTouches.set(t.identifier,b);
    if(b==='jump')pressJumpAction();
    else if(b==='hide'){if(tryTakedown())return;toggleHide();}
    else if(b==='dash'){if(state==='play')player.tryDash();}
    else if(!b&&state!=='play')pressJumpAction();
  }
  recalcBtn();
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(adActive)return;
  for(const t of e.changedTouches){
    if(activeTouches.has(t.identifier))activeTouches.set(t.identifier,hitButton(t.clientX,t.clientY));
  }
  recalcBtn();
},{passive:false});
function touchRelease(e){
  e.preventDefault();
  if(adActive)return;
  for(const t of e.changedTouches)activeTouches.delete(t.identifier);
  recalcBtn();
}
canvas.addEventListener('touchend',touchRelease,{passive:false});
canvas.addEventListener('touchcancel',touchRelease,{passive:false});
canvas.addEventListener('mousedown',e=>{
  if(Date.now()-lastTouchAt<800)return;
  if(adActive)return;
  if(awaitingFocus){awaitingFocus=false;tryFocus();return;}
  audioGesture();
  e.preventDefault();
  const consumed=handlePointerDown(e.clientX,e.clientY);
  if(!consumed)pressJumpAction();
});
canvas.addEventListener('mouseup',()=>{if(Date.now()-lastTouchAt>800&&!adActive)releaseJump();});
