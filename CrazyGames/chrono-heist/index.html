    }
  });
}

function renderOverhauledLighting(theme) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; 

  // Guard Flashlights
  if (level.guards) {
    const isBlackout = level.switches && level.switches.some(s => s.type === "breaker" && s.active);
    level.guards.forEach(g => {
      const gOrigin = toIso(g.x, g.y, 16);
      const ga = g.angle || 0;
      const gdist = isBlackout ? (g.dist * 0.45) : g.dist;
      const gLeft = toIso(g.x + Math.cos(ga - g.fov / 2) * gdist, g.y + Math.sin(ga - g.fov / 2) * gdist, 0);
      const gMid = toIso(g.x + Math.cos(ga) * gdist, g.y + Math.sin(ga) * gdist, 0);
      const gRight = toIso(g.x + Math.cos(ga + g.fov / 2) * gdist, g.y + Math.sin(ga + g.fov / 2) * gdist, 0);

      let beamColor = theme.guardLight;
      if (g.suspicion > 0.6 || g.state === "ALARM_CHASE") beamColor = "rgba(239, 68, 68, 0.65)";
      else if (g.suspicion > 0.2) beamColor = "rgba(250, 204, 21, 0.65)";

      ctx.fillStyle = beamColor;
      ctx.beginPath();
      ctx.moveTo(gOrigin.x, gOrigin.y);
      ctx.lineTo(gLeft.x, gLeft.y);
      ctx.lineTo(gMid.x, gMid.y);
      ctx.lineTo(gRight.x, gRight.y);
      ctx.closePath();
      ctx.fill();
    });
  }

  // Camera Cones
  if (level.cameras) {
    level.cameras.forEach(cam => {
      if (cam.disabledTimer > 0) return;
      const cOrigin = toIso(cam.x, cam.y, 35);
      const ca = cam.curAngle || cam.baseAngle;
      const cLeft = toIso(cam.x + Math.cos(ca - cam.fov / 2) * cam.maxDist, cam.y + Math.sin(ca - cam.fov / 2) * cam.maxDist, 0);
      const cMid = toIso(cam.x + Math.cos(ca) * cam.maxDist, cam.y + Math.sin(ca) * cam.maxDist, 0);
      const cRight = toIso(cam.x + Math.cos(ca + cam.fov / 2) * cam.maxDist, cam.y + Math.sin(ca + cam.fov / 2) * cam.maxDist, 0);

      ctx.fillStyle = cam.alarm ? "rgba(239, 68, 68, 0.42)" : "rgba(250, 204, 21, 0.22)";
      ctx.beginPath();
      ctx.moveTo(cOrigin.x, cOrigin.y);
      ctx.lineTo(cLeft.x, cLeft.y);
      ctx.lineTo(cMid.x, cMid.y);
      ctx.lineTo(cRight.x, cRight.y);
      ctx.closePath();
      ctx.fill();
    });
  }

  ambientDust.forEach(d => {
    const dp = toIso(d.x, d.y, d.z);
    ctx.fillStyle = `rgba(241, 245, 249, ${d.alpha})`;
    ctx.beginPath();
    ctx.arc(dp.x, dp.y, d.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

function renderIsoParticles() {
  particles.forEach(p => {
    const sp = toIso(p.x, p.y, p.z);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
}

function renderTensionVignette() {
  const remaining = Math.max(0, maxLoopTime - loopTimer);
  // 1. Rewind flash: full-screen cyan wash that decays (allocation-free gradient reuse)
  if (rewindFlash > 0) {
    ctx.fillStyle = `rgba(56,189,248,${(0.28 * rewindFlash).toFixed(3)})`;
    ctx.fillRect(0, 0, viewW, viewH);
    const ringR = (1 - rewindFlash) * Math.max(viewW, viewH) * 0.7;
    ctx.strokeStyle = `rgba(186,230,253,${(0.55 * rewindFlash).toFixed(3)})`;
    ctx.lineWidth = 2 + 6 * rewindFlash;
    ctx.beginPath();
    ctx.arc(viewW / 2, viewH / 2, Math.max(40, ringR), 0, Math.PI * 2);
    ctx.stroke();
  }
  // 2. Slow-mo vignette: cool blue edge pulse while time is dilated
  if (slowMoTimer > 0) {
    const vigGrad = ctx.createRadialGradient(viewW / 2, viewH / 2, viewW * 0.32, viewW / 2, viewH / 2, viewW * 0.72);
    vigGrad.addColorStop(0, "rgba(56,189,248,0)");
    vigGrad.addColorStop(1, "rgba(56,189,248,0.30)");
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  // 3. Countdown danger vignette: red pulse in last 3s
  if (remaining <= 3.0) {
    const pulse = (Math.sin(loopTimer * 8) + 1) * 0.5;
    const vigGrad = ctx.createRadialGradient(viewW / 2, viewH / 2, viewW * 0.3, viewW / 2, viewH / 2, viewW * 0.7);
    vigGrad.addColorStop(0, "rgba(239, 68, 68, 0)");
    vigGrad.addColorStop(1, `rgba(239, 68, 68, ${0.18 + pulse * 0.24})`);
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, viewW, viewH);
  }
}

// ------------------------------------------------------------
// 11. AAA HUD — loop timer bar + echo pips, objective tracker,
//     gadget ammo, stealth status, briefing banner (canvas only)
// ------------------------------------------------------------
function renderInGameHUD() {
  // ---- 1. TOP-LEFT: stealth status + mission tag ----
  const hudX = 24, hudY = 24;

  const totalPips = 5;
  const maxGuardSuspicion = (level.guards && level.guards.length > 0)
    ? Math.max(...level.guards.map(g => g.suspicion || 0))
    : 0;

  const filledPips = Math.max(0, Math.ceil((1.0 - maxGuardSuspicion) * totalPips));
  const isAlarm = level.guards && level.guards.some(g => g.state === "ALARM_CHASE");

  ctx.save();
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  // panel plate
  ctx.fillStyle = UI_COLORS.panel;
  ctx.beginPath();
  ctx.roundRect(hudX - 10, hudY - 12, 196, 76, 8);
  ctx.fill();
  ctx.strokeStyle = isAlarm ? UI_COLORS.red : UI_COLORS.line;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // status dot + label
  ctx.fillStyle = isAlarm ? UI_COLORS.red : (maxGuardSuspicion > 0.2 ? UI_COLORS.gold : UI_COLORS.green);
  ctx.beginPath();
  ctx.arc(hudX + 2, hudY + 2, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = isAlarm ? UI_COLORS.red : (maxGuardSuspicion > 0.2 ? UI_COLORS.gold : UI_COLORS.dim);
  ctx.font = "bold 11px " + FONT_MONO;
  const statusStr = isAlarm ? "ALARM // LOCKDOWN" : (maxGuardSuspicion > 0.2 ? "CAUTION // SEARCH" : "COVERT // ECHO #" + cloneIndex);
  ctx.fillText(statusStr, hudX + 16, hudY + 2);

  // stealth pips (preallocated loop, no closures)
  const pipStartX = hudX, pipW = 30, pipH = 9, pipGap = 4;
  for (let i = 0; i < totalPips; i++) {
    const px = pipStartX + i * (pipW + pipGap);
    const py = hudY + 14;
    ctx.fillStyle = "rgba(15,23,42,0.9)";
    ctx.fillRect(px, py, pipW, pipH);
    if (i < filledPips) {
      ctx.fillStyle = isAlarm ? UI_COLORS.red : (maxGuardSuspicion > 0.2 ? UI_COLORS.gold : UI_COLORS.cyan);
      ctx.fillRect(px + 1, py + 1, pipW - 2, pipH - 2);
    }
  }
  ctx.fillStyle = UI_COLORS.faint;
  ctx.font = "10px " + FONT_MONO;
  ctx.fillText((level.chapter || "").toUpperCase(), hudX, hudY + 40);
  ctx.fillStyle = UI_COLORS.ink;
  ctx.font = "bold 12px " + FONT_UI;
  ctx.fillText(("LV" + level.id + " " + level.title).toUpperCase(), hudX, hudY + 52);
  ctx.restore();

  // ---- 2. TOP-CENTER: loop timer bar + echo pips ----
  const remaining = Math.max(0, maxLoopTime - loopTimer);
  const frac = remaining / maxLoopTime;
  const barW = 300, barH = 12;
  const barX = viewW / 2 - barW / 2, barY = 52;

  ctx.save();
  ctx.fillStyle = UI_COLORS.panel;
  ctx.beginPath();
  ctx.roundRect(barX - 14, 12, barW + 28, 58, 12);
  ctx.fill();
  ctx.strokeStyle = remaining <= 3.0 ? UI_COLORS.red : UI_COLORS.line;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.fillStyle = remaining <= 3.0 ? UI_COLORS.red : (remaining <= 5.0 ? UI_COLORS.gold : UI_COLORS.ink);
  ctx.font = "bold 16px " + FONT_MONO;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const mm = Math.floor(remaining / 60);
  const ss = (remaining % 60).toFixed(2).padStart(5, "0");
  ctx.fillText("00:" + mm + ss + "s", viewW / 2, 27);

  // timer track
  ctx.fillStyle = "rgba(15,23,42,0.95)";
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW, barH, 6);
  ctx.fill();
  const barColor = remaining <= 3.0 ? UI_COLORS.red : (remaining <= 5.0 ? UI_COLORS.gold : UI_COLORS.cyan);
  if (frac > 0) {
    ctx.fillStyle = barColor;
    ctx.beginPath();
    ctx.roundRect(barX, barY, Math.max(8, barW * frac), barH, 6);
    ctx.fill();
  }
  // 1s tick marks
  ctx.fillStyle = "rgba(3,6,10,0.8)";
  for (let s = 1; s < Math.round(maxLoopTime); s++) {
    ctx.fillRect(barX + (barW * s / maxLoopTime) - 1, barY + 1, 2, barH - 2);
  }

  // echo pips: recorded echoes + live operative
  const echoTotal = Math.max(1, cloneIndex);
  const pipR = 5, pipGapY = 8;
  const pipsW = echoTotal * (pipR * 2 + 4);
  let pipX = viewW / 2 - pipsW / 2 + pipR + 2;
  const pipY = barY + barH + pipGapY + pipR;
  ctx.font = "bold 9px " + FONT_MONO;
  for (let e = 1; e <= echoTotal; e++) {
    const isLive = (e === cloneIndex);
    ctx.fillStyle = isLive ? "#0b111e" : UI_COLORS.cyan;
    ctx.beginPath();
    ctx.arc(pipX, pipY, pipR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = isLive ? UI_COLORS.cyan : "rgba(56,189,248,0.35)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (isLive) {
      ctx.fillStyle = UI_COLORS.cyan;
      ctx.fillText("YOU", pipX, pipY - pipR - 7);
    }
    pipX += pipR * 2 + 4;
  }
  ctx.restore();

  // ---- 3. TOP-RIGHT: gadget ammo + objective tracker ----
  const slotSize = 46;
  const slotGap = 10;
  const totalSlots = 4;
  const slotsStartX = viewW - 24 - (totalSlots * slotSize + (totalSlots - 1) * slotGap);
  const slotsY = 18;

  const echoCarrying = ghosts.some(g => g.carrying);
  const lootSecured = player.hasLoot || echoCarrying;
  const atExit = level.exit && player.x >= level.exit.x && player.x <= level.exit.x + level.exit.w && player.y >= level.exit.y && player.y <= level.exit.y + level.exit.h;
  const items = [
    {
      id: "dart",
      label: "[F] EMP",
      count: String(player.empAmmo),
      active: player.empAmmo > 0,
      drawIcon: (cx, cy) => {
        ctx.strokeStyle = player.empAmmo > 0 ? UI_COLORS.cyan : UI_COLORS.faint;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx - 8, cy + 8);
        ctx.lineTo(cx + 8, cy - 8);
        ctx.stroke();
        ctx.fillStyle = player.empAmmo > 0 ? UI_COLORS.cyan : UI_COLORS.faint;
        ctx.beginPath();
        ctx.arc(cx + 8, cy - 8, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    {
      id: "coin",
      label: "[Q] COIN",
      count: String(player.coinsAmmo),
      active: player.coinsAmmo > 0,
      drawIcon: (cx, cy) => {
        ctx.fillStyle = player.coinsAmmo > 0 ? UI_COLORS.gold : UI_COLORS.faint;
        ctx.beginPath();
        ctx.arc(cx, cy, 7.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ca8a04";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    },
    {
      id: "sneak",
      label: "[C]",
      count: player.isCrouching ? "SNEAK" : "WALK",
      isTextBadge: true,
      active: player.isCrouching,
      drawIcon: (cx, cy) => {
        ctx.fillStyle = player.isCrouching ? UI_COLORS.gold : UI_COLORS.faint;
        ctx.beginPath();
        ctx.arc(cx, cy - 2, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(cx - 5, cy + 3, 10, 5);
      }
    },
    {
      id: "loot",
      label: "TARGET",
      count: lootSecured ? "1/1" : "0/1",
      active: lootSecured,
      drawIcon: (cx, cy) => {
        ctx.fillStyle = lootSecured ? UI_COLORS.pink : "#334155";
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();
        if (lootSecured) {
          ctx.fillStyle = "#fda4af";
          ctx.beginPath();
          ctx.arc(cx - 2, cy - 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  ];

  items.forEach((item, idx) => {
    const sx = slotsStartX + idx * (slotSize + slotGap);
    const sy = slotsY;

    ctx.save();
    ctx.fillStyle = "rgba(10, 15, 24, 0.88)";
    ctx.beginPath();
    ctx.roundRect(sx, sy, slotSize, slotSize, 6);
    ctx.fill();

    ctx.strokeStyle = item.active ? "rgba(148, 163, 184, 0.45)" : "rgba(51, 65, 85, 0.35)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    item.drawIcon(sx + slotSize / 2, sy + slotSize / 2);

    const badgeW = item.isTextBadge ? 30 : 22;
    const badgeH = 13;
    const bx = sx + slotSize - badgeW - 2;
    const by = sy + slotSize - badgeH - 2;

    ctx.fillStyle = item.active ? "#15803d" : "#1e293b";
    ctx.beginPath();
    ctx.roundRect(bx, by, badgeW, badgeH, 3);
    ctx.fill();

    ctx.fillStyle = item.active ? "#86efac" : "#64748b";
    ctx.font = "bold 9px " + FONT_MONO;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(item.count), bx + badgeW / 2, by + badgeH / 2);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 9px " + FONT_MONO;
    ctx.textAlign = "center";
    ctx.fillText(item.label, sx + slotSize / 2, sy + slotSize + 12);

    ctx.restore();
  });

  // ---- 4. OBJECTIVE TRACKER (under gadgets): loot -> exit checklist ----
  const objW = totalSlots * slotSize + (totalSlots - 1) * slotGap;
  const objX = slotsStartX, objY = slotsY + slotSize + 28;
  ctx.save();
  ctx.fillStyle = UI_COLORS.panel;
  ctx.beginPath();
  ctx.roundRect(objX, objY, objW, 52, 8);
  ctx.fill();
  ctx.strokeStyle = lootSecured ? UI_COLORS.green : UI_COLORS.line;
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "bold 10px " + FONT_MONO;
  ctx.fillStyle = lootSecured ? UI_COLORS.green : UI_COLORS.gold;
  ctx.fillText(lootSecured ? "[✓] LOOT SECURED" : "[ ] GRAB THE LOOT", objX + 10, objY + 14);
  ctx.fillStyle = atExit ? UI_COLORS.green : UI_COLORS.dim;
  const exitLabel = (level.exit && level.exit.label) || "EXIT";
  ctx.fillText((lootSecured && atExit ? "[✓] " : "[ ] ") + "EXTRACT: " + exitLabel, objX + 10, objY + 32);
  ctx.fillStyle = UI_COLORS.faint;
  ctx.font = "9px " + FONT_MONO;
  ctx.fillText("PAR " + level.parClones + " ECHO" + (level.parClones > 1 ? "S" : ""), objX + 10, objY + 45);
  ctx.restore();

  // ---- 5. BRIEFING BANNER (first seconds of each level, canvas only) ----
  if (briefingTimer > 0 && level.briefing) {
    const alpha = Math.min(1, briefingTimer / 1.2);
    const bw = Math.min(640, viewW - 60);
    const bx = viewW / 2 - bw / 2, by = viewH - 108;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = UI_COLORS.panel;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, 62, 10);
    ctx.fill();
    ctx.strokeStyle = UI_COLORS.cyanDim;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = UI_COLORS.cyan;
    ctx.font = "bold 10px " + FONT_MONO;
    ctx.fillText("◈ MISSION BRIEF — LV" + level.id + " " + level.title.toUpperCase(), viewW / 2, by + 13);
    ctx.fillStyle = UI_COLORS.ink;
    ctx.font = "13px " + FONT_UI;
    // word-wrap briefing to two lines max (allocation-free: fixed slices)
    const msg = level.briefing;
    let split = Math.floor(msg.length / 2);
    const sp = msg.lastIndexOf(" ", 60);
    if (sp > 20) split = sp;
    ctx.fillText(msg.slice(0, split), viewW / 2, by + 32);
    if (msg.length > split) ctx.fillText(msg.slice(split + 1, split + 95), viewW / 2, by + 48);
    ctx.restore();
  }

  // ---- 6. BOTTOM ACTION HINTS: sneak + pause/help, only when relevant ----
  let hintText = null;
  if (player.isCrouching) hintText = "SNEAKING [C] — SLOW + QUIET";
  else if (loopTimer < 2.5 && briefingTimer <= 0) hintText = "[R] REWIND • [TAB] RECON • [ESC] PAUSE";
  if (hintText) {
    ctx.save();
    ctx.fillStyle = "rgba(8, 12, 20, 0.85)";
    const hw = hintText.length * 7.2 + 28;
    ctx.beginPath();
    ctx.roundRect(viewW / 2 - hw / 2, viewH - 42, hw, 26, 13);
    ctx.fill();
    ctx.strokeStyle = player.isCrouching ? UI_COLORS.gold : UI_COLORS.line;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = player.isCrouching ? UI_COLORS.gold : UI_COLORS.dim;
    ctx.font = "bold 11px " + FONT_MONO;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(hintText, viewW / 2, viewH - 29);
    ctx.restore();
  }
}

// Diegetic Mini-Radar (nestled under objective tracker in top-right)
function renderMiniRadar() {
  const radarW = 125, radarH = 105;
  const radarX = viewW - radarW - 24;
  const radarY = 196;

  ctx.save();
  ctx.fillStyle = "rgba(7, 11, 18, 0.80)";
  ctx.beginPath();
  ctx.roundRect(radarX, radarY, radarW, radarH, 6);
  ctx.fill();
  ctx.strokeStyle = "rgba(148, 163, 184, 0.3)";
  ctx.lineWidth = 1;
  ctx.stroke();

  const scaleX = (radarW - 14) / 700;
  const scaleY = (radarH - 16) / 650;
  const offX = radarX + 7;
  const offY = radarY + 12;

  // Walls
  ctx.fillStyle = "#334155";
  level.walls.forEach(w => {
    ctx.fillRect(offX + w.x * scaleX, offY + w.y * scaleY, w.w * scaleX, w.h * scaleY);
  });

  // Player Blip
  ctx.fillStyle = "#38bdf8";
  ctx.beginPath();
  ctx.arc(offX + player.x * scaleX, offY + player.y * scaleY, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Guards & Flashlight Cones
  if (level.guards) {
    level.guards.forEach(g => {
      ctx.fillStyle = g.state === "ALARM_CHASE" ? "#ef4444" : "#facc15";
      ctx.beginPath();
      ctx.arc(offX + g.x * scaleX, offY + g.y * scaleY, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  ctx.fillStyle = "#64748b";
  ctx.font = "8px 'JetBrains Mono', monospace";
  ctx.textAlign = "left";
  ctx.fillText("RADAR", radarX + 6, radarY + 9);
  ctx.restore();
}

        <div style="position:relative;display:flex;flex-direction:column;align-items:center;max-width:860px;width:100%;">
        <div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:6px;color:#38bdf8;font-weight:700;margin-bottom:8px;">◈ TACTICAL ESPIONAGE ENGINE ◈</div>
        <h1 class="ch-logo" style="font-size:64px;font-weight:900;letter-spacing:4px;margin:0;line-height:1;"><span class="ch-shimmer">CHRONO HEIST</span></h1>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:4px;color:#facc15;font-weight:700;margin:8px 0 12px 0;">— MASTER EDITION —</div>
        <div style="background:rgba(56,189,248,0.12);border:1px solid #0284c7;color:#38bdf8;padding:6px 24px;border-radius:24px;font-size:13px;font-weight:700;margin-bottom:10px;font-family:'JetBrains Mono',monospace;">
          8 CLASSIFIED HEISTS • 4 CHAPTERS • 10s TIME-LOOPS
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#facc15;letter-spacing:2px;margin-bottom:14px;">★ ${totalStars} / ${LEVELS.length * 3} ECHO STARS COLLECTED ★</div>
        <p style="color:#94a3b8;font-size:15px;max-width:560px;text-align:center;line-height:1.55;margin:0 0 22px 0;">
          Infiltrate vaults and sky-penthouse casinos by synchronizing with recorded temporal echoes of yourself. Every 10 seconds the loop rewinds — your past selves replay, and the perfect crew emerges.
        </p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;">
          <button id="btn-play" class="interactive ch-btn-main" style="background:#0284c7;color:#fff;border:none;padding:15px 46px;font-size:19px;font-weight:800;border-radius:8px;cursor:pointer;box-shadow:0 6px 28px rgba(2,132,199,0.5);letter-spacing:1px;font-family:'Rajdhani',sans-serif;">
            ▶ START OPERATION
          </button>
          <button id="btn-levels" class="interactive" style="background:transparent;color:#94a3b8;border:1px solid #334155;padding:15px 34px;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;font-family:'JetBrains Mono',monospace;">
            MISSION DOSSIERS
          </button>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;color:#64748b;margin-bottom:8px;">— JUMP TO CHAPTER —</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;">
          ${CHAPTER_JUMPS.map(c => `<button class="interactive ch-chip" data-ch="${c.idx}" style="background:rgba(11,17,30,0.9);border:1px solid ${c.color};color:${c.color};padding:9px 18px;font-size:12px;font-weight:800;border-radius:20px;cursor:pointer;font-family:'JetBrains Mono',monospace;">${c.name}</button>`).join("")}
        </div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:18px;color:#64748b;font-size:12px;max-width:820px;font-family:'JetBrains Mono',monospace;">
          <div><strong style="color:#38bdf8;">WASD:</strong> Move</div>
          <div><strong style="color:#cbd5e1;">[E]:</strong> Hack/Vent</div>
          <div><strong style="color:#cbd5e1;">[R]:</strong> Rewind</div>
          <div><strong style="color:#cbd5e1;">[F]/[Q]:</strong> EMP/Coin</div>
          <div><strong style="color:#cbd5e1;">[C]:</strong> Sneak</div>
          <div><strong style="color:#cbd5e1;">[TAB]:</strong> Recon</div>
          <div><strong style="color:#cbd5e1;">[ESC]:</strong> Pause</div>
        </div>
        </div>
      </div>
    `;
    document.getElementById('btn-play').onclick = () => loadLevel(0);
    document.getElementById('btn-levels').onclick = () => setGameState("LEVEL_SELECT");
    document.querySelectorAll('[data-ch]').forEach(b => {
      b.onclick = () => loadLevel(parseInt(b.dataset.ch, 10));
    });
  } else if (gameState === "PLAYING" && (paused || helpVisible)) {
    const isHelp = helpVisible && !paused;
    uiLayer.innerHTML = `
      <div style="position:absolute;inset:0;background:rgba(3,6,10,0.82);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8fafc;padding:20px;">
        <div style="background:#0b111e;border:1px solid #38bdf8;border-radius:14px;padding:30px 34px;max-width:560px;width:92%;box-shadow:0 16px 54px rgba(0,0,0,0.75);">
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:4px;color:#38bdf8;font-weight:800;margin-bottom:6px;">${isHelp ? "FIELD MANUAL" : "⏸ OPERATION PAUSED"}</div>
          <h2 style="font-size:30px;font-weight:900;margin:0 0 4px 0;">${isHelp ? "HOW TO HEIST" : ("LV" + level.id + " · " + level.title)}</h2>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#facc15;letter-spacing:1px;margin-bottom:16px;">${LEVEL_TRICKS[level.id] || ""} · ${ghosts.length} ECHO${ghosts.length === 1 ? "" : "S"} BANKED</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#cbd5e1;margin-bottom:20px;">
            <div><strong style="color:#38bdf8;">WASD / ←↑↓→</strong> — move</div>
            <div><strong style="color:#38bdf8;">[E] / [Space]</strong> — hack · vent · breaker</div>
            <div><strong style="color:#38bdf8;">[R]</strong> — rewind loop</div>
            <div><strong style="color:#38bdf8;">[F] / [Q]</strong> — EMP dart / coin lure</div>
            <div><strong style="color:#38bdf8;">[C]</strong> — sneak (slow + quiet)</div>
            <div><strong style="color:#38bdf8;">[TAB]</strong> — recon vision</div>
            <div><strong style="color:#38bdf8;">[ESC] / [P]</strong> — pause</div>
            <div><strong style="color:#38bdf8;">[N]</strong> — restart level</div>
          </div>
          <div style="background:#03060a;border-radius:8px;padding:12px 14px;font-size:13px;color:#94a3b8;line-height:1.55;margin-bottom:20px;">
            <strong style="color:#4ade80;">ECHO RULES:</strong> every rewind records you. Echoes hold plates, hack terminals and trip breakers — but must physically touch loot to carry it. Only the <strong style="color:#f8fafc;">live YOU</strong> can extract at the exit.
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
            ${paused ? `<button id="btn-resume" class="interactive" style="background:#0284c7;color:#fff;border:none;padding:12px 30px;font-size:14px;font-weight:800;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;">▶ RESUME</button>` : ""}
            <button id="btn-restart2" class="interactive" style="background:#1e293b;color:#fff;border:none;padding:12px 24px;font-size:13px;font-weight:700;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;">↻ RESTART [N]</button>
            <button id="btn-quit2" class="interactive" style="background:transparent;color:#94a3b8;border:1px solid #334155;padding:12px 24px;font-size:13px;font-weight:700;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;">DOSSIERS</button>
          </div>
        </div>
      </div>
    `;
    const br = document.getElementById('btn-resume');
    if (br) br.onclick = () => { paused = false; helpVisible = false; renderUI(); };
    document.getElementById('btn-restart2').onclick = () => loadLevel(currentLevelIdx);
    document.getElementById('btn-quit2').onclick = () => { paused = false; helpVisible = false; reportGameplayStop(); setGameState("LEVEL_SELECT"); };
  } else if (gameState === "LEVEL_SELECT") {
    const chapterMeta = [
      { key: "CHAPTER 1", name: "CHAPTER I — THE BANK", color: "#38bdf8", img: "thumb_bank.jpg" },
      { key: "CHAPTER 2", name: "CHAPTER II — THE MUSEUM", color: "#facc15", img: "thumb_museum.jpg" },
      { key: "CHAPTER 3", name: "CHAPTER III — SECTOR 7", color: "#4ade80", img: "thumb_lab.jpg" },
      { key: "CHAPTER 4", name: "CHAPTER IV — SKYRIDGE", color: "#f43f5e", img: "thumb_penthouse.jpg" }
    ];

    let cardsHtml = "";
    LEVELS.forEach((lvl, i) => {
      const stars = levelStars[lvl.id] || 0;
      const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
      const meta = chapterMeta.find(c => (lvl.chapter || "").indexOf(c.key) === 0) || chapterMeta[0];
      const isHeader = i === 0 || LEVELS[i - 1].chapter !== lvl.chapter;
      if (isHeader) {
        const chStars = LEVELS.filter(l => l.chapter === lvl.chapter).reduce((s, l) => s + (levelStars[l.id] || 0), 0);
        cardsHtml += `
          <div style="grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:${i === 0 ? "0" : "14px"} 0 2px 0;">
            <div style="width:4px;height:26px;background:${meta.color};border-radius:2px;box-shadow:0 0 12px ${meta.color};"></div>
            <div style="font-size:19px;font-weight:900;letter-spacing:2px;color:#f8fafc;">${meta.name}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${meta.color};">★ ${chStars}/6</div>
            <div style="flex:1;height:1px;background:#1e293b;"></div>
          </div>`;
      }
      const locked = i > 0 && !(levelStars[LEVELS[i - 1].id] > 0);
      cardsHtml += `
        <div class="interactive level-card" data-idx="${i}" style="background:#0b111e;border:1px solid ${stars === 3 ? "#facc15" : "#1e293b"};border-radius:10px;overflow:hidden;cursor:${locked ? "not-allowed" : "pointer"};opacity:${locked ? "0.55" : "1"};transition:transform 0.15s, border-color 0.15s;display:flex;flex-direction:column;">
          <div style="width:100%;height:96px;background:url('${meta.img}') center/cover no-repeat;border-bottom:1px solid rgba(148,163,184,0.2);position:relative;">
            <div style="position:absolute;inset:0;background:linear-gradient(to top, #0b111e 0%, transparent 80%);"></div>
            <div style="position:absolute;top:8px;left:8px;background:rgba(3,6,10,0.8);border:1px solid ${meta.color};padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:${meta.color};font-weight:700;">
              LV${lvl.id} · ${locked ? "🔒 CLEAR LV" + LEVELS[i - 1].id + " TO UNLOCK" : lvl.chapter}
            </div>
            ${stars === 3 ? `<div style="position:absolute;top:8px;right:8px;background:rgba(250,204,21,0.15);border:1px solid #facc15;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#facc15;font-weight:800;">PERFECT</div>` : ""}
          </div>
          <div style="padding:14px;">
            <div style="font-size:17px;font-weight:800;color:#f8fafc;margin-bottom:2px;">${lvl.title}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${meta.color};letter-spacing:1px;margin-bottom:6px;">${LEVEL_TRICKS[lvl.id] || ""}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#94a3b8;margin-bottom:8px;">Par ${lvl.parClones} echoes • 10s loop • ${(lvl.loot && lvl.loot.name) || "Vault"}</div>
            <div style="font-size:16px;color:#facc15;letter-spacing:2px;">${starStr}</div>
          </div>
        </div>
      `;
    });

    uiLayer.innerHTML = `
      <div style="position:absolute;inset:0;background:#03060a;display:flex;flex-direction:column;align-items:center;padding:36px 20px;color:#f8fafc;overflow-y:auto;">
        <h2 style="font-size:36px;font-weight:900;letter-spacing:2px;margin:0 0 6px 0;">MISSION DOSSIERS</h2>
        <p style="font-family:'JetBrains Mono',monospace;color:#94a3b8;font-size:13px;margin:0 0 4px 0;">8 CLASSIFIED OPERATIONS • ★ ${totalStars}/${LEVELS.length * 3} ECHO STARS</p>
        <p style="font-family:'JetBrains Mono',monospace;color:#64748b;font-size:11px;margin:0 0 20px 0;">EACH HEIST TEACHES ONE NEW TRICK — CLEAR A LEVEL TO UNLOCK THE NEXT</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));gap:18px;width:100%;max-width:960px;margin-bottom:28px;">
          ${cardsHtml}
        </div>
        <button id="btn-back" class="interactive" style="background:#1e293b;color:#fff;border:none;padding:12px 36px;font-size:14px;font-weight:700;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;">
          BACK TO MENU
        </button>
      </div>
    `;

    document.querySelectorAll('.level-card').forEach(card => {
      card.onclick = () => {
        const idx = parseInt(card.dataset.idx, 10);
        if (idx > 0 && !(levelStars[LEVELS[idx - 1].id] > 0)) return; // soft-gated progression
        loadLevel(idx);
      };
    });
    document.getElementById('btn-back').onclick = () => setGameState("MENU");
  } else if (gameState === "VICTORY") {
    const star1 = true;
    const star2 = cloneIndex <= level.parClones;
    const star3 = levelStats.alarmsTripped === 0;
    const totalStars = (star1 ? 1 : 0) + (star2 ? 1 : 0) + (star3 ? 1 : 0);
    const starStr = "★".repeat(totalStars) + "☆".repeat(3 - totalStars);
    const hasNext = currentLevelIdx + 1 < LEVELS.length;
    const nextTrick = hasNext ? (LEVEL_TRICKS[LEVELS[currentLevelIdx + 1].id] || "") : "";
    const newBest = totalStars >= (levelStars[level.id] || 0) && totalStars > 0;

    uiLayer.innerHTML = `
      <div style="position:absolute;inset:0;background:rgba(3, 6, 10, 0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8fafc;padding:16px;">
        <div style="background:#0b111e;border:1px solid ${totalStars === 3 ? "#facc15" : "#38bdf8"};border-radius:14px;padding:32px;max-width:520px;width:92%;text-align:center;box-shadow:0 16px 54px rgba(0,0,0,0.75);">
          <div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:3px;color:#4ade80;font-weight:800;margin-bottom:6px;">OPERATION SUCCESSFUL — LV${level.id} ${level.title.toUpperCase()}</div>
          <h2 style="font-size:34px;font-weight:900;margin:0 0 4px 0;">${totalStars === 3 ? "FLAWLESS HEIST!" : "LOOT EXTRACTED!"}</h2>
          ${newBest ? `<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#38bdf8;letter-spacing:2px;margin-bottom:6px;">◈ NEW BEST ◈</div>` : ""}
          <div style="font-size:46px;color:#facc15;letter-spacing:6px;margin-bottom:14px;">${starStr}</div>

          <div style="background:#03060a;border-radius:8px;padding:16px;text-align:left;margin-bottom:24px;display:flex;flex-direction:column;gap:10px;font-size:14px;font-family:'JetBrains Mono',monospace;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span>${star1 ? "★" : "☆"} <strong style="color:${star1 ? "#facc15" : "#64748b"}">Target Secured</strong> (${level.loot ? level.loot.name : "Vault"})</span>
              <span style="color:#4ade80;font-weight:bold;">DONE</span>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span>${star2 ? "★" : "☆"} <strong style="color:${star2 ? "#facc15" : "#64748b"}">Par Efficiency</strong> (${cloneIndex} / ${level.parClones} Echoes)</span>
              <span style="color:${star2 ? "#4ade80" : "#ef4444"};font-weight:bold;">${star2 ? "PASSED" : "MISSED"}</span>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span>${star3 ? "★" : "☆"} <strong style="color:${star3 ? "#facc15" : "#64748b"}">Ghost Protocol</strong> (Zero Alarms)</span>
              <span style="color:${star3 ? "#4ade80" : "#ef4444"};font-weight:bold;">${star3 ? "PASSED" : `${levelStats.alarmsTripped} Tripped`}</span>
            </div>
          </div>

          <div style="display:flex;gap:12px;justify-content:center;">
            <button id="btn-retry" class="interactive" style="background:#1e293b;color:#fff;border:none;padding:12px 24px;font-size:14px;font-weight:700;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;">
              RETRY FOR 3 ★
            </button>
            ${hasNext ? `
              <button id="btn-next" class="interactive" style="background:#0284c7;color:#fff;border:none;padding:12px 34px;font-size:15px;font-weight:800;border-radius:6px;cursor:pointer;box-shadow:0 4px 14px rgba(2,132,199,0.4);font-family:'JetBrains Mono',monospace;">
                NEXT HEIST →
              </button>
            ` : `
              <button id="btn-menu" class="interactive" style="background:#0284c7;color:#fff;border:none;padding:12px 34px;font-size:15px;font-weight:800;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;">
                ALL CHAPTERS CLEARED!
              </button>
            `}
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b;margin-top:14px;">⏱ ${levelStats.timeTaken.toFixed(1)}s HEIST TIME • ${ghosts.length} ECHO${ghosts.length === 1 ? "" : "S"} BANKED</div>
          ${hasNext ? `<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#facc15;letter-spacing:1px;margin-top:6px;">NEXT: LV${LEVELS[currentLevelIdx + 1].id} ${LEVELS[currentLevelIdx + 1].title.toUpperCase()} — ${nextTrick}</div>` : `<div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#facc15;margin-top:8px;">★ ${LEVELS.reduce((s, l) => s + (levelStars[l.id] || 0), 0)}/${LEVELS.length * 3} ECHO STARS — MASTER THIEF STATUS ★</div>`}
        </div>
      </div>
    `;

    document.getElementById('btn-retry').onclick = () => loadLevel(currentLevelIdx);
    if (hasNext) {
      document.getElementById('btn-next').onclick = () => loadLevel(currentLevelIdx + 1);
    } else {
      document.getElementById('btn-menu').onclick = () => setGameState("LEVEL_SELECT");
    }
  }
}

// ------------------------------------------------------------
// 13. MAIN ANIMATION LOOP
// ------------------------------------------------------------
function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

resizeCanvas();
setGameState("MENU");
requestAnimationFrame(loop);

</script>
</body>
</html>
