// Canvas roundRect Polyfill for universal browser compatibility
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii = 0) {
    let r = radii;
    if (typeof r === 'number') r = [r, r, r, r];
    else if (!Array.isArray(r)) r = [0, 0, 0, 0];
    const tl = r[0] || 0, tr = r[1] || tl, br = r[2] || tl, bl = r[3] || tr;
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
    return this;
  };
}

// ------------------------------------------------------------
// 1. PROCEDURAL AUDIO SYNTHESIZER
// ------------------------------------------------------------
class AudioManager {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.ambientRunning = false;
    this.masterGain = null;
    this.bassGain = null;
    this.drumsGain = null;
    this.leadGain = null;
    this.stepCounter = 0;
  }

  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    this.ctx = new AudioCtx();

    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.55;
    this.masterGain.connect(this.ctx.destination);

    this.bassGain = this.ctx.createGain();
    this.bassGain.gain.value = 0.22;
    this.bassGain.connect(this.masterGain);

    this.drumsGain = this.ctx.createGain();
    this.drumsGain.gain.value = 0.0;
    this.drumsGain.connect(this.masterGain);

    this.leadGain = this.ctx.createGain();
    this.leadGain.gain.value = 0.0;
    this.leadGain.connect(this.masterGain);

    this.startAmbient();
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  startAmbient() {
    if (!this.ctx || this.ambientRunning) return;
    this.ambientRunning = true;

    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const filter = this.ctx.createBiquadFilter();

    osc1.type = 'sawtooth';
    osc1.frequency.value = 55; // A1
    osc2.type = 'sine';
    osc2.frequency.value = 110; // A2

    filter.type = 'lowpass';
    filter.frequency.value = 220;
    filter.Q.value = 3.5;

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(this.bassGain);

    osc1.start();
    osc2.start();

    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 1.0;
    lfoGain.gain.value = 65;
    lfo.connect(filter.frequency);
    lfo.start();

    setInterval(() => {
      if (!this.ctx || this.muted || gameState !== "PLAYING") return;
      this.stepCounter++;

      if (cloneIndex >= 2 && this.drumsGain.gain.value > 0.01) {
        this.playHiHat();
      }
      if (cloneIndex >= 3 && this.stepCounter % 2 === 0) {
        this.playMelodyNote();
      }
    }, 250);
  }

  updateMusicLayers(clones) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (clones >= 2) this.drumsGain.gain.setTargetAtTime(0.18, now, 0.4);
    else this.drumsGain.gain.setTargetAtTime(0.0, now, 0.4);

    if (clones >= 3) this.leadGain.gain.setTargetAtTime(0.15, now, 0.4);
    else this.leadGain.gain.setTargetAtTime(0.0, now, 0.4);
  }

  playHiHat() {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 8000;
    gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(this.drumsGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.06);
  }

  playMelodyNote() {
    const notes = [220, 261.63, 293.66, 329.63, 392.00];
    const freq = notes[Math.floor(Math.random() * notes.length)];
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(this.leadGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.36);
  }

  playTick(urgency = 1.0) {
    if (!this.ctx || this.muted) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800 * urgency, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(260, this.ctx.currentTime + 0.04);
    gain.gain.setValueAtTime(0.22 * urgency, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.05);
  }

  playSuspicionAlert() {
    if (!this.ctx || this.muted) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(680, this.ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.22);
  }

  playRadioChatter() {
    if (!this.ctx || this.muted) return;
    const bufferSize = this.ctx.sampleRate * 0.25;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    const noise = this.ctx.createBufferSource();
    noise.buffer = noiseBuffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800;
    filter.Q.value = 5;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    noise.start();
  }

  playFlashlightClick() {
    if (!this.ctx || this.muted) return;
    const osc = this.ctx.createOscillator();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.035);
    gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.05);

    osc.type = 'sine';

    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.24);

    osc.type = 'sine';

    osc.frequency.linearRampToValueAtTime(360, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.13);

  playHackBeep(pitch = 1.0) {
    if (!this.ctx || this.muted) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200 * pitch, this.ctx.currentTime);
    osc.frequency.setValueAtTime(1600 * pitch, this.ctx.currentTime + 0.02);
    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.05);
  }

  playHackComplete() {
    if (!this.ctx || this.muted) return;
    [880, 1174.66, 1760].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      const t = this.ctx.currentTime + i * 0.06;
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + 0.22);
    });
  }

  playSwitch() {
    if (!this.ctx || this.muted) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(540, this.ctx.currentTime);
    osc.frequency.setValueAtTime(960, this.ctx.currentTime + 0.02);
    gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }

  playBreaker() {
    if (!this.ctx || this.muted) return;
    const osc = this.ctx.createOscillator();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, this.ctx.currentTime);

    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }

  playDoor(opening = true) {
    if (!this.ctx || this.muted) return;
    const bufferSize = this.ctx.sampleRate * 0.28;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

    const noise = this.ctx.createBufferSource();
    noise.buffer = noiseBuffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(opening ? 650 : 360, this.ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(opening ? 240 : 120, this.ctx.currentTime + 0.26);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    noise.start();
  }

  playEmp() {

    const osc = this.ctx.createOscillator();

    osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.28);
    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(this.masterGain);

    osc.stop(this.ctx.currentTime + 0.32);

    osc.type = 'sine';

    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
    osc.connect(gain);

  playLoot() {
    if (!this.ctx || this.muted) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';

  playAlarm() {

  playWin() {

      osc.connect(gain);
      gain.connect(this.masterGain);

      osc.stop(this.ctx.currentTime + 1.2);

// 3. ISOMETRIC MATH & RAYCAST LINE-OF-SIGHT ENGINE
// ------------------------------------------------------------
const ISO_ANG = Math.PI / 6;
const COS_30 = Math.cos(ISO_ANG);
const SIN_30 = Math.sin(ISO_ANG);

function toIso(wx, wy, wz = 0) {
  return {
    x: (wx - wy) * COS_30,
    y: (wx + wy) * SIN_30 - wz
  };
}

function fromIso(sx, sy) {
  const x_minus_y = sx / COS_30;
  const x_plus_y = sy / SIN_30;
  return {
    x: (x_minus_y + x_plus_y) * 0.5,
    y: (x_plus_y - x_minus_y) * 0.5
  };
}

function angleLerp(a0, a1, t) {
  let diff = (a1 - a0) % (Math.PI * 2);
  if (diff < -Math.PI) diff += Math.PI * 2;
  if (diff > Math.PI) diff -= Math.PI * 2;
  return a0 + diff * Math.min(1, Math.max(0, t));
}

function lineIntersectsSegment(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 0.0001) return false;
  const u = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const v = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  return (u > 0.04 && u < 0.96 && v >= 0 && v <= 1);
}

function hasLineOfSight(x1, y1, x2, y2) {
  if (!level) return true;
  const p1 = { x: x1, y: y1 }, p2 = { x: x2, y: y2 };

  for (let i = 0; i < level.walls.length; i++) {
    const w = level.walls[i];
    const segs = [
      [{ x: w.x, y: w.y }, { x: w.x + w.w, y: w.y }],
      [{ x: w.x + w.w, y: w.y }, { x: w.x + w.w, y: w.y + w.h }],
      [{ x: w.x + w.w, y: w.y + w.h }, { x: w.x, y: w.y + w.h }],
      [{ x: w.x, y: w.y + w.h }, { x: w.x, y: w.y }]
    ];
    for (let s = 0; s < segs.length; s++) {
      if (lineIntersectsSegment(p1, p2, segs[s][0], segs[s][1])) return false;
    }
  }

  for (let i = 0; i < level.doors.length; i++) {
    const d = level.doors[i];
    if (d.openProgress < 0.7) {
      const dw = d.orientation === "V" ? d.w : d.w * (1 - d.openProgress);
      const dh = d.orientation === "V" ? d.h * (1 - d.openProgress) : d.h;
      const segs = [
        [{ x: d.x, y: d.y }, { x: d.x + dw, y: d.y }],
        [{ x: d.x + dw, y: d.y }, { x: d.x + dw, y: d.y + dh }],
        [{ x: d.x + dw, y: d.y + dh }, { x: d.x, y: d.y + dh }],
        [{ x: d.x, y: d.y + dh }, { x: d.x, y: d.y }]
      ];
      for (let s = 0; s < segs.length; s++) {
        if (lineIntersectsSegment(p1, p2, segs[s][0], segs[s][1])) return false;
      }
    }
  }

  return true;
}

let levelStars = {};
try { levelStars = JSON.parse(localStorage.getItem('chrono_heist_stars_master') || "{}") || {}; } catch (e) { levelStars = {}; }
function saveStars() { try { localStorage.setItem('chrono_heist_stars_master', JSON.stringify(levelStars)); } catch (e) {} }

let loopTimer = 0;
let maxLoopTime = 10.0;
let ghosts = [];
let currentRun = [];
let cloneIndex = 1;

let levelStats = {
  alarmsTripped: 0,
  timeTaken: 0
};

let player = {
  x: 100, y: 100,
  angle: 0,
  radius: 16,
  speed: 200,
  isInteracting: false,
  isCrouching: false,
  isRecon: false,
  flashlightOn: true,
  inVent: false,
  ventTarget: null,
  ventProgress: 0,
  hasLoot: false,

  coinsAmmo: 2
};

// Offscreen Darkness Fog-of-War Canvas
const fogCanvas = document.createElement('canvas');
const fogCtx = fogCanvas.getContext('2d');

let input = {
  up: false, down: false, left: false, right: false,
  interact: false,
  screenMouseX: 0, screenMouseY: 0
};

let projectiles = [];
let noiseRipples = [];
let particles = [];
let ambientDust = [];
let screenShake = 0;
let slowMoTimer = 0;
let ghostPaths = [];

// ---- AAA UI state (no per-frame allocation: scratch vars reused in hot paths) ----
let rewindFlash = 0;        // 1 -> 0 decay after every commitAndRewindLoop
let uiTime = 0;             // global menu/HUD animation clock (seconds)
let briefingTimer = 6.5;    // per-level briefing banner lifetime
let helpVisible = false;    // pause/help overlay toggle
let paused = false;         // true pause (freezes update sim)
const UI_COLORS = {
  cyan: "#38bdf8", cyanDim: "#0284c7", gold: "#facc15", green: "#4ade80",
  red: "#ef4444", pink: "#f43f5e", ink: "#f8fafc", dim: "#94a3b8",

};

const FONT_MONO = "'JetBrains Mono',monospace";

for (let i = 0; i < 45; i++) {
  ambientDust.push({
    x: Math.random() * 700,
    y: Math.random() * 650,
    z: 5 + Math.random() * 35,
    vx: (Math.random() - 0.5) * 10,
    vy: (Math.random() - 0.5) * 10,
    vz: (Math.random() - 0.5) * 5,
    size: 1.0 + Math.random() * 1.5,

  });

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;

  canvas.width = viewW * dpr;
  canvas.height = viewH * dpr;
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';

  ctx.resetTransform();
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

// Controls (100% Keyboard / Laptop friendly)
window.addEventListener('keydown', (e) => {
  audio.init();
  audio.resume();

  if (gameState === "MENU" && (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E')) {
    loadLevel(0);
    return;
  }

  if (e.key === 'w' || e.key === 'ArrowUp') input.up = true;
  if (e.key === 's' || e.key === 'ArrowDown') input.down = true;
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = true;
  if (e.key === 'e' || e.key === ' ' || e.key === 'Enter') input.interact = true;
  if (e.key === 'c' || e.key === 'C' || e.key === 'Control') {
    player.isCrouching = !player.isCrouching;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!player.isRecon) {
      player.isRecon = true;
      audio.playReconHum();
    }
  }
  if (e.key === 'r' || e.key === 'R') {
    if (gameState === "PLAYING") commitAndRewindLoop();
  }
  if (e.key === 'f' || e.key === 'F') {
    if (gameState === "PLAYING") fireEmpDart();
  }
  if (e.key === 'q' || e.key === 'Q') {
    if (gameState === "PLAYING") throwDecoyCoin();
  }
  if (e.key === 'Escape') {
    if (gameState === "PLAYING") {
      if (helpVisible) helpVisible = false;
      else paused = !paused;
      renderUI();
    }
    else if (gameState === "LEVEL_SELECT") setGameState("MENU");
  }
  if ((e.key === 'h' || e.key === 'H') && gameState === "PLAYING") {
    helpVisible = !helpVisible;
    renderUI();
  }
  if ((e.key === 'p' || e.key === 'P') && gameState === "PLAYING") {
    paused = !paused;
    renderUI();
  }
  if ((e.key === 'n' || e.key === 'N') && gameState === "PLAYING" && paused) {
    paused = false;
    loadLevel(currentLevelIdx);
  }
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'w' || e.key === 'ArrowUp') input.up = false;
  if (e.key === 's' || e.key === 'ArrowDown') input.down = false;
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
  if (e.key === 'e' || e.key === ' ' || e.key === 'Enter') input.interact = false;
  if (e.key === 'Tab') {
    player.isRecon = false;
  }
});

window.addEventListener('mousemove', (e) => {
  input.screenMouseX = e.clientX;
  input.screenMouseY = e.clientY;
});

// Touch controls (left 45% = joystick, right side = tap buttons or aim)
let touchJoy = { active: false, startX: 0, startY: 0 };
let touchButtons = []; // filled per-frame by renderTouchButtons (canvas hit areas)
// Tap detection for the canvas touch buttons (runs before joystick logic).
function handleTouchButtons(x, y) {
  for (let i = 0; i < touchButtons.length; i++) {
    const b = touchButtons[i];
    if (Math.hypot(x - b.x, y - b.y) < b.r) {
      if (gameState !== "PLAYING" || paused) return true;
      if (b.id === "interact") input.interact = true;
      else if (b.id === "rewind") commitAndRewindLoop();
      else if (b.id === "emp") fireEmpDart();
      else if (b.id === "coin") throwDecoyCoin();
      else if (b.id === "sneak") player.isCrouching = !player.isCrouching;
      return true;
    }
  }
  return false;
}
window.addEventListener('touchstart', (e) => {
  audio.init();
  audio.resume();
  e.preventDefault();
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    if (handleTouchButtons(t.clientX, t.clientY)) continue;
    if (t.clientX < viewW * 0.45) {
      touchJoy.active = true;
      touchJoy.startX = t.clientX;
      touchJoy.startY = t.clientY;
    } else {
      input.screenMouseX = t.clientX;
      input.screenMouseY = t.clientY;
    }
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    if (t.clientX < viewW * 0.45 && touchJoy.active) {
      const dx = t.clientX - touchJoy.startX;
      const dy = t.clientY - touchJoy.startY;
      input.left = dx < -14;
      input.right = dx > 14;
      input.up = dy < -14;
      input.down = dy > 14;
    } else {
      input.screenMouseX = t.clientX;
      input.screenMouseY = t.clientY;
    }
  }
}, { passive: false });

window.addEventListener('touchend', (e) => {
  input.interact = false; // release tap-to-interact
  if (e.touches.length === 0) {
    touchJoy.active = false;
    input.up = input.down = input.left = input.right = false;
  }
});

// ------------------------------------------------------------
// 6. GADGETS (100% KEYBOARD / LAPTOP FRIENDLY - NO MOUSE NEEDED)
// ------------------------------------------------------------
function fireEmpDart() {
  if (player.empAmmo <= 0 || player.inVent) return;
  player.empAmmo--;
  audio.playEmp();

  // Fires straight forward in the direction the operative is facing
  const angle = player.angle;
  const speed = 500;

  projectiles.push({
    x: player.x, y: player.y, z: 18,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    vz: 0, life: 1.2
  });
  createSparks(player.x, player.y, 18, 14, "#38bdf8");
}

function throwDecoyCoin() {
  if (player.coinsAmmo <= 0 || player.inVent) return;
  player.coinsAmmo--;
  audio.playCoin();

  // Throws coin 160px forward in the direction the operative is facing
  const throwDist = 160;
  const targetX = player.x + Math.cos(player.angle) * throwDist;
  const targetY = player.y + Math.sin(player.angle) * throwDist;

  noiseRipples.push({
    x: targetX, y: targetY,
    radius: 5, maxRadius: 190, alpha: 1.0
  });

  if (level.guards) {
    level.guards.forEach(g => {
      const d = Math.hypot(g.x - targetX, g.y - targetY);
      if (d < 250) {
        g.distractedTimer = 3.5;
        g.state = "INVESTIGATING";
        g.investigatePos = { x: targetX, y: targetY };
        g.lookAngleOverride = Math.atan2(targetY - g.y, targetX - g.x);
        createSparks(g.x, g.y, 25, 10, "#facc15");
      }
    });
  }
}

// ------------------------------------------------------------
// 7. LEVEL & TIMELINE SYSTEM
// ------------------------------------------------------------
function loadLevel(idx) {
  currentLevelIdx = Math.max(0, Math.min(idx, LEVELS.length - 1));
  level = JSON.parse(JSON.stringify(LEVELS[currentLevelIdx]));

  maxLoopTime = 10.0;
  loopTimer = 0;
  ghosts = [];
  currentRun = [];
  cloneIndex = 1;
  ghostPaths = [];
  particles = [];
  projectiles = [];
  noiseRipples = [];
  screenShake = 0;
  slowMoTimer = 0;
  rewindFlash = 0;
  briefingTimer = 6.5;
  paused = false;
  helpVisible = false;

  levelStats.alarmsTripped = 0;
  levelStats.timeTaken = 0;

  resetPlayer();

  const pIso = toIso(player.x, player.y, 0);
  camX = pIso.x;
  camY = pIso.y;

  setGameState("PLAYING");
  reportGameplayStart();
  audio.updateMusicLayers(cloneIndex);
}

function resetPlayer() {
  player.x = level.playerStart.x;
  player.y = level.playerStart.y;
  player.angle = Math.PI / 4;
  player.isInteracting = false;
  player.isCrouching = false;
  player.isRecon = false;
  player.flashlightOn = true;
  player.inVent = false;
  player.ventTarget = null;
  player.ventProgress = 0;
  player.hasLoot = false;
  player.empAmmo = 1;
  player.coinsAmmo = 2;
}

function commitAndRewindLoop() {
  audio.playRewind();

  if (currentRun.length > 8) {
    // FAIR LOOT: echoes never inherit loot — a ghost must replay over the
    // loot token to pick it up (sticky carry, resolved per-frame in update).
    ghosts.push({
      id: cloneIndex,
      frames: currentRun,
      carrying: false
    });

    const path = [];
    for (let i = 0; i < currentRun.length; i += 3) {
      path.push({ x: currentRun[i].x, y: currentRun[i].y });
    }
    ghostPaths.push(path);

    cloneIndex++;
  }

  loopTimer = 0;
  currentRun = [];

  // Doors with no linked opener (decorative arches / pre-opened gates) are
  // exempt from the rewind reset so they can never cause a soft-lock.
  level.doors.forEach(d => {
    const linked = level.switches.some(sw => sw.targetDoor === d.id);
    if (d.keepOpen || !linked) d.openProgress = 1.0;
    else d.openProgress = 0;
  });
  level.switches.forEach(s => {
    s.active = false;
    s.hackProgress = 0;
    s.overrideTimer = 0;
    s.timer = 0; // breaker blackout never leaks across rewinds
  });
  ghosts.forEach(g => { g.carrying = false; });
  level.lasers.forEach(l => {
    l.active = true;
    l.disabledTimer = 0;
  });

  resetPlayer();

  if (level.guards) {
    level.guards.forEach(g => {
      if (g.waypoints && g.waypoints.length > 0) {
        g.x = g.waypoints[0].x;
        g.y = g.waypoints[0].y;
        g.wpIdx = 0;
        g.suspicion = 0;
        g.state = "PATROL";
        g.distractedTimer = 0;
        g.pauseTimer = 0;
        g.lookAngleOverride = null;
      }
    });
  }
  if (level.cameras) {
    level.cameras.forEach(c => {
      c.alarm = false;
      c.disabledTimer = 0;
      c.alarmTimer = 0;
      c.spottedDuration = 0;
    });
  }

  screenShake = 8;
  rewindFlash = 1.0; // full-screen cyan flash + vignette pulse (decays in update)
  slowMoTimer = Math.max(slowMoTimer, 0.25); // brief slow-mo sells the time jump
  createSparks(player.x, player.y, 10, 25, "#38bdf8");
  audio.updateMusicLayers(cloneIndex);
}

function checkCircleRect(cx, cy, r, rx, ry, rw, rh) {
  const cX = Math.max(rx, Math.min(cx, rx + rw));
  const cY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - cX;
  const dy = cy - cY;
  return (dx * dx + dy * dy) < (r * r);
}

function resolveWallCollisions(ent) {
  if (ent.inVent) return;

  for (let i = 0; i < level.walls.length; i++) {
    const w = level.walls[i];
    if (checkCircleRect(ent.x, ent.y, ent.radius, w.x, w.y, w.w, w.h)) {
      const cX = Math.max(w.x, Math.min(ent.x, w.x + w.w));
      const cY = Math.max(w.y, Math.min(ent.y, w.y + w.h));
      const dx = ent.x - cX;
      const dy = ent.y - cY;
      const dist = Math.hypot(dx, dy) || 1;
      const overlap = ent.radius - dist;
      if (overlap > 0) {
        ent.x += (dx / dist) * overlap;
        ent.y += (dy / dist) * overlap;
      }
    }
  }

  for (let i = 0; i < level.doors.length; i++) {
    const d = level.doors[i];
    if (d.openProgress < 0.8) {
      const dw = d.orientation === "V" ? d.w : d.w * (1 - d.openProgress);
      const dh = d.orientation === "V" ? d.h * (1 - d.openProgress) : d.h;
      if (checkCircleRect(ent.x, ent.y, ent.radius, d.x, d.y, dw, dh)) {
        const cX = Math.max(d.x, Math.min(ent.x, d.x + dw));
        const cY = Math.max(d.y, Math.min(ent.y, d.y + dh));
        const dx = ent.x - cX;
        const dy = ent.y - cY;
        const dist = Math.hypot(dx, dy) || 1;
        const overlap = ent.radius - dist;
        if (overlap > 0) {
          ent.x += (dx / dist) * overlap;
          ent.y += (dy / dist) * overlap;
        }
      }
    }
  }
}

// ------------------------------------------------------------
// 8. TICK UPDATE WITH REFINED PATROL AI & RECON
// ------------------------------------------------------------
let lastTime = performance.now();

function update(dt) {
  uiTime += dt;
  if (gameState !== "PLAYING") return;
  if (paused) return; // hard pause: freeze sim, keep rendering + DOM overlay

  if (rewindFlash > 0) rewindFlash = Math.max(0, rewindFlash - dt * 1.6);
  if (briefingTimer > 0) briefingTimer = Math.max(0, briefingTimer - dt);

  let simDt = dt;
  if (slowMoTimer > 0) {
    slowMoTimer -= dt;
    simDt = dt * 0.35;
  }

  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 25);

  const prevTimer = loopTimer;
  loopTimer += simDt;
  levelStats.timeTaken += simDt;

  if (Math.floor(loopTimer) !== Math.floor(prevTimer)) {
    const remaining = Math.ceil(maxLoopTime - loopTimer);
    if (remaining <= 3 && remaining > 0) {
      audio.playTick(1.0 + (4 - remaining) * 0.4);
      screenShake = 3.5;
    }
  }

  if (loopTimer >= maxLoopTime) {
    commitAndRewindLoop();
    return;
  }

  ambientDust.forEach(d => {
    d.x += d.vx * simDt;
    d.y += d.vy * simDt;
    d.z += d.vz * simDt;
    if (d.x < 0) d.x = 700; if (d.x > 700) d.x = 0;
    if (d.y < 0) d.y = 650; if (d.y > 650) d.y = 0;
    if (d.z < 2) d.z = 35; if (d.z > 40) d.z = 5;
  });

  // Vent movement
  if (player.inVent && player.ventTarget) {
    player.ventProgress += simDt * 1.8;
    player.x = player.ventTarget.startX + (player.ventTarget.endX - player.ventTarget.startX) * player.ventProgress;
    player.y = player.ventTarget.startY + (player.ventTarget.endY - player.ventTarget.startY) * player.ventProgress;
    if (player.ventProgress >= 1.0) {
      player.inVent = false;
      player.ventTarget = null;
      audio.playVent();
      createSparks(player.x, player.y, 5, 15, "#94a3b8");
    }
  } else {
    let screenDirX = 0, screenDirY = 0;
    if (input.up) screenDirY -= 1;
    if (input.down) screenDirY += 1;
    if (input.left) screenDirX -= 1;
    if (input.right) screenDirX += 1;

    const sLen = Math.hypot(screenDirX, screenDirY);
    if (sLen > 0) {
      const normSx = screenDirX / sLen;
      const normSy = screenDirY / sLen;

      const worldDx = (normSx / COS_30 + normSy / SIN_30) * 0.5;
      const worldDy = (normSy / SIN_30 - normSx / COS_30) * 0.5;

      const wLen = Math.hypot(worldDx, worldDy) || 1;
      const actualSpeed = player.isCrouching ? player.speed * 0.55 : player.speed;

      player.x += (worldDx / wLen) * actualSpeed * simDt;
      player.y += (worldDy / wLen) * actualSpeed * simDt;
      player.angle = Math.atan2(worldDy, worldDx);

      if (Math.random() < 0.25 && !player.isCrouching) {
        createSparks(player.x, player.y, 0, 1, "rgba(148, 163, 184, 0.4)");
      }
    }

    player.isInteracting = input.interact;
    resolveWallCollisions(player);

    if (level.vents && input.interact) {
      level.vents.forEach(v => {
        const d1 = Math.hypot(player.x - v.x1, player.y - v.y1);
        const d2 = Math.hypot(player.x - v.x2, player.y - v.y2);
        if (d1 < 36 && !player.inVent) {
          player.inVent = true;
          player.ventProgress = 0;
          player.ventTarget = { startX: v.x1, startY: v.y1, endX: v.x2, endY: v.y2 };
          audio.playVent();
        } else if (d2 < 36 && !player.inVent) {
          player.inVent = true;
          player.ventProgress = 0;
          player.ventTarget = { startX: v.x2, startY: v.y2, endX: v.x1, endY: v.y1 };
          audio.playVent();
        }
      });
    }
  }

  // Camera lerp
  const targetIso = toIso(player.x, player.y, 0);
  camX += (targetIso.x - camX) * simDt * 5.0;
  camY += (targetIso.y - camY) * simDt * 5.0;

  // Ghosts playback
  const activeGhosts = [];
  ghosts.forEach(g => {
    const frames = g.frames;
    if (!frames || frames.length === 0) return;
    let f = frames[0];
    for (let i = 0; i < frames.length; i++) {
      if (frames[i].t <= loopTimer) f = frames[i];
      else break;
    }
    activeGhosts.push({
      id: g.id,
      x: f.x, y: f.y,
      angle: f.angle,
      isInteracting: f.isInteracting,
      carrying: !!g.carrying
    });
  });

  currentRun.push({
    t: loopTimer,
    x: player.x, y: player.y,
    angle: player.angle,
    isInteracting: player.isInteracting,
    isCrouching: player.isCrouching,
    inVent: player.inVent
  });

  const allAgents = [{
    x: player.x, y: player.y,
    isInteracting: player.isInteracting,
    inVent: player.inVent,
    isCrouching: player.isCrouching
  }, ...activeGhosts];

  // Switches, Terminals, and Breakers
  level.switches.forEach(sw => {
    if (sw.type === "plate") {
      let isPressed = false;
      for (const ag of allAgents) {
        if (!ag.inVent && Math.hypot(ag.x - sw.x, ag.y - sw.y) < sw.radius + 14) {
          isPressed = true;
          break;
        }
      }
      if (isPressed !== sw.active) {
        sw.active = isPressed;
        audio.playSwitch();
      }
    } else if (sw.type === "terminal") {
      if (sw.overrideTimer > 0) {
        sw.overrideTimer = Math.max(0, sw.overrideTimer - simDt);
        sw.active = sw.overrideTimer > 0;
      }

      let isHackingNow = false;
      for (const ag of allAgents) {
        if (ag.inVent) continue;
        const dist = Math.hypot(ag.x - sw.x, ag.y - sw.y);
        if (dist < 55 && ag.isInteracting) {
          isHackingNow = true;
          sw.hackProgress = Math.min(1.0, (sw.hackProgress || 0) + simDt / 0.8);
          if (Math.random() < 0.25) audio.playHackBeep(0.8 + sw.hackProgress * 0.6);
          if (Math.random() < 0.3) createSparks(sw.x, sw.y, 15, 2, "#38bdf8");

          if (sw.hackProgress >= 1.0 && sw.overrideTimer <= 0) {
            sw.overrideTimer = 6.0;
            sw.active = true;
            audio.playHackComplete();
            createSparks(sw.x, sw.y, 16, 30, "#4ade80");
          }
          break;
        }
      }

      if (!isHackingNow && sw.hackProgress < 1.0 && sw.hackProgress > 0) {
        sw.hackProgress = Math.max(0, sw.hackProgress - simDt * 1.5);
      }
    } else if (sw.type === "breaker") {
      if (sw.timer > 0) {
        sw.timer = Math.max(0, sw.timer - simDt);
        sw.active = sw.timer > 0;
      }

      for (const ag of allAgents) {
        if (ag.inVent) continue;
        const dist = Math.hypot(ag.x - sw.x, ag.y - sw.y);
        if (dist < 45 && ag.isInteracting && !sw.active) {
          sw.active = true;
          sw.timer = sw.duration || 6.0;
          audio.playBreaker();
          createSparks(sw.x, sw.y, 20, 25, "#facc15");

          // Black out cameras during breaker override
          if (level.cameras) {
            level.cameras.forEach(c => c.disabledTimer = sw.timer);
          }
        }
      }
    }
  });

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const proj = projectiles[i];
    proj.x += proj.vx * simDt;
    proj.y += proj.vy * simDt;
    proj.life -= simDt;

    if (level.cameras) {
      level.cameras.forEach(cam => {
        if (Math.hypot(cam.x - proj.x, cam.y - proj.y) < 30) {
          cam.disabledTimer = 4.5;
          createSparks(cam.x, cam.y, 35, 25, "#38bdf8");
          proj.life = 0;
        }
      });
    }

    level.lasers.forEach(l => {
      const pDist = distToSegment({ x: proj.x, y: proj.y }, { x: l.x1, y: l.y1 }, { x: l.x2, y: l.y2 });
      if (pDist < 24) {
        l.disabledTimer = 4.5;
        createSparks(proj.x, proj.y, 14, 25, "#38bdf8");
        proj.life = 0;
      }
    });

    if (proj.life <= 0) projectiles.splice(i, 1);
  }

  // Lasers
  level.lasers.forEach(l => {
    let disabled = false;
    level.switches.forEach(sw => {
      if (sw.targetLaser === l.id && sw.active) disabled = true;
    });
    if (l.disabledTimer > 0) {
      l.disabledTimer -= simDt;
      disabled = true;
    }
    l.active = !disabled;

    if (l.active && !player.inVent) {
      const pDist = distToSegment({ x: player.x, y: player.y }, { x: l.x1, y: l.y1 }, { x: l.x2, y: l.y2 });
      if (pDist < player.radius) {
        levelStats.alarmsTripped++;
        audio.playAlarm();
        screenShake = 12;
        createSparks(player.x, player.y, 10, 30, "#ef4444");
        commitAndRewindLoop();
      }
    }
  });

  // Doors
  level.doors.forEach(d => {
    let shouldOpen = false;
    if (d.requiresBoth) {
      const linked = level.switches.filter(sw => sw.targetDoor === d.id);
      shouldOpen = linked.length > 0 && linked.every(sw => sw.active);
    } else {
      shouldOpen = level.switches.some(sw => sw.targetDoor === d.id && sw.active);
    }

    const prevProg = d.openProgress;
    if (shouldOpen) {
      d.openProgress = Math.min(1.0, d.openProgress + simDt * 3.5);
      if (prevProg === 0 && d.openProgress > 0) audio.playDoor(true);
    } else {
      d.openProgress = Math.max(0.0, d.openProgress - simDt * 3.5);
      if (prevProg > 0 && d.openProgress === 0) audio.playDoor(false);
    }
  });

  // Cameras
  if (level.cameras) {
    level.cameras.forEach(cam => {
      if (cam.disabledTimer > 0) {
        cam.disabledTimer -= simDt;
        cam.alarm = false;
        cam.spottedDuration = 0;
        return;
      }
      cam.curAngle = cam.baseAngle + Math.sin(loopTimer * cam.speed) * cam.sweepAngle;

      let playerInBeam = false;
      if (!player.inVent) {
        const cdx = player.x - cam.x;
        const cdy = player.y - cam.y;
        const cDist = Math.hypot(cdx, cdy);
        if (cDist < cam.maxDist) {
          const cAngle = Math.atan2(cdy, cdx);
          let diff = Math.abs(cAngle - cam.curAngle);
          while (diff > Math.PI) diff = Math.abs(diff - Math.PI * 2);

          if (diff < cam.fov / 2 && hasLineOfSight(cam.x, cam.y, player.x, player.y)) {
            playerInBeam = true;
          }
        }
      }

      if (playerInBeam) {
        cam.alarm = true;
        cam.alarmTimer = 5.0;
        cam.spottedDuration = (cam.spottedDuration || 0) + simDt;

        if (Math.random() < 0.15) audio.playAlarm();

        if (cam.spottedDuration >= 1.4) {
          levelStats.alarmsTripped++;
          audio.playAlarm();
          screenShake = 15;
          createSparks(player.x, player.y, 10, 35, "#ef4444");
          commitAndRewindLoop();
          return;
        }

        if (level.guards && level.guards.length > 0) {
          level.guards.forEach(g => {
            g.state = "ALARM_CHASE";
            g.suspicion = Math.max(g.suspicion, 0.7);
            g.distractedTimer = 6.0;
            g.investigatePos = { x: cam.x, y: cam.y + 40 };
            g.lookAngleOverride = Math.atan2((cam.y + 40) - g.y, cam.x - g.x);
          });
          audio.playRadioChatter();
        }
      } else {
        cam.spottedDuration = Math.max(0, (cam.spottedDuration || 0) - simDt * 2);
      }

      if (cam.alarmTimer > 0) {
        cam.alarmTimer -= simDt;
        cam.alarm = cam.alarmTimer > 0;
      }
    });
  }

  // ==========================================
  // REFINED GUARDS: CORNER SWEEPING & SMOOTH TURNING
  // ==========================================
  if (level.guards) {
    level.guards.forEach(g => {
      let isPlayerVisible = false;

      // Guard flashlight vision range is reduced during breaker blackouts!
      const isBlackout = level.switches && level.switches.some(s => s.type === "breaker" && s.active);
      const effectiveGuardDist = isBlackout ? (g.dist * 0.45) : g.dist;

      if (!player.inVent) {
        const gdx = player.x - g.x;
        const gdy = player.y - g.y;
        const gdist = Math.hypot(gdx, gdy);

        if (gdist < effectiveGuardDist) {
          const ga = Math.atan2(gdy, gdx);
          let diff = Math.abs(ga - (g.angle || 0));
          while (diff > Math.PI) diff = Math.abs(diff - Math.PI * 2);

          if (diff < g.fov / 2 && hasLineOfSight(g.x, g.y, player.x, player.y)) {
            isPlayerVisible = true;

            const detectMult = player.isCrouching ? 0.6 : 1.0;
            const centerFactor = (1 - diff / (g.fov / 2));
            g.suspicion += (2.2 + centerFactor * 2.8) * detectMult * simDt;

            // Turn towards player smoothly
            g.angle = angleLerp(g.angle || 0, ga, simDt * 12.0);

            if (g.suspicion >= 0.20 && g.state !== "INVESTIGATING" && g.state !== "ALARM_CHASE") {
              g.state = "INVESTIGATING";
              g.distractedTimer = 3.5;
              g.investigatePos = { x: player.x, y: player.y };
              audio.playSuspicionAlert();
            }

            if (g.suspicion > 0.5 && slowMoTimer <= 0) {
              slowMoTimer = 0.35;
              audio.playTick(1.8);
            }

            if (g.suspicion >= 1.0) {
              levelStats.alarmsTripped++;
              audio.playAlarm();
              screenShake = 16;
              createSparks(player.x, player.y, 10, 35, "#ef4444");
              commitAndRewindLoop();
            }
          }
        }

        // Guard notices player's active flashlight beam!
        if (player.flashlightOn && g.state !== "ALARM_CHASE") {
          const fdx = g.x - player.x;
          const fdy = g.y - player.y;
          const fdist = Math.hypot(fdx, fdy);
          const aimDist = player.isCrouching ? 190 : 250;
          if (fdist < aimDist) {
            const angleToGuard = Math.atan2(fdy, fdx);
            let fdiff = Math.abs(angleToGuard - player.angle);
            while (fdiff > Math.PI) fdiff = Math.abs(fdiff - Math.PI * 2);

            if (fdiff < 0.42 && hasLineOfSight(player.x, player.y, g.x, g.y)) {
              g.suspicion += simDt * 1.5;
              if (g.suspicion >= 0.20 && g.state !== "INVESTIGATING") {
                g.state = "INVESTIGATING";
                g.distractedTimer = 3.2;
                g.investigatePos = { x: player.x, y: player.y };
                g.lookAngleOverride = Math.atan2(player.y - g.y, player.x - g.x);
                audio.playSuspicionAlert();
                createSparks(g.x, g.y, 25, 4, "#facc15");
              }
            }
          }
        }
      }

      if (!isPlayerVisible && g.suspicion > 0) {
        g.suspicion = Math.max(0, g.suspicion - simDt * 0.9);
        if (g.suspicion === 0 && g.distractedTimer <= 0) {
          g.state = "PATROL";
        }
      }

      // Movement & Realistic Patrol Pausing
      if (g.distractedTimer > 0) {
        g.distractedTimer -= simDt;
        if (g.investigatePos) {
          const idx = g.investigatePos.x - g.x;
          const idy = g.investigatePos.y - g.y;
          const idist = Math.hypot(idx, idy);
          if (idist > 15) {
            const chaseSpeed = (g.state === "ALARM_CHASE") ? 145 : (g.speed * 1.35);
            g.x += (idx / idist) * chaseSpeed * simDt;
            g.y += (idy / idist) * chaseSpeed * simDt;
            g.angle = angleLerp(g.angle || 0, Math.atan2(idy, idx), simDt * 10.0);
          }
        } else if (g.lookAngleOverride !== null) {
          g.angle = angleLerp(g.angle || 0, g.lookAngleOverride, simDt * 8.0);
        }
      } else {
        if (g.waypoints && g.waypoints.length > 1) {
          const currentWp = g.waypoints[g.wpIdx || 0];

          // Pausing at corner to sweep head
          if (g.pauseTimer > 0) {
            g.pauseTimer -= simDt;
            // Realistic head sweeping while stopped!
            const sweepOsc = Math.sin(loopTimer * 3.5) * 0.55;
            g.angle = angleLerp(g.angle || 0, (g.baseAngle || 0) + sweepOsc, simDt * 6.0);
          } else {
            const gdx = currentWp.x - g.x;
            const gdy = currentWp.y - g.y;
            const gdist = Math.hypot(gdx, gdy);

            if (gdist < 10) {
              if (currentWp.pauseTime) {
                g.pauseTimer = currentWp.pauseTime;
                g.baseAngle = g.angle || 0;
              }
              g.wpIdx = ((g.wpIdx || 0) + 1) % g.waypoints.length;
            } else {
              g.x += (gdx / gdist) * g.speed * simDt;
              g.y += (gdy / gdist) * g.speed * simDt;
              g.angle = angleLerp(g.angle || 0, Math.atan2(gdy, gdx), simDt * 8.0);
            }
          }
        }
      }
    });
  }

  // Noise Ripples
  for (let i = noiseRipples.length - 1; i >= 0; i--) {
    const nr = noiseRipples[i];
    nr.radius += simDt * 180;
    nr.alpha -= simDt * 1.5;
    if (nr.alpha <= 0) noiseRipples.splice(i, 1);
  }

  // Loot — explicit, fair rules shared by live player and echoes:
  // - ECHOES must physically replay over the loot token to pick it up
  //   (sticky for the rest of that loop; echo carrying lets YOU extract).
  // - LIVE player grabs it by touching the token while no echo carries it.
  // - EXTRACTION always requires the live player to reach the exit.
  if (level.loot && !player.inVent) {
    const lootR = player.radius + level.loot.radius;
    if (!player.hasLoot && !ghosts.some(g => g.carrying)) {
      if (Math.hypot(player.x - level.loot.x, player.y - level.loot.y) < lootR) {
        player.hasLoot = true;
        audio.playLoot();
        createSparks(level.loot.x, level.loot.y, 10, 40, "#facc15");
        screenShake = 5;
      }
    }
    if (!player.hasLoot) {
      for (const ag of activeGhosts) {
        if (Math.hypot(ag.x - level.loot.x, ag.y - level.loot.y) < 14 + level.loot.radius) {
          const stored = ghosts.find(g => g.id === ag.id);
          if (stored) { stored.carrying = true; ag.carrying = true; }
          audio.playLoot();
          createSparks(level.loot.x, level.loot.y, 10, 24, "#38bdf8");
          break;
        }
      }
    }
  }

  // Extraction
  if ((player.hasLoot || ghosts.some(g => g.carrying)) && !player.inVent) {
    const ex = level.exit;
    if (player.x >= ex.x && player.x <= ex.x + ex.w && player.y >= ex.y && player.y <= ex.y + ex.h) {
      triggerVictory();
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * simDt;
    p.y += p.vy * simDt;
    p.z += p.vz * simDt;
    p.alpha -= simDt * p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

// ------------------------------------------------------------
// 9. TRANSPARENT 3-STAR VICTORY
// ------------------------------------------------------------
function triggerVictory() {
  setGameState("VICTORY");
  reportGameplayStop();
  audio.playWin();

  const star1 = true;
  const star2 = cloneIndex <= level.parClones;
  const star3 = levelStats.alarmsTripped === 0;
  const totalStars = (star1 ? 1 : 0) + (star2 ? 1 : 0) + (star3 ? 1 : 0);

  const prevBest = levelStars[level.id] || 0;
  levelStars[level.id] = Math.max(prevBest, totalStars);
  saveStars();

  for (let i = 0; i < 80; i++) {
    createSparks(player.x, player.y, 10, 1, ["#facc15", "#38bdf8", "#4ade80", "#f43f5e"][i % 4]);
  }
}

function distToSegment(p, v, w) {
  const l2 = (v.x - w.x) * (v.x - w.x) + (v.y - w.y) * (v.y - w.y);
  if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
  let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
}

function createSparks(x, y, z, count, color = "#facc15") {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 160;
    particles.push({
      x, y, z,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      vz: 40 + Math.random() * 80,
      alpha: 1.0,
      decay: 1.0 + Math.random() * 2.0,
      size: 2.5 + Math.random() * 3.5,
      color
    });
  }
}

// ------------------------------------------------------------
// 10. REALISTIC RENDERING ENGINE & TACTICAL RECON
// ------------------------------------------------------------
function render() {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.translate(viewW / 2 - camX, viewH / 2 - camY);

  if (screenShake > 0) {
    const sx = (Math.random() - 0.5) * screenShake;
    const sy = (Math.random() - 0.5) * screenShake;
    ctx.translate(sx, sy);
  }

  if (!level || gameState === "MENU" || gameState === "LEVEL_SELECT") {
    ctx.restore();
    return;
  }

  // PAUSED: freeze the world frame behind the DOM overlay (no sim updates anyway)
  if (gameState === "PLAYING" && paused && level) {
    ctx.restore();
    ctx.save();
    ctx.fillStyle = "rgba(3,6,10,0.45)";
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 13px " + FONT_MONO;
    ctx.textAlign = "center";
    ctx.fillText("⏸ PAUSED — [ESC] TO RESUME", viewW / 2, 110);
    ctx.restore();
    return;
  }

  const theme = THEMES[level.theme] || THEMES.bank;

  // PASS 1: Textured Floor
  renderOverhauledFloor(theme);

  // PASS 2: Decals, Vents, Ghost Ribbon & Ripples
  renderIsoGroundDecals();
  renderIsoVents();
  renderGhostPathRibbons();
  renderNoiseRipples();

  // PASS 2.5: Tactical Recon Vision [TAB] Overlays
  if (player.isRecon) {
    renderReconGrid();
  }

  // PASS 3: 3D Depth Sorted Queue
  const renderQueue = [];

  level.walls.forEach(w => {
    renderQueue.push({
      depth: (w.x + w.w * 0.5) + (w.y + w.h * 0.5),
      render: () => drawOverhauledBox(w.x, w.y, w.w, w.h, w.ht || 44, theme)
    });
  });

  if (level.props) {
    level.props.forEach(p => {
      renderQueue.push({
        depth: p.x + p.y + 10,
        render: () => drawOverhauledProp(p)
      });
    });
  }

  level.doors.forEach(d => {
    renderQueue.push({
      depth: d.x + d.y + 10,
      render: () => drawIsoDoor(d)
    });
  });

  if (level.loot) {
    const echoCarrying = ghosts.some(g => g.carrying);
    if (!player.hasLoot && !echoCarrying) {
      renderQueue.push({
        depth: level.loot.x + level.loot.y + 15,
        render: () => drawOverhauledLoot(level.loot)
      });
    }
  }

  ghosts.forEach(g => {
    const frames = g.frames;
    if (!frames || frames.length === 0) return;
    let f = frames[0];
    for (let i = 0; i < frames.length; i++) {
      if (frames[i].t <= loopTimer) f = frames[i];
      else break;
    }
    if (!f.inVent) {
      renderQueue.push({
        depth: f.x + f.y + 20,
        render: () => drawHolographicGhost(f, g.id)
      });
    }
  });

  if (!player.inVent) {
    renderQueue.push({
      depth: player.x + player.y + 20,
      render: () => drawOverhauledPlayer()
    });
  }

  if (level.guards) {
    level.guards.forEach(g => {
      renderQueue.push({
        depth: g.x + g.y + 20,
        render: () => drawOverhauledGuard(g)
      });
    });
  }

  if (level.cameras) {
    level.cameras.forEach(cam => {
      renderQueue.push({
        depth: cam.x + cam.y + 5,
        render: () => drawIsoCamera(cam)
      });
    });
  }

  projectiles.forEach(proj => {
    renderQueue.push({
      depth: proj.x + proj.y + 15,
      render: () => drawIsoDart(proj)
    });
  });

  renderQueue.sort((a, b) => a.depth - b.depth);
  renderQueue.forEach(item => item.render());

  renderIsoLasers();
  renderOverhauledLighting(theme);
  renderIsoParticles();

  ctx.restore();

  // Screen Space Overlays
  if (player.isRecon) {
    renderReconPostProcessing();
  }
  renderTensionVignette();
  renderInGameHUD();
  renderMiniRadar();
  renderTouchButtons();
}

// Touch action buttons (right side): INTERACT / REWIND / EMP / COIN / SNEAK.
// Kept minimal + canvas-rendered; existing joystick handlers untouched.
// (touchButtons array + handleTouchButtons() are declared up with input setup.)
function renderTouchButtons() {
  const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  touchButtons = [];
  if (!isTouch) return;
  const defs = [
    { id: "interact", label: "E", color: "#4ade80" },
    { id: "rewind", label: "R", color: "#38bdf8" },
    { id: "emp", label: "F", color: "#38bdf8" },
    { id: "coin", label: "Q", color: "#facc15" },
    { id: "sneak", label: "C", color: "#facc15" }
  ];
  const r = 26, gap = 12;
  const by = viewH - 120;
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let i = 0; i < defs.length; i++) {
    const b = defs[i];
    const bx = viewW - 40 - r - i * (r * 2 + gap);
    const active = (b.id === "sneak" && player.isCrouching) ||
      (b.id === "emp" && player.empAmmo > 0) ||
      (b.id === "coin" && player.coinsAmmo > 0) ||
      (b.id === "interact") || (b.id === "rewind");
    ctx.globalAlpha = active ? 0.85 : 0.35;
    ctx.fillStyle = "rgba(8,12,20,0.8)";
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = b.color;
    ctx.font = "bold 16px " + FONT_MONO;
    ctx.fillText(b.label, bx, by);
    touchButtons.push({ id: b.id, x: bx, y: by, r: r + 8 });
  }
  ctx.restore();
}

// ------------------------------------------------------------
// Textured, High-Tech Floor with Specular Sheen
// ------------------------------------------------------------
function renderOverhauledFloor(theme) {
  const tileSize = 50;
  for (let x = 0; x < 700; x += tileSize) {
    for (let y = 0; y < 650; y += tileSize) {
      const isAlt = ((x / tileSize) + (y / tileSize)) % 2 === 0;
      ctx.fillStyle = isAlt ? theme.floor1 : theme.floor2;

      const p0 = toIso(x, y, 0);
      const p1 = toIso(x + tileSize, y, 0);
      const p2 = toIso(x + tileSize, y + tileSize, 0);
      const p3 = toIso(x, y + tileSize, 0);

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = theme.grout;
      ctx.lineWidth = 1.0;
      ctx.stroke();

      if (theme.floorType === "alloy" && (x + y) % 150 === 0) {
        ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      } else if (theme.floorType === "casino" && (x + y) % 100 === 0) {
        ctx.strokeStyle = "rgba(244, 114, 182, 0.22)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.stroke();
      }
    }
  }
}

// Tactical Recon Vision [TAB]: Floor projection lines
function renderReconGrid() {
  // 1. Projected Guard Patrol Paths
  if (level.guards) {
    level.guards.forEach(g => {
      if (g.waypoints && g.waypoints.length > 1) {
        ctx.strokeStyle = "rgba(239, 68, 68, 0.85)";
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        const p0 = toIso(g.waypoints[0].x, g.waypoints[0].y, 0);
        ctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < g.waypoints.length; i++) {
          const pt = toIso(g.waypoints[i].x, g.waypoints[i].y, 0);
          ctx.lineTo(pt.x, pt.y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.setLineDash([]);

        // Waypoint markers
        g.waypoints.forEach((wp, idx) => {
          const wpIso = toIso(wp.x, wp.y, 0);
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.arc(wpIso.x, wpIso.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    });
  }

  // 2. Camera Sweep Cones
  if (level.cameras) {
    level.cameras.forEach(cam => {
      const cIso = toIso(cam.x, cam.y, 0);
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(cIso.x, cIso.y, cam.maxDist * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    });
  }
}

function renderReconPostProcessing() {
  ctx.save();
  ctx.fillStyle = "rgba(6, 182, 212, 0.08)";
  ctx.fillRect(0, 0, viewW, viewH);

  // Scanline overlay
  ctx.strokeStyle = "rgba(56, 189, 248, 0.12)";
  ctx.lineWidth = 1;
  for (let y = 0; y < viewH; y += 4) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(viewW, y);
    ctx.stroke();
  }

  // Recon Badge
  ctx.fillStyle = "rgba(6, 182, 212, 0.9)";
  ctx.font = "bold 13px 'JetBrains Mono', monospace";
  ctx.textAlign = "center";
  ctx.fillText("TACTICAL RECON VISION // SCAN ACTIVE", viewW / 2, 78);
  ctx.restore();
}

function renderIsoGroundDecals() {
  const ex = level.exit;
  const p0 = toIso(ex.x, ex.y, 0);
  const p1 = toIso(ex.x + ex.w, ex.y, 0);
  const p2 = toIso(ex.x + ex.w, ex.y + ex.h, 0);
  const p3 = toIso(ex.x, ex.y + ex.h, 0);

  ctx.fillStyle = "rgba(34, 197, 94, 0.18)";
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.lineTo(p3.x, p3.y);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  const cCenter = toIso(ex.x + ex.w / 2, ex.y + ex.h / 2, 0);
  ctx.fillStyle = "#86efac";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(ex.label, cCenter.x, cCenter.y + 4);

  // Switches & Breakers
  level.switches.forEach(sw => {
    if (sw.type === "plate") {
      const sp = toIso(sw.x, sw.y, 0);
      ctx.fillStyle = sw.active ? "#22c55e" : "#475569";
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, sw.radius * COS_30, sw.radius * SIN_30, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = sw.active ? "#15803d" : "#1e293b";
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, (sw.radius - 5) * COS_30, (sw.radius - 5) * SIN_30, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 9px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(sw.active ? "LOCKED" : "HOLD", sp.x, sp.y);
    } else if (sw.type === "terminal") {
      const isOverridden = sw.overrideTimer > 0;
      drawOverhauledBox(
        sw.x - 14, sw.y - 14, 28, 28, 16,
        {
          wallTop: isOverridden ? "#4ade80" : "#38bdf8",
          wallLeft: isOverridden ? "#16a34a" : "#0284c7",
          wallRight: isOverridden ? "#15803d" : "#0369a1",
          wallBevel: "rgba(255,255,255,0.4)"
        }
      );

      const hp = toIso(sw.x, sw.y, 28);
      const isNear = Math.hypot(player.x - sw.x, player.y - sw.y) < 65;

      if (isOverridden) {
        ctx.fillStyle = "#4ade80";
        ctx.font = "bold 10px monospace";
        ctx.textAlign = "center";
        ctx.fillText(`OVERRIDE: ${sw.overrideTimer.toFixed(1)}s`, hp.x, hp.y - 12);
      } else {
        ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(hp.x, hp.y, 14, 0, Math.PI * 2);
        ctx.stroke();

        if (sw.hackProgress > 0) {
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(hp.x, hp.y, 14, -Math.PI / 2, -Math.PI / 2 + sw.hackProgress * Math.PI * 2);
          ctx.stroke();
        }

        ctx.fillStyle = isNear ? "#f8fafc" : "#94a3b8";
        ctx.font = "bold 9px sans-serif";
        ctx.textAlign = "center";
        const prompt = isNear ? "[HOLD E] HACK" : "TERMINAL";
        ctx.fillText(prompt, hp.x, hp.y - 18);
      }
    } else if (sw.type === "breaker") {
      // Circuit Breaker Box
      const isTripped = sw.active;
      drawOverhauledBox(
        sw.x - 12, sw.y - 12, 24, 24, 20,
        {
          wallTop: isTripped ? "#ef4444" : "#facc15",
          wallLeft: isTripped ? "#b91c1c" : "#ca8a04",
          wallRight: isTripped ? "#991b1b" : "#a16207",
          wallBevel: "rgba(255,255,255,0.4)"
        }
      );

      const bp = toIso(sw.x, sw.y, 30);
      const isNear = Math.hypot(player.x - sw.x, player.y - sw.y) < 55;
      ctx.fillStyle = isTripped ? "#ef4444" : "#facc15";
      ctx.font = "bold 10px monospace";
      ctx.textAlign = "center";
      const txt = isTripped ? `BLACKOUT: ${sw.timer.toFixed(1)}s` : (isNear ? "[E] CUT POWER" : "BREAKER");
      ctx.fillText(txt, bp.x, bp.y - 10);
    }
  });
}

function renderIsoVents() {
  if (!level.vents) return;

  level.vents.forEach(v => {
    [ {x: v.x1, y: v.y1}, {x: v.x2, y: v.y2} ].forEach(pt => {
      const sp = toIso(pt.x, pt.y, 0);
      ctx.fillStyle = "#090d16";
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, 16 * COS_30, 16 * SIN_30, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(sp.x - 8, sp.y); ctx.lineTo(sp.x + 8, sp.y);
      ctx.moveTo(sp.x - 6, sp.y - 3); ctx.lineTo(sp.x + 6, sp.y - 3);
      ctx.moveTo(sp.x - 6, sp.y + 3); ctx.lineTo(sp.x + 6, sp.y + 3);
      ctx.stroke();

      const dist = Math.hypot(player.x - pt.x, player.y - pt.y);
      if (dist < 40 && !player.inVent) {
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 9px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("[E] ENTER VENT", sp.x, sp.y - 14);
      }
    });
  });
}

function renderGhostPathRibbons() {
  ghostPaths.forEach(path => {
    if (path.length < 2) return;
    ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
    ctx.lineWidth = 2.0;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    const pStart = toIso(path[0].x, path[0].y, 0);
    ctx.moveTo(pStart.x, pStart.y);
    for (let i = 1; i < path.length; i++) {
      const p = toIso(path[i].x, path[i].y, 0);
      ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function renderNoiseRipples() {
  noiseRipples.forEach(nr => {
    const sp = toIso(nr.x, nr.y, 0);
    ctx.strokeStyle = `rgba(250, 204, 21, ${nr.alpha * 0.75})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y, nr.radius * COS_30, nr.radius * SIN_30, 0, 0, Math.PI * 2);
    ctx.stroke();
  });
}

function drawOverhauledBox(wx, wy, sizeX, sizeY, heightZ, theme) {
  const s0 = toIso(wx, wy, 0);
  const s1 = toIso(wx + sizeX, wy, 0);
  const s2 = toIso(wx + sizeX, wy + sizeY, 0);
  const s3 = toIso(wx, wy + sizeY, 0);

  ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
  ctx.beginPath();
  ctx.moveTo(s0.x + 4, s0.y + 6);
  ctx.lineTo(s1.x + 4, s1.y + 6);
  ctx.lineTo(s2.x + 4, s2.y + 6);
  ctx.lineTo(s3.x + 4, s3.y + 6);
  ctx.closePath();
  ctx.fill();

  const b1 = s1, b2 = s2, b3 = s3;
  const t0 = toIso(wx, wy, heightZ);
  const t1 = toIso(wx + sizeX, wy, heightZ);
  const t2 = toIso(wx + sizeX, wy + sizeY, heightZ);
  const t3 = toIso(wx, wy + sizeY, heightZ);

  // Left Face with depth gradient
  const leftGrad = ctx.createLinearGradient(b3.x, b3.y, t3.x, t3.y);
  leftGrad.addColorStop(0, "rgba(0,0,0,0.45)");
  leftGrad.addColorStop(1, theme.wallLeft);

  ctx.fillStyle = theme.wallLeft;
  ctx.beginPath();
  ctx.moveTo(b3.x, b3.y); ctx.lineTo(b2.x, b2.y);
  ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = leftGrad;
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.3)";
  ctx.stroke();

  // Right Face with depth gradient
  const rightGrad = ctx.createLinearGradient(b2.x, b2.y, t1.x, t1.y);
  rightGrad.addColorStop(0, "rgba(0,0,0,0.5)");
  rightGrad.addColorStop(1, theme.wallRight);

  ctx.fillStyle = theme.wallRight;
  ctx.beginPath();
  ctx.moveTo(b2.x, b2.y); ctx.lineTo(b1.x, b1.y);
  ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = rightGrad;
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.3)";
  ctx.stroke();

  // Top Face with illuminated beveled trim
  ctx.fillStyle = theme.wallTop;
  ctx.beginPath();
  ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y);
  ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = theme.wallBevel || "rgba(255,255,255,0.18)";
  ctx.lineWidth = 1.0;
  ctx.stroke();
}

function drawOverhauledProp(p) {
  if (p.type === "desk") {
    drawOverhauledBox(p.x, p.y, p.w, p.h, p.ht, {
      wallTop: "#5c3214", wallLeft: "#3d1f0c", wallRight: "#2b1407",
      wallBevel: "rgba(255,200,150,0.2)"
    });
    drawOverhauledBox(p.x + p.w * 0.25, p.y + p.h * 0.35, 14, 7, p.ht + 14, {
      wallTop: "#1e293b", wallLeft: "#0f172a", wallRight: "#090d16"
    });
    const scr = toIso(p.x + p.w * 0.35, p.y + p.h * 0.45, p.ht + 8);
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(scr.x - 4, scr.y - 5, 8, 4);
  } else if (p.type === "pedestal") {
    drawOverhauledBox(p.x - 18, p.y - 18, 36, 36, 26, {
      wallTop: "#cbd5e1", wallLeft: "#94a3b8", wallRight: "#64748b",
      wallBevel: "rgba(255,255,255,0.4)"
    });
    drawOverhauledBox(p.x - 12, p.y - 12, 24, 24, 29, {
      wallTop: "#881337", wallLeft: "#4c0519", wallRight: "#3b0712",
      wallBevel: "rgba(244,63,94,0.3)"
    });
  } else if (p.type === "serverRack") {
    drawOverhauledBox(p.x, p.y, p.w, p.h, p.ht, {
      wallTop: "#1e293b", wallLeft: "#0f172a", wallRight: "#080c14",
      wallBevel: "rgba(56,189,248,0.3)"
    });
    const ledP = toIso(p.x + 8, p.y + p.h, 20);
    const ledColor = (Math.floor(loopTimer * 5) % 2 === 0) ? "#22c55e" : "#06b6d4";
    ctx.fillStyle = ledColor;
    ctx.fillRect(ledP.x - 2, ledP.y - 2, 4, 4);
  } else if (p.type === "plant") {
    drawOverhauledBox(p.x - 8, p.y - 8, 16, 16, 14, {
      wallTop: "#d97706", wallLeft: "#b45309", wallRight: "#92400e"
    });
    const fP = toIso(p.x, p.y, 22);
    ctx.fillStyle = "#15803d";
    ctx.beginPath();
    ctx.arc(fP.x, fP.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#4ade80";
    ctx.beginPath();
    ctx.arc(fP.x - 3, fP.y - 4, 6, 0, Math.PI * 2);
    ctx.fill();
  } else if (p.type === "painting") {
    drawOverhauledBox(p.x, p.y, p.w, p.h, p.ht, {
      wallTop: "#d97706", wallLeft: "#1e3a8a", wallRight: "#172554",
      wallBevel: "rgba(250,204,21,0.4)"
    });
  } else if (p.type === "stanchion") {
    drawOverhauledBox(p.x - 3, p.y - 3, 6, 6, 18, {
      wallTop: "#facc15", wallLeft: "#ca8a04", wallRight: "#a16207"
    });
  }
}

function drawIsoDoor(d) {
  const currentHt = d.ht * (1 - d.openProgress);
  if (currentHt > 2) {
    drawOverhauledBox(d.x, d.y, d.w, d.h, currentHt, {
      wallTop: "#475569", wallLeft: "#334155", wallRight: "#1e293b",
      wallBevel: "rgba(148,163,184,0.3)"
    });
  }
}

function drawOverhauledLoot(lt) {
  const bob = Math.sin(loopTimer * 5) * 6;
  const lp = toIso(lt.x, lt.y, 16 + bob);
  const sp = toIso(lt.x, lt.y, 0);

  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(sp.x, sp.y, 14 * COS_30, 14 * SIN_30, 0, 0, Math.PI * 2);
  ctx.fill();

  if (lt.type === "cash") {
    drawOverhauledBox(lt.x - 12, lt.y - 8, 24, 16, 16 + bob, {
      wallTop: "#4ade80", wallLeft: "#16a34a", wallRight: "#15803d",
      wallBevel: "rgba(255,255,255,0.4)"
    });
  } else if (lt.type === "gem") {
    ctx.fillStyle = "#e11d48";
    ctx.beginPath();
    ctx.arc(lp.x, lp.y, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fda4af";
    ctx.beginPath();
    ctx.arc(lp.x - 3, lp.y - 4, 4, 0, Math.PI * 2);
    ctx.fill();

    const orbAngle = loopTimer * 4;
    const ox = lp.x + Math.cos(orbAngle) * 16;
    const oy = lp.y + Math.sin(orbAngle) * 8;
    ctx.fillStyle = "#fef08a";
    ctx.beginPath();
    ctx.arc(ox, oy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (lt.type === "gold") {
    drawOverhauledBox(lt.x - 14, lt.y - 8, 28, 16, 14 + bob, {
      wallTop: "#facc15", wallLeft: "#eab308", wallRight: "#ca8a04",
      wallBevel: "rgba(255,255,255,0.5)"
    });
  } else {
    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.arc(lp.x, lp.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7dd3fc";
    ctx.beginPath();
    ctx.arc(lp.x, lp.y, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHolographicGhost(f, id) {
  const gp = toIso(f.x, f.y, 0);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(gp.x, gp.y, 14 * COS_30, 14 * SIN_30, 0, 0, Math.PI * 2);
  ctx.fill();

  const bp = toIso(f.x, f.y, f.isCrouching ? 10 : 16);

  ctx.fillStyle = "rgba(6, 182, 212, 0.45)";
  ctx.beginPath();
  ctx.arc(bp.x - 2, bp.y, f.isCrouching ? 10 : 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(236, 72, 153, 0.45)";
  ctx.beginPath();
  ctx.arc(bp.x + 2, bp.y, f.isCrouching ? 10 : 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(241, 245, 249, 0.85)";
  ctx.beginPath();
  ctx.arc(bp.x, bp.y, f.isCrouching ? 9 : 12, 0, Math.PI * 2);
  ctx.fill();

  const hp = toIso(f.x, f.y, f.isCrouching ? 18 : 28);
  ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
  ctx.beginPath();
  ctx.arc(hp.x, hp.y, 6.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bp.x - 12, bp.y); ctx.lineTo(bp.x + 12, bp.y);
  ctx.stroke();

  ctx.fillStyle = "rgba(11, 15, 25, 0.9)";
  ctx.fillRect(hp.x - 24, hp.y - 20, 48, 14);
  ctx.strokeStyle = "#38bdf8";
  ctx.strokeRect(hp.x - 24, hp.y - 20, 48, 14);

  ctx.fillStyle = "#38bdf8";
  ctx.font = "bold 8px 'JetBrains Mono', monospace";
  ctx.textAlign = "center";
  ctx.fillText(`ECHO #${id}`, hp.x, hp.y - 10);
}

function drawOverhauledPlayer() {
  const gp = toIso(player.x, player.y, 0);
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.beginPath();
  ctx.ellipse(gp.x, gp.y, 14 * COS_30, 14 * SIN_30, 0, 0, Math.PI * 2);
  ctx.fill();

  const bp = toIso(player.x, player.y, player.isCrouching ? 10 : 16);
  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.arc(bp.x, bp.y, player.isCrouching ? 10 : 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#1e293b";
  ctx.beginPath();
  ctx.arc(bp.x, bp.y + 1, player.isCrouching ? 7 : 9, 0, Math.PI * 2);
  ctx.fill();

  const hp = toIso(player.x, player.y, player.isCrouching ? 18 : 28);
  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.arc(hp.x, hp.y, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = player.isCrouching ? "#facc15" : "#38bdf8";
  ctx.fillRect(hp.x - 3, hp.y - 2, 6, 3);

  if (player.hasLoot) {
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(bp.x, bp.y - 6, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = "rgba(11, 15, 25, 0.9)";
  ctx.fillRect(hp.x - 24, hp.y - 22, 48, 14);
  ctx.strokeStyle = player.isCrouching ? "#facc15" : "#38bdf8";

  ctx.fillStyle = player.isCrouching ? "#facc15" : "#38bdf8";
  ctx.font = "bold 8px 'JetBrains Mono', monospace";
  ctx.textAlign = "center";
  ctx.fillText(player.isCrouching ? `SNEAK [${cloneIndex}]` : `YOU [${cloneIndex}]`, hp.x, hp.y - 12);
}

// 3D Guard with Refined Visuals & Security Cap
function drawOverhauledGuard(g) {
  const gp = toIso(g.x, g.y, 0);
  ctx.fillStyle = "rgba(0,0,0,0.38)";
  ctx.beginPath();
  ctx.ellipse(gp.x, gp.y, 13 * COS_30, 13 * SIN_30, 0, 0, Math.PI * 2);
  ctx.fill();

  const bp = toIso(g.x, g.y, 16);
  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.arc(bp.x, bp.y, 13, 0, Math.PI * 2);
  ctx.fill();

  // Shoulder epaulets & badge
  ctx.fillStyle = "#1e3a8a";
  ctx.beginPath();
  ctx.arc(bp.x, bp.y + 1, 9, 0, Math.PI * 2);
  ctx.fill();

  const hp = toIso(g.x, g.y, 28);
  ctx.fillStyle = "#1e3a8a"; // Officer Cap
  ctx.beginPath();
  ctx.arc(hp.x, hp.y, 7, 0, Math.PI * 2);
  ctx.fill();

  // Gold visor brim
  ctx.fillStyle = "#facc15";
  ctx.fillRect(hp.x - 3, hp.y, 6, 2);

  // Suspicion Gauge Indicator
  if (g.suspicion > 0 || g.state === "INVESTIGATING" || g.state === "ALARM_CHASE") {
    const isFullAlarm = g.suspicion >= 0.8 || g.state === "ALARM_CHASE";
    ctx.fillStyle = isFullAlarm ? "#ef4444" : "#facc15";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(isFullAlarm ? "!" : "?", hp.x, hp.y - 14);

    ctx.strokeStyle = isFullAlarm ? "#ef4444" : "#facc15";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(hp.x, hp.y - 18, 9, -Math.PI / 2, -Math.PI / 2 + g.suspicion * Math.PI * 2);
    ctx.stroke();
  }
}

function renderIsoLasers() {
  level.lasers.forEach(l => {
    if (l.active) {
      const p1 = toIso(l.x1, l.y1, 14);
      const p2 = toIso(l.x2, l.y2, 14);

      ctx.strokeStyle = "rgba(239, 68, 68, 0.9)";

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);

      ctx.fillStyle = "#7f1d1d";
