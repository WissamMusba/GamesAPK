function drawPlayers(){
  const P=match.players;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    const col=getPlayerColor(p);
    const isIt=settings.teams ? (p.team === match.itTeam && match.state !== 'result') : (match.it===i&&match.state!=='result');
    
    /* 1. Dynamic Contact Shadow on Ground/Platform */
    g.fillStyle='rgba(0,0,0,0.28)';
    g.beginPath();
    g.ellipse(p.x+p.w/2, p.y+p.h+1, p.w*0.42*(p.sx||1), 4.5*(p.sy||1), 0, 0, TAU);
    g.fill();
    
    /* Draw Ghost Afterimage Trails */
    for(let tr of p.trail){
      if(tr.alpha>0.02){
        g.save();
        g.globalAlpha=tr.alpha*0.38;
        drawChar(g,tr.x,tr.y,p.w,col,{face:'run',sx:1,sy:1,grounded:false,moving:true});
        g.restore();
      }
    }
    
    if(isIt){
      /* Pulsing fiery red-gold aura */
      const auraP=0.22+0.14*Math.sin(tGlobal*8);
      g.fillStyle='rgba(235, 60, 40, '+auraP.toFixed(2)+')';
      rr(g,p.x-8,p.y-8,p.w+16,p.h+16,14);g.fill();
      g.strokeStyle='rgba(255, 200, 40, 0.55)';
      g.lineWidth=2.5;
      rr(g,p.x-4,p.y-4,p.w+8,p.h+8,11);g.stroke();
    }
    drawChar(g,p.x,p.y,p.w,col,{
      face:faceFor(p),sx:p.sx,sy:p.sy,tilt:clamp(p.vx*0.00025,-0.1,0.1),
      lookX:clamp(p.vx/300,-1,1)*0.7+p.face*0.3,lookY:!p.grounded?(p.vy<0?-0.8:0.8):0,
      fdir:p.face,blink:p.blink>0,shake:p.tagT>0.45?4:0,
      moving:Math.abs(p.vx)>60,grounded:p.grounded,seed:p.seed
    });
    const teamBadge = settings.teams ? ((p.team === 0 ? ' [RED]' : (p.team === 1 ? ' [BLUE]' : ' [GRN]'))) : '';
    ptxt('P'+(p.slot+1)+teamBadge,p.x+p.w/2,p.y-12,FN(11,900),col);
    // Proximity voice speaking indicator
    if(typeof isPlayerSpeaking==='function' && isPlayerSpeaking(p.slot!=null?p.slot:i)){
      const spkY=p.y-26, spkX=p.x+p.w/2;
      const pulse=1+0.18*Math.sin(tGlobal*14);
      g.save();
      g.translate(spkX, spkY);
      g.scale(pulse, pulse);
      g.beginPath();g.arc(0,0,10,0,TAU);
      g.fillStyle='rgba(46, 204, 113, 0.9)';g.fill();
      g.lineWidth=1.5;g.strokeStyle='#ffffff';g.stroke();
      ptxt('🎙️',0,0.5,FN(8.5,900),'#ffffff');
      g.strokeStyle='rgba(46, 204, 113, 0.65)';g.lineWidth=1.8;
      g.beginPath();g.arc(0,0,15,-0.6,0.6);g.stroke();
      g.beginPath();g.arc(0,0,15,Math.PI-0.6,Math.PI+0.6);g.stroke();
      g.restore();
    }
    if(match.state==='playing'&&match.cooldown>0){
      g.save();
      g.globalAlpha=0.3+0.2*Math.sin(tGlobal*8);
      g.strokeStyle='#ffffff';g.lineWidth=3;
      g.beginPath();g.arc(p.x+p.w/2,p.y+p.h/2,p.w*0.85,0,TAU);g.stroke();
      g.restore();
    }
  }
  if(match.state!=='result'){
    if(settings.teams && match.itTeam != null){
      for(const p of P){
        if(p.team === match.itTeam) drawITArrow(p);
      }
    } else {
      drawITArrow(P[match.it]);
    }
  }
}

function drawTagPop(){
  if(!match.tagPop)return;
  const tp=match.tagPop,k=1-clamp(tp.t/0.55,0,1);
  g.save();
  g.translate(tp.x,tp.y);
  g.globalAlpha=1-k;
  g.rotate(k*0.5);
  const R=40+k*170;
  g.fillStyle='#ffcf3f';
  g.beginPath();
  for(let i=0;i<16;i++){
    const a=TAU*i/16,rad=i%2===0?R:R*0.55;
    g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
  }
  g.closePath();g.fill();
  g.lineWidth=5;g.strokeStyle=INK;g.stroke();
  g.rotate(-k*0.5);
  const sc=0.6+easeOut(Math.min(1,k*3))*0.5;
  g.scale(sc,sc);
  g.font=FT(46);g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  g.strokeStyle=INK;g.lineWidth=8;g.strokeText('TAG!',0,0);
  g.fillStyle='#ffffff';g.fillText('TAG!',0,0);
  g.restore();
}

/* ================= MENU ================= */
/* ================= MENU (Fully Responsive Layout) ================= */
function slotCardRects(){
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isPortrait = (CH > CW && CW < 640);
  const isShortH = (CH < 640);
  const isPhone2P = (isTouch && !isOnline && (CW < 950 || CH < 600));
  const r = [];

  if(isPhone2P){
    // Mobile Phone Local: 2 large, prominent, easy-to-tap cards centered
    const maxRowW = Math.min(CW - 24, 460);
    const gap = 16;
    const cw = Math.floor((maxRowW - gap) / 2);
    const chh = Math.floor(clamp(CH * 0.22, 80, 115));
    const totalW = 2 * cw + gap;
    const x0 = Math.floor(CW / 2 - totalW / 2);
    const y = Math.floor(clamp(CH * 0.23, 86, 175));
    r.push({ x: x0, y: y, w: cw, h: chh });
    r.push({ x: x0 + cw + gap, y: y, w: cw, h: chh });
    return r;
  }

  if(isPortrait){
    // Mobile Portrait: 2x2 Grid so cards never get squished or overflow screen
    const marginX = Math.max(10, Math.floor(CW * 0.035));
    const gapX = 10;
    const cw = Math.floor((CW - marginX * 2 - gapX) / 2);
    const chh = isOnline ? Math.floor(clamp(CH * 0.165, 125, 155)) : Math.floor(clamp(CH * 0.11, 75, 95));
    const gapY = 8;
    const y0 = Math.floor(Math.max(96, CH * 0.155));
    for(let i = 0; i < 4; i++){
      const col = i % 2;
      const row = Math.floor(i / 2);
      r.push({
        x: marginX + col * (cw + gapX),
        y: y0 + row * (chh + gapY),
        w: cw,
        h: chh
      });
    }
    return r;
  }

  // Landscape / Laptop / Desktop: 4 cards in a single row
  const marginX = Math.max(14, Math.floor(CW * 0.025));
  const maxRowW = Math.min(CW - marginX * 2, 880);
  const gap = Math.floor(clamp(CW * 0.016, 8, 22));
  const cw = Math.floor((maxRowW - gap * 3) / 4);

  // Height adapts dynamically to CH so cards NEVER crush menu rows below
  const chh = isOnline
    ? Math.floor(clamp(CH * 0.23, isShortH ? 112 : 132, 180))
    : Math.floor(clamp(CH * 0.15, 65, 105));

  const totalW = 4 * cw + 3 * gap;
  const x0 = Math.floor(CW / 2 - totalW / 2);
  // Safely position below TAG title
  const y = isOnline
    ? Math.floor(clamp(CH * (isShortH ? 0.17 : 0.21), isShortH ? 82 : 110, 190))
    : Math.floor(clamp(CH * 0.24, 90, 210));

  for(let i = 0; i < 4; i++){
    r.push({ x: x0 + i * (cw + gap), y: y, w: cw, h: chh });
  }
  return r;
}

/* ================= MINI MAP RENDERER FOR MODAL ================= */
function drawMiniMap(gx, mIdx, mx, my, mw, mh){
  const M = MAPS[mIdx % MAPS.length];
  if(!M) return;
  gx.save();
  rr(gx, mx, my, mw, mh, 6);
  gx.clip();
  const bgGr = gx.createLinearGradient(mx, my, mx, my + mh);
  bgGr.addColorStop(0, '#100c1e');
  bgGr.addColorStop(1, '#221325');
  gx.fillStyle = bgGr;
  gx.fillRect(mx, my, mw, mh);

  const sx = mw / 2400, sy = mh / 1350;

  // Outer walls
  gx.fillStyle = '#2d1b24';
  const wallTh = 46 * sy;
  gx.fillRect(mx, my, mw, wallTh);
  gx.fillRect(mx, my + mh - wallTh, mw, wallTh);
  gx.fillRect(mx, my, 46 * sx, mh);
  gx.fillRect(mx + mw - 46 * sx, my, 46 * sx, mh);

  // Solids
  gx.fillStyle = '#7a5a43';
  for(const a of M.solids){
    gx.fillRect(mx + a[0] * sx, my + a[1] * sy, Math.max(2, a[2] * sx), Math.max(2, (a[3] || 26) * sy));
  }
  // Drops (pink)
  gx.fillStyle = '#eb4b9b';
  for(const a of M.drops){
    gx.fillRect(mx + a[0] * sx, my + a[1] * sy, Math.max(2, a[2] * sx), Math.max(2, (a[3] || 24) * sy));
  }
  // Speeds (cyan)
  gx.fillStyle = '#00d2d3';
  for(const a of M.speeds){
    gx.fillRect(mx + a[0] * sx, my + a[1] * sy, Math.max(2, a[2] * sx), Math.max(2, (a[3] || 26) * sy));
  }
  // Boosts (yellow/gold)
  gx.fillStyle = '#ffd166';
  for(const a of M.boosts){
    gx.fillRect(mx + a[0] * sx, my + a[1] * sy, Math.max(2, a[2] * sx), Math.max(2, (a[3] || 26) * sy));
  }
  gx.restore();

  rr(gx, mx, my, mw, mh, 6);
  gx.lineWidth = 1.5;
  gx.strokeStyle = (mIdx === settings.map) ? '#2ecc71' : 'rgba(255,255,255,0.2)';
  gx.stroke();
}

/* ================= 10-MAP PREVIEW MODAL ================= */
function drawMapModal(){
  if(!menu.mapModal) return;

  g.fillStyle = 'rgba(6, 9, 16, 0.88)';
  g.fillRect(0, 0, CW, CH);
  zone(0, 0, CW, CH, { fn: () => { menu.mapModal = false; sfx('back'); } });

  const modalW = Math.min(CW - 20, 880);
  const modalH = Math.min(CH - 20, 580);
  const modalX = Math.floor(CW / 2 - modalW / 2);
  const modalY = Math.floor(CH / 2 - modalH / 2);

  rr(g, modalX - 3, modalY - 3, modalW + 6, modalH + 6, 16);
  g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
  rr(g, modalX, modalY, modalW, modalH, 14);
  g.fillStyle = '#121826'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();
  zone(modalX, modalY, modalW, modalH, { fn: () => {} });

  const headH = clamp(modalH * 0.11, 36, 48);
  ptxt('SELECT ARENA MAP', modalX + modalW / 2, modalY + headH / 2 + 2, FT(clamp(modalW * 0.034, 16, 22)), '#ffffff');

  const cbSz = Math.min(32, headH - 10);
  const cbX = modalX + modalW - cbSz - 12, cbY = modalY + (headH - cbSz) / 2;
  rr(g, cbX, cbY, cbSz, cbSz, 8);
  g.fillStyle = '#e74c3c'; g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
  ptxt('✕', cbX + cbSz / 2, cbY + cbSz / 2 + 1, FN(13, 900), '#ffffff');
  zone(cbX, cbY, cbSz, cbSz, { fn: () => { menu.mapModal = false; sfx('back'); } });

  const isWide = (modalW >= 640);
  const isMedium = (modalW >= 460 && !isWide);
  const cols = isWide ? 5 : (isMedium ? 3 : 2);
  const rows = Math.ceil(10 / cols);

  const gridPad = 12;
  const availGridW = modalW - gridPad * 2;
  const availGridH = modalH - headH - gridPad - 8;
  const cellW = (availGridW - (cols - 1) * 8) / cols;
  const cellH = (availGridH - (rows - 1) * 8) / rows;

  for(let m = 0; m < 10; m++){
    const c = m % cols;
    const r = Math.floor(m / cols);
    const cx = modalX + gridPad + c * (cellW + 8);
    const cy = modalY + headH + r * (cellH + 8);
    const isSel = (m === settings.map);

    rr(g, cx, cy, cellW, cellH, 8);
    g.fillStyle = isSel ? 'rgba(46, 204, 113, 0.22)' : 'rgba(255,255,255,0.06)';
    g.fill();
    g.lineWidth = isSel ? 2.5 : 1.5;
    g.strokeStyle = isSel ? '#2ecc71' : 'rgba(255,255,255,0.18)';
    g.stroke();

    const labelH = clamp(cellH * 0.28, 16, 26);
    const thumbPad = 4;
    const thumbW = cellW - thumbPad * 2;
    const thumbH = Math.max(18, cellH - labelH - thumbPad * 2);
    drawMiniMap(g, m, cx + thumbPad, cy + thumbPad, thumbW, thumbH);

    if(isSel){
      const bW = 20, bH = 16;
      rr(g, cx + thumbPad + thumbW - bW - 2, cy + thumbPad + 2, bW, bH, 4);
      g.fillStyle = '#2ecc71'; g.fill(); g.lineWidth = 1; g.strokeStyle = INK; g.stroke();
      ptxt('✓', cx + thumbPad + thumbW - bW/2 - 2, cy + thumbPad + bH/2 + 2, FN(10, 900), '#ffffff');
    }

    const shortName = (m + 1) + '. ' + MAPS[m].name;
    const fs = clamp(cellW * 0.082, 9, 12);
    ptxt(shortName, cx + cellW / 2, cy + cellH - labelH / 2, FN(fs, 900), isSel ? '#2ecc71' : '#f1f2f6');

    zone(cx, cy, cellW, cellH, { fn: () => {
      settings.map = m;
      buildLevel();
      menu.mapModal = false;
      sfx('ok');
    }});
  }
}

/* ================= MODERN RESPONSIVE ARENA MENU ================= */
function drawMenu(){
  // CrazyGames banner request guard
  try{
    if(!drawMenu._bannersAt || Date.now() - drawMenu._bannersAt > 1500){
      drawMenu._bannersAt = Date.now();
      const sdk = window.CrazyGames && window.CrazyGames.SDK;
      if(sdk && sdk.banner){
        const resp = document.getElementById('cg-banner-resp');
        const top = document.getElementById('cg-banners');
        if(resp && resp.style.display === 'none' && !CG._bannerIds.has('cg-banner-responsive')){
          try{ CG.requestResponsiveBanner('cg-banner-responsive'); resp.style.display = 'flex'; }catch(e){}
        }
        if(top && top.style.display === 'none' && !CG._bannerIds.has('cg-banner-top')){
          try{ CG.requestBanner('cg-banner-top', '728x90'); top.style.display = 'block'; }catch(e){}
        }
      }
    }
  }catch(e){}

  // 1. Render live arena map in background!
  g.save();
  g.translate(CW/2, CH/2); g.scale(cam.s, cam.s); g.translate(-cam.x, -cam.y);
  drawNightWorld();
  drawWorld();
  g.restore();

  // Frosted dark overlay so menu controls pop cleanly
  g.fillStyle = 'rgba(10, 8, 20, 0.72)';
  g.fillRect(0, 0, CW, CH);

  const isShortH = (CH < 500);
  const isNarrowW = (CW < 560);
  const isMobile = (CW < 700 || CH < 500);

  // 2. Header Bar
  const headY = 10;
  const headH = clamp(CH * 0.08, isShortH ? 32 : 38, 48);

  // Sound & Theme buttons on top-right
  const si = Math.floor(clamp(headH * 0.88, 30, 40));
  const soundX = CW - si - 12;
  rr(g, soundX, headY, si, si, 8);
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
  g.fillStyle = '#3a5a3a';
  g.beginPath();
  g.moveTo(soundX + 8, headY + si/2 - 4);
  g.lineTo(soundX + 8, headY + si/2 + 4);
  g.lineTo(soundX + 14, headY + si/2 + 4);
  g.lineTo(soundX + 21, headY + si/2 + 10);
  g.lineTo(soundX + 21, headY + si/2 - 10);
  g.lineTo(soundX + 14, headY + si/2 - 4);
  g.closePath(); g.fill();
  if(muted){
    g.strokeStyle = '#c0392b'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(soundX + 23, headY + si/2 - 7); g.lineTo(soundX + 32, headY + si/2 + 7); g.stroke();
  }
  zone(soundX, headY, si, si, { fn: () => { muted = !muted; applyEffectiveMute(); } });

  const themeX = soundX - si - 8;
  rr(g, themeX, headY, si, si, 8);
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
  ptxt('🎨', themeX + si/2, headY + si/2 + 1, FN(Math.floor(si * 0.44), 900), '#ffffff');
  zone(themeX, headY, si, si, { fn: () => { cycleTheme(); } });

  // Game Logo (Left)
  const logoFs = clamp(headH * 0.85, 24, 44);
  const logoW = g.measureText ? 100 : 80;
  ptxt('TAG!', 14 + logoW * 0.35, headY + headH * 0.52, FT(logoFs), '#ffffff');

  // Mode Navigation Tabs (Pills in Center)
  const modeTabs = [
    { id: 'solo', label: '🤖 1P SOLO', short: '🤖 1P' },
    { id: '2p', label: '👥 2 PLAYERS', short: '👥 2P' },
    { id: 'online', label: '🌐 ONLINE', short: '🌐 NET' }
  ];
  const tabW = clamp((themeX - 14 - logoW - 20) / 3, isNarrowW ? 64 : 96, 136);
  const tabH = clamp(headH * 0.84, 28, 36);
  const tabsTotalW = tabW * modeTabs.length + (modeTabs.length - 1) * 6;
  const tabsX = Math.max(14 + logoW + 8, Math.floor(CW / 2 - tabsTotalW / 2));

  for(let t = 0; t < modeTabs.length; t++){
    const tab = modeTabs[t];
    const tx = tabsX + t * (tabW + 6);
    const ty = headY + (headH - tabH) / 2;
    const isAct = (menu.tab === tab.id);

    rr(g, tx, ty, tabW, tabH, 8);
    g.fillStyle = isAct ? '#ffffff' : 'rgba(255,255,255,0.12)';
    g.fill();
    g.lineWidth = isAct ? 2.5 : 1.5;
    g.strokeStyle = isAct ? INK : 'rgba(255,255,255,0.25)';
    g.stroke();

    const tLabel = isNarrowW ? tab.short : tab.label;
    const tFs = clamp(tabW * 0.11, 10.5, 13);
    ptxt(tLabel, tx + tabW/2, ty + tabH/2 + 1, FN(tFs, 900), isAct ? INK : '#cbd5e1');

    zone(tx, ty, tabW, tabH, { fn: () => setMenuTab(tab.id) });
  }

  // 3. Layout vertical budgeting
  const headerBottom = headY + headH + 8;
  const startBtnH = clamp(CH * 0.082, 38, 48);
  const startBtnW = Math.min(CW - 28, 340);
  const startBtnY = CH - startBtnH - (isShortH ? 6 : 14);

  // Settings strip directly above start button
  const stripH = isNarrowW ? 74 : clamp(CH * 0.075, 36, 44);
  const stripW = Math.min(CW - 24, 880);
  const stripX = Math.floor(CW/2 - stripW/2);
  const stripY = startBtnY - stripH - (isShortH ? 6 : 10);

  // Center Stage Area (Between header and settings strip)
  const stageY = headerBottom;
  const stageH = Math.max(110, stripY - stageY - 8);

  // 4. Center Stage Content
  if(menu.tab === 'online'){
    // --- ONLINE MATCHMAKING BOX ---
    const obW = Math.min(CW - 28, 520);
    const obH = Math.min(stageH, 200);
    const obX = Math.floor(CW/2 - obW/2);
    const obY = Math.floor(stageY + (stageH - obH)/2);

    rr(g, obX, obY, obW, obH, 14);
    g.fillStyle = 'rgba(18,24,38,0.92)'; g.fill();
    g.lineWidth = 2.5; g.strokeStyle = '#2ecc71'; g.stroke();

    ptxt('🌐 ONLINE MULTIPLAYER (TEST BUILD)', obX + obW/2, obY + 28, FT(clamp(obW * 0.038, 14, 18)), '#2ecc71');

    const btnSubW = Math.floor((obW - 40) / 2);
    const btnSubH = clamp(obH * 0.26, 32, 42);
    const btnSubY = obY + obH - btnSubH - 20;

    // Join Room button
    rr(g, obX + 16, btnSubY, btnSubW, btnSubH, 8);
    g.fillStyle = '#2ed573'; g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
    ptxt('🔗 JOIN ROOM', obX + 16 + btnSubW/2, btnSubY + btnSubH/2 + 1, FN(12.5, 900), '#ffffff');
    zone(obX + 16, btnSubY, btnSubW, btnSubH, { fn: () => netJoinAction() });

    // Host Room button
    rr(g, obX + obW - btnSubW - 16, btnSubY, btnSubW, btnSubH, 8);
    g.fillStyle = '#ffa502'; g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
    ptxt('👑 HOST ROOM', obX + obW - btnSubW/2 - 16, btnSubY + btnSubH/2 + 1, FN(12.5, 900), '#ffffff');
    zone(obX + obW - btnSubW - 16, btnSubY, btnSubW, btnSubH, { fn: () => netHostAction() });

    ptxt('Play peer-to-peer with up to 8 players across browsers!', obX + obW/2, obY + obH/2 + 4, FN(clamp(obW * 0.026, 10, 12), 800), 'rgba(255,255,255,0.7)');

  } else {
    // --- PLAYER CARDS GRID (1P SOLO & 2 PLAYERS) ---
    const isSolo = (menu.tab === 'solo');
    let numCards = 2;
    if(!isSolo && CW >= 720){
      if(menu.slotColor[3] >= 0) numCards = 4;
      else if(menu.slotColor[2] >= 0) numCards = 3;
    }

    const cardGap = clamp(CW * 0.02, 8, 16);
    const maxTotalCardsW = Math.min(CW - 24, 880);
    const cardW = Math.floor(clamp((maxTotalCardsW - (numCards - 1) * cardGap) / numCards, 130, 210));
    const cardH = Math.floor(clamp(stageH * 0.94, isShortH ? 115 : 140, 220));
    const totalCardsW = numCards * cardW + (numCards - 1) * cardGap;
    const cardsStartX = Math.floor(CW / 2 - totalCardsW / 2);
    const cardY = Math.floor(stageY + (stageH - cardH) / 2);

    for(let i = 0; i < numCards; i++){
      const cx = cardsStartX + i * (cardW + cardGap);
      const isBot = (isSolo && i === 1);
      const col = getSlotColor(i, menu.slotColor, menu.slotTeam);

      // Card Container
      rr(g, cx - 2, cardY - 2, cardW + 4, cardH + 4, 14);
      g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();
      rr(g, cx, cardY, cardW, cardH, 12);
      g.fillStyle = 'rgba(16, 22, 34, 0.90)'; g.fill();
      g.lineWidth = 2; g.strokeStyle = isBot ? '#ff4757' : col; g.stroke();

      const centerX = cx + cardW / 2;

      // Card Header
      const headTitleH = clamp(cardH * 0.16, 16, 26);
      const pTitle = isBot ? '🤖 BOT' : ('PLAYER ' + (i + 1));
      ptxt(pTitle, centerX, cardY + headTitleH * 0.65, FT(clamp(cardW * 0.082, 11, 14)), isBot ? '#ff6b81' : col);

      // Avatar
      const avY = cardY + cardH * 0.44;
      const charSz = clamp(cardH * 0.28, 22, 44);
      drawChar(g, centerX, avY, charSz, col, { face: isBot ? 'cool' : 'happy', grounded: true, seed: i * 3 });

      // Control Tag
      const tagH = clamp(cardH * 0.12, 14, 20);
      const tagY = cardY + cardH * 0.65;
      const ctrlStr = isBot ? 'SMART AI' : (isTouch ? 'TOUCH CONTROLS' : SLOTS[i].label);
      rr(g, centerX - cardW * 0.40, tagY, cardW * 0.80, tagH, 5);
      g.fillStyle = 'rgba(255,255,255,0.08)'; g.fill();
      ptxt(ctrlStr, centerX, tagY + tagH/2 + 1, FN(clamp(cardW * 0.065, 8.5, 10.5), 800), 'rgba(255,255,255,0.75)');

      // Color Cycler Bar
      const barH = clamp(cardH * 0.15, 18, 26);
      const barY = cardY + cardH - barH - 8;
      const barW = cardW - 16;
      const barX = cx + 8;
      rr(g, barX, barY, barW, barH, 6);
      g.fillStyle = 'rgba(0,0,0,0.5)'; g.fill();
      g.lineWidth = 1.2; g.strokeStyle = 'rgba(255,255,255,0.2)'; g.stroke();

      // Left Arrow
      const arrowSz = barH;
      ptxt('‹', barX + arrowSz * 0.4, barY + barH/2 + 1, FT(13), '#ffffff');
      zone(barX, barY, arrowSz * 0.8, barH, { fn: () => {
        if(settings.teams) cycleTeam(i, -1); else cycleSlot(i, -1);
      }});

      // Right Arrow
      ptxt('›', barX + barW - arrowSz * 0.4, barY + barH/2 + 1, FT(13), '#ffffff');
      zone(barX + barW - arrowSz * 0.8, barY, arrowSz * 0.8, barH, { fn: () => {
        if(settings.teams) cycleTeam(i, 1); else cycleSlot(i, 1);
      }});

      // Color Name in Middle
      const curCol = (menu.slotColor[i] >= 0) ? menu.slotColor[i] : i;
      const colName = (PALETTE[curCol % PALETTE.length] || PALETTE[0]).name;
      ptxt(colName, centerX, barY + barH/2 + 1, FN(clamp(cardW * 0.068, 9, 11), 900), '#ffffff');
    }
  }

  // 5. Settings Strip
  rr(g, stripX, stripY, stripW, stripH, 12);
  g.fillStyle = 'rgba(14, 18, 28, 0.94)'; g.fill();
  g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,0.18)'; g.stroke();

  if(isNarrowW){
    // Statically stacked for narrow mobile phones
    const rowH1 = Math.floor(stripH / 2);
    // Row 1: Map Selector
    const mapY = stripY + 4;
    const arrowW = 32;
    // Left Arrow
    rr(g, stripX + 6, mapY, arrowW, rowH1 - 8, 6);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    ptxt('‹', stripX + 6 + arrowW/2, mapY + (rowH1 - 8)/2 + 1, FT(15), '#ffffff');
    zone(stripX + 6, mapY, arrowW, rowH1 - 8, { fn: () => {
      settings.map = (settings.map - 1 + MAPS.length) % MAPS.length; buildLevel(); sfx('ui');
    }});

    // Right Arrow
    rr(g, stripX + stripW - arrowW - 6, mapY, arrowW, rowH1 - 8, 6);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    ptxt('›', stripX + stripW - arrowW/2 - 6, mapY + (rowH1 - 8)/2 + 1, FT(15), '#ffffff');
    zone(stripX + stripW - arrowW - 6, mapY, arrowW, rowH1 - 8, { fn: () => {
      settings.map = (settings.map + 1) % MAPS.length; buildLevel(); sfx('ui');
    }});

    // Middle Map Name (Opens Modal!)
    const mapMidW = stripW - arrowW * 2 - 24;
    const mapMidX = stripX + arrowW + 12;
    rr(g, mapMidX, mapY, mapMidW, rowH1 - 8, 6);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill();
    const mapLabel = '🗺️ ' + (settings.map + 1) + '. ' + MAPS[settings.map].name + ' ▾';
    ptxt(mapLabel, mapMidX + mapMidW/2, mapY + (rowH1 - 8)/2 + 1, FN(11, 900), '#ffd166');
    zone(mapMidX, mapY, mapMidW, rowH1 - 8, { fn: () => { menu.mapModal = true; sfx('ok'); } });

    // Row 2: Chips (2x Jump, 120s Timer, Teams)
    const chipsY = stripY + rowH1 + 2;
    const chipW = Math.floor((stripW - 24) / 3);
    const chipH = rowH1 - 8;

    // Chip 1: Double Jump
    rr(g, stripX + 6, chipsY, chipW, chipH, 6);
    g.fillStyle = settings.doubleJump ? '#2ed573' : 'rgba(255,255,255,0.12)'; g.fill();
    ptxt('2x JUMP', stripX + 6 + chipW/2, chipsY + chipH/2 + 1, FN(10.5, 900), settings.doubleJump ? '#ffffff' : '#94a3b8');
    zone(stripX + 6, chipsY, chipW, chipH, { fn: () => { settings.doubleJump = !settings.doubleJump; sfx('ui'); } });

    // Chip 2: Timer
    rr(g, stripX + 12 + chipW, chipsY, chipW, chipH, 6);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    ptxt('⏱️ ' + settings.time + 's', stripX + 12 + chipW * 1.5, chipsY + chipH/2 + 1, FN(10.5, 900), '#ffd166');
    zone(stripX + 12 + chipW, chipsY, chipW, chipH, { fn: () => {
      settings.timeIdx = (settings.timeIdx + 1) % TIMES.length; sfx('ui');
    }});

    // Chip 3: Teams
    rr(g, stripX + 18 + chipW * 2, chipsY, chipW, chipH, 6);
    g.fillStyle = settings.teams ? '#2ed573' : 'rgba(255,255,255,0.12)'; g.fill();
    ptxt(settings.teams ? '👥 TEAMS' : '👥 SOLO', stripX + 18 + chipW * 2.5, chipsY + chipH/2 + 1, FN(10.5, 900), settings.teams ? '#ffffff' : '#94a3b8');
    zone(stripX + 18 + chipW * 2, chipsY, chipW, chipH, { fn: () => { toggleTeams(); } });

  } else {
    // Single sleek horizontal dock for desktop & tablets
    const itemH = stripH - 12;
    const itemY = stripY + 6;

    // Map Selector Box (Left half)
    const mapBoxW = clamp(stripW * 0.48, 220, 360);
    const arrowW = 28;

    // Left Arrow
    rr(g, stripX + 6, itemY, arrowW, itemH, 6);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    ptxt('‹', stripX + 6 + arrowW/2, itemY + itemH/2 + 1, FT(15), '#ffffff');
    zone(stripX + 6, itemY, arrowW, itemH, { fn: () => {
      settings.map = (settings.map - 1 + MAPS.length) % MAPS.length; buildLevel(); sfx('ui');
    }});

    // Right Arrow
    rr(g, stripX + 6 + mapBoxW - arrowW, itemY, arrowW, itemH, 6);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    ptxt('›', stripX + 6 + mapBoxW - arrowW/2, itemY + itemH/2 + 1, FT(15), '#ffffff');
    zone(stripX + 6 + mapBoxW - arrowW, itemY, arrowW, itemH, { fn: () => {
      settings.map = (settings.map + 1) % MAPS.length; buildLevel(); sfx('ui');
    }});

    // Middle Map Name (Opens Modal!)
    const mapMidW = mapBoxW - arrowW * 2 - 8;
    const mapMidX = stripX + 6 + arrowW + 4;
    rr(g, mapMidX, itemY, mapMidW, itemH, 6);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill();
    const mapLabel = '🗺️ ' + (settings.map + 1) + '. ' + MAPS[settings.map].name + ' ▾';
    ptxt(mapLabel, mapMidX + mapMidW/2, itemY + itemH/2 + 1, FN(clamp(mapBoxW * 0.038, 10.5, 12), 900), '#ffd166');
    zone(mapMidX, itemY, mapMidW, itemH, { fn: () => { menu.mapModal = true; sfx('ok'); } });

    // Right side: 3 Modifier Chips
    const chipsX = stripX + 6 + mapBoxW + 12;
    const chipsAvailW = stripW - (chipsX - stripX) - 10;
    const chipW = Math.floor((chipsAvailW - 12) / 3);

    // Chip 1: Double Jump
    rr(g, chipsX, itemY, chipW, itemH, 6);
    g.fillStyle = settings.doubleJump ? '#2ed573' : 'rgba(255,255,255,0.12)'; g.fill();
    ptxt('2x JUMP', chipsX + chipW/2, itemY + itemH/2 + 1, FN(11, 900), settings.doubleJump ? '#ffffff' : '#94a3b8');
    zone(chipsX, itemY, chipW, itemH, { fn: () => { settings.doubleJump = !settings.doubleJump; sfx('ui'); } });

    // Chip 2: Timer
    rr(g, chipsX + chipW + 6, itemY, chipW, itemH, 6);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    ptxt('⏱️ ' + settings.time + 's', chipsX + chipW + 6 + chipW/2, itemY + itemH/2 + 1, FN(11, 900), '#ffd166');
    zone(chipsX + chipW + 6, itemY, chipW, itemH, { fn: () => {
      settings.timeIdx = (settings.timeIdx + 1) % TIMES.length; sfx('ui');
    }});

    // Chip 3: Teams
    rr(g, chipsX + chipW * 2 + 12, itemY, chipW, itemH, 6);
    g.fillStyle = settings.teams ? '#2ed573' : 'rgba(255,255,255,0.12)'; g.fill();
    ptxt(settings.teams ? '👥 TEAMS' : '👥 SOLO', chipsX + chipW * 2 + 12 + chipW/2, itemY + itemH/2 + 1, FN(11, 900), settings.teams ? '#ffffff' : '#94a3b8');
    zone(chipsX + chipW * 2 + 12, itemY, chipW, itemH, { fn: () => { toggleTeams(); } });
  }

  // 6. Giant START MATCH Button
  const pulse = 0.90 + Math.sin(tGlobal * 5) * 0.10;
  const startBtnX = Math.floor(CW/2 - startBtnW/2);
  rr(g, startBtnX - 2, startBtnY - 2, startBtnW + 4, startBtnH + 4, 14);
  g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();
  rr(g, startBtnX, startBtnY, startBtnW, startBtnH, 12);
  g.fillStyle = 'rgba(46, 204, 113, ' + pulse + ')'; g.fill();
  g.lineWidth = 2; g.strokeStyle = '#ffffff'; g.stroke();

  const startLabel = isTouch ? '▶ START MATCH' : '▶ START MATCH  (SPACE)';
  ptxt(startLabel, CW/2, startBtnY + startBtnH/2 + 1, FT(clamp(startBtnH * 0.44, 15, 20)), '#ffffff');
  zone(startBtnX - 2, startBtnY - 2, startBtnW + 4, startBtnH + 4, { fn: () => {
    if(activeSlots().length < 2){
      menu.slotColor[0] = 0; menu.slotColor[1] = 1;
    }
    sfx('go');
    startMatch();
  }});

  // 7. Toast Message
  if(menu.toastT > 0 && menu.toast){
    const a = clamp(menu.toastT, 0, 1);
    g.save(); g.globalAlpha = a;
    g.font = FN(15, 900);
    const w4 = g.measureText(menu.toast).width + 44;
    pill(CW/2 - w4/2, CH * 0.44, w4, 38, 'rgba(30,30,30,0.88)', '#ffffff');
    txt(menu.toast, CW/2, CH * 0.44 + 20, FN(14, 900), '#ffffff');
    g.restore();
  }

  // 8. Map Modal (draws on top if open)
  drawMapModal();
}
/* ================= HUD / pause / result ================= */
function tri(x,y,r,dir){
  g.beginPath();
  if(dir===0){g.moveTo(x+r*0.45,y-r*0.55);g.lineTo(x+r*0.45,y+r*0.55);g.lineTo(x-r*0.55,y);}
  else if(dir===1){g.moveTo(x-r*0.45,y-r*0.55);g.lineTo(x-r*0.45,y+r*0.55);g.lineTo(x+r*0.55,y);}
  else if(dir===2){g.moveTo(x-r*0.55,y+r*0.45);g.lineTo(x+r*0.55,y+r*0.45);g.lineTo(x,y-r*0.55);}
  else{g.moveTo(x-r*0.55,y-r*0.45);g.lineTo(x+r*0.55,y-r*0.45);g.lineTo(x,y+r*0.55);}
  g.closePath();
}
function drawPadBtn(cx,cy,r,dir,o){
  const active=o.hold?keys.has(o.hold):(tGlobal-(glow[o.pk]||-9))<0.15;
  g.beginPath();g.arc(cx,cy,r,0,TAU);
  g.fillStyle=active?'rgba(255,255,255,0.75)':'rgba(15,23,42,0.65)';
  g.fill();
  g.lineWidth=2.5;g.strokeStyle=active?'#ffffff':'rgba(255,255,255,0.45)';g.stroke();
  tri(cx,cy,r*0.55,dir);
  g.fillStyle=active?'#143c26':'#ffffff';
  g.fill();
  zone(cx-r-12,cy-r-12,r*2+24,r*2+24,o);
}

function drawPadBtnAction(cx,cy,r,actionKey,symbol,glowCol,label){
  let active = false;
  if(actionKey === 'left') active = TOUCH.left;
  else if(actionKey === 'right') active = TOUCH.right;
  else if(actionKey === 'jump') active = TOUCH.jumpHeld;
  else if(actionKey === 'down') active = TOUCH.downHeld;
  
  g.save();
  if(active){
    g.beginPath(); g.arc(cx,cy,r+6,0,TAU);
    g.fillStyle=glowCol||'rgba(255,255,255,0.3)';
    g.fill();
  }
  
  // Frosted circular button
  g.beginPath(); g.arc(cx,cy,r,0,TAU);
  g.fillStyle=active?'rgba(255,255,255,0.90)':'rgba(15,23,42,0.68)';
  g.fill();
  g.lineWidth=active?3.5:2.5;
  g.strokeStyle=active?'#ffffff':'rgba(255,255,255,0.45)';
  g.stroke();
  
  // Symbol icon
  g.font=FN(Math.round(r*(label?0.62:0.72)),900);
  g.textAlign='center';
  g.textBaseline='middle';
  g.fillStyle=active?'#0f172a':'#ffffff';
  g.fillText(symbol,cx,cy+(label?-r*0.12:1));
  
  // Optional small label below icon (e.g. JUMP, DROP on tablet)
  if(label && r>=34){
    g.font=FN(Math.max(9,Math.round(r*0.22)),900);
    g.fillStyle=active?'#0f172a':'rgba(255,255,255,0.75)';
    g.fillText(label,cx,cy+r*0.52);
  }
  g.restore();
  
  // Generous touch hitbox
  const padH=16;
  zone(cx-r-padH,cy-r-padH,2*(r+padH),2*(r+padH),{
    touchAction: actionKey
  });
}

function drawTouchButtons(){
  if(!match) return;
  
  const isOnline=(typeof NET!=='undefined' && NET && NET.role!==null);
  const isSplitLocal=(!isOnline && match.players.length===2);
  const isTablet=Math.min(CW,CH)>=550 || (CW/CH<1.7 && Math.min(CW,CH)>=480);
  
  if(!isSplitLocal){
    /* ================= SLEEK SEE-THROUGH JOYSTICKS (ONLINE & SOLO) ================= */
    const r = isTablet ? clamp(CH * 0.058, 24, 32) : clamp(CH * 0.075, 20, 26);
    const bm = isTablet ? clamp(CH * 0.07, 24, 44) : clamp(CH * 0.06, 16, 26);
    const sm = isTablet ? clamp(CW * 0.045, 26, 48) : clamp(CW * 0.04, 18, 30);
    
    // --- 1. Left Horizontal-Only Joystick (Snaps to Center) ---
    const wL = r * 3.6, hL = r * 2.1;
    const cxL = sm + wL / 2;
    const cyL = CH - bm - hL / 2;
    const xL = cxL - wL / 2, yL = cyL - hL / 2;
    const maxTravelL = (wL - 2 * r) / 2;
    JOY.boundsL = { x: xL, y: yL, w: wL, h: hL, cx: cxL, cy: cyL, maxTravel: maxTravelL, r: r };

    // --- 2. Right Vertical Dual Slider (Height = 2x Diameter, Snaps to Top) ---
    const wR = r * 2.1, hR = r * 4.0;
    const cxR = CW - sm - wR / 2;
    const yR = CH - bm - hR;
    const xR = cxR - wR / 2;
    const cyTopR = yR + r * 1.05;
    const maxTravelR = hR - 2.1 * r;
    JOY.boundsR = { x: xR, y: yR, w: wR, h: hR, cx: cxR, cyTop: cyTopR, maxTravel: maxTravelR, r: r };

    // Smooth visual interpolation for knobs
    JOY.leftVisX += (JOY.leftX - JOY.leftVisX) * 0.40;
    JOY.rightVisY += (JOY.rightY - JOY.rightVisY) * 0.45;

    // --- Render Left Horizontal Track ---
    g.save();
    rr(g, xL, yL, wL, hL, hL / 2);
    g.fillStyle = 'rgba(255, 255, 255, 0.08)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    g.stroke();

    // Subtle track slot guideline
    g.beginPath();
    g.moveTo(cxL - maxTravelL * 0.85, cyL);
    g.lineTo(cxL + maxTravelL * 0.85, cyL);
    g.lineWidth = 2.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    g.stroke();

    // Faint chevrons
    ptxt('◀', xL + r * 0.55, cyL, FN(11, 900), 'rgba(255, 255, 255, 0.28)');
    ptxt('▶', xL + wL - r * 0.55, cyL, FN(11, 900), 'rgba(255, 255, 255, 0.28)');

    // Render Left Knob (rests in center)
    const kxL = cxL + JOY.leftVisX * maxTravelL;
    const leftActive = (TOUCH.left || TOUCH.right);
    g.beginPath();
    g.arc(kxL, cyL, r * 0.88, 0, Math.PI * 2);
    g.fillStyle = leftActive ? 'rgba(0, 210, 211, 0.45)' : 'rgba(255, 255, 255, 0.22)';
    g.fill();
    g.lineWidth = 2;
    g.strokeStyle = leftActive ? '#00d2d3' : 'rgba(255, 255, 255, 0.60)';
    g.stroke();
    g.beginPath();
    g.arc(kxL, cyL, 3, 0, Math.PI * 2);
    g.fillStyle = leftActive ? '#ffffff' : 'rgba(255, 255, 255, 0.50)';
    g.fill();

    // --- Render Right Vertical Track ---
    rr(g, xR, yR, wR, hR, wR / 2);
    g.fillStyle = 'rgba(255, 255, 255, 0.08)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    g.stroke();

    // Subtle vertical slot guideline
    g.beginPath();
    g.moveTo(cxR, cyTopR + r * 0.2);
    g.lineTo(cxR, cyTopR + maxTravelR);
    g.lineWidth = 2.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    g.stroke();

    // Dedicated Drop Pad target at bottom
    const cyBotR = yR + hR - r * 1.05;
    g.beginPath();
    g.arc(cxR, cyBotR, r * 0.76, 0, Math.PI * 2);
    g.fillStyle = TOUCH.downHeld ? 'rgba(235, 75, 155, 0.45)' : 'rgba(235, 75, 155, 0.14)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = TOUCH.downHeld ? '#eb4b9b' : 'rgba(235, 75, 155, 0.50)';
    g.stroke();
    ptxt('v', cxR, cyBotR + 1, FN(11, 900), TOUCH.downHeld ? '#ffffff' : 'rgba(235, 75, 155, 0.85)');

    // Render Right Knob (snaps to top, tap jumps, drag down drops)
    const kyR = cyTopR + JOY.rightVisY * maxTravelR;
    g.beginPath();
    g.arc(cxR, kyR, r * 0.88, 0, Math.PI * 2);
    if(TOUCH.downHeld || JOY.rightVisY > 0.25){
      g.fillStyle = 'rgba(235, 75, 155, 0.65)';
      g.strokeStyle = '#eb4b9b';
    } else if(TOUCH.jumpHeld){
      g.fillStyle = 'rgba(46, 204, 113, 0.65)';
      g.strokeStyle = '#2ecc71';
    } else {
      g.fillStyle = 'rgba(255, 255, 255, 0.22)';
      g.strokeStyle = 'rgba(255, 255, 255, 0.60)';
    }
    g.fill();
    g.lineWidth = 2;
    g.stroke();

    // Icon inside knob (▲ for Jump, v when dragged down for Drop)
    const knobIcon = (TOUCH.downHeld || JOY.rightVisY > 0.25) ? 'v' : '▲';
    const knobCol = (TOUCH.downHeld || TOUCH.jumpHeld || JOY.rightVisY > 0.25) ? '#ffffff' : 'rgba(255, 255, 255, 0.85)';
    ptxt(knobIcon, cxR, kyR + (knobIcon === '▲' ? -1 : 1), FN(12, 900), knobCol);

    g.restore();
  } else {
    /* ================= 2-PLAYER LOCAL SPLIT (SIDE-TO-SIDE JOYSTICK + FIXED JUMP/DROP) ================= */
    const b = calcLocalBounds();
    const colP1 = (match.players[0] && PALETTE[match.players[0].colIdx]) ? PALETTE[match.players[0].colIdx].c : '#e8433f';
    const colP2 = (match.players[1] && PALETTE[match.players[1].colIdx]) ? PALETTE[match.players[1].colIdx].c : '#2f9be8';

    g.save();

    // 1. Subtle Center Dashed Midline
    g.setLineDash([6, 8]);
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.16)';
    g.beginPath();
    g.moveTo(b.midX, 52);
    g.lineTo(b.midX, CH - 14);
    g.stroke();
    g.setLineDash([]);

    // 2. Ambient Corner Watermarks
    const isNarrow = (CW < 600);
    ptxt('P1 ZONE', Math.max(34, CW * 0.08), 34, FN(isNarrow ? 10 : 12, 900), rgba(colP1, 0.45));
    ptxt('P2 ZONE', CW - Math.max(34, CW * 0.08), 34, FN(isNarrow ? 10 : 12, 900), rgba(colP2, 0.45));

    // Helper to draw a player's controls
    const drawPlayerControls = (pData, cfg, col) => {
      // Smooth visual knob interpolation
      pData.visOffX += (pData.offX - pData.visOffX) * 0.40;

      // --- A. Side-to-Side Joystick Track ---
      // If active, anchor track at touch position. If idle, show at default resting position.
      const jx = pData.active ? pData.startX : cfg.defJoyX;
      const jy = pData.active ? pData.startY : cfg.defJoyY;
      const tw = b.trackW, th = b.trackH;

      rr(g, jx - tw / 2, jy - th / 2, tw, th, th / 2);
      g.fillStyle = pData.active ? rgba(col, 0.12) : 'rgba(255, 255, 255, 0.08)';
      g.fill();
      g.lineWidth = 1.5;
      g.strokeStyle = pData.active ? rgba(col, 0.50) : 'rgba(255, 255, 255, 0.20)';
      g.stroke();

      // Track slot line
      g.beginPath();
      g.moveTo(jx - b.maxTravel * 0.85, jy);
      g.lineTo(jx + b.maxTravel * 0.85, jy);
      g.lineWidth = 2.5;
      g.strokeStyle = pData.active ? rgba(col, 0.25) : 'rgba(255, 255, 255, 0.10)';
      g.stroke();

      // Chevrons inside track
      ptxt('◀', jx - tw / 2 + b.r * 0.5, jy, FN(10, 900), pData.left ? '#ffffff' : 'rgba(255, 255, 255, 0.30)');
      ptxt('▶', jx + tw / 2 - b.r * 0.5, jy, FN(10, 900), pData.right ? '#ffffff' : 'rgba(255, 255, 255, 0.30)');

      // Joystick Knob
      const kx = jx + pData.visOffX * b.maxTravel;
      const isJoyActive = (pData.left || pData.right);
      g.beginPath();
      g.arc(kx, jy, b.r * 0.82, 0, TAU);
      g.fillStyle = isJoyActive ? rgba(col, 0.65) : 'rgba(255, 255, 255, 0.22)';
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = isJoyActive ? '#ffffff' : rgba(col, 0.60);
      g.stroke();

      // Knob center pip or arrow
      const knobIcon = pData.left ? '◀' : (pData.right ? '▶' : '•');
      ptxt(knobIcon, kx, jy + (knobIcon === '•' ? 0 : 1), FN(12, 900), isJoyActive ? '#ffffff' : 'rgba(255, 255, 255, 0.65)');

      // --- B. Fixed JUMP Button (Top) ---
      const jumpR = b.r * 0.88;
      g.beginPath();
      g.arc(cfg.btnX, cfg.jumpY, jumpR, 0, TAU);
      g.fillStyle = pData.jumpHeld ? 'rgba(46, 204, 113, 0.65)' : 'rgba(255, 255, 255, 0.12)';
      g.fill();
      g.lineWidth = pData.jumpHeld ? 2.5 : 1.8;
      g.strokeStyle = pData.jumpHeld ? '#2ecc71' : 'rgba(255, 255, 255, 0.35)';
      g.stroke();
      ptxt('▲', cfg.btnX, cfg.jumpY, FN(13, 900), pData.jumpHeld ? '#ffffff' : 'rgba(255, 255, 255, 0.85)');

      // --- C. Fixed DROP Button (Bottom) ---
      const dropR = b.r * 0.88;
      g.beginPath();
      g.arc(cfg.btnX, cfg.dropY, dropR, 0, TAU);
      g.fillStyle = pData.downHeld ? 'rgba(235, 75, 155, 0.65)' : 'rgba(235, 75, 155, 0.15)';
      g.fill();
      g.lineWidth = pData.downHeld ? 2.5 : 1.8;
      g.strokeStyle = pData.downHeld ? '#eb4b9b' : 'rgba(235, 75, 155, 0.50)';
      g.stroke();
      ptxt('v', cfg.btnX, cfg.dropY + 1, FN(13, 900), pData.downHeld ? '#ffffff' : 'rgba(235, 75, 155, 0.85)');
    };

    drawPlayerControls(LOCAL_TOUCH.p1, b.p1, colP1);
    drawPlayerControls(LOCAL_TOUCH.p2, b.p2, colP2);

    g.restore();
  }

  // ================= 4. PRE-MATCH TUTORIAL THUMBNAIL CARD =================
  if(GESTURE_SPLIT.showTutorial && match){
    drawLocalTutorialCard();
  }
}

function drawLocalTutorialCard(){

  // Semi-transparent backdrop
  g.fillStyle = 'rgba(7, 11, 20, 0.88)';
  g.fillRect(0, 0, CW, CH);

  const cardW = Math.min(CW * 0.92, 560);
  const cardH = Math.min(CH * 0.84, 370);
  const cardX = CW / 2 - cardW / 2;
  const cardY = CH / 2 - cardH / 2;

  // Outer shadow & card body
  rr(g, cardX, cardY, cardW, cardH, 18);
  g.fillStyle = '#131b2b';
  g.fill();
  g.lineWidth = 2.5;
  g.strokeStyle = '#2ecc71';
  g.stroke();

  // Header pill
  const pw = Math.min(cardW * 0.85, 360), ph = 34;

  g.lineWidth = 1.8;
  g.strokeStyle = '#2ecc71';
  g.stroke();
  ptxt('📱 2-PLAYER TOUCH CONTROLS', CW / 2, cardY + 16 + ph / 2 + 1, FN(14, 900), '#ffffff');

  // Subtitle
  ptxt('Ergonomic Joysticks • Fixed Jump & Drop Buttons', CW / 2, cardY + 66, FN(11, 700), '#94a3b8');

  // Two columns: Left (P1) and Right (P2)
  const colW = (cardW - 36) / 2;
  const colH = cardH - 165;
  const colY = cardY + 86;

  const col2X = cardX + cardW / 2 + 4;

  const colP1 = (match.players[0] && PALETTE[match.players[0].colIdx]) ? PALETTE[match.players[0].colIdx].c : '#e8433f';
  const colP2 = (match.players[1] && PALETTE[match.players[1].colIdx]) ? PALETTE[match.players[1].colIdx].c : '#2f9be8';

  // --- Column 1: Player 1 (Left Half) ---
  rr(g, col1X, colY, colW, colH, 12);
  g.fillStyle = 'rgba(255, 255, 255, 0.04)';
  g.fill();
  g.lineWidth = 1.5;
  g.strokeStyle = rgba(colP1, 0.55);
  g.stroke();

  // P1 Header badge
  rr(g, col1X + 10, colY + 10, colW - 20, 26, 8);
  g.fillStyle = rgba(colP1, 0.25);
  g.fill();
  g.lineWidth = 1.2;
  g.strokeStyle = colP1;
  g.stroke();
  ptxt('P1 (LEFT HALF OF SCREEN)', col1X + colW / 2, colY + 23, FN(11, 900), '#ffffff');

  // P1 Instructions
  const isMini = (colH < 130);
  const rowH = isMini ? 25 : 30;
  const rowY0 = colY + 48;
  ptxt('🕹️  TOUCH ANYWHERE TO RUN', col1X + colW / 2, rowY0, FN(isMini ? 10 : 11.5, 800), '#e2e8f0');
  ptxt('▲  FIXED JUMP BUTTON', col1X + colW / 2, rowY0 + rowH, FN(isMini ? 10 : 11.5, 800), '#2ecc71');
  ptxt('v  FIXED DROP BUTTON', col1X + colW / 2, rowY0 + rowH * 2, FN(isMini ? 10 : 11.5, 800), '#f472b6');

  // --- Column 2: Player 2 (Right Half) ---
  rr(g, col2X, colY, colW, colH, 12);

function getOrCreateConnPair(peerId){
  let pair = NET.conns.get(peerId);
  if(!pair){
    pair = { rel: null, fast: null };
    NET.conns.set(peerId, pair);
  }
  return pair;
}

function netSendFast(peerOrPair, msg){
  const pair = (typeof peerOrPair === 'string') ? NET.conns.get(peerOrPair) : peerOrPair;
  if(!pair) return;
  let c = (pair.fast && pair.fast.open) ? pair.fast : null;
  if(!c && pair.rel && pair.rel.open) c = pair.rel;
  if(c){
    try {
      const dc = c.dataChannel || c._dc;
      if(dc && dc.bufferedAmount > 32768) return; // Prevent latency queueing
      c.send(msg);
    } catch(e){}
  }
}

function netSendRel(peerOrPair, msg){
  const pair = (typeof peerOrPair === 'string') ? NET.conns.get(peerOrPair) : peerOrPair;
  if(!pair) return;
  const c = (pair.rel && pair.rel.open) ? pair.rel : (pair.fast && pair.fast.open ? pair.fast : (pair.open ? pair : null));
  if(c){ try{ c.send(msg); }catch(e){} }
}

function netBroadcastReliable(msg){
  if(typeof NET === 'undefined' || !NET || !NET.conns) return;
  for(const pair of NET.conns.values()){
    netSendRel(pair, msg);
  }
}

/* High-efficiency player state packing: reduces payload by 78% and cuts garbage collection pauses */
function packPlayer(p){
  return {
    s: p.slot,
    x: Math.round(p.x * 10) / 10,
    y: Math.round(p.y * 10) / 10,
    vx: Math.round(p.vx * 10) / 10,
    vy: Math.round(p.vy * 10) / 10,
    f: p.face || 1,
    sx: Math.round((p.sx || 1) * 100) / 100,
    sy: Math.round((p.sy || 1) * 100) / 100,
    g: p.grounded ? 1 : 0,
    aj: p.airJumps || 0,
    po: p.padOn ? 1 : 0,
    lt: Math.round((p.landT || 0) * 100) / 100,
    tt: Math.round((p.tagT || 0) * 100) / 100,
    b: p.blink > 0 ? 1 : 0
  };
}

function unpackPlayer(d){
  return {
    slot: d.s != null ? d.s : d.slot,
    x: d.x,
    y: d.y,
    vx: d.vx,
    vy: d.vy,
    face: d.f != null ? d.f : (d.face || 1),
    sx: d.sx != null ? d.sx : 1,
    sy: d.sy != null ? d.sy : 1,
    grounded: d.g != null ? !!d.g : !!d.grounded,
    airJumps: d.aj != null ? d.aj : (d.airJumps || 0),
    padOn: d.po != null ? !!d.po : !!d.padOn,
    landT: d.lt != null ? d.lt : (d.landT || 0),
    tagT: d.tt != null ? d.tt : (d.tagT || 0),
    blink: d.b != null ? (d.b ? 0.12 : 0) : (d.blink || 0),
    seq: d.seq || 0
  };
}

/* Continuous Predictive Smoothing Filter for Remote Players (Host & Guest) */
const _remoteTargets = new Map(); // slot -> target state

function netUpdateRemoteTarget(slot, data, pCurrent){
  if(slot == null || slot < 0) return;
  let tgt = _remoteTargets.get(slot);
  if(!tgt){
    tgt = {
      targetX: data.x, targetY: data.y, targetVx: data.vx, targetVy: data.vy,
      errX: 0, errY: 0,
      face: data.face || 1, sx: data.sx || 1, sy: data.sy || 1,
      grounded: !!data.grounded, airJumps: data.airJumps || 0,
      padOn: !!data.padOn, landT: data.landT || 0, tagT: data.tagT || 0,
      blink: data.blink || 0, seq: (data.seq != null ? data.seq : 0)
    };
    _remoteTargets.set(slot, tgt);
  } else {
    // Drop older out-of-order packets if seq is positive
    if(data.seq != null && tgt.seq != null && data.seq > 0 && tgt.seq > 0 && data.seq < tgt.seq) return;
    if(data.seq != null && data.seq > 0) tgt.seq = data.seq;

    // Calculate error between where player visually was and new target
    if(pCurrent){
      const rawDx = pCurrent.x - data.x;
      const rawDy = pCurrent.y - data.y;
      // If warp / teleport > 240px, snap instantly without error bleed
      if(rawDx * rawDx + rawDy * rawDy > 57600){
        pCurrent.x = data.x;
        pCurrent.y = data.y;
        tgt.errX = 0;
        tgt.errY = 0;
      } else {
        tgt.errX = rawDx;
        tgt.errY = data.grounded ? 0 : rawDy;
      }
    } else {
      tgt.errX = 0;
      tgt.errY = 0;
    }

    tgt.targetX = data.x;
    tgt.targetY = data.y;
    tgt.targetVx = data.vx;
    tgt.targetVy = data.vy;
    tgt.face = data.face != null ? data.face : tgt.face;
    tgt.sx = data.sx != null ? data.sx : 1;
    tgt.sy = data.sy != null ? data.sy : 1;
    tgt.grounded = !!data.grounded;
    tgt.airJumps = data.airJumps != null ? data.airJumps : tgt.airJumps;
    tgt.padOn = !!data.padOn;
    tgt.landT = data.landT != null ? data.landT : tgt.landT;
    tgt.tagT = data.tagT != null ? data.tagT : tgt.tagT;
    tgt.blink = data.blink != null ? data.blink : tgt.blink;
  }
}

function netApplyRemoteTarget(p, dt){
  const tgt = _remoteTargets.get(p.slot);
  if(!tgt) return;

  // Advance authoritative target along velocity vector between packets
  tgt.targetX += tgt.targetVx * dt;
  if(!tgt.grounded){
    tgt.targetY += tgt.targetVy * dt;
  }

  // Smooth exponential decay of error offset (half-life ~40ms: eliminates all micro-stutters and backward snapping)
  const decay = Math.exp(-dt * 18);
  tgt.errX *= decay;
  tgt.errY *= decay;

  // Visual position combines extrapolated target + smoothly decaying error offset
  p.x = tgt.targetX + tgt.errX;
  if(tgt.grounded){
    p.y = tgt.targetY;
    p.grounded = true;
    p.vy = 0;
  } else {
    p.y = tgt.targetY + tgt.errY;
    p.grounded = false;
    p.vy = tgt.targetVy;
  }
  p.vx = tgt.targetVx;

  p.face = tgt.face;
  p.sx += ((tgt.sx || 1) - p.sx) * Math.min(1, dt * 20);
  p.sy += ((tgt.sy || 1) - p.sy) * Math.min(1, dt * 20);
  p.landT = tgt.landT;
  p.tagT = tgt.tagT;
  p.padOn = tgt.padOn;
  p.blink = tgt.blink;
  p.airJumps = tgt.airJumps;

  // Ghost trail FX for remote sprinting player
  if(p.trail){
    for(let tr of p.trail) tr.alpha -= dt * 1.8;
    if(Math.abs(p.vx) > 300 || p.padOn){
      p.trail.unshift({ x: p.x, y: p.y, alpha: 0.45 });
      if(p.trail.length > 4) p.trail.pop();
    } else if(p.trail.length > 0){
      p.trail.pop();
    }
  }
}

/* ================= proximity voice chat (WebRTC + HTML5 Audio + Web Audio API) ================= */
const VOICE = {
  enabled: false,
  muted: false,
  localStream: null,
  analyser: null,
  analyserData: null,
  speaking: false,
  peers: new Map(), // peerId -> { call, stream, audioEl, source, analyser, analyserData, speaking, remoteMuted }
  supported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
};

async function voiceInit(){
  if(!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
    netToast('Mic requires HTTPS! Local HTTP blocks microphone.');
    return false;
  }
  if(!VOICE.supported){
    netToast('Voice chat not supported on this browser');
    return false;
  }
  initAudio();
  if(AC && AC.state === 'suspended') AC.resume().catch(()=>{});

  if(VOICE.localStream){
    VOICE.enabled = true;
    VOICE.muted = false;
    for(const track of VOICE.localStream.getAudioTracks()){ track.enabled = true; }
    netBroadcastReliable({ t: 'voice_mute', slot: NET.mySlot, peerId: NET.myId, muted: false });
    netToast('Microphone unmuted 🎙️');
    voiceSyncAllPeers();
    return true;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: { ideal: 1 },
        sampleRate: { ideal: 48000 },
        sampleSize: { ideal: 16 },
        echoCancellation: { ideal: true },
        noiseSuppression: { ideal: true },
        autoGainControl: { ideal: true },
        googEchoCancellation: { ideal: true },
        googAutoGainControl: { ideal: true },
        googNoiseSuppression: { ideal: true },
        googHighpassFilter: { ideal: true },
        googTypingNoiseDetection: { ideal: true }
      },
      video: false
    });
    VOICE.localStream = stream;
    VOICE.enabled = true;
    VOICE.muted = false;

    if(AC){
      try {
        const src = AC.createMediaStreamSource(stream);
        const ana = AC.createAnalyser();
        ana.fftSize = 128;
        src.connect(ana);
        VOICE.analyser = ana;
        VOICE.analyserData = new Uint8Array(ana.frequencyBinCount);
      } catch(e){}
    }

    netToast('Voice chat active! 🎙️');
    voiceSyncAllPeers();
    return true;
  } catch(err){
    console.warn('Microphone permission error:', err);
    netToast('Microphone access denied or unavailable');
    return false;
  }
}

function boostAudioSender(pc){
  if(!pc || !pc.getSenders) return;
  try {
    const senders = pc.getSenders();
    for(const sender of senders){
      if(sender.track && sender.track.kind === 'audio'){
        const params = sender.getParameters();
        if(params){
          if(!params.encodings || params.encodings.length === 0){
            params.encodings = [{}];
          }
          params.encodings[0].maxBitrate = 96000; // 96 kbps high-definition Opus
          params.encodings[0].priority = 'high';
          params.encodings[0].networkPriority = 'high';
          sender.setParameters(params).catch(()=>{});
        }
      }
    }
  } catch(e){}
}

function voiceToggleMic(){
  if(!VOICE.localStream || !VOICE.enabled){
    voiceInit();
    return;
  }
  VOICE.muted = !VOICE.muted;
  for(const track of VOICE.localStream.getAudioTracks()){
    track.enabled = !VOICE.muted;
  }
  if(VOICE.muted){
    VOICE.speaking = false;
  }
  netBroadcastReliable({ t: 'voice_mute', slot: NET.mySlot, peerId: NET.myId, muted: VOICE.muted });
  netToast(VOICE.muted ? 'Microphone muted 🔇' : 'Microphone unmuted 🎙️');
  sfx('ui');
}

function voiceCallPeer(peerId, forceNew){
  if(!NET.peer || !peerId || peerId === NET.myId || !VOICE.localStream) return;
  const existing = VOICE.peers.get(peerId);
  // If we already have an active open call with remote audio stream playing, don't recreate it unless forced
  if(existing && existing.call && existing.call.open && existing.stream && !forceNew){
    return;
  }
  // Prevent duplicate concurrent outgoing calls to the same peer
  if(existing && existing._calling) return;

  if(!existing){
    VOICE.peers.set(peerId, {
      call: null,
      stream: null,
      audioEl: null,
      source: null,
      analyser: null,
      analyserData: null,
      speaking: false,
      remoteMuted: false,
      _calling: true
    });
  } else {
    existing._calling = true;
  }

  try {
    const call = NET.peer.call(peerId, VOICE.localStream);
    if(call) voiceWireCall(call);
  } catch(e){
    const ent = VOICE.peers.get(peerId);
    if(ent) ent._calling = false;
  }
}

function voiceSyncAllPeers(){
  if(!NET.peer || !VOICE.localStream) return;
  // If Host: initiate calls to all guests who don't have an active call
  if(NET.isHost){
    for(const peerId of NET.conns.keys()){
      voiceCallPeer(peerId, false);
    }
  } else {
    // If Guest: notify Host that our mic is ready so Host can call us (avoids glare/dual-calling)
    netBroadcastReliable({ t: 'voice_req', peerId: NET.myId, hasStream: true });
  }
}

function voiceWireCall(call){
  const peerId = call.peer;
  let entry = VOICE.peers.get(peerId);
  const prevCall = (entry && entry.call && entry.call !== call) ? entry.call : null;

  if(!entry){
    entry = {
      call: call,
      stream: null,
      audioEl: null,
      source: null,
      analyser: null,
      analyserData: null,
      speaking: false,
      remoteMuted: false,
      _calling: false
    };
    VOICE.peers.set(peerId, entry);
  } else {
    entry.call = call;
    entry._calling = false;
  }

  // Safely close previous call without nuking the active entry
  if(prevCall){
    try { prevCall.close(); } catch(e){}
  }

  const applyBoost = () => {
    if(call.peerConnection) boostAudioSender(call.peerConnection);
  };
  call.on('open', () => {
    entry._calling = false;
    applyBoost();
  });
  setTimeout(applyBoost, 400);

  call.on('stream', remoteStream => {
    const current = VOICE.peers.get(peerId);
    if(!current || (current.call && current.call !== call)) return;
    current.stream = remoteStream;

    // Reuse existing audio element if already created, or create one
    if(!current.audioEl){
      const el = document.createElement('audio');
      el.autoplay = true;
      el.playsInline = true;
      el.style.display = 'none';
      document.body.appendChild(el);
      current.audioEl = el;
    }
    current.audioEl.srcObject = remoteStream;
    current.audioEl.volume = 0.85;
    const playP = current.audioEl.play();
    if(playP && playP.catch) playP.catch(() => {});

    // Analyser setup for visual speaking indicator
    initAudio();
    if(AC){
      try {
        if(AC.state === 'suspended') AC.resume().catch(()=>{});
        if(current.source){ try{ current.source.disconnect(); }catch(e){} }
        const source = AC.createMediaStreamSource(remoteStream);
        const ana = AC.createAnalyser();
        ana.fftSize = 128;
        source.connect(ana);
        current.source = source;
        current.analyser = ana;
        current.analyserData = new Uint8Array(ana.frequencyBinCount);
      } catch(err){
        console.warn('WebAudio analyser setup error:', err);
      }
    }
  });

  call.on('close', () => {
    // CRITICAL FIX: Only clean up if this closed call is ACTUALLY the active call for this peer!
    const current = VOICE.peers.get(peerId);
    if(current && current.call === call){
      if(current.audioEl){
        try{ current.audioEl.pause(); current.audioEl.srcObject = null; current.audioEl.remove(); }catch(e){}
        current.audioEl = null;
      }
      if(current.source){ try{ current.source.disconnect(); }catch(e){} }
      VOICE.peers.delete(peerId);
    }
  });

  call.on('error', e => {
    const current = VOICE.peers.get(peerId);
    if(current && current.call === call) current._calling = false;
  });
}

function updateVoiceProximity(dt){
  const inGame = (match && screen === 'game' && match.players && match.players.length > 0);
  const isPlaying = (inGame && match.state === 'playing');
  let myP = null;
  if(inGame){
    if(typeof getMyPlayer === 'function') myP = getMyPlayer();
    if(!myP && NET.mySlot >= 0) myP = match.players.find(p => p.slot === NET.mySlot);
    if(!myP) myP = match.players[0];
  }
  const myPos = myP ? { x: myP.x, y: myP.y } : null;

  for(const [peerId, entry] of VOICE.peers.entries()){
    let targetVol = 0.85; // Default clear volume for menu, lobby, countdown, results

    if(isPlaying && myPos){
      let targetSlot = NET.peerSlots ? NET.peerSlots.get(peerId) : undefined;
      if(targetSlot === undefined){
        if(!NET.isHost && peerId.endsWith('-host')) targetSlot = 0;
        else if(NET.isHost){
          for(let s = 1; s < 4; s++){
            const ent = NET.hostInputs.get(s);
            if(ent && ent.owner === peerId){ targetSlot = s; break; }
          }
        }
      }

      const targetP = (targetSlot != null && targetSlot !== NET.mySlot)
        ? match.players.find(p => p.slot === targetSlot)
        : (NET.isHost ? null : match.players.find(p => p.slot === 0));

      if(targetP && myPos && targetP.x != null && myPos.x != null){
        const dx = targetP.x - myPos.x;
        const dy = targetP.y - myPos.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Near (<= 180px): 100% full volume
        // Mid (spawn/medium ~800px): ~40% volume
        // Across arena (>= 1800px): ~5-6% faint whisper (huge contrast between close and far)
        const closeRadius = 180;
        const maxDist = 2000;
        if(isNaN(dist) || dist <= closeRadius){
          targetVol = 1.0;
        } else {
          const t = clamp((dist - closeRadius) / (maxDist - closeRadius), 0, 1);
          // Steep exponential falloff (2.2 exponent): drops off quickly to a faint 5% whisper
          targetVol = 0.05 + 0.95 * Math.pow(1 - t, 2.2);
        }
      }
    }

    // Direct HTML5 Audio volume control & continuous playback watchdog
    if(entry.audioEl){
      try {
        const curV = entry.audioEl.volume;
        const nextV = curV + (targetVol - curV) * Math.min(1, dt * 14);
        entry.audioEl.volume = clamp(nextV, 0.04, 1.0);
        if(entry.audioEl.paused && entry.audioEl.srcObject){
          entry.audioEl.play().catch(()=>{});
        }
      } catch(e){}
    }

    if(entry.analyser && entry.analyserData){
      if(entry.remoteMuted){
        entry.speaking = false;
      } else {
        entry.analyser.getByteFrequencyData(entry.analyserData);
        let sum = 0;
        for(let i = 0; i < entry.analyserData.length; i++) sum += entry.analyserData[i];
        entry.speaking = (sum / entry.analyserData.length) > 13;
      }
    }
  }

  if(VOICE.analyser && VOICE.analyserData && !VOICE.muted && VOICE.enabled){
    VOICE.analyser.getByteFrequencyData(VOICE.analyserData);
    let sum = 0;
    for(let i = 0; i < VOICE.analyserData.length; i++) sum += VOICE.analyserData[i];
    VOICE.speaking = (sum / VOICE.analyserData.length) > 13;
  } else {
    VOICE.speaking = false;
  }
}

function isPlayerSpeaking(slot){
  if(!match) return false;
  if(slot === NET.mySlot){
    return !!VOICE.speaking;
  }
  for(const [peerId, entry] of VOICE.peers.entries()){
    if(entry.speaking && !entry.remoteMuted){
      let pSlot = NET.peerSlots ? NET.peerSlots.get(peerId) : undefined;
      if(pSlot === undefined){
        if(!NET.isHost && peerId.endsWith('-host')) pSlot = 0;
        else if(NET.isHost){
          for(let s = 1; s < 4; s++){
            const ent = NET.hostInputs.get(s);
            if(ent && ent.owner === peerId){ pSlot = s; break; }
          }
        }
      }
      if(pSlot === slot) return true;
    }
  }
  return false;
}

function voiceEnsurePlayback(){
  if(AC && AC.state === 'suspended') AC.resume().catch(()=>{});
  for(const entry of VOICE.peers.values()){
    if(entry.audioEl && entry.audioEl.paused && entry.audioEl.srcObject){
      entry.audioEl.play().catch(()=>{});
    }
  }
}
window.addEventListener('click', voiceEnsurePlayback, { passive: true });
window.addEventListener('keydown', voiceEnsurePlayback, { passive: true });
