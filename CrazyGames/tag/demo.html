<body>
<canvas id="g"></canvas>
<!-- Netplay join modal (only shown when clicking 'JOIN ROOM' manually) -->
<div id="netUI"><div id="netCard">
  <h2>JOIN <span>ONLINE ROOM</span></h2>

  <input id="netCode" maxlength="64" placeholder="ROOM CODE / LINK"/>
  <div class="row">

  </div>
</div></div>

<div id="cg-banners" style="position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:10;display:none;pointer-events:none">

  <div id="cg-banner-responsive" style="min-height:50px;min-width:320px;max-width:728px;width:100%;pointer-events:auto"></div>
</div>
<script>
"use strict";
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);if(r<0)r=0;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
const FT=px=>'900 '+px+'px "'+FAMILIES[fontIdx]+'",system-ui,sans-serif';
const FN=(px,w)=>(w||800)+' '+px+'px "'+FAMILIES[fontIdx]+'",system-ui,sans-serif';
const FAMILIES=['Outfit','Bebas Neue','Anton','Bangers','Black Han Sans','Luckiest Guy','Righteous','Fredoka One','Baloo 2','Nunito','Poppins','Montserrat','Titan One','Chewy','MuseoModerno','Comfortaa','Space Grotesk','Orbitron','Russo One','Staatliches'];
const PINNED_FONTIdx=8; // font #9 = Baloo 2 — pinned for CrazyGames
let fontIdx=PINNED_FONTIdx;
function cycleFont(d){ toast('Fonts locked to pinned pick #' + (PINNED_FONTIdx+1) + ' — ' + FAMILIES[PINNED_FONTIdx]); }
const INK='#141414';

const cv=document.getElementById('g'),g=cv.getContext('2d');
let CW=0,CH=0,DPR=1;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

function resize(){
  const rect = cv.getBoundingClientRect();
  CW = Math.floor(rect.width || window.innerWidth);
  CH = Math.floor(rect.height || window.innerHeight);
  const maxDpr = isTouch ? 1.5 : 2;
  DPR = Math.min(maxDpr, window.devicePixelRatio || 1);
  cv.width = Math.floor(CW * DPR);
  cv.height = Math.floor(CH * DPR);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 140));
resize();
cv.style.touchAction='none';

function getCanvasCoords(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  const scaleX = rect.width ? (CW / rect.width) : 1;
  const scaleY = rect.height ? (CH / rect.height) : 1;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function grabFocus(){try{window.focus();}catch(e){}}
window.addEventListener('load',grabFocus);grabFocus();

/* ================= input ================= */
const keys=new Set(),pressed=new Set();
const GAMEKEYS=new Set([
  'ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD',
  'Enter','NumpadEnter','KeyM','KeyP','KeyN','KeyB','Digit1','Digit2','Digit3','Digit4',
  'Digit5','Digit6','Digit7','Digit8','Digit9','Digit0'
]);
function onKey(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(e.repeat)return;
  keys.add(e.code);pressed.add(e.code);initAudio();
}
window.addEventListener('keydown',onKey);
document.addEventListener('keydown',onKey);
window.addEventListener('keyup',e=>keys.delete(e.code));
document.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();touchPts.clear();});
window.addEventListener('contextmenu',e=>e.preventDefault());
const anyPressed=list=>{for(const k of list)if(pressed.has(k))return true;return false;};

/* ================= mobile touch action state ================= */
const TOUCH = {
  left: false,
  right: false,
  jumpEdge: false,
  jumpHeld: false,
  downHeld: false
};

/* ================= mobile touch joystick & dual slider system ================= */
const JOY = {
  // Left horizontal joystick (snaps to center)
  leftId: null,
  leftX: 0,        // -1 (left) to +1 (right), rests at 0 (center)
  leftVisX: 0,     // smooth interpolated visual knob position
  boundsL: null,   // { x, y, w, h, cx, cy, maxTravel, r }

  // Right vertical dual jump/drop slider (snaps to top)
  rightId: null,
  rightY: 0,       // 0 (top/rest) to 1 (pulled down)
  rightVisY: 0,    // smooth interpolated visual knob position
  rightStartY: 0,  // touch start Y to detect downward drag immediately
  boundsR: null    // { x, y, w, h, cx, cyTop, maxTravel, r }
};

/* ================= 2-player local mobile controls (Ergonomic Joysticks + Fixed Buttons) ================= */
const LOCAL_TOUCH = {
  showTutorial: false,
  p1: { joyId: null, startX: 0, startY: 0, curX: 0, curY: 0, active: false, offX: 0, visOffX: 0, left: false, right: false, jumpId: null, jumpHeld: false, jumpEdge: false, dropId: null, downHeld: false },
  p2: { joyId: null, startX: 0, startY: 0, curX: 0, curY: 0, active: false, offX: 0, visOffX: 0, left: false, right: false, jumpId: null, jumpHeld: false, jumpEdge: false, dropId: null, downHeld: false }
};
const GESTURE_SPLIT = LOCAL_TOUCH; // Backward compatibility alias

function calcLocalBounds(){
  const midX = CW / 2;
  const isTablet = (Math.min(CW, CH) >= 500);
  const r = isTablet ? clamp(CH * 0.065, 24, 32) : clamp(CH * 0.080, 22, 28);
  const bm = isTablet ? clamp(CH * 0.07, 24, 42) : clamp(CH * 0.06, 16, 26);
  const maxTravel = r * 1.45;
  const trackW = r * 3.4;
  const trackH = r * 2.0;

  // Corner positioning:
  // Player 1 (Bottom-Left Corner): Joystick at far left, Jump & Drop buttons shifted right by ~1 button diameter for comfortable thumb spacing
  const p1CornerPad = isTablet ? clamp(CW * 0.045, 24, 44) : clamp(CW * 0.040, 16, 28);
  const p1DefJoyX = p1CornerPad + trackW / 2;
  const p1DefJoyY = CH - bm - r * 1.05;
  const p1BtnX = p1DefJoyX + trackW / 2 + r * 3.30;
  const p1DropY = p1DefJoyY;
  const p1JumpY = p1DropY - r * 2.15;
  const p1SplitY = (p1JumpY + p1DropY) / 2;
  const p1BtnMinX = p1BtnX - r * 1.15;
  const p1BtnMaxX = p1BtnX + r * 1.45;
  const p1BtnMinY = p1JumpY - r * 1.35;
  const p1BtnMaxY = p1DropY + r * 1.35;

  // Player 2 (Bottom-Right Corner): Jump & Drop buttons at far right, Joystick shifted left towards center by the same gap
  const p2CornerPad = isTablet ? clamp(CW * 0.045, 24, 44) : clamp(CW * 0.040, 16, 28);
  const p2BtnX = CW - p2CornerPad - r * 1.15;
  const p2DefJoyX = p2BtnX - r * 3.30 - trackW / 2;
  const p2DefJoyY = CH - bm - r * 1.05;
  const p2DropY = p2DefJoyY;
  const p2JumpY = p2DropY - r * 2.15;
  const p2SplitY = (p2JumpY + p2DropY) / 2;
  const p2BtnMinX = p2BtnX - r * 1.15;
  const p2BtnMaxX = p2BtnX + r * 1.45;
  const p2BtnMinY = p2JumpY - r * 1.35;
  const p2BtnMaxY = p2DropY + r * 1.35;

  return {
    midX, r, bm, maxTravel, trackW, trackH,
    p1: { btnX: p1BtnX, jumpY: p1JumpY, dropY: p1DropY, splitY: p1SplitY, btnMinX: p1BtnMinX, btnMaxX: p1BtnMaxX, btnMinY: p1BtnMinY, btnMaxY: p1BtnMaxY, defJoyX: p1DefJoyX, defJoyY: p1DefJoyY },
    p2: { btnX: p2BtnX, jumpY: p2JumpY, dropY: p2DropY, splitY: p2SplitY, btnMinX: p2BtnMinX, btnMaxX: p2BtnMaxX, btnMinY: p2BtnMinY, btnMaxY: p2BtnMaxY, defJoyX: p2DefJoyX, defJoyY: p2DefJoyY }
  };
}

function applyTouchAction(action, isDown){
  if(action === 'left') TOUCH.left = !!isDown;
  else if(action === 'right') TOUCH.right = !!isDown;
  else if(action === 'jump'){
    if(isDown){ TOUCH.jumpEdge = true; TOUCH.jumpHeld = true; }
    else TOUCH.jumpHeld = false;
  } else if(action === 'down') TOUCH.downHeld = !!isDown;
}

/* ================= gamepads ================= */
const GP={prev:[{},{},{},{}],prevAx:[0,0,0,0],prevAy:[0,0,0,0]};
let PAD=[null,null,null,null];
function pollGamepads(){
  const rawPads=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<4;i++){
    const gd=rawPads[i];
    if(!gd||!gd.connected){PAD[i]=null;continue;}
    const b=n=>gd.buttons[n]&&(typeof gd.buttons[n]==='object'?gd.buttons[n].pressed:gd.buttons[n]>0.5);
    const pv=GP.prev[i]||{};
    const E=n=>b(n)&&!pv[n];
    const ax=gd.axes[0]||0,ay=gd.axes[1]||0;
    const pax=GP.prevAx[i]||0,pay=GP.prevAy[i]||0;
    const left=ax<-0.30||b(14),right=ax>0.30||b(15),up=ay<-0.50||b(12),down=ay>0.50||b(13);
    PAD[i]={
      left,right,up,down,
      leftE:(left&&!(pax<-0.30||pv[14]))||E(14),
      rightE:(right&&!(pax>0.30||pv[15]))||E(15),
      upE:(up&&!(pay<-0.50||pv[12]))||E(12),
      downE:(down&&!(pay>0.50||pv[13]))||E(13),
      jumpE:E(0),
      jumpHeld:!!b(0),
      confirmE:E(0)||E(2)||E(9),
      pauseE:E(9),
      dropHeld:b(1)||down,
      connected:true
    };
    const np={};for(let n=0;n<17;n++)np[n]=b(n);
    GP.prev[i]=np;
    GP.prevAx[i]=ax;
    GP.prevAy[i]=ay;
  }
}

/* ================= touch zones ================= */
const zones=[];const touchPts=new Map();const glow={};
function zone(x,y,w,h,o){
  zones.push({
    x:x,y:y,w:w,h:h,
    press:(o&&o.press)||null,
    hold:(o&&o.hold)||null,
    fn:(o&&o.fn)||null,
    upFn:(o&&o.upFn)||null,
    touchAction:(o&&o.touchAction)||null
  });
}
function zoneAt(x,y,holdOnly){
  for(let i=zones.length-1;i>=0;i--){const z=zones[i];
    if(holdOnly&&!z.hold&&!z.touchAction)continue;
    if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h)return z;}
  return null;
}
function inputDown(x,y,id){
  initAudio();grabFocus();
  
  // Tutorial Card dismiss for 2-Player Local Touch
  if(match && screen === 'game' && GESTURE_SPLIT.showTutorial){
    GESTURE_SPLIT.showTutorial = false;
    if(match.state === 'tutorial'){
      match.state = 'countdown';
      match.cd = 3;
      match.cdT = 0;
      sfx('count');
    }
    return;
  }

  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isPlaying = (match && (match.state === 'playing' || match.state === 'countdown'));
  const isSplitLocal = (!isOnline && match && screen === 'game' && isPlaying && match.players && match.players.length === 2 && isTouch);

  // Allow HUD top bar buttons (Pause, Mute, Help) to receive clicks
  if(y <= 55){
    const z = zoneAt(x,y,false);
    if(z){
      touchPts.set(id,z);
      if(z.hold){keys.add(z.hold);}
      if(z.press){for(const c of z.press){pressed.add(c);glow[c]=tGlobal;}}
      if(z.touchAction){applyTouchAction(z.touchAction,true);}
      if(z.fn)z.fn();
      return;
    }
  }

  // 2-Player Local Shared Screen Touch Controls (Fixed Jump/Drop + Floating Side-to-Side Joystick)
  if(isSplitLocal){
    const b = calcLocalBounds();

    if(x < b.midX){
      // --- Player 1 (Left Half) ---
      const p = LOCAL_TOUCH.p1;
      // Check if touch lands in P1's fixed button zone (right side of P1 cluster)
      if(x >= b.p1.btnMinX && x <= b.p1.btnMaxX && y >= b.p1.btnMinY && y <= b.p1.btnMaxY){
        if(y < b.p1.splitY){
          // P1 JUMP BUTTON
          p.jumpId = id;
          p.jumpEdge = true;
          p.jumpHeld = true;
          p.downHeld = false;
          const myP = match.players[0];
          if(myP) myP.jbuf = 0.16;
        } else {
          // P1 DROP BUTTON
          p.dropId = id;
          p.downHeld = true;
          p.jumpEdge = false;
          p.jumpHeld = false;
          const myP = match.players[0];
          if(myP && myP.jbuf > 0) myP.jbuf = 0;
        }
        return;
      }
      // Floating Side-to-Side Joystick anywhere else in P1 half!
      p.joyId = id;
      p.startX = x;
      p.startY = y;
      p.curX = x;
      p.curY = y;
      p.active = true;
      p.offX = 0;
      p.left = false;
      p.right = false;
      return;
    } else {
      // --- Player 2 (Right Half) ---
      const p = LOCAL_TOUCH.p2;
      // Check if touch lands in P2's fixed button zone (right side of P2 cluster)
      if(x >= b.p2.btnMinX && x <= b.p2.btnMaxX && y >= b.p2.btnMinY && y <= b.p2.btnMaxY){
        if(y < b.p2.splitY){
          // P2 JUMP BUTTON
          p.jumpId = id;
          p.jumpEdge = true;
          p.jumpHeld = true;
          p.downHeld = false;
          const myP = match.players[1];
          if(myP) myP.jbuf = 0.16;
        } else {
          // P2 DROP BUTTON
          p.dropId = id;
          p.downHeld = true;
          p.jumpEdge = false;
          p.jumpHeld = false;
          const myP = match.players[1];
          if(myP && myP.jbuf > 0) myP.jbuf = 0;
        }
        return;
      }
      // Floating Side-to-Side Joystick anywhere else in P2 half!
      p.joyId = id;
      p.startX = x;
      p.startY = y;
      p.curX = x;
      p.curY = y;
      p.active = true;
      p.offX = 0;
      p.left = false;
      p.right = false;
      return;
    }
  }

  // Check Left horizontal joystick (Solo / Online)
  if(match && screen === 'game' && isPlaying && isTouch && JOY.boundsL){
    const b = JOY.boundsL;
    if(x >= b.x - 24 && x <= b.x + b.w + 24 && y >= b.y - 24 && y <= b.y + b.h + 24){
      JOY.leftId = id;
      const off = clamp((x - b.cx) / b.maxTravel, -1, 1);
      JOY.leftX = off;
      TOUCH.left = (off < -0.22);
      TOUCH.right = (off > 0.22);
      return;
    }
  }
  // Check Right vertical dual jump/drop slider (Solo / Online)
  if(match && screen === 'game' && isPlaying && isTouch && JOY.boundsR){
    const b = JOY.boundsR;
    if(x >= b.x - 24 && x <= b.x + b.w + 24 && y >= b.y - 24 && y <= b.y + b.h + 24){
      JOY.rightId = id;
      JOY.rightStartY = y;
      const off = clamp((y - b.cyTop) / b.maxTravel, 0, 1);
      JOY.rightY = off;
      
      // If touch starts on or near the drop zone (off > 0.22 or y > b.cyTop + 14) -> DROP ONLY, NEVER JUMP!
      if(off > 0.22 || y > b.cyTop + 14){
        TOUCH.downHeld = true;
        TOUCH.jumpEdge = false;
        TOUCH.jumpHeld = false;
        const myP = getMyPlayer();
        if(myP && myP.jbuf > 0) myP.jbuf = 0;
      } else {
        // Touching the top knob (JUMP ZONE)
        TOUCH.downHeld = false;
        TOUCH.jumpEdge = true;
        TOUCH.jumpHeld = true;
      }
      return;
    }
  }
  const z=zoneAt(x,y,false);
  if(z){
    touchPts.set(id,z);
    if(z.hold){keys.add(z.hold);}
    if(z.press){for(const c of z.press){pressed.add(c);glow[c]=tGlobal;}}
    if(z.touchAction){applyTouchAction(z.touchAction,true);}
    if(z.fn)z.fn();
  }
}
function inputMove(x,y,id){
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isPlaying = (match && (match.state === 'playing' || match.state === 'countdown'));
  const isSplitLocal = (!isOnline && match && screen === 'game' && isPlaying && match.players && match.players.length === 2 && isTouch);
  if(isSplitLocal){
    const b = calcLocalBounds();
    // P1 Joystick
    if(LOCAL_TOUCH.p1.joyId === id){
      const p = LOCAL_TOUCH.p1;
      p.curX = x; p.curY = y;
      const dx = x - p.startX;
      p.offX = clamp(dx / b.maxTravel, -1, 1);
      p.left = (p.offX < -0.22);
      p.right = (p.offX > 0.22);
      return;
    }
    // P2 Joystick
    if(LOCAL_TOUCH.p2.joyId === id){
      const p = LOCAL_TOUCH.p2;
      p.curX = x; p.curY = y;
      const dx = x - p.startX;
      p.offX = clamp(dx / b.maxTravel, -1, 1);
      p.left = (p.offX < -0.22);
      p.right = (p.offX > 0.22);
      return;
    }
    // Retain button hold as long as finger is reasonably close

      return;
    }
    if(LOCAL_TOUCH.p1.dropId === id){
      LOCAL_TOUCH.p1.downHeld = (Math.hypot(x - b.p1.btnX, y - b.p1.dropY) < b.r * 3.0 || (x >= b.p1.btnMinX - 30 && y >= b.p1.splitY - 20));
      return;
    }
    if(LOCAL_TOUCH.p2.jumpId === id){
      LOCAL_TOUCH.p2.jumpHeld = (Math.hypot(x - b.p2.btnX, y - b.p2.jumpY) < b.r * 3.0 || (x >= b.p2.btnMinX - 30 && y < b.p2.splitY + 20));

      return;

    return;
  }

  if(JOY.rightId === id && JOY.boundsR){
    const b = JOY.boundsR;

    const z=zoneAt(x,y,true);

      if(cur&&cur.hold)keys.delete(cur.hold);

      if(z&&z.hold)keys.add(z.hold);

function inputUp(id){
  // P1 Local Touch Reset
  if(LOCAL_TOUCH.p1.joyId === id){
    const p = LOCAL_TOUCH.p1;
    p.joyId = null;
    p.active = false;
    p.offX = 0;
    p.left = false;
    p.right = false;
  }
  if(LOCAL_TOUCH.p1.jumpId === id){
    LOCAL_TOUCH.p1.jumpId = null;
    LOCAL_TOUCH.p1.jumpHeld = false;
    LOCAL_TOUCH.p1.jumpEdge = false;
  }
  if(LOCAL_TOUCH.p1.dropId === id){
    LOCAL_TOUCH.p1.dropId = null;
    LOCAL_TOUCH.p1.downHeld = false;
  }
  // P2 Local Touch Reset
  if(LOCAL_TOUCH.p2.joyId === id){
    const p = LOCAL_TOUCH.p2;
    p.joyId = null;
    p.active = false;
    p.offX = 0;
    p.left = false;
    p.right = false;
  }
  if(LOCAL_TOUCH.p2.jumpId === id){
    LOCAL_TOUCH.p2.jumpId = null;
    LOCAL_TOUCH.p2.jumpHeld = false;
    LOCAL_TOUCH.p2.jumpEdge = false;
  }
  if(LOCAL_TOUCH.p2.dropId === id){
    LOCAL_TOUCH.p2.dropId = null;
    LOCAL_TOUCH.p2.downHeld = false;
  }

  if(JOY.leftId === id){
    JOY.leftId = null;
    JOY.leftX = 0; // Snaps back to center!
    TOUCH.left = false;
    TOUCH.right = false;
  }
  if(JOY.rightId === id){
    JOY.rightId = null;
    JOY.rightY = 0; // Snaps back to top!
    TOUCH.jumpHeld = false;
    TOUCH.downHeld = false;
    TOUCH.jumpEdge = false;
  }
  const z=touchPts.get(id);
  if(z){
    if(z.hold)keys.delete(z.hold);
    if(z.touchAction)applyTouchAction(z.touchAction,false);
    if(z.upFn)z.upFn();
  }
  touchPts.delete(id);
}

function beep(f0,f1,dur,type,vol,delay){
  if(!AC||!master)return;type=type||'square';vol=vol||0.16;delay=delay||0;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn);gn.connect(master);o.start(t0);o.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol,delay){
  if(!AC||!master)return;delay=delay||0;
  const t0=AC.currentTime+delay,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource();src.buffer=buf;
  const gn=AC.createGain();gn.gain.value=vol;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1100;
  src.connect(fl);fl.connect(gn);gn.connect(master);src.start(t0);
}

    const list = pList || (match ? match.players : []);
    const mates = list.filter(o => o.team === p.team);
    const rank = Math.max(0, mates.findIndex(o => o.slot === p.slot));
    return teamDef.shades[rank % teamDef.shades.length] || teamDef.base;

/* Custom maps from tag_map_editor.html override the built-ins (same browser).
   Editor saves to 'tag_arena_custom_maps_v1'; invalid saves are ignored safely. */
function syncCustomMaps(){
  try{
    const raw=localStorage.getItem('tag_arena_custom_maps_v1');
    if(!raw)return;
    const a=JSON.parse(raw);
    if(!Array.isArray(a)||!a.length)return;
    const ok=a.every(m=>m&&typeof m.name==='string'&&['solids','speeds','drops','boosts'].every(k=>
      Array.isArray(m[k])&&m[k].every(p=>Array.isArray(p)&&p.length>=4&&p.slice(0,4).every(Number.isFinite))));
    if(ok&&a.length<=40)MAPS.splice(0,MAPS.length,...a);
  }catch(e){/* keep built-in maps */}
}
function buildLevel(){
  const M=MAPS[settings.map%MAPS.length];
  SOLIDS=[
    {x:0,y:0,w:W,h:WALL,t:'solid',wall:1},{x:0,y:H-WALL,w:W,h:WALL,t:'solid',wall:1},
    {x:0,y:0,w:WALL,h:H,t:'solid',wall:1},{x:W-WALL,y:0,w:WALL,h:H,t:'solid',wall:1}
  ];
  /* All horizontal platforms are normalized to player height (46px); tops stay put so jump gaps never change */
  const P46=a=>({x:a[0],y:a[1],w:a[2],h:(a[3]<=32?46:a[3]),dy:a[4]||0});
  for(const a of M.solids){const p=P46(a);p.t='solid';SOLIDS.push(p);}
  for(const a of M.speeds){const p=P46(a);p.t='speed';SOLIDS.push(p);}
  for(const a of M.drops){const p=P46(a);p.t='drop';SOLIDS.push(p);}
  for(const a of M.boosts){const p=P46(a);p.t='boost';SOLIDS.push(p);}
}

function tagBurst(x,y,c1,c2){
  for(let i=0;i<26;i++){const a=rand(TAU),s=rand(120,420);addP({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.35,0.7),max:0.7,size:rand(3,7),col:i%3===0?'#ffffff':(i%2?c1:c2),grav:600,shape:i%4===0?1:0,rot:rand(TAU),vr:rand(-8,8)});}
}
function confetti(){
  for(let i=0;i<150;i++)addP({x:rand(WALL+40,W-WALL-40),y:rand(70,320),vx:rand(-130,130),vy:rand(-80,140),life:rand(1.6,2.8),max:2.8,size:rand(5,9),col:PALETTE[Math.floor(rand(PALETTE.length))].c,grav:520,shape:1,rot:rand(TAU),vr:rand(-7,7)});
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||0)*dt;
    if(p.vr)p.rot+=p.vr*dt;
  }
}
function drawParts(){
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    g.globalAlpha=a;
    if(p.shape===1){g.save();g.translate(p.x,p.y);g.rotate(p.rot||0);g.fillStyle=p.col;g.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.7);g.restore();}
    else{g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.size,0,TAU);g.fill();}
  }
  g.globalAlpha=1;
}

  updateThemeGradients();

/* ================= PHYSICS: RELIABLE PINK DROP/JUMP-THROUGH & AIRTIGHT SOLIDS ================= */
function hitRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hitRectInclusive(a,b){return a.x<=b.x+b.w&&a.x+a.w>=b.x&&a.y<=b.y+b.h&&a.y+a.h>=b.y;}

function zoneAtFeet(p,type){
  const feet=p.y+p.h;
  for(const s of SOLIDS){
    if(s.t!==type)continue;
    if(!s.dy){
      if(feet>=s.y-6&&feet<=s.y+18&&p.x+p.w>s.x&&p.x<s.x+s.w)return s;
    }else{
      const px=clamp(p.x+p.w/2,s.x,s.x+s.w);
      const sy=s.y+(px-s.x)*(s.dy/s.w);
      if(feet>=sy-8&&feet<=sy+20)return s;
    }
  }
  return null;
}

function landOn(p,gp,impact,wasG){
  p.grounded=true;p.gp=gp;p.lastGp=gp;p.airJumps=settings.doubleJump?1:0;p.wallJumps=0;
  // Subtle squash on landing — scaled down ~50% so it reads as weight, not a gag.
  if(!wasG){
    if(impact>430){p.sy=0.87;p.sx=1.13;p.landT=0.12;sfx('land');dust(p.x+p.w/2,p.y+p.h,8,90);}
    else if(impact>140){p.sy=0.93;p.sx=1.07;}
  }
}
/* ================= TRIAL BOT: P2 chase/flee + anti-stuck =================
   v1 rules: greedy X + jump only if no solid between, detour to platform
   edge when blocked above, bonk counter fallback. Pink drops are
   jump-through (ok to jump), solids are not. */
const BOT={st:{},think:0.09};
function botReset(){BOT.st={};}
function isBotSlot(p){
  try{
    if(typeof DEMO!=='undefined'&&DEMO.active)return false;
    if(typeof NET!=='undefined'&&NET&&NET.role!==null)return false;
    if(!menu.botOn)return false;
    if(!match||!match.players||match.players.length!==2)return false;
    if(activeSlots().length!==2)return false;
    return p.slot===1;
  }catch(e){return false;}
}
function botSolidBetween(ax,ay,bx,by,ignorePlat){
  // sample line head->target, blocked by solid/speed/boost (NOT pink drop,
  // NOT the platform passed as ignorePlat - kills slope self-hits)
  for(let i=1;i<7;i++){
    const t=i/7,px=ax+(bx-ax)*t,py=ay+(by-ay)*t;
    const pt={x:px-2,y:py-2,w:4,h:4};
    for(const s of SOLIDS){
      if(s.t==='drop'||s===ignorePlat)continue;
      if(hitRect(pt,s))return s;
    }
  }
  return null;
}
function botGroundAhead(p,dir){
  if(!dir)return true;
  const ax=p.x+p.w/2+dir*80,feet=p.y+p.h;
  for(const s of SOLIDS){
    if(ax>=s.x-12&&ax<=s.x+s.w+12&&feet>=s.y-42&&feet<=s.y+24)return true;
    if(s.dy){ // slope: check top at ax
      if(ax>=s.x-12&&ax<=s.x+s.w+12){
        const sy=s.y+(clamp(ax,s.x,s.x+s.w)-s.x)*(s.dy/s.w);
        if(feet>=sy-42&&feet<=sy+24)return true;
      }
    }
  }
  return false;
}
function botWallAhead(p,dir){
  if(!dir)return false;
  const wx=p.x+(dir>0?p.w+14:-14);
  const probe={x:wx-4,y:p.y+8,w:8,h:p.h-16};
  for(const s of SOLIDS){
    if(s.t==='drop')continue;
    if(hitRect(probe,s))return true;
  }
  return false;
}

function getPlatformNode(p){
  const nodes = (typeof demoNodes === 'function') ? demoNodes() : [];
  if(!nodes || !nodes.length) return -1;
  if(p.grounded && p.gp && !p.gp.wall){
    const idx = nodes.indexOf(p.gp);
    if(idx >= 0) return idx;
  }
  const feetY = p.y + p.h;
  if(feetY >= 1240){
    const cx = p.x + p.w / 2;
    if(cx < 570) return 24;
    if(cx > 1830) return 25;
    return 15;
  }
  let bestIdx = -1, bestDist = 1e9;
  const cx = p.x + p.w / 2;
  for(let i = 0; i < nodes.length; i++){
    const s = nodes[i];
    const dx = Math.max(0, s.x - (p.x + p.w), p.x - (s.x + s.w));
    const dy = Math.abs(feetY - s.y);
    const d = dx * dx + dy * dy;
    if(d < bestDist){ bestDist = d; bestIdx = i; }
  }
  return bestIdx;
}

function botInputFor(p){
  let S = BOT.st[p.slot];
  if(!S){
    S = BOT.st[p.slot] = {
      dir: 0, jumpQ: false, jumpHoldT: 0, decideT: 0,
      px: p.x, py: p.y, stuckT: 0, unstuckT: 0, unstuckDir: 0,
      currHop: -1, hopPhase: 'run', djTimer: 0, djDone: false,
      wantDown: false
    };
  }
  const dt = Math.min(0.033, 1/60);
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;

  let target = null;
  try {
    const itP = match.players[match.it];
    if(itP === p){
      let best = 1e12;
      for(const o of match.players){
        if(o === p) continue;
        const d = (o.x - p.x) * (o.x - p.x) + (o.y - p.y) * (o.y - p.y);
        if(d < best){ best = d; target = o; }
      }
    } else {
      target = itP;
    }
  } catch(e){}
  if(!target) return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };

  const isIt = (match.players[match.it] === p);
  const tx = target.x + target.w / 2, ty = target.y + target.h / 2;
  const dx = tx - cx, dy = ty - cy;

  const moved = Math.hypot(p.x - S.px, p.y - S.py);
  if(Math.hypot(dx, dy) > 80 && moved < 10){ S.stuckT += dt; } else { S.stuckT = 0; }
  S.px = p.x; S.py = p.y;

  if(S.stuckT > 0.55 && S.unstuckT <= 0){
    S.unstuckT = 0.45;
    S.unstuckDir = (S.dir !== 0 ? -S.dir : (Math.random() < 0.5 ? -1 : 1));
    S.stuckT = 0;
    S.currHop = -1;
  }
  if(S.unstuckT > 0){
    S.unstuckT -= dt;
    const canJ = p.grounded || p.airJumps > 0;
    if(canJ){ S.jumpQ = true; S.jumpHoldT = 0.12; }
    let uh = !!S.jumpQ || S.jumpHoldT > 0;
    if(S.jumpHoldT > 0) S.jumpHoldT -= dt;

  }

      const nodes = demoNodes();
      let maxDist = -1, bestFlee = tgtNode;
      for(let i = 0; i < nodes.length; i++){
        const d = Math.hypot((nodes[i].x + nodes[i].w / 2) - tx, nodes[i].y - ty);
        if(d > maxDist){ maxDist = d; bestFlee = i; }

      if(Math.hypot(dx, dy) < 420){

      }

    if(botNode >= 0 && botNode === tgtNode){
      S.currHop = -1;
      let want = isIt ? (Math.sign(dx) || 0) : (-Math.sign(dx) || 1);
      if(!isIt){
        if(p.x < WALL + 70 && want < 0) want = 1;
        if(p.x + p.w > W - WALL - 70 && want > 0) want = -1;
      }
      S.dir = want;
      S.wantDown = false;
      if(dy < -30 && (p.grounded || p.airJumps > 0)){
        S.jumpQ = true;
        S.jumpHoldT = 0.12;
      }
    } else if(botNode >= 0 && tgtNode >= 0){
      const nextHop = MAP0_GRAPH.nextHop[botNode][tgtNode];
      if(nextHop >= 0 && nextHop !== botNode){
        const edgeKey = botNode + '->' + nextHop;
        const edge = MAP0_GRAPH.edges[edgeKey];
        if(edge){

              S.wantDown = false;
            } else {
              if(edge.act === 'jump' || edge.act === 'double'){
                S.jumpQ = true;
                S.jumpHoldT = 0.12;
                S.hopPhase = 'air';
                S.dir = Math.sign(edge.tx - cx) || Math.sign(dLx) || 1;
                S.wantDown = false;
              } else if(edge.act === 'drop'){
                S.wantDown = true;
                S.hopPhase = 'drop';
                S.dir = Math.sign(edge.tx - cx);
              } else {
                S.dir = Math.sign(edge.tx - cx) || 1;
                S.wantDown = false;
                S.hopPhase = 'air';
              }
            }
          } else {
            S.wantDown = (edge.act === 'drop');
            const dTx = edge.tx - cx;
            if(Math.abs(dTx) > 16) S.dir = Math.sign(dTx); else S.dir = 0;

            if(edge.act === 'double' && !S.djDone && p.airJumps > 0){
              if(S.djTimer > 0) S.djTimer -= dt;
              if(S.djTimer <= 0 || p.vy > -80){
                S.jumpQ = true;
                S.jumpHoldT = 0.12;
                S.djDone = true;
              }
            }
          }
        }
      }
    }
  } else {
    let want = isIt ? (Math.sign(dx) || 0) : (-Math.sign(dx) || 1);
    S.dir = want;
    if(dy < -40 && (p.grounded || p.airJumps > 0)){ S.jumpQ = true; S.jumpHoldT = 0.12; }
    S.wantDown = (dy > 60 && zoneAtFeet(p, 'drop'));
  }

  const j = S.jumpQ; S.jumpQ = false;
  if(j) S.jumpHoldT = 0.12;
  let hold = !!j;
  if(S.jumpHoldT > 0){ S.jumpHoldT -= dt; hold = true; }
  return { dir: clamp(S.dir || 0, -1, 1), jumpEdge: !!j, jumpHeld: hold, downHeld: !!S.wantDown };
}
/* ================= DEMO DATA COLLECTION (?demo=N) =================
   Human drives P1 (WASD). Spawn on platform A, reach glowing B.
   Warm-up case first, then every ordered pair on the map, REPS each.
   Timeout (par) = redo the case. X = skip, Z = save now. */
const DEMO={active:false,map:0,nodes:[],cases:[],warm:null,phase:'idle',ci:0,rep:0,
  t:0,par:10,holdT:0,started:false,fails:0,trace:[],traceN:0,results:[],
  sent:0,part:1,done:0,okN:0};
const DEMO_REPS=2,DEMO_TRACE_EVERY=3;
function demoNodes(){
  const r=[];
  for(const s of SOLIDS){
    if(!s.wall && !(s.w < 60 && s.h > s.w * 1.5)) r.push(s);
  }
  return r;
}
function demoSlabTop(s,x){
  const px=clamp(x,s.x,s.x+s.w);
  return s.y+((s.dy||0)?(px-s.x)*(s.dy/s.w):0);
}
function demoSpawn(p,s){
  const cxp=s.x+s.w/2;
  p.x=Math.round(cxp-p.w/2);p.y=Math.round(demoSlabTop(s,cxp)-p.h-2);
  p.vx=0;p.vy=0;p.grounded=true;p.gp=s;p.lastGp=s;
  p.airJumps=settings.doubleJump?1:0;p.wallJumps=0;p.coyote=0;p.jbuf=0;
  p.holdT=0;p.dropT=0;p.sideT=0;p.face=1;
}
function demoFeetOn(p,s){
  const feet=p.y+p.h;
  if(!s.dy){if(feet<s.y-10||feet>s.y+22)return false;}
  else{const top=demoSlabTop(s,p.x+p.w/2);if(feet<top-12||feet>top+24)return false;}
  return(p.x+8<s.x+s.w)&&(p.x+p.w-8>s.x);
}
function demoBuildCases(){
  DEMO.nodes=demoNodes();
  const N=DEMO.nodes.length;
  let low=0;
  for(let i=0;i<N;i++){if(DEMO.nodes[i].y>DEMO.nodes[low].y)low=i;}
  let best=-1,bd=1e12;
  for(let i=0;i<N;i++){
    if(i===low)continue;
    const a=DEMO.nodes[low],b=DEMO.nodes[i];
    if(b.y<a.y-120){
      const d=Math.hypot((b.x+b.w/2)-(a.x+a.w/2),b.y-a.y);
      if(d<bd){bd=d;best=i;}
    }
  }
  if(best<0)best=(low+1)%N;
  DEMO.warm={from:low,to:best};
  const pairs=[];
  for(let a=0;a<N;a++){
    for(let b=0;b<N;b++){
      if(a===b)continue;
      const A=DEMO.nodes[a], B=DEMO.nodes[b];
      const acx = A.x + A.w/2, bcx = B.x + B.w/2;
      const dx = Math.abs(acx - bcx);
      const dy = A.y - B.y; // positive if B is above A
      // Filter plausible pairs:
      // If jumping up: max vertical rise 520px, horizontal reach 750px
      if(dy > 0 && (dy > 520 || dx > 750)) continue;
      // If dropping down or level: horizontal reach 850px
      if(dy <= 0 && dx > 850) continue;
      pairs.push([a,b]);
    }
  }
  for(let i=pairs.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=pairs[i];pairs[i]=pairs[j];pairs[j]=t;}
  DEMO.cases=pairs;
}
function demoPar(a,b){
  const A=DEMO.nodes[a],B=DEMO.nodes[b];
  const d=Math.hypot((A.x+A.w/2)-(B.x+B.w/2),A.y-B.y);
  return clamp(d/504*3+2.5,5,25);
}
function demoCur(){return DEMO.phase==='warm'?DEMO.warm:{from:DEMO.cases[DEMO.ci][0],to:DEMO.cases[DEMO.ci][1]};}
function demoPlace(){
  const c=demoCur(),pl=match.players[0];
  demoSpawn(pl,DEMO.nodes[c.from]);
  const dp=match.players[1];
  if(dp){dp.x=WALL+10;dp.y=H-WALL-dp.h;dp.vx=0;dp.vy=0;}
  DEMO.par=demoPar(c.from,c.to);
  DEMO.t=0;DEMO.holdT=0;DEMO.started=false;DEMO.fails=0;DEMO.trace=[];DEMO.traceN=0;
}
function demoRecord(outcome,time){
  const c=demoCur();
  let jumps=0;
  for(const e of DEMO.trace){if(e.je)jumps++;}
  DEMO.results.push({map:DEMO.map,from:c.from,to:c.to,rep:DEMO.rep,outcome:outcome,
    time:+time.toFixed(2),jumps:jumps,trace:DEMO.trace});
  DEMO.trace=[];
  if(outcome==='ok')DEMO.okN++;
  demoSaveProgress();
  if(DEMO.results.length%25===0)demoDownload(false);
}
function demoAdvance(){
  DEMO.rep=0;DEMO.done++;
  if(DEMO.phase==='warm')DEMO.phase='full';
  else DEMO.ci++;
  if(DEMO.phase==='full'&&DEMO.ci>=DEMO.cases.length){demoFinish();return;}
  demoPlace();
}
function demoFinish(){
  DEMO.phase='done';
  demoDownload(true);
  try{toast('DEMO COMPLETE  '+DEMO.done+' cases, '+DEMO.okN+' clean');}catch(e){}
}
function demoPushTrace(p,inp){
  if(!DEMO.started)return;
  if((DEMO.traceN++%DEMO_TRACE_EVERY)!==0)return;
  DEMO.trace.push({t:+DEMO.t.toFixed(2),x:Math.round(p.x),y:Math.round(p.y),
    vx:Math.round(p.vx),vy:Math.round(p.vy),d:inp.dir,je:inp.jumpEdge?1:0,
    jh:inp.jumpHeld?1:0,dn:inp.downHeld?1:0,g:p.grounded?1:0});
}
function demoSaveProgress(){
  try{
    const oc=[];
    for(const r of DEMO.results)oc.push({f:r.from,t:r.to,r:r.rep,o:r.outcome[0],s:r.time});
    localStorage.setItem('tag_demo_prog_v1',JSON.stringify({map:DEMO.map,phase:DEMO.phase,
      ci:DEMO.ci,rep:DEMO.rep,done:DEMO.done,okN:DEMO.okN,part:DEMO.part,outcomes:oc}));
  }catch(e){}
}
function demoDownload(manual){
  try{
    const batch=DEMO.results.slice(DEMO.sent);
    if(!batch.length&&!manual)return;
    const blob=new Blob([JSON.stringify({game:'tag-demo',map:DEMO.map,part:DEMO.part,rows:batch})],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='tag-demo-map'+DEMO.map+'-p'+(DEMO.part++)+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(a.href);a.remove();}catch(e){}},800);
    DEMO.sent=DEMO.results.length;
    for(const r of batch)r.trace=null;
    demoSaveProgress();
    if(manual)try{toast('Saved '+batch.length+' demos');}catch(e){}
  }catch(e){}
}
function demoStart(){
  DEMO.active=true;DEMO.map=settings.map;
  demoBuildCases();
  menu.botOn=false;
  menu.slotColor=[0,1,-1,-1,-1,-1,-1,-1];
  DEMO.results=[];DEMO.sent=0;DEMO.part=1;DEMO.done=0;DEMO.okN=0;
  DEMO.phase='warm';DEMO.ci=0;DEMO.rep=0;
  try{
    const savedRaw = localStorage.getItem('tag_demo_prog_v1');
    if(savedRaw){
      const saved = JSON.parse(savedRaw);
      if(saved && saved.map === DEMO.map && Number.isInteger(saved.ci) && saved.ci < DEMO.cases.length){
        DEMO.ci = saved.ci;
        DEMO.done = saved.done || saved.ci;
        DEMO.okN = saved.okN || 0;
        DEMO.part = saved.part || 1;
        DEMO.phase = saved.phase || 'full';
      }
    }
  }catch(e){}
  startMatch();
  match.state='playing';match.cooldown=0;match.it=0;
  demoPlace();
  try{toast('DEMO: reach the GLOWING platform! Move to start. X=skip Z=save');}catch(e){}
  demoSaveProgress();
}
function demoTick(dt){
  if(!DEMO.active||!match||screen!=='game')return;
  match.timer=9999;match.lastTick=9999;
  if(match.state==='paused'||DEMO.phase==='done')return;
  if(match.state!=='playing')return;
  const pl=match.players[0];
  if(!pl)return;
  if(pressed.has('KeyX')){
    demoRecord('skip',DEMO.t);
    try{toast('Skipped - marked for review');}catch(e){}
    demoAdvance();return;
  }
  if(pressed.has('KeyZ')){demoDownload(true);return;}
  const c=demoCur(),tgt=DEMO.nodes[c.to];
  if(!DEMO.started){
    if(keys.has('KeyA')||keys.has('KeyD')||keys.has('KeyW')||keys.has('Space'))DEMO.started=true;
    else return;
  }
  DEMO.t+=dt;
  if(demoFeetOn(pl,tgt))DEMO.holdT+=dt;else DEMO.holdT=0;
  if(DEMO.holdT>=0.5){
    demoRecord('ok',DEMO.t);
    try{sfx('go');}catch(e){}
    DEMO.rep++;
    if(DEMO.rep>=DEMO_REPS)demoAdvance();else demoPlace();
    return;
  }
  if(DEMO.t>=DEMO.par){
    DEMO.fails++;
    demoRecord('timeout',DEMO.t);
    try{sfx('back');toast('TOO SLOW ('+DEMO.par.toFixed(0)+'s par) - AGAIN! 2nd slow = X skips');}catch(e){}
    demoPlace();return;
  }
}
function demoOverlay(){

  ptxt('X skip . Z save . clean:'+DEMO.okN,CW/2,CH-24,FN(13,800),'rgba(255,255,255,0.65)');

function inputFor(p){
  if(isBotSlot(p))return botInputFor(p);
  /* Offline: each slot has its dedicated keyboard scheme and pad (P1: WASD, P2: Arrows, P3: IJKL, P4: TFGH) */
  const s=SLOTS[p.slot],m=s.map,pd=PAD[s.pad];
  const hasL=Array.isArray(m.L),hasR=Array.isArray(m.R);
  let dir=(hasR?(m.R.some(k=>keys.has(k))?1:0):(keys.has(m.R)?1:0))
         -(hasL?(m.L.some(k=>keys.has(k))?1:0):(keys.has(m.L)?1:0));
  const hasU=Array.isArray(m.U),hasD=Array.isArray(m.D);
  let jumpEdge=hasU?(m.U.some(k=>pressed.has(k))):(pressed.has(m.U));
  let jumpHeld=hasU?(m.U.some(k=>keys.has(k))):(keys.has(m.U));
  let downHeld=hasD?(m.D.some(k=>keys.has(k))):(keys.has(m.D));
  if(pd){
    dir+=(pd.right?1:0)-(pd.left?1:0);
    jumpEdge=jumpEdge||pd.jumpE;jumpHeld=jumpHeld||pd.jumpHeld;downHeld=downHeld||pd.dropHeld;
  }
  const isOnlineMatch = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isSplitLocal = (isTouch && !isOnlineMatch && match && match.players && match.players.length === 2);
  if(!isSplitLocal && p.slot === (typeof NET !== 'undefined' && NET && NET.mySlot >= 0 ? NET.mySlot : 0)){
    if(TOUCH.left) dir = -1;
    if(TOUCH.right) dir = 1;
    if(TOUCH.jumpEdge) jumpEdge = true;
    if(TOUCH.jumpHeld) jumpHeld = true;
    if(TOUCH.downHeld) downHeld = true;
  }
  if(isSplitLocal){
    const gP = (p.slot === match.players[0].slot) ? LOCAL_TOUCH.p1 : ((p.slot === match.players[1].slot) ? LOCAL_TOUCH.p2 : null);
    if(gP){
      if(gP.left) dir = -1;
      if(gP.right) dir = 1;
      if(gP.jumpEdge){ jumpEdge = true; gP.jumpEdge = false; }
      if(gP.jumpHeld) jumpHeld = true;
      if(gP.downHeld) downHeld = true;
    }
  }
  const _demoOut={dir:clamp(dir,-1,1),jumpEdge:!!jumpEdge,jumpHeld:!!jumpHeld,downHeld:!!downHeld};
  if(typeof DEMO!=='undefined'&&DEMO.active&&DEMO.phase!=='done'&&p.slot===0){
    try{demoPushTrace(p,_demoOut);}catch(e){}
  }
  return _demoOut;
}

function physUpdate(p,dt,allow){
  const wasG=p.grounded;
  if(wasG)p.coyote=0.11;else p.coyote-=dt;
  let dir=0,jumpP=false,jumpHeld=false,downHeld=false;
  if(allow){const inp=inputFor(p);dir=inp.dir;jumpP=inp.jumpEdge;jumpHeld=inp.jumpHeld;downHeld=inp.downHeld;}
  const onSpeed=p.grounded&&!!zoneAtFeet(p,'speed');
  if(onSpeed&&!p.padOn)sfx('pad');
  p.padOn=onSpeed;
  const isIt=match.it===match.players.indexOf(p)&&match.state==='playing';
  const baseMax=isIt?IT_SPEED:RUN_SPEED;
  const maxs=baseMax*(onSpeed?SPEED_MULT:1);
  if(!onSpeed&&Math.abs(p.vx)>maxs){
    const target=Math.sign(p.vx)*maxs;
    p.vx+=(target-p.vx)*Math.min(1,dt*14);
  }
  
  /* SHARP ACCELERATION & SNAPPY BRAKING */
  const acc=p.grounded?ACC:AIR_ACC;
  const dec=p.grounded?DECEL:AIR_DEC;
  if(dir!==0){
    p.face=dir;
    const turning=(p.vx!==0&&Math.sign(p.vx)!==dir);
    p.vx+=dir*(turning?acc+dec*0.9:acc)*dt;
    if(dir*p.vx>maxs)p.vx=dir*maxs;
  }else{
    const d=dec*dt;
    if(Math.abs(p.vx)<=d)p.vx=0;else p.vx-=Math.sign(p.vx)*d;
  }
  
  if(jumpP)p.jbuf=0.16;else p.jbuf-=dt;
  
  /* PINK DROP-THROUGH: only the player's OWN down input counts, and only when
     FULLY standing on pink — the whole body (minus a 6px forgiveness margin)
     must be over the pink span. Straddling brown+pink (like standing on the
     seam) does nothing, so holding S while walking across never clips you. */
  const fullyOn=(plat)=>{
    if(!plat||plat.t!=='drop')return false;
    if(!plat.dy) return (p.x+6>=plat.x)&&(p.x+p.w-6<=plat.x+plat.w);
    if(!(p.x+6>=plat.x && p.x+p.w-6<=plat.x+plat.w)) return false;
    const sy=plat.y + (p.x - plat.x)*plat.dy/plat.w;
    return Math.abs(sy - (p.y+p.h)) < 20;
  };
  const planted=p.grounded&&p.gp&&fullyOn(p.gp);
  const hoverPlat=!p.grounded&&p.vy>-60&&p.vy<160?zoneAtFeet(p,'drop'):null;
  const hoverDrop=!!hoverPlat&&(p.x+6>=hoverPlat.x)&&(p.x+p.w-6<=hoverPlat.x+hoverPlat.w);
  if(downHeld&&(planted||hoverDrop)){
    p.jbuf = 0;
    const dropPlat=planted?p.gp:hoverPlat;
    if(dropPlat){
      p.dropT=0.35;
      p.grounded=false;
      p.gp=null;
      p.y+=8; /* Nudge feet past top surface to drop immediately */
      p.vy=Math.max(p.vy,160);
      sfx('drop');
      dust(p.x+p.w/2,p.y+p.h,5,60);
    }
  }
  if(p.dropT>0)p.dropT-=dt;
  
  /* WALL CONTACT FOR PARKOUR WALL-JUMP (NO SLOW-FALL WALL SLIDE) */
  const onWall=!p.grounded&&p.sideT>0;
  
  /* JUMP HANDLING: Ground, Wall-Jump, Double Jump, and Blue Pad Boost.
     Tap = shorter hop; holding jump sustains reduced gravity for 0.10s so a
     full hold rises just past the old fixed jump height. */
  if(p.jbuf>0 && !downHeld){
    if(p.grounded||p.coyote>0){
      const boost=(p.grounded&&zoneAtFeet(p,'boost'))?BOOST_MULT:1;
      p.vy=-JUMP_V*boost;
      p.vx=clamp(p.vx,-baseMax*1.1,baseMax*1.1);
      if(boost>1){sfx('boost');ringP(p.x+p.w/2,p.y+p.h,'#4a90e2');}else sfx('jump');
      p.grounded=false;p.coyote=0;p.jbuf=0;p.holdT=HOLD_LIFT_T;p.airJumps=settings.doubleJump?1:0;
      p.sy=1.10;p.sx=0.93;dust(p.x+p.w/2,p.y+p.h,5,70);
    }else if(onWall&&p.wallJumps<2){
      /* KICK OFF WALL! (Wall-Jump: Max 2 consecutive) */
      p.wallJumps++;
      p.vy=-JUMP_V*0.96;
      p.vx=-p.wallSide*480;
      p.face=-p.wallSide;
      p.sideT=0;p.jbuf=0;p.holdT=HOLD_LIFT_T;
      p.airJumps=settings.doubleJump?1:0;
      p.sy=1.09;p.sx=0.92;
      sfx('walljump');
      dust(p.x+(p.wallSide<0?0:p.w),p.y+p.h/2,4,80);
    }else if(p.airJumps>0){
      p.vy=-JUMP_V*0.95;p.airJumps--;p.jbuf=0;p.holdT=HOLD_LIFT_T;p.vx=clamp(p.vx,-baseMax*1.1,baseMax*1.1);sfx('djump');
      ringP(p.x+p.w/2,p.y+p.h/2,'#ffffff');p.sy=1.08;p.sx=0.94;
    }
  }

  /* Variable jump height: reduced gravity while jump is held and rising */
  if(p.holdT>0&&jumpHeld&&p.vy<0){p.vy+=G*HOLD_GRAV_F*dt;p.holdT-=dt;}
  else{p.vy+=G*dt;if(jumpHeld&&p.vy>=0)p.holdT=0;}
  if(p.vy>MAXFALL)p.vy=MAXFALL;

  /* Horizontal collision, sub-stepped so sprinters can't tunnel thin walls */
  const hSteps=(Math.abs(p.vx)*dt>13)?2:1;
  for(let hs=0;hs<hSteps;hs++){
  const leftBefore=p.x,rightBefore=p.x+p.w;
  p.x+=p.vx*dt/hSteps;
  for(const s of SOLIDS){
    if(s.t==='drop')continue; /* ONLY pink allows pass-through! */
    if(!s.dy){
      if(!hitRect(p,s))continue;
      /* If s is a thin horizontal platform (shelf/floor, not a vertical wall), only push if approaching from outside */
      if(!s.wall&&s.h<=46){
        const wasOutsideLeft=rightBefore<=s.x+2;
        const wasOutsideRight=leftBefore>=s.x+s.w-2;
        if(!wasOutsideLeft&&!wasOutsideRight)continue;
      }
      const fl=(p.x+p.w)-s.x,fr=(s.x+s.w)-p.x;
      if(fl<fr){p.x=s.x-p.w;if(p.vx>0)p.vx=0;p.wallSide=1;}
      else{p.x=s.x+s.w;if(p.vx<0)p.vx=0;p.wallSide=-1;}
      if((!s.wall||s.h>s.w)&&!wasG&&p.vy>-20){
        p.sideT=0.28;
      }
    }else{
      /* Tilted slope end-walls */
      if(p.vx>0&&p.x+p.w>=s.x&&leftBefore+p.w<=s.x+8){
        const yTop=s.y,yBot=s.y+s.h;
        if(p.y+p.h>yTop+4&&p.y<yBot-4){p.x=s.x-p.w;p.vx=0;p.wallSide=1;p.sideT=0.28;}
      }
      if(p.vx<0&&p.x<=s.x+s.w&&leftBefore>=s.x+s.w-8){
        const yTop=s.y+s.dy,yBot=s.y+s.dy+s.h;
        if(p.y+p.h>yTop+4&&p.y<yBot-4){p.x=s.x+s.w;p.vx=0;p.wallSide=-1;p.sideT=0.28;}
      }
    }
  }
  } /* end sub-step loop */
  
  /* Vertical collision: Slopes & solids are 100% solid! Pink is one-way & fall-through - vertical sub-stepped to prevent tunneling */
  p.grounded=false;
  const vSteps=(Math.abs(p.vy)*dt>23)?2:1;
  const subDt=dt/vSteps;
  for(let vs=0;vs<vSteps;vs++){
    const headBefore=p.y,feetBefore=p.y+p.h;
    p.y+=p.vy*subDt;
  
  for(const s of SOLIDS){
    if(!s.dy){
      /* Flat platform */
      const xOverlap=(p.x+p.w>s.x+2&&p.x<s.x+s.w-2);
      if(!xOverlap)continue;
      
      if(s.t==='drop'){
        /* PINK DROP PLATFORM:
           1. NEVER blocks jumping up (can always jump through from below)
           2. Passes through when dropT>0 (just triggered a drop), OR when the
              player's OWN down is held AND they are FULLY on this pink span.
              Straddling a brown/pink seam while holding S does NOT fall —
              the neighbouring solid still catches you (see solid branch).
           3. Lands only when falling downward and feet cross the top surface */
        const fullyHere=(p.x+6>=s.x)&&(p.x+p.w-6<=s.x+s.w);
        if(p.dropT>0||(downHeld&&fullyHere))continue;
        if(p.vy>0&&feetBefore<=s.y+6&&p.y+p.h>=s.y&&p.y+p.h<=s.y+s.h+10){
          const imp=p.vy;
          p.y=s.y-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
        }
        continue;
      }
      
      /* Solid brown, orange speed, or blue boost: FULLY SOLID FROM TOP AND BOTTOM!
         Holding S only lets you fall where pink already let go (dropT>0, or a
         pink span at this height that you are FULLY standing on). A straddler
         holding S still lands on this solid — never sinks through the seam. */
      if(p.vy>0){
        /* Falling down onto platform */
        if(p.dropT>0||downHeld){
          /* If currently dropping through, do NOT catch on adjacent/overlapping solids at same level! */
          const hasDropAtY=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-s.y)<=10&&p.x+p.w>d.x+2&&p.x<d.x+d.w-2&&(p.x+6>=d.x)&&(p.x+p.w-6<=d.x+d.w));
          if(hasDropAtY)continue;
        }
        if(feetBefore<=s.y+8&&p.y+p.h>=s.y&&p.y<s.y+s.h){
          const imp=p.vy;
          p.y=s.y-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
        }
      }else if(p.vy<0){
        /* Jumping UP: head bonks the solid underside — UNLESS the player's body
           actually overlaps a pink platform at this height (i.e. jumping up
           through pink that shares the seam). The pink must cover the player's
           center, not merely sit nearby, so brown/pink edge seams stay solid. */
        const midX=p.x+p.w/2;
        const thruPink=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-s.y)<=10&&midX>d.x+4&&midX<d.x+d.w-4);
        if(!thruPink&&headBefore>=s.y+s.h-8&&p.y<=s.y+s.h&&p.y+p.h>s.y){
          p.y=s.y+s.h;
          p.vy=0;
        }
      }
    }else{
      /* Tilted platform / slope */
      const xOverlap=(p.x+p.w>s.x+2&&p.x<s.x+s.w-2);
      if(!xOverlap)continue;
      
      const px=clamp(p.x+p.w/2,s.x,s.x+s.w);
      const syTop=s.y+(px-s.x)*(s.dy/s.w);
      const syBot=syTop+s.h;
      
      if(s.t==='drop'){
        const fullyHere0=(p.x+6>=s.x)&&(p.x+p.w-6<=s.x+s.w);
        if(p.dropT>0||(downHeld&&fullyHere0))continue;
        if(p.vy>0&&feetBefore<=syTop+6&&p.y+p.h>=syTop&&p.y+p.h<=syBot+8){
          const imp=p.vy;
          p.y=syTop-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
          p.grounded=true;
          p.vx+=Math.sign(s.dy)*600*subDt;
        }
        continue;
      }
      
      if(p.vy>=0){
        if(p.dropT>0||downHeld){
          const hasDropAtY=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-syTop)<=12&&p.x+p.w>d.x+2&&p.x<d.x+d.w-2&&(p.x+6>=d.x)&&(p.x+p.w-6<=d.x+d.w));
          if(hasDropAtY)continue;
        }
        /* Landing on top of slope */
        if(feetBefore<=syTop+8&&p.y+p.h>=syTop-6&&p.y<syBot){
          const imp=p.vy;
          p.y=syTop-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
          p.grounded=true;
          p.vx+=Math.sign(s.dy)*600*subDt;
        }
      }else if(p.vy<0){
        /* Jumping UP into slope: head hits bottom, unless rising through pink at the seam */
        const midX2=p.x+p.w/2;
        const thruPink2=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-syTop)<=12&&midX2>d.x+4&&midX2<d.x+d.w-4);
        if(!thruPink2&&headBefore>=syBot-10&&p.y<=syBot&&p.y+p.h>syTop){
          p.y=syBot;
          p.vy=0;
        }
      }
    }
  }
  }
  
  p.x=clamp(p.x,WALL,W-WALL-p.w);
  if(p.x<=WALL){p.wallSide=-1;if(!p.grounded&&p.vy>-20)p.sideT=0.28;}
  else if(p.x>=W-WALL-p.w){p.wallSide=1;if(!p.grounded&&p.vy>-20)p.sideT=0.28;}
  p.y=clamp(p.y,WALL,H-WALL-p.h);
  if(p.y>=H-WALL-p.h){
    /* Arena floor counts as a landing: squash, dust and sound included */
    if(!wasG&&!p.grounded)landOn(p,SOLIDS[1],p.vy,wasG);
    else{p.grounded=true;p.gp=SOLIDS[1];p.lastGp=SOLIDS[1];p.wallJumps=0;}
    p.vy=0;
  }
  p.sx+=(1-p.sx)*Math.min(1,dt*11);
  p.sy+=(1-p.sy)*Math.min(1,dt*11);
  p.landT-=dt;p.tagT-=dt;p.sideT-=dt;
  p.blinkT-=dt;
  if(p.blinkT<=0){p.blink=0.12;p.blinkT=rand(1.8,4.5);}
  p.blink-=dt;
  
  /* Dynamic Speed Ghost Trail FX */
  if(Math.abs(p.vx)>320||onSpeed){
    p.trail.unshift({x:p.x,y:p.y,alpha:0.45});
    if(p.trail.length>4)p.trail.pop();
  }else{
    if(p.trail.length>0)p.trail.pop();
  }
  for(let tr of p.trail)tr.alpha-=dt*1.8;
  
  if(p.grounded&&Math.abs(p.vx)>240&&Math.random()<dt*14)dust(p.x+p.w/2-p.face*16,p.y+p.h-2,1,30);
}

function pairCollide(){
  if(!settings.collision||match.cooldown>0||match.state!=='playing')return;
  const P=match.players;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j];
    if(!hitRect(a,b))continue;
    const ox=Math.min(a.x+a.w-b.x,b.x+b.w-a.x),oy=Math.min(a.y+a.h-b.y,b.y+b.h-a.y);
    if(ox<oy){
      const s=(a.x+a.w/2<b.x+b.w/2)?-1:1;
      a.x+=s*ox/2;b.x-=s*ox/2;
      if(s<0){if(a.vx>0)a.vx=0;if(b.vx<0)b.vx=0;}else{if(a.vx<0)a.vx=0;if(b.vx>0)b.vx=0;}
    }else{
      const s=(a.y+a.h/2<b.y+b.h/2)?-1:1;
      a.y+=s*oy/2;b.y-=s*oy/2;
      if(s<0){if(a.vy>0)a.vy=0;if(b.vy<0)b.vy=0;}else{if(b.vy>0)b.vy=0;if(a.vy<0)a.vy=0;}
    }
  }
}
function tagBox(p){const pad=5;return{x:p.x-pad,y:p.y-pad,w:p.w+2*pad,h:p.h+2*pad};}
function applyTag(newItIdx, popX, popY){
  if(!match || match.state !== 'playing' || match.cooldown > 0) return;
  const P = match.players;
  if(newItIdx < 0 || newItIdx >= P.length) return;
  const oldIt = P[match.it];
  const newIt = P[newItIdx];
  if(!oldIt || !newIt) return;

  match.it = newItIdx;
  if(settings.teams && newIt.team != null){
    match.itTeam = newIt.team;
  }
  match.cooldown = 3;
  match.tags[newItIdx]++;
  match.freeze = 0.09; match.shake = 13; match.flash = 0.14;
  match.tagPop = { t: 0.55, x: popX != null ? popX : (oldIt.x + newIt.x) / 2 + 23, y: popY != null ? popY : (oldIt.y + newIt.y) / 2 + 10 };
  oldIt.tagT = 0.7; newIt.tagT = 0.7;
  sfx('tag');
  tagBurst(match.tagPop.x, match.tagPop.y, getPlayerColor(oldIt), getPlayerColor(newIt));
}

function checkTag(){
  if(!match || match.state !== 'playing' || match.cooldown > 0) return;
  const P = match.players;
  if(!P || P.length < 2) return;

  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isOnlineGuest = isOnline && !NET.isHost;

  if(settings.teams && match.itTeam != null){
    // "Hunt Together": ALL players on the itTeam hunt together!
    const hunters = P.filter(p => p.team === match.itTeam);
    const runners = P.filter(p => p.team !== match.itTeam);
    for(const hunter of hunters){
      for(const runner of runners){
        if(hitRectInclusive(tagBox(hunter), tagBox(runner))){
          const popX = (hunter.x + runner.x) / 2 + 23, popY = (hunter.y + runner.y) / 2 + 10;
          if(isOnlineGuest){
            if(hunter.slot === NET.mySlot){
              netBroadcastReliable({ t: 'tag_claim', from: hunter.slot, target: runner.slot, x: popX, y: popY });
              match.cooldown = 0.6;
            }
            return;
          }
          applyTag(P.indexOf(runner), popX, popY);
          return;
        }
      }
    }
    return;
  }

  // Classic Free-for-All
  const it = P[match.it];
  if(!it) return;
  for(let j = 0; j < P.length; j++){
    if(j === match.it) continue;
    if(hitRectInclusive(tagBox(it), tagBox(P[j]))){
      if(isOnlineGuest){
        if(it.slot === NET.mySlot){
          const popX = (it.x + P[j].x) / 2 + 23, popY = (it.y + P[j].y) / 2 + 10;
          netBroadcastReliable({ t: 'tag_claim', from: it.slot, target: P[j].slot, x: popX, y: popY });
          match.cooldown = 0.6;
        }
        return;
      }
      applyTag(j, (it.x + P[j].x) / 2 + 23, (it.y + P[j].y) / 2 + 10);
      return;
    }
  }
}
function endMatch(){
  try{CG.happytime();}catch(e){}try{CG.gameplayStop();}catch(e){}
  try{CG.requestResponsiveBanner('cg-banner-responsive');const el=document.getElementById('cg-banner-resp');if(el)el.style.display='flex';}catch(e){}
  try{
    const now = Date.now();
    if(now - lastAdTime >= 180000){ // 3 minutes throttle
      lastAdTime = now;
      CG.requestMidgame();
    }
  }catch(e){}
  match.state='result';
  if(settings.teams && match.teamItTime){
    // Team with the lowest total IT time wins!
    const activeTeams = Array.from(new Set(match.players.map(p => p.team)));
    let bestTeam = activeTeams[0] || 0;
    let minTime = match.teamItTime[bestTeam] || 0;
    for(const tm of activeTeams){
      const tmTime = match.teamItTime[tm] || 0;
      if(tmTime < minTime){
        minTime = tmTime;
        bestTeam = tm;
      }
    }
    match.result={winningTeam: bestTeam, teamItTime: match.teamItTime.slice()};
  } else {
    match.result={loser:match.it};
  }
  match.resultT=0;
  confetti();
  sfx('win');
  if(typeof NET!=='undefined' && NET && NET.isHost && NET.midgameJoiner){
    netToast('New player joined — returning to lobby!');
  }
}

/* ================= camera ================= */
function updateCam(dt){
  let tx,ty,ts;
  const N=match?match.players.length:2;
  if(screen!=='game'||!match){
    tx=W/2;ty=H/2;ts=Math.min(CW/(W+160),CH/(H+160));
  }else{
    const P=match.players;
    let mx=0,my=0,minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(const p of P){mx+=p.x;my+=p.y;minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);}
    tx=mx/P.length+23;ty=my/P.length+23;
    const dx=maxX-minX,dy=maxY-minY;
    const needW=dx+640+(N-2)*220,needH=dy+500+(N-2)*120;
    const minS=Math.min(CW/(W+140),CH/(H+140));
    ts=clamp(Math.min(CW/needW,CH/needH),minS,N>=6?1.05:(N>=4?1.25:1.75));
  }
  const kp=1-Math.exp(-dt*5.5),ks=1-Math.exp(-dt*3.8);
  cam.x+=(tx-cam.x)*kp;cam.y+=(ty-cam.y)*kp;cam.s+=(ts-cam.s)*ks;
  const vw=CW/cam.s,vh=CH/cam.s;
  cam.x=vw>=W+120?W/2:clamp(cam.x,vw/2-60,W-vw/2+60);
  cam.y=vh>=H+120?H/2:clamp(cam.y,vh/2-60,H-vh/2+60);
}

/* ================= game update & fullscreen ================= */
function toggleFullscreen(){
  try{
    const de = document.documentElement;
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || document.webkitIsFullScreen);
    const req = de.requestFullscreen || de.webkitRequestFullscreen || de.webkitRequestFullScreen || cv.requestFullscreen || cv.webkitRequestFullscreen || cv.webkitRequestFullScreen || de.mozRequestFullScreen || de.msRequestFullscreen;
    if(!req){
      window.scrollTo(0, 0);
      if(match){ match.mapToast = 'ADD TO HOME SCREEN FOR FULLSCREEN'; match.mapToastT = 2.5; }
      return;
    }
    if(!isFs){
      const target = (de.requestFullscreen || de.webkitRequestFullscreen || de.webkitRequestFullScreen) ? de : cv;
      const p = req.call(target);
      if(p && p.catch) p.catch(()=>{});
    }else{
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if(exit){
        const p = exit.call(document);
        if(p && p.catch) p.catch(()=>{});
      }
    }
  }catch(e){}
}
function toggleSound(){
  muted=!muted;
  applyEffectiveMute();
  if(match){match.mapToast='SOUND: '+(muted?'OFF':'ON');match.mapToastT=1.8;}
  sfx('ui');
}
function togglePause(){
  if(!match)return;
  if(match.state==='paused'){
    match.state=match.pausedFrom;
    match.pausedFrom=null;
    try{CG.gameplayStart();}catch(e){}
    sfx('ok');
  }
  else if(match.state==='playing'||match.state==='countdown'){
    match.pausedFrom=match.state;
    match.state='paused';
    match.pauseSel=0;
    try{CG.gameplayStop();}catch(e){}
    sfx('back');
  }
}
function cycleTheme(){
  currentThemeIdx=(currentThemeIdx+1)%THEMES.length;
  if(match){match.mapToast='THEME: '+THEMES[currentThemeIdx].name;match.mapToastT=2.2;}
  sfx('ui');
}
function selectMapQuick(idx){
  settings.map=(idx+MAPS.length)%MAPS.length;
  buildLevel();
  if(match){
    match.mapToast='MAP: '+(settings.map+1)+'. '+MAPS[settings.map].name;
    match.mapToastT=2.4;
    startMatch();
  }
  sfx('ok');
}

function updateGame(dt){
  if(!match)return;
  if(anyPressed(['KeyM']))toggleSound();
  // Fullscreen was on F — that collides with TFGH left (F). O is free in-game (O is font-prev only in menu).
  if(anyPressed(['KeyO']))toggleFullscreen();
  if(anyPressed(['KeyP']))togglePause();
  if(anyPressed(['KeyN']))selectMapQuick(settings.map+1);
  if(anyPressed(['KeyB']))cycleTheme();
  if(anyPressed(['KeyV']))voiceToggleMic();
  
  /* Number keys 1-9, 0 to switch to any map instantly */
  for(let k=1;k<=9;k++)if(pressed.has('Digit'+k))selectMapQuick(k-1);
  if(pressed.has('Digit0'))selectMapQuick(9);
  
  for(let i=0;i<4;i++){if(PAD[i]&&PAD[i].pauseE)togglePause();}
  if(match.state==='paused'){
    let up=anyPressed(['ArrowUp','KeyW']),dn=anyPressed(['ArrowDown','KeyS']),cf=anyPressed(['Enter','NumpadEnter','Space']);
    for(let i=0;i<4;i++){const pd=PAD[i];if(!pd)continue;up=up||pd.upE;dn=dn||pd.downE;cf=cf||pd.confirmE;}
    if(up){match.pauseSel=(match.pauseSel+5)%6;sfx('ui');}
    if(dn){match.pauseSel=(match.pauseSel+1)%6;sfx('ui');}
    if(cf){
      if(match.pauseSel===0)togglePause();
      else if(match.pauseSel===1){sfx('go');startMatch();}
      else if(match.pauseSel===2){selectMapQuick(settings.map+1);}
      else if(match.pauseSel===3){toggleSound();}
      else if(match.pauseSel===4){toggleFullscreen();}
      else quitToMenu();
    }
    return;
  }
  if(match.state==='result'){
    match.resultT+=dt;
    if(typeof NET!=='undefined' && NET && NET.isHost && NET.midgameJoiner && match.resultT >= 4.0){
      NET.midgameJoiner = false;
      quitToMenu();
      return;
    }
    if(anyPressed(['Enter','NumpadEnter','Space'])){
      if(typeof NET!=='undefined' && NET && NET.role!==null){
        if(!NET.isHost) return;
        if(NET.midgameJoiner){
          NET.midgameJoiner = false;
          quitToMenu();
          return;
        }
      }
      sfx('go');startMatch();
    }
    for(let i=0;i<4;i++){
      if(PAD[i]&&PAD[i].confirmE){
        if(typeof NET!=='undefined' && NET && NET.role!==null){
          if(!NET.isHost) return;
          if(NET.midgameJoiner){
            NET.midgameJoiner = false;
            quitToMenu();
            return;
          }
        }
        sfx('go');startMatch();
      }
    }
    updateParts(dt);updateCam(dt);match.shake*=Math.exp(-dt*7);match.flash=Math.max(0,match.flash-dt);
    return;
  }
  if(match.state==='tutorial'){
    updateParts(dt);updateCam(dt);
    return;
  }

  if(match.freeze>0){match.freeze-=dt;return;}
  match.fade=Math.max(0,match.fade-dt);
  match.mapToastT=Math.max(0,match.mapToastT-dt);
  const inPlay=match.state==='playing';
  if(match.state==='countdown'){
    match.cdT+=dt;
    if(match.cdT>=0.72){
      match.cdT-=0.72;match.cd--;
      if(match.cd<=0){match.state='playing';match.goFlash=0.8;sfx('go');}
      else sfx('count');
    }
  }
  for(const p of match.players){
    if(typeof NET !== 'undefined' && NET && NET.role !== null && NET.isHost){
      if(p.slot === NET.mySlot || p.slot === 0){
        physUpdate(p, dt, inPlay);
      } else {
        netApplyRemoteTarget(p, dt);
      }
    } else {
      physUpdate(p, dt, inPlay);
    }
  }
  // Tag before bump — skins kissing counts before bodies push apart.
  checkTag();
  pairCollide();
  if(inPlay){
    if(match.cooldown>0){
      const c0=Math.ceil(match.cooldown);
      match.cooldown-=dt;
      const c1=Math.ceil(Math.max(0,match.cooldown));
      if(c1<c0&&c1>0)sfx('count');
      if(match.cooldown<=0){match.cooldown=0;match.goFlash=0.8;sfx('go');}
    }
    match.timer-=dt;
    if(settings.teams && match.itTeam != null){
      if(!match.teamItTime) match.teamItTime = [0,0,0,0];
      match.teamItTime[match.itTeam] += dt;
    }
    const s=Math.ceil(match.timer);
    if(s!==match.lastTick){if(s<=5&&s>0)sfx('tick');match.lastTick=s;}
    if(match.timer<=0){match.timer=0;endMatch();return;}
    match.hintT-=dt;
  }
  match.goFlash-=dt;
  match.flash=Math.max(0,match.flash-dt);
  if(match.tagPop){match.tagPop.t-=dt;if(match.tagPop.t<=0)match.tagPop=null;}
  match.shake*=Math.exp(-dt*7);
  updateParts(dt);
  updateCam(dt);
}

  pollGamepads();
  if(screen==='menu'){updateMenu(dt);updateCam(dt);}
  else{updateGame(dt);if(typeof DEMO!=='undefined'&&DEMO.active){try{demoTick(dt);}catch(e){}}}
  if(typeof updateVoiceProximity==='function')updateVoiceProximity(dt);
}

function simpleButton(x,y,w,h,label,fn,sub){
  const pulse=1+0.015*Math.sin(tGlobal*4);
  g.save();

  g.fillStyle='#ffffff';g.fill();
  g.lineWidth=3;g.strokeStyle=INK;g.stroke();
  txt(label,w/2,h/2+(sub?-6:1),FN(Math.min(24,h*0.4),900),'#1c6b38');
  if(sub)txt(sub,w/2,h*0.76,FN(10,700),'#5a8f6d');
  g.restore();
  zone(x,y,w,h,{fn:fn});
}
function padGlyph(x,y,s,lit){

}

/* ================= characters with ghost trails ================= */
function drawChar(gx,x,y,size,col,o){
  o=o||{};
  const f=o.face||'idle';
  const moving=o.moving&&o.grounded;
  gx.save();
  const shx=o.shake?(Math.random()-0.5)*o.shake:0;
  gx.translate(x+size/2+shx,y+size);
  gx.rotate(o.tilt||0);
  gx.scale(o.sx||1,o.sy||1);
  gx.translate(-size/2,-size);
  if(o.grounded&&!moving){
    gx.fillStyle=INK;
    rr(gx,size*0.2,size*0.94,size*0.2,size*0.12,size*0.06);gx.fill();
    rr(gx,size*0.6,size*0.94,size*0.2,size*0.12,size*0.06);gx.fill();
  }
  rr(gx,0,0,size,size,size*0.14);
  gx.fillStyle=col;gx.fill();
  gx.lineWidth=Math.max(2.5,size*0.09);gx.strokeStyle=INK;gx.stroke();
  gx.save();rr(gx,0,0,size,size,size*0.14);gx.clip();
  gx.fillStyle='rgba(255,255,255,0.20)';
  rr(gx,size*0.08,size*0.06,size*0.5,size*0.16,size*0.08);gx.fill();
  gx.fillStyle='rgba(0,0,0,0.14)';
  gx.fillRect(0,size*0.78,size,size*0.22);
  gx.restore();
  const lx=(o.lookX||0),ly=(o.lookY||0);
  const fx=lx*size*0.06+(o.fdir||0)*size*0.02,fy=ly*size*0.05;
  const ex1=size*0.33+fx,ex2=size*0.67+fx,ey=size*0.42+fy;
  const ew=size*0.13;let eh=size*0.17;
  gx.fillStyle=INK;
  if(f==='land'||f==='happy'){
    gx.lineWidth=size*0.06;gx.strokeStyle=INK;gx.lineCap='round';
    gx.beginPath();gx.moveTo(ex1-ew*0.7,ey+ew*0.5);gx.lineTo(ex1,ey-ew*0.4);gx.lineTo(ex1+ew*0.7,ey+ew*0.5);gx.stroke();
    gx.beginPath();gx.moveTo(ex2-ew*0.7,ey+ew*0.5);gx.lineTo(ex2,ey-ew*0.4);gx.lineTo(ex2+ew*0.7,ey+ew*0.5);gx.stroke();
    gx.fillStyle='rgba(255,120,150,0.55)';
    gx.beginPath();gx.arc(size*0.18,size*0.6,size*0.06,0,TAU);gx.fill();
    gx.beginPath();gx.arc(size*0.82,size*0.6,size*0.06,0,TAU);gx.fill();
  }else if(f==='tagged'){
    gx.lineWidth=size*0.05;gx.strokeStyle=INK;gx.lineCap='round';
    gx.beginPath();gx.moveTo(ex1-ew*0.7,ey-ew*0.7);gx.lineTo(ex1+ew*0.7,ey+ew*0.7);gx.moveTo(ex1+ew*0.7,ey-ew*0.7);gx.lineTo(ex1-ew*0.7,ey+ew*0.7);gx.stroke();
    gx.beginPath();gx.moveTo(ex2-ew*0.7,ey-ew*0.7);gx.lineTo(ex2+ew*0.7,ey+ew*0.7);gx.moveTo(ex2+ew*0.7,ey-ew*0.7);gx.lineTo(ex2-ew*0.7,ey+ew*0.7);gx.stroke();
  }else{
    if(o.blink)eh=size*0.05;
    if(f==='fall')eh=size*0.24;
    gx.fillRect(ex1-ew/2,ey-eh/2,ew,eh);
    gx.fillRect(ex2-ew/2,ey-eh/2,ew,eh);
    if(!o.blink){
      gx.fillStyle='rgba(255,255,255,0.9)';
      const gl=Math.max(1.5,size*0.045);
      gx.fillRect(ex1-ew*0.28,ey-eh*0.32,gl,gl);
      gx.fillRect(ex2-ew*0.28,ey-eh*0.32,gl,gl);
      gx.fillStyle=INK;
    }
  }
  const mx=size*0.5+fx*0.5,my=size*0.7+fy*0.4;
  if(f==='idle')gx.fillRect(mx-size*0.07,my-size*0.025,size*0.14,size*0.05);
  else if(f==='run')gx.fillRect(mx-size*0.09,my-size*0.05,size*0.18,size*0.1);
  else if(f==='jump')gx.fillRect(mx-size*0.05,my-size*0.05,size*0.1,size*0.1);
  else if(f==='fall'||f==='tagged'){gx.beginPath();gx.arc(mx,my,size*0.08,0,TAU);gx.fill();}
  else if(f==='land'||f==='happy')gx.fillRect(mx-size*0.12,my-size*0.06,size*0.24,size*0.11);
  else if(f==='sad')gx.fillRect(mx-size*0.07,my+size*0.02,size*0.14,size*0.045);
  gx.restore();
}
function faceFor(p){
  if(match.state==='result')return match.result.loser===match.players.indexOf(p)?'sad':'happy';
  if(p.tagT>0)return'tagged';
  if(p.landT>0)return'land';
  if(!p.grounded)return p.vy<0?'jump':'fall';
  if(Math.abs(p.vx)>60)return'run';
  return'idle';
}

/* ===== PROFESSIONAL 2.5D PLATFORMS WITH DYNAMIC MATERIALS & DEPTH ===== */
function drawPlat(s){
  g.save();
  
  /* 1. SOFT 2.5D DROP SHADOW */
  g.fillStyle='rgba(0,0,0,0.32)';
  if(!s.dy){
    g.fillRect(s.x+4, s.y+s.h, s.w-8, 7);
  }else{
    g.beginPath();
    g.moveTo(s.x+4, s.y+s.h);
    g.lineTo(s.x+s.w-4, s.y+s.dy+s.h);
    g.lineTo(s.x+s.w-4, s.y+s.dy+s.h+7);
    g.lineTo(s.x+4, s.y+s.h+7);
    g.closePath();
    g.fill();
  }
  
  if(!s.dy){
    /* ---------------- FLAT PLATFORM ---------------- */
    if(s.t==='drop'){
      /* === PINK DROP-THROUGH PLATFORM: Luminous Cyber Safety Grate === */
      // Base dark frame
      g.fillStyle='#9e1b5c';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Semi-transparent vibrant pink core
      g.fillStyle='rgba(235, 75, 155, 0.88)';
      g.fillRect(s.x+2, s.y+2, s.w-4, s.h-4);
      // Animated downward drop affordance chevrons
      const pulse=0.45+0.35*Math.sin(tGlobal*4.5);
      g.fillStyle='rgba(255,255,255,'+pulse.toFixed(2)+')';
      for(let x=s.x+18; x<s.x+s.w-12; x+=32){
        g.beginPath();
        g.moveTo(x-6, s.y+8);
        g.lineTo(x, s.y+15);
        g.lineTo(x+6, s.y+8);
        g.lineTo(x+4, s.y+6);
        g.lineTo(x, s.y+11);
        g.lineTo(x-4, s.y+6);
        g.closePath();
        g.fill();
      }
      // Glowing neon top laser rail
      g.fillStyle='rgba(255,190,225,0.92)';
      g.fillRect(s.x, s.y, s.w, 3);
      g.lineWidth=2; g.strokeStyle='#3e081e';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else if(s.t==='speed'){
      /* === ORANGE SPEEDWAY: Animated High-Speed Conveyor Belt === */
      // Dark chassis base
      g.fillStyle='#1e2229';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Vibrant safety orange running belt
      g.fillStyle='#f07818';
      g.fillRect(s.x+2, s.y+2, s.w-4, s.h-4);
      // Animated chevrons radiating outward from the middle <<> >>.
      // (Speed boosts all directions, so the pad must not imply left or right.)
      // d grows with scroll so chevrons travel OUTWARD, matching where they point.
      const scroll=(tGlobal*200)%36;
      const cxm=s.x+s.w/2;
      g.save();
      g.beginPath(); g.rect(s.x+8, s.y+3, s.w-16, s.h-6); g.clip();
      g.fillStyle='rgba(255,240,130,0.92)';
      const chevR=(x,dir)=>{
        g.beginPath();
        g.moveTo(x-8*dir, s.y+5);
        g.lineTo(x+3*dir, s.y+s.h/2);
        g.lineTo(x-8*dir, s.y+s.h-5);
        g.lineTo(x-3*dir, s.y+s.h-5);
        g.lineTo(x+8*dir, s.y+s.h/2);
        g.lineTo(x-3*dir, s.y+5);
        g.closePath();
        g.fill();
      };
      for(let d=scroll; d<s.w/2-8; d+=36){chevR(cxm+d,1);chevR(cxm-d,-1);}
      /* Hollow center diamond: two arrow outlines tip-to-tip (<>), the outward-flow origin */
      const dcy=s.y+s.h/2,ds=Math.min(13,(s.h-10)/2);
      g.lineWidth=Math.max(2.5,ds*0.35);g.lineJoin='round';g.lineCap='round';
      g.strokeStyle='rgba(255,240,130,0.95)';
      g.beginPath(); /* left arrow < */
      g.moveTo(cxm-ds*0.2, dcy-ds);
      g.lineTo(cxm-ds*1.1, dcy);
      g.lineTo(cxm-ds*0.2, dcy+ds);
      g.stroke();
      g.beginPath(); /* right arrow > */
      g.moveTo(cxm+ds*0.2, dcy-ds);
      g.lineTo(cxm+ds*1.1, dcy);
      g.lineTo(cxm+ds*0.2, dcy+ds);
      g.stroke();
      g.restore();
      // Mechanical end roller caps
      g.fillStyle='#64748b';
      rr(g, s.x, s.y+1, 8, s.h-2, 3); g.fill();
      rr(g, s.x+s.w-8, s.y+1, 8, s.h-2, 3); g.fill();
      // Glowing amber top edge
      g.fillStyle='rgba(255,255,255,0.45)';
      g.fillRect(s.x+8, s.y+1, s.w-16, 2);
      g.lineWidth=2; g.strokeStyle='#141414';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else if(s.t==='boost'){
      /* === BLUE BOOST PLATFORM: Pneumatic Hydraulic Launch Spring === */
      // Heavy metallic housing
      g.fillStyle='#1e293b';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Visible twin spring coils
      g.strokeStyle='#94a3b8'; g.lineWidth=3;
      for(let k of [s.x+s.w*0.25, s.x+s.w*0.75]){
        g.beginPath();
        g.moveTo(k-8, s.y+s.h-4); g.lineTo(k+8, s.y+s.h-8);
        g.lineTo(k-8, s.y+s.h-12); g.lineTo(k+8, s.y+s.h-16);
        g.stroke();
      }
      // Top electric blue launch plate
      g.fillStyle='#2563eb';
      g.fillRect(s.x+3, s.y+1, s.w-6, s.h*0.55);
      // Concentric pulsing energy ripple
      const rip=(tGlobal*28)%(s.w*0.35);
      g.strokeStyle='rgba(147, 197, 253, 0.7)'; g.lineWidth=2;
      g.beginPath();
      g.ellipse(s.x+s.w/2, s.y+s.h*0.3, Math.min(s.w*0.38, rip+12), 4, 0, 0, TAU);
      g.stroke();
      // Emissive cyan top highlight
      g.fillStyle='rgba(255,255,255,0.7)';
      g.fillRect(s.x+6, s.y+1, s.w-12, 2.5);
      g.lineWidth=2.5; g.strokeStyle='#0f172a';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else{
      /* === SOLID PLATFORM: Tangible Distressed Hardwood & Iron Bevels === */
      // Deep 3D bottom bevel
      g.fillStyle='#23140b';
      g.fillRect(s.x, s.y+s.h-5, s.w, 5);
      // Warm rich wood/stone slab
      g.fillStyle='#4c301c';
      g.fillRect(s.x, s.y, s.w, s.h-5);
      // Plank division seams every 72px
      for(let px=s.x+72; px<s.x+s.w-20; px+=72){
        g.fillStyle='#1f1109';
        g.fillRect(px, s.y+1, 2, s.h-6);
        g.fillStyle='rgba(255,255,255,0.08)';
        g.fillRect(px+2, s.y+1, 1, s.h-6);
      }
      // Subtle metallic corner bracket rivets
      g.fillStyle='#d4af37';
      for(let rx of [s.x+8, s.x+s.w-8]){
        g.beginPath(); g.arc(rx, s.y+s.h/2-2, 2.2, 0, TAU); g.fill();
      }
      // Crisp top bevel highlight
      g.fillStyle='rgba(255,255,255,0.18)';
      g.fillRect(s.x, s.y+1, s.w, 3);
      g.lineWidth=2; g.strokeStyle='#141414';
      g.strokeRect(s.x, s.y, s.w, s.h);
    }
    
  }else{
    /* ---------------- TILTED PLATFORM / SLOPE ---------------- */
    g.beginPath();
    g.moveTo(s.x, s.y);
    g.lineTo(s.x+s.w, s.y+s.dy);
    g.lineTo(s.x+s.w, s.y+s.dy+s.h);
    g.lineTo(s.x, s.y+s.h);
    g.closePath();
    
    if(s.t==='drop') g.fillStyle='#ba2671';
    else if(s.t==='speed') g.fillStyle='#e06b12';
    else if(s.t==='boost') g.fillStyle='#2563eb';
    else g.fillStyle='#442917';
    g.fill();
    
    // Tilted top highlight
    g.strokeStyle='rgba(255,255,255,0.22)';
    g.lineWidth=3;
    g.beginPath(); g.moveTo(s.x, s.y+1); g.lineTo(s.x+s.w, s.y+s.dy+1); g.stroke();
    // Tilted bottom shadow
    g.strokeStyle='#170b05';
    g.lineWidth=4;
    g.beginPath(); g.moveTo(s.x, s.y+s.h-2); g.lineTo(s.x+s.w, s.y+s.dy+s.h-2); g.stroke();
    // Border
    g.strokeStyle='#141414'; g.lineWidth=2;
    g.stroke();
  }
  
  g.restore();
}

function drawITArrow(p){
  const bob=Math.sin(tGlobal*6)*4;
  const cx=p.x+p.w/2,ty=p.y-36+bob;
  g.save();
  // Golden crown chevron badge
  g.fillStyle='#ffc107';g.strokeStyle=INK;g.lineWidth=3;g.lineJoin='round';
  g.beginPath();
  g.moveTo(cx-16,ty-15);
  g.lineTo(cx+16,ty-15);
  g.lineTo(cx,ty+5);
  g.closePath();
  g.fill();g.stroke();
  if(match&&match.state==='playing'&&match.cooldown>0){
    ptxt(String(Math.ceil(match.cooldown)),cx,ty-30,FT(28),'#ffffff');
