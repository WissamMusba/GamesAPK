function updateGame(dt){
  if(!match)return;
  if(anyPressed(['KeyM']))toggleSound();
  // Fullscreen was on F — that collides with TFGH left (F). O is free in-game (O is font-prev only in menu).
  if(anyPressed(['KeyO']))toggleFullscreen();
  if(anyPressed(['KeyP']))togglePause();
  if(anyPressed(['KeyN']))selectMapQuick(settings.map+1);
  if(anyPressed(['KeyB']))cycleTheme();
  if(anyPressed(['KeyV']))voiceToggleMic();
  
  /* Number keys 1-9, 0 to switch to any map instantly */
  for(let k=1;k<=9;k++)if(pressed.has('Digit'+k))selectMapQuick(k-1);
  if(pressed.has('Digit0'))selectMapQuick(9);
  
  for(let i=0;i<4;i++){if(PAD[i]&&PAD[i].pauseE)togglePause();}
  if(match.state==='paused'){
    let up=anyPressed(['ArrowUp','KeyW']),dn=anyPressed(['ArrowDown','KeyS']),cf=anyPressed(['Enter','NumpadEnter','Space']);
    for(let i=0;i<4;i++){const pd=PAD[i];if(!pd)continue;up=up||pd.upE;dn=dn||pd.downE;cf=cf||pd.confirmE;}
    if(up){match.pauseSel=(match.pauseSel+5)%6;sfx('ui');}
    if(dn){match.pauseSel=(match.pauseSel+1)%6;sfx('ui');}
    if(cf){
      if(match.pauseSel===0)togglePause();
      else if(match.pauseSel===1){sfx('go');startMatch();}
      else if(match.pauseSel===2){selectMapQuick(settings.map+1);}
      else if(match.pauseSel===3){toggleSound();}
      else if(match.pauseSel===4){toggleFullscreen();}
      else quitToMenu();
    }
    return;
  }
  if(match.state==='result'){
    match.resultT+=dt;
    if(typeof NET!=='undefined' && NET && NET.isHost && NET.midgameJoiner && match.resultT >= 4.0){
      NET.midgameJoiner = false;
      quitToMenu();
      return;
    }
    if(anyPressed(['Enter','NumpadEnter','Space'])){
      if(typeof NET!=='undefined' && NET && NET.role!==null){
        if(!NET.isHost) return;
        if(NET.midgameJoiner){
          NET.midgameJoiner = false;
          quitToMenu();
          return;
        }
      }
      sfx('go');startMatch();
    }
    for(let i=0;i<4;i++){
      if(PAD[i]&&PAD[i].confirmE){
        if(typeof NET!=='undefined' && NET && NET.role!==null){
          if(!NET.isHost) return;
          if(NET.midgameJoiner){
            NET.midgameJoiner = false;
            quitToMenu();
            return;
          }
        }
        sfx('go');startMatch();
      }
    }
    updateParts(dt);updateCam(dt);match.shake*=Math.exp(-dt*7);match.flash=Math.max(0,match.flash-dt);
    return;
  }
  if(match.state==='tutorial'){
    updateParts(dt);updateCam(dt);
    return;
  }

  if(match.freeze>0){match.freeze-=dt;return;}
  match.fade=Math.max(0,match.fade-dt);
  match.mapToastT=Math.max(0,match.mapToastT-dt);
  const inPlay=match.state==='playing';
  if(match.state==='countdown'){
    match.cdT+=dt;
    if(match.cdT>=0.72){
      match.cdT-=0.72;match.cd--;
      if(match.cd<=0){match.state='playing';match.goFlash=0.8;sfx('go');}
      else sfx('count');
    }
  }
  for(const p of match.players){
    if(typeof NET !== 'undefined' && NET && NET.role !== null && NET.isHost){
      if(p.slot === NET.mySlot || p.slot === 0){
        physUpdate(p, dt, inPlay);
      } else {
        netApplyRemoteTarget(p, dt);
      }
    } else {
      physUpdate(p, dt, inPlay);
    }
  }
  // Tag before bump — skins kissing counts before bodies push apart.
  checkTag();
  pairCollide();
  if(inPlay){
    if(match.cooldown>0){
      const c0=Math.ceil(match.cooldown);
      match.cooldown-=dt;
      const c1=Math.ceil(Math.max(0,match.cooldown));
      if(c1<c0&&c1>0)sfx('count');
      if(match.cooldown<=0){match.cooldown=0;match.goFlash=0.8;sfx('go');}
    }
    match.timer-=dt;
    if(settings.teams && match.itTeam != null){
      if(!match.teamItTime) match.teamItTime = [0,0,0,0];
      match.teamItTime[match.itTeam] += dt;
    }
    const s=Math.ceil(match.timer);
    if(s!==match.lastTick){if(s<=5&&s>0)sfx('tick');match.lastTick=s;}
    if(match.timer<=0){match.timer=0;endMatch();return;}
    match.hintT-=dt;
  }
  match.goFlash-=dt;
  match.flash=Math.max(0,match.flash-dt);
  if(match.tagPop){match.tagPop.t-=dt;if(match.tagPop.t<=0)match.tagPop=null;}
  match.shake*=Math.exp(-dt*7);
  updateParts(dt);
  updateCam(dt);
}
function update(dt){
  pollGamepads();
  if(screen==='menu'){updateMenu(dt);updateCam(dt);}
  else{
    updateGame(dt);
    if(typeof HARNESS !== 'undefined' && HARNESS.active){
      try{ harnessTick(dt); }catch(e){}
    }
  }
  if(typeof updateVoiceProximity==='function')updateVoiceProximity(dt);
}

/* ================= text/ui ================= */
function txt(s,x,y,font,col,align,alpha){
  g.save();
  if(alpha!==undefined)g.globalAlpha=alpha;
  g.font=font;g.fillStyle=col;g.textAlign=align||'center';g.textBaseline='middle';
  g.fillText(s,x,y);g.restore();
}
function ptxt(s,x,y,font,fill,align,lw){
  g.save();
  g.font=font;g.textAlign=align||'center';g.textBaseline='middle';g.lineJoin='round';
  const m=/([0-9.]+)px/.exec(font);
  g.strokeStyle=INK;g.lineWidth=lw||Math.max(3,(m?parseFloat(m[1]):14)*0.16);
  g.strokeText(s,x,y);
  g.fillStyle=fill||'#ffffff';g.fillText(s,x,y);
  g.restore();
}
function pill(x,y,w,h,fill,stroke){
  rr(g,x,y,w,h,h/2);
  g.fillStyle=fill;g.fill();
  if(stroke){g.lineWidth=2.5;g.strokeStyle=stroke;g.stroke();}
}
function fmtTime(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function simpleButton(x,y,w,h,label,fn,sub){
  const pulse=1+0.015*Math.sin(tGlobal*4);
  g.save();
  g.translate(x+w/2,y+h/2);g.scale(pulse,pulse);g.translate(-w/2,-h/2);
  rr(g,0,0,w,h,h/2);
  g.fillStyle='#ffffff';g.fill();
  g.lineWidth=3;g.strokeStyle=INK;g.stroke();
  txt(label,w/2,h/2+(sub?-6:1),FN(Math.min(24,h*0.4),900),'#1c6b38');
  if(sub)txt(sub,w/2,h*0.76,FN(10,700),'#5a8f6d');
  g.restore();
  zone(x,y,w,h,{fn:fn});
}
function padGlyph(x,y,s,lit){
  g.save();
  g.translate(x,y);
  rr(g,-s,-s*0.6,s*2,s*1.2,s*0.5);
  g.fillStyle=lit?'#3a5a3a':'#22301c';g.fill();
  g.lineWidth=2.5;g.strokeStyle=lit?'#ffffff':'rgba(255,255,255,0.4)';g.stroke();
  g.fillStyle=lit?'#ffffff':'rgba(255,255,255,0.4)';
  g.fillRect(-s*0.55,-s*0.12,s*0.5,s*0.24);
  g.fillRect(-s*0.42,-s*0.36,s*0.24,s*0.72);
  g.beginPath();g.arc(s*0.45,-s*0.15,s*0.14,0,TAU);g.fill();
  g.beginPath();g.arc(s*0.65,s*0.1,s*0.14,0,TAU);g.fill();
  g.restore();
}

/* ================= characters with ghost trails ================= */
function drawChar(gx,x,y,size,col,o){
  o=o||{};
  const f=o.face||'idle';
  const moving=o.moving&&o.grounded;
  gx.save();
  const shx=o.shake?(Math.random()-0.5)*o.shake:0;
  gx.translate(x+size/2+shx,y+size);
  gx.rotate(o.tilt||0);
  gx.scale(o.sx||1,o.sy||1);
  gx.translate(-size/2,-size);
  if(o.grounded&&!moving){
    gx.fillStyle=INK;
    rr(gx,size*0.2,size*0.94,size*0.2,size*0.12,size*0.06);gx.fill();
    rr(gx,size*0.6,size*0.94,size*0.2,size*0.12,size*0.06);gx.fill();
  }
  rr(gx,0,0,size,size,size*0.14);
  gx.fillStyle=col;gx.fill();
  gx.lineWidth=Math.max(2.5,size*0.09);gx.strokeStyle=INK;gx.stroke();
  gx.save();rr(gx,0,0,size,size,size*0.14);gx.clip();
  gx.fillStyle='rgba(255,255,255,0.20)';
  rr(gx,size*0.08,size*0.06,size*0.5,size*0.16,size*0.08);gx.fill();
  gx.fillStyle='rgba(0,0,0,0.14)';
  gx.fillRect(0,size*0.78,size,size*0.22);
  gx.restore();
  const lx=(o.lookX||0),ly=(o.lookY||0);
  const fx=lx*size*0.06+(o.fdir||0)*size*0.02,fy=ly*size*0.05;
  const ex1=size*0.33+fx,ex2=size*0.67+fx,ey=size*0.42+fy;
  const ew=size*0.13;let eh=size*0.17;
  gx.fillStyle=INK;
  if(f==='land'||f==='happy'){
    gx.lineWidth=size*0.06;gx.strokeStyle=INK;gx.lineCap='round';
    gx.beginPath();gx.moveTo(ex1-ew*0.7,ey+ew*0.5);gx.lineTo(ex1,ey-ew*0.4);gx.lineTo(ex1+ew*0.7,ey+ew*0.5);gx.stroke();
    gx.beginPath();gx.moveTo(ex2-ew*0.7,ey+ew*0.5);gx.lineTo(ex2,ey-ew*0.4);gx.lineTo(ex2+ew*0.7,ey+ew*0.5);gx.stroke();
    gx.fillStyle='rgba(255,120,150,0.55)';
    gx.beginPath();gx.arc(size*0.18,size*0.6,size*0.06,0,TAU);gx.fill();
    gx.beginPath();gx.arc(size*0.82,size*0.6,size*0.06,0,TAU);gx.fill();
  }else if(f==='tagged'){
    gx.lineWidth=size*0.05;gx.strokeStyle=INK;gx.lineCap='round';
    gx.beginPath();gx.moveTo(ex1-ew*0.7,ey-ew*0.7);gx.lineTo(ex1+ew*0.7,ey+ew*0.7);gx.moveTo(ex1+ew*0.7,ey-ew*0.7);gx.lineTo(ex1-ew*0.7,ey+ew*0.7);gx.stroke();
    gx.beginPath();gx.moveTo(ex2-ew*0.7,ey-ew*0.7);gx.lineTo(ex2+ew*0.7,ey+ew*0.7);gx.moveTo(ex2+ew*0.7,ey-ew*0.7);gx.lineTo(ex2-ew*0.7,ey+ew*0.7);gx.stroke();
  }else{
    if(o.blink)eh=size*0.05;
    if(f==='fall')eh=size*0.24;
    gx.fillRect(ex1-ew/2,ey-eh/2,ew,eh);
    gx.fillRect(ex2-ew/2,ey-eh/2,ew,eh);
    if(!o.blink){
      gx.fillStyle='rgba(255,255,255,0.9)';
      const gl=Math.max(1.5,size*0.045);
      gx.fillRect(ex1-ew*0.28,ey-eh*0.32,gl,gl);
      gx.fillRect(ex2-ew*0.28,ey-eh*0.32,gl,gl);
      gx.fillStyle=INK;
    }
  }
  const mx=size*0.5+fx*0.5,my=size*0.7+fy*0.4;
  if(f==='idle')gx.fillRect(mx-size*0.07,my-size*0.025,size*0.14,size*0.05);
  else if(f==='run')gx.fillRect(mx-size*0.09,my-size*0.05,size*0.18,size*0.1);
  else if(f==='jump')gx.fillRect(mx-size*0.05,my-size*0.05,size*0.1,size*0.1);
  else if(f==='fall'||f==='tagged'){gx.beginPath();gx.arc(mx,my,size*0.08,0,TAU);gx.fill();}
  else if(f==='land'||f==='happy')gx.fillRect(mx-size*0.12,my-size*0.06,size*0.24,size*0.11);
  else if(f==='sad')gx.fillRect(mx-size*0.07,my+size*0.02,size*0.14,size*0.045);
  gx.restore();
}
function faceFor(p){
  if(match.state==='result')return match.result.loser===match.players.indexOf(p)?'sad':'happy';
  if(p.tagT>0)return'tagged';
  if(p.landT>0)return'land';
  if(!p.grounded)return p.vy<0?'jump':'fall';
  if(Math.abs(p.vx)>60)return'run';
  return'idle';
}

/* ===== PROFESSIONAL 2.5D PLATFORMS WITH DYNAMIC MATERIALS & DEPTH ===== */
function drawPlat(s){
  g.save();
  
  /* 1. SOFT 2.5D DROP SHADOW */
  g.fillStyle='rgba(0,0,0,0.32)';
  if(!s.dy){
    g.fillRect(s.x+4, s.y+s.h, s.w-8, 7);
  }else{
    g.beginPath();
    g.moveTo(s.x+4, s.y+s.h);
    g.lineTo(s.x+s.w-4, s.y+s.dy+s.h);
    g.lineTo(s.x+s.w-4, s.y+s.dy+s.h+7);
    g.lineTo(s.x+4, s.y+s.h+7);
    g.closePath();
    g.fill();
  }
  
  if(!s.dy){
    /* ---------------- FLAT PLATFORM ---------------- */
    if(s.t==='drop'){
      /* === PINK DROP-THROUGH PLATFORM: Luminous Cyber Safety Grate === */
      // Base dark frame
      g.fillStyle='#9e1b5c';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Semi-transparent vibrant pink core
      g.fillStyle='rgba(235, 75, 155, 0.88)';
      g.fillRect(s.x+2, s.y+2, s.w-4, s.h-4);
      // Animated downward drop affordance chevrons
      const pulse=0.45+0.35*Math.sin(tGlobal*4.5);
      g.fillStyle='rgba(255,255,255,'+pulse.toFixed(2)+')';
      for(let x=s.x+18; x<s.x+s.w-12; x+=32){
        g.beginPath();
        g.moveTo(x-6, s.y+8);
        g.lineTo(x, s.y+15);
        g.lineTo(x+6, s.y+8);
        g.lineTo(x+4, s.y+6);
        g.lineTo(x, s.y+11);
        g.lineTo(x-4, s.y+6);
        g.closePath();
        g.fill();
      }
      // Glowing neon top laser rail
      g.fillStyle='rgba(255,190,225,0.92)';
      g.fillRect(s.x, s.y, s.w, 3);
      g.lineWidth=2; g.strokeStyle='#3e081e';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else if(s.t==='speed'){
      /* === ORANGE SPEEDWAY: Animated High-Speed Conveyor Belt === */
      // Dark chassis base
      g.fillStyle='#1e2229';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Vibrant safety orange running belt
      g.fillStyle='#f07818';
      g.fillRect(s.x+2, s.y+2, s.w-4, s.h-4);
      // Animated chevrons radiating outward from the middle <<> >>.
      // (Speed boosts all directions, so the pad must not imply left or right.)
      // d grows with scroll so chevrons travel OUTWARD, matching where they point.
      const scroll=(tGlobal*200)%36;
      const cxm=s.x+s.w/2;
      g.save();
      g.beginPath(); g.rect(s.x+8, s.y+3, s.w-16, s.h-6); g.clip();
      g.fillStyle='rgba(255,240,130,0.92)';
      const chevR=(x,dir)=>{
        g.beginPath();
        g.moveTo(x-8*dir, s.y+5);
        g.lineTo(x+3*dir, s.y+s.h/2);
        g.lineTo(x-8*dir, s.y+s.h-5);
        g.lineTo(x-3*dir, s.y+s.h-5);
        g.lineTo(x+8*dir, s.y+s.h/2);
        g.lineTo(x-3*dir, s.y+5);
        g.closePath();
        g.fill();
      };
      for(let d=scroll; d<s.w/2-8; d+=36){chevR(cxm+d,1);chevR(cxm-d,-1);}
      /* Hollow center diamond: two arrow outlines tip-to-tip (<>), the outward-flow origin */
      const dcy=s.y+s.h/2,ds=Math.min(13,(s.h-10)/2);
      g.lineWidth=Math.max(2.5,ds*0.35);g.lineJoin='round';g.lineCap='round';
      g.strokeStyle='rgba(255,240,130,0.95)';
      g.beginPath(); /* left arrow < */
      g.moveTo(cxm-ds*0.2, dcy-ds);
      g.lineTo(cxm-ds*1.1, dcy);
      g.lineTo(cxm-ds*0.2, dcy+ds);
      g.stroke();
      g.beginPath(); /* right arrow > */
      g.moveTo(cxm+ds*0.2, dcy-ds);
      g.lineTo(cxm+ds*1.1, dcy);
      g.lineTo(cxm+ds*0.2, dcy+ds);
      g.stroke();
      g.restore();
      // Mechanical end roller caps
      g.fillStyle='#64748b';
      rr(g, s.x, s.y+1, 8, s.h-2, 3); g.fill();
      rr(g, s.x+s.w-8, s.y+1, 8, s.h-2, 3); g.fill();
      // Glowing amber top edge
      g.fillStyle='rgba(255,255,255,0.45)';
      g.fillRect(s.x+8, s.y+1, s.w-16, 2);
      g.lineWidth=2; g.strokeStyle='#141414';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else if(s.t==='boost'){
      /* === BLUE BOOST PLATFORM: Pneumatic Hydraulic Launch Spring === */
      // Heavy metallic housing
      g.fillStyle='#1e293b';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Visible twin spring coils
      g.strokeStyle='#94a3b8'; g.lineWidth=3;
      for(let k of [s.x+s.w*0.25, s.x+s.w*0.75]){
        g.beginPath();
        g.moveTo(k-8, s.y+s.h-4); g.lineTo(k+8, s.y+s.h-8);
        g.lineTo(k-8, s.y+s.h-12); g.lineTo(k+8, s.y+s.h-16);
        g.stroke();
      }
      // Top electric blue launch plate
      g.fillStyle='#2563eb';
      g.fillRect(s.x+3, s.y+1, s.w-6, s.h*0.55);
      // Concentric pulsing energy ripple
      const rip=(tGlobal*28)%(s.w*0.35);
      g.strokeStyle='rgba(147, 197, 253, 0.7)'; g.lineWidth=2;
      g.beginPath();
      g.ellipse(s.x+s.w/2, s.y+s.h*0.3, Math.min(s.w*0.38, rip+12), 4, 0, 0, TAU);
      g.stroke();
      // Emissive cyan top highlight
      g.fillStyle='rgba(255,255,255,0.7)';
      g.fillRect(s.x+6, s.y+1, s.w-12, 2.5);
      g.lineWidth=2.5; g.strokeStyle='#0f172a';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else{
      /* === SOLID PLATFORM: Tangible Distressed Hardwood & Iron Bevels === */
      // Deep 3D bottom bevel
      g.fillStyle='#23140b';
      g.fillRect(s.x, s.y+s.h-5, s.w, 5);
      // Warm rich wood/stone slab
      g.fillStyle='#4c301c';
      g.fillRect(s.x, s.y, s.w, s.h-5);
      // Plank division seams every 72px
      for(let px=s.x+72; px<s.x+s.w-20; px+=72){
        g.fillStyle='#1f1109';
        g.fillRect(px, s.y+1, 2, s.h-6);
        g.fillStyle='rgba(255,255,255,0.08)';
        g.fillRect(px+2, s.y+1, 1, s.h-6);
      }
      // Subtle metallic corner bracket rivets
      g.fillStyle='#d4af37';
      for(let rx of [s.x+8, s.x+s.w-8]){
        g.beginPath(); g.arc(rx, s.y+s.h/2-2, 2.2, 0, TAU); g.fill();
      }
      // Crisp top bevel highlight
      g.fillStyle='rgba(255,255,255,0.18)';
      g.fillRect(s.x, s.y+1, s.w, 3);
      g.lineWidth=2; g.strokeStyle='#141414';
      g.strokeRect(s.x, s.y, s.w, s.h);
    }
    
  }else{
    /* ---------------- TILTED PLATFORM / SLOPE ---------------- */
    g.beginPath();
    g.moveTo(s.x, s.y);
    g.lineTo(s.x+s.w, s.y+s.dy);
    g.lineTo(s.x+s.w, s.y+s.dy+s.h);
    g.lineTo(s.x, s.y+s.h);
    g.closePath();
    
    if(s.t==='drop') g.fillStyle='#ba2671';
    else if(s.t==='speed') g.fillStyle='#e06b12';
    else if(s.t==='boost') g.fillStyle='#2563eb';
    else g.fillStyle='#442917';
    g.fill();
    
    // Tilted top highlight
    g.strokeStyle='rgba(255,255,255,0.22)';
    g.lineWidth=3;
    g.beginPath(); g.moveTo(s.x, s.y+1); g.lineTo(s.x+s.w, s.y+s.dy+1); g.stroke();
    // Tilted bottom shadow
    g.strokeStyle='#170b05';
    g.lineWidth=4;
    g.beginPath(); g.moveTo(s.x, s.y+s.h-2); g.lineTo(s.x+s.w, s.y+s.dy+s.h-2); g.stroke();
    // Border
    g.strokeStyle='#141414'; g.lineWidth=2;
    g.stroke();
  }
  
  g.restore();
}

function drawPlayers(){
  const P=match.players;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    const col=getPlayerColor(p);
    const isIt=settings.teams ? (p.team === match.itTeam && match.state !== 'result') : (match.it===i&&match.state!=='result');
    
    /* 1. Dynamic Contact Shadow on Ground/Platform */
    g.fillStyle='rgba(0,0,0,0.28)';
    g.beginPath();
    g.ellipse(p.x+p.w/2, p.y+p.h+1, p.w*0.42*(p.sx||1), 4.5*(p.sy||1), 0, 0, TAU);
    g.fill();
    
    /* Draw Ghost Afterimage Trails */
    for(let tr of p.trail){
      if(tr.alpha>0.02){
        g.save();
        g.globalAlpha=tr.alpha*0.38;
        drawChar(g,tr.x,tr.y,p.w,col,{face:'run',sx:1,sy:1,grounded:false,moving:true});
        g.restore();
      }
    }
    
    if(isIt){
      /* Pulsing fiery red-gold aura */
      const auraP=0.22+0.14*Math.sin(tGlobal*8);
      g.fillStyle='rgba(235, 60, 40, '+auraP.toFixed(2)+')';
      rr(g,p.x-8,p.y-8,p.w+16,p.h+16,14);g.fill();
      g.strokeStyle='rgba(255, 200, 40, 0.55)';
      g.lineWidth=2.5;
      rr(g,p.x-4,p.y-4,p.w+8,p.h+8,11);g.stroke();
    }
    drawChar(g,p.x,p.y,p.w,col,{
      face:faceFor(p),sx:p.sx,sy:p.sy,tilt:clamp(p.vx*0.00025,-0.1,0.1),
      lookX:clamp(p.vx/300,-1,1)*0.7+p.face*0.3,lookY:!p.grounded?(p.vy<0?-0.8:0.8):0,
      fdir:p.face,blink:p.blink>0,shake:p.tagT>0.45?4:0,
      moving:Math.abs(p.vx)>60,grounded:p.grounded,seed:p.seed
    });
    const teamBadge = settings.teams ? ((p.team === 0 ? ' [RED]' : (p.team === 1 ? ' [BLUE]' : ' [GRN]'))) : '';
    ptxt('P'+(p.slot+1)+teamBadge,p.x+p.w/2,p.y-12,FN(11,900),col);
    // Proximity voice speaking indicator
    if(typeof isPlayerSpeaking==='function' && isPlayerSpeaking(p.slot!=null?p.slot:i)){
      const spkY=p.y-26, spkX=p.x+p.w/2;
      const pulse=1+0.18*Math.sin(tGlobal*14);
      g.save();
      g.translate(spkX, spkY);
      g.scale(pulse, pulse);
      g.beginPath();g.arc(0,0,10,0,TAU);
      g.fillStyle='rgba(46, 204, 113, 0.9)';g.fill();
      g.lineWidth=1.5;g.strokeStyle='#ffffff';g.stroke();
      ptxt('🎙️',0,0.5,FN(8.5,900),'#ffffff');
      g.strokeStyle='rgba(46, 204, 113, 0.65)';g.lineWidth=1.8;
      g.beginPath();g.arc(0,0,15,-0.6,0.6);g.stroke();
      g.beginPath();g.arc(0,0,15,Math.PI-0.6,Math.PI+0.6);g.stroke();
      g.restore();
    }
    if(match.state==='playing'&&match.cooldown>0){
      g.save();
      g.globalAlpha=0.3+0.2*Math.sin(tGlobal*8);
      g.strokeStyle='#ffffff';g.lineWidth=3;
      g.beginPath();g.arc(p.x+p.w/2,p.y+p.h/2,p.w*0.85,0,TAU);g.stroke();
      g.restore();
    }
  }
  if(match.state!=='result'){
    if(settings.teams && match.itTeam != null){
      for(const p of P){
        if(p.team === match.itTeam) drawITArrow(p);
      }
    } else {
      drawITArrow(P[match.it]);
    }
  }
}

function drawTagPop(){
  if(!match.tagPop)return;
  const tp=match.tagPop,k=1-clamp(tp.t/0.55,0,1);
  g.save();
  g.translate(tp.x,tp.y);
  g.globalAlpha=1-k;
  g.rotate(k*0.5);
  const R=40+k*170;
  g.fillStyle='#ffcf3f';
  g.beginPath();
  for(let i=0;i<16;i++){
    const a=TAU*i/16,rad=i%2===0?R:R*0.55;
    g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
  }
  g.closePath();g.fill();
  g.lineWidth=5;g.strokeStyle=INK;g.stroke();
  g.rotate(-k*0.5);
  const sc=0.6+easeOut(Math.min(1,k*3))*0.5;
  g.scale(sc,sc);
  g.font=FT(46);g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  g.strokeStyle=INK;g.lineWidth=8;g.strokeText('TAG!',0,0);
  g.fillStyle='#ffffff';g.fillText('TAG!',0,0);
  g.restore();
}

/* ================= MENU (Fully Responsive Layout) ================= */
function slotCardRects(){
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isPortrait = (CH > CW && CW < 640);
  const isShortH = (CH < 640);
  const isPhone2P = (isTouch && !isOnline && (CW < 950 || CH < 600));
  const r = [];

  if(isPhone2P){
    // Mobile Phone Local: 2 large, prominent, easy-to-tap cards centered
    const maxRowW = Math.min(CW - 24, 460);
    const gap = 16;
    const cw = Math.floor((maxRowW - gap) / 2);
    const chh = Math.floor(clamp(CH * 0.22, 80, 115));
    const totalW = 2 * cw + gap;
    const x0 = Math.floor(CW / 2 - totalW / 2);
    const y = Math.floor(clamp(CH * 0.23, 86, 175));
    r.push({ x: x0, y: y, w: cw, h: chh });
    r.push({ x: x0 + cw + gap, y: y, w: cw, h: chh });
    return r;
  }

  if(isPortrait){
    // Mobile Portrait: 2x2 Grid so cards never get squished or overflow screen
    const marginX = Math.max(10, Math.floor(CW * 0.035));
    const gapX = 10;
    const cw = Math.floor((CW - marginX * 2 - gapX) / 2);
    const chh = isOnline ? Math.floor(clamp(CH * 0.165, 125, 155)) : Math.floor(clamp(CH * 0.11, 75, 95));
    const gapY = 8;
    const y0 = Math.floor(Math.max(96, CH * 0.155));
    for(let i = 0; i < 4; i++){
      const col = i % 2;
      const row = Math.floor(i / 2);
      r.push({
        x: marginX + col * (cw + gapX),
        y: y0 + row * (chh + gapY),
        w: cw,
        h: chh
      });
    }
    return r;
  }

  // Landscape / Laptop / Desktop: 4 cards in a single row
  const marginX = Math.max(14, Math.floor(CW * 0.025));
  const maxRowW = Math.min(CW - marginX * 2, 880);
  const gap = Math.floor(clamp(CW * 0.016, 8, 22));
  const cw = Math.floor((maxRowW - gap * 3) / 4);

  // Height adapts dynamically to CH so cards NEVER crush menu rows below
  const chh = isOnline
    ? Math.floor(clamp(CH * 0.23, isShortH ? 112 : 132, 180))
    : Math.floor(clamp(CH * 0.15, 65, 105));

  const totalW = 4 * cw + 3 * gap;
  const x0 = Math.floor(CW / 2 - totalW / 2);
  // Safely position below TAG title
  const y = isOnline
    ? Math.floor(clamp(CH * (isShortH ? 0.17 : 0.21), isShortH ? 82 : 110, 190))
    : Math.floor(clamp(CH * 0.24, 90, 210));

  for(let i = 0; i < 4; i++){
    r.push({ x: x0 + i * (cw + gap), y: y, w: cw, h: chh });
  }
  return r;
}

/* ================= MINI MAP RENDERER FOR MODAL ================= */
function drawMiniMap(gx, mIdx, mx, my, mw, mh){
  const M = MAPS[mIdx % MAPS.length];
  if(!M) return;
  gx.save();
  rr(gx, mx, my, mw, mh, 6);
  gx.clip();
  const bgGr = gx.createLinearGradient(mx, my, mx, my + mh);
  bgGr.addColorStop(0, '#100c1e');
  bgGr.addColorStop(1, '#221325');
  gx.fillStyle = bgGr;
  gx.fillRect(mx, my, mw, mh);

  const sx = mw / 2400, sy = mh / 1350;

  // Outer walls
  gx.fillStyle = '#2d1b24';
  const wallTh = 46 * sy;
  gx.fillRect(mx, my, mw, wallTh);
  gx.fillRect(mx, my + mh - wallTh, mw, wallTh);
  gx.fillRect(mx, my, 46 * sx, mh);
  gx.fillRect(mx + mw - 46 * sx, my, 46 * sx, mh);

  // Solids
  gx.fillStyle = '#7a5a43';
  for(const a of M.solids){
    gx.fillRect(mx + a[0] * sx, my + a[1] * sy, Math.max(2, a[2] * sx), Math.max(2, (a[3] || 26) * sy));
  }
  // Drops (pink)
  gx.fillStyle = '#eb4b9b';
  for(const a of M.drops){
    gx.fillRect(mx + a[0] * sx, my + a[1] * sy, Math.max(2, a[2] * sx), Math.max(2, (a[3] || 24) * sy));
  }
  // Speeds (cyan)
  gx.fillStyle = '#00d2d3';
  for(const a of M.speeds){
    gx.fillRect(mx + a[0] * sx, my + a[1] * sy, Math.max(2, a[2] * sx), Math.max(2, (a[3] || 26) * sy));
  }
  // Boosts (yellow/gold)
  gx.fillStyle = '#ffd166';
  for(const a of M.boosts){
    gx.fillRect(mx + a[0] * sx, my + a[1] * sy, Math.max(2, a[2] * sx), Math.max(2, (a[3] || 26) * sy));
  }
  gx.restore();

  rr(gx, mx, my, mw, mh, 6);
  gx.lineWidth = 1.5;
  gx.strokeStyle = (mIdx === settings.map) ? '#2ecc71' : 'rgba(255,255,255,0.2)';
  gx.stroke();
}

function cycleMap(d){
  if(settings.randomMap){
    settings.randomMap = false;
    settings.map = (d > 0) ? 0 : (MAPS.length - 1);
  } else {
    if(d > 0 && settings.map === MAPS.length - 1){
      settings.randomMap = true;
    } else if(d < 0 && settings.map === 0){
      settings.randomMap = true;
    } else {
      settings.map = (settings.map + d + MAPS.length) % MAPS.length;
    }
  }
  buildLevel();
  sfx('ui');
}

  const logoW = 76;
  ptxt('TAG!', 14 + logoW * 0.4, headY + headH * 0.52, FT(logoFs), '#ffffff');

  // Mode Navigation Tabs (Pills in Center: Local Party & 1P Solo with BETA badge)
  const modeTabs = [
    { id: '2p', label: '👥 2-4P PARTY', short: '👥 PARTY' },
    { id: 'solo', label: '🤖 1P SOLO', short: '🤖 SOLO', badge: 'BETA' }
  ];
  const tabW = clamp((themeX - 14 - logoW - 20) / modeTabs.length, isNarrowW ? 85 : 120, 160);
  const tabH = clamp(headH * 0.84, 28, 36);
  const tabsTotalW = tabW * modeTabs.length + (modeTabs.length - 1) * 8;
  const tabsX = Math.max(14 + logoW + 8, Math.floor(CW / 2 - tabsTotalW / 2));

  for(let t = 0; t < modeTabs.length; t++){
    const tab = modeTabs[t];
    const tx = tabsX + t * (tabW + 8);
    const ty = headY + (headH - tabH) / 2;
    const isAct = (menu.tab === tab.id);

    rr(g, tx, ty, tabW, tabH, 8);
    g.fillStyle = isAct ? '#ffffff' : 'rgba(255,255,255,0.12)';
    g.fill();
    g.lineWidth = isAct ? 2.5 : 1.5;
    g.strokeStyle = isAct ? INK : 'rgba(255,255,255,0.25)';
    g.stroke();

    const tLabel = isNarrowW ? tab.short : tab.label;
    const tFs = clamp(tabW * 0.095, 11, 13.5);
    if(isAct){
      txt(tLabel, tx + tabW/2, ty + tabH/2 + 1, FN(tFs, 900), '#0f172a');
    } else {
      txt(tLabel, tx + tabW/2, ty + tabH/2 + 1, FN(tFs, 800), '#cbd5e1');
    }

    if(tab.badge){
      const bW = 32, bH = 15;
      const bX = tx + tabW - bW - 2, bY = ty - 5;
      rr(g, bX, bY, bW, bH, 4);
      g.fillStyle = '#ff4757'; g.fill();
      g.lineWidth = 1; g.strokeStyle = '#ffffff'; g.stroke();
      txt(tab.badge, bX + bW/2, bY + bH/2 + 1, FN(8.5, 900), '#ffffff');
    }

    zone(tx, ty, tabW, tabH, { fn: () => setMenuTab(tab.id) });
  }

  // 3. Layout vertical budgeting
  const headerBottom = headY + headH + (isShortH ? 4 : 6);
  const bottomMargin = isTouch ? Math.max(14, isShortH ? 12 : 20) : (isShortH ? 6 : 12);
  const startBtnH = clamp(CH * 0.080, isShortH ? 32 : 36, 44);
  const startBtnW = Math.min(CW - 28, 340);
  const startBtnY = CH - startBtnH - bottomMargin;

  // Settings strip directly above start button
  const stripH = isNarrowW ? (isShortH ? 56 : 64) : clamp(CH * 0.075, isShortH ? 30 : 34, 40);
  const stripW = Math.min(CW - 24, 880);
  const stripX = Math.floor(CW/2 - stripW/2);
  const stripY = startBtnY - stripH - (isShortH ? 4 : 8);

  // Center Stage Area
  const stageY = headerBottom;
  const stageH = Math.max(70, stripY - stageY - (isShortH ? 4 : 6));

  // 4. Center Stage Content (1P SOLO, 2-4 PLAYERS & TEAMS)
  const isSolo = (menu.tab === 'solo');
  const isTeams = (settings.teams && !isSolo);
  if(isSolo) settings.teams = false;

  // Determine active slots
  let actSlots = [0];
  if(isSolo){
    actSlots = [0, 1]; // P1 Human, P2 BOT
  } else {
    if(menu.slotColor[0] < 0) menu.slotColor[0] = 0;
    if(menu.slotColor[1] < 0) menu.slotColor[1] = 1;
    actSlots = [0, 1];
    if(menu.slotColor[2] >= 0) actSlots.push(2);
    if(menu.slotColor[3] >= 0) actSlots.push(3);
  }

  // Top sub-header in stage: Player count pills, Team Tag header, or Bot Difficulty pills
  const stageTopPad = clamp(stageH * 0.13, 24, 30);
  const pillY = stageY + 2;
  const ph = stageTopPad - 4;

  if(isSolo){
    const diffOpts = [
      { id: 'easy', label: '⚡ EASY', col: '#2ed573' },
      { id: 'hard', label: '🔥 HARD (DEF)', col: '#ff4757' }
    ];
    const pw = clamp(CW * 0.20, 78, 115);
    const totalPillsW = diffOpts.length * pw + (diffOpts.length - 1) * 8;
    const pillsStartX = Math.floor(CW / 2 - totalPillsW / 2);

    txt('BOT DIFFICULTY:', pillsStartX - 10, pillY + ph/2 + 1, FN(clamp(CW * 0.024, 10, 11.5), 900), 'rgba(255,255,255,0.75)', 'right');

    for(let k = 0; k < diffOpts.length; k++){
      const opt = diffOpts[k];
      const px = pillsStartX + k * (pw + 8);
      const isCur = ((menu.botDifficulty || 'hard') === opt.id);
      rr(g, px, pillY, pw, ph, 6);
      g.fillStyle = isCur ? opt.col : 'rgba(255,255,255,0.12)';
      g.fill();
      g.lineWidth = isCur ? 2 : 1;
      g.strokeStyle = isCur ? '#ffffff' : 'rgba(255,255,255,0.25)';
      g.stroke();
      txt(opt.label, px + pw/2, pillY + ph/2 + 1, FN(10.5, 900), isCur ? '#ffffff' : '#cbd5e1');

      zone(px, pillY, pw, ph, { fn: () => setBotDifficulty(opt.id) });
    }

    // Direct button to launch training harness for the current map
    const trainBtnX = pillsStartX + totalPillsW + 12;
    const trainBtnW = clamp(CW * 0.22, 110, 145);
    if(trainBtnX + trainBtnW < CW - 12){
      rr(g, trainBtnX, pillY, trainBtnW, ph, 6);
      g.fillStyle = 'rgba(46, 213, 115, 0.18)';
      g.fill();
      g.lineWidth = 1.5;
      g.strokeStyle = '#2ed573';
      g.stroke();
      txt('🎯 TRAIN BOT', trainBtnX + trainBtnW / 2, pillY + ph / 2 + 1, FN(10.5, 900), '#2ed573');
      zone(trainBtnX, pillY, trainBtnW, ph, { fn: () => harnessStart(settings.map) });
    }
  } else {
    const countOpts = [2, 3, 4];
    const pw = clamp(CW * 0.16, 56, 84);
    const totalPillsW = countOpts.length * pw + (countOpts.length - 1) * 6;
    const pillsStartX = Math.floor(CW / 2 - totalPillsW / 2);

    if(isTeams){
      let redCount = 0, blueCount = 0;
      for(const s of actSlots){
        const t = (menu.slotTeam && menu.slotTeam[s] != null) ? (menu.slotTeam[s] % 2) : (s % 2);
        if(t === 0) redCount++; else blueCount++;
      }
      const ratioStr = '⚔️ ' + redCount + ' RED vs ' + blueCount + ' BLUE:';
      txt(ratioStr, pillsStartX - 10, pillY + ph/2 + 1, FN(clamp(CW * 0.024, 10, 12), 900), '#ffd166', 'right');
    } else {
      txt('LOCAL PLAYERS:', pillsStartX - 10, pillY + ph/2 + 1, FN(10.5, 900), 'rgba(255,255,255,0.75)', 'right');
    }

    for(let k = 0; k < countOpts.length; k++){
      const numP = countOpts[k];
      const px = pillsStartX + k * (pw + 6);
      const isCurCount = (actSlots.length === numP);
      rr(g, px, pillY, pw, ph, 6);
      g.fillStyle = isCurCount ? '#2ed573' : 'rgba(255,255,255,0.12)';
      g.fill();
      g.lineWidth = isCurCount ? 2 : 1;
      g.strokeStyle = isCurCount ? '#ffffff' : 'rgba(255,255,255,0.25)';
      g.stroke();
      txt(numP + ' PLAYERS', px + pw/2, pillY + ph/2 + 1, FN(10.5, 900), isCurCount ? '#ffffff' : '#cbd5e1');

      zone(px, pillY, pw, ph, { fn: () => {
        if(numP === 2){ menu.slotColor[2] = -1; menu.slotColor[3] = -1; sfx('ui'); }
        else if(numP === 3){ menu.slotColor[2] = 2; menu.slotColor[3] = -1; sfx('ok'); }
        else if(numP === 4){ menu.slotColor[2] = 2; menu.slotColor[3] = 3; sfx('ok'); }
      }});
    }
  }

  const cardsAreaY = stageY + stageTopPad;
  const cardsAreaH = stageH - stageTopPad;

  // Check if 4 cards should wrap to 2x2 grid on small mobile
  const use2x2 = (!isSolo && actSlots.length === 4 && CW < 680);
  const showAddCard = (!isSolo && actSlots.length < 4 && CW >= 580 && !use2x2);
  const totalItems = actSlots.length + (showAddCard ? 1 : 0);

  const cardGap = clamp(CW * 0.016, 6, 14);
  const maxGridW = Math.min(CW - 20, 920);

  if(use2x2){
    // 2x2 grid on small phones for 4 players
    const cW = Math.floor((maxGridW - cardGap) / 2);
    const cH = Math.floor((cardsAreaH - cardGap) / 2);
    for(let idx = 0; idx < 4; idx++){
      const colIdx = idx % 2;
      const rowIdx = Math.floor(idx / 2);
      const cx = Math.floor(CW / 2 - maxGridW / 2) + colIdx * (cW + cardGap);
      const cy = cardsAreaY + rowIdx * (cH + cardGap);
      drawPlayerCard(cx, cy, cW, cH, actSlots[idx], false, true);
    }
  } else {
    // Single horizontal row
    const cardW = Math.floor(clamp((maxGridW - (totalItems - 1) * cardGap) / totalItems, 95, 205));
    const cardH = Math.floor(clamp(cardsAreaH * 0.94, Math.min(80, cardsAreaH), 215));
    const totalRowW = totalItems * cardW + (totalItems - 1) * cardGap;
    const startX = Math.floor(CW / 2 - totalRowW / 2);
    const cardY = Math.floor(cardsAreaY + (cardsAreaH - cardH) / 2);

    for(let k = 0; k < actSlots.length; k++){
      const slot = actSlots[k];
      const cx = startX + k * (cardW + cardGap);
      const isBot = (isSolo && slot === 1);
      drawPlayerCard(cx, cardY, cardW, cardH, slot, isBot, !isSolo && slot >= 2);
    }

    // Draw "+ ADD PLAYER" card if slots available
    if(showAddCard){
      const nextSlot = actSlots.length;
      const addX = startX + actSlots.length * (cardW + cardGap);
      drawAddPlayerCard(addX, cardY, cardW, cardH, nextSlot);
    }
  }

  // 4b. Online Multiplayer Coming Soon Sticker (Right Side of Screen)
  const isWideScreen = (CW >= 880);
  const isMediumScreen = (CW >= 680 && CW < 880);
  let stickW, stickH, stickX, stickY;
  if(isWideScreen){
    stickW = 186; stickH = 88;
    stickX = CW - stickW - 20;
    stickY = headY + headH + 18;
  } else if(isMediumScreen){
    stickW = 152; stickH = 76;
    stickX = CW - stickW - 14;
    stickY = headY + headH + 12;
  } else {
    stickW = clamp(CW * 0.40, 130, 160);
    stickH = clamp(CH * 0.13, 58, 72);
    stickX = CW - stickW - 10;
    stickY = headY + headH + 6;
  }

  g.save();
  const scx = stickX + stickW / 2;
  const scy = stickY + stickH / 2;
  g.translate(scx, scy);
  g.rotate(-0.06); // ~-3.5 degrees sticker tilt
  g.translate(-stickW / 2, -stickH / 2);

  // Soft drop shadow
  rr(g, 3, 5, stickW, stickH, 12);
  g.fillStyle = 'rgba(0, 0, 0, 0.45)'; g.fill();

  // Die-cut white vinyl border
  rr(g, -3, -3, stickW + 6, stickH + 6, 14);
  g.fillStyle = '#ffffff'; g.fill();
  g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();

  // Sticker inner body
  rr(g, 0, 0, stickW, stickH, 11);
  g.fillStyle = '#161329'; g.fill();

  // Glowing border pulse
  const stickerPulse = 0.55 + 0.35 * Math.sin(tGlobal * 5);
  g.lineWidth = 2;
  g.strokeStyle = 'rgba(46, 204, 113, ' + stickerPulse + ')';
  g.stroke();

  // 1. "COMING SOON" in BIG LETTERS
  const bigFs = clamp(stickH * 0.28, 14, 19);
  ptxt('🚀 COMING SOON', stickW / 2, stickH * 0.28, FT(bigFs), '#ffd166');

  // 2. "online multiplayer" in small
  const smallFs = clamp(stickH * 0.16, 9.5, 12);
  txt('🌐 Online Multiplayer', stickW / 2, stickH * 0.54, FN(smallFs, 800), '#e2e8f0');

  // 3. Note: "Target: ~Sept 31 (Tentative)"
  const notePillW = stickW - 16;
  const notePillH = Math.floor(stickH * 0.25);
  const notePillY = stickH - notePillH - 6;
  pill(8, notePillY, notePillW, notePillH, 'rgba(46, 204, 113, 0.20)', 'rgba(46, 204, 113, 0.6)');
  txt('📅 Target: ~Sept 31 (Tentative)', stickW / 2, notePillY + notePillH / 2 + 1, FN(clamp(notePillH * 0.52, 8.5, 10.5), 900), '#2ecc71');
  g.restore();

  // Click zone for the sticker to open more info modal
  zone(stickX - 6, stickY - 6, stickW + 12, stickH + 12, { fn: () => { menu.onlineModal = true; sfx('ok'); } });

  // 4c. SOLO v BOT BETA Sticker (Left Side of Screen - BIGGER & ANIMATED PLAYER!)
  // "The player charecter give it some expression(live and slight movements like every 3 secs) and make the sticker bigger"
  let soloW, soloH, soloX, soloY;
  if(isWideScreen){
    soloW = 240; soloH = 118;
    soloX = 20;
    soloY = headY + headH + 14;
  } else if(isMediumScreen){
    soloW = 196; soloH = 100;
    soloX = 14;
    soloY = headY + headH + 10;
  } else {
    soloW = clamp(CW * 0.48, 155, 195);
    soloH = clamp(CH * 0.17, 74, 94);
    soloX = 10;
    soloY = headY + headH + 6;
  }

  g.save();
  const solocx = soloX + soloW / 2;
  const solocy = soloY + soloH / 2;
  g.translate(solocx, solocy);
  g.rotate(0.055); // ~+3.2 degrees counter-tilt towards center
  g.translate(-soloW / 2, -soloH / 2);

  // Soft drop shadow
  rr(g, 3, 5, soloW, soloH, 14);
  g.fillStyle = 'rgba(0, 0, 0, 0.45)'; g.fill();

  // Die-cut white vinyl border
  rr(g, -3, -3, soloW + 6, soloH + 6, 16);
  g.fillStyle = '#ffffff'; g.fill();
  g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();

  // Inner card body (deep arcade violet/indigo)
  rr(g, 0, 0, soloW, soloH, 13);
  g.fillStyle = '#1c1335'; g.fill();

  // Animated warm glowing pulse
  const soloPulse = 0.55 + 0.35 * Math.sin(tGlobal * 6);
  g.lineWidth = 2;
  g.strokeStyle = 'rgba(255, 107, 129, ' + soloPulse + ')';
  g.stroke();

  // Live expression & slight movement cycle every 3s
  const cycleT = (tGlobal % 3.0);
  let charFace = 'cool';
  let charHopY = 0;
  let charTilt = 0;
  let charBlink = false;

  if(cycleT < 0.45){
    // Cheerful hop & happy face!
    charFace = 'happy';
    charHopY = -Math.sin(cycleT / 0.45 * Math.PI) * 9;
    charTilt = Math.sin(cycleT / 0.45 * Math.PI * 2) * 0.14;
  } else if(cycleT >= 1.5 && cycleT < 1.7){
    // Natural blink
    charBlink = true;
    charFace = 'idle';
  } else if(cycleT >= 2.1 && cycleT < 2.55){
    // Curious energetic lean
    charFace = 'run';
    charTilt = Math.sin((cycleT - 2.1) / 0.45 * Math.PI) * 0.10;
  }

  // Draw cute animated player character on the left side of the sticker!
  const charSz = clamp(soloH * 0.38, 32, 44);
  const charX = 22;
  const charY = Math.floor(soloH * 0.34 + charHopY);
  drawChar(g, charX, charY, charSz, '#ff4757', {
    face: charFace,
    tilt: charTilt,
    blink: charBlink,
    moving: (charHopY !== 0),
    grounded: (charHopY === 0),
    seed: 7
  });

  // Sticker text (right side of character)
  const soloTxtX = charX + charSz + 10;

  // Title: SOLO v BOT
  txt('🤖 1P SOLO v BOT', soloTxtX, soloH * 0.22, FT(clamp(soloH * 0.155, 12, 16)), '#ffd166', 'left');

  // Sub-badge: BETA TESTING
  const betaW = soloW - soloTxtX - 12;
  const betaH = Math.floor(soloH * 0.21);
  pill(soloTxtX, soloH * 0.38, betaW, betaH, 'rgba(255, 71, 87, 0.22)', '#ff4757');
  txt('⚡ BETA TESTING', soloTxtX + betaW / 2, soloH * 0.38 + betaH / 2 + 1, FN(clamp(betaH * 0.52, 9, 11), 900), '#ff6b81');

  // Big Callout Button: TRY NOW!
  const tryBtnW = soloW - 22;
  const tryBtnH = Math.floor(soloH * 0.26);
  const tryBtnY = soloH - tryBtnH - 8;
  rr(g, 11, tryBtnY, tryBtnW, tryBtnH, 8);
  g.fillStyle = '#2ed573'; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = '#ffffff'; g.stroke();
  txt('▶ TRY NOW !', soloW / 2, tryBtnY + tryBtnH / 2 + 1, FT(clamp(tryBtnH * 0.56, 12, 15)), '#ffffff');

  g.restore();

  // Click zone for SOLO v BOT sticker
  zone(soloX - 6, soloY - 6, soloW + 12, soloH + 12, { fn: () => {
    setMenuTab('solo');
    toast('🤖 1P SOLO vs BOT ACTIVE');
    sfx('go');
  }});

  // 5. Settings Strip
  rr(g, stripX, stripY, stripW, stripH, 12);
  g.fillStyle = 'rgba(14, 18, 28, 0.94)'; g.fill();
  g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,0.18)'; g.stroke();

  const mapLabelText = settings.randomMap ? '🎲 RANDOM ARENA ▾' : ('🗺️ ' + (settings.map + 1) + '. ' + MAPS[settings.map].name + ' ▾');

  if(isNarrowW){
    // Statically stacked for narrow mobile phones
    const rowH1 = Math.floor(stripH / 2);
    // Row 1: Map Selector
    const mapY = stripY + 3;
    const arrowW = 34;
    // Left Arrow
    rr(g, stripX + 6, mapY, arrowW, rowH1 - 6, 6);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.30)'; g.stroke();
    txt('◀', stripX + 6 + arrowW/2, mapY + (rowH1 - 6)/2 + 1, FN(13, 900), '#ffffff');
    zone(stripX + 6, mapY, arrowW, rowH1 - 6, { fn: () => cycleMap(-1) });

    // Right Arrow
    const rightNarrowX = stripX + stripW - arrowW - 6;
    rr(g, rightNarrowX, mapY, arrowW, rowH1 - 6, 6);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.30)'; g.stroke();
    txt('▶', rightNarrowX + arrowW/2, mapY + (rowH1 - 6)/2 + 1, FN(13, 900), '#ffffff');
    zone(rightNarrowX, mapY, arrowW, rowH1 - 6, { fn: () => cycleMap(1) });

    // Middle Map Name (Opens Modal!)
    const mapMidW = stripW - arrowW * 2 - 24;
    const mapMidX = stripX + arrowW + 12;
    rr(g, mapMidX, mapY, mapMidW, rowH1 - 6, 6);
    g.fillStyle = settings.randomMap ? 'rgba(255, 209, 102, 0.25)' : 'rgba(255,255,255,0.18)'; g.fill();
    txt(mapLabelText, mapMidX + mapMidW/2, mapY + (rowH1 - 6)/2 + 1, FN(11.5, 900), settings.randomMap ? '#ffd166' : '#ffffff');
    zone(mapMidX, mapY, mapMidW, rowH1 - 6, { fn: () => { menu.mapModal = true; sfx('ok'); } });

    // Row 2: Chips (2x Jump, 120s Timer, and NEW GAMEMODE: Teams)
    const chipsY = stripY + rowH1 + 1;
    const chipW = Math.floor((stripW - 24) / 3);
    const chipH = rowH1 - 6;

    // Chip 1: Double Jump
    rr(g, stripX + 6, chipsY, chipW, chipH, 6);
    g.fillStyle = settings.doubleJump ? '#2ed573' : 'rgba(255,255,255,0.12)'; g.fill();
    txt('2x JUMP', stripX + 6 + chipW/2, chipsY + chipH/2 + 1, FN(10.5, 900), settings.doubleJump ? '#ffffff' : '#94a3b8');
    zone(stripX + 6, chipsY, chipW, chipH, { fn: () => { settings.doubleJump = !settings.doubleJump; sfx('ui'); } });

    // Chip 2: Timer
    rr(g, stripX + 12 + chipW, chipsY, chipW, chipH, 6);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    txt('⏱️ ' + settings.time + 's', stripX + 12 + chipW * 1.5, chipsY + chipH/2 + 1, FN(10.5, 900), '#ffd166');
    zone(stripX + 12 + chipW, chipsY, chipW, chipH, { fn: () => {
      settings.timeIdx = (settings.timeIdx + 1) % TIMES.length; sfx('ui');
    }});

    // Chip 3: NEW GAMEMODE: Teams
    const chip3X = stripX + 18 + chipW * 2;
    rr(g, chip3X, chipsY, chipW, chipH, 6);
    if(settings.teams){
      g.fillStyle = '#f39c12'; g.fill();
      g.lineWidth = 1.5; g.strokeStyle = '#ffffff'; g.stroke();
      txt('⚔️ TEAMS (ON)', chip3X + chipW/2, chipsY + chipH/2 + 1, FN(10.5, 900), '#0f172a');
    } else {
      g.fillStyle = 'rgba(243, 156, 18, 0.18)'; g.fill();
      g.lineWidth = 1.5; g.strokeStyle = 'rgba(243, 156, 18, 0.55)'; g.stroke();
      txt('⚔️ TEAMS', chip3X + chipW/2, chipsY + chipH/2 + 1, FN(10, 900), '#ffd166');
      // NEW badge on corner
      const nbW = 28, nbH = 13;
      const nbX = chip3X + chipW - nbW - 2, nbY = chipsY - 4;
      rr(g, nbX, nbY, nbW, nbH, 3);
      g.fillStyle = '#ff4757'; g.fill();
      g.lineWidth = 1; g.strokeStyle = '#ffffff'; g.stroke();
      txt('NEW', nbX + nbW/2, nbY + nbH/2 + 1, FN(7.5, 900), '#ffffff');
    }
    zone(chip3X, chipsY, chipW, chipH, { fn: () => toggleTeams() });

  } else {
    // Single sleek horizontal dock for desktop & tablets
    const itemH = stripH - 10;
    const itemY = stripY + 5;

    // Map Selector Box (Left half)
    const mapBoxW = clamp(stripW * 0.48, 220, 360);
    const arrowW = 34;

    // Left Arrow
    rr(g, stripX + 6, itemY, arrowW, itemH, 6);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.30)'; g.stroke();
    txt('◀', stripX + 6 + arrowW/2, itemY + itemH/2 + 1, FN(14, 900), '#ffffff');
    zone(stripX + 6, itemY, arrowW, itemH, { fn: () => cycleMap(-1) });

    // Right Arrow (Fixed hitbox coordinate!)
    const rightArrowX = stripX + 6 + mapBoxW - arrowW;
    rr(g, rightArrowX, itemY, arrowW, itemH, 6);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.30)'; g.stroke();
    txt('▶', rightArrowX + arrowW/2, itemY + itemH/2 + 1, FN(14, 900), '#ffffff');
    zone(rightArrowX, itemY, arrowW, itemH, { fn: () => cycleMap(1) });

    // Middle Map Name (Opens Modal!)
    const mapMidW = mapBoxW - arrowW * 2 - 8;
    const mapMidX = stripX + 6 + arrowW + 4;
    rr(g, mapMidX, itemY, mapMidW, itemH, 6);
    g.fillStyle = settings.randomMap ? 'rgba(255, 209, 102, 0.25)' : 'rgba(255,255,255,0.18)'; g.fill();
    txt(mapLabelText, mapMidX + mapMidW/2, itemY + itemH/2 + 1, FN(clamp(mapBoxW * 0.040, 11, 13), 900), settings.randomMap ? '#ffd166' : '#ffffff');
    zone(mapMidX, itemY, mapMidW, itemH, { fn: () => { menu.mapModal = true; sfx('ok'); } });

    // Right side: 3 Modifier Chips
    const chipsX = stripX + 6 + mapBoxW + 12;
    const chipsAvailW = stripW - (chipsX - stripX) - 10;
    const chipW = Math.floor((chipsAvailW - 12) / 3);

    // Chip 1: Double Jump
    rr(g, chipsX, itemY, chipW, itemH, 6);
    g.fillStyle = settings.doubleJump ? '#2ed573' : 'rgba(255,255,255,0.12)'; g.fill();
    txt('2x JUMP', chipsX + chipW/2, itemY + itemH/2 + 1, FN(11.5, 900), settings.doubleJump ? '#ffffff' : '#94a3b8');
    zone(chipsX, itemY, chipW, itemH, { fn: () => { settings.doubleJump = !settings.doubleJump; sfx('ui'); } });

    // Chip 2: Timer
    rr(g, chipsX + chipW + 6, itemY, chipW, itemH, 6);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    txt('⏱️ ' + settings.time + 's', chipsX + chipW + 6 + chipW/2, itemY + itemH/2 + 1, FN(11.5, 900), '#ffd166');
    zone(chipsX + chipW + 6, itemY, chipW, itemH, { fn: () => {
      settings.timeIdx = (settings.timeIdx + 1) % TIMES.length; sfx('ui');
    }});

    // Chip 3: NEW GAMEMODE: Teams
    const chip3X = chipsX + chipW * 2 + 12;
    rr(g, chip3X, itemY, chipW, itemH, 6);
    if(settings.teams){
      g.fillStyle = '#f39c12'; g.fill();
      g.lineWidth = 2; g.strokeStyle = '#ffffff'; g.stroke();
      txt('⚔️ TEAMS (ON)', chip3X + chipW/2, itemY + itemH/2 + 1, FN(11.5, 900), '#0f172a');
    } else {
      g.fillStyle = 'rgba(243, 156, 18, 0.18)'; g.fill();
      g.lineWidth = 1.5; g.strokeStyle = 'rgba(243, 156, 18, 0.55)'; g.stroke();
      txt('⚔️ TEAMS', chip3X + chipW/2, itemY + itemH/2 + 1, FN(11.5, 900), '#ffd166');
      // NEW badge on corner
      const nbW = 32, nbH = 14;
      const nbX = chip3X + chipW - nbW - 2, nbY = itemY - 5;
      rr(g, nbX, nbY, nbW, nbH, 4);
      g.fillStyle = '#ff4757'; g.fill();
      g.lineWidth = 1; g.strokeStyle = '#ffffff'; g.stroke();
      txt('NEW', nbX + nbW/2, nbY + nbH/2 + 1, FN(8.5, 900), '#ffffff');
    }
    zone(chip3X, itemY, chipW, itemH, { fn: () => toggleTeams() });
  }

  // 6. Giant START MATCH Button
  const pulse = 0.90 + Math.sin(tGlobal * 5) * 0.10;
  const startBtnX = Math.floor(CW/2 - startBtnW/2);
  rr(g, startBtnX - 2, startBtnY - 2, startBtnW + 4, startBtnH + 4, 14);
  g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();
  rr(g, startBtnX, startBtnY, startBtnW, startBtnH, 12);
  g.fillStyle = isTeams ? ('rgba(241, 196, 15, ' + pulse + ')') : ('rgba(46, 204, 113, ' + pulse + ')'); g.fill();
  g.lineWidth = 2; g.strokeStyle = '#ffffff'; g.stroke();

  let startLabel = isTouch ? '▶ START MATCH' : '▶ START MATCH  (SPACE / ENTER)';
  if(isTeams) startLabel = isTouch ? '⚔️ START TEAM MATCH' : '⚔️ START TEAM MATCH (SPACE)';
  const labelFs = clamp(startBtnH * 0.38, 12.5, 16.5);
  if(isTeams){
    txt(startLabel, CW/2, startBtnY + startBtnH/2 + 1, FT(labelFs), '#0f172a');
  } else {
    ptxt(startLabel, CW/2, startBtnY + startBtnH/2 + 1, FT(labelFs), '#ffffff');
  }
  zone(startBtnX - 2, startBtnY - 2, startBtnW + 4, startBtnH + 4, { fn: () => {
    if(activeSlots().length < 2){
      menu.slotColor[0] = 0; menu.slotColor[1] = 1;
    }
    sfx('go');
    startMatch();
  }});

  // 7. Toast Message
  if(menu.toastT > 0 && menu.toast){
    const a = clamp(menu.toastT, 0, 1);
    g.save(); g.globalAlpha = a;
    g.font = FN(15, 900);
    const w4 = g.measureText(menu.toast).width + 44;
    pill(CW/2 - w4/2, CH * 0.44, w4, 38, 'rgba(30,30,30,0.88)', '#ffffff');
    txt(menu.toast, CW/2, CH * 0.44 + 20, FN(14, 900), '#ffffff');
    g.restore();
  }

  // 8. Modals (draw on top if open)
  drawMapModal();
  drawOnlineComingSoonModal();
}

/* Helper to render an individual Player Card with interactive controls */
function drawPlayerCard(cx, cardY, cardW, cardH, slotIdx, isBot, canRemove){
  const col = getSlotColor(slotIdx, menu.slotColor, menu.slotTeam);
  const centerX = cx + cardW / 2;

  rr(g, cx - 2, cardY - 2, cardW + 4, cardH + 4, 14);
  g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();
  rr(g, cx, cardY, cardW, cardH, 12);
  g.fillStyle = 'rgba(16, 22, 34, 0.90)'; g.fill();
  g.lineWidth = 2; g.strokeStyle = isBot ? '#ff4757' : col; g.stroke();

  // Header Title
  const headTitleH = clamp(cardH * 0.16, 16, 24);
  const pTitle = isBot ? '🤖 BOT' : ('PLAYER ' + (slotIdx + 1));
  ptxt(pTitle, centerX, cardY + headTitleH * 0.62, FT(clamp(cardW * 0.082, 10.5, 13.5)), isBot ? '#ff6b81' : col);

  // Remove Button (✕) on P3 / P4 cards
  if(canRemove){
    const rxSz = clamp(cardW * 0.12, 18, 22);
    const rxX = cx + cardW - rxSz - 4, rxY = cardY + 4;
    rr(g, rxX, rxY, rxSz, rxSz, 6);
    g.fillStyle = 'rgba(231, 76, 60, 0.85)'; g.fill();
    g.lineWidth = 1.2; g.strokeStyle = INK; g.stroke();
    ptxt('✕', rxX + rxSz/2, rxY + rxSz/2 + 1, FN(10.5, 900), '#ffffff');
    zone(rxX, rxY, rxSz, rxSz, { fn: () => {
      menu.slotColor[slotIdx] = -1;
      if(slotIdx === 2) menu.slotColor[3] = -1;
      sfx('back');
    }});
  }

  // Avatar in middle
  const avY = cardY + cardH * 0.42;
  const charSz = clamp(cardH * 0.28, 20, 42);
  drawChar(g, centerX, avY, charSz, col, { face: isBot ? 'cool' : 'happy', grounded: true, seed: slotIdx * 3 });

  // Control Selector Bar (WASD / Arrows / IJKL / TFGH / Gamepads)
  const ctrlH = clamp(cardH * 0.14, 18, 24);
  const ctrlY = cardY + cardH * 0.63;
  const ctrlW = cardW - 14;
  const ctrlX = cx + 7;

  rr(g, ctrlX, ctrlY, ctrlW, ctrlH, 6);
  g.fillStyle = 'rgba(255, 255, 255, 0.09)'; g.fill();
  g.lineWidth = 1; g.strokeStyle = isBot ? 'rgba(255,255,255,0.25)' : 'rgba(255, 255, 255, 0.28)'; g.stroke();

  if(isBot){
    const isHard = ((menu.botDifficulty || 'hard') !== 'easy');
    // Left arrow
    ptxt('‹', ctrlX + 8, ctrlY + ctrlH/2 + 1, FT(11), '#ffffff');
    zone(ctrlX, ctrlY, 22, ctrlH, { fn: () => toggleBotDifficulty() });

    // Right arrow
    ptxt('›', ctrlX + ctrlW - 8, ctrlY + ctrlH/2 + 1, FT(11), '#ffffff');
    zone(ctrlX + ctrlW - 22, ctrlY, 22, ctrlH, { fn: () => toggleBotDifficulty() });

    // Difficulty Label
    const diffLabel = isHard ? '🔥 HARD (DEF)' : '⚡ EASY';
    const diffCol = isHard ? '#ff6b81' : '#2ed573';
    const ctrlFs = clamp(cardW * 0.066, 8.5, 11);
    ptxt(diffLabel, centerX, ctrlY + ctrlH/2 + 1, FN(ctrlFs, 900), diffCol);
    zone(ctrlX + 22, ctrlY, ctrlW - 44, ctrlH, { fn: () => toggleBotDifficulty() });
  } else {
    // Left arrow
    ptxt('‹', ctrlX + 8, ctrlY + ctrlH/2 + 1, FT(11), '#ffffff');
    zone(ctrlX, ctrlY, 22, ctrlH, { fn: () => cycleSlotCtrl(slotIdx, -1) });

    // Right arrow
    ptxt('›', ctrlX + ctrlW - 8, ctrlY + ctrlH/2 + 1, FT(11), '#ffffff');
    zone(ctrlX + ctrlW - 22, ctrlY, 22, ctrlH, { fn: () => cycleSlotCtrl(slotIdx, 1) });

    // Control Label
    const curCtrlIdx = (menu.slotCtrl && menu.slotCtrl[slotIdx] != null) ? menu.slotCtrl[slotIdx] : slotIdx;
    const curCtrl = LOCAL_CTRL_SCHEMES[((curCtrlIdx % LOCAL_CTRL_SCHEMES.length) + LOCAL_CTRL_SCHEMES.length) % LOCAL_CTRL_SCHEMES.length];
    const ctrlLabel = curCtrl ? curCtrl.label : 'WASD';
    const ctrlFs = clamp(cardW * 0.065, 8.5, 10.5);
    ptxt(ctrlLabel, centerX, ctrlY + ctrlH/2 + 1, FN(ctrlFs, 900), '#ffd166');
    zone(ctrlX + 22, ctrlY, ctrlW - 44, ctrlH, { fn: () => cycleSlotCtrl(slotIdx, 1) });
  }

  // Color Cycler Bar
  const barH = clamp(cardH * 0.14, 18, 24);
  const barY = cardY + cardH - barH - 7;
  const barW = cardW - 14;
  const barX = cx + 7;

  rr(g, barX, barY, barW, barH, 6);
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fill();
  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,0.2)'; g.stroke();

  // Left Arrow
  const arrowSz = barH;
  ptxt('‹', barX + 8, barY + barH/2 + 1, FT(12), '#ffffff');
  zone(barX, barY, 20, barH, { fn: () => {
    if(settings.teams) cycleTeam(slotIdx, -1); else cycleSlot(slotIdx, -1);
  }});

  // Right Arrow
  ptxt('›', barX + barW - 8, barY + barH/2 + 1, FT(12), '#ffffff');
  zone(barX + barW - 20, barY, 20, barH, { fn: () => {
    if(settings.teams) cycleTeam(slotIdx, 1); else cycleSlot(slotIdx, 1);
  }});

  // Color / Team Name in Middle
  let colName = '';
  if(settings.teams){
    const tIdx = (menu.slotTeam && menu.slotTeam[slotIdx] != null) ? (menu.slotTeam[slotIdx] % TEAMS.length) : (slotIdx % 2);
    const teamDef = TEAMS[tIdx] || TEAMS[0];
    colName = teamDef ? teamDef.name : 'TEAM';
  } else {
    const curCol = (menu.slotColor[slotIdx] >= 0) ? menu.slotColor[slotIdx] : slotIdx;
    colName = (PALETTE[curCol % PALETTE.length] || PALETTE[0]).name;
  }
  ptxt(colName, centerX, barY + barH/2 + 1, FN(clamp(cardW * 0.068, 8.5, 10.5), 900), '#ffffff');
  zone(barX + 20, barY, barW - 40, barH, { fn: () => {
    if(settings.teams) cycleTeam(slotIdx, 1); else cycleSlot(slotIdx, 1);
  }});
}

/* Helper to render "+ ADD PLAYER" card */

/* ================= HUD / pause / result ================= */
function tri(x,y,r,dir){
  g.beginPath();
  if(dir===0){g.moveTo(x+r*0.45,y-r*0.55);g.lineTo(x+r*0.45,y+r*0.55);g.lineTo(x-r*0.55,y);}
  else if(dir===1){g.moveTo(x-r*0.45,y-r*0.55);g.lineTo(x-r*0.45,y+r*0.55);g.lineTo(x+r*0.55,y);}
  else if(dir===2){g.moveTo(x-r*0.55,y+r*0.45);g.lineTo(x+r*0.55,y+r*0.45);g.lineTo(x,y-r*0.55);}
  else{g.moveTo(x-r*0.55,y-r*0.45);g.lineTo(x+r*0.55,y-r*0.45);g.lineTo(x,y+r*0.55);}
  g.closePath();
}
function drawPadBtn(cx,cy,r,dir,o){
  const active=o.hold?keys.has(o.hold):(tGlobal-(glow[o.pk]||-9))<0.15;
  g.beginPath();g.arc(cx,cy,r,0,TAU);
  g.fillStyle=active?'rgba(255,255,255,0.75)':'rgba(15,23,42,0.65)';
  g.fill();
  g.lineWidth=2.5;g.strokeStyle=active?'#ffffff':'rgba(255,255,255,0.45)';g.stroke();
  tri(cx,cy,r*0.55,dir);
  g.fillStyle=active?'#143c26':'#ffffff';
  g.fill();
  zone(cx-r-12,cy-r-12,r*2+24,r*2+24,o);
}

function drawPadBtnAction(cx,cy,r,actionKey,symbol,glowCol,label){
  let active = false;
  if(actionKey === 'left') active = TOUCH.left;
  else if(actionKey === 'right') active = TOUCH.right;
  else if(actionKey === 'jump') active = TOUCH.jumpHeld;
  else if(actionKey === 'down') active = TOUCH.downHeld;
  
  g.save();
  if(active){
    g.beginPath(); g.arc(cx,cy,r+6,0,TAU);
    g.fillStyle=glowCol||'rgba(255,255,255,0.3)';
    g.fill();
  }
  
  // Frosted circular button
  g.beginPath(); g.arc(cx,cy,r,0,TAU);
  g.fillStyle=active?'rgba(255,255,255,0.90)':'rgba(15,23,42,0.68)';
  g.fill();
  g.lineWidth=active?3.5:2.5;
  g.strokeStyle=active?'#ffffff':'rgba(255,255,255,0.45)';
  g.stroke();
  
  // Symbol icon
  g.font=FN(Math.round(r*(label?0.62:0.72)),900);
  g.textAlign='center';
  g.textBaseline='middle';
  g.fillStyle=active?'#0f172a':'#ffffff';
  g.fillText(symbol,cx,cy+(label?-r*0.12:1));
  
  // Optional small label below icon (e.g. JUMP, DROP on tablet)
  if(label && r>=34){
    g.font=FN(Math.max(9,Math.round(r*0.22)),900);
    g.fillStyle=active?'#0f172a':'rgba(255,255,255,0.75)';
    g.fillText(label,cx,cy+r*0.52);
  }
  g.restore();
  
  // Generous touch hitbox
  const padH=16;
  zone(cx-r-padH,cy-r-padH,2*(r+padH),2*(r+padH),{
    touchAction: actionKey
  });
}

function drawTouchButtons(){
  if(!match) return;
  
  const isOnline=(typeof NET!=='undefined' && NET && NET.role!==null);
  const isSplitLocal=(!isOnline && match.players.length===2 && !menu.botOn && menu.tab !== 'solo');
  const isTablet=Math.min(CW,CH)>=550 || (CW/CH<1.7 && Math.min(CW,CH)>=480);
  
  if(!isSplitLocal){
    /* ================= SLEEK SEE-THROUGH JOYSTICKS (ONLINE & SOLO) ================= */
    const r = isTablet ? clamp(CH * 0.058, 24, 32) : clamp(CH * 0.075, 20, 26);
    const bm = isTablet ? clamp(CH * 0.07, 24, 44) : clamp(CH * 0.06, 16, 26);
    const sm = isTablet ? clamp(CW * 0.045, 26, 48) : clamp(CW * 0.04, 18, 30);
    
    // --- 1. Left Horizontal-Only Joystick (Floating — spawns at touch position) ---
    const wL = r * 3.6, hL = r * 2.1;
    const defCxL = sm + wL / 2;
    const defCyL = CH - bm - hL / 2;
    const cxL = JOY.leftId ? JOY.leftStartX : defCxL;
    const cyL = JOY.leftId ? clamp(JOY.leftStartY, hL / 2 + 56, CH - hL / 2) : defCyL;
    const xL = cxL - wL / 2, yL = cyL - hL / 2;
    const maxTravelL = (wL - 2 * r) / 2;
    JOY.boundsL = { x: xL, y: yL, w: wL, h: hL, cx: cxL, cy: cyL, maxTravel: maxTravelL, r: r };

    // --- 2. Right Vertical Dual Slider (Height = 2x Diameter, Snaps to Top) ---
    const wR = r * 2.1, hR = r * 4.0;
    const cxR = CW - sm - wR / 2;
    const yR = CH - bm - hR;
    const xR = cxR - wR / 2;
    const cyTopR = yR + r * 1.05;
    const maxTravelR = hR - 2.1 * r;
    JOY.boundsR = { x: xR, y: yR, w: wR, h: hR, cx: cxR, cyTop: cyTopR, maxTravel: maxTravelR, r: r };

    // Smooth visual interpolation for knobs
    JOY.leftVisX += (JOY.leftX - JOY.leftVisX) * 0.40;
    JOY.rightVisY += (JOY.rightY - JOY.rightVisY) * 0.45;

    // --- Render Left Horizontal Track ---
    g.save();
    rr(g, xL, yL, wL, hL, hL / 2);
    g.fillStyle = 'rgba(255, 255, 255, 0.08)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    g.stroke();

    // Subtle track slot guideline
    g.beginPath();
    g.moveTo(cxL - maxTravelL * 0.85, cyL);
    g.lineTo(cxL + maxTravelL * 0.85, cyL);
    g.lineWidth = 2.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    g.stroke();

    // Faint chevrons
    ptxt('◀', xL + r * 0.55, cyL, FN(11, 900), 'rgba(255, 255, 255, 0.28)');
    ptxt('▶', xL + wL - r * 0.55, cyL, FN(11, 900), 'rgba(255, 255, 255, 0.28)');

    // Render Left Knob (rests in center)
    const kxL = cxL + JOY.leftVisX * maxTravelL;
    const leftActive = (TOUCH.left || TOUCH.right);
    g.beginPath();
    g.arc(kxL, cyL, r * 0.88, 0, Math.PI * 2);
    g.fillStyle = leftActive ? 'rgba(0, 210, 211, 0.45)' : 'rgba(255, 255, 255, 0.22)';
    g.fill();
    g.lineWidth = 2;
    g.strokeStyle = leftActive ? '#00d2d3' : 'rgba(255, 255, 255, 0.60)';
    g.stroke();
    g.beginPath();
    g.arc(kxL, cyL, 3, 0, Math.PI * 2);
    g.fillStyle = leftActive ? '#ffffff' : 'rgba(255, 255, 255, 0.50)';
    g.fill();

    // --- Render Right Vertical Track ---
    rr(g, xR, yR, wR, hR, wR / 2);
    g.fillStyle = 'rgba(255, 255, 255, 0.08)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    g.stroke();

    // Subtle vertical slot guideline
    g.beginPath();
    g.moveTo(cxR, cyTopR + r * 0.2);
    g.lineTo(cxR, cyTopR + maxTravelR);
    g.lineWidth = 2.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    g.stroke();

    // Dedicated Drop Pad target at bottom
    const cyBotR = yR + hR - r * 1.05;
    g.beginPath();
    g.arc(cxR, cyBotR, r * 0.76, 0, Math.PI * 2);
    g.fillStyle = TOUCH.downHeld ? 'rgba(235, 75, 155, 0.45)' : 'rgba(235, 75, 155, 0.14)';
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = TOUCH.downHeld ? '#eb4b9b' : 'rgba(235, 75, 155, 0.50)';
    g.stroke();
    ptxt('v', cxR, cyBotR + 1, FN(11, 900), TOUCH.downHeld ? '#ffffff' : 'rgba(235, 75, 155, 0.85)');

    // Render Right Knob (snaps to top, tap jumps, drag down drops)
    const kyR = cyTopR + JOY.rightVisY * maxTravelR;
    g.beginPath();
    g.arc(cxR, kyR, r * 0.88, 0, Math.PI * 2);
    if(TOUCH.downHeld || JOY.rightVisY > 0.25){
      g.fillStyle = 'rgba(235, 75, 155, 0.65)';
      g.strokeStyle = '#eb4b9b';
    } else if(TOUCH.jumpHeld){
      g.fillStyle = 'rgba(46, 204, 113, 0.65)';
      g.strokeStyle = '#2ecc71';
    } else {
      g.fillStyle = 'rgba(255, 255, 255, 0.22)';
      g.strokeStyle = 'rgba(255, 255, 255, 0.60)';
    }
    g.fill();
    g.lineWidth = 2;
    g.stroke();

    // Icon inside knob (▲ for Jump, v when dragged down for Drop)
    const knobIcon = (TOUCH.downHeld || JOY.rightVisY > 0.25) ? 'v' : '▲';
    const knobCol = (TOUCH.downHeld || TOUCH.jumpHeld || JOY.rightVisY > 0.25) ? '#ffffff' : 'rgba(255, 255, 255, 0.85)';
    ptxt(knobIcon, cxR, kyR + (knobIcon === '▲' ? -1 : 1), FN(12, 900), knobCol);

    g.restore();
  } else {
    /* ================= 2-PLAYER LOCAL SPLIT (SIDE-TO-SIDE JOYSTICK + FIXED JUMP/DROP) ================= */
    const b = calcLocalBounds();
    const colP1 = (match.players[0] && PALETTE[match.players[0].colIdx]) ? PALETTE[match.players[0].colIdx].c : '#e8433f';
    const colP2 = (match.players[1] && PALETTE[match.players[1].colIdx]) ? PALETTE[match.players[1].colIdx].c : '#2f9be8';

    g.save();

    // 1. Subtle Center Dashed Midline
    g.setLineDash([6, 8]);
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255, 255, 255, 0.16)';
    g.beginPath();
    g.moveTo(b.midX, 52);
    g.lineTo(b.midX, CH - 14);
    g.stroke();
    g.setLineDash([]);

    // 2. Ambient Corner Watermarks
    const isNarrow = (CW < 600);
    ptxt('P1 ZONE', Math.max(34, CW * 0.08), 34, FN(isNarrow ? 10 : 12, 900), rgba(colP1, 0.45));
    ptxt('P2 ZONE', CW - Math.max(34, CW * 0.08), 34, FN(isNarrow ? 10 : 12, 900), rgba(colP2, 0.45));

    // Helper to draw a player's controls
    const drawPlayerControls = (pData, cfg, col) => {
      // Smooth visual knob interpolation
      pData.visOffX += (pData.offX - pData.visOffX) * 0.40;

      // --- A. Side-to-Side Joystick Track ---
      // If active, anchor track at touch position. If idle, show at default resting position.
      const jx = pData.active ? pData.startX : cfg.defJoyX;
      const jy = pData.active ? pData.startY : cfg.defJoyY;
      const tw = b.trackW, th = b.trackH;

      rr(g, jx - tw / 2, jy - th / 2, tw, th, th / 2);
      g.fillStyle = pData.active ? rgba(col, 0.12) : 'rgba(255, 255, 255, 0.08)';
      g.fill();
      g.lineWidth = 1.5;
      g.strokeStyle = pData.active ? rgba(col, 0.50) : 'rgba(255, 255, 255, 0.20)';
      g.stroke();

      // Track slot line
      g.beginPath();
      g.moveTo(jx - b.maxTravel * 0.85, jy);
      g.lineTo(jx + b.maxTravel * 0.85, jy);
      g.lineWidth = 2.5;
      g.strokeStyle = pData.active ? rgba(col, 0.25) : 'rgba(255, 255, 255, 0.10)';
      g.stroke();

      // Chevrons inside track
      ptxt('◀', jx - tw / 2 + b.r * 0.5, jy, FN(10, 900), pData.left ? '#ffffff' : 'rgba(255, 255, 255, 0.30)');
      ptxt('▶', jx + tw / 2 - b.r * 0.5, jy, FN(10, 900), pData.right ? '#ffffff' : 'rgba(255, 255, 255, 0.30)');

      // Joystick Knob
      const kx = jx + pData.visOffX * b.maxTravel;
      const isJoyActive = (pData.left || pData.right);
      g.beginPath();
      g.arc(kx, jy, b.r * 0.82, 0, TAU);
      g.fillStyle = isJoyActive ? rgba(col, 0.65) : 'rgba(255, 255, 255, 0.22)';
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = isJoyActive ? '#ffffff' : rgba(col, 0.60);
      g.stroke();

      // Knob center pip or arrow
      const knobIcon = pData.left ? '◀' : (pData.right ? '▶' : '•');
      ptxt(knobIcon, kx, jy + (knobIcon === '•' ? 0 : 1), FN(12, 900), isJoyActive ? '#ffffff' : 'rgba(255, 255, 255, 0.65)');

      // --- B. Fixed JUMP Button (Top) ---
      const jumpR = b.r * 0.88;
      g.beginPath();
      g.arc(cfg.btnX, cfg.jumpY, jumpR, 0, TAU);
      g.fillStyle = pData.jumpHeld ? 'rgba(46, 204, 113, 0.65)' : 'rgba(255, 255, 255, 0.12)';
      g.fill();
      g.lineWidth = pData.jumpHeld ? 2.5 : 1.8;
      g.strokeStyle = pData.jumpHeld ? '#2ecc71' : 'rgba(255, 255, 255, 0.35)';
      g.stroke();
      ptxt('▲', cfg.btnX, cfg.jumpY, FN(13, 900), pData.jumpHeld ? '#ffffff' : 'rgba(255, 255, 255, 0.85)');

      // --- C. Fixed DROP Button (Bottom) ---
      const dropR = b.r * 0.88;
      g.beginPath();
      g.arc(cfg.btnX, cfg.dropY, dropR, 0, TAU);
      g.fillStyle = pData.downHeld ? 'rgba(235, 75, 155, 0.65)' : 'rgba(235, 75, 155, 0.15)';
      g.fill();
      g.lineWidth = pData.downHeld ? 2.5 : 1.8;
      g.strokeStyle = pData.downHeld ? '#eb4b9b' : 'rgba(235, 75, 155, 0.50)';
      g.stroke();
      ptxt('v', cfg.btnX, cfg.dropY + 1, FN(13, 900), pData.downHeld ? '#ffffff' : 'rgba(235, 75, 155, 0.85)');
    };

    drawPlayerControls(LOCAL_TOUCH.p1, b.p1, colP1);
    drawPlayerControls(LOCAL_TOUCH.p2, b.p2, colP2);

    g.restore();
  }

  // ================= 4. PRE-MATCH TUTORIAL THUMBNAIL CARD =================
  if(GESTURE_SPLIT.showTutorial && match){
    drawLocalTutorialCard();
  }
}

  // --- Column 2: Player 2 (Right Half) ---

  g.strokeStyle = rgba(colP2, 0.55);

  // P2 Header badge
  rr(g, col2X + 10, colY + 10, colW - 20, 26, 8);
  g.fillStyle = rgba(colP2, 0.25);
  g.fill();
  g.lineWidth = 1.2;
  g.strokeStyle = colP2;
  g.stroke();
  ptxt('P2 (RIGHT HALF OF SCREEN)', col2X + colW / 2, colY + 23, FN(11, 900), '#ffffff');

function drawHUD(){
  const urgent=match.timer<=10&&match.state==='playing';
  const tw=Math.min(150,CW*0.28),th=40;
  rr(g,CW/2-tw/2,8,tw,th,10);
  g.fillStyle=urgent?'rgba(190, 24, 24, 0.92)':'rgba(20, 28, 42, 0.92)';
  g.fill();
  g.lineWidth=2.5;g.strokeStyle=urgent?'#ef4444':INK;g.stroke();
  ptxt(fmtTime(match.timer),CW/2,8+th/2+1,FT(Math.min(22,th*0.54)),urgent?'#fff0f0':'#ffffff');
  
  const P=match.players;
  const pillH = P.length > 4 ? 22 : 26;
  const pillGap = P.length > 4 ? 25 : 30;
  for(let i=0;i<P.length;i++){
    const p = P[i];
    const isIt = settings.teams ? (p.team === match.itTeam && match.state !== 'result') : (match.it === i && match.state !== 'result');
    const y = 10 + i * pillGap;
    g.save(); g.globalAlpha = isIt ? 1 : 0.75;
    const teamBadge = settings.teams ? ((p.team === 0 ? '🔴 ' : (p.team === 1 ? '🔵 ' : '🟢 '))) : '';
    const label = teamBadge + (isBotSlot(p) ? '🤖 BOT' : ('P' + (p.slot + 1))) + (isIt ? ' IT' : '');
    pill(10, y, isIt ? 128 : 98, pillH, isIt ? 'rgba(255,210,63,0.92)' : 'rgba(0,0,0,0.3)', isIt ? INK : 'rgba(0,0,0,0.5)');
    g.fillStyle = getPlayerColor(p);
    rr(g, 14, y + (pillH - 16) / 2, 16, 16, 4); g.fill(); g.lineWidth = 1.8; g.strokeStyle = INK; g.stroke();
    txt(label, 36, y + pillH / 2 + 1, FN(P.length > 4 ? 10 : 11, 900), isIt ? '#3a2c00' : '#ffffff', 'left');
    g.restore();
  }
  
  /* In-game control bar: Pause, Sound, Fullscreen, Next Map, Voice */
  const btnSize=38;
  const xPause=CW-btnSize-12;
  const xMute=xPause-btnSize-8;
  const xFull=xMute-btnSize-8;
  const xNext=xFull-btnSize-8;
  const xVoice=xNext-btnSize-8;
  
  // Pause button
  rr(g,xPause,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.fillStyle='#1e293b';
  g.fillRect(xPause+12,10+10,4,18);
  g.fillRect(xPause+22,10+10,4,18);
  zone(xPause,10,btnSize,btnSize,{fn:togglePause});
  
  // Audio Mute/Unmute button
  rr(g,xMute,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.fillStyle='#1e293b';
  g.beginPath();
  g.moveTo(xMute+10, 10+btnSize/2-4);
  g.lineTo(xMute+14, 10+btnSize/2-4);
  g.lineTo(xMute+20, 10+btnSize/2-10);
  g.lineTo(xMute+20, 10+btnSize/2+10);
  g.lineTo(xMute+14, 10+btnSize/2+4);
  g.lineTo(xMute+10, 10+btnSize/2+4);
  g.closePath();
  g.fill();
  if(!muted){
    // sound wave arc
    g.strokeStyle='#1e293b'; g.lineWidth=2.2;
    g.beginPath(); g.arc(xMute+19, 10+btnSize/2, 6, -0.6, 0.6); g.stroke();
  }else{
    // red mute strike
    g.strokeStyle='#ef4444'; g.lineWidth=3;
    g.beginPath(); g.moveTo(xMute+8, 10+8); g.lineTo(xMute+btnSize-8, 10+btnSize-8); g.stroke();
  }
  zone(xMute,10,btnSize,btnSize,{fn:toggleSound});
  
  // Fullscreen button
  rr(g,xFull,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.strokeStyle='#1e293b'; g.lineWidth=2.5;
  const isFull=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement||document.webkitIsFullScreen);
  if(!isFull){
    const m=10;
    g.beginPath(); g.moveTo(xFull+m, 10+m+5); g.lineTo(xFull+m, 10+m); g.lineTo(xFull+m+5, 10+m); g.stroke();
    g.beginPath(); g.moveTo(xFull+btnSize-m-5, 10+m); g.lineTo(xFull+btnSize-m, 10+m); g.lineTo(xFull+btnSize-m, 10+m+5); g.stroke();
    g.beginPath(); g.moveTo(xFull+m, 10+btnSize-m-5); g.lineTo(xFull+m, 10+btnSize-m); g.lineTo(xFull+m+5, 10+btnSize-m); g.stroke();
    g.beginPath(); g.moveTo(xFull+btnSize-m-5, 10+btnSize-m); g.lineTo(xFull+btnSize-m, 10+btnSize-m); g.lineTo(xFull+btnSize-m, 10+btnSize-m-5); g.stroke();
  }else{
    const m=11;
    g.strokeRect(xFull+m, 10+m, btnSize-2*m, btnSize-2*m);
  }
  zone(xFull,10,btnSize,btnSize,{upFn:toggleFullscreen});
  
  // Next map quick button
  rr(g,xNext,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  ptxt('▶',xNext+btnSize/2+1,10+btnSize/2+1,FT(14),'#1c6b38');
  zone(xNext,10,btnSize,btnSize,{fn:()=>selectMapQuick(settings.map+1)});

  // Proximity Voice Chat button (online) or Help/Tutorial button (2-player local touch)
  if(typeof NET!=='undefined' && NET && NET.role!==null){
    rr(g,xVoice,10,btnSize,btnSize,9);
    const vOn = (typeof VOICE!=='undefined' && VOICE.enabled);
    const vMuted = (typeof VOICE!=='undefined' && VOICE.muted);
    g.fillStyle = vOn ? (vMuted ? 'rgba(231, 76, 60, 0.92)' : 'rgba(39, 174, 96, 0.92)') : 'rgba(255,255,255,0.92)';
    g.fill();
    g.lineWidth=2.5; g.strokeStyle=INK; g.stroke();
    ptxt(vOn ? (vMuted ? '🔇' : '🎙️') : '🎙️', xVoice+btnSize/2, 10+btnSize/2+1, FN(15,900), vOn?'#ffffff':'#1e293b');
    zone(xVoice,10,btnSize,btnSize,{fn:voiceToggleMic});
  } else if(isTouch && match.players && match.players.length === 2 && !menu.botOn && menu.tab !== 'solo'){
    rr(g,xVoice,10,btnSize,btnSize,9);
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.fill();
    g.lineWidth=2.5; g.strokeStyle=INK; g.stroke();
    ptxt('?', xVoice+btnSize/2, 10+btnSize/2+1, FT(18), '#1e293b');
    zone(xVoice,10,btnSize,btnSize,{fn:()=>{ GESTURE_SPLIT.showTutorial = true; sfx('ui'); }});
  }
  
  if(match.state==='countdown')drawBigCount(match.cd,'GET READY!');
  if(match.goFlash>0&&match.state==='playing'){
    const a=clamp(match.goFlash/0.8,0,1);
    const sc2=1+(1-a)*0.6;
    g.save();g.translate(CW/2,CH*0.4);g.scale(sc2,sc2);g.globalAlpha=a;
    g.font=FT(Math.min(90,CW*0.16));g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    g.strokeStyle=INK;g.lineWidth=10;g.strokeText('GO!',0,0);
    g.fillStyle='#8ef0b0';g.fillText('GO!',0,0);
    g.restore();
  }
  
  /* On-screen map and theme toast notification */
  if(match.mapToastT>0&&match.mapToast){
    const a=clamp(match.mapToastT,0,1);
    g.save();g.globalAlpha=a;
    ptxt(match.mapToast,CW/2,64,FN(Math.min(18,CW*0.032),900),'#ffea88');
    g.restore();
  }
  
  if(match.hintT>0&&match.state!=='result'&&!isTouch){
    const a=clamp(match.hintT,0,1);
    ptxt('HOLD S / ↓ ON PINK TO DROP   •   WALL-JUMP ON WALLS   •   N = NEXT MAP   •   M = MUTE   •   F = FULLSCREEN',CW/2,CH-20,FN(12,800),'rgba(255,255,255,'+(a*0.75).toFixed(2)+')');
  }
  if(isTouch&&CH>CW&&match.state!=='result'){
    ptxt('ROTATE FOR WIDE VIEW',CW/2,54,FN(12,900),'rgba(255,255,255,0.9)');
  }
}

function drawBigCount(num,label){
  const ph=clamp(match?match.cdT/0.72:0,0,1);
  const sc=1.35-0.35*easeOut(Math.min(1,ph*3));
  g.save();
  g.translate(CW/2,CH*0.4);
  g.scale(sc,sc);
  ptxt(String(num),0,0,FT(Math.min(100,CW*0.18)),'#ffffff');
  g.restore();
  ptxt(label,CW/2,CH*0.4-Math.min(100,CW*0.14),FN(Math.min(18,CW*0.036),900),'#ffffff');
}

function drawPause(){
  g.fillStyle='rgba(10,16,24,0.78)';g.fillRect(0,0,CW,CH);
  const pw=Math.min(460,CW-30),ph=Math.min(360,CH-24);
  const px=CW/2-pw/2,py=CH/2-ph/2;
  rr(g,px,py,pw,ph,20);
  g.fillStyle='rgba(20,28,42,0.96)';g.fill();g.lineWidth=4;g.strokeStyle=INK;g.stroke();
  ptxt('PAUSED',CW/2,py+32,FT(Math.min(28,ph*0.09)),'#ffffff');
  ptxt('MAP '+(settings.map+1)+': '+MAPS[settings.map].name,CW/2,py+56,FN(Math.min(13,ph*0.045),800),'#a0c0e8');
  const opts=['RESUME','RESTART','NEXT MAP','SOUND: '+(muted?'OFF':'ON'),'FULLSCREEN','QUIT TO MENU'];
  const rowH = clamp((ph - 76) / 6, 26, 42);
  const btnH = Math.min(34, rowH - 4);
  for(let i=0;i<6;i++){
    const y=py + 72 + i*rowH + rowH/2;
    const sel=match.pauseSel===i;
    if(sel){pill(CW/2-150,y-btnH/2,300,btnH,'rgba(255,255,255,0.18)','#ffffff');}
    ptxt(opts[i],CW/2,y,FN(sel?16:14,900),sel?'#ffffff':'#bcd0e8');
    zone(CW/2-150,y-btnH/2,300,btnH,{fn:()=>{
      if(i===0)togglePause();
      else if(i===1){sfx('go');startMatch();}
      else if(i===2){selectMapQuick(settings.map+1);}
      else if(i===3){toggleSound();}
      else if(i===4){toggleFullscreen();}
      else quitToMenu();
    }});
  }
}

function drawResult(){
  g.fillStyle='rgba(10,16,24,0.72)';g.fillRect(0,0,CW,CH);
  if(!isTouch){
    zone(0,0,CW,CH,{fn:()=>{
      if(typeof NET!=='undefined' && NET && NET.role!==null){
        if(!NET.isHost) return;
        if(NET.midgameJoiner){
          NET.midgameJoiner = false;
          quitToMenu();
          return;
        }
      }
      sfx('go');startMatch();
    }});
  }
  const t=match.resultT;
  if(t<0.9){
    const sc=1.4-0.4*easeOut(Math.min(1,t*4));
    g.save();g.translate(CW/2,CH*0.26);g.scale(sc,sc);
    ptxt("TIME'S UP!",0,0,FT(Math.min(80,CW*0.12)),'#ffcf3f');
    g.restore();
  }
  const ap=easeBack(clamp((t-0.35)*2.2,0,1));
  if(ap<=0)return;
  const P=match.players;
  const isTeamMatch = !!(settings.teams && match.result && match.result.winningTeam != null);
  const bannerOff = (CH < 520) ? 28 : 0;
  const pw=Math.min(740,CW-30),ph=Math.min(440,CH-36 - bannerOff);
  const px=CW/2-pw/2,py=(CH - bannerOff)/2-ph/2;
  g.save();
  g.translate(CW/2,CH/2);g.scale(ap,ap);g.translate(-CW/2,-CH/2);
  rr(g,px,py,pw,ph,20);
  g.fillStyle='rgba(20,28,42,0.96)';g.fill();g.lineWidth=4;g.strokeStyle=INK;g.stroke();

  if(isTeamMatch){
    const winTeamIdx = match.result.winningTeam;
    const winTeam = TEAMS[winTeamIdx] || TEAMS[0];
    const teamMates = P.filter(p => p.team === winTeamIdx);
    const winTitle = winTeam.icon + ' ' + winTeam.name + ' WINS!';
    ptxt(winTitle, CW/2, py+ph*0.13, FT(Math.min(38,CW*0.055)), winTeam.base);
    ptxt('LOWEST TIME AS IT!   (MAP '+(settings.map+1)+': '+MAPS[settings.map].name+')', CW/2, py+ph*0.25, FN(Math.min(14,CW*0.028),800), '#ffffff');
    const psz=Math.min(54,ph*0.16);
    const startX = CW/2 - ((teamMates.length - 1) * psz * 1.5) / 2;
    for(let mi = 0; mi < teamMates.length; mi++){
      const p = teamMates[mi];
      drawChar(g, startX + mi * psz * 1.5, py+ph*0.46 - Math.abs(Math.sin(tGlobal*5 + mi))*8, psz, getPlayerColor(p), { face: 'happy', fdir: 1, grounded: true, seed: mi*3 });
    }
  } else {
    const loser=match.result.loser != null ? match.result.loser : match.it;
    const winners=P.map((p,i)=>i).filter(i=>i!==loser);
    const wcol=PALETTE[(P[winners[0]] && P[winners[0]].colIdx) || 0].c;
    ptxt(winners.length===1?('PLAYER '+(winners[0]+1)+' WINS!'):(winners.map(w=>'P'+(w+1)).join(' + ')+' WIN!'),CW/2,py+ph*0.12,FT(Math.min(38,CW*0.055)),wcol);
