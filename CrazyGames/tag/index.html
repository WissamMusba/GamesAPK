<body>
<canvas id="g"></canvas>
<!-- Netplay join modal (only shown when clicking 'JOIN ROOM' manually) -->
<div id="netUI"><div id="netCard">
  <h2>JOIN <span>ONLINE ROOM</span></h2>

  <input id="netCode" maxlength="64" placeholder="ROOM CODE / LINK"/>
  <div class="row">
    <button id="netJoinGo" class="go">Join</button>
    <button id="netClose">Cancel</button>
  </div>
</div></div>
<div id="netToast"></div>
<!-- SDK Banners: rendered DOM containers so CrazyGames can inject without painting over the canvas -->
<div id="cg-banners" style="position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:10;display:none;pointer-events:none">
  <div id="cg-banner-top" style="min-height:50px;min-width:320px;pointer-events:auto"></div>
</div>
<div id="cg-banner-resp" style="position:fixed;bottom:0;left:0;right:0;z-index:10;display:none;pointer-events:none;justify-content:center;padding:4px 0;background:rgba(10,10,16,0.92);border-top:1px solid #2a2c3d">
  <div id="cg-banner-responsive" style="min-height:50px;min-width:320px;max-width:728px;width:100%;pointer-events:auto"></div>
</div>
<script>
"use strict";
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);if(r<0)r=0;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
const FT=px=>'900 '+px+'px "'+FAMILIES[fontIdx]+'",system-ui,sans-serif';
const FN=(px,w)=>(w||800)+' '+px+'px "'+FAMILIES[fontIdx]+'",system-ui,sans-serif';
const FAMILIES=['Outfit','Bebas Neue','Anton','Bangers','Black Han Sans','Luckiest Guy','Righteous','Fredoka One','Baloo 2','Nunito','Poppins','Montserrat','Titan One','Chewy','MuseoModerno','Comfortaa','Space Grotesk','Orbitron','Russo One','Staatliches'];
const PINNED_FONTIdx=8; // font #9 = Baloo 2 — pinned for CrazyGames
let fontIdx=PINNED_FONTIdx;
function cycleFont(d){ toast('Fonts locked to pinned pick #' + (PINNED_FONTIdx+1) + ' — ' + FAMILIES[PINNED_FONTIdx]); }
const INK='#141414';

const cv=document.getElementById('g'),g=cv.getContext('2d');
let CW=0,CH=0,DPR=1;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

function resize(){
  const rect = cv.getBoundingClientRect();
  const vW = (window.visualViewport && window.visualViewport.width) ? window.visualViewport.width : window.innerWidth;
  const vH = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  CW = Math.floor(Math.min(rect.width || vW, vW));
  CH = Math.floor(Math.min(rect.height || vH, vH));
  const maxDpr = isTouch ? 1.5 : 2;
  DPR = Math.min(maxDpr, window.devicePixelRatio || 1);
  cv.width = Math.floor(CW * DPR);
  cv.height = Math.floor(CH * DPR);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 140));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
}
resize();
cv.style.touchAction='none';

function getCanvasCoords(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  const scaleX = rect.width ? (CW / rect.width) : 1;
  const scaleY = rect.height ? (CH / rect.height) : 1;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function grabFocus(){try{window.focus();}catch(e){}}
window.addEventListener('load',grabFocus);grabFocus();

/* ================= input ================= */
const keys=new Set(),pressed=new Set();
const GAMEKEYS=new Set([
  'ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space',
  'KeyW','KeyA','KeyS','KeyD',
  'KeyI','KeyJ','KeyK','KeyL',
  'KeyT','KeyF','KeyG','KeyH',
  'Enter','NumpadEnter','KeyM','KeyP','KeyN','KeyB','Digit1','Digit2','Digit3','Digit4',
  'Digit5','Digit6','Digit7','Digit8','Digit9','Digit0'
]);
function onKey(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(e.repeat)return;
  keys.add(e.code);pressed.add(e.code);initAudio();
}
window.addEventListener('keydown',onKey);
document.addEventListener('keydown',onKey);
window.addEventListener('keyup',e=>keys.delete(e.code));
document.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();touchPts.clear();});
window.addEventListener('contextmenu',e=>e.preventDefault());
const anyPressed=list=>{for(const k of list)if(pressed.has(k))return true;return false;};

/* ================= mobile touch action state ================= */
const TOUCH = {
  left: false,
  right: false,
  jumpEdge: false,
  jumpHeld: false,
  downHeld: false
};

/* ================= mobile touch joystick & dual slider system ================= */
const JOY = {
  // Left horizontal joystick (floating — spawns at touch position)
  leftId: null,
  leftStartX: 0,   // touch start anchor X
  leftStartY: 0,   // touch start anchor Y
  leftX: 0,        // -1 (left) to +1 (right), rests at 0 (center)
  leftVisX: 0,     // smooth interpolated visual knob position
  boundsL: null,   // { x, y, w, h, cx, cy, maxTravel, r }

  // Right vertical dual jump/drop slider (snaps to top)
  rightId: null,
  rightY: 0,       // 0 (top/rest) to 1 (pulled down)
  rightVisY: 0,    // smooth interpolated visual knob position
  rightStartY: 0,  // touch start Y to detect downward drag immediately
  boundsR: null    // { x, y, w, h, cx, cyTop, maxTravel, r }
};

/* ================= 2-player local mobile controls (Ergonomic Joysticks + Fixed Buttons) ================= */
const LOCAL_TOUCH = {
  showTutorial: false,
  p1: { joyId: null, startX: 0, startY: 0, curX: 0, curY: 0, active: false, offX: 0, visOffX: 0, left: false, right: false, jumpId: null, jumpHeld: false, jumpEdge: false, dropId: null, downHeld: false },
  p2: { joyId: null, startX: 0, startY: 0, curX: 0, curY: 0, active: false, offX: 0, visOffX: 0, left: false, right: false, jumpId: null, jumpHeld: false, jumpEdge: false, dropId: null, downHeld: false }
};
const GESTURE_SPLIT = LOCAL_TOUCH; // Backward compatibility alias

function calcLocalBounds(){
  const midX = CW / 2;
  const isTablet = (Math.min(CW, CH) >= 500);
  const r = isTablet ? clamp(CH * 0.065, 24, 32) : clamp(CH * 0.080, 22, 28);
  const bm = isTablet ? clamp(CH * 0.07, 24, 42) : clamp(CH * 0.06, 16, 26);
  const maxTravel = r * 1.45;
  const trackW = r * 3.4;
  const trackH = r * 2.0;

  // Corner positioning:
  // Player 1 (Bottom-Left Corner): Joystick at far left, Jump & Drop buttons shifted right by ~1 button diameter for comfortable thumb spacing
  const p1CornerPad = isTablet ? clamp(CW * 0.045, 24, 44) : clamp(CW * 0.040, 16, 28);
  const p1DefJoyX = p1CornerPad + trackW / 2;
  const p1DefJoyY = CH - bm - r * 1.05;
  const p1BtnX = p1DefJoyX + trackW / 2 + r * 3.30;
  const p1DropY = p1DefJoyY;
  const p1JumpY = p1DropY - r * 2.15;
  const p1SplitY = (p1JumpY + p1DropY) / 2;
  const p1BtnMinX = p1BtnX - r * 1.15;
  const p1BtnMaxX = p1BtnX + r * 1.45;
  const p1BtnMinY = p1JumpY - r * 1.35;
  const p1BtnMaxY = p1DropY + r * 1.35;

  // Player 2 (Bottom-Right Corner): Jump & Drop buttons at far right, Joystick shifted left towards center by the same gap
  const p2CornerPad = isTablet ? clamp(CW * 0.045, 24, 44) : clamp(CW * 0.040, 16, 28);
  const p2BtnX = CW - p2CornerPad - r * 1.15;
  const p2DefJoyX = p2BtnX - r * 3.30 - trackW / 2;
  const p2DefJoyY = CH - bm - r * 1.05;
  const p2DropY = p2DefJoyY;
  const p2JumpY = p2DropY - r * 2.15;
  const p2SplitY = (p2JumpY + p2DropY) / 2;
  const p2BtnMinX = p2BtnX - r * 1.15;
  const p2BtnMaxX = p2BtnX + r * 1.45;
  const p2BtnMinY = p2JumpY - r * 1.35;
  const p2BtnMaxY = p2DropY + r * 1.35;

  return {
    midX, r, bm, maxTravel, trackW, trackH,
    p1: { btnX: p1BtnX, jumpY: p1JumpY, dropY: p1DropY, splitY: p1SplitY, btnMinX: p1BtnMinX, btnMaxX: p1BtnMaxX, btnMinY: p1BtnMinY, btnMaxY: p1BtnMaxY, defJoyX: p1DefJoyX, defJoyY: p1DefJoyY },
    p2: { btnX: p2BtnX, jumpY: p2JumpY, dropY: p2DropY, splitY: p2SplitY, btnMinX: p2BtnMinX, btnMaxX: p2BtnMaxX, btnMinY: p2BtnMinY, btnMaxY: p2BtnMaxY, defJoyX: p2DefJoyX, defJoyY: p2DefJoyY }
  };
}

function applyTouchAction(action, isDown){
  if(action === 'left') TOUCH.left = !!isDown;
  else if(action === 'right') TOUCH.right = !!isDown;
  else if(action === 'jump'){
    if(isDown){ TOUCH.jumpEdge = true; TOUCH.jumpHeld = true; }
    else TOUCH.jumpHeld = false;
  } else if(action === 'down') TOUCH.downHeld = !!isDown;
}

/* ================= gamepads ================= */
const GP={prev:[{},{},{},{}],prevAx:[0,0,0,0],prevAy:[0,0,0,0]};
let PAD=[null,null,null,null];
function pollGamepads(){
  const rawPads=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<4;i++){
    const gd=rawPads[i];
    if(!gd||!gd.connected){PAD[i]=null;continue;}
    const b=n=>gd.buttons[n]&&(typeof gd.buttons[n]==='object'?gd.buttons[n].pressed:gd.buttons[n]>0.5);
    const pv=GP.prev[i]||{};
    const E=n=>b(n)&&!pv[n];
    const ax=gd.axes[0]||0,ay=gd.axes[1]||0;
    const pax=GP.prevAx[i]||0,pay=GP.prevAy[i]||0;
    const left=ax<-0.30||b(14),right=ax>0.30||b(15),up=ay<-0.50||b(12),down=ay>0.50||b(13);
    PAD[i]={
      left,right,up,down,
      leftE:(left&&!(pax<-0.30||pv[14]))||E(14),
      rightE:(right&&!(pax>0.30||pv[15]))||E(15),
      upE:(up&&!(pay<-0.50||pv[12]))||E(12),
      downE:(down&&!(pay>0.50||pv[13]))||E(13),
      jumpE:E(0),
      jumpHeld:!!b(0),
      confirmE:E(0)||E(2)||E(9),
      pauseE:E(9),
      dropHeld:b(1)||down,
      connected:true
    };
    const np={};for(let n=0;n<17;n++)np[n]=b(n);
    GP.prev[i]=np;
    GP.prevAx[i]=ax;
    GP.prevAy[i]=ay;
  }
}

/* ================= touch zones ================= */
const zones=[];const touchPts=new Map();const glow={};
function zone(x,y,w,h,o){
  zones.push({
    x:x,y:y,w:w,h:h,
    press:(o&&o.press)||null,
    hold:(o&&o.hold)||null,
    fn:(o&&o.fn)||null,
    upFn:(o&&o.upFn)||null,
    touchAction:(o&&o.touchAction)||null
  });
}
function zoneAt(x,y,holdOnly){
  for(let i=zones.length-1;i>=0;i--){const z=zones[i];
    if(holdOnly&&!z.hold&&!z.touchAction)continue;
    if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h)return z;}
  return null;
}
function inputDown(x,y,id){
  initAudio();grabFocus();
  
  // Tutorial Card dismiss for 2-Player Local Touch
  if(match && screen === 'game' && GESTURE_SPLIT.showTutorial){
    GESTURE_SPLIT.showTutorial = false;
    if(match.state === 'tutorial'){
      match.state = 'countdown';
      match.cd = 3;
      match.cdT = 0;
      sfx('count');
    }
    return;
  }

  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isPlaying = (match && (match.state === 'playing' || match.state === 'countdown'));
  const isSplitLocal = (!isOnline && match && screen === 'game' && isPlaying && match.players && match.players.length === 2 && isTouch && !menu.botOn && menu.tab !== 'solo');

  // Allow HUD top bar buttons (Pause, Mute, Help) to receive clicks
  if(y <= 55){
    const z = zoneAt(x,y,false);
    if(z){
      touchPts.set(id,z);
      if(z.hold){keys.add(z.hold);}
      if(z.press){for(const c of z.press){pressed.add(c);glow[c]=tGlobal;}}
      if(z.touchAction){applyTouchAction(z.touchAction,true);}
      if(z.fn)z.fn();
      return;
    }
  }

  // 2-Player Local Shared Screen Touch Controls (Fixed Jump/Drop + Floating Side-to-Side Joystick)
  if(isSplitLocal){
    const b = calcLocalBounds();

    if(x < b.midX){
      // --- Player 1 (Left Half) ---
      const p = LOCAL_TOUCH.p1;
      // Check if touch lands in P1's fixed button zone (right side of P1 cluster)
      if(x >= b.p1.btnMinX && x <= b.p1.btnMaxX && y >= b.p1.btnMinY && y <= b.p1.btnMaxY){
        if(y < b.p1.splitY){
          // P1 JUMP BUTTON
          p.jumpId = id;
          p.jumpEdge = true;
          p.jumpHeld = true;
          p.downHeld = false;
          const myP = match.players[0];
          if(myP) myP.jbuf = 0.16;
        } else {
          // P1 DROP BUTTON
          p.dropId = id;
          p.downHeld = true;
          p.jumpEdge = false;
          p.jumpHeld = false;
          const myP = match.players[0];
          if(myP && myP.jbuf > 0) myP.jbuf = 0;
        }
        return;
      }
      // Floating Side-to-Side Joystick anywhere else in P1 half!
      p.joyId = id;
      p.startX = x;
      p.startY = y;
      p.curX = x;
      p.curY = y;
      p.active = true;
      p.offX = 0;
      p.left = false;
      p.right = false;
      return;
    } else {
      // --- Player 2 (Right Half) ---
      const p = LOCAL_TOUCH.p2;
      // Check if touch lands in P2's fixed button zone (right side of P2 cluster)
      if(x >= b.p2.btnMinX && x <= b.p2.btnMaxX && y >= b.p2.btnMinY && y <= b.p2.btnMaxY){
        if(y < b.p2.splitY){
          // P2 JUMP BUTTON
          p.jumpId = id;
          p.jumpEdge = true;
          p.jumpHeld = true;
          p.downHeld = false;
          const myP = match.players[1];
          if(myP) myP.jbuf = 0.16;
        } else {
          // P2 DROP BUTTON
          p.dropId = id;
          p.downHeld = true;
          p.jumpEdge = false;
          p.jumpHeld = false;
          const myP = match.players[1];
          if(myP && myP.jbuf > 0) myP.jbuf = 0;
        }
        return;
      }
      // Floating Side-to-Side Joystick anywhere else in P2 half!
      p.joyId = id;
      p.startX = x;
      p.startY = y;
      p.curX = x;
      p.curY = y;
      p.active = true;
      p.offX = 0;
      p.left = false;
      p.right = false;
      return;
    }
  }

  // Check Left horizontal joystick (Solo / Online) — FLOATING: spawns wherever you touch on left side
  if(match && screen === 'game' && isPlaying && isTouch && JOY.boundsL && !JOY.leftId){
    const bR = JOY.boundsR;
    const rightEdge = bR ? (bR.x - 30) : (CW * 0.65);
    if(x < rightEdge && y > 55){
      JOY.leftId = id;
      JOY.leftStartX = x;
      JOY.leftStartY = y;
      JOY.leftX = 0;
      TOUCH.left = false;
      TOUCH.right = false;
      return;
    }
  }
  // Check Right vertical dual jump/drop slider (Solo / Online)
  if(match && screen === 'game' && isPlaying && isTouch && JOY.boundsR){
    const b = JOY.boundsR;
    if(x >= b.x - 24 && x <= b.x + b.w + 24 && y >= b.y - 24 && y <= b.y + b.h + 24){
      JOY.rightId = id;
      JOY.rightStartY = y;
      const off = clamp((y - b.cyTop) / b.maxTravel, 0, 1);
      JOY.rightY = off;
      
      // If touch starts on or near the drop zone (off > 0.22 or y > b.cyTop + 14) -> DROP ONLY, NEVER JUMP!
      if(off > 0.22 || y > b.cyTop + 14){
        TOUCH.downHeld = true;
        TOUCH.jumpEdge = false;
        TOUCH.jumpHeld = false;
        const myP = getMyPlayer();
        if(myP && myP.jbuf > 0) myP.jbuf = 0;
      } else {
        // Touching the top knob (JUMP ZONE)
        TOUCH.downHeld = false;
        TOUCH.jumpEdge = true;
        TOUCH.jumpHeld = true;
      }
      return;
    }
  }
  const z=zoneAt(x,y,false);
  if(z){
    touchPts.set(id,z);
    if(z.hold){keys.add(z.hold);}
    if(z.press){for(const c of z.press){pressed.add(c);glow[c]=tGlobal;}}
    if(z.touchAction){applyTouchAction(z.touchAction,true);}
    if(z.fn)z.fn();
  }
}
function inputMove(x,y,id){
  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isPlaying = (match && (match.state === 'playing' || match.state === 'countdown'));
  const isSplitLocal = (!isOnline && match && screen === 'game' && isPlaying && match.players && match.players.length === 2 && isTouch && !menu.botOn && menu.tab !== 'solo');
  if(isSplitLocal){
    const b = calcLocalBounds();
    // P1 Joystick
    if(LOCAL_TOUCH.p1.joyId === id){
      const p = LOCAL_TOUCH.p1;
      p.curX = x; p.curY = y;
      const dx = x - p.startX;

      p.right = (p.offX > 0.22);

function beep(f0,f1,dur,type,vol,delay){
  if(!AC||!master)return;type=type||'square';vol=vol||0.16;delay=delay||0;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn);gn.connect(master);o.start(t0);o.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol,delay){

  const t0=AC.currentTime+delay,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);

  const gn=AC.createGain();gn.gain.value=vol;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1100;
  src.connect(fl);fl.connect(gn);gn.connect(master);src.start(t0);
}

function cycleSlotCtrl(slot, d){
  if(!menu.slotCtrl) menu.slotCtrl = [0, 1, 2, 3];
  const total = LOCAL_CTRL_SCHEMES.length;
  let cur = menu.slotCtrl[slot] != null ? menu.slotCtrl[slot] : slot;
  
  // Find keyboard schemes already taken by other active players
  const taken = new Set();
  const act = (typeof activeSlots === 'function') ? activeSlots() : [0, 1];
  for(const other of act){
    if(other !== slot){
      const otherIdx = menu.slotCtrl[other];
      if(otherIdx != null){
        const s = LOCAL_CTRL_SCHEMES[((otherIdx % total) + total) % total];
        if(s && s.id !== 'controller'){
          taken.add(s.id);
        }
      }
    }
  }

  // Cycle to next available scheme, skipping taken keyboard schemes
  for(let step = 1; step <= total; step++){
    const nextIdx = ((cur + d * step) % total + total) % total;
    const candidate = LOCAL_CTRL_SCHEMES[nextIdx];
    if(!candidate) continue;
    if(!taken.has(candidate.id) || candidate.id === 'controller'){
      menu.slotCtrl[slot] = nextIdx;
      break;
    }
  }
  sfx('ui');
}

/* Custom maps from tag_map_editor.html override the built-ins (same browser).
   Editor saves to 'tag_arena_custom_maps_v1'; invalid saves are ignored safely. */
function syncCustomMaps(){
  try{
    const raw=localStorage.getItem('tag_arena_custom_maps_v1');
    if(!raw)return;
    const a=JSON.parse(raw);
    if(!Array.isArray(a)||!a.length)return;
    const ok=a.every(m=>m&&typeof m.name==='string'&&['solids','speeds','drops','boosts'].every(k=>
      Array.isArray(m[k])&&m[k].every(p=>Array.isArray(p)&&p.length>=4&&p.slice(0,4).every(Number.isFinite))));
    if(ok&&a.length<=40)MAPS.splice(0,MAPS.length,...a);
  }catch(e){/* keep built-in maps */}
}
function buildLevel(){
  const M=MAPS[settings.map%MAPS.length];
  SOLIDS=[
    {x:0,y:0,w:W,h:WALL,t:'solid',wall:1},{x:0,y:H-WALL,w:W,h:WALL,t:'solid',wall:1},
    {x:0,y:0,w:WALL,h:H,t:'solid',wall:1},{x:W-WALL,y:0,w:WALL,h:H,t:'solid',wall:1}
  ];
  /* All horizontal platforms are normalized to player height (46px); tops stay put so jump gaps never change */
  const P46=a=>({x:a[0],y:a[1],w:a[2],h:(a[3]<=32?46:a[3]),dy:a[4]||0});
  for(const a of M.solids){const p=P46(a);p.t='solid';SOLIDS.push(p);}
  for(const a of M.speeds){const p=P46(a);p.t='speed';SOLIDS.push(p);}
  for(const a of M.drops){const p=P46(a);p.t='drop';SOLIDS.push(p);}
  for(const a of M.boosts){const p=P46(a);p.t='boost';SOLIDS.push(p);}
}

function harnessBuildCases(mapIdx){
  HARNESS.map = mapIdx;
  HARNESS.nodes = [];
  // 1. Extract valid platform surfaces
  for(let i = 1; i < SOLIDS.length; i++){
    const s = SOLIDS[i];
    if(s.wall && s.y !== H - WALL) continue;
    if(s.w < 50 && s.h > s.w * 1.5) continue;
    HARNESS.nodes.push(s);
  }

  // 2. Identify symmetric pairs across arena midline (W = 2400)
  HARNESS.mirrorMap.clear();
  for(let i = 0; i < HARNESS.nodes.length; i++){
    const a = HARNESS.nodes[i];
    const aMid = a.x + a.w / 2;
    for(let j = 0; j < HARNESS.nodes.length; j++){
      const b = HARNESS.nodes[j];
      const bMid = b.x + b.w / 2;
      if(Math.abs(bMid - (W - aMid)) < 30 && Math.abs(b.y - a.y) < 16){
        HARNESS.mirrorMap.set(i, j);
        break;
      }
    }
  }

  // 3. Generate candidate pairs with strict pruning
  const cases = [];
  const visitedCanonical = new Set();

  for(let i = 0; i < HARNESS.nodes.length; i++){
    const A = HARNESS.nodes[i];
    for(let j = 0; j < HARNESS.nodes.length; j++){
      if(i === j) continue;
      const B = HARNESS.nodes[j];

      // Filter 1: Prune flat side-by-side
      const isFlat = Math.abs(A.y - B.y) <= 16;
      const gap = Math.max(0, B.x - (A.x + A.w), A.x - (B.x + B.w));
      if(isFlat && gap < 50) continue;

      // Filter 2: Prune impossible reach
      const dy = B.y - A.y;
      const dx = Math.abs((B.x + B.w/2) - (A.x + A.w/2));
      const maxRise = (A.t === 'boost') ? 690 : 510;
      if(dy < -maxRise || dx > 850) continue;

      // Filter 3: Prune symmetric duplicates
      const mI = HARNESS.mirrorMap.get(i), mJ = HARNESS.mirrorMap.get(j);
      if(mI !== undefined && mJ !== undefined){
        const canonicalKey = (mI < i || (mI === i && mJ < j)) ? (mI + '->' + mJ) : (i + '->' + j);
        if(visitedCanonical.has(canonicalKey)) continue;
        visitedCanonical.add(canonicalKey);
      }

      const parT = Math.max(2.8, 1.2 + dx / 380 + Math.abs(dy) / 280);
      cases.push({ from: i, to: j, dx, dy, par: parT });
    }
  }
  HARNESS.cases = cases;
  HARNESS.ci = 0;
}

function harnessCurCase(){
  if(!HARNESS.cases.length) return null;
  return HARNESS.cases[HARNESS.ci % HARNESS.cases.length];
}

function harnessResetTrial(){
  const c = harnessCurCase();
  if(!c || !match || !match.players || !match.players.length) return;
  const A = HARNESS.nodes[c.from], B = HARNESS.nodes[c.to];
  const p0 = match.players[0];

  if(HARNESS.mode === 'record'){
    // Player 0 spawns on Platform A
    p0.x = clamp(A.x + A.w / 2 - p0.w / 2, A.x + 8, A.x + A.w - p0.w - 8);
    p0.y = (A.dy ? A.y + (p0.x - A.x) * (A.dy / A.w) : A.y) - p0.h - 4;
    p0.vx = 0; p0.vy = 0; p0.airJumps = 1;
    p0.grounded = true; p0.gp = A;
  } else {
    // Playback mode: Player 0 stands on Target B, Bot (P1) spawns on A
    p0.x = clamp(B.x + B.w / 2 - p0.w / 2, B.x + 8, B.x + B.w - p0.w - 8);
    p0.y = (B.dy ? B.y + (p0.x - B.x) * (B.dy / B.w) : B.y) - p0.h - 4;
    p0.vx = 0; p0.vy = 0; p0.grounded = true; p0.gp = B;

    if(match.players.length > 1){
      const p1 = match.players[1];
      p1.x = clamp(A.x + A.w / 2 - p1.w / 2, A.x + 8, A.x + A.w - p1.w - 8);
      p1.y = (A.dy ? A.y + (p1.x - A.x) * (A.dy / A.w) : A.y) - p1.h - 4;
      p1.vx = 0; p1.vy = 0; p1.airJumps = 1;
      p1.grounded = true; p1.gp = A;
    }
  }

  HARNESS.t = 0;
  HARNESS.holdT = 0;
  HARNESS.started = false;
  HARNESS.trace = [];
  HARNESS.playbackT = 0;
  HARNESS.playbackStep = 0;
}

function harnessFeetOn(p, s){
  if(!p || !s) return false;
  const feet = p.y + p.h;
  const sTop = s.dy ? s.y + (clamp(p.x + p.w/2, s.x, s.x + s.w) - s.x) * (s.dy / s.w) : s.y;
  const onX = (p.x + p.w > s.x + 4) && (p.x < s.x + s.w - 4);
  const onY = (feet >= sTop - 6) && (feet <= sTop + 24);
  return onX && onY && (p.grounded || Math.abs(p.vy) < 80);
}

function harnessRecordSample(){
  const c = harnessCurCase();
  if(!c || !HARNESS.trace.length) return;
  const key = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  if(!HARNESS.transitions[mapKey]) HARNESS.transitions[mapKey] = {};

  const launchStep = HARNESS.trace.find(s => s.je) || HARNESS.trace[0];
  const djStep = HARNESS.trace.find((s, idx) => idx > 0 && s.je);

  const sample = {
    key: key,
    from: c.from,
    to: c.to,
    map: HARNESS.map,
    time: +HARNESS.t.toFixed(2),
    launchX: launchStep ? launchStep.x : 0,
    hasDoubleJump: !!djStep,
    doubleJumpDelay: djStep ? +(djStep.t - (launchStep ? launchStep.t : 0)).toFixed(2) : 0,
    trace: HARNESS.trace.map(s => ({
      t: +s.t.toFixed(2),
      x: s.x, y: s.y,
      vx: s.vx, vy: s.vy,
      d: s.d, je: s.je, jh: s.jh, dn: s.dn
    }))
  };

  HARNESS.transitions[mapKey][key] = sample;

  // Auto-mirror if bilateral symmetry exists
  const mFrom = HARNESS.mirrorMap.get(c.from), mTo = HARNESS.mirrorMap.get(c.to);
  if(mFrom !== undefined && mTo !== undefined){
    const mirrorKey = mFrom + '->' + mTo;
    const mirroredSample = {
      key: mirrorKey,
      from: mFrom,
      to: mTo,
      map: HARNESS.map,
      time: sample.time,
      launchX: Math.round(W - sample.launchX),
      hasDoubleJump: sample.hasDoubleJump,
      doubleJumpDelay: sample.doubleJumpDelay,
      trace: sample.trace.map(s => ({
        t: s.t,
        x: Math.round(W - s.x - 46),
        y: s.y,
        vx: -s.vx,
        vy: s.vy,
        d: -s.d,
        je: s.je,
        jh: s.jh,
        dn: s.dn
      }))
    };
    HARNESS.transitions[mapKey][mirrorKey] = mirroredSample;
  }

  harnessSaveStored();
  HARNESS.done++;
  HARNESS.okN++;
}

function harnessToggleBotTest(){
  const c = harnessCurCase();
  if(!c) return;
  const key = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  const hasSample = HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key];

  if(HARNESS.mode === 'record'){
    if(!hasSample){
      toast('⚠️ Jump successfully first to record data before testing bot!');
      sfx('back');
      return;
    }
    HARNESS.mode = 'playback';
    harnessResetTrial();

  } else {
    HARNESS.mode = 'record';

    toast('🏃 RECORD MODE: Jump to glowing platform');
    sfx('ui');
  }
}

    if(!HARNESS.started){
      if(keys.has('KeyA') || keys.has('KeyD') || keys.has('KeyW') || keys.has('Space') ||
         keys.has('ArrowLeft') || keys.has('ArrowRight') || keys.has('ArrowUp')){
        HARNESS.started = true;
      } else {
        return;
      }
    }

    HARNESS.t += dt;

    if(harnessFeetOn(pl, tgt)){
      HARNESS.holdT += dt;
      if(HARNESS.holdT >= 0.25){
        harnessRecordSample();
        sfx('go');
        HARNESS.ci = (HARNESS.ci + 1) % HARNESS.cases.length;
        harnessResetTrial();
        toast('✅ CLEAN LANDING RECORDED!');
        return;
      }
    } else {
      HARNESS.holdT = 0;
    }

    if(HARNESS.t >= c.par){
      toast('⏰ TIME OVER PAR (' + c.par.toFixed(1) + 's) — [E] TO RETRY');
      sfx('back');
      harnessResetTrial();
      return;
    }
  } else {
    // Playback mode:
    HARNESS.playbackT += dt;
    const botP = match.players[1];
    if(botP && harnessFeetOn(botP, tgt)){
      HARNESS.holdT += dt;
      if(HARNESS.holdT >= 0.5){
        sfx('go');
        toast('🎯 BOT REACHED YOU SUCCESSFULLY!');
        harnessResetTrial();
      }
    }
  }
}

function harnessPushTrace(p, inp){
  if(!HARNESS.active || HARNESS.mode !== 'record' || !HARNESS.started || p.slot !== 0) return;
  HARNESS.trace.push({
    t: +HARNESS.t.toFixed(3),
    x: Math.round(p.x),
    y: Math.round(p.y),
    vx: Math.round(p.vx),
    vy: Math.round(p.vy),
    d: inp.dir,
    je: inp.jumpEdge ? 1 : 0,
    jh: inp.jumpHeld ? 1 : 0,
    dn: inp.downHeld ? 1 : 0,
    g: p.grounded ? 1 : 0
  });
}

function harnessBotPlaybackInput(p, dt){
  const c = harnessCurCase();
  if(!c) return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
  const key = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  const sample = HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key];
  if(!sample || !sample.trace || !sample.trace.length){
    return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
  }

  const curT = HARNESS.playbackT;
  let step = sample.trace[0];
  for(let i = 0; i < sample.trace.length; i++){
    if(sample.trace[i].t <= curT) step = sample.trace[i];
    else break;
  }

  const isEdge = (step.je === 1) && (!p._lastStepJe);
  p._lastStepJe = (step.je === 1);

  return {
    dir: step.d,
    jumpEdge: isEdge,
    jumpHeld: !!step.jh,
    downHeld: !!step.dn
  };
}

function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||0)*dt;

/* ================= PHYSICS: RELIABLE PINK DROP/JUMP-THROUGH & AIRTIGHT SOLIDS ================= */
function hitRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hitRectInclusive(a,b){return a.x<=b.x+b.w&&a.x+a.w>=b.x&&a.y<=b.y+b.h&&a.y+a.h>=b.y;}

function zoneAtFeet(p,type){
  const feet=p.y+p.h;
  for(const s of SOLIDS){
    if(s.t!==type)continue;

    S.jumpQ=false;S.dropHold=Math.max(0,(S.dropHold||0)-botThinkRate);
    const headBlocked=botSolidBetween(cx,p.y-4,cx,p.y-140,p.gp);
    if(p.grounded){
      S.airT2=0;S.climbT=0;S.climbPlat=null;S.climbOut=0;
      const onSpeed=p.grounded&&!!zoneAtFeet(p,'speed');
      const onBoost=p.grounded&&!!zoneAtFeet(p,'boost');
      const fastGround=onSpeed||Math.abs(p.vx)>380;
      const wallDist=fastGround?75:44;
      const wallAhead=botWallAhead(p,want,wallDist);
      const ceilAbove=botCeilAbove(p,48);
      const isJumpableWall=wallAhead&&(wallAhead.y>p.y-170)&&!ceilAbove;
      const isDropEscape=wallAhead&&!isJumpableWall&&!!botFullyOnDrop(p);

      // Phase 3: S1 High-Ground Zoning detection & criteria
      const hunterBelow=ty>(p.y+p.h+70);
      const onSolidPlatform=p.grounded&&p.gp&&!p.gp.wall&&p.gp.t!=='drop';
      const hunterSameTier=Math.abs(ty-(p.y+p.h))<65;
      const hunterDangerClose=Math.abs(dx)<110;
      const isPinkJuke=(S.pinkJukePhase!==0);
      const allowHighGroundDrop=hunterSameTier||hunterDangerClose||isPinkJuke;
      const holdHighGround=!isIt&&hunterBelow&&onSolidPlatform&&!allowHighGroundDrop;

      if(isDropEscape){
        // Trapped by giant unjumpable wall/pillar on drop platform: drop down to escape!
        S.jumpQ=false;
      } else if(isIt){
        // CHASE: Touchdown ambush, edge launch, boost pad, direct beeline, and climb toward prey above
        const inTagRange = (Math.abs(dx) < 65 && Math.abs(dy) < 80) || (Math.abs(touchdownX - cx) < 65 && Math.abs(touchdownY - (p.y + p.h)) < 60);
        const edgeMargin=onSpeed?72:42;
        let edgeJump=false;
        if(aboveBy>50&&p.gp){
          const dEdge=Math.min(Math.abs(cx-p.gp.x),Math.abs(cx-(p.gp.x+p.gp.w)));
          if(dEdge<edgeMargin)edgeJump=true;
        }
        if(!edgeJump&&S.hasExit&&aboveBy>50&&Math.abs(cx-S.exitX)<(onSpeed?72:52))edgeJump=true;
        if(onBoost&&aboveBy>40){edgeJump=true;}
        if(isDirectPath&&aboveBy>40&&!headBlocked){edgeJump=true;}
        if(isTargetDescending && isTouchdownFrame && inTagRange && !headBlocked && !ceilAbove){
          S.jumpQ=true;
        }
        else if(edgeJump){S.jumpQ=true;}
        else if(aboveBy>70&&Math.abs(dx)<260&&!headBlocked){S.jumpQ=true;}
        else if(isJumpableWall){S.descLockT=0;S.descDir=0;S.jumpQ=true;}
        else if(wallAhead&&!isJumpableWall){
          // Unjumpable barrier: do NOT jump into it, turn around!
          S.jumpQ=false;
          want=-want;S.dir=want;
        }
        else if(Math.abs(p.vx)<60&&want!==0&&far&&!ceilAbove){S.jumpQ=true;}
        else if(!botGroundAhead(p,want,fastGround?125:80)&&far){S.jumpQ=true;} // gap: jump across
      } else {
        // FLEE: Jump over obstacles, gaps, perform corner wall flank, or turn around at unjumpable pillars
        if(S.pinkJukePhase===1){
          // Dropping beneath pink floor, do NOT jump
          S.jumpQ=false;
        }else if(S.pinkJukePhase===2){
          // Pop back up through pink platform
          S.jumpQ=true;S.jumpHoldT=0.15;
        }else if(isCornerJuke){
          S.jumpQ=true;S.jumpHoldT=0.14;
        }else if(onBoost&&Math.hypot(dx,dy)<340&&!ceilAbove){
          // Super-launch off blue boost pad to break hunter's pursuit!
          S.jumpQ=true;S.jumpHoldT=0.16;
        }else if(isJumpableWall){
          S.jumpQ=true;
          if(fastGround)S.jumpHoldT=0.15;
        }else if(wallAhead&&!isJumpableWall&&!isDropEscape){
          // Unjumpable barrier / tall pillar / ceiling-blocked wall:
          // Do NOT run face-first into it! Turn around and evade!
          want=-want; S.dir=want;
          // If hunter is closing in from behind and ceiling is clear, leap over hunter!
          const hunterAheadAfterTurn=(dx*want>0);
          if(hunterAheadAfterTurn&&Math.abs(dx)<140&&!ceilAbove){
            S.jumpQ=true;S.jumpHoldT=0.14;
          }else{
            S.jumpQ=false;
          }
        }else if(holdHighGround){
          // HIGH-GROUND ZONING: prioritize staying on upper platform above hunter!
          // Suppress accidental downward walk-offs, keep running along platform or camp near center / wall-jump corner.
          S.jumpQ=false;
          const platL=p.gp.x, platR=p.gp.x+p.gp.w;
          const platCenter=platL+p.gp.w/2;
          const hasWallL=(platL<=WALL+30)||(p.x<=WALL+35)||!!botWallAhead(p,-1,35);
          const hasWallR=(platR>=W-WALL-30)||(p.x+p.w>=W-WALL-35)||!!botWallAhead(p,1,35);
          const hasGroundL=botGroundAhead(p,-1,45);
          const hasGroundR=botGroundAhead(p,1,45);

          if(p.gp.w<150&&!hasWallL&&!hasWallR&&!hasGroundL&&!hasGroundR){
            // Narrow isolated platform with drops on both sides: camp near platform center
            const dCenter=cx-platCenter;
            if(Math.abs(dCenter)>20){
              want=Math.sign(platCenter-cx); S.dir=want;
            }else{
              want=0; S.dir=0;
            }
          }else if(want>0){
            // Running right: check if approaching an open drop edge or wall-jump corner
            const dEdgeR=platR-(p.x+p.w);
            if(!hasWallR&&!hasGroundR&&dEdgeR<40){
              if(dEdgeR<=10){
                want=-1; S.dir=-1; // step back from ledge
              }else{
                want=0; S.dir=0; // camp safely before edge
              }
            }else if(hasWallR&&dEdgeR<18){
              // Camp in wall-jump corner
              want=0; S.dir=0;
            }
          }else if(want<0){
            // Running left: check if approaching an open drop edge or wall-jump corner
            const dEdgeL=p.x-platL;
            if(!hasWallL&&!hasGroundL&&dEdgeL<40){
              if(dEdgeL<=10){
                want=1; S.dir=1; // step back from ledge
              }else{
                want=0; S.dir=0; // camp safely before edge
              }
            }else if(hasWallL&&dEdgeL<18){
              // Camp in wall-jump corner
              want=0; S.dir=0;
            }
          }
        }else if(!botGroundAhead(p,want,fastGround?125:80)&&far){
          S.jumpQ=true;
          if(fastGround)S.jumpHoldT=0.16;
        }
        else if(Math.abs(p.vx)<60&&want!==0&&far&&!ceilAbove){S.jumpQ=true;}
      }
      // DOWN: target clearly below -> pink drop wins, else score 3 fall-lines.
      // Locked while committed so pink/brown seams can't flip dir every think.
      let down=isDropEscape||(S.pinkJukePhase===1)||false;
      if(isDropEscape){S.dropNoJumpT=0.85;}
      const belowGap=ty-(p.y+p.h);
      const sameTier=Math.abs(belowGap)<60&&Math.abs(dx)<200;
      if(isIt&&belowGap>60&&!sameTier){
        const onPink=botFullyOnDrop(p);
        if(isDirectPath&&belowGap>50&&onPink){
          down=true;
        }
        else if(S.descLockT>0&&S.descDir){
          // committed: hold lane, only pink state updates
          want=S.descDir;S.dir=want;
          down=!!onPink;
          if(!down)S.jumpQ=false;
        }
        else if(onPink&&(Math.abs(dx)<220||belowGap<300)){
          down=true;
          S.descLockT=0.25;S.descDir=S.dir||want||Math.sign(dx)||1;
          want=S.descDir;S.dir=want;
        }
        else if(p.gp&&!p.gp.wall){
          const scoreLane=(lx)=>{
            let hits=0;
            const y0=p.y+p.h+10, y1=ty;
            const dyLane=Math.abs(y1-y0);
            const kSteps=Math.max(3, Math.ceil(dyLane/24));
            for(let k=1; k<kSteps; k++){
              const sy=y0+(y1-y0)*k/kSteps;
              const pt={x:lx-3, y:sy-3, w:6, h:6};
              for(const s of SOLIDS){if(s.t==='drop')continue;if(hitRect(pt,s)){hits++;break;}}
            }
            return hits*200+Math.abs(lx-cx);
          };
          const cC=scoreLane(cx),cL=scoreLane(cx-150),cR=scoreLane(cx+150);
          let wdir;
          // default nearest edge, overridden by clearest lane
          const dL0=Math.abs(cx-p.gp.x),dR0=Math.abs(cx-(p.gp.x+p.gp.w));
          wdir=dL0<dR0?-1:1;
          if(cL<cC&&cL<=cR)wdir=-1;else if(cR<cC&&cR<cL)wdir=1;
          // clear-air flank check: if chosen side fall-line to target is empty, keep it
          want=wdir;S.dir=wdir;S.descLockT=0.35;S.descDir=wdir;
          S.jumpQ=false; // walk off cleanly, don't hop
        }
      }
      if(holdHighGround){
        down=false;
        S.wantDown=false;
        S.descLockT=0;
        S.descDir=0;
      }else{
        S.wantDown=down;
      }
      if(S.jumpQ)S.jumpHoldT=Math.max(S.jumpHoldT||0,0.12);
      if(S.descLockT>0&&!down&&!botWallAhead(p,want)){S.jumpQ=false;}
    }else{
      // AIR: gated wall-jumps + relaxed apex chaining + outward-hold anti-clip.
      const belowGapAir=ty-(p.y+p.h);
      const onOuterWall=(p.x<=WALL+16||p.x+p.w>=W-WALL-16);
      const isClimbing=(ty<p.y-40);
      S.airT2=(S.airT2||0)+botThinkRate;
      // Outward hold: rising past an overhang, keep pushing out until feet
      // clear the slab top, else we turn in early and clip the corner.
      if(S.climbPlat&&p.vy<0&&(p.y+p.h)>S.climbPlat.y){
        if(!onOuterWall){S.dir=S.climbOut||S.dir;S.climbT=0.15;}
      }else if(S.climbT>0){
        S.climbT-=botThinkRate;
        if(p.vy<0&&!onOuterWall&&S.climbOut)S.dir=S.climbOut;
        if(S.climbT<=0||(p.y+p.h)<(S.climbPlat?S.climbPlat.y:1e9))S.climbPlat=null;
      }
      if(p.sideT>0&&p.wallJumps<2){
        // Outer walls OK, interior only when climbing.
        if(onOuterWall||isClimbing||!isIt){
          if(belowGapAir<=60||!isIt){S.jumpQ=true;S.jumpHoldT=0.14;}
          else S.jumpQ=false;
        }else S.jumpQ=false;
      }
      else if(p.airJumps>0){
        // Double Jump Apex Chaining:
        // CHASE: Sweet-spot apex chaining (-130 < vy < 110) yields max vertical rise (~420px total)
        const apexWindow=(p.vy>-130&&p.vy<110);
        const headClear=!botSolidBetween(cx,p.y-4,cx,p.y-100,p.gp);
        if(isIt&&aboveBy>50&&apexWindow&&headClear&&S.airT2>0.10){
          const inDir=Math.sign(dx)||S.dir;
          if(p.vy<0&&botWallAhead(p,inDir)&&!onOuterWall){
            S.jumpQ=true;S.jumpHoldT=0.14;
          }else{
            S.jumpQ=true;S.jumpHoldT=0.14;S.dir=inDir;
          }
        }
        // FLEE: Airborne, falling into gap or blocked by wall -> double jump to clear obstacle
        else if(!isIt&&p.vy>50&&S.airT2>0.12){
          if(!botGroundAhead(p,want)||botWallAhead(p,want)){
            S.jumpQ=true;S.jumpHoldT=0.14;
          }
        }
      }
      else if(belowGapAir>60){S.jumpQ=false;}
      S.wantDown=false;
      // Falling: steer onto the slab below, avoiding the player's landing and intercept path!
      if(p.vy>80&&belowGapAir>40){
        S.descLockT=0;S.descDir=0;
        let landingSlab=null,closestDist=1e9;
        for(const s of SOLIDS){
          if(s.t==='drop')continue;
          if(s.y>=p.y+p.h+15&&s.y<=ty+60){
            if(cx>=s.x-40&&cx<=s.x+s.w+40){
              const dist=s.y-(p.y+p.h);
              if(dist<closestDist){closestDist=dist;landingSlab=s;}
            }
          }
        }
        if(landingSlab&&closestDist<180){
          if(isIt){
            // CHASE: steer onto slab toward target
            const safeX=clamp(tx,landingSlab.x+26,landingSlab.x+landingSlab.w-26);
            const offX=safeX-cx;
            if(Math.abs(offX)>36)S.dir=Math.sign(offX);
            else if(Math.abs(offX)<14)S.dir=0;
          }else{
            // FLEE: PREDICTIVE LANDING AVOIDANCE!
            // Calculate where hunter will be when bot lands:
            const timeToLand = Math.max(0.08, (landingSlab.y - (p.y + p.h)) / Math.max(p.vy, 150));
            const predWindow = 0.35;
            const predHunterX = tx + clamp((target.vx || 0) * (timeToLand + predWindow), -260, 260);

            // Steer towards the side of the platform furthest from where hunter will be:
            const leftX = landingSlab.x + 24;
            const rightX = landingSlab.x + landingSlab.w - 24;
            const dLeft = Math.abs(predHunterX - leftX);
            const dRight = Math.abs(predHunterX - rightX);
            const safeX = (dLeft > dRight) ? leftX : rightX;

            // If hunter is intercepting this exact landing spot and bot has an air jump, double-jump away!
            const hunterInterceptDanger = p.airJumps > 0 && Math.abs(predHunterX - cx) < 70 && Math.abs(ty - landingSlab.y) < 90;
            if(hunterInterceptDanger && S.airT2 > 0.12){
              S.jumpQ = true;
              S.jumpHoldT = 0.14;
              S.dir = (predHunterX > cx ? -1 : 1);
            } else {
              const offX = safeX - cx;
              if(Math.abs(offX) > 28) S.dir = Math.sign(offX);
              else if(Math.abs(offX) < 12) S.dir = 0;
            }
          }
        }else if(Math.abs(dx)<60){
          if(isIt&&aboveBy>40&&botSolidBetween(cx,p.y-10,cx,ty,p.gp)){
            S.dir=S.exitDir||(cx<W/2?1:-1);
          }else if(!isIt){
            // Falling straight down: drift away from hunter's predicted path
            const predHunterDir = Math.sign((target.vx || dx) || 1);
            S.dir = -predHunterDir;
          }else{
            S.dir=0;
          }
        }
      }
      // Rising: curl inward once the outward hold is done
      else if(isIt&&p.vy<0&&aboveBy>40&&p.vy>-250){
        if(!S.climbPlat&&Math.abs(dx)>20)S.dir=Math.sign(dx);
      }
      // FLEE AIR STALL / REVERSE FEINT:
      if(!isIt&&S.pinkJukePhase===0){
        const hunterCloseAir=Math.abs(dx)<180&&Math.abs(dy)<120;
        const hunterFast=Math.abs(target.vx||0)>180;
        if(hunterCloseAir&&hunterFast&&S.airBrakeCooldown<=0&&S.airBrakeT<=0){
          S.airBrakeT=0.18;
          S.airBrakeCooldown=2.6;
        }
        if(S.airBrakeT>0){
          S.airBrakeT-=stepDt;
          S.dir=p.vx!==0?-Math.sign(p.vx):0;
        }
      }
    }
  }
  // bonk detect: was rising, now stopped, under a solid
  if(p.vy>=0&&S.wasVy!==undefined&&S.wasVy<-350&&!p.grounded){
    // check ceiling right above head
    const hp={x:p.x+6,y:p.y-14,w:p.w-12,h:12};
    for(const s of SOLIDS){if(s.t==='drop')continue;if(hitRect(hp,s)){S.bonks++;S.bonkT=1.0;break;}}
    if(S.bonks>=2){
      // Genuine ceiling hit while climbing: blacklist the tried side and
      // force the opposite flank for 1.5s (or until elevation is gained)
      S.decideT=0;S.bonks=0;
      let side=S.exitDir;
      if(!side){
        const gp=p.gp||p.lastGp;
        side=gp?(Math.abs(cx-gp.x)<Math.abs(cx-(gp.x+gp.w))?-1:1):1;
      }
      S.bannedSide=side;S.banT=1.5;S.banTierY=p.y;
      S.exitLockT=0;S.exitDir=0;S.exitGp=null;S.hasExit=false;
      S.descLockT=0;S.descDir=0;
      S.climbPlat=null;S.climbOut=0;S.climbT=0;
      S.dir=-side;S.unstuckT=0.5;S.unstuckDir=S.dir;
    }
  }
  S.wasVy=p.vy;
  if(S.dropNoJumpT>0)S.jumpQ=false;
  const j=S.jumpQ;S.jumpQ=false;
  if(j)S.jumpHoldT=Math.max(S.jumpHoldT||0,0.12);
  let hold=!!j;
  if(S.jumpHoldT>0){S.jumpHoldT-=stepDt;hold=true;}
  return{dir:clamp(S.dir||0,-1,1),jumpEdge:!!j,jumpHeld:hold,downHeld:!!S.wantDown};
}

/* ================= PLATFORM NODES GEOMETRY HELPER ================= */
function demoNodes(){
  const r=[];
  for(const s of SOLIDS){
    if(!s.wall && !(s.w < 60 && s.h > s.w * 1.5)) r.push(s);
  }
  return r;
}
function inputFor(p,dt){
  if(typeof HARNESS !== 'undefined' && HARNESS.active && HARNESS.mode === 'playback' && p.slot === 1){
    return harnessBotPlaybackInput(p, dt);
  }
  if(isBotSlot(p)) return botInputFor(p,dt);
  
  const schemeIdx = (menu.slotCtrl && menu.slotCtrl[p.slot] != null) ? menu.slotCtrl[p.slot] : p.slot;
  const s = LOCAL_CTRL_SCHEMES[((schemeIdx % LOCAL_CTRL_SCHEMES.length) + LOCAL_CTRL_SCHEMES.length) % LOCAL_CTRL_SCHEMES.length] || LOCAL_CTRL_SCHEMES[0];
  const m = s.map || {};
  
  let dir = 0, jumpEdge = false, jumpHeld = false, downHeld = false;

  // Keyboard mapping
  if(m.L || m.R || m.U || m.D){
    const hasL = Array.isArray(m.L), hasR = Array.isArray(m.R);
    dir += (hasR ? (m.R.some(k => keys.has(k)) ? 1 : 0) : (keys.has(m.R) ? 1 : 0))
         - (hasL ? (m.L.some(k => keys.has(k)) ? 1 : 0) : (keys.has(m.L) ? 1 : 0));
    const hasU = Array.isArray(m.U), hasD = Array.isArray(m.D);
    jumpEdge = jumpEdge || (hasU ? m.U.some(k => pressed.has(k)) : pressed.has(m.U));
    jumpHeld = jumpHeld || (hasU ? m.U.some(k => keys.has(k)) : keys.has(m.U));
    downHeld = downHeld || (hasD ? m.D.some(k => keys.has(k)) : keys.has(m.D));
  }

  // Controller mapping
  if(s.id === 'controller'){
    let ctrlOrder = 0;
    if(menu && menu.slotCtrl){
      for(let sIdx = 0; sIdx < p.slot; sIdx++){
        const eIdx = menu.slotCtrl[sIdx];
        const eScheme = LOCAL_CTRL_SCHEMES[((eIdx % LOCAL_CTRL_SCHEMES.length) + LOCAL_CTRL_SCHEMES.length) % LOCAL_CTRL_SCHEMES.length];
        if(eScheme && eScheme.id === 'controller') ctrlOrder++;
      }
    }
    let connectedCount = 0;
    let pd = null;
    for(let pi = 0; pi < 4; pi++){
      if(PAD[pi] && PAD[pi].connected){
        if(connectedCount === ctrlOrder){
          pd = PAD[pi];
          break;
        }
        connectedCount++;
      }
    }
    if(!pd && PAD[p.slot] && PAD[p.slot].connected) pd = PAD[p.slot];
    if(!pd && PAD[0] && PAD[0].connected) pd = PAD[0];

    if(pd && pd.connected){
      dir += (pd.right ? 1 : 0) - (pd.left ? 1 : 0);
      jumpEdge = jumpEdge || pd.jumpE;
      jumpHeld = jumpHeld || pd.jumpHeld;
      downHeld = downHeld || pd.dropHeld;
    }
  }
  const isOnlineMatch = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isSplitLocal = (isTouch && !isOnlineMatch && match && match.players && match.players.length === 2 && !menu.botOn && menu.tab !== 'solo');
  if(!isSplitLocal && p.slot === (typeof NET !== 'undefined' && NET && NET.mySlot >= 0 ? NET.mySlot : 0)){
    if(TOUCH.left) dir = -1;
    if(TOUCH.right) dir = 1;
    if(TOUCH.jumpEdge) jumpEdge = true;
    if(TOUCH.jumpHeld) jumpHeld = true;
    if(TOUCH.downHeld) downHeld = true;
  }
  if(isSplitLocal){
    const gP = (p.slot === match.players[0].slot) ? LOCAL_TOUCH.p1 : ((p.slot === match.players[1].slot) ? LOCAL_TOUCH.p2 : null);
    if(gP){
      if(gP.left) dir = -1;
      if(gP.right) dir = 1;
      if(gP.jumpEdge){ jumpEdge = true; gP.jumpEdge = false; }
      if(gP.jumpHeld) jumpHeld = true;
      if(gP.downHeld) downHeld = true;
    }
  }
  const _demoOut={dir:clamp(dir,-1,1),jumpEdge:!!jumpEdge,jumpHeld:!!jumpHeld,downHeld:!!downHeld};
  if(typeof HARNESS!=='undefined'&&HARNESS.active&&HARNESS.mode==='record'&&p.slot===0){
    try{harnessPushTrace(p,_demoOut);}catch(e){}
  }

  return _demoOut;
}

function physUpdate(p,dt,allow){
  const wasG=p.grounded;
  if(wasG)p.coyote=0.11;else p.coyote-=dt;
  let dir=0,jumpP=false,jumpHeld=false,downHeld=false;
  if(allow){const inp=inputFor(p,dt);dir=inp.dir;jumpP=inp.jumpEdge;jumpHeld=inp.jumpHeld;downHeld=inp.downHeld;}
  const onSpeed=p.grounded&&!!zoneAtFeet(p,'speed');
  if(onSpeed&&!p.padOn)sfx('pad');
  p.padOn=onSpeed;
  const isIt=match.it===match.players.indexOf(p)&&match.state==='playing';
  const baseMax=isIt?IT_SPEED:RUN_SPEED;
  const maxs=baseMax*(onSpeed?SPEED_MULT:1);
  if(!onSpeed&&Math.abs(p.vx)>maxs){
    const target=Math.sign(p.vx)*maxs;
    p.vx+=(target-p.vx)*Math.min(1,dt*14);
  }
  
  /* SHARP ACCELERATION & SNAPPY BRAKING */
  const acc=p.grounded?ACC:AIR_ACC;
  const dec=p.grounded?DECEL:AIR_DEC;
  if(dir!==0){
    p.face=dir;
    const turning=(p.vx!==0&&Math.sign(p.vx)!==dir);
    p.vx+=dir*(turning?acc+dec*0.9:acc)*dt;
    if(dir*p.vx>maxs)p.vx=dir*maxs;
  }else{
    const d=dec*dt;
    if(Math.abs(p.vx)<=d)p.vx=0;else p.vx-=Math.sign(p.vx)*d;
  }
  
  if(jumpP)p.jbuf=0.16;else p.jbuf-=dt;
  
  /* PINK DROP-THROUGH: only the player's OWN down input counts, and only when
     FULLY standing on pink — the whole body (minus a 6px forgiveness margin)
     must be over the pink span. Straddling brown+pink (like standing on the
     seam) does nothing, so holding S while walking across never clips you. */
  const fullyOn=(plat)=>{
    if(!plat||plat.t!=='drop')return false;
    if(!plat.dy) return (p.x+6>=plat.x)&&(p.x+p.w-6<=plat.x+plat.w);
    if(!(p.x+6>=plat.x && p.x+p.w-6<=plat.x+plat.w)) return false;
    const sy=plat.y + (p.x - plat.x)*plat.dy/plat.w;
    return Math.abs(sy - (p.y+p.h)) < 20;
  };
  const planted=p.grounded&&p.gp&&fullyOn(p.gp);
  const hoverPlat=!p.grounded&&p.vy>-60&&p.vy<160?zoneAtFeet(p,'drop'):null;
  const hoverDrop=!!hoverPlat&&(p.x+6>=hoverPlat.x)&&(p.x+p.w-6<=hoverPlat.x+hoverPlat.w);
  if(downHeld&&(planted||hoverDrop)){
    p.jbuf = 0;
    const dropPlat=planted?p.gp:hoverPlat;
    if(dropPlat){
      p.dropT=0.35;
      p.grounded=false;
      p.gp=null;
      p.y+=8; /* Nudge feet past top surface to drop immediately */
      p.vy=Math.max(p.vy,160);
      sfx('drop');
      dust(p.x+p.w/2,p.y+p.h,5,60);
    }
  }
  if(p.dropT>0)p.dropT-=dt;
  
  /* WALL CONTACT FOR PARKOUR WALL-JUMP (NO SLOW-FALL WALL SLIDE) */
  const onWall=!p.grounded&&p.sideT>0;
  
  /* JUMP HANDLING: Ground, Wall-Jump, Double Jump, and Blue Pad Boost.
     Tap = shorter hop; holding jump sustains reduced gravity for 0.10s so a
     full hold rises just past the old fixed jump height. */
  if(p.jbuf>0 && !downHeld){
    if(p.grounded||p.coyote>0){
      const boost=(p.grounded&&zoneAtFeet(p,'boost'))?BOOST_MULT:1;
      p.vy=-JUMP_V*boost;
      p.vx=clamp(p.vx,-baseMax*1.1,baseMax*1.1);
      if(boost>1){sfx('boost');ringP(p.x+p.w/2,p.y+p.h,'#4a90e2');}else sfx('jump');
      p.grounded=false;p.coyote=0;p.jbuf=0;p.holdT=HOLD_LIFT_T;p.airJumps=settings.doubleJump?1:0;
      p.sy=1.10;p.sx=0.93;dust(p.x+p.w/2,p.y+p.h,5,70);
    }else if(onWall&&p.wallJumps<2){
      /* KICK OFF WALL! (Wall-Jump: Max 2 consecutive) */
      p.wallJumps++;
      p.vy=-JUMP_V*0.96;
      p.vx=-p.wallSide*480;
      p.face=-p.wallSide;
      p.sideT=0;p.jbuf=0;p.holdT=HOLD_LIFT_T;
      p.airJumps=settings.doubleJump?1:0;
      p.sy=1.09;p.sx=0.92;
      sfx('walljump');
      dust(p.x+(p.wallSide<0?0:p.w),p.y+p.h/2,4,80);
    }else if(p.airJumps>0){
      p.vy=-JUMP_V*0.95;p.airJumps--;p.jbuf=0;p.holdT=HOLD_LIFT_T;p.vx=clamp(p.vx,-baseMax*1.1,baseMax*1.1);sfx('djump');
      ringP(p.x+p.w/2,p.y+p.h/2,'#ffffff');p.sy=1.08;p.sx=0.94;
    }
  }

  /* Variable jump height: reduced gravity while jump is held and rising */
  if(p.holdT>0&&jumpHeld&&p.vy<0){p.vy+=G*HOLD_GRAV_F*dt;p.holdT-=dt;}
  else{p.vy+=G*dt;if(jumpHeld&&p.vy>=0)p.holdT=0;}
  if(p.vy>MAXFALL)p.vy=MAXFALL;

  /* Horizontal collision, sub-stepped so sprinters can't tunnel thin walls */
  const hSteps=(Math.abs(p.vx)*dt>13)?2:1;
  for(let hs=0;hs<hSteps;hs++){
  const leftBefore=p.x,rightBefore=p.x+p.w;
  p.x+=p.vx*dt/hSteps;
  for(const s of SOLIDS){
    if(s.t==='drop')continue; /* ONLY pink allows pass-through! */
    if(!s.dy){
      if(!hitRect(p,s))continue;
      /* If s is a thin horizontal platform (shelf/floor, not a vertical wall), only push if approaching from outside */
      if(!s.wall&&s.h<=46){
        const wasOutsideLeft=rightBefore<=s.x+2;
        const wasOutsideRight=leftBefore>=s.x+s.w-2;
        if(!wasOutsideLeft&&!wasOutsideRight)continue;
      }
      const fl=(p.x+p.w)-s.x,fr=(s.x+s.w)-p.x;
      if(fl<fr){p.x=s.x-p.w;if(p.vx>0)p.vx=0;p.wallSide=1;}
      else{p.x=s.x+s.w;if(p.vx<0)p.vx=0;p.wallSide=-1;}
      if((!s.wall||s.h>s.w)&&!wasG&&p.vy>-20){
        p.sideT=0.28;
      }
    }else{
      /* Tilted slope end-walls */
      if(p.vx>0&&p.x+p.w>=s.x&&leftBefore+p.w<=s.x+8){
        const yTop=s.y,yBot=s.y+s.h;
        if(p.y+p.h>yTop+4&&p.y<yBot-4){p.x=s.x-p.w;p.vx=0;p.wallSide=1;p.sideT=0.28;}
      }
      if(p.vx<0&&p.x<=s.x+s.w&&leftBefore>=s.x+s.w-8){
        const yTop=s.y+s.dy,yBot=s.y+s.dy+s.h;
        if(p.y+p.h>yTop+4&&p.y<yBot-4){p.x=s.x+s.w;p.vx=0;p.wallSide=-1;p.sideT=0.28;}
      }
    }
  }
  } /* end sub-step loop */
  
  /* Vertical collision: Slopes & solids are 100% solid! Pink is one-way & fall-through - vertical sub-stepped to prevent tunneling */
  p.grounded=false;
  const vSteps=(Math.abs(p.vy)*dt>23)?2:1;
  const subDt=dt/vSteps;
  for(let vs=0;vs<vSteps;vs++){
    const headBefore=p.y,feetBefore=p.y+p.h;
    p.y+=p.vy*subDt;
  
  for(const s of SOLIDS){
    if(!s.dy){
      /* Flat platform */
      const xOverlap=(p.x+p.w>s.x+2&&p.x<s.x+s.w-2);
      if(!xOverlap)continue;
      
      if(s.t==='drop'){
        /* PINK DROP PLATFORM:
           1. NEVER blocks jumping up (can always jump through from below)
           2. Passes through when dropT>0 (just triggered a drop), OR when the
              player's OWN down is held AND they are FULLY on this pink span.
              Straddling a brown/pink seam while holding S does NOT fall —
              the neighbouring solid still catches you (see solid branch).
           3. Lands only when falling downward and feet cross the top surface */
        const fullyHere=(p.x+6>=s.x)&&(p.x+p.w-6<=s.x+s.w);
        if(p.dropT>0||(downHeld&&fullyHere))continue;
        if(p.vy>0&&feetBefore<=s.y+6&&p.y+p.h>=s.y&&p.y+p.h<=s.y+s.h+10){
          const imp=p.vy;
          p.y=s.y-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
        }
        continue;
      }
      
      /* Solid brown, orange speed, or blue boost: FULLY SOLID FROM TOP AND BOTTOM!
         Holding S only lets you fall where pink already let go (dropT>0, or a
         pink span at this height that you are FULLY standing on). A straddler
         holding S still lands on this solid — never sinks through the seam. */
      if(p.vy>0){
        /* Falling down onto platform */
        if(p.dropT>0||downHeld){
          /* If currently dropping through, do NOT catch on adjacent/overlapping solids at same level! */
          const hasDropAtY=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-s.y)<=10&&p.x+p.w>d.x+2&&p.x<d.x+d.w-2&&(p.x+6>=d.x)&&(p.x+p.w-6<=d.x+d.w));
          if(hasDropAtY)continue;
        }
        if(feetBefore<=s.y+8&&p.y+p.h>=s.y&&p.y<s.y+s.h){
          const imp=p.vy;
          p.y=s.y-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
        }
      }else if(p.vy<0){
        /* Jumping UP: head bonks the solid underside — UNLESS the player's body
           actually overlaps a pink platform at this height (i.e. jumping up
           through pink that shares the seam). The pink must cover the player's
           center, not merely sit nearby, so brown/pink edge seams stay solid. */
        const midX=p.x+p.w/2;
        const thruPink=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-s.y)<=10&&midX>d.x+4&&midX<d.x+d.w-4);
        if(!thruPink&&headBefore>=s.y+s.h-8&&p.y<=s.y+s.h&&p.y+p.h>s.y){
          p.y=s.y+s.h;
          p.vy=0;
        }
      }
    }else{
      /* Tilted platform / slope */
      const xOverlap=(p.x+p.w>s.x+2&&p.x<s.x+s.w-2);
      if(!xOverlap)continue;
      
      const px=clamp(p.x+p.w/2,s.x,s.x+s.w);
      const syTop=s.y+(px-s.x)*(s.dy/s.w);
      const syBot=syTop+s.h;
      
      if(s.t==='drop'){
        const fullyHere0=(p.x+6>=s.x)&&(p.x+p.w-6<=s.x+s.w);
        if(p.dropT>0||(downHeld&&fullyHere0))continue;
        if(p.vy>0&&feetBefore<=syTop+6&&p.y+p.h>=syTop&&p.y+p.h<=syBot+8){
          const imp=p.vy;
          p.y=syTop-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
          p.grounded=true;
          p.vx+=Math.sign(s.dy)*600*subDt;
        }
        continue;
      }
      
      if(p.vy>=0){
        if(p.dropT>0||downHeld){
          const hasDropAtY=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-syTop)<=12&&p.x+p.w>d.x+2&&p.x<d.x+d.w-2&&(p.x+6>=d.x)&&(p.x+p.w-6<=d.x+d.w));
          if(hasDropAtY)continue;
        }
        /* Landing on top of slope */
        if(feetBefore<=syTop+8&&p.y+p.h>=syTop-6&&p.y<syBot){
          const imp=p.vy;
          p.y=syTop-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
          p.grounded=true;
          p.vx+=Math.sign(s.dy)*600*subDt;
        }
      }else if(p.vy<0){
        /* Jumping UP into slope: head hits bottom, unless rising through pink at the seam */
        const midX2=p.x+p.w/2;
        const thruPink2=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-syTop)<=12&&midX2>d.x+4&&midX2<d.x+d.w-4);
        if(!thruPink2&&headBefore>=syBot-10&&p.y<=syBot&&p.y+p.h>syTop){
          p.y=syBot;
          p.vy=0;
        }
      }
    }
  }
  }
  
  p.x=clamp(p.x,WALL,W-WALL-p.w);
  if(p.x<=WALL){p.wallSide=-1;if(!p.grounded&&p.vy>-20)p.sideT=0.28;}
  else if(p.x>=W-WALL-p.w){p.wallSide=1;if(!p.grounded&&p.vy>-20)p.sideT=0.28;}
  p.y=clamp(p.y,WALL,H-WALL-p.h);
  if(p.y>=H-WALL-p.h){
    /* Arena floor counts as a landing: squash, dust and sound included */
    if(!wasG&&!p.grounded)landOn(p,SOLIDS[1],p.vy,wasG);
    else{p.grounded=true;p.gp=SOLIDS[1];p.lastGp=SOLIDS[1];p.wallJumps=0;}
    p.vy=0;
  }
  p.sx+=(1-p.sx)*Math.min(1,dt*11);
  p.sy+=(1-p.sy)*Math.min(1,dt*11);
  p.landT-=dt;p.tagT-=dt;p.sideT-=dt;
  p.blinkT-=dt;
  if(p.blinkT<=0){p.blink=0.12;p.blinkT=rand(1.8,4.5);}
  p.blink-=dt;
  
  /* Dynamic Speed Ghost Trail FX */
  if(Math.abs(p.vx)>320||onSpeed){
    p.trail.unshift({x:p.x,y:p.y,alpha:0.45});
    if(p.trail.length>4)p.trail.pop();
  }else{
    if(p.trail.length>0)p.trail.pop();
  }
  for(let tr of p.trail)tr.alpha-=dt*1.8;
  
  if(p.grounded&&Math.abs(p.vx)>240&&Math.random()<dt*14)dust(p.x+p.w/2-p.face*16,p.y+p.h-2,1,30);
}

function pairCollide(){
  if(!settings.collision||match.cooldown>0||match.state!=='playing')return;
  const P=match.players;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j];
    if(!hitRect(a,b))continue;
    const ox=Math.min(a.x+a.w-b.x,b.x+b.w-a.x),oy=Math.min(a.y+a.h-b.y,b.y+b.h-a.y);
    if(ox<oy){
      const s=(a.x+a.w/2<b.x+b.w/2)?-1:1;
      a.x+=s*ox/2;b.x-=s*ox/2;
      if(s<0){if(a.vx>0)a.vx=0;if(b.vx<0)b.vx=0;}else{if(a.vx<0)a.vx=0;if(b.vx>0)b.vx=0;}
    }else{
      const s=(a.y+a.h/2<b.y+b.h/2)?-1:1;
      a.y+=s*oy/2;b.y-=s*oy/2;
      if(s<0){if(a.vy>0)a.vy=0;if(b.vy<0)b.vy=0;}else{if(b.vy>0)b.vy=0;if(a.vy<0)a.vy=0;}
    }
  }
}
function tagBox(p){const pad=5;return{x:p.x-pad,y:p.y-pad,w:p.w+2*pad,h:p.h+2*pad};}
function applyTag(newItIdx, popX, popY){
  if(!match || match.state !== 'playing' || match.cooldown > 0) return;
  const P = match.players;
  if(newItIdx < 0 || newItIdx >= P.length) return;
  const oldIt = P[match.it];
  const newIt = P[newItIdx];
  if(!oldIt || !newIt) return;

  match.it = newItIdx;
  if(settings.teams && newIt.team != null){
    match.itTeam = newIt.team;
  }
  match.cooldown = 3;
  match.tags[newItIdx]++;
  match.freeze = 0.09; match.shake = 13; match.flash = 0.14;
  match.tagPop = { t: 0.55, x: popX != null ? popX : (oldIt.x + newIt.x) / 2 + 23, y: popY != null ? popY : (oldIt.y + newIt.y) / 2 + 10 };
  oldIt.tagT = 0.7; newIt.tagT = 0.7;
  sfx('tag');
  tagBurst(match.tagPop.x, match.tagPop.y, getPlayerColor(oldIt), getPlayerColor(newIt));
}

function checkTag(){
  if(!match || match.state !== 'playing' || match.cooldown > 0) return;
  const P = match.players;
  if(!P || P.length < 2) return;

  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isOnlineGuest = isOnline && !NET.isHost;

  if(settings.teams && match.itTeam != null){
    // "Hunt Together": ALL players on the itTeam hunt together!
    const hunters = P.filter(p => p.team === match.itTeam);
    const runners = P.filter(p => p.team !== match.itTeam);
    for(const hunter of hunters){
      for(const runner of runners){
        if(hitRectInclusive(tagBox(hunter), tagBox(runner))){
          const popX = (hunter.x + runner.x) / 2 + 23, popY = (hunter.y + runner.y) / 2 + 10;
          if(isOnlineGuest){
            if(hunter.slot === NET.mySlot){
              netBroadcastReliable({ t: 'tag_claim', from: hunter.slot, target: runner.slot, x: popX, y: popY });
              match.cooldown = 0.6;
            }
            return;
          }
          applyTag(P.indexOf(runner), popX, popY);
          return;
        }
      }
    }
    return;
  }

  // Classic Free-for-All
  const it = P[match.it];
  if(!it) return;
  for(let j = 0; j < P.length; j++){
    if(j === match.it) continue;
    if(hitRectInclusive(tagBox(it), tagBox(P[j]))){
      if(isOnlineGuest){
        if(it.slot === NET.mySlot){
          const popX = (it.x + P[j].x) / 2 + 23, popY = (it.y + P[j].y) / 2 + 10;
          netBroadcastReliable({ t: 'tag_claim', from: it.slot, target: P[j].slot, x: popX, y: popY });
          match.cooldown = 0.6;
        }
        return;
      }
      applyTag(j, (it.x + P[j].x) / 2 + 23, (it.y + P[j].y) / 2 + 10);
      return;
    }
  }
}
function endMatch(){
  try{CG.happytime();}catch(e){}try{CG.gameplayStop();}catch(e){}
  try{CG.requestResponsiveBanner('cg-banner-responsive');const el=document.getElementById('cg-banner-resp');if(el)el.style.display='flex';}catch(e){}
  try{
    const now = Date.now();
    if(now - lastAdTime >= 180000){ // 3 minutes throttle
      lastAdTime = now;
      CG.requestMidgame();
    }
  }catch(e){}
  match.state='result';
  if(settings.teams && match.teamItTime){
    // Team with the lowest total IT time wins!
    const activeTeams = Array.from(new Set(match.players.map(p => p.team)));
    let bestTeam = activeTeams[0] || 0;
    let minTime = match.teamItTime[bestTeam] || 0;
    for(const tm of activeTeams){
      const tmTime = match.teamItTime[tm] || 0;
      if(tmTime < minTime){
        minTime = tmTime;
        bestTeam = tm;
      }
    }
    match.result={winningTeam: bestTeam, teamItTime: match.teamItTime.slice()};
  } else {
    match.result={loser:match.it};
  }
  match.resultT=0;
  confetti();
  sfx('win');
  if(typeof NET!=='undefined' && NET && NET.isHost && NET.midgameJoiner){
    netToast('New player joined — returning to lobby!');
  }
}

/* ================= camera ================= */
function updateCam(dt){
  let tx,ty,ts;
  const N=match?match.players.length:2;
  if(screen!=='game'||!match){
    tx=W/2;ty=H/2;ts=Math.min(CW/(W+160),CH/(H+160));
  }else{
    const P=match.players;
    let mx=0,my=0,minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(const p of P){mx+=p.x;my+=p.y;minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);}
    tx=mx/P.length+23;ty=my/P.length+23;
    const dx=maxX-minX,dy=maxY-minY;
    const needW=dx+640+(N-2)*220,needH=dy+500+(N-2)*120;
    const minS=Math.min(CW/(W+140),CH/(H+140));
    ts=clamp(Math.min(CW/needW,CH/needH),minS,N>=6?1.05:(N>=4?1.25:1.75));
  }
  const kp=1-Math.exp(-dt*5.5),ks=1-Math.exp(-dt*3.8);
  cam.x+=(tx-cam.x)*kp;cam.y+=(ty-cam.y)*kp;cam.s+=(ts-cam.s)*ks;
  const vw=CW/cam.s,vh=CH/cam.s;
  cam.x=vw>=W+120?W/2:clamp(cam.x,vw/2-60,W-vw/2+60);
  cam.y=vh>=H+120?H/2:clamp(cam.y,vh/2-60,H-vh/2+60);
}

/* ================= game update & fullscreen ================= */
function toggleFullscreen(){
  try{
    const de = document.documentElement;
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || document.webkitIsFullScreen);
    const req = de.requestFullscreen || de.webkitRequestFullscreen || de.webkitRequestFullScreen || cv.requestFullscreen || cv.webkitRequestFullscreen || cv.webkitRequestFullScreen || de.mozRequestFullScreen || de.msRequestFullscreen;
    if(!req){
      window.scrollTo(0, 0);
      if(match){ match.mapToast = 'ADD TO HOME SCREEN FOR FULLSCREEN'; match.mapToastT = 2.5; }
      return;
    }
    if(!isFs){
      const target = (de.requestFullscreen || de.webkitRequestFullscreen || de.webkitRequestFullScreen) ? de : cv;
      const p = req.call(target);
      if(p && p.catch) p.catch(()=>{});
    }else{
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if(exit){
        const p = exit.call(document);
        if(p && p.catch) p.catch(()=>{});
      }
    }
  }catch(e){}
}
function toggleSound(){
  muted=!muted;
  applyEffectiveMute();
  if(match){match.mapToast='SOUND: '+(muted?'OFF':'ON');match.mapToastT=1.8;}
  sfx('ui');
}
function togglePause(){
  if(!match)return;
  if(match.state==='paused'){
    match.state=match.pausedFrom;
    match.pausedFrom=null;
    try{CG.gameplayStart();}catch(e){}
    sfx('ok');
  }
  else if(match.state==='playing'||match.state==='countdown'){
    match.pausedFrom=match.state;
    match.state='paused';
    match.pauseSel=0;
    try{CG.gameplayStop();}catch(e){}
    sfx('back');
  }
}
function cycleTheme(){
  currentThemeIdx=(currentThemeIdx+1)%THEMES.length;
  if(match){match.mapToast='THEME: '+THEMES[currentThemeIdx].name;match.mapToastT=2.2;}

}
