/* ================= gamepads ================= */
const GP={prev:[{},{},{},{}],prevAx:[0,0,0,0],prevAy:[0,0,0,0]};
let PAD=[null,null,null,null];
function pollGamepads(){
  const rawPads=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<4;i++){
    const gd=rawPads[i];
    if(!gd||!gd.connected){PAD[i]=null;continue;}
    const b=n=>gd.buttons[n]&&(typeof gd.buttons[n]==='object'?gd.buttons[n].pressed:gd.buttons[n]>0.5);
    const pv=GP.prev[i]||{};
    const E=n=>b(n)&&!pv[n];
    const ax=gd.axes[0]||0,ay=gd.axes[1]||0;
    const pax=GP.prevAx[i]||0,pay=GP.prevAy[i]||0;
    const left=ax<-0.30||b(14),right=ax>0.30||b(15),up=ay<-0.50||b(12),down=ay>0.50||b(13);
    PAD[i]={
      left,right,up,down,
      leftE:(left&&!(pax<-0.30||pv[14]))||E(14),
      rightE:(right&&!(pax>0.30||pv[15]))||E(15),
      upE:(up&&!(pay<-0.50||pv[12]))||E(12),
      downE:(down&&!(pay>0.50||pv[13]))||E(13),
      jumpE:E(0),
      jumpHeld:!!b(0),
      confirmE:E(0)||E(2)||E(9),
      pauseE:E(9),
      dropHeld:b(1)||down,
      connected:true
    };
    const np={};for(let n=0;n<17;n++)np[n]=b(n);
    GP.prev[i]=np;
    GP.prevAx[i]=ax;
    GP.prevAy[i]=ay;
  }
}

/* ================= touch zones ================= */
const zones=[];const touchPts=new Map();const glow={};
function zone(x,y,w,h,o){zones.push({x:x,y:y,w:w,h:h,press:(o&&o.press)||null,hold:(o&&o.hold)||null,fn:(o&&o.fn)||null});}
function zoneAt(x,y,holdOnly){
  for(let i=zones.length-1;i>=0;i--){const z=zones[i];
    if(holdOnly&&!z.hold)continue;
    if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h)return z;}
  return null;
}
function inputDown(x,y,id){
  initAudio();grabFocus();
  const z=zoneAt(x,y,false);
  if(z){
    if(z.hold){touchPts.set(id,z);keys.add(z.hold);}
    if(z.press){for(const c of z.press){pressed.add(c);glow[c]=tGlobal;}}
    if(z.fn)z.fn();
  }
}
function inputMove(x,y,id){
  if(!touchPts.has(id))return;
  const cur=touchPts.get(id);
  const z=zoneAt(x,y,true);
  if(z!==cur){
    if(cur&&cur.hold)keys.delete(cur.hold);
    if(z)keys.add(z.hold);
    touchPts.set(id,z);
  }
}
function inputUp(id){
  const z=touchPts.get(id);
  if(z&&z.hold)keys.delete(z.hold);
  touchPts.delete(id);
}
if(typeof window.PointerEvent!=='undefined'){

}

/* ================= audio ================= */
let AC=null,master=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);}catch(e){AC=null;}
}
function beep(f0,f1,dur,type,vol,delay){
  if(!AC||!master)return;type=type||'square';vol=vol||0.16;delay=delay||0;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn);gn.connect(master);o.start(t0);o.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol,delay){
  if(!AC||!master)return;delay=delay||0;
  const t0=AC.currentTime+delay,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource();src.buffer=buf;
  const gn=AC.createGain();gn.gain.value=vol;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1100;
  src.connect(fl);fl.connect(gn);gn.connect(master);src.start(t0);
}

/* Custom maps from tag_map_editor.html override the built-ins (same browser).
   Editor saves to 'tag_arena_custom_maps_v1'; invalid saves are ignored safely. */
function syncCustomMaps(){
  try{
    const raw=localStorage.getItem('tag_arena_custom_maps_v1');
    if(!raw)return;
    const a=JSON.parse(raw);
    if(!Array.isArray(a)||!a.length)return;
    const ok=a.every(m=>m&&typeof m.name==='string'&&['solids','speeds','drops','boosts'].every(k=>
      Array.isArray(m[k])&&m[k].every(p=>Array.isArray(p)&&p.length>=4&&p.slice(0,4).every(Number.isFinite))));
    if(ok&&a.length<=40)MAPS.splice(0,MAPS.length,...a);
  }catch(e){/* keep built-in maps */}
}
function buildLevel(){
  const M=MAPS[settings.map%MAPS.length];
  SOLIDS=[
    {x:0,y:0,w:W,h:WALL,t:'solid',wall:1},{x:0,y:H-WALL,w:W,h:WALL,t:'solid',wall:1},
    {x:0,y:0,w:WALL,h:H,t:'solid',wall:1},{x:W-WALL,y:0,w:WALL,h:H,t:'solid',wall:1}
  ];
  /* All horizontal platforms are normalized to player height (46px); tops stay put so jump gaps never change */
  const P46=a=>({x:a[0],y:a[1],w:a[2],h:(a[3]<=32?46:a[3]),dy:a[4]||0});
  for(const a of M.solids){const p=P46(a);p.t='solid';SOLIDS.push(p);}
  for(const a of M.speeds){const p=P46(a);p.t='speed';SOLIDS.push(p);}
  for(const a of M.drops){const p=P46(a);p.t='drop';SOLIDS.push(p);}
  for(const a of M.boosts){const p=P46(a);p.t='boost';SOLIDS.push(p);}
}

/* ================= menu ================= */
let screen='menu',tGlobal=0;
const menu={mode:'slots',slotColor:[0,2,-1,-1],row:1,rule:0,toast:null,toastT:0};
const ROWS=['CHANGE PLAYERS','MAP','TIMER','RULES','START'];
const RULE_NAMES=['DOUBLE JUMP','BUMP','SPECIAL'];
function toast(m){menu.toast=m;menu.toastT=2.2;}
function activeSlots(){const r=[];for(let i=0;i<4;i++)if(menu.slotColor[i]>=0)r.push(i);return r;}
function cycleSlot(i,d){
  if(isTouch&&i>=2)return;
  const taken=menu.slotColor.filter((c,k)=>c>=0&&k!==i);
  const list=[-1].concat(PALETTE.map((p,idx)=>idx).filter(idx=>taken.indexOf(idx)<0));
  let cur=list.indexOf(menu.slotColor[i]);
  cur=(cur+d+list.length)%list.length;
  menu.slotColor[i]=list[cur];
  if(menu.mode==='rows'&&activeSlots().length<2){
    menu.mode='slots';
    menu.row=0;
    toast('CHOOSE AT LEAST 2 PLAYERS!');
  }
  sfx('ui');
}
function ruleValue(){return [settings.doubleJump,settings.collision,settings.special][menu.rule];}
function toggleRule(){
  if(menu.rule===0)settings.doubleJump=!settings.doubleJump;
  else if(menu.rule===1)settings.collision=!settings.collision;
  else{settings.special=!settings.special;buildLevel();}
  sfx('ui');
}
function rowEdit(d){
  switch(menu.row){
    case 1:settings.map=(settings.map+d+MAPS.length)%MAPS.length;buildLevel();sfx('ui');break;
    case 2:settings.timeIdx=(settings.timeIdx+d+TIMES.length)%TIMES.length;sfx('ui');break;
    case 3:menu.rule=(menu.rule+d+3)%3;sfx('ui');break;
  }
}
function rowEnter(){
  if(menu.row===0){menu.mode='slots';sfx('ok');}
  else if(menu.row===4){
    if(activeSlots().length<2){
      menu.mode='slots';
      menu.row=0;
      toast('CHOOSE AT LEAST 2 PLAYERS!');
      sfx('back');
    }else{
      sfx('go');
      startMatch();
    }
  }
  else if(menu.row===3)toggleRule();
  else rowEdit(1);
}
function menuConfirm(){
  if(menu.mode==='slots'){
    if(activeSlots().length<2){toast('CHOOSE AT LEAST 2 PLAYERS!');sfx('back');}
    else{menu.mode='rows';menu.row=1;sfx('ok');}
  }else rowEnter();
}
function updateMenu(dt){
  if(anyPressed(['KeyM'])){muted=!muted;if(master)master.gain.value=muted?0:0.5;}
  menu.toastT-=dt;
  if(menu.mode==='slots'){
    if(pressed.has('KeyA'))cycleSlot(0,-1);
    if(pressed.has('KeyD'))cycleSlot(0,1);
    if(pressed.has('ArrowLeft'))cycleSlot(1,-1);
    if(pressed.has('ArrowRight'))cycleSlot(1,1);
    if(pressed.has('KeyJ'))cycleSlot(2,-1);
    if(pressed.has('KeyL'))cycleSlot(2,1);
    if(pressed.has('KeyF'))cycleSlot(3,-1);
    if(pressed.has('KeyH'))cycleSlot(3,1);
    for(let i=0;i<4;i++){const pd=PAD[i];if(!pd)continue;
      if(pd.leftE)cycleSlot(i,-1);
      if(pd.rightE)cycleSlot(i,1);
      if(pd.confirmE)menuConfirm();
    }
    if(anyPressed(['Enter','NumpadEnter','Space']))menuConfirm();
  }else{
    let up=anyPressed(['ArrowUp','KeyW']),dn=anyPressed(['ArrowDown','KeyS']);
    let lf=anyPressed(['ArrowLeft','KeyA']),rt=anyPressed(['ArrowRight','KeyD']);
    let cf=anyPressed(['Enter','NumpadEnter','Space']);
    for(let i=0;i<4;i++){const pd=PAD[i];if(!pd)continue;
      up=up||pd.upE;dn=dn||pd.downE;lf=lf||pd.leftE;rt=rt||pd.rightE;cf=cf||pd.confirmE;}
    if(up){menu.row=(menu.row+ROWS.length-1)%ROWS.length;sfx('ui');}
    if(dn){menu.row=(menu.row+1)%ROWS.length;sfx('ui');}
    if(lf)rowEdit(-1);
    if(rt)rowEdit(1);
    if(cf)rowEnter();
  }
}

/* ================= match ================= */
let matchIndex=0,lastStartIT=0;
let match=null;
const cam={x:W/2,y:H/2,s:0.5};
function makePlayer(i,slot,colIdx){
  const N=activeSlots().length;
  const s=SLOTS[slot];
  const x=Math.round(WALL+(W-2*WALL)*((i+0.5)/N))-23;
  return {x:x,y:H-WALL-46,w:46,h:46,vx:0,vy:0,grounded:true,gp:SOLIDS[1],lastGp:SOLIDS[1],
    face:i%2===0?1:-1,airJumps:settings.doubleJump?1:0,wallJumps:0,coyote:0,jbuf:0,holdT:0,dropT:0,sideT:0,wallSide:0,
    sx:1,sy:1,landT:0,tagT:0,padOn:false,blinkT:rand(1.5,4),blink:0,seed:i*3.7,
    slot:slot,colIdx:colIdx,trail:[]};
}
function startMatch(){
  const act=activeSlots();
  if(act.length<2){
    menu.mode='slots';
    menu.row=0;
    toast('CHOOSE AT LEAST 2 PLAYERS!');
    sfx('back');
    return;
  }
  matchIndex++;
  /* AUTOMATIC CLEAN GRADIENT BACKGROUND CHANGE ON EVERY MATCH */
  currentThemeIdx=(matchIndex-1)%THEMES.length;
  const N=act.length;
  let it;
  if(matchIndex%2===1)it=Math.floor(rand(N));
  else it=(lastStartIT+1)%N;
  lastStartIT=it;
  buildLevel();
  const players=act.map((slot,i)=>makePlayer(i,slot,menu.slotColor[slot]));
  match={state:'countdown',cd:3,cdT:0,timer:settings.time,lastTick:settings.time,it:it,cooldown:0,
    goFlash:0,freeze:0,shake:0,flash:0,fade:0.6,tagPop:null,resultT:0,
    tags:players.map(()=>0),hintT:7,players:players,result:null,pausedFrom:null,pauseSel:0,
    mapToast:MAPS[settings.map].name,mapToastT:2.5};
  screen='game';
  sfx('count');
}
function quitToMenu(){match=null;screen='menu';sfx('back');}

/* ================= particles & ghost trails ================= */
const parts=[];
function addP(o){if(parts.length<430)parts.push(o);}
function dust(x,y,n,spd){
  for(let i=0;i<n;i++)addP({x:x+rand(-8,8),y:y+rand(-4,2),vx:rand(-spd,spd),vy:rand(-spd*0.7,-6),life:rand(0.25,0.5),max:0.5,size:rand(2.5,5),col:'#cfd8dc',grav:300,shape:0});
}
function ringP(x,y,col){for(let i=0;i<10;i++){const a=TAU*i/10;addP({x:x,y:y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,life:0.3,max:0.3,size:3.6,col:col,grav:0,shape:0});}}
function tagBurst(x,y,c1,c2){
  for(let i=0;i<26;i++){const a=rand(TAU),s=rand(120,420);addP({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.35,0.7),max:0.7,size:rand(3,7),col:i%3===0?'#ffffff':(i%2?c1:c2),grav:600,shape:i%4===0?1:0,rot:rand(TAU),vr:rand(-8,8)});}
}
function confetti(){
  for(let i=0;i<150;i++)addP({x:rand(WALL+40,W-WALL-40),y:rand(70,320),vx:rand(-130,130),vy:rand(-80,140),life:rand(1.6,2.8),max:2.8,size:rand(5,9),col:PALETTE[Math.floor(rand(PALETTE.length))].c,grav:520,shape:1,rot:rand(TAU),vr:rand(-7,7)});
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||0)*dt;
    if(p.vr)p.rot+=p.vr*dt;
  }
}
function drawParts(){
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    g.globalAlpha=a;
    if(p.shape===1){g.save();g.translate(p.x,p.y);g.rotate(p.rot||0);g.fillStyle=p.col;g.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.7);g.restore();}
    else{g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.size,0,TAU);g.fill();}
  }
  g.globalAlpha=1;
}

/* ============ PLAIN, MINIMALIST GRADIENT BACKGROUNDS (NO BUILDINGS) ============ */
function drawNightWorld(){
  const th=THEMES[currentThemeIdx];
  const gr=g.createLinearGradient(0,-900,0,H+900);
  gr.addColorStop(0,th.top);gr.addColorStop(0.5,th.mid);gr.addColorStop(1,th.bot);
  g.fillStyle=gr;
  g.fillRect(-1000,-1000,W+2000,H+2000);
}

function drawInterior(){
  const th=THEMES[currentThemeIdx];
  g.save();
  rr(g,WALL,WALL,W-2*WALL,H-2*WALL,10);g.clip();
  
  /* Smooth plain gradient - completely clean and distraction-free */
  const ig=g.createLinearGradient(0,WALL,0,H-WALL);
  ig.addColorStop(0,th.top);
  ig.addColorStop(0.5,th.mid);
  ig.addColorStop(1,th.bot);
  g.fillStyle=ig;
  g.fillRect(WALL,WALL,W-2*WALL,H-2*WALL);
  
  /* Soft lighting vignette for depth */
  const vg=g.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*1.05);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.30)');
  g.fillStyle=vg;g.fillRect(WALL,WALL,W-2*WALL,H-2*WALL);
  
  g.restore();
}

/* ================= PHYSICS: RELIABLE PINK DROP/JUMP-THROUGH & AIRTIGHT SOLIDS ================= */
function hitRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function zoneAtFeet(p,type){
  const feet=p.y+p.h;
  for(const s of SOLIDS){
    if(s.t!==type)continue;
    if(!s.dy){
      if(feet>=s.y-6&&feet<=s.y+18&&p.x+p.w>s.x&&p.x<s.x+s.w)return s;
    }else{
      const px=clamp(p.x+p.w/2,s.x,s.x+s.w);
      const sy=s.y+(px-s.x)*(s.dy/s.w);
      if(feet>=sy-8&&feet<=sy+20)return s;
    }
  }
  return null;
}

function landOn(p,gp,impact,wasG){
  p.grounded=true;p.gp=gp;p.lastGp=gp;p.airJumps=settings.doubleJump?1:0;p.wallJumps=0;
  if(!wasG){
    if(impact>430){p.sy=0.74;p.sx=1.26;p.landT=0.16;sfx('land');dust(p.x+p.w/2,p.y+p.h,8,90);}
    else if(impact>140){p.sy=0.88;p.sx=1.1;}
  }
}
function inputFor(p){
  /* Each slot merges its keyboard map with its own pad (pad i drives slot i).
     Either device works at any time; no slot is pad-locked or keyboard-locked. */
  const s=SLOTS[p.slot],m=s.map,pd=PAD[s.pad];
  let dir=(keys.has(m.R)?1:0)-(keys.has(m.L)?1:0);
  let jumpEdge=pressed.has(m.U),jumpHeld=keys.has(m.U),downHeld=keys.has(m.D);
  if(pd){
    dir+=(pd.right?1:0)-(pd.left?1:0);
    jumpEdge=jumpEdge||pd.jumpE;jumpHeld=jumpHeld||pd.jumpHeld;downHeld=downHeld||pd.dropHeld;
  }
  return {dir:clamp(dir,-1,1),jumpEdge:!!jumpEdge,jumpHeld:!!jumpHeld,downHeld:!!downHeld};
}

function physUpdate(p,dt,allow){
  const wasG=p.grounded;
  if(wasG)p.coyote=0.11;else p.coyote-=dt;
  let dir=0,jumpP=false,jumpHeld=false,downHeld=false;
  if(allow){const inp=inputFor(p);dir=inp.dir;jumpP=inp.jumpEdge;jumpHeld=inp.jumpHeld;downHeld=inp.downHeld;}
  const onSpeed=p.grounded&&!!zoneAtFeet(p,'speed');
  if(onSpeed&&!p.padOn)sfx('pad');
  p.padOn=onSpeed;
  const isIt=match.it===match.players.indexOf(p)&&match.state==='playing';
  const baseMax=isIt?IT_SPEED:RUN_SPEED;
  const maxs=baseMax*(onSpeed?SPEED_MULT:1);
  if(!onSpeed&&Math.abs(p.vx)>maxs){
    const target=Math.sign(p.vx)*maxs;
    p.vx+=(target-p.vx)*Math.min(1,dt*14);
  }
  
  /* SHARP ACCELERATION & SNAPPY BRAKING */
  const acc=p.grounded?ACC:AIR_ACC;
  const dec=p.grounded?DECEL:AIR_DEC;
  if(dir!==0){
    p.face=dir;
    const turning=(p.vx!==0&&Math.sign(p.vx)!==dir);
    p.vx+=dir*(turning?acc+dec*0.9:acc)*dt;
    if(dir*p.vx>maxs)p.vx=dir*maxs;
  }else{
    const d=dec*dt;
    if(Math.abs(p.vx)<=d)p.vx=0;else p.vx-=Math.sign(p.vx)*d;
  }
  
  if(jumpP)p.jbuf=0.16;else p.jbuf-=dt;
  
  /* PINK DROP-THROUGH: only the player's OWN down input counts, and only when
     FULLY standing on pink — the whole body (minus a 6px forgiveness margin)
     must be over the pink span. Straddling brown+pink (like standing on the
     seam) does nothing, so holding S while walking across never clips you. */
  const fullyOn=(plat)=>{
    if(!plat||plat.t!=='drop')return false;
    if(plat.dy)return false; /* sloped pink: require the grounded-platform path only */
    return (p.x+6>=plat.x)&&(p.x+p.w-6<=plat.x+plat.w);
  };
  const planted=p.grounded&&p.gp&&fullyOn(p.gp);
  const hoverPlat=!p.grounded&&p.vy>-60&&p.vy<160?zoneAtFeet(p,'drop'):null;
  const hoverDrop=!!hoverPlat&&(p.x+6>=hoverPlat.x)&&(p.x+p.w-6<=hoverPlat.x+hoverPlat.w);
  if(downHeld&&(planted||hoverDrop)){
    const dropPlat=planted?p.gp:hoverPlat;
    if(dropPlat){
      p.dropT=0.35;
      p.grounded=false;
      p.gp=null;
      p.y+=8; /* Nudge feet past top surface to drop immediately */
      p.vy=Math.max(p.vy,160);
      sfx('drop');
      dust(p.x+p.w/2,p.y+p.h,5,60);
    }
  }
  if(p.dropT>0)p.dropT-=dt;
  
  /* WALL CONTACT FOR PARKOUR WALL-JUMP (NO SLOW-FALL WALL SLIDE) */
  const onWall=!p.grounded&&p.sideT>0;
  
  /* JUMP HANDLING: Ground, Wall-Jump, Double Jump, and Blue Pad Boost.
     Tap = shorter hop; holding jump sustains reduced gravity for 0.10s so a
     full hold rises just past the old fixed jump height. */
  if(p.jbuf>0){
    if(p.grounded||p.coyote>0){
      const boost=(p.grounded&&zoneAtFeet(p,'boost'))?BOOST_MULT:1;
      p.vy=-JUMP_V*boost;
      p.vx=clamp(p.vx,-baseMax*1.1,baseMax*1.1);
      if(boost>1){sfx('boost');ringP(p.x+p.w/2,p.y+p.h,'#4a90e2');}else sfx('jump');
      p.grounded=false;p.coyote=0;p.jbuf=0;p.holdT=HOLD_LIFT_T;p.airJumps=settings.doubleJump?1:0;
      p.sy=1.20;p.sx=0.84;dust(p.x+p.w/2,p.y+p.h,5,70);
    }else if(onWall&&p.wallJumps<2){
      /* KICK OFF WALL! (Wall-Jump: Max 2 consecutive) */
      p.wallJumps++;
      p.vy=-JUMP_V*0.96;
      p.vx=-p.wallSide*480;
      p.face=-p.wallSide;
      p.sideT=0;p.jbuf=0;p.holdT=HOLD_LIFT_T;
      p.airJumps=settings.doubleJump?1:0;
      p.sy=1.18;p.sx=0.85;
      sfx('walljump');
      dust(p.x+(p.wallSide<0?0:p.w),p.y+p.h/2,4,80);
    }else if(p.airJumps>0){
      p.vy=-JUMP_V*0.95;p.airJumps--;p.jbuf=0;p.holdT=HOLD_LIFT_T;p.vx=clamp(p.vx,-baseMax*1.1,baseMax*1.1);sfx('djump');
      ringP(p.x+p.w/2,p.y+p.h/2,'#ffffff');p.sy=1.15;p.sx=0.88;
    }
  }

  /* Variable jump height: reduced gravity while jump is held and rising */
  if(p.holdT>0&&jumpHeld&&p.vy<0){p.vy+=G*HOLD_GRAV_F*dt;p.holdT-=dt;}
  else{p.vy+=G*dt;if(jumpHeld&&p.vy>=0)p.holdT=0;}
  if(p.vy>MAXFALL)p.vy=MAXFALL;

  const headBefore=p.y,feetBefore=p.y+p.h;

  /* Horizontal collision, sub-stepped so sprinters can't tunnel thin walls */
  const hSteps=(Math.abs(p.vx)*dt>13)?2:1;
  for(let hs=0;hs<hSteps;hs++){
  const leftBefore=p.x,rightBefore=p.x+p.w;
  p.x+=p.vx*dt/hSteps;
  for(const s of SOLIDS){
    if(s.t==='drop')continue; /* ONLY pink allows pass-through! */
    if(!s.dy){
      if(!hitRect(p,s))continue;
      /* If s is a thin horizontal platform (shelf/floor, not a vertical wall), only push if approaching from outside */
      if(!s.wall&&s.h<=46){
        const wasOutsideLeft=rightBefore<=s.x+2;
        const wasOutsideRight=leftBefore>=s.x+s.w-2;
        if(!wasOutsideLeft&&!wasOutsideRight)continue;
      }
      const fl=(p.x+p.w)-s.x,fr=(s.x+s.w)-p.x;
      if(fl<fr){p.x=s.x-p.w;if(p.vx>0)p.vx=0;p.wallSide=1;}
      else{p.x=s.x+s.w;if(p.vx<0)p.vx=0;p.wallSide=-1;}
      if((!s.wall||s.h>s.w)&&!wasG&&p.vy>-20){
        p.sideT=0.28;
      }
    }else{
      /* Tilted slope end-walls */
      if(p.vx>0&&p.x+p.w>=s.x&&leftBefore+p.w<=s.x+8){
        const yTop=s.y,yBot=s.y+s.h;
        if(p.y+p.h>yTop+4&&p.y<yBot-4){p.x=s.x-p.w;p.vx=0;p.wallSide=1;p.sideT=0.28;}
      }
      if(p.vx<0&&p.x<=s.x+s.w&&leftBefore>=s.x+s.w-8){
        const yTop=s.y+s.dy,yBot=s.y+s.dy+s.h;
        if(p.y+p.h>yTop+4&&p.y<yBot-4){p.x=s.x+s.w;p.vx=0;p.wallSide=-1;p.sideT=0.28;}
      }
    }
  }
  } /* end sub-step loop */
  
  /* Vertical collision: Slopes & solids are 100% solid! Pink is one-way & fall-through */
  p.grounded=false;
  p.y+=p.vy*dt;
  
  for(const s of SOLIDS){
    if(!s.dy){
      /* Flat platform */
      const xOverlap=(p.x+p.w>s.x+2&&p.x<s.x+s.w-2);
      if(!xOverlap)continue;
      
      if(s.t==='drop'){
        /* PINK DROP PLATFORM:
           1. NEVER blocks jumping up (can always jump through from below)
           2. Passes through when dropT>0 (just triggered a drop), OR when the
              player's OWN down is held AND they are FULLY on this pink span.
              Straddling a brown/pink seam while holding S does NOT fall —
              the neighbouring solid still catches you (see solid branch).
           3. Lands only when falling downward and feet cross the top surface */
        const fullyHere=(p.x+6>=s.x)&&(p.x+p.w-6<=s.x+s.w);
        if(p.dropT>0||(downHeld&&fullyHere))continue;
        if(p.vy>0&&feetBefore<=s.y+6&&p.y+p.h>=s.y&&p.y+p.h<=s.y+s.h+10){
          const imp=p.vy;
          p.y=s.y-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
        }
        continue;
      }
      
      /* Solid brown, orange speed, or blue boost: FULLY SOLID FROM TOP AND BOTTOM!
         Holding S only lets you fall where pink already let go (dropT>0, or a
         pink span at this height that you are FULLY standing on). A straddler
         holding S still lands on this solid — never sinks through the seam. */
      if(p.vy>0){
        /* Falling down onto platform */
        if(p.dropT>0||downHeld){
          /* If currently dropping through, do NOT catch on adjacent/overlapping solids at same level! */
          const hasDropAtY=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-s.y)<=10&&p.x+p.w>d.x+2&&p.x<d.x+d.w-2&&(p.x+6>=d.x)&&(p.x+p.w-6<=d.x+d.w));
          if(hasDropAtY)continue;
        }
        if(feetBefore<=s.y+8&&p.y+p.h>=s.y&&p.y<s.y+s.h){
          const imp=p.vy;
          p.y=s.y-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
        }
      }else if(p.vy<0){
        /* Jumping UP: head bonks the solid underside — UNLESS the player's body
           actually overlaps a pink platform at this height (i.e. jumping up
           through pink that shares the seam). The pink must cover the player's
           center, not merely sit nearby, so brown/pink edge seams stay solid. */
        const midX=p.x+p.w/2;
        const thruPink=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-s.y)<=10&&midX>d.x+4&&midX<d.x+d.w-4);
        if(!thruPink&&headBefore>=s.y+s.h-8&&p.y<=s.y+s.h&&p.y+p.h>s.y){
          p.y=s.y+s.h;
          p.vy=0;
        }
      }
    }else{
      /* Tilted platform / slope */
      const xOverlap=(p.x+p.w>s.x+2&&p.x<s.x+s.w-2);
      if(!xOverlap)continue;
      
      const px=clamp(p.x+p.w/2,s.x,s.x+s.w);
      const syTop=s.y+(px-s.x)*(s.dy/s.w);
      const syBot=syTop+s.h;
      
      if(s.t==='drop'){
        const fullyHere0=(p.x+6>=s.x)&&(p.x+p.w-6<=s.x+s.w);
        if(p.dropT>0||(downHeld&&fullyHere0))continue;
        if(p.vy>0&&feetBefore<=syTop+6&&p.y+p.h>=syTop&&p.y+p.h<=syBot+8){
          const imp=p.vy;
          p.y=syTop-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
          p.grounded=true;
          p.vx+=Math.sign(s.dy)*600*dt;
        }
        continue;
      }
      
      if(p.vy>=0){
        if(p.dropT>0||downHeld){
          const hasDropAtY=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-syTop)<=12&&p.x+p.w>d.x&&p.x<d.x+d.w);
          if(hasDropAtY)continue;
        }
        /* Landing on top of slope */
        if(feetBefore<=syTop+8&&p.y+p.h>=syTop-6&&p.y<syBot){
          const imp=p.vy;
          p.y=syTop-p.h;
          p.vy=0;
          landOn(p,s,imp,wasG);
          p.grounded=true;
          p.vx+=Math.sign(s.dy)*600*dt;
        }
      }else if(p.vy<0){
        /* Jumping UP into slope: head hits bottom, unless rising through pink at the seam */
        const midX2=p.x+p.w/2;
        const thruPink2=SOLIDS.some(d=>d.t==='drop'&&Math.abs(d.y-syTop)<=12&&midX2>d.x+4&&midX2<d.x+d.w-4);
        if(!thruPink2&&headBefore>=syBot-10&&p.y<=syBot&&p.y+p.h>syTop){
          p.y=syBot;
          p.vy=0;
        }
      }
    }
  }
  
  p.x=clamp(p.x,WALL,W-WALL-p.w);
  if(p.x<=WALL){p.wallSide=-1;if(!p.grounded&&p.vy>-20)p.sideT=0.28;}
  else if(p.x>=W-WALL-p.w){p.wallSide=1;if(!p.grounded&&p.vy>-20)p.sideT=0.28;}
  p.y=clamp(p.y,WALL,H-WALL-p.h);
  if(p.y>=H-WALL-p.h){
    /* Arena floor counts as a landing: squash, dust and sound included */
    if(!wasG&&!p.grounded)landOn(p,SOLIDS[1],p.vy,wasG);
    else{p.grounded=true;p.wallJumps=0;}
    p.vy=0;
  }
  p.sx+=(1-p.sx)*Math.min(1,dt*11);
  p.sy+=(1-p.sy)*Math.min(1,dt*11);
  p.landT-=dt;p.tagT-=dt;p.sideT-=dt;
  p.blinkT-=dt;
  if(p.blinkT<=0){p.blink=0.12;p.blinkT=rand(1.8,4.5);}
  p.blink-=dt;
  
  /* Dynamic Speed Ghost Trail FX */
  if(Math.abs(p.vx)>320||onSpeed){
    p.trail.unshift({x:p.x,y:p.y,alpha:0.45});
    if(p.trail.length>4)p.trail.pop();
  }else{
    if(p.trail.length>0)p.trail.pop();
  }
  for(let tr of p.trail)tr.alpha-=dt*1.8;
  
  if(p.grounded&&Math.abs(p.vx)>240&&Math.random()<dt*14)dust(p.x+p.w/2-p.face*16,p.y+p.h-2,1,30);
}

function pairCollide(){
  if(!settings.collision||match.cooldown>0||match.state!=='playing')return;
  const P=match.players;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j];
    if(!hitRect(a,b))continue;
    const ox=Math.min(a.x+a.w-b.x,b.x+b.w-a.x),oy=Math.min(a.y+a.h-b.y,b.y+b.h-a.y);
    if(ox<oy){
      const s=(a.x+a.w/2<b.x+b.w/2)?-1:1;
      a.x+=s*ox/2;b.x-=s*ox/2;
      if(s<0){if(a.vx>0)a.vx=0;if(b.vx<0)b.vx=0;}else{if(a.vx<0)a.vx=0;if(b.vx>0)b.vx=0;}
    }else{
      const s=(a.y+a.h/2<b.y+b.h/2)?-1:1;
      a.y+=s*oy/2;b.y-=s*oy/2;
      if(s<0){if(a.vy>0)a.vy=0;if(b.vy<0)b.vy=0;}else{if(b.vy>0)b.vy=0;if(a.vy<0)a.vy=0;}
    }
  }
}
function tagBox(p){const s=4;return{x:p.x+s,y:p.y+s,w:p.w-2*s,h:p.h-2*s};}
function checkTag(){
  if(match.state!=='playing'||match.cooldown>0)return;
  const P=match.players,it=P[match.it];
  for(let j=0;j<P.length;j++){
    if(j===match.it)continue;
    if(hitRect(tagBox(it),tagBox(P[j]))){
      match.it=j;
      match.cooldown=3;
      match.tags[j]++;
      match.freeze=0.09;match.shake=13;match.flash=0.14;
      match.tagPop={t:0.55,x:(it.x+P[j].x)/2+23,y:(it.y+P[j].y)/2+10};
      it.tagT=0.7;P[j].tagT=0.7;
      sfx('tag');
      tagBurst(match.tagPop.x,match.tagPop.y,PALETTE[it.colIdx].c,PALETTE[P[j].colIdx].c);
      return;
    }
  }
}
function endMatch(){
  match.state='result';
  match.result={loser:match.it};
  match.resultT=0;
  confetti();
  sfx('win');
}

/* ================= camera ================= */
function updateCam(dt){
  let tx,ty,ts;
  const N=match?match.players.length:2;
  if(screen!=='game'||!match){
    tx=W/2;ty=H/2;ts=Math.min(CW/(W+160),CH/(H+160));
  }else{
    const P=match.players;
    let mx=0,my=0,minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(const p of P){mx+=p.x;my+=p.y;minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);}
    tx=mx/P.length+23;ty=my/P.length+23;
    const dx=maxX-minX,dy=maxY-minY;
    const needW=dx+640+(N-2)*220,needH=dy+500+(N-2)*120;
    const minS=Math.min(CW/(W+140),CH/(H+140));
    ts=clamp(Math.min(CW/needW,CH/needH),minS,N>=3?1.35:1.75);
  }
  const kp=1-Math.exp(-dt*5.5),ks=1-Math.exp(-dt*3.8);
  cam.x+=(tx-cam.x)*kp;cam.y+=(ty-cam.y)*kp;cam.s+=(ts-cam.s)*ks;
  const vw=CW/cam.s,vh=CH/cam.s;
  cam.x=vw>=W+120?W/2:clamp(cam.x,vw/2-60,W-vw/2+60);
  cam.y=vh>=H+120?H/2:clamp(cam.y,vh/2-60,H-vh/2+60);
}

/* ================= game update & fullscreen ================= */
function toggleFullscreen(){
  try{
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
      else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen();
    }else{
      if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }
  }catch(e){}
}
function toggleSound(){
  muted=!muted;
  if(master)master.gain.value=muted?0:0.5;
  if(match){match.mapToast='SOUND: '+(muted?'OFF':'ON');match.mapToastT=1.8;}
  sfx('ui');
}
function togglePause(){
  if(!match)return;
  if(match.state==='paused'){match.state=match.pausedFrom;match.pausedFrom=null;sfx('ok');}
  else if(match.state==='playing'||match.state==='countdown'){match.pausedFrom=match.state;match.state='paused';match.pauseSel=0;sfx('back');}
}
function cycleTheme(){
  currentThemeIdx=(currentThemeIdx+1)%THEMES.length;
  if(match){match.mapToast='THEME: '+THEMES[currentThemeIdx].name;match.mapToastT=2.2;}
  sfx('ui');
}
function selectMapQuick(idx){
  settings.map=(idx+MAPS.length)%MAPS.length;
  buildLevel();
  if(match){
    match.mapToast='MAP: '+(settings.map+1)+'. '+MAPS[settings.map].name;
    match.mapToastT=2.4;
    startMatch();
  }
  sfx('ok');
}

function updateGame(dt){
  if(!match)return;
  if(anyPressed(['KeyM']))toggleSound();
  if(anyPressed(['KeyF']))toggleFullscreen();
  if(anyPressed(['KeyP']))togglePause();
  if(anyPressed(['KeyN']))selectMapQuick(settings.map+1);
  if(anyPressed(['KeyB']))cycleTheme();
  
  /* Number keys 1-9, 0 to switch to any map instantly */
  for(let k=1;k<=9;k++)if(pressed.has('Digit'+k))selectMapQuick(k-1);
  if(pressed.has('Digit0'))selectMapQuick(9);
  
  for(let i=0;i<4;i++){if(PAD[i]&&PAD[i].pauseE)togglePause();}
  if(match.state==='paused'){
    let up=anyPressed(['ArrowUp','KeyW']),dn=anyPressed(['ArrowDown','KeyS']),cf=anyPressed(['Enter','NumpadEnter','Space']);
    for(let i=0;i<4;i++){const pd=PAD[i];if(!pd)continue;up=up||pd.upE;dn=dn||pd.downE;cf=cf||pd.confirmE;}
    if(up){match.pauseSel=(match.pauseSel+5)%6;sfx('ui');}
    if(dn){match.pauseSel=(match.pauseSel+1)%6;sfx('ui');}
    if(cf){
      if(match.pauseSel===0)togglePause();
      else if(match.pauseSel===1){sfx('go');startMatch();}
      else if(match.pauseSel===2){selectMapQuick(settings.map+1);}
      else if(match.pauseSel===3){toggleSound();}
      else if(match.pauseSel===4){toggleFullscreen();}
      else quitToMenu();
    }
    return;
  }
  if(match.state==='result'){
    match.resultT+=dt;
    if(anyPressed(['Enter','NumpadEnter','Space'])){sfx('go');startMatch();}
    for(let i=0;i<4;i++){if(PAD[i]&&PAD[i].confirmE){sfx('go');startMatch();}}
    updateParts(dt);updateCam(dt);match.shake*=Math.exp(-dt*7);match.flash=Math.max(0,match.flash-dt);
    return;
  }
  if(match.freeze>0){match.freeze-=dt;return;}
  match.fade=Math.max(0,match.fade-dt);
  match.mapToastT=Math.max(0,match.mapToastT-dt);
  const inPlay=match.state==='playing';
  if(match.state==='countdown'){
    match.cdT+=dt;
    if(match.cdT>=0.72){
      match.cdT-=0.72;match.cd--;
      if(match.cd<=0){match.state='playing';match.goFlash=0.8;sfx('go');}
      else sfx('count');
    }
  }
  for(const p of match.players)physUpdate(p,dt,inPlay);
  pairCollide();
  checkTag();
  if(inPlay){
    if(match.cooldown>0){
      const c0=Math.ceil(match.cooldown);
      match.cooldown-=dt;
      const c1=Math.ceil(Math.max(0,match.cooldown));
      if(c1<c0&&c1>0)sfx('count');
      if(match.cooldown<=0){match.cooldown=0;match.goFlash=0.8;sfx('go');}
    }
    match.timer-=dt;
    const s=Math.ceil(match.timer);
    if(s!==match.lastTick){if(s<=5&&s>0)sfx('tick');match.lastTick=s;}
    if(match.timer<=0){match.timer=0;endMatch();return;}
    match.hintT-=dt;
  }
  match.goFlash-=dt;
  match.flash=Math.max(0,match.flash-dt);
  if(match.tagPop){match.tagPop.t-=dt;if(match.tagPop.t<=0)match.tagPop=null;}
  match.shake*=Math.exp(-dt*7);
  updateParts(dt);
  updateCam(dt);
}
function update(dt){
  pollGamepads();
  if(screen==='menu')updateMenu(dt);
  else updateGame(dt);
  updateCam(dt);
}

/* ================= text/ui ================= */
function txt(s,x,y,font,col,align,alpha){
  g.save();
  if(alpha!==undefined)g.globalAlpha=alpha;
  g.font=font;g.fillStyle=col;g.textAlign=align||'center';g.textBaseline='middle';
  g.fillText(s,x,y);g.restore();
}
function ptxt(s,x,y,font,fill,align,lw){
  g.save();
  g.font=font;g.textAlign=align||'center';g.textBaseline='middle';g.lineJoin='round';
  const m=/([0-9.]+)px/.exec(font);
  g.strokeStyle=INK;g.lineWidth=lw||Math.max(3,(m?parseFloat(m[1]):14)*0.16);
  g.strokeText(s,x,y);
  g.fillStyle=fill||'#ffffff';g.fillText(s,x,y);
  g.restore();
}
function pill(x,y,w,h,fill,stroke){
  rr(g,x,y,w,h,h/2);
  g.fillStyle=fill;g.fill();
  if(stroke){g.lineWidth=2.5;g.strokeStyle=stroke;g.stroke();}
}
function fmtTime(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function simpleButton(x,y,w,h,label,fn,sub){
  const pulse=1+0.015*Math.sin(tGlobal*4);
  g.save();
  g.translate(x+w/2,y+h/2);g.scale(pulse,pulse);g.translate(-w/2,-h/2);
  rr(g,0,0,w,h,h/2);
  g.fillStyle='#ffffff';g.fill();
  g.lineWidth=3;g.strokeStyle=INK;g.stroke();
  txt(label,w/2,h/2+(sub?-6:1),FN(Math.min(24,h*0.4),900),'#1c6b38');
  if(sub)txt(sub,w/2,h*0.76,FN(10,700),'#5a8f6d');
  g.restore();
  zone(x,y,w,h,{fn:fn});
}
function padGlyph(x,y,s,lit){
  g.save();
  g.translate(x,y);
  rr(g,-s,-s*0.6,s*2,s*1.2,s*0.5);
  g.fillStyle=lit?'#3a5a3a':'#22301c';g.fill();
  g.lineWidth=2.5;g.strokeStyle=lit?'#ffffff':'rgba(255,255,255,0.4)';g.stroke();
  g.fillStyle=lit?'#ffffff':'rgba(255,255,255,0.4)';
  g.fillRect(-s*0.55,-s*0.12,s*0.5,s*0.24);
  g.fillRect(-s*0.42,-s*0.36,s*0.24,s*0.72);
  g.beginPath();g.arc(s*0.45,-s*0.15,s*0.14,0,TAU);g.fill();
  g.beginPath();g.arc(s*0.65,s*0.1,s*0.14,0,TAU);g.fill();
  g.restore();
}

/* ================= characters with ghost trails ================= */
function drawChar(gx,x,y,size,col,o){
  o=o||{};
  const f=o.face||'idle';
  const moving=o.moving&&o.grounded;
  gx.save();
  const shx=o.shake?(Math.random()-0.5)*o.shake:0;
  gx.translate(x+size/2+shx,y+size);
  gx.rotate(o.tilt||0);
  gx.scale(o.sx||1,o.sy||1);
  gx.translate(-size/2,-size);
  if(o.grounded&&!moving){
    gx.fillStyle=INK;
    rr(gx,size*0.2,size*0.94,size*0.2,size*0.12,size*0.06);gx.fill();
    rr(gx,size*0.6,size*0.94,size*0.2,size*0.12,size*0.06);gx.fill();
  }
  rr(gx,0,0,size,size,size*0.14);
  gx.fillStyle=col;gx.fill();
  gx.lineWidth=Math.max(2.5,size*0.09);gx.strokeStyle=INK;gx.stroke();
  gx.save();rr(gx,0,0,size,size,size*0.14);gx.clip();
  gx.fillStyle='rgba(255,255,255,0.20)';
  rr(gx,size*0.08,size*0.06,size*0.5,size*0.16,size*0.08);gx.fill();
  gx.fillStyle='rgba(0,0,0,0.14)';
  gx.fillRect(0,size*0.78,size,size*0.22);
  gx.restore();
  const lx=(o.lookX||0),ly=(o.lookY||0);
  const fx=lx*size*0.06+(o.fdir||0)*size*0.02,fy=ly*size*0.05;
  const ex1=size*0.33+fx,ex2=size*0.67+fx,ey=size*0.42+fy;
  const ew=size*0.13;let eh=size*0.17;
  gx.fillStyle=INK;
  if(f==='land'||f==='happy'){
    gx.lineWidth=size*0.06;gx.strokeStyle=INK;gx.lineCap='round';
    gx.beginPath();gx.moveTo(ex1-ew*0.7,ey+ew*0.5);gx.lineTo(ex1,ey-ew*0.4);gx.lineTo(ex1+ew*0.7,ey+ew*0.5);gx.stroke();
    gx.beginPath();gx.moveTo(ex2-ew*0.7,ey+ew*0.5);gx.lineTo(ex2,ey-ew*0.4);gx.lineTo(ex2+ew*0.7,ey+ew*0.5);gx.stroke();
    gx.fillStyle='rgba(255,120,150,0.55)';
    gx.beginPath();gx.arc(size*0.18,size*0.6,size*0.06,0,TAU);gx.fill();
    gx.beginPath();gx.arc(size*0.82,size*0.6,size*0.06,0,TAU);gx.fill();
  }else if(f==='tagged'){
    gx.lineWidth=size*0.05;gx.strokeStyle=INK;gx.lineCap='round';
    gx.beginPath();gx.moveTo(ex1-ew*0.7,ey-ew*0.7);gx.lineTo(ex1+ew*0.7,ey+ew*0.7);gx.moveTo(ex1+ew*0.7,ey-ew*0.7);gx.lineTo(ex1-ew*0.7,ey+ew*0.7);gx.stroke();
    gx.beginPath();gx.moveTo(ex2-ew*0.7,ey-ew*0.7);gx.lineTo(ex2+ew*0.7,ey+ew*0.7);gx.moveTo(ex2+ew*0.7,ey-ew*0.7);gx.lineTo(ex2-ew*0.7,ey+ew*0.7);gx.stroke();
  }else{
    if(o.blink)eh=size*0.05;
    if(f==='fall')eh=size*0.24;
    gx.fillRect(ex1-ew/2,ey-eh/2,ew,eh);
    gx.fillRect(ex2-ew/2,ey-eh/2,ew,eh);
    if(!o.blink){
      gx.fillStyle='rgba(255,255,255,0.9)';
      const gl=Math.max(1.5,size*0.045);
      gx.fillRect(ex1-ew*0.28,ey-eh*0.32,gl,gl);
      gx.fillRect(ex2-ew*0.28,ey-eh*0.32,gl,gl);
      gx.fillStyle=INK;
    }
  }
  const mx=size*0.5+fx*0.5,my=size*0.7+fy*0.4;
  if(f==='idle')gx.fillRect(mx-size*0.07,my-size*0.025,size*0.14,size*0.05);
  else if(f==='run')gx.fillRect(mx-size*0.09,my-size*0.05,size*0.18,size*0.1);
  else if(f==='jump')gx.fillRect(mx-size*0.05,my-size*0.05,size*0.1,size*0.1);
  else if(f==='fall'||f==='tagged'){gx.beginPath();gx.arc(mx,my,size*0.08,0,TAU);gx.fill();}
  else if(f==='land'||f==='happy')gx.fillRect(mx-size*0.12,my-size*0.06,size*0.24,size*0.11);
  else if(f==='sad')gx.fillRect(mx-size*0.07,my+size*0.02,size*0.14,size*0.045);
  gx.restore();
}
function faceFor(p){
  if(match.state==='result')return match.result.loser===match.players.indexOf(p)?'sad':'happy';
  if(p.tagT>0)return'tagged';
  if(p.landT>0)return'land';
  if(!p.grounded)return p.vy<0?'jump':'fall';
  if(Math.abs(p.vx)>60)return'run';
  return'idle';
}

/* ===== PROFESSIONAL 2.5D PLATFORMS WITH DYNAMIC MATERIALS & DEPTH ===== */
function drawPlat(s){
  g.save();
  
  /* 1. SOFT 2.5D DROP SHADOW */
  g.fillStyle='rgba(0,0,0,0.32)';
  if(!s.dy){
    g.fillRect(s.x+4, s.y+s.h, s.w-8, 7);
  }else{
    g.beginPath();
    g.moveTo(s.x+4, s.y+s.h);
    g.lineTo(s.x+s.w-4, s.y+s.dy+s.h);
    g.lineTo(s.x+s.w-4, s.y+s.dy+s.h+7);
    g.lineTo(s.x+4, s.y+s.h+7);
    g.closePath();
    g.fill();
  }
  
  if(!s.dy){
    /* ---------------- FLAT PLATFORM ---------------- */
    if(s.t==='drop'){
      /* === PINK DROP-THROUGH PLATFORM: Luminous Cyber Safety Grate === */
      // Base dark frame
      g.fillStyle='#9e1b5c';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Semi-transparent vibrant pink core
      g.fillStyle='rgba(235, 75, 155, 0.88)';
      g.fillRect(s.x+2, s.y+2, s.w-4, s.h-4);
      // Animated downward drop affordance chevrons
      const pulse=0.45+0.35*Math.sin(tGlobal*4.5);
      g.fillStyle='rgba(255,255,255,'+pulse.toFixed(2)+')';
      for(let x=s.x+18; x<s.x+s.w-12; x+=32){
        g.beginPath();
        g.moveTo(x-6, s.y+8);
        g.lineTo(x, s.y+15);
        g.lineTo(x+6, s.y+8);
        g.lineTo(x+4, s.y+6);
        g.lineTo(x, s.y+11);
        g.lineTo(x-4, s.y+6);
        g.closePath();
        g.fill();
      }
      // Glowing neon top laser rail
      g.fillStyle='rgba(255,190,225,0.92)';
      g.fillRect(s.x, s.y, s.w, 3);
      g.lineWidth=2; g.strokeStyle='#3e081e';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else if(s.t==='speed'){
      /* === ORANGE SPEEDWAY: Animated High-Speed Conveyor Belt === */
      // Dark chassis base
      g.fillStyle='#1e2229';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Vibrant safety orange running belt
      g.fillStyle='#f07818';
      g.fillRect(s.x+2, s.y+2, s.w-4, s.h-4);
      // Animated chevrons radiating outward from the middle <<> >>.
      // (Speed boosts all directions, so the pad must not imply left or right.)
      // d grows with scroll so chevrons travel OUTWARD, matching where they point.
      const scroll=(tGlobal*200)%36;
      const cxm=s.x+s.w/2;
      g.save();
      g.beginPath(); g.rect(s.x+8, s.y+3, s.w-16, s.h-6); g.clip();
      g.fillStyle='rgba(255,240,130,0.92)';
      const chevR=(x,dir)=>{
        g.beginPath();
        g.moveTo(x-8*dir, s.y+5);
        g.lineTo(x+3*dir, s.y+s.h/2);
        g.lineTo(x-8*dir, s.y+s.h-5);
        g.lineTo(x-3*dir, s.y+s.h-5);
        g.lineTo(x+8*dir, s.y+s.h/2);
        g.lineTo(x-3*dir, s.y+5);
        g.closePath();
        g.fill();
      };
      for(let d=scroll; d<s.w/2-8; d+=36){chevR(cxm+d,1);chevR(cxm-d,-1);}
      /* Hollow center diamond: two arrow outlines tip-to-tip (<>), the outward-flow origin */
      const dcy=s.y+s.h/2,ds=Math.min(13,(s.h-10)/2);
      g.lineWidth=Math.max(2.5,ds*0.35);g.lineJoin='round';g.lineCap='round';
      g.strokeStyle='rgba(255,240,130,0.95)';
      g.beginPath(); /* left arrow < */
      g.moveTo(cxm-ds*0.2, dcy-ds);
      g.lineTo(cxm-ds*1.1, dcy);
      g.lineTo(cxm-ds*0.2, dcy+ds);
      g.stroke();
      g.beginPath(); /* right arrow > */
      g.moveTo(cxm+ds*0.2, dcy-ds);
      g.lineTo(cxm+ds*1.1, dcy);
      g.lineTo(cxm+ds*0.2, dcy+ds);
      g.stroke();
      g.restore();
      // Mechanical end roller caps
      g.fillStyle='#64748b';
      rr(g, s.x, s.y+1, 8, s.h-2, 3); g.fill();
      rr(g, s.x+s.w-8, s.y+1, 8, s.h-2, 3); g.fill();
      // Glowing amber top edge
      g.fillStyle='rgba(255,255,255,0.45)';
      g.fillRect(s.x+8, s.y+1, s.w-16, 2);
      g.lineWidth=2; g.strokeStyle='#141414';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else if(s.t==='boost'){
      /* === BLUE BOOST PLATFORM: Pneumatic Hydraulic Launch Spring === */
      // Heavy metallic housing
      g.fillStyle='#1e293b';
      g.fillRect(s.x, s.y, s.w, s.h);
      // Visible twin spring coils
      g.strokeStyle='#94a3b8'; g.lineWidth=3;
      for(let k of [s.x+s.w*0.25, s.x+s.w*0.75]){
        g.beginPath();
        g.moveTo(k-8, s.y+s.h-4); g.lineTo(k+8, s.y+s.h-8);
        g.lineTo(k-8, s.y+s.h-12); g.lineTo(k+8, s.y+s.h-16);
        g.stroke();
      }
      // Top electric blue launch plate
      g.fillStyle='#2563eb';
      g.fillRect(s.x+3, s.y+1, s.w-6, s.h*0.55);
      // Concentric pulsing energy ripple
      const rip=(tGlobal*28)%(s.w*0.35);
      g.strokeStyle='rgba(147, 197, 253, 0.7)'; g.lineWidth=2;
      g.beginPath();
      g.ellipse(s.x+s.w/2, s.y+s.h*0.3, Math.min(s.w*0.38, rip+12), 4, 0, 0, TAU);
      g.stroke();
      // Emissive cyan top highlight
      g.fillStyle='rgba(255,255,255,0.7)';
      g.fillRect(s.x+6, s.y+1, s.w-12, 2.5);
      g.lineWidth=2.5; g.strokeStyle='#0f172a';
      g.strokeRect(s.x, s.y, s.w, s.h);
      
    }else{
      /* === SOLID PLATFORM: Tangible Distressed Hardwood & Iron Bevels === */
      // Deep 3D bottom bevel
      g.fillStyle='#23140b';
      g.fillRect(s.x, s.y+s.h-5, s.w, 5);
      // Warm rich wood/stone slab
      g.fillStyle='#4c301c';
      g.fillRect(s.x, s.y, s.w, s.h-5);
      // Plank division seams every 72px
      for(let px=s.x+72; px<s.x+s.w-20; px+=72){
        g.fillStyle='#1f1109';
        g.fillRect(px, s.y+1, 2, s.h-6);
        g.fillStyle='rgba(255,255,255,0.08)';
        g.fillRect(px+2, s.y+1, 1, s.h-6);
      }
      // Subtle metallic corner bracket rivets
      g.fillStyle='#d4af37';
      for(let rx of [s.x+8, s.x+s.w-8]){
        g.beginPath(); g.arc(rx, s.y+s.h/2-2, 2.2, 0, TAU); g.fill();
      }
      // Crisp top bevel highlight
      g.fillStyle='rgba(255,255,255,0.18)';
      g.fillRect(s.x, s.y+1, s.w, 3);
      g.lineWidth=2; g.strokeStyle='#141414';
      g.strokeRect(s.x, s.y, s.w, s.h);
    }
    
  }else{
    /* ---------------- TILTED PLATFORM / SLOPE ---------------- */
    g.beginPath();
    g.moveTo(s.x, s.y);
    g.lineTo(s.x+s.w, s.y+s.dy);
    g.lineTo(s.x+s.w, s.y+s.dy+s.h);
    g.lineTo(s.x, s.y+s.h);
    g.closePath();
    
    if(s.t==='drop') g.fillStyle='#ba2671';
    else if(s.t==='speed') g.fillStyle='#e06b12';
    else if(s.t==='boost') g.fillStyle='#2563eb';
    else g.fillStyle='#442917';
    g.fill();
    
    // Tilted top highlight
    g.strokeStyle='rgba(255,255,255,0.22)';
    g.lineWidth=3;
    g.beginPath(); g.moveTo(s.x, s.y+1); g.lineTo(s.x+s.w, s.y+s.dy+1); g.stroke();
    // Tilted bottom shadow
    g.strokeStyle='#170b05';
    g.lineWidth=4;
    g.beginPath(); g.moveTo(s.x, s.y+s.h-2); g.lineTo(s.x+s.w, s.y+s.dy+s.h-2); g.stroke();
    // Border
    g.strokeStyle='#141414'; g.lineWidth=2;
    g.stroke();
  }
  
  g.restore();
}

function drawWorld(){
  drawInterior();
  const th=THEMES[currentThemeIdx];
  const walls=[[0,0,W,WALL],[0,H-WALL,W,WALL],[0,0,WALL,H],[W-WALL,0,WALL,H]];
  for(const wl of walls){
    g.fillStyle=th.wallCol||'#3a281a';
    g.fillRect(wl[0],wl[1],wl[2],wl[3]);
    g.lineWidth=4;g.strokeStyle=INK;
    g.strokeRect(wl[0],wl[1],wl[2],wl[3]);

function drawITArrow(p){
  const bob=Math.sin(tGlobal*6)*4;
  const cx=p.x+p.w/2,ty=p.y-36+bob;
  g.save();
  // Golden crown chevron badge
  g.fillStyle='#ffc107';g.strokeStyle=INK;g.lineWidth=3;g.lineJoin='round';
  g.beginPath();
  g.moveTo(cx-16,ty-15);
  g.lineTo(cx+16,ty-15);
  g.lineTo(cx,ty+5);
  g.closePath();
  g.fill();g.stroke();
  if(match&&match.state==='playing'&&match.cooldown>0){
    ptxt(String(Math.ceil(match.cooldown)),cx,ty-30,FT(28),'#ffffff');
  }
  g.restore();
}

function drawPlayers(){
  const P=match.players;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    const col=PALETTE[p.colIdx].c;
    const isIt=match.it===i&&match.state!=='result';
    
    /* 1. Dynamic Contact Shadow on Ground/Platform */
    g.fillStyle='rgba(0,0,0,0.28)';
    g.beginPath();
    g.ellipse(p.x+p.w/2, p.y+p.h+1, p.w*0.42*(p.sx||1), 4.5*(p.sy||1), 0, 0, TAU);
    g.fill();
    
    /* Draw Ghost Afterimage Trails */
    for(let tr of p.trail){
      if(tr.alpha>0.02){
        g.save();
        g.globalAlpha=tr.alpha*0.38;
        drawChar(g,tr.x,tr.y,p.w,col,{face:'run',sx:1,sy:1,grounded:false,moving:true});
        g.restore();
      }
    }
    
    if(isIt){
      /* Pulsing fiery red-gold aura */
      const auraP=0.22+0.14*Math.sin(tGlobal*8);
      g.fillStyle='rgba(235, 60, 40, '+auraP.toFixed(2)+')';
      rr(g,p.x-8,p.y-8,p.w+16,p.h+16,14);g.fill();
      g.strokeStyle='rgba(255, 200, 40, 0.55)';
      g.lineWidth=2.5;
      rr(g,p.x-4,p.y-4,p.w+8,p.h+8,11);g.stroke();
    }
    drawChar(g,p.x,p.y,p.w,col,{
      face:faceFor(p),sx:p.sx,sy:p.sy,tilt:clamp(p.vx*0.00025,-0.1,0.1),
      lookX:clamp(p.vx/300,-1,1)*0.7+p.face*0.3,lookY:!p.grounded?(p.vy<0?-0.8:0.8):0,
      fdir:p.face,blink:p.blink>0,shake:p.tagT>0.45?4:0,
      moving:Math.abs(p.vx)>60,grounded:p.grounded,seed:p.seed
    });
    ptxt('P'+(i+1),p.x+p.w/2,p.y-12,FN(12,900),col);
    if(match.state==='playing'&&match.cooldown>0){
      g.save();
      g.globalAlpha=0.3+0.2*Math.sin(tGlobal*8);
      g.strokeStyle='#ffffff';g.lineWidth=3;
      g.beginPath();g.arc(p.x+p.w/2,p.y+p.h/2,p.w*0.85,0,TAU);g.stroke();
      g.restore();
    }
  }
  if(match.state!=='result')drawITArrow(P[match.it]);
}

function drawTagPop(){
  if(!match.tagPop)return;
  const tp=match.tagPop,k=1-clamp(tp.t/0.55,0,1);
  g.save();
  g.translate(tp.x,tp.y);
  g.globalAlpha=1-k;
  g.rotate(k*0.5);
  const R=40+k*170;
  g.fillStyle='#ffcf3f';
  g.beginPath();
  for(let i=0;i<16;i++){
    const a=TAU*i/16,rad=i%2===0?R:R*0.55;
    g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
  }
  g.closePath();g.fill();
  g.lineWidth=5;g.strokeStyle=INK;g.stroke();
  g.rotate(-k*0.5);
  const sc=0.6+easeOut(Math.min(1,k*3))*0.5;
  g.scale(sc,sc);
  g.font=FT(46);g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  g.strokeStyle=INK;g.lineWidth=8;g.strokeText('TAG!',0,0);
  g.fillStyle='#ffffff';g.fillText('TAG!',0,0);
  g.restore();
}

/* ================= HUD / pause / result ================= */
function tri(x,y,r,dir){
  g.beginPath();
  if(dir===0){g.moveTo(x+r*0.45,y-r*0.55);g.lineTo(x+r*0.45,y+r*0.55);g.lineTo(x-r*0.55,y);}
  else if(dir===1){g.moveTo(x-r*0.45,y-r*0.55);g.lineTo(x-r*0.45,y+r*0.55);g.lineTo(x+r*0.55,y);}
  else if(dir===2){g.moveTo(x-r*0.55,y+r*0.45);g.lineTo(x+r*0.55,y+r*0.45);g.lineTo(x,y-r*0.55);}
  else{g.moveTo(x-r*0.55,y-r*0.45);g.lineTo(x+r*0.55,y-r*0.45);g.lineTo(x,y+r*0.55);}
  g.closePath();
}
function drawPadBtn(cx,cy,r,dir,o){
  const active=o.hold?keys.has(o.hold):(tGlobal-(glow[o.pk]||-9))<0.15;
  g.beginPath();g.arc(cx,cy,r,0,TAU);
  g.fillStyle=active?'rgba(255,255,255,0.65)':'rgba(0,0,0,0.22)';
  g.fill();
  g.lineWidth=2.5;g.strokeStyle='rgba(255,255,255,0.6)';g.stroke();
  tri(cx,cy,r*0.55,dir);
  g.fillStyle=active?'#143c26':'#ffffff';
  g.fill();
  zone(cx-r-14,cy-r-14,r*2+28,r*2+28,o);
}

  drawPadBtn(xD,y0,r,2,{press:['KeyW'],pk:'KeyW'});
  const xL2=CW-m-2*(bw+gap)-r,xD2=CW-m-bw-gap-r,xR2=CW-m-r;
  drawPadBtn(xL2,y1,r,0,{hold:'ArrowLeft',pk:'ArrowLeft'});
  drawPadBtn(xD2,y1,r,3,{hold:'ArrowDown',pk:'ArrowDown'});
  drawPadBtn(xR2,y1,r,1,{hold:'ArrowRight',pk:'ArrowRight'});
  drawPadBtn(xD2,y0,r,2,{press:['ArrowUp'],pk:'ArrowUp'});
}

function drawHUD(){
  const urgent=match.timer<=10&&match.state==='playing';
  const tw=Math.min(150,CW*0.28),th=40;
  rr(g,CW/2-tw/2,8,tw,th,10);
  g.fillStyle=urgent?'rgba(190, 24, 24, 0.92)':'rgba(20, 28, 42, 0.92)';
  g.fill();
  g.lineWidth=2.5;g.strokeStyle=urgent?'#ef4444':INK;g.stroke();
  ptxt(fmtTime(match.timer),CW/2,8+th/2+1,FT(Math.min(22,th*0.54)),urgent?'#fff0f0':'#ffffff');
  
  const P=match.players;
  for(let i=0;i<P.length;i++){
    const isIt=match.it===i&&match.state!=='result';
    const y=10+i*30;
    g.save();g.globalAlpha=isIt?1:0.75;
    pill(10,y,isIt?120:86,26,isIt?'rgba(255,210,63,0.92)':'rgba(0,0,0,0.3)',isIt?INK:'rgba(0,0,0,0.5)');
    g.fillStyle=PALETTE[P[i].colIdx].c;
    rr(g,14,y+3,20,20,4);g.fill();g.lineWidth=2;g.strokeStyle=INK;g.stroke();
    txt('P'+(i+1)+(isIt?' IT':''),40,y+14,FN(11,900),isIt?'#3a2c00':'#ffffff','left');
    g.restore();
  }
  
  /* In-game control bar: Pause, Sound, Fullscreen, Next Map */
  const btnSize=38;
  const xPause=CW-btnSize-12;
  const xMute=xPause-btnSize-8;
  const xFull=xMute-btnSize-8;
  const xNext=xFull-btnSize-8;
  
  // Pause button
  rr(g,xPause,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.fillStyle='#1e293b';
  g.fillRect(xPause+12,10+10,4,18);
  g.fillRect(xPause+22,10+10,4,18);
  zone(xPause,10,btnSize,btnSize,{fn:togglePause});
  
  // Audio Mute/Unmute button
  rr(g,xMute,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.fillStyle='#1e293b';
  g.beginPath();
  g.moveTo(xMute+10, 10+btnSize/2-4);
  g.lineTo(xMute+14, 10+btnSize/2-4);
  g.lineTo(xMute+20, 10+btnSize/2-10);
  g.lineTo(xMute+20, 10+btnSize/2+10);
  g.lineTo(xMute+14, 10+btnSize/2+4);
  g.lineTo(xMute+10, 10+btnSize/2+4);
  g.closePath();
  g.fill();
  if(!muted){
    // sound wave arc
    g.strokeStyle='#1e293b'; g.lineWidth=2.2;
    g.beginPath(); g.arc(xMute+19, 10+btnSize/2, 6, -0.6, 0.6); g.stroke();
  }else{
    // red mute strike
    g.strokeStyle='#ef4444'; g.lineWidth=3;
    g.beginPath(); g.moveTo(xMute+8, 10+8); g.lineTo(xMute+btnSize-8, 10+btnSize-8); g.stroke();
  }
  zone(xMute,10,btnSize,btnSize,{fn:toggleSound});
  
  // Fullscreen button
  rr(g,xFull,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  g.strokeStyle='#1e293b'; g.lineWidth=2.5;
  const isFull=!!(document.fullscreenElement||document.webkitFullscreenElement);
  if(!isFull){
    const m=10;
    g.beginPath(); g.moveTo(xFull+m, 10+m+5); g.lineTo(xFull+m, 10+m); g.lineTo(xFull+m+5, 10+m); g.stroke();
    g.beginPath(); g.moveTo(xFull+btnSize-m-5, 10+m); g.lineTo(xFull+btnSize-m, 10+m); g.lineTo(xFull+btnSize-m, 10+m+5); g.stroke();
    g.beginPath(); g.moveTo(xFull+m, 10+btnSize-m-5); g.lineTo(xFull+m, 10+btnSize-m); g.lineTo(xFull+m+5, 10+btnSize-m); g.stroke();
    g.beginPath(); g.moveTo(xFull+btnSize-m-5, 10+btnSize-m); g.lineTo(xFull+btnSize-m, 10+btnSize-m); g.lineTo(xFull+btnSize-m, 10+btnSize-m-5); g.stroke();
  }else{
    const m=11;
    g.strokeRect(xFull+m, 10+m, btnSize-2*m, btnSize-2*m);
  }
  zone(xFull,10,btnSize,btnSize,{fn:toggleFullscreen});
  
  // Next map quick button
  rr(g,xNext,10,btnSize,btnSize,9);
  g.fillStyle='rgba(255,255,255,0.92)';g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
  ptxt('▶',xNext+btnSize/2+1,10+btnSize/2+1,FT(14),'#1c6b38');
  zone(xNext,10,btnSize,btnSize,{fn:()=>selectMapQuick(settings.map+1)});
  
  if(match.state==='countdown')drawBigCount(match.cd,'GET READY!');
  if(match.goFlash>0&&match.state==='playing'){
    const a=clamp(match.goFlash/0.8,0,1);
    const sc2=1+(1-a)*0.6;
    g.save();g.translate(CW/2,CH*0.4);g.scale(sc2,sc2);g.globalAlpha=a;
    g.font=FT(Math.min(90,CW*0.16));g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    g.strokeStyle=INK;g.lineWidth=10;g.strokeText('GO!',0,0);
    g.fillStyle='#8ef0b0';g.fillText('GO!',0,0);
    g.restore();
  }
  
  /* On-screen map and theme toast notification */
  if(match.mapToastT>0&&match.mapToast){
    const a=clamp(match.mapToastT,0,1);
    g.save();g.globalAlpha=a;
    ptxt(match.mapToast,CW/2,64,FN(Math.min(18,CW*0.032),900),'#ffea88');
    g.restore();
  }
  
  if(match.hintT>0&&match.state!=='result'&&!isTouch){
    const a=clamp(match.hintT,0,1);
    ptxt('HOLD S / ↓ ON PINK TO DROP   •   WALL-JUMP ON WALLS   •   N = NEXT MAP   •   M = MUTE   •   F = FULLSCREEN',CW/2,CH-20,FN(12,800),'rgba(255,255,255,'+(a*0.75).toFixed(2)+')');
  }
  if(isTouch&&CH>CW&&match.state!=='result'){
    ptxt('ROTATE FOR WIDE VIEW',CW/2,54,FN(12,900),'rgba(255,255,255,0.9)');
  }
}

function drawBigCount(num,label){
  const ph=clamp(match?match.cdT/0.72:0,0,1);
  const sc=1.35-0.35*easeOut(Math.min(1,ph*3));
  g.save();
  g.translate(CW/2,CH*0.4);
  g.scale(sc,sc);
  ptxt(String(num),0,0,FT(Math.min(100,CW*0.18)),'#ffffff');
  g.restore();
  ptxt(label,CW/2,CH*0.4-Math.min(100,CW*0.14),FN(Math.min(18,CW*0.036),900),'#ffffff');
}

function drawPause(){
  g.fillStyle='rgba(10,16,24,0.78)';g.fillRect(0,0,CW,CH);
  const pw=Math.min(460,CW-30),ph=360;
  const px=CW/2-pw/2,py=CH/2-ph/2;
  rr(g,px,py,pw,ph,20);
  g.fillStyle='rgba(20,28,42,0.96)';g.fill();g.lineWidth=4;g.strokeStyle=INK;g.stroke();
  ptxt('PAUSED',CW/2,py+36,FT(30),'#ffffff');
  ptxt('MAP '+(settings.map+1)+': '+MAPS[settings.map].name,CW/2,py+66,FN(14,800),'#a0c0e8');
  const opts=['RESUME','RESTART','NEXT MAP','SOUND: '+(muted?'OFF':'ON'),'FULLSCREEN','QUIT TO MENU'];
  for(let i=0;i<6;i++){
    const y=py+98+i*42;
    const sel=match.pauseSel===i;
    if(sel){pill(CW/2-150,y-17,300,34,'rgba(255,255,255,0.18)','#ffffff');}
    ptxt(opts[i],CW/2,y,FN(sel?17:15,900),sel?'#ffffff':'#bcd0e8');
    zone(CW/2-150,y-17,300,34,{fn:()=>{
      if(i===0)togglePause();
      else if(i===1){sfx('go');startMatch();}
      else if(i===2){selectMapQuick(settings.map+1);}
      else if(i===3){toggleSound();}
      else if(i===4){toggleFullscreen();}
      else quitToMenu();
    }});
  }
}

function drawResult(){
  g.fillStyle='rgba(10,16,24,0.72)';g.fillRect(0,0,CW,CH);
  zone(0,0,CW,CH,{fn:()=>{sfx('go');startMatch();}});
  const t=match.resultT;
  if(t<0.9){
    const sc=1.4-0.4*easeOut(Math.min(1,t*4));
    g.save();g.translate(CW/2,CH*0.26);g.scale(sc,sc);
    ptxt("TIME'S UP!",0,0,FT(Math.min(80,CW*0.12)),'#ffcf3f');
    g.restore();
  }
  const ap=easeBack(clamp((t-0.35)*2.2,0,1));
  if(ap<=0)return;
  const P=match.players,loser=match.result.loser;
  const winners=P.map((p,i)=>i).filter(i=>i!==loser);
  const pw=Math.min(740,CW-30),ph=Math.min(440,CH-40);
  const px=CW/2-pw/2,py=CH/2-ph/2;
  g.save();
  g.translate(CW/2,CH/2);g.scale(ap,ap);g.translate(-CW/2,-CH/2);
  rr(g,px,py,pw,ph,20);
  g.fillStyle='rgba(20,28,42,0.96)';g.fill();g.lineWidth=4;g.strokeStyle=INK;g.stroke();
  const wcol=PALETTE[P[winners[0]].colIdx].c;
  ptxt(winners.length===1?('PLAYER '+(winners[0]+1)+' WINS!'):(winners.map(w=>'P'+(w+1)).join(' + ')+' WIN!'),CW/2,py+ph*0.12,FT(Math.min(38,CW*0.055)),wcol);
  ptxt('PLAYER '+(loser+1)+' WAS IT - LOSES!   (MAP '+(settings.map+1)+': '+MAPS[settings.map].name+')',CW/2,py+ph*0.24,FN(Math.min(14,CW*0.028),800),'#ffffff');
  const psz=Math.min(60,ph*0.17);
  drawChar(g,CW/2-psz*2.4,py+ph*0.45-Math.abs(Math.sin(tGlobal*5))*10,psz,PALETTE[P[winners[0]].colIdx].c,{face:'happy',fdir:1,grounded:true,seed:2});
  drawChar(g,CW/2+psz*1.4,py+ph*0.48,psz,PALETTE[P[loser].colIdx].c,{face:'sad',fdir:-1,tilt:-0.06,grounded:true,seed:5});
  txt('TAGS - '+P.map((p,i)=>'P'+(i+1)+': '+match.tags[i]).join('  •  '),CW/2,py+ph*0.66,FN(13,900),'#cfe9d6');
  const b3=Math.min(180,(pw-60)/3);
  const sx0=CW/2-(b3*3+28)/2;
  simpleButton(sx0,py+ph*0.77,b3,44,'NEXT MAP',()=>{sfx('ui');selectMapQuick(settings.map+1);});
  simpleButton(sx0+b3+14,py+ph*0.77,b3,44,'PLAY AGAIN',()=>{sfx('go');startMatch();});
  simpleButton(sx0+2*(b3+14),py+ph*0.77,b3,44,'MENU',()=>quitToMenu());
  g.restore();
}

function drawGame(){
  g.save();
  g.translate(CW/2,CH/2);g.scale(cam.s,cam.s);g.translate(-cam.x,-cam.y);
  drawNightWorld();
  g.restore();
  const shx=(Math.random()-0.5)*match.shake,shy=(Math.random()-0.5)*match.shake;
  g.save();
  g.translate(CW/2,CH/2);
  g.scale(cam.s,cam.s);
  g.translate(-cam.x+shx,-cam.y+shy);
  drawWorld();
  drawParts();
  drawPlayers();
  drawTagPop();
  g.restore();
  if(match.flash>0){
    g.fillStyle='rgba(255,255,255,'+(match.flash*1.4).toFixed(3)+')';
    g.fillRect(0,0,CW,CH);
  }
  if(match.fade>0){
    g.fillStyle='rgba(255,255,255,'+(match.fade*1.2).toFixed(3)+')';
    g.fillRect(0,0,CW,CH);
  }
  drawHUD();
  if(match.state==='paused')drawPause();
  else if(match.state==='result')drawResult();
  else if(isTouch&&match.players.length===2)drawTouchButtons();
}

/* ================= main loop ================= */
function render(){
  zones.length=0;
  g.setTransform(DPR,0,0,DPR,0,0);
  if(screen==='menu')drawMenu();
  else if(match)drawGame();
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(now-last)/1000);
  last=now;tGlobal+=dt;
  try{
    update(dt);
    render();
  }catch(err){}
  pressed.clear();
}
syncCustomMaps();
/* Editor launch: tag_map_editor.html "Full Game" stores the map you're viewing
   plus default 2P settings; the game jumps straight into that match. */
try{
  const raw=localStorage.getItem('tag_arena_launch_v1');
  if(raw){
    localStorage.removeItem('tag_arena_launch_v1');
    const L=JSON.parse(raw);
    if(Number.isInteger(L.map)&&L.map>=0&&L.map<MAPS.length)settings.map=L.map;
    settings.doubleJump=L.doubleJump!==false;
    settings.collision=!!L.collision;
    if(L.slots&&L.slots.length>=2)menu.slotColor=L.slots.slice(0,4);
    menu.mode='rows';
    startMatch();
  }
}catch(e){/* normal menu boot */}
buildLevel();
requestAnimationFrame(frame);
</script>
</body>
</html>
