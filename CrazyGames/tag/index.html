<style>
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#0b0f16;font-family:'Outfit','Rubik',system-ui,sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;display:block;outline:none;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:none;-webkit-touch-callout:none}
/* ---- netplay join modal (optional, only when manual code entry is clicked) ---- */
#netUI{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,8,13,0.85);backdrop-filter:blur(4px);font-family:'Outfit','Rubik',system-ui,sans-serif}
#netUI.on{display:flex}
#netCard{background:#141b28;border:2px solid #2a3550;border-radius:16px;padding:24px 28px;max-width:min(400px,92vw);width:100%;text-align:center;color:#eef3fa;box-shadow:0 16px 60px rgba(0,0,0,0.7)}
#netCard h2{margin:0 0 6px;font-size:22px;letter-spacing:1px}
#netCard h2 span{color:#2ecc71}
#netCard p{margin:6px 0 14px;font-size:14px;color:#9fb0c9;line-height:1.5}
#netCard .row{display:flex;gap:10px;margin-top:14px}
#netCard button{flex:1;background:#1a2334;color:#eef3fa;border:1px solid #2a3550;border-radius:8px;padding:11px 10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.15s}
#netCard button:hover{background:#232f47}
#netCard button.go{background:#27ae60;border-color:#2ecc71}
#netCard button.go:hover{background:#2ecc71}
#netCard input{width:100%;box-sizing:border-box;background:#0e1420;color:#eef3fa;border:1px solid #2a3550;border-radius:8px;padding:12px;font-size:17px;text-align:center;letter-spacing:3px;text-transform:uppercase;font-family:Consolas,monospace}
#netCard input:focus{outline:none;border-color:#2ecc71}
#netToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:rgba(10,14,22,0.95);border:2px solid #2ecc71;color:#ffffff;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;display:none;pointer-events:none;font-family:'Outfit',system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,0.6)}

/* In-game text chat overlay */
#chatUI{position:fixed;left:16px;bottom:16px;z-index:45;width:min(340px,85vw);display:none;flex-direction:column;pointer-events:none;font-family:'Outfit','Rubik',system-ui,sans-serif}
#chatUI.online{display:flex}
#chatUI.active{pointer-events:auto}
#chatLogs{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:6px;scrollbar-width:none}
#chatLogs::-webkit-scrollbar{display:none}
.chatMsg{background:none!important;border:none!important;backdrop-filter:none!important;padding:1px 0;font-size:13px;color:#ffffff;line-height:1.35;word-break:break-word;display:inline-block;max-width:100%;box-sizing:border-box;animation:chatFade 0.2s ease-out;text-shadow:0 1px 3px rgba(0,0,0,0.95), 0 0 2px #000000, 0 2px 4px #000000}
.chatMsg .author{font-weight:900;margin-right:6px}
.chatMsg.sys{color:#facc15;font-weight:800}
#chatCornerBar{display:inline-flex;align-items:center;padding:5px 12px;background:rgba(15,23,42,0.65);border:1px solid rgba(255,255,255,0.22);border-radius:14px;color:#cbd5e1;font-size:11.5px;font-weight:700;cursor:pointer;pointer-events:auto;backdrop-filter:blur(4px);width:fit-content;transition:all 0.15s;margin-top:2px;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
#chatCornerBar:hover{background:rgba(15,23,42,0.92);color:#38bdf8;border-color:#38bdf8}
#chatUI.active #chatCornerBar{display:none}
#chatInputRow{display:none;gap:6px;pointer-events:auto}
#chatUI.active #chatInputRow{display:flex}
#chatInput{flex:1;background:rgba(15,23,42,0.92);border:1.5px solid #2ecc71;color:#ffffff;border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
#chatSendBtn{background:#27ae60;color:#ffffff;border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
@media (pointer: coarse) {
  #chatCornerBar{display:none!important}
  #chatUI{left:10px;bottom:10px;width:min(280px,75vw)}
  #chatLogs{max-height:105px}
  .chatMsg{font-size:11.5px}
  #chatInput{padding:6px 10px;font-size:12px}
  #chatSendBtn{padding:6px 10px;font-size:11.5px}
}
@keyframes chatFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>

<body>
<canvas id="g"></canvas>
<!-- Netplay join modal (only shown when clicking 'JOIN ROOM' manually) -->
<div id="netUI"><div id="netCard">
  <h2>JOIN <span>ONLINE ROOM</span></h2>
  <p id="netDesc">Enter 6-letter room code or paste invite link:</p>
  <input id="netCode" maxlength="64" placeholder="ROOM CODE / LINK"/>
  <div class="row">
    <button id="netJoinGo" class="go">Join</button>
    <button id="netClose">Cancel</button>
  </div>
</div></div>
<!-- In-game Text Chat Overlay -->
<div id="chatUI">
  <div id="chatLogs"></div>
  <div id="chatCornerBar" onclick="if(typeof chatToggle==='function')chatToggle();">
    <span>💬 Type here... (Enter)</span>
  </div>
  <div id="chatInputRow">
    <input id="chatInput" maxlength="120" placeholder="Type a message (Enter)..."/>
    <button id="chatSendBtn">Send</button>
  </div>
</div>
<div id="netToast"></div>
<!-- SDK Banners: rendered DOM containers so CrazyGames can inject without painting over the canvas -->
<div id="cg-banners" style="position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:10;display:none;pointer-events:none">
  <div id="cg-banner-top" style="min-height:50px;min-width:320px;pointer-events:auto"></div>
</div>
<div id="cg-banner-resp" style="position:fixed;bottom:0;left:0;right:0;z-index:10;display:none;pointer-events:none;justify-content:center;padding:4px 0;background:rgba(10,10,16,0.92);border-top:1px solid #2a2c3d">
  <div id="cg-banner-responsive" style="min-height:50px;min-width:320px;max-width:728px;width:100%;pointer-events:auto"></div>
</div>
<script>
"use strict";
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);if(r<0)r=0;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
const FT=px=>'900 '+px+'px "'+FAMILIES[fontIdx]+'",system-ui,sans-serif';
const FN=(px,w)=>(w||800)+' '+px+'px "'+FAMILIES[fontIdx]+'",system-ui,sans-serif';
const FAMILIES=['Outfit','Bebas Neue','Anton','Bangers','Black Han Sans','Luckiest Guy','Righteous','Fredoka One','Baloo 2','Nunito','Poppins','Montserrat','Titan One','Chewy','MuseoModerno','Comfortaa','Space Grotesk','Orbitron','Russo One','Staatliches'];
const PINNED_FONTIdx=8; // font #9 = Baloo 2 — pinned for CrazyGames
let fontIdx=PINNED_FONTIdx;
function cycleFont(d){ toast('Fonts locked to pinned pick #' + (PINNED_FONTIdx+1) + ' — ' + FAMILIES[PINNED_FONTIdx]); }
const INK='#141414';

const cv=document.getElementById('g'),g=cv.getContext('2d');
let CW=0,CH=0,DPR=1;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

function resize(){
  const rect = cv.getBoundingClientRect();
  const vW = (window.visualViewport && window.visualViewport.width) ? window.visualViewport.width : window.innerWidth;
  const vH = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  CW = Math.floor(Math.min(rect.width || vW, vW));
  CH = Math.floor(Math.min(rect.height || vH, vH));
  const maxDpr = 1.25;
  DPR = Math.min(maxDpr, window.devicePixelRatio || 1);
  cv.width = Math.floor(CW * DPR);
  cv.height = Math.floor(CH * DPR);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 140));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
}
resize();
cv.style.touchAction='none';

function getCanvasCoords(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  const scaleX = rect.width ? (CW / rect.width) : 1;
  const scaleY = rect.height ? (CH / rect.height) : 1;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function grabFocus(){try{window.focus();}catch(e){}}
window.addEventListener('load',grabFocus);grabFocus();

/* ================= keyboard shield (laptop room code & chat typing fix) ================= */
function isInputActive(){
  const el = document.activeElement;
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
}

/* ================= input ================= */
const keys=new Set(),pressed=new Set();
const GAMEKEYS=new Set([
  'ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space',
  'KeyW','KeyA','KeyS','KeyD',
  'KeyI','KeyJ','KeyK','KeyL',
  'KeyT','KeyF','KeyG','KeyH',
  'Enter','NumpadEnter','KeyM','KeyP','KeyN','KeyB','Digit1','Digit2','Digit3','Digit4',
  'Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Tab'
]);
let scoreboardOpen=false;
function onKey(e){
  if(isInputActive()){
    // Shield all game controls while typing in room code or chat input!
    return;
  }
  if(e.code === 'Tab'){
    e.preventDefault();
    if(match && screen === 'game'){
      scoreboardOpen = !scoreboardOpen;
      sfx('ui');
    }
    return;
  }
  if(e.code === 'Enter' || e.code === 'NumpadEnter'){
    if(typeof NET !== 'undefined' && NET && NET.role !== null){
      if(typeof chatToggle === 'function'){
        e.preventDefault();
        chatToggle();
        return;
      }
    }
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(e.repeat)return;
  keys.add(e.code);pressed.add(e.code);initAudio();
}
window.addEventListener('keydown',onKey);
window.addEventListener('keyup',e=>{
  if(isInputActive()) return;
  keys.delete(e.code);
});
window.addEventListener('blur',()=>{keys.clear();touchPts.clear();});
window.addEventListener('contextmenu',e=>e.preventDefault());
const anyPressed=list=>{for(const k of list)if(pressed.has(k))return true;return false;};

/* ================= mobile touch action state ================= */
const TOUCH = {
  left: false,
  right: false,
  jumpEdge: false,
  jumpHeld: false,
  downHeld: false
};

/* ================= mobile touch joystick & dual slider system ================= */
const JOY = {
  // Left horizontal joystick (floating — spawns at touch position)
  leftId: null,
  leftStartX: 0,   // touch start anchor X
  leftStartY: 0,   // touch start anchor Y
  leftX: 0,        // -1 (left) to +1 (right), rests at 0 (center)
  leftVisX: 0,     // smooth interpolated visual knob position
  boundsL: null,   // { x, y, w, h, cx, cy, maxTravel, r }

  // Right vertical dual jump/drop slider (snaps to top)
  rightId: null,
  rightY: 0,       // 0 (top/rest) to 1 (pulled down)
  rightVisY: 0,    // smooth interpolated visual knob position
  rightStartY: 0,  // touch start Y to detect downward drag immediately
  boundsR: null    // { x, y, w, h, cx, cyTop, maxTravel, r }
};

/* ================= 2-player local mobile controls (Ergonomic Joysticks + Fixed Buttons) ================= */
const LOCAL_TOUCH = {
  showTutorial: false,
  p1: { joyId: null, startX: 0, startY: 0, curX: 0, curY: 0, active: false, offX: 0, visOffX: 0, left: false, right: false, jumpId: null, jumpHeld: false, jumpEdge: false, dropId: null, downHeld: false },
  p2: { joyId: null, startX: 0, startY: 0, curX: 0, curY: 0, active: false, offX: 0, visOffX: 0, left: false, right: false, jumpId: null, jumpHeld: false, jumpEdge: false, dropId: null, downHeld: false }
};
const GESTURE_SPLIT = LOCAL_TOUCH; // Backward compatibility alias

function calcLocalBounds(){
  const midX = CW / 2;
  const isTablet = (Math.min(CW, CH) >= 500);
  const r = isTablet ? clamp(CH * 0.065, 24, 32) : clamp(CH * 0.080, 22, 28);
  const bm = isTablet ? clamp(CH * 0.07, 24, 42) : clamp(CH * 0.06, 16, 26);
  const maxTravel = r * 1.45;
  const trackW = r * 3.4;
  const trackH = r * 2.0;

  // Corner positioning:
  // Player 1 (Bottom-Left Corner): Joystick at far left, Jump & Drop buttons shifted right by ~1 button diameter for comfortable thumb spacing
  const p1CornerPad = isTablet ? clamp(CW * 0.045, 24, 44) : clamp(CW * 0.040, 16, 28);
  const p1DefJoyX = p1CornerPad + trackW / 2;
  const p1DefJoyY = CH - bm - r * 1.05;
  const p1BtnX = p1DefJoyX + trackW / 2 + r * 3.30;
  const p1DropY = p1DefJoyY;
  const p1JumpY = p1DropY - r * 2.15;
  const p1SplitY = (p1JumpY + p1DropY) / 2;
  const p1BtnMinX = p1BtnX - r * 1.15;
  const p1BtnMaxX = p1BtnX + r * 1.45;
  const p1BtnMinY = p1JumpY - r * 1.35;
  const p1BtnMaxY = p1DropY + r * 1.35;

  // Player 2 (Bottom-Right Corner): Jump & Drop buttons at far right, Joystick shifted left towards center by the same gap
  const p2CornerPad = isTablet ? clamp(CW * 0.045, 24, 44) : clamp(CW * 0.040, 16, 28);
  const p2BtnX = CW - p2CornerPad - r * 1.15;
  const p2DefJoyX = p2BtnX - r * 3.30 - trackW / 2;
  const p2DefJoyY = CH - bm - r * 1.05;
  const p2DropY = p2DefJoyY;
  const p2JumpY = p2DropY - r * 2.15;
  const p2SplitY = (p2JumpY + p2DropY) / 2;
  const p2BtnMinX = p2BtnX - r * 1.15;
  const p2BtnMaxX = p2BtnX + r * 1.45;
  const p2BtnMinY = p2JumpY - r * 1.35;
  const p2BtnMaxY = p2DropY + r * 1.35;

  return {
    midX, r, bm, maxTravel, trackW, trackH,
    p1: { btnX: p1BtnX, jumpY: p1JumpY, dropY: p1DropY, splitY: p1SplitY, btnMinX: p1BtnMinX, btnMaxX: p1BtnMaxX, btnMinY: p1BtnMinY, btnMaxY: p1BtnMaxY, defJoyX: p1DefJoyX, defJoyY: p1DefJoyY },
    p2: { btnX: p2BtnX, jumpY: p2JumpY, dropY: p2DropY, splitY: p2SplitY, btnMinX: p2BtnMinX, btnMaxX: p2BtnMaxX, btnMinY: p2BtnMinY, btnMaxY: p2BtnMaxY, defJoyX: p2DefJoyX, defJoyY: p2DefJoyY }
  };
}

function applyTouchAction(action, isDown){
  if(action === 'left') TOUCH.left = !!isDown;
  else if(action === 'right') TOUCH.right = !!isDown;
  else if(action === 'jump'){
    if(isDown){ TOUCH.jumpEdge = true; TOUCH.jumpHeld = true; }
    else TOUCH.jumpHeld = false;
  } else if(action === 'down') TOUCH.downHeld = !!isDown;
}

/* ================= gamepads ================= */
const GP={prev:[{},{},{},{}],prevAx:[0,0,0,0],prevAy:[0,0,0,0]};
let PAD=[null,null,null,null];
function pollGamepads(){
  const rawPads=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<4;i++){
    const gd=rawPads[i];
    if(!gd||!gd.connected){PAD[i]=null;continue;}
    const b=n=>gd.buttons[n]&&(typeof gd.buttons[n]==='object'?gd.buttons[n].pressed:gd.buttons[n]>0.5);
    const pv=GP.prev[i]||{};
    const E=n=>b(n)&&!pv[n];
    const ax=gd.axes[0]||0,ay=gd.axes[1]||0;
    const pax=GP.prevAx[i]||0,pay=GP.prevAy[i]||0;
    const left=ax<-0.30||b(14),right=ax>0.30||b(15),up=ay<-0.50||b(12),down=ay>0.50||b(13);
    PAD[i]={
      left,right,up,down,
      leftE:(left&&!(pax<-0.30||pv[14]))||E(14),
      rightE:(right&&!(pax>0.30||pv[15]))||E(15),
      upE:(up&&!(pay<-0.50||pv[12]))||E(12),
      downE:(down&&!(pay>0.50||pv[13]))||E(13),
      jumpE:E(0),
      jumpHeld:!!b(0),
      confirmE:E(0)||E(2)||E(9),
      pauseE:E(9),
      dropHeld:b(1)||down,
      connected:true
    };
    const np={};for(let n=0;n<17;n++)np[n]=b(n);
    GP.prev[i]=np;
    GP.prevAx[i]=ax;
    GP.prevAy[i]=ay;
  }
}

/* ================= touch zones ================= */
const zones=[];const touchPts=new Map();const glow={};
function zone(x,y,w,h,o){
  zones.push({
    x:x,y:y,w:w,h:h,
    press:(o&&o.press)||null,
    hold:(o&&o.hold)||null,
    fn:(o&&o.fn)||null,
    upFn:(o&&o.upFn)||null,
    touchAction:(o&&o.touchAction)||null
  });
}
function zoneAt(x,y,holdOnly){
  for(let i=zones.length-1;i>=0;i--){const z=zones[i];
    if(holdOnly&&!z.hold&&!z.touchAction)continue;
    if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h)return z;}
  return null;
}
function inputDown(x,y,id){
  initAudio();grabFocus();
  
  // Tutorial Card dismiss for 2-Player Local Touch
  if(match && screen === 'game' && GESTURE_SPLIT.showTutorial){
    GESTURE_SPLIT.showTutorial = false;
    if(match.state === 'tutorial'){
      match.state = 'countdown';
      match.cd = 3;
      match.cdT = 0;
      sfx('count');
    }
    return;
  }

  const isOnline = (typeof NET !== 'undefined' && NET && NET.role !== null);
  const isPlaying = (match && (match.state === 'playing' || match.state === 'countdown'));
  const isSplitLocal = (!isOnline && match && screen === 'game' && isPlaying && match.players && match.players.length === 2 && isTouch && !menu.botOn && menu.tab !== 'solo');

  // Allow HUD top bar buttons (Pause, Mute, Help) to receive clicks
  if(y <= 55){
    const z = zoneAt(x,y,false);
    if(z){
      touchPts.set(id,z);
      if(z.hold){keys.add(z.hold);}
      if(z.press){for(const c of z.press){pressed.add(c);glow[c]=tGlobal;}}
      if(z.touchAction){applyTouchAction(z.touchAction,true);}
      if(z.fn)z.fn();
      return;
    }
  }

  // 2-Player Local Shared Screen Touch Controls (Fixed Jump/Drop + Floating Side-to-Side Joystick)
  if(isSplitLocal){
    const b = calcLocalBounds();

    if(x < b.midX){
      // --- Player 1 (Left Half) ---
      const p = LOCAL_TOUCH.p1;
      // Check if touch lands in P1's fixed button zone (right side of P1 cluster)
      if(x >= b.p1.btnMinX && x <= b.p1.btnMaxX && y >= b.p1.btnMinY && y <= b.p1.btnMaxY){
        if(y < b.p1.splitY){
          // P1 JUMP BUTTON
          p.jumpId = id;
          p.jumpEdge = true;
          p.jumpHeld = true;
          p.downHeld = false;
          const myP = match.players[0];
          if(myP) myP.jbuf = 0.16;
        } else {
          // P1 DROP BUTTON
          p.dropId = id;
          p.downHeld = true;
          p.jumpEdge = false;
          p.jumpHeld = false;
          const myP = match.players[0];
          if(myP && myP.jbuf > 0) myP.jbuf = 0;
        }
        return;
      }
      // Floating Side-to-Side Joystick anywhere else in P1 half!
      p.joyId = id;
      p.startX = x;
      p.startY = y;
      p.curX = x;
      p.curY = y;
      p.active = true;
      p.offX = 0;
      p.left = false;
      p.right = false;
      return;
    } else {
      // --- Player 2 (Right Half) ---
      const p = LOCAL_TOUCH.p2;

      const dx = x - p.startX;

      p.left = (p.offX < -0.22);
      p.right = (p.offX > 0.22);
      return;
    }
    // P2 Joystick
    if(LOCAL_TOUCH.p2.joyId === id){
      const p = LOCAL_TOUCH.p2;
      p.curX = x; p.curY = y;
      const dx = x - p.startX;
      p.offX = clamp(dx / b.maxTravel, -1, 1);
      p.left = (p.offX < -0.22);
      p.right = (p.offX > 0.22);

      return;
    }
    if(LOCAL_TOUCH.p1.dropId === id){
      LOCAL_TOUCH.p1.downHeld = (Math.hypot(x - b.p1.btnX, y - b.p1.dropY) < b.r * 3.0 || (x >= b.p1.btnMinX - 30 && y >= b.p1.splitY - 20));
      return;
    }
    if(LOCAL_TOUCH.p2.jumpId === id){
      LOCAL_TOUCH.p2.jumpHeld = (Math.hypot(x - b.p2.btnX, y - b.p2.jumpY) < b.r * 3.0 || (x >= b.p2.btnMinX - 30 && y < b.p2.splitY + 20));
      return;

    }

  }

function inputUp(id){

  if(LOCAL_TOUCH.p1.joyId === id){
    const p = LOCAL_TOUCH.p1;
    p.joyId = null;
    p.active = false;
    p.offX = 0;
    p.left = false;
    p.right = false;
  }
  if(LOCAL_TOUCH.p1.jumpId === id){
    LOCAL_TOUCH.p1.jumpId = null;
    LOCAL_TOUCH.p1.jumpHeld = false;
    LOCAL_TOUCH.p1.jumpEdge = false;
  }
  if(LOCAL_TOUCH.p1.dropId === id){
    LOCAL_TOUCH.p1.dropId = null;
    LOCAL_TOUCH.p1.downHeld = false;
  }
  // P2 Local Touch Reset
  if(LOCAL_TOUCH.p2.joyId === id){
    const p = LOCAL_TOUCH.p2;
    p.joyId = null;
    p.active = false;
    p.offX = 0;
    p.left = false;
    p.right = false;
  }
  if(LOCAL_TOUCH.p2.jumpId === id){
    LOCAL_TOUCH.p2.jumpId = null;
    LOCAL_TOUCH.p2.jumpHeld = false;
    LOCAL_TOUCH.p2.jumpEdge = false;
  }
  if(LOCAL_TOUCH.p2.dropId === id){
    LOCAL_TOUCH.p2.dropId = null;
    LOCAL_TOUCH.p2.downHeld = false;
  }

  if(JOY.leftId === id){
    JOY.leftId = null;
    JOY.leftX = 0; // Snaps back to center!
    TOUCH.left = false;
    TOUCH.right = false;
  }
  if(JOY.rightId === id){
    JOY.rightId = null;
    JOY.rightY = 0; // Snaps back to top!
    TOUCH.jumpHeld = false;
    TOUCH.downHeld = false;
    TOUCH.jumpEdge = false;
  }
  const z=touchPts.get(id);
  if(z){
    if(z.hold)keys.delete(z.hold);
    if(z.touchAction)applyTouchAction(z.touchAction,false);
    if(z.upFn)z.upFn();
  }
  touchPts.delete(id);
}

function beep(f0,f1,dur,type,vol,delay){
  if(!AC||!master)return;type=type||'square';vol=vol||0.16;delay=delay||0;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn);gn.connect(master);o.start(t0);o.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol,delay){
  if(!AC||!master)return;delay=delay||0;
  const t0=AC.currentTime+delay,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);

  const gn=AC.createGain();gn.gain.value=vol;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1100;

}

function cycleSlotCtrl(slot, d){
  if(!menu.slotCtrl) menu.slotCtrl = [0, 1, 2, 3];
  const total = LOCAL_CTRL_SCHEMES.length;
  let cur = menu.slotCtrl[slot] != null ? menu.slotCtrl[slot] : slot;
  
  // Find keyboard schemes already taken by other active players
  const taken = new Set();
  const act = (typeof activeSlots === 'function') ? activeSlots() : [0, 1];
  for(const other of act){
    if(other !== slot){
      const otherIdx = menu.slotCtrl[other];
      if(otherIdx != null){
        const s = LOCAL_CTRL_SCHEMES[((otherIdx % total) + total) % total];
        if(s && s.id !== 'controller'){
          taken.add(s.id);
        }
      }
    }
  }

  // Cycle to next available scheme, skipping taken keyboard schemes
  for(let step = 1; step <= total; step++){
    const nextIdx = ((cur + d * step) % total + total) % total;
    const candidate = LOCAL_CTRL_SCHEMES[nextIdx];
    if(!candidate) continue;
    if(!taken.has(candidate.id) || candidate.id === 'controller'){
      menu.slotCtrl[slot] = nextIdx;
      break;
    }
  }
  sfx('ui');
}

function harnessBuildCases(mapIdx){
  HARNESS.map = mapIdx;
  HARNESS.nodes = [];
  // 1. Extract valid platform surfaces (exclude floor wall and narrow vertical pillars)
  for(let i = 1; i < SOLIDS.length; i++){
    const s = SOLIDS[i];
    if(s.wall && s.y !== H - WALL) continue;
    if(s.w < 50 && s.h > s.w * 1.5) continue;
    HARNESS.nodes.push(s);
  }

  // 2. Identify symmetric pairs across arena midline (W = 2400)
  HARNESS.mirrorMap.clear();
  for(let i = 0; i < HARNESS.nodes.length; i++){
    const a = HARNESS.nodes[i];
    const aMid = a.x + a.w / 2;
    for(let j = 0; j < HARNESS.nodes.length; j++){
      const b = HARNESS.nodes[j];
      const bMid = b.x + b.w / 2;
      if(Math.abs(bMid - (W - aMid)) < 30 && Math.abs(b.y - a.y) < 16){
        HARNESS.mirrorMap.set(i, j);
        break;
      }
    }
  }

  // 3. Generate candidate pairs with STRICT SKILL PRUNING:
  // Removes all trivial downward drops, flat walk-overs, and baby hops
  const cases = [];
  const visitedCanonical = new Set();

  for(let i = 0; i < HARNESS.nodes.length; i++){
    const A = HARNESS.nodes[i];
    for(let j = 0; j < HARNESS.nodes.length; j++){
      if(i === j) continue;
      const B = HARNESS.nodes[j];
      const dy = B.y - A.y;
      const gap = Math.max(0, B.x - (A.x + A.w), A.x - (B.x + B.w));
      const dx = Math.abs((B.x + B.w / 2) - (A.x + A.w / 2));
      const maxRise = (A.t === 'boost') ? 690 : 510;

      // Filter 1: Reach limits
      if(dy < -maxRise || dx > 850) continue;

      // Filter 2: Prune ALL downward drops (dy > 40) - greedy bot/gravity handles drops easily
      if(dy > 40) continue;

      // Filter 3: Prune flat/near-flat step-overs and small hops (|dy| <= 40, gap < 180)
      if(Math.abs(dy) <= 40 && gap < 180) continue;

      // Filter 4: Prune low upward hops with small gap (-75 <= dy <= 0, gap < 140)
      if(dy <= 0 && dy >= -75 && gap < 140) continue;

      // Filter 5: Overly distant horizontal reach on normal platform without speed boost
      if(A.t !== 'speed' && A.t !== 'boost' && gap > 560) continue;

      // Filter 6: Prune bilateral symmetric duplicates
      const mI = HARNESS.mirrorMap.get(i), mJ = HARNESS.mirrorMap.get(j);
      if(mI !== undefined && mJ !== undefined){
        const canonicalKey = (mI < i || (mI === i && mJ < j)) ? (mI + '->' + mJ) : (i + '->' + j);
        if(visitedCanonical.has(canonicalKey)) continue;
        visitedCanonical.add(canonicalKey);
      }

      const parT = Math.max(2.8, 1.2 + dx / 380 + Math.abs(dy) / 280);
      cases.push({ from: i, to: j, dx, dy, gap, par: parT });
    }
  }
  HARNESS.cases = cases;
  HARNESS.ci = 0;
  HARNESS.stagedSample = null;
}

function harnessCurCase(){
  if(!HARNESS.cases.length) return null;
  return HARNESS.cases[HARNESS.ci % HARNESS.cases.length];
}

function harnessResetTrial(){
  const c = harnessCurCase();
  if(!c || !match || !match.players || !match.players.length) return;
  const A = HARNESS.nodes[c.from], B = HARNESS.nodes[c.to];
  const p0 = match.players[0];
  const curKey = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  const savedSample = HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][curKey];
  const activeSample = HARNESS.stagedSample || savedSample;

  if(HARNESS.mode === 'record'){
    // Player 0 spawns on Platform A
    p0.x = clamp(A.x + A.w / 2 - p0.w / 2, A.x + 8, A.x + A.w - p0.w - 8);
    p0.y = (A.dy ? A.y + (p0.x - A.x) * (A.dy / A.w) : A.y) - p0.h - 4;
    p0.vx = 0; p0.vy = 0; p0.airJumps = 1;
    p0.grounded = true; p0.gp = A;
  } else {
    // Playback mode: Player 0 stands on Target B, Bot (P1) spawns at exact recorded launch origin on Platform A
    p0.x = clamp(B.x + B.w / 2 - p0.w / 2, B.x + 8, B.x + B.w - p0.w - 8);
    p0.y = (B.dy ? B.y + (p0.x - B.x) * (B.dy / B.w) : B.y) - p0.h - 4;
    p0.vx = 0; p0.vy = 0; p0.grounded = true; p0.gp = B;

    if(match.players.length > 1){
      const p1 = match.players[1];
      const spawnX = activeSample ? activeSample.startX : clamp(A.x + A.w / 2 - p1.w / 2, A.x + 8, A.x + A.w - p1.w - 8);
      const spawnY = activeSample ? activeSample.startY : ((A.dy ? A.y + (spawnX - A.x) * (A.dy / A.w) : A.y) - p1.h - 4);
      p1.x = spawnX;
      p1.y = spawnY;
      p1.vx = activeSample ? (activeSample.startVx || 0) : 0;
      p1.vy = 0;
      p1.airJumps = 1;
      p1.grounded = true;
      p1.gp = A;
      p1._pbStepIdx = 0;
    }
  }

  HARNESS.t = 0;
  HARNESS.holdT = 0;
  HARNESS.started = false;
  HARNESS.trace = [];
  HARNESS.playbackT = 0;
  HARNESS.playbackStep = 0;
}

function harnessStart(mapIdx){

}

function harnessFeetOn(p, s){
  if(!p || !s) return false;
  const feet = p.y + p.h;
  const sTop = s.dy ? s.y + (clamp(p.x + p.w / 2, s.x, s.x + s.w) - s.x) * (s.dy / s.w) : s.y;
  const onX = (p.x + p.w > s.x + 4) && (p.x < s.x + s.w - 4);
  const onY = (feet >= sTop - 6) && (feet <= sTop + 24);
  return onX && onY && (p.grounded || Math.abs(p.vy) < 80);
}

function harnessStageRecordedSample(){
  const c = harnessCurCase();
  if(!c || !HARNESS.trace.length) return;
  const key = c.from + '->' + c.to;

  const launchStep = HARNESS.trace.find(s => s.je) || HARNESS.trace[0];
  const djStep = HARNESS.trace.find((s, idx) => idx > 0 && s.je);

  HARNESS.stagedSample = {
    key: key,
    from: c.from,
    to: c.to,
    map: HARNESS.map,
    time: +HARNESS.t.toFixed(2),
    startX: HARNESS.startX || HARNESS.trace[0].x,
    startY: HARNESS.startY || HARNESS.trace[0].y,
    startVx: HARNESS.startVx || HARNESS.trace[0].vx,
    launchX: launchStep ? launchStep.x : 0,
    hasDoubleJump: !!djStep,
    doubleJumpDelay: djStep ? +(djStep.t - (launchStep ? launchStep.t : 0)).toFixed(2) : 0,
    trace: HARNESS.trace.map(s => ({
      t: +s.t.toFixed(3),
      x: s.x, y: s.y,
      vx: s.vx, vy: s.vy,
      d: s.d, je: s.je, jh: s.jh, dn: s.dn
    }))
  };
}

function harnessCommitStagedSample(){
  const sample = HARNESS.stagedSample;
  if(!sample) return false;
  const mapKey = 'map' + HARNESS.map;
  if(!HARNESS.transitions[mapKey]) HARNESS.transitions[mapKey] = {};
  HARNESS.transitions[mapKey][sample.key] = sample;

  // Auto-mirror if bilateral symmetry exists
  const mFrom = HARNESS.mirrorMap.get(sample.from), mTo = HARNESS.mirrorMap.get(sample.to);
  if(mFrom !== undefined && mTo !== undefined){
    const mirrorKey = mFrom + '->' + mTo;
    const mirroredSample = {
      key: mirrorKey,
      from: mFrom,
      to: mTo,
      map: HARNESS.map,
      time: sample.time,
      startX: Math.round(W - sample.startX - 46),
      startY: sample.startY,
      startVx: -sample.startVx,
      launchX: Math.round(W - sample.launchX - 46),
      hasDoubleJump: sample.hasDoubleJump,
      doubleJumpDelay: sample.doubleJumpDelay,
      trace: sample.trace.map(s => ({
        t: s.t,
        x: Math.round(W - s.x - 46),
        y: s.y,
        vx: -s.vx,
        vy: s.vy,
        d: -s.d,
        je: s.je,
        jh: s.jh,
        dn: s.dn
      }))
    };
    HARNESS.transitions[mapKey][mirrorKey] = mirroredSample;
  }

  harnessSaveStored();
  HARNESS.stagedSample = null;
  HARNESS.done++;
  HARNESS.okN++;
  return true;
}

function harnessDiscardCurrent(andRetry){
  const c = harnessCurCase();
  if(!c) return;
  const key = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  let discardedSomething = false;

  if(HARNESS.stagedSample){
    HARNESS.stagedSample = null;
    discardedSomething = true;
  }

  if(HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key]){
    delete HARNESS.transitions[mapKey][key];
    const mFrom = HARNESS.mirrorMap.get(c.from), mTo = HARNESS.mirrorMap.get(c.to);
    if(mFrom !== undefined && mTo !== undefined){
      const mirrorKey = mFrom + '->' + mTo;
      if(HARNESS.transitions[mapKey][mirrorKey]) delete HARNESS.transitions[mapKey][mirrorKey];
    }
    harnessSaveStored();
    discardedSomething = true;
  }

  if(HARNESS.mode === 'playback' || andRetry){
    HARNESS.mode = 'record';
  }

  harnessResetTrial();
  sfx('back');

  if(andRetry){
    toast('🔄 REMOVED & RETRYING — Jump when ready!');
  } else if(discardedSomething){
    toast('🗑️ CASE DATA REMOVED (Back to Record Mode)');
  } else {
    toast('🔄 RESET (No saved data on this case)');
  }
}

function harnessTick(dt){
  if(!HARNESS.active || !match || screen !== 'game') return;
  match.timer = 9999; match.lastTick = 9999;
  if(match.state === 'paused') return;

  const pl = match.players[0];
  if(!pl) return;

  // Key controls:
  // E: Quick restart
  if(pressed.has('KeyE')){
    harnessResetTrial();
    sfx('back');
    toast('🔄 TRIAL RESTARTED (E)');
    return;
  }
  // T: Toggle bot test mode
  if(pressed.has('KeyT')){
    harnessToggleBotTest();
    return;
  }
  // K or Enter: Keep / Save
  if(pressed.has('KeyK') || pressed.has('Enter')){
    if(HARNESS.stagedSample){
      harnessCommitStagedSample();
      sfx('go');
      toast('✅ JUMP SAVED & APPROVED! Moving to next case...');
      HARNESS.ci = (HARNESS.ci + 1) % HARNESS.cases.length;
      HARNESS.mode = 'record';
      harnessResetTrial();
      return;
    } else {
      const c = harnessCurCase();
      const key = c ? (c.from + '->' + c.to) : '';
      const mapKey = 'map' + HARNESS.map;
      if(HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key]){
        toast('✅ Case already saved! Moving to next case...');
        HARNESS.ci = (HARNESS.ci + 1) % HARNESS.cases.length;
        HARNESS.mode = 'record';
        harnessResetTrial();
        return;
      } else {
        toast('⚠️ Complete a jump first before keeping!');
      }
    }
  }
  // R: Remove & Retry immediately in one button press
  if(pressed.has('KeyR')){
    harnessDiscardCurrent(true);
    return;
  }
  // D / Delete / Backspace: Discard / Remove
  if(pressed.has('KeyD') || pressed.has('Backspace') || pressed.has('Delete')){
    harnessDiscardCurrent(false);
    return;
  }
  // Browse cases: [ / P / ArrowLeft for Previous
  if(pressed.has('BracketLeft') || pressed.has('KeyP') || (HARNESS.mode === 'playback' && pressed.has('ArrowLeft'))){
    HARNESS.ci = (HARNESS.ci - 1 + HARNESS.cases.length) % HARNESS.cases.length;
    HARNESS.stagedSample = null;
    harnessResetTrial();
    toast('◀ PREVIOUS CASE (' + (HARNESS.ci + 1) + '/' + HARNESS.cases.length + ')');
    return;
  }
  // Browse cases: ] / N / ArrowRight for Next
  if(pressed.has('BracketRight') || pressed.has('KeyN') || (HARNESS.mode === 'playback' && pressed.has('ArrowRight'))){
    HARNESS.ci = (HARNESS.ci + 1) % HARNESS.cases.length;
    HARNESS.stagedSample = null;
    harnessResetTrial();
    toast('▶ NEXT CASE (' + (HARNESS.ci + 1) + '/' + HARNESS.cases.length + ')');
    return;
  }
  // Z: Save / Export
  if(pressed.has('KeyZ')){
    harnessExportJSON();
    return;
  }

  // Switch map with number keys 1-9, 0
  for(let k = 1; k <= 9; k++){
    if(pressed.has('Digit' + k)){
      harnessStart(k - 1);
      return;
    }
  }
  if(pressed.has('Digit0')){
    harnessStart(9);
    return;
  }

  const c = harnessCurCase();
  if(!c) return;
  const A = HARNESS.nodes[c.from], tgt = HARNESS.nodes[c.to];

  if(HARNESS.mode === 'record'){
    if(!HARNESS.started){
      if(keys.has('KeyA') || keys.has('KeyD') || keys.has('KeyW') || keys.has('Space') ||
         keys.has('ArrowLeft') || keys.has('ArrowRight') || keys.has('ArrowUp')){
        HARNESS.started = true;
        HARNESS.startX = Math.round(pl.x);
        HARNESS.startY = Math.round(pl.y);
        HARNESS.startVx = Math.round(pl.vx);
        HARNESS.t = 0;
      } else {
        return;
      }
    }

    HARNESS.t += dt;

    // Check invalid landing: touched arena floor or unintended platform before target
    if(pl.grounded && pl.gp && pl.gp !== A && pl.gp !== tgt){
      toast('❌ TOUCHED OTHER FLOOR — [E] TO RETRY');
      sfx('back');
      harnessResetTrial();
      return;
    }

    if(harnessFeetOn(pl, tgt)){
      HARNESS.holdT += dt;
      if(HARNESS.holdT >= 0.20 && !HARNESS.stagedSample){
        harnessStageRecordedSample();
        sfx('ok');
        toast('🎯 JUMP RECORDED! [T] Test Bot | [K] Keep & Save | [D] Discard');
      }
    } else {
      if(!HARNESS.stagedSample) HARNESS.holdT = 0;
    }

    if(HARNESS.t >= c.par && !HARNESS.stagedSample){
      toast('⏰ TIME OVER PAR (' + c.par.toFixed(1) + 's) — [E] TO RETRY');
      sfx('back');
      harnessResetTrial();
      return;
    }
  } else {
    // Playback mode:
    HARNESS.playbackT += dt;
    const botP = match.players[1];
    if(botP && harnessFeetOn(botP, tgt)){
      HARNESS.holdT += dt;
      if(HARNESS.holdT >= 0.4){
        sfx('go');
        toast('🎯 BOT REACHED YOU CLEANLY! [K] Keep & Save | [D] Discard | [E] Retry');
        HARNESS.holdT = 0;
      }
    }
  }
}

function harnessPushTrace(p, inp){
  if(!HARNESS.active || HARNESS.mode !== 'record' || !HARNESS.started || p.slot !== 0) return;
  if(HARNESS.stagedSample) return; // Stop recording once landed cleanly
  HARNESS.trace.push({
    t: +HARNESS.t.toFixed(3),
    x: Math.round(p.x),
    y: Math.round(p.y),
    vx: Math.round(p.vx),
    vy: Math.round(p.vy),
    d: inp.dir,
    je: inp.jumpEdge ? 1 : 0,
    jh: inp.jumpHeld ? 1 : 0,
    dn: inp.downHeld ? 1 : 0,
    g: p.grounded ? 1 : 0
  });
}

function harnessBotPlaybackInput(p, dt){
  const c = harnessCurCase();
  if(!c) return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
  const key = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  const sample = HARNESS.stagedSample || (HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key]);
  if(!sample || !sample.trace || !sample.trace.length){
    return { dir: 0, jumpEdge: false, jumpHeld: false, downHeld: false };
  }

  const curT = HARNESS.playbackT;
  if(!p._pbStepIdx) p._pbStepIdx = 0;

  let jumpEdge = false;
  let step = sample.trace[Math.min(p._pbStepIdx, sample.trace.length - 1)];

  // Scan all trace samples up to current playback time so jump edges are NEVER missed
  while(p._pbStepIdx < sample.trace.length && sample.trace[p._pbStepIdx].t <= curT){
    const s = sample.trace[p._pbStepIdx];
    if(s.je === 1) jumpEdge = true;
    step = s;
    p._pbStepIdx++;
  }

  // Trajectory stabilization: nudge ground velocity toward recorded velocity to eliminate frame rate drift
  if(p.grounded && Math.abs(p.x - step.x) > 3){
    p.vx += clamp((step.x - p.x) * 4, -50, 50);
  }

  return {
    dir: step.d,
    jumpEdge: jumpEdge,
    jumpHeld: !!step.jh,
    downHeld: !!step.dn
  };
}

function harnessOverlay(){
  if(!HARNESS.active || !match || screen !== 'game') return;
  const c = harnessCurCase();
  if(!c) return;
  const A = HARNESS.nodes[c.from], B = HARNESS.nodes[c.to];

  // Draw glowing box on target platform B
  const bx = (B.x + B.w / 2 - cam.x) * cam.s + CW / 2;
  const by = (B.y + (B.dy ? B.dy / 2 : B.h / 2) - cam.y) * cam.s + CH / 2;
  const bw = B.w * cam.s + 18, bh = 46 * cam.s + 18;
  const pulse = 0.6 + 0.4 * Math.sin(tGlobal * 6);

  g.save();
  g.globalAlpha = 0.4 + 0.4 * pulse;
  g.strokeStyle = '#2ecc71';
  g.lineWidth = 4;
  rr(g, bx - bw / 2, by - bh / 2, bw, bh, 10);
  g.stroke();
  g.restore();

  // Floating chevron above target
  ptxt('▼', bx, by - bh / 2 - 20 - Math.abs(Math.sin(tGlobal * 5)) * 10, FN(22, 900), '#2ecc71');

  // Case Status
  const key = c.from + '->' + c.to;
  const mapKey = 'map' + HARNESS.map;
  const isSaved = !!(HARNESS.transitions[mapKey] && HARNESS.transitions[mapKey][key]);
  const isStaged = !!HARNESS.stagedSample;

  const statusText = isStaged ? '🟡 RECORDED (Ready to Test/Save)' : (isSaved ? '✅ SAVED & APPROVED' : '⭕ UNRECORDED');
  const statusCol = isStaged ? '#f5d76e' : (isSaved ? '#2ecc71' : '#bdc3c7');

  const mapName = MAPS[HARNESS.map] ? MAPS[HARNESS.map].name : 'MAP ' + HARNESS.map;
  const modeTag = HARNESS.mode === 'playback' ? '🤖 BOT TEST MODE' : '🏃 RECORDING';

  ptxt(mapName + ' • CASE ' + (HARNESS.ci + 1) + '/' + HARNESS.cases.length + ' • ' + modeTag, CW / 2, 30, FT(20), '#ffffff');
  ptxt('STATUS: ' + statusText + '  |  Rise: ' + (-c.dy) + 'px  Gap: ' + c.gap + 'px', CW / 2, 54, FN(14, 800), statusCol);

  if(HARNESS.mode === 'record'){
    if(isStaged){
      ptxt('🎯 JUMP RECORDED! [T] Test Bot  |  [K] Keep & Save  |  [D] Remove  |  [R] Remove & Retry', CW / 2, 78, FN(15, 900), '#2ecc71');
    } else {
      const timeCol = HARNESS.t > c.par * 0.75 ? '#ff4757' : '#2ed573';
      ptxt(HARNESS.started ? HARNESS.t.toFixed(1) + 's / ' + c.par.toFixed(1) + 's par' : 'PRESS WASD / ARROWS TO START JUMP', CW / 2, 78, FN(15, 800), timeCol);
    }
  } else {
    ptxt('WATCHING BOT REPLAY! [K] Keep & Save  |  [D] Remove  |  [R] Remove & Retry  |  [E] Re-run Bot', CW / 2, 78, FN(15, 900), '#38ef7d');
  }

  // Bottom action bar
  ptxt('[T] TEST BOT   [K] KEEP & SAVE   [D] REMOVE   [R] REMOVE & RETRY   [E] RESTART   [←/→] BROWSE', CW / 2, CH - 22, FN(12, 800), 'rgba(255,255,255,0.92)');
}

/* ================= PHYSICS: RELIABLE PINK DROP/JUMP-THROUGH & AIRTIGHT SOLIDS ================= */
function hitRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hitRectInclusive(a,b){return a.x<=b.x+b.w&&a.x+a.w>=b.x&&a.y<=b.y+b.h&&a.y+a.h>=b.y;}

function zoneAtFeet(p,type){
  const feet=p.y+p.h;
  for(const s of SOLIDS){
    if(s.t!==type)continue;
    if(!s.dy){
      if(feet>=s.y-6&&feet<=s.y+18&&p.x+p.w>s.x&&p.x<s.x+s.w)return s;
    }else{
      const px=clamp(p.x+p.w/2,s.x,s.x+s.w);
      const sy=s.y+(px-s.x)*(s.dy/s.w);
      if(feet>=sy-8&&feet<=sy+20)return s;
    }
  }
  return null;
}
function botFullyOnDrop(p){
  if(p.grounded&&p.gp&&p.gp.t==='drop'){
    if(p.x+6>=p.gp.x&&p.x+p.w-6<=p.gp.x+p.gp.w)return p.gp;
  }
  const z=zoneAtFeet(p,'drop');
  if(z&&p.x+6>=z.x&&p.x+p.w-6<=z.x+z.w)return z;
  return null;
}

function landOn(p,gp,impact,wasG){
  p.grounded=true;p.gp=gp;p.lastGp=gp;p.airJumps=settings.doubleJump?1:0;p.wallJumps=0;
  // Subtle squash on landing — scaled down ~50% so it reads as weight, not a gag.
  if(!wasG){
    if(impact>430){p.sy=0.87;p.sx=1.13;p.landT=0.12;sfx('land');dust(p.x+p.w/2,p.y+p.h,8,90);}
    else if(impact>140){p.sy=0.93;p.sx=1.07;}
  }
}
/* ================= TRIAL BOT: P2 chase/flee + anti-stuck =================
   v1 rules: greedy X + jump only if no solid between, detour to platform
   edge when blocked above, bonk counter fallback. Pink drops are
   jump-through (ok to jump), solids are not. */
const BOT={st:{},think:0.09};
function botReset(){BOT.st={};}
function isBotSlot(p){
  try{
    if(typeof HARNESS !== 'undefined' && HARNESS.active){
      if(HARNESS.mode === 'playback') return p.slot === 1;
      return false;
    }
    if(typeof NET!=='undefined'&&NET&&NET.role!==null)return false;
    if(!menu.botOn)return false;
    if(!match||!match.players||match.players.length!==2)return false;
    if(activeSlots().length!==2)return false;
    return p.slot===1;
  }catch(e){return false;}
}
function botSolidBetween(ax,ay,bx,by,ignorePlat){
  // Distance-based sampling (max 22px step) so thin walls & pillars never tunnel through
  const dx=bx-ax, dy=by-ay;
  const dist=Math.hypot(dx,dy);
  const steps=Math.max(3, Math.ceil(dist/22));
  for(let i=1; i<steps; i++){
    const t=i/steps, px=ax+dx*t, py=ay+dy*t;
    const pt={x:px-3, y:py-3, w:6, h:6};
    for(const s of SOLIDS){
      if(s.t==='drop'||s===ignorePlat)continue;
      if(hitRect(pt,s))return s;
    }
  }
  return null;
}
function botGroundAhead(p,dir,dist){
  if(!dir)return true;
  const d=dist||(p.grounded&&(zoneAtFeet(p,'speed')||Math.abs(p.vx)>380)?125:80);
  const ax=p.x+p.w/2+dir*d,feet=p.y+p.h;
  for(const s of SOLIDS){
    if(ax>=s.x-12&&ax<=s.x+s.w+12&&feet>=s.y-42&&feet<=s.y+24)return true;
    if(s.dy){ // slope: check top at ax
      if(ax>=s.x-12&&ax<=s.x+s.w+12){
        const sy=s.y+(clamp(ax,s.x,s.x+s.w)-s.x)*(s.dy/s.w);
        if(feet>=sy-42&&feet<=sy+24)return true;
      }
    }
  }
  return false;
}
function botWallAhead(p,dir,dist){
  if(!dir)return null;
  const d=dist||44;
  const wx=dir>0?(p.x+p.w):(p.x-d);
  const probe={x:wx, y:p.y+6, w:d, h:p.h-12};
  for(const s of SOLIDS){
    if(s.t==='drop')continue;
    if(hitRect(probe,s))return s;
  }
  return null;
}
function botCeilAbove(p,dist){
  const d=dist||48;
  const probe={x:p.x+4, y:p.y-d, w:p.w-8, h:d};
  for(const s of SOLIDS){
    if(s.t==='drop'||s===p.gp)continue;
    if(hitRect(probe,s))return s;
  }
  return null;
}
function botGetActivePads(){
  const speeds=[], boosts=[];
  for(const s of SOLIDS){
    if(s.t==='speed') speeds.push(s);
    else if(s.t==='boost') boosts.push(s);
  }
  return { speeds, boosts };
}
function botFindSpeedPadMeta(p, target, dx, dy){
  const { speeds, boosts } = botGetActivePads();
  const cx = p.x + p.w / 2;
  const feet = p.y + p.h;
  const tx = target.x + target.w / 2;
  const ty = target.y + target.h / 2;
  const hunterDir = Math.sign(dx); // dx = tx - cx; >0 means hunter is to the right
  const distHunter = Math.hypot(dx, dy);

  let best = null;
  let bestScore = -1e9;

  // 1. Evaluate Speed Pads (1.55x sprint multiplier)
  for(const s of speeds){
    const slopeOffset = s.dy ? s.dy * 0.5 : 0;
    const padY = s.y + slopeOffset;
    const dyTier = Math.abs(feet - padY);
    const maxDy = (p.grounded ? 55 : 85) + Math.abs(s.dy || 0) * 0.5;
    if(dyTier > maxDy) continue;

    let distToPad = 0;
    let padDir = 0;
    let entryX = cx;

    if(cx < s.x){
      padDir = 1;
      entryX = s.x;
      distToPad = s.x - cx;
    }else if(cx > s.x + s.w){
      padDir = -1;
      entryX = s.x + s.w;
      distToPad = cx - (s.x + s.w);
    }else{
      // Already on the speed pad!
      distToPad = 0;
      padDir = (dx >= 0) ? -1 : 1;
      entryX = (padDir > 0) ? (s.x + s.w) : s.x;
    }

    if(distToPad > 350) continue;

    // Check if path to pad entry is blocked by solid barrier
    if(distToPad > 20 && botSolidBetween(cx, feet - 16, entryX, padY - 16, p.gp)){
      continue;
    }

    if(distToPad === 0){
      // On speed pad: sprint across it away from hunter!
      const score = 2000 - distHunter;
      if(score > bestScore){
        bestScore = score;
        best = { pad: s, dir: padDir, entryX: entryX, onPad: true, isBoost: false };
      }
      continue;
    }

    // Approaching pad entry:
    const awayFromHunter = (padDir !== hunterDir);
    let accessible = false;

    if(awayFromHunter){
