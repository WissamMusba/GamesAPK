# Keeps the free Render signaling server warm so joins are instant.
# Pings /health every 5 minutes. (GitHub pauses scheduled workflows after
# 60 days of repo inactivity; any push/commit re-enables it.)
name: keep-render-warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping signaling server health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://tag-netplay-server.onrender.com/health) && echo "attempt $i -> $code" && break
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
